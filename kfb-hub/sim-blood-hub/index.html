<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>SimBlood Hub</title>
<link rel="stylesheet" href="./styles.css?v=20260918b">
</head>
<body>
<main class="stage">
  <header class="topbar">
    <button class="brand" id="home" aria-label="Übersicht">SimBlood Hub</button>
    <nav class="filters" id="filters" aria-label="Zellgruppen"></nav>
  </header>
  <section class="grid" id="grid"></section>
</main>

<section class="detail" id="detail" hidden aria-live="polite">
  <header class="detail-top">
    <button class="back" id="back" aria-label="Zurück" data-tip="Zurück">←</button>
    <div>
      <h1 id="title"></h1>
      <span id="groupLabel"></span>
    </div>
    <button class="close" id="close" aria-label="Schließen" data-tip="Esc">×</button>
  </header>
  <div class="detail-body">
    <figure class="hero"><img id="hero" alt=""></figure>
    <div class="lanes" id="lanes"></div>
  </div>
</section>

<div class="hint" id="hint"></div>
<script src="./app.js?v=20260918b"></script>
</body>
</html>
