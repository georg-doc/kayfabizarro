        // Die invertierte Kachel ist AUCH in der Mitte dunkel (edge3-Mitte 194 → invertiert 61),
        // multipliziert zieht sie deshalb die ganze Flaeche herunter statt nur den Rand. Innen
        // wieder auf Weiss ziehen: dann traegt nur das aeussere Band die Fassung.
        bg.globalCompositeOperation = 'screen';
        const wg = bg.createRadialGradient(b.width / 2, b.height / 2, 0, b.width / 2, b.height / 2, b.width * 0.62);
        wg.addColorStop(0, '#ffffff'); wg.addColorStop(0.72, '#ffffff'); wg.addColorStop(1, '#000000');
        bg.fillStyle = wg; bg.fillRect(0, 0, b.width, b.height);
        this._bevelInv = b;
      }
      g.globalAlpha = 0.5; g.globalCompositeOperation = 'multiply';
      g.drawImage(this._bevelInv, 0, 0, S, S);
      g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
    }
    if (this.wearImg && this.wearImg.width) {
      g.globalAlpha = 0.14; g.globalCompositeOperation = 'multiply';
      g.drawImage(this.wearImg, 0, 0, S, S);
      g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
    }
    // KEIN Rahmen: die Wuerfelseiten liest man an Licht und Schatten, nicht an einer Linie.
    if (kind === 'art') {
      // PAPIER als Grund: die meisten Karten sind cremefarben, also wirkt die Flaeche wie ein
      // Blatt, das auf dem Wuerfel liegt — nicht wie ein Bild in einem farbigen Rahmen.
      g.fillStyle = '#efe6d0'; g.fillRect(0, 0, S, S);
      if (this.wearImg && this.wearImg.width) {
        g.globalAlpha = 0.22; g.globalCompositeOperation = 'multiply';
        g.drawImage(this.wearImg, 0, 0, S, S);
        g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
      }
      // EIGENE Kopie, nicht die Textur der Sky-Card: der CardBuilder wirft seine Blatt-Textur
      // weg, sobald das PDF-Artwork ankommt (dispose) — eine geteilte Referenz waere danach tot.
      // Ausserdem letterboxen: die Karte ist 16:9, die Wuerfelflaeche quadratisch.
      const src = this.card && this.card.mat && this.card.mat.map && this.card.mat.map.image;
      if (src && src.width) {
        const k = Math.min(S / src.width, S / src.height), dw = src.width * k, dh = src.height * k;
        g.imageSmoothingQuality = 'high';
        g.drawImage(src, (S - dw) / 2, (S - dh) / 2, dw, dh);
      }
      const t0 = new T.CanvasTexture(c);
      t0.colorSpace = T.SRGBColorSpace; t0.anisotropy = 4;
      return t0;
    }
    const label = (t) => { g.fillStyle = dark; g.font = '500 20px "IBM Plex Mono", monospace'; g.fillText(t, 34, 56); };
    const wrap = (txt, x, y, w, lh, size, col) => {
      g.fillStyle = col; g.font = size + 'px "Barlow Condensed", sans-serif';
      const words = String(txt || '').split(/\s+/); let line = '', yy = y;
      words.forEach((wd) => {
        const test = line ? line + ' ' + wd : wd;
        if (g.measureText(test).width > w) { g.fillText(line, x, yy); line = wd; yy += lh; } else line = test;
      });
      g.fillText(line, x, yy);
      return yy;
    };
    const name = (card && (card.t || card.name)) || 'Karte';
    const ink = 'rgb(' + q(pal[0][0] * 0.7) + ',' + q(pal[0][1] * 0.7) + ',' + q(pal[0][2] * 0.7) + ')';
    const paper = 'rgba(247,240,221,0.72)';
    if (kind === 'titel') {
      label('TITEL');
      wrap(name, 34, 130, S - 68, 46, '700 42', ink);
      g.fillStyle = dark; g.font = '500 20px "IBM Plex Mono", monospace';
      g.fillText('DECK ' + ((card && card.packId) || '—').toUpperCase(), 34, S - 60);
    } else if (kind === 'power') {
      label('POWER');
      wrap((card && card.p) || 'kein Power-Text', 34, 130, S - 68, 34, '600 28', ink);
    } else if (kind === 'lore') {
      label('LORE');
      wrap((card && card.l) || 'kein Lore-Text', 34, 130, S - 68, 30, '400 24', ink);
    } else if (kind === 'verwandt') {
      label('VERWANDT · TAGS');
      const tags = ['#protopia', '#agency', '#attention', '#fear', '#curiosity'];
      let y = 130;
      tags.forEach((t2, i) => {
        g.fillStyle = i < 2 ? paper : 'rgba(247,240,221,0.34)'; g.fillRect(34, y - 26, 240, 36);
        g.strokeStyle = ink; g.lineWidth = i < 2 ? 2 : 1; g.strokeRect(34, y - 26, 240, 36);
        g.fillStyle = ink; g.font = '600 22px "Barlow Condensed", sans-serif';
        g.fillText(t2, 46, y); y += 52;
      });
      g.lineWidth = 1;
      g.fillStyle = dark; g.font = '400 18px "IBM Plex Mono", monospace';
      g.fillText('Tag-Klick: eine Ebene nach innen', 34, S - 44);
    } else {
      label('CHAT');
      // Sprechblasen auf dem Papier, weicher Schatten, kein Kasten. Voice first: das Mikrofon
      // ist der Primaerknopf, Senden erscheint erst, wenn getippt wird (Icon-Tausch).
      const bubble = (txt, x, y, w, mine) => {
        const lines = [];
        g.font = '400 22px "Barlow Condensed", sans-serif';
        String(txt).split(/\s+/).forEach((wd) => {
          const last = lines[lines.length - 1];
          if (last && g.measureText(last + ' ' + wd).width < w - 34) lines[lines.length - 1] = last + ' ' + wd;
          else lines.push(wd);
        });
        const h = 22 + lines.length * 27;
        g.save();
        g.shadowColor = 'rgba(40,30,18,0.30)'; g.shadowBlur = 12; g.shadowOffsetY = 4;
        g.fillStyle = mine ? 'rgba(216,162,74,0.30)' : 'rgba(255,252,244,0.88)';
        const rr = 14;
        g.beginPath();
        g.moveTo(x + rr, y); g.arcTo(x + w, y, x + w, y + h, rr); g.arcTo(x + w, y + h, x, y + h, rr);
        g.arcTo(x, y + h, x, y, rr); g.arcTo(x, y, x + w, y, rr); g.closePath(); g.fill();
        g.restore();
        g.fillStyle = ink;
        lines.forEach((l, i) => g.fillText(l, x + 17, y + 34 + i * 27));
        return y + h + 14;
      };
      let y = 96;
      y = bubble('Frag mich zu dieser Karte — oder sag ein Stichwort, dann dreh ich den Würfel zur passenden Fläche.', 30, y, S - 130, false);
      y = bubble('Was macht Aufmerksamkeit hier stark?', 118, y, S - 148, true);
      // Eingabe: nur eine Linie, kein Kasten — der Knopf traegt die Funktion.
      g.strokeStyle = 'rgba(60,48,30,0.35)'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(30, S - 52); g.lineTo(S - 96, S - 52); g.stroke();
      g.fillStyle = 'rgba(60,48,30,0.55)'; g.font = '400 22px "Barlow Condensed", sans-serif';
      g.fillText('Sprich oder tippe …', 34, S - 62);
      g.save();
      g.shadowColor = 'rgba(40,30,18,0.35)'; g.shadowBlur = 10; g.shadowOffsetY = 3;
      g.fillStyle = '#c2452f'; g.beginPath(); g.arc(S - 60, S - 60, 26, 0, Math.PI * 2); g.fill();
      g.restore();
      // Mikrofon-Glyphe (Voice first)
      g.fillStyle = '#f7f0dd';
      g.beginPath(); g.roundRect ? g.roundRect(S - 66, S - 74, 12, 20, 6) : g.rect(S - 66, S - 74, 12, 20); g.fill();
      g.strokeStyle = '#f7f0dd'; g.lineWidth = 2.5;
      g.beginPath(); g.arc(S - 60, S - 56, 10, 0, Math.PI); g.stroke();
      g.beginPath(); g.moveTo(S - 60, S - 46); g.lineTo(S - 60, S - 40); g.stroke();
      g.lineWidth = 1;
    }
    const t = new T.CanvasTexture(c);
    t.colorSpace = T.SRGBColorSpace; t.anisotropy = 4;
    return t;
  }

  /** Der Würfel: dunkler Koerper, sechs Content-Flaechen, taumelnd und selbst-ausrichtend. */
  buildCardCube() {
    // Die Flaeche darf nur so weit reichen wie die FLACHE Seite des gerundeten Koerpers
    // (CUBE_D - 2*Radius), sonst steht sie ueber die Schulter und bildet selbst die Silhouette:
    // der Wuerfel liest dann wieder eckig und an jeder Kante steht eine helle Lippe ab.
    const T = this.T, half = CUBE_D / 2, RAD = CUBE_D * 0.055, pane = CUBE_D - 2 * RAD - 0.06;
    const grp = new T.Group();
    // Leicht gerundete Kanten (nicht so weich wie der Academy-Wuerfel) und ein Koerper, der zu
    // den Terrain-Cubes passt: Weltpalette + Collage-Textur + Bevel-Maske, kein Schwarz.
    const pal = (this.wc && this.wc.palette) || [[0.2, 0.16, 0.13], [0.5, 0.36, 0.24], [0.8, 0.68, 0.5]];
    const geo = this.RoundedBox ? new this.RoundedBox(CUBE_D, CUBE_D, CUBE_D, 3, RAD)
      : new T.BoxGeometry(CUBE_D, CUBE_D, CUBE_D);
    // Koerperfarbe = Flaechengrund, nur eine Spur HELLER: dann liest die Kante als helle Fuge
    // statt als dunkler Rahmen. Vorher stand ein brauner Rand um jede Flaeche.
    const bodyMat = new T.MeshStandardMaterial({
      color: new T.Color(PAPER), roughness: 0.82, metalness: 0.02,
      bumpMap: this.grain, bumpScale: 0.1,
    });
    this.loadTex(TEXBASE + 'Cardboard003/Cardboard003_diffuse.jpg').then((t2) => {
      if (!t2) return;
      // Dieselbe Textur traegt die Gebrauchsspur auf den Flaechen — Wuerfelkoerper und
      // Content-Flaechen sollen aus einem Stueck aussehen.
      this.wearImg = t2.image;
      this.cubeFaces.forEach((f, i) => {
        if (f.material.map) f.material.map.dispose();
        f.material.map = this.faceTexture(FACE_KIND[i], this.cardRaw);
        f.material.needsUpdate = true;
      });
    });
    const body = new T.Mesh(geo, bodyMat);
    grp.add(body);
    this.cubeFaces = [];
    for (let i = 0; i < 6; i++) {
      const n = new T.Vector3(...FACE_N[i]), up = new T.Vector3(...FACE_UP[i]);
      const right = new T.Vector3().crossVectors(up, n).normalize();
      const mesh = new T.Mesh(
        new T.PlaneGeometry(pane, pane),
        // BELEUCHTETE Flaechen: ein unbeleuchtetes Basic-Material haelt seine Helligkeit, waehrend
        // die gerundete Schulter mit der Sonne abschattet — genau das ergab den hellen bzw.
        // dunklen Ring um jede Flaeche. Gleiches Material = kein Helligkeitssprung an der Kante.
        new T.MeshStandardMaterial({ map: this.faceTexture(FACE_KIND[i], this.cardRaw), roughness: 0.85, metalness: 0 }),
      );
      mesh.quaternion.setFromRotationMatrix(new T.Matrix4().makeBasis(right, up, n));
      mesh.position.copy(n).multiplyScalar(half + 0.02);
      mesh.userData.slot = i;
      grp.add(mesh);
      this.cubeFaces.push(mesh);
    }
    // Hoch genug ueber dem Loch, dass der Wuerfel FREI rotieren kann: die Raumdiagonale ist
    // CUBE_D*sqrt(3)/2 vom Mittelpunkt, darunter schneidet eine Ecke beim Drehen in den Sockel.
    this.cube = grp;
    this.anchorTops();
    grp.position.set(this.projX || 0, this.cubeBaseY, ZC);
    this.cubeTarget = null;
    this.cubeIdle = 0;
    // EINTRITTS-POSE: die Karte schaut den Spieler an. Mit Identitaets-Rotation zeigt eine
    // beliebige Flaeche nach vorn, und das Idle-Snapping richtet nur achsenbuendig aus, nie
    // gezielt auf die Art-Flaeche.
    grp.quaternion.copy(this.faceToCamera(0));
    this.scene.add(grp);
  }

  /** Art-Flaeche neu zeichnen (nach Artwork-Eingang oder Kartenwechsel). */
  refreshArtFace() {
    if (!this.cubeFaces || !this.cubeFaces[0]) return;
    const m = this.cubeFaces[0].material;
    if (m.map) m.map.dispose();
    m.map = this.faceTexture('art', this.cardRaw);
    m.needsUpdate = true;
  }

  /** Naechste achsenbuendige Orientierung (Idle-Ausrichtung, 1:1 aus Cube Academy). */
  snapQuat(q) {
    const T = this.T;
    const e = new T.Matrix4().makeRotationFromQuaternion(q).elements;
    const snap = (x, y, z) => {
      const ax = Math.abs(x), ay = Math.abs(y), az = Math.abs(z);
      if (ax >= ay && ax >= az) return new T.Vector3(Math.sign(x) || 1, 0, 0);
      if (ay >= az) return new T.Vector3(0, Math.sign(y) || 1, 0);
      return new T.Vector3(0, 0, Math.sign(z) || 1);
    };
    const X = snap(e[0], e[1], e[2]), Z = snap(e[8], e[9], e[10]);
    const Y = new T.Vector3().crossVectors(Z, X);
    return new T.Quaternion().setFromRotationMatrix(new T.Matrix4().makeBasis(X, Y, Z));
  }

  /**
   * FACE-FOCUS. Die Canvas-Textur einer Wuerfelflaeche ist 512 px und nicht anfassbar — fuer den
   * PDF-Zoom und ein echtes Chat-UI braucht es HTML. Also: Kamera achsenbuendig auf die Flaeche
   * fahren, bis sie das Bild fuellt, und dann genau ueber ihrer projizierten Flaeche ein HTML-Panel
   * einblenden. Der Wuerfel bleibt stehen, wo er steht — das Panel liegt auf der echten Flaeche,
   * es ersetzt sie nicht.
   */
  enterFocus(slot) {
    if (!this.cube) return;
    const T = this.T;
    this.camSave = { pos: this.cam.position.clone(), tgt: this.ctr.target.clone(), spin: this.state.spin };
    this.focusedSlot = slot;
    this.manualCube = false;
    this.ctr.enabled = false;
    this.ctr.autoRotate = false;
    this.focusP = 0;
    // OrbitControls.update() klemmt den Radius auf minDistance — AUCH bei enabled = false, und
    // die Zeile laeuft jeden Frame in der Render-Schleife. Mit minDistance 24 konnte die
    // Fokus-Kamera ihre Zieldistanz (rund 10) nie erreichen: die Flaeche fuellte 40 % statt 80 %.
    this.minSave = this.ctr.minDistance;
    // Abstand so, dass die Flaeche knapp 80 % der Bildhoehe fuellt.
    const half = CUBE_D * 0.5;
    const d = (half / Math.tan((this.cam.fov * Math.PI / 180) / 2)) / 0.8;
    const c = this.cube.getWorldPosition(new T.Vector3());
    const n = new T.Vector3(...FACE_N[slot]).applyQuaternion(this.cube.quaternion).normalize();
    this.ctr.minDistance = Math.min(this.minSave, d * 0.85);
    this.focusCam = { from: this.cam.position.clone(), to: c.clone().add(n.multiplyScalar(d)), tFrom: this.ctr.target.clone(), tTo: c.clone() };
    this.setState({ focus: slot, zoom: 1, panX: 0, panY: 0 });
  }

  exitFocus() {
    this.artEl = null;
    if (this.camSave) {
      this.focusCam = { from: this.cam.position.clone(), to: this.camSave.pos.clone(), tFrom: this.ctr.target.clone(), tTo: this.camSave.tgt.clone() };
      this.focusP = 0; this.leaving = true;
    }
    this.setState({ focus: null });
  }

  tickFocus(dt) {
    const T = this.T;
    // ZWEI GETRENNTE DINGE: der Kamera-Flug laeuft einmal ab, die Panel-Nachfuehrung laeuft
    // solange der Fokus steht. Vorher steckten beide hinter demselben `if (!focusCam) return` —
    // also fror das Rechteck genau in dem Moment ein, in dem die Kamera ankam, und der pendelnde
    // Wuerfel lief darunter weg.
    if (this.focusCam) {
      this.focusP = Math.min(1, (this.focusP || 0) + dt / 0.55);
      const e = this.focusP * this.focusP * (3 - 2 * this.focusP);
      this.cam.position.lerpVectors(this.focusCam.from, this.focusCam.to, e);
      this.ctr.target.lerpVectors(this.focusCam.tFrom, this.focusCam.tTo, e);
      if (this.focusP >= 1) {
        this.focusCam = null;
        if (this.leaving) {
          this.leaving = false;
          this.ctr.enabled = true;
          this.ctr.autoRotate = this.state.spin;
          if (this.minSave != null) this.ctr.minDistance = this.minSave;
        }
      }
    }
    // Eigener Ueberblend-Wert, unabhaengig vom Flug: er steigt, solange der Fokus steht, und
    // faellt beim Verlassen — das Panel blendet damit sauber ein und aus.
    const want = this.state.focus != null ? 1 : 0;
    this.fade = Math.max(0, Math.min(1, (this.fade || 0) + (want ? dt / 0.4 : -dt / 0.25)));
    const e = this.fade;
    // Das Panel folgt der PROJIZIERTEN Flaeche, es wird nicht separat platziert — dreht der
    // Wuerfel noch nach, sitzt es weiter richtig. Direkt am Element, nicht ueber setState:
    // ein Zustandswechsel pro Frame waere ein kompletter Re-Render.
    if (this.panelEl && this.state.focus != null && this.cubeFaces) {
      const f = this.cubeFaces[this.state.focus];
      const r = this.canvas.getBoundingClientRect();
      const box = { x0: 1e9, y0: 1e9, x1: -1e9, y1: -1e9 };
      f.updateMatrixWorld();
      [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(([sx, sy]) => {
        const p = new T.Vector3(sx * CUBE_D * 0.5, sy * CUBE_D * 0.5, 0).applyMatrix4(f.matrixWorld).project(this.cam);
        const x = (p.x * 0.5 + 0.5) * r.width, y = (-p.y * 0.5 + 0.5) * r.height;
        box.x0 = Math.min(box.x0, x); box.x1 = Math.max(box.x1, x);
        box.y0 = Math.min(box.y0, y); box.y1 = Math.max(box.y1, y);
      });
      const st = this.panelEl.style;
      st.left = box.x0 + 'px'; st.top = box.y0 + 'px';
      st.width = Math.max(0, box.x1 - box.x0) + 'px';
      st.height = Math.max(0, box.y1 - box.y0) + 'px';
      st.opacity = String(e);
      st.pointerEvents = e > 0.9 ? 'auto' : 'none';
    }
  }

  /** Art-Flaeche im Vollbild: die ECHTE Kartentextur, nicht die 512er Wuerfelkachel. */
  drawFocusArt(el) {
    if (!el || el === this.artEl) return;
    this.artEl = el;
    const rec = this.card;
    const src = rec && ((rec.decal && rec.decal.material.map) || (rec.sheet && rec.sheet.material.map));
    const img = src && src.image;
    if (!img || !img.width) return;
    el.width = img.width; el.height = img.height;
    el.getContext('2d').drawImage(img, 0, 0);
  }

  /**
   * BLASEN im Graben. Keine Partikel-Textur, keine Sprites: kleine Kugeln, die aus nassen Zellen
   * aufsteigen und an der Oberflaeche verschwinden. Sie starten nur da, wo wirklich Wasser ist —
   * die Liste kommt aus demselben Nass-Test wie das Fluid-Netz, also kann keine Blase im Trockenen
   * stehen. Wie stark es blubbert, haengt an der Fuellung: Saeure (gas) sprudelt, Schlacke (fest)
   * gibt kaum etwas her.
   */
  buildBubbles() {
    const T = this.T, N = 90;
    const mat = new T.MeshStandardMaterial({
      color: 0xffffff, roughness: 0.1, metalness: 0, transparent: true, opacity: 0.5,
      depthWrite: false,
    });
    this.bubbleMat = mat;
    const m = this.bubbles = new T.InstancedMesh(new T.SphereGeometry(1, 8, 6), mat, N);
    m.frustumCulled = false;
    m.instanceMatrix.setUsage(T.DynamicDrawUsage);
    this.bubbleState = Array.from({ length: N }, () => ({ life: -Math.random() * 4 }));
    this.scene.add(m);
  }

  tickBubbles(dt) {
    if (!this.bubbles) return;
    const T = this.T, s = this.state;
    const cells = this.wetCells || [];
    const kind = FLUIDS[s.fluid].kind;
    const rate = s.fx ? (kind === 2 ? 1.9 : kind === 3 ? 0.35 : 1) : 0;
    this.bubbles.visible = rate > 0 && cells.length > 0;
    if (!this.bubbles.visible) return;
    const d = new T.Object3D();
    this.bubbleState.forEach((b, i) => {
      b.life -= dt;
      if (b.life <= 0) {
        // Neu setzen: zufaellige nasse Zelle, zufaellige Stelle darin, Steiggeschwindigkeit und
        // Groesse gestreut — sonst pulsiert der ganze Graben im Gleichtakt.
        const c = cells[(Math.random() * cells.length) | 0];
        b.x = c.x + (Math.random() - 0.5) * CELL * 0.8;
        b.z = c.z + (Math.random() - 0.5) * CELL * 0.8;
        b.y0 = Math.max(c.top + 0.05, this.fluidY - CELL * 1.2);
        b.r = 0.07 + Math.random() * 0.13;
        b.spd = (0.5 + Math.random() * 0.9) * rate;
        b.life = Math.max(0.25, (this.fluidY - b.y0) / b.spd);
        b.t = 0;
        b.wait = Math.random() * (2.6 / rate);
      }
      if (b.wait > 0) { b.wait -= dt; d.scale.setScalar(0.0001); d.position.set(0, -900, 0); }
      else {
        b.t = (b.t || 0) + dt;
        const y = b.y0 + b.t * b.spd;
        const up = Math.max(0, Math.min(1, (this.fluidY - y) / 0.4));   // dicht unter der Oberflaeche platzen
        d.position.set(b.x + Math.sin(b.t * 3 + i) * 0.06, Math.min(y, this.fluidY - 0.02), b.z);
        d.scale.setScalar(b.r * (0.5 + up * 0.5));
        if (y >= this.fluidY) b.life = 0;
      }
      d.updateMatrix();
      this.bubbles.setMatrixAt(i, d.matrix);
    });
    this.bubbles.instanceMatrix.needsUpdate = true;
    const f = FLUIDS[s.fluid];
    this.bubbleMat.color.setRGB(0.6 + f.col[0] * 0.4, 0.6 + f.col[1] * 0.4, 0.6 + f.col[2] * 0.4);
  }

  /**
   * DRONE bei Annaeherung. Synthetisiert, keine Datei: zwei leicht verstimmte Saegezaehne durch
   * einen Tiefpass (der Grundton der Zone) plus gefiltertes Rauschen (das Wasser). Die Lautstaerke
   * haengt am Abstand zur Zone, der Filter oeffnet dabei mit — nah wird es praesenter, nicht nur
   * lauter. Start erst bei der ersten Nutzergeste, sonst blockt der Browser den Kontext.
   */
  initAudio() {
    if (this.audio || !this.state.sound) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ac = new AC();
    const out = ac.createGain(); out.gain.value = 0; out.connect(ac.destination);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 320; lp.Q.value = 0.7;
    lp.connect(out);
    const o1 = ac.createOscillator(), o2 = ac.createOscillator();
    o1.type = o2.type = 'sawtooth';
    o1.frequency.value = 55; o2.frequency.value = 55 * 1.007;      // Schwebung statt Chorus-Effekt
    const g1 = ac.createGain(); g1.gain.value = 0.35;
    o1.connect(g1); o2.connect(g1); g1.connect(lp);
    // Rauschen aus einem Sekunden-Buffer, in Schleife — billiger als ein ScriptProcessor.
    const buf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const ch = buf.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * 0.5;
    const noise = ac.createBufferSource(); noise.buffer = buf; noise.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 640; bp.Q.value = 0.9;
    const ng = this.noiseGain = ac.createGain(); ng.gain.value = 0.16;
    noise.connect(bp); bp.connect(ng); ng.connect(out);
    // Langsamer LFO auf dem Filter: die Drone atmet, statt als Sinuston stehenzubleiben.
    const lfo = ac.createOscillator(); lfo.frequency.value = 0.07;
    const lg = ac.createGain(); lg.gain.value = 90;
    lfo.connect(lg); lg.connect(lp.frequency);
    [o1, o2, lfo].forEach((n) => n.start());
    noise.start();
    this.audio = { ac, out, lp, o1, o2 };
  }

  tickAudio() {
    const a = this.audio;
    if (!a) return;
    if (!this.state.sound) { a.out.gain.value += (0 - a.out.gain.value) * 0.08; return; }
    const T = this.T;
    const c = new T.Vector3(0, ZONE_TOP, ZC);
    const d = this.cam.position.distanceTo(c);
    // 130 Einheiten = still, 34 = voll. Dieselben Schwellen wie die Karten-Beruhigung, damit
    // Bild und Ton denselben Moment meinen.
    const near = Math.max(0, Math.min(1, (130 - d) / 96));
    const g = near * near * 0.5;
    a.out.gain.value += (g - a.out.gain.value) * 0.06;
    a.lp.frequency.value += (260 + near * 900 - a.lp.frequency.value) * 0.05;
    if (this.noiseGain) {
      const wet = (this.wetCells || []).length > 0 ? 1 : 0.25;
      this.noiseGain.gain.value += (0.05 + near * 0.2 * wet - this.noiseGain.gain.value) * 0.05;
    }
    // Grundton folgt der Fuellung: Saeure zischt hoeher, Schlacke brummt tiefer.
    const k = FLUIDS[this.state.fluid].kind;
    const base = k === 2 ? 68 : k === 3 ? 44 : 55;
    a.o1.frequency.value += (base - a.o1.frequency.value) * 0.02;
    a.o2.frequency.value += (base * 1.007 - a.o2.frequency.value) * 0.02;
  }

  /** Inhalt der Text-Flaechen — dieselben Felder, die auch die Wuerfelkachel zeigt, nur lesbar. */
  focusBlocks() {
    const c = this.cardRaw || {}, s = this.state;
    if (s.focus === 1) return [
      { k: 'Titel', v: c.title || c.t || '—' },
      { k: 'Deck', v: c.deck || c.packId || '—' },
      { k: 'Rolle', v: c.role || '—' },
      { k: 'Nummer', v: c.n != null ? '#' + c.n : '—' },
    ];
    if (s.focus === 2) return [{ k: 'Power', v: c.power || c.p || '—' }];
    if (s.focus === 3) return [{ k: 'Lore', v: c.lore || c.l || '—' }];
    if (s.focus === 4) {
      const pool = this.pool || [], i = this.cardIdx || 0;
      const near = [1, 2, 3].map((d) => pool[(i + d) % Math.max(1, pool.length)]).filter(Boolean);
      return [{ k: 'Tags', v: (c.tags || []).join(' · ') || '—' }]
        .concat(near.map((n, k) => ({ k: 'Verwandt ' + (k + 1), v: (n.title || n.t || '—') + (n.deck ? ' · ' + n.deck : '') })));
    }
    return [];
  }

  async sendChat() {
    const text = (this.state.draft || '').trim();
    if (!text) return;
    const card = this.cardRaw || {};
    const msgs = (this.state.chat || []).concat([{ me: true, t: text }]);
    this.setState({ chat: msgs, draft: '', typing: true });
    const ask = 'Du BIST die Karte "' + (card.title || card.t || 'unbenannt') + '"'
      + (card.power ? ' (Power: ' + card.power + ')' : '')
      + (card.lore ? ' (Lore: ' + card.lore + ')' : '')
      + '. Antworte in ihrer Stimme, hoechstens drei Saetze, deutsch.\n\n' + text;
    let answer = '';
    try {
      if (window.claude && window.claude.complete) answer = await window.claude.complete(ask);
    } catch (e) { answer = ''; }
    this.setState({
      chat: msgs.concat([{ me: false, t: answer || 'Ich hoere dich, aber meine Stimme liegt noch im Deck.' }]),
      typing: false,
    });
  }

  /** Flaeche i zur Kamera drehen — Rollwinkel so, dass ihr "oben" oben bleibt. */
  faceToCamera(i) {
    const T = this.T;
    // Zwei verkettete setFromUnitVectors kippen um, sobald der zweite Vektor fast antiparallel
    // liegt (dann waehlt three eine beliebige 180-Grad-Achse und dreht die Flaeche nach HINTEN).
    // Deshalb direkt aus Basen: Ziel-Basis (rechts, oben, Normale) gegen die lokale Flaechenbasis.
    const dir = this.cam.position.clone().sub(this.cube.position).normalize();
    const right = new T.Vector3().crossVectors(new T.Vector3(0, 1, 0), dir).normalize();
    if (!isFinite(right.x) || right.lengthSq() < 1e-6) right.set(1, 0, 0);
    const up = new T.Vector3().crossVectors(dir, right).normalize();
    const world = new T.Matrix4().makeBasis(right, up, dir);
    const fN = new T.Vector3(...FACE_N[i]), fU = new T.Vector3(...FACE_UP[i]);
    const fR = new T.Vector3().crossVectors(fU, fN).normalize();
    const local = new T.Matrix4().makeBasis(fR, fU, fN).transpose();   // orthonormal → transponiert = invers
    return new T.Quaternion().setFromRotationMatrix(world.multiply(local));
  }

  tickCube(dt) {
    if (!this.cube) return;
    const T = this.T;
    // FOKUS ist ein ZUSTAND, kein Einmal-Ziel: eine angeklickte Flaeche bleibt vorn, bis der
    // Nutzer die Kamera bewegt. Ein Ziel-Quaternion allein wurde beim Erreichen geloescht,
    // danach drehte der Taumel die Wahl sofort wieder weg.
    // Von Hand gedreht = Hand behaelt die Kontrolle: kein Taumeln, kein Zurueckstellen. Sonst
    // zieht die Auto-Ausrichtung jede Drehung sofort zurueck (und die Kamera-Autorotation
    // verschiebt zusaetzlich das Ziel, was es im Spiel so nicht gibt).
    if (this.manualCube) return;
    if (this.focusedSlot != null) {
      this.cube.quaternion.slerp(this.faceToCamera(this.focusedSlot), 1 - Math.pow(0.02, dt));
      return;
    }
    // DISTANZ statt Uhr — dieselbe Logik wie bei der Sky-Card: aus der Ferne taumelt der Wuerfel
    // um eine gekippte Achse und zeigt alle sechs Flaechen, bei Annaeherung dreht er die
    // Art-Flaeche zum Spieler und bleibt dort. Eine Idle-Uhr lief genau einmal ab und fror den
    // Wuerfel danach auf der zufaellig naechsten Achse ein.
    const dist = this.cam.position.distanceTo(this.cube.position);
    const far = Math.min(1, Math.max(0, (dist - 30) / 40));
    if (far > 0.02) {
      const q = new T.Quaternion().setFromAxisAngle(new T.Vector3(0.35, 1, 0.5).normalize(), dt * 0.3 * far);
      this.cube.quaternion.multiply(q);
    }
    if (far < 0.6) this.cube.quaternion.slerp(this.faceToCamera(0), (1 - Math.pow(0.25, dt)) * (1 - far / 0.6));
    // Pendeln PLUS Einfahrtiefe: tickCube schreibt y jeden Frame, also muss der Versatz aus
    // dem Aufdecken hier drin stecken — sonst hebt das Pendeln das Einfahren sofort wieder auf.
    this.cube.position.y = (this.cubeBaseY != null ? this.cubeBaseY : CUBE_D * 1.05) + Math.sin(this.t * 0.7) * 0.3 + (this.cubeSink || 0);
  }

  async loadProjector() {
    const T = this.T;
    const p = PROJECTORS.find((x) => x.id === this.state.proj) || PROJECTORS[0];
    if (this.cube) { this.scene.remove(this.cube); this.cube = null; this.cubeFaces = null; }
    if (p.cube) {
      if (this.projector) { this.scene.remove(this.projector); this.projector = null; }
      this.buildCardCube();
      await this.loadBase();
      // Wuerfel und Sockel entstehen NACH der ersten Pose — ohne diesen Aufruf stehen sie
      // ausgefahren da, obwohl die Zone noch verdeckt ist.
      if (this.pivot) this.poseCard(this.rev || 0);
      return;
    }
    let url = p.url;
    if (!url && p.repo) {
      try {
        const repo = await (await fetch('./asset-repo.json')).json();
        const a = (repo.assets || []).find((x) => x.name === p.repo);
        if (a) url = a.ghUrl || (repo.rawBase + a.pack + '/' + a.name + '.glb');
      } catch (e) { /* fällt unten auf den Platzhalter */ }
    }
    if (this.projector) { this.scene.remove(this.projector); this.projector = null; }
    let obj = null;
    if (url) {
      obj = await new Promise((res) => new this.GLTFLoader().load(url, (g) => res(g.scene), undefined, () => res(null)));
    }
    if (!obj) {
      // Platzhalter, damit der Beam immer einen Fuss hat, auch wenn das GLB fehlt.
      obj = new T.Mesh(new T.BoxGeometry(4, 4, 4), new T.MeshStandardMaterial({ color: 0x9a8a76, roughness: 0.8 }));
    }
    const box = new T.Box3().setFromObject(obj);
    const size = new T.Vector3(); box.getSize(size);
    const k = p.h / Math.max(0.001, size.y);
    obj.scale.setScalar(k);
    // 0.05 ueber der Zonenkante: bodengleich platziert z-fightet die Unterseite mit dem Plateau
    // und flackert bei jeder Kamerabewegung.
    this.projOffY = -box.min.y * k + 0.05;
    this.anchorTops();
    obj.position.set(this.projX || 0, this.projBaseY, ZC);
    obj.traverse((n) => { if (n.isMesh) n.castShadow = true; });
    this.projector = obj;
    this.scene.add(obj);
    if (this.pivot) this.poseCard(this.rev || 0);
  }

  /** Steinsockel unter dem Wuerfel — das Hexagon-Tile aus dem Kit, wie in Cube Academy. */
  async loadBase() {
    const T = this.T;
    if (this.base) return;
    try {
      const repo = await (await fetch('./asset-repo.json')).json();
      const a = (repo.assets || []).find((x) => x.name === 'hole' && x.pack === 'GLB_pirate')
        || (repo.assets || []).find((x) => x.name === 'stone' && x.pack === 'GLB_hexagon_kit');
      if (!a) return;
      const url = a.ghUrl || (repo.rawBase + a.pack + '/' + a.name + '.glb');
      const obj = await new Promise((res) => new this.GLTFLoader().load(url, (g) => res(g.scene), undefined, () => res(null)));
      if (!obj) return;
      const box = new T.Box3().setFromObject(obj), size = new T.Vector3(); box.getSize(size);
      const k = (CUBE_D * 1.9) / Math.max(0.001, size.x);   // Sockel deutlich breiter als der Wuerfel
      obj.scale.setScalar(k);
      this.base = obj;
      this.baseOffY = -box.min.y * k + 0.06;
      this.anchorTops();
      obj.position.set(this.projX || 0, this.baseBaseY, ZC);
      this.scene.add(obj);
      // INNENBODEN MESSEN, nicht schaetzen: das GLB ist ein geschlossener Hex-Trichter, kein
      // Durchloch. Ein Strahl von oben liefert die Hoehe, auf der Pfuetze und Cap liegen muessen —
      // an baseBaseY gehaengt lagen sie unter der Geometrie und waren unsichtbar.
      obj.updateMatrixWorld(true);
      const rc = new T.Raycaster();
      rc.set(new T.Vector3(this.projX || 0, this.baseBaseY + 40, ZC), new T.Vector3(0, -1, 0));
      const hit = rc.intersectObject(obj, true)[0];
      this.holeFloorOff = hit ? hit.point.y - this.baseBaseY : 0.06;
      // Die Innenwand ist vom Licht abgewandt und bekommt fast nur Ambient — sie las als
      // schwarzes Nichts. Ein Hauch Eigenleuchten in Zonenfarbe macht die Mulde lesbar.
      obj.traverse((n) => {
        if (n.isMesh && n.material && n.material.emissive) {
          n.material.emissive = new T.Color(0x4a3a2c);
          n.material.emissiveIntensity = 0.55;
        }
      });
    } catch (e) { /* ohne Sockel schwebt der Wuerfel eben frei */ }
  }

  async applyZoneLook() {
    const T = this.T, s = this.state, U = this.zoneMat.userData.kfb;
    const tex = await this.loadTex(TEXBASE + s.tex + '/' + s.tex + '_diffuse.jpg');
    U.uKfbPhoto.value = tex;
    U.uKfbPhotoStr.value = tex ? 0.22 + s.wear * 0.55 : 0;
    U.uKfbPhotoScale.value = s.scale;
    U.uKfbGrain.value = 0.04 + s.wear * 0.2;
    U.uKfbSeam.value = 0;   // Abnutzung darf die Fuge NICHT wiederbringen — sie ist das Zellraster
    U.uKfbSeamW.value = 0;
    this.zoneMat.roughness = 0.5 + s.wear * 0.45;
    const st = STATUS[s.zoneStatus], col = new T.Color();
    const paper = new T.Color(0.90, 0.85, 0.74).lerp(new T.Color(0.40, 0.32, 0.25), s.wear * 0.7);
    const rim = new T.Color(st.col[0], st.col[1], st.col[2]);
    this.zoneCells.forEach((c, k) => {
      col.copy(c.edge ? paper.clone().lerp(rim, 0.7) : paper);
      col.offsetHSL(0, 0, (h2(Math.round(c.x), Math.round(c.z), 17) - 0.5) * 0.05);
      this.zoneMesh.setColorAt(k, col);
    });
    this.zoneMesh.instanceColor.needsUpdate = true;
  }

  set(patch) {
    this.setState(patch, () => {
      const s = this.state;
      if (!this.r) return;
      if (patch.height != null || patch.amp != null) {
        this.wc.params.heightScale = s.height;
        this.wc.params.motionAmplitude = s.amp;
        this.terrain.setWorldContext(this.wc);
      }
      if (patch.flow != null) this.terrain.setFlow(s.flow);
      if (patch.moat != null) { this.layoutMoat(); this.fluidU.uMoat.value = s.moat; }
      if (patch.river != null || patch.riverW != null) { this._river = null; this.layoutMoat(); }
      if (patch.fluid) {
        const f = FLUIDS[s.fluid];
        this.fluidU.uCol.value.setRGB(f.col[0], f.col[1], f.col[2]);
        if (this.holePuddle) this.holePuddle.material.color.setRGB(f.col[0], f.col[1], f.col[2]);
      }
      // Zonenhoehe geaendert = Deck neu setzen: seine Blatt-Matrizen sind gebacken und wissen
      // sonst nichts von der neuen Oberkante.
      // Stufen und Absenkung verschieben den Zonenboden — und damit die Wasserlinie, den
      // Wannenboden und das Ufer. Ohne layoutMoat() bleibt die Wanne stehen, wo sie gebaut wurde,
      // und das Wasser sinkt unter ihren Boden (der Graben lief trocken).
      if (patch.steps != null || patch.sink != null) { this.layoutZone(); this.layoutMoat(); this.buildStack(); this.poseCard(this.rev || 0); }
      if (patch.tex != null || patch.wear != null || patch.scale != null || patch.zoneStatus) this.applyZoneLook();
      if (patch.steps != null || patch.sink != null) this.layoutFluid();
      if (patch.holo != null) this.holoU.uGain.value = s.holo;
      if (patch.deck != null) { this.buildStack(); this.poseCard(this.rev || 0); }
      if (patch.off != null) { this.projX = s.off * ZW; }
      if (patch.proj) this.loadProjector();
      if (patch.spin != null) this.ctr.autoRotate = s.spin;
      if (patch.dockOpen != null) this.onResize();
    });
  }

  /**
   * AUFDECKEN. Die verdeckte Karte liegt FLACH auf dem Zonenboden, Rueckseite nach oben, und
   * klappt um ihre Unterkante auf. Drei Zutaten, die es glaubhaft machen:
   *   1. Scharnier statt Mittelachse — der Pivot sitzt auf der Unterkante (siehe placeCard).
   *   2. Das Blatt BIEGT sich beim Aufklappen: der obere Rand haengt nach, weil Papier Gewicht hat.
   *      Dafuer bekommen Blatt, Tusche und Rueckseite ein Segment-Raster und einen Bend-Uniform.
   *   3. Erst wenn die Karte oben steht, erscheinen Wuerfel und Sockel — die Zone oeffnet sich MIT ihr.
   */
  prepReveal(rec) {
    const T = this.T;
    const bend = this.bendU = { uBend: { value: 0 } };
    const seg = (m) => {
      if (m.geometry) m.geometry.dispose();
      m.geometry = new T.PlaneGeometry(rec.width, rec.height, 14, 10);
    };
    const patch = (mat) => {
      mat.onBeforeCompile = (sh) => {
        Object.assign(sh.uniforms, bend);
        sh.vertexShader = sh.vertexShader
          .replace('void main() {', 'uniform float uBend;\nvoid main() {')
          .replace('#include <begin_vertex>', [
            '#include <begin_vertex>',
            // uv.y ist 0 an der Unterkante (Scharnier) und 1 oben: quadratisch heisst,
            // die Biegung sitzt oben und das Scharnier bleibt ruhig.
            'float bw = uv.y * uv.y;',
            'transformed.z -= uBend * bw;',
            'transformed.y -= uBend * bw * 0.3;',
          ].join('\n'));
      };
      mat.needsUpdate = true;
    };
    seg(rec.sheet); seg(rec.decal);
    patch(rec.mat); patch(rec.dmat);
    // Rueckseite: eigenes Blatt, um 180 Grad gedreht, auf derselben Silhouette wie die Vorderseite.
    const bmat = this.backMat = new T.MeshBasicMaterial({
      map: this.backTex || null, color: this.backTex ? 0xffffff : 0xcdbf9e,
      alphaMap: rec.mat.alphaMap, alphaTest: 0.5, toneMapped: false, side: T.FrontSide,
    });
    patch(bmat);
    const bgeo = new T.PlaneGeometry(rec.width, rec.height, 14, 10);
    // Sichtbar ist die Rueckseite NUR im flachen Zustand — aufgerichtet schaut man auf die
    // Vorderseite. Flach liegt die Karte mit ihrer OBERKANTE zum Spieler (das Scharnier ist die
    // hintere Unterkante), also stuende die Rueckseite dort auf dem Kopf. u UND v gedreht ist
    // eine 180-Grad-Drehung in der Flaeche — keine Spiegelung, die Schrift bleibt lesbar.
    const uv = bgeo.getAttribute('uv');
    for (let i = 0; i < uv.count; i++) { uv.setX(i, 1 - uv.getX(i)); uv.setY(i, 1 - uv.getY(i)); }
    uv.needsUpdate = true;
    const back = this.backMesh = new T.Mesh(bgeo, bmat);
    back.rotation.y = Math.PI;
    back.position.z = -0.06;
    back.frustumCulled = false;
    rec.group.add(back);
    this.rev = 0; this.revDir = 0;
    this.buildStack();
    this.poseCard(0);
    this.setState({ reveal: 'verdeckt' });
  }

  /** Eine Funktion, ein Zustand: p 0 = flach und verdeckt, 1 = oben und offen. */
  poseCard(p) {
    if (!this.pivot || !this.card) return;
    const ease = (x) => x * x * (3 - 2 * x);
    const h = this.card.height;
    const flip = ease(Math.min(1, p / 0.6));
    const rise = ease(Math.max(0, (p - 0.42) / 0.58));
    // Skalierung mitfuehren: das Blatt liegt in Handgroesse auf dem Deck und wird auf dem Weg
    // nach oben zur Projektion. h ist die Projektionshoehe, gerechnet wird mit h*scale.
    const sc = PHYS + (1 - PHYS) * rise;
    const xDeck = ZW * DECK_X, zDeck = ZC + ZD * DECK_Z;
    const yDeck = (this.topDeck != null ? this.topDeck : ZONE_TOP) + 0.3 + (this.stackH || 0);
    this.pivot.scale.setScalar(sc);
    this.pivot.rotation.set(Math.PI / 2 * (1 - flip), 0, 0);
    this.pivot.position.set(
      xDeck * (1 - rise),
      yDeck + (this.cardY - h / 2 - yDeck) * rise,
      (zDeck - h * PHYS / 2) + (ZC - (zDeck - h * PHYS / 2)) * rise,
    );
    this.bendU.uBend.value = Math.sin(Math.PI * Math.min(1, p / 0.6)) * h * 0.16 * (1 - rise * 0.7);
    // EIN-/AUSFAHREN statt Ein-/Ausblenden: unter der Plateaukante ist alles im Boden verborgen,
    // also braucht es keinen Sichtbarkeits-Sprung — und nichts sticht durch die liegende Karte.
    // GESTAFFELTE EINSAETZE statt eines gemeinsamen Fensters: vorher fuhren Sockel, Loch,
    // Wuerfel und Projektor auf demselben `open` los und kamen gleichzeitig an — das las als
    // ein Ruck. Jedes Teil hat jetzt sein eigenes Fenster, in Reihenfolge der Buehne:
    // Sockel (Grund) → Loch → Projektor → Wuerfel (Hauptdarsteller zuletzt).
    const win = (a, b) => ease(Math.min(1, Math.max(0, (p - a) / (b - a))));
    const upBase = win(0.14, 0.46), upCap = win(0.18, 0.5), upProj = win(0.22, 0.56), upCube = win(0.26, 0.66);
    this.cubeSink = -(1 - upCube) * CUBE_D * 2.8;
    if (this.cube) this.cube.position.y = this.cubeBaseY + this.cubeSink;
    if (this.base) this.base.position.y = this.baseBaseY - (1 - upBase) * (CUBE_D * 1.4);
    if (this.holeCap) {
      const floor = (this.baseBaseY || 0) + (this.holeFloorOff != null ? this.holeFloorOff : 0.06);
      this.holeCap.position.set(this.projX || 0, floor + 0.02 - (1 - upCap) * (CUBE_D * 1.4), ZC);
      // Deckkraft statt Sichtbarkeits-Sprung — ein harter Wechsel auf halber Fahrt blitzt.
      this.holeCap.material.opacity = Math.min(1, upCap * 3);
      this.holeCap.visible = upCap > 0.02;
      if (this.holePuddle) {
        // Nie unter der grossen Ebene: zwei Wasseroberflaechen verschiedener Hoehe an derselben
        // Stelle widersprechen sich, und die groessere verdeckt die kleinere einfach.
        const py = Math.max(this.holeCap.position.y + 0.05, (this.fluidY || -1e9) + 0.04);
        this.holePuddle.position.set(this.holeCap.position.x, py, ZC);
        this.holePuddle.material.opacity = 0.86 * Math.min(1, upCap * 3);
        this.holePuddle.visible = this.holeCap.visible;
      }
    }
    if (this.projector) this.projector.position.y = this.projBaseY - (1 - upProj) * (CUBE_D * 2.2);
    // Das Wasser im Loch wird SEHR FRUEH gesetzt, waehrend der Sockel noch tief im Boden steckt:
    // der Umbau des Fluid-Netzes ist ein Sprung, und der darf nur passieren, solange ihn niemand
    // sehen kann. Vorher lag die Schwelle bei 0.6 — mitten im sichtbaren Aufbau.
    const wantHole = p > 0.05;
    if (this.holeOpen !== wantHole) { this.holeOpen = wantHole; this.layoutFluid(); }
    // Das oberste Deckblatt ruecktt nach, sobald das echte Blatt abhebt — es schiebt sich aus dem
    // Stapel heraus statt aufzuploppen.
    if (this.stackTop) {
      const fill = ease(Math.min(1, Math.max(0, (rise - 0.04) / 0.26)));
      this.stackTop.visible = fill > 0.01;
      this.stackTop.position.y = this.stackTopY - (1 - fill) * SUB * 0.9;
      this.stackTop.material.opacity = fill;
    }
    this.setCardSide();
  }

  /**
   * Vorder- oder Rueckseite, nie beide. Entschieden wird am WELT-NORMALEN-Vorzeichen: der
   * Wechsel passiert dadurch genau dann, wenn das Blatt von der Kante zu sehen ist — sichtbar
   * ist er nie. Vorher lagen Blatt und Rueckseite gleichzeitig da: das las als zweite Karte.
   */
  setCardSide() {
    const T = this.T, rec = this.card;
    if (!rec || !this.backMesh) return;
    rec.group.updateMatrixWorld();
    const n = new T.Vector3(0, 0, 1).applyQuaternion(rec.group.getWorldQuaternion(new T.Quaternion()));
    const toCam = this.cam.position.clone().sub(rec.group.getWorldPosition(new T.Vector3()));
    const front = n.dot(toCam) > 0;
    rec.sheet.visible = front; rec.decal.visible = front;
    this.backMesh.visible = !front;
  }

  /**
   * DAS DECK. Cartoon-realistisch heisst hier: gleiche Blaetter, aber jedes einen Hauch versetzt
   * und verdreht — die Unregelmaessigkeit sitzt in den Raendern, nicht in der Form. Die Hoehe
   * zaehlt in D6-Stufen wie das Terrain, damit 1 bis 6 Stufen verschieden dicke Decks ergeben.
   */
  buildStack() {
    const T = this.T, s = this.state;
    if (this.stack) { this.scene.remove(this.stack); this.stack.geometry.dispose(); this.stack = null; }
    if (this.stackTop) { this.scene.remove(this.stackTop); this.stackTop = null; }
    if (!this.card) return;
    const w = this.card.width * PHYS, h = this.card.height * PHYS;
    const cards = Math.max(1, Math.round(s.deck * SUB / CARD_T));
    this.stackH = cards * CARD_T * 0.97;
    const geo = new T.BoxGeometry(w, CARD_T, h);
    const mat = new T.MeshStandardMaterial({ color: 0xe4d7b8, roughness: 0.95, metalness: 0 });
    const mesh = this.stack = new T.InstancedMesh(geo, mat, cards);
    mesh.castShadow = mesh.receiveShadow = true;
    const d = new T.Object3D(), col = new T.Color();
    const xDeck = ZW * DECK_X, zDeck = ZC + ZD * DECK_Z;
    for (let i = 0; i < cards; i++) {
      const r1 = (Math.sin(i * 12.9898) * 43758.5453) % 1, r2 = (Math.sin(i * 78.233) * 43758.5453) % 1;
      // Jedes fuenfte Blatt steht deutlicher heraus — sonst liest der Stapel als ein Block.
      const out = (i % 5 === 2) ? 2.4 : 1;
      d.position.set(xDeck + r1 * 0.5 * out, (this.topDeck != null ? this.topDeck : ZONE_TOP) + 0.3 + i * CARD_T * 0.97, zDeck + r2 * 0.5 * out);
      d.rotation.set(0, r1 * 0.05 * out, 0);
      d.updateMatrix();
      mesh.setMatrixAt(i, d.matrix);
      col.setRGB(0.90 + r2 * 0.09, 0.86 + r1 * 0.08, 0.74 + r2 * 0.10);
      mesh.setColorAt(i, col);
    }
    mesh.instanceMatrix.needsUpdate = true; mesh.instanceColor.needsUpdate = true;
    this.scene.add(mesh);
    // Oberstes Blatt: die KFB-Rueckseite. Sie liegt frei, sobald die aufgedeckte Karte weg ist.
    const tgeo = new T.PlaneGeometry(w, h);
    const top = this.stackTop = new T.Mesh(tgeo, new T.MeshStandardMaterial({
      map: this.backTex || null, color: this.backTex ? 0xffffff : 0xd8cba8, roughness: 0.9,
      transparent: true, opacity: 0,
    }));
    top.rotation.x = -Math.PI / 2;
    this.stackTopY = (this.topDeck != null ? this.topDeck : ZONE_TOP) + 0.3 + this.stackH + 0.02;
    top.position.set(xDeck, this.stackTopY, zDeck);
    top.visible = false;
    this.scene.add(top);
  }

  tickReveal(dt) {
    if (this.revDir === 0) return;
    this.rev = Math.min(1, Math.max(0, this.rev + this.revDir * dt / 1.7));
    this.poseCard(this.rev);
    if (this.rev === 0 || this.rev === 1) {
      this.revDir = 0;
      this.setState({ reveal: this.rev === 1 ? 'offen' : 'verdeckt' });
    }
  }

  /**
   * ZERO-G: die Sky-Card driftet auf drei Achsen und dreht sich traege zur Kamera, damit sie
   * immer lesbar bleibt. Bei ANNAEHERUNG nimmt beides ab — aus der Naehe soll sie ruhig stehen.
   */
  tickCard(dt) {
    const T = this.T, g = this.pivot;
    // Aufdecken bei Annaeherung: wer zur Zone fliegt, loest sie aus. Kein Knopf im Spiel.
    if (this.state.autoReveal && this.rev === 0 && this.revDir === 0
        && this.cam.position.distanceTo(new T.Vector3(0, ZONE_TOP, ZC)) < 62) this.revDir = 1;
    if (this.rev < 1) { this.tickReveal(dt); return; }
    this.tickReveal(dt);
    const dist = this.cam.position.distanceTo(g.position);
    const calm = Math.min(1, Math.max(0, (dist - 34) / 46));      // 0 = nah und ruhig, 1 = fern und driftend
    const t2 = this.t;
    g.position.set(
      Math.sin(t2 * 0.23) * 2.2 * calm,
      this.cardY - this.card.height / 2 + Math.sin(t2 * 0.31 + 1.2) * 1.5 * calm,
      ZC + Math.sin(t2 * 0.17 + 2.4) * 1.8 * calm,
    );
    // Blick zur Kamera, aber nur der Gierwinkel und stark gedaempft: kein Nachzieh-Effekt.
    const dir = this.cam.position.clone().sub(g.position); dir.y = 0;
    const yaw = Math.atan2(dir.x, dir.z);
    const q = new T.Quaternion().setFromEuler(new T.Euler(
      Math.sin(t2 * 0.27) * 0.045 * calm, yaw, Math.sin(t2 * 0.19 + 0.7) * 0.05 * calm,
    ));
    g.quaternion.slerp(q, 1 - Math.pow(0.35, dt));
    this.setCardSide();
  }

  async buildCard() {
    const T = this.T;
    this.cardY = 34;
    try {
      const mod = await import('./cardbuilder/kfb-card-builder.js');
      // REGISTRY-QUELLE: `kfb-index.json` traegt die gemessenen `cardGrid`-Zahlen (sechs pro Deck,
      // inkl. gapX/gapY), `index.json` ist der aeltere Deploy-Stand ohne sie. Erst die Quelle, dann
      // der Fallback — so schneidet der Builder richtig, ohne dass eine Zahl in JS landet
      // (SSOT_KFB_CardBuilder_PDF §4: cardGrid gehoert ausschliesslich ins Manifest).
      const KFB_IDX = 'https://raw.githubusercontent.com/georg-doc/kayfabizarro/main/media/kfb/';
      const cb = this.cb = mod.createCardBuilder({
        THREE: T, indexUrl: KFB_IDX + 'kfb-index.json', localIndex: KFB_IDX + 'index.json',
      });
      this.pool = (await cb.pool()) || [];
      this.buildBaseline();
      // UEBERGABE AUS DER REGISTRY: liegt dort eine Karte an, startet das Lab mit ihrer Zone statt
      // mit der ersten des Pools. Der Schluessel wird danach verworfen — ein Reload soll nicht
      // ewig auf derselben Zone haengen.
      try {
        const raw = localStorage.getItem('kfb-zone-open');
        if (raw) {
          localStorage.removeItem('kfb-zone-open');
          const want = JSON.parse(raw);
          const i = this.pool.findIndex((c) => c.packId === want.packId && c.n === want.n);
          if (i >= 0) this.cardIdx = i;
        }
      } catch (e) {}
      // Kartenrueckseite fuer die kommende Aufdeck-Animation vorladen (lowrez reicht in 3D).
      this.loadTex('https://raw.githubusercontent.com/georg-doc/kayfabizarro/main/media/kfb/KayfaBizarro_Card_Backside_01_lowrez.png')
        .then((t2) => {
          this.backTex = t2;
          if (this.backMat && t2) { this.backMat.map = t2; this.backMat.color.set(0xffffff); this.backMat.needsUpdate = true; }
          if (this.stackTop && t2) { this.stackTop.material.map = t2; this.stackTop.material.color.set(0xffffff); this.stackTop.material.needsUpdate = true; }
        });
      this.cardIdx = 0;
      this.placeCard();
    } catch (e) {
      this.setState({ cardName: 'CardBuilder nicht erreichbar', cardMeta: String(e).slice(0, 60) });
    }
  }

  placeCard() {
    if (!this.pool || !this.pool.length) return;
    const card = this.pool[this.cardIdx % this.pool.length];
    if (this.pivot) { this.scene.remove(this.pivot); this.card.dispose && this.card.dispose(); }
    const rec = this.cb.make(card, {
      width: ZW * 0.92,
      // Wenn der PDF-Quadrant landet, tauscht der Builder seine Blatt-Textur aus — die
      // Wuerfelflaeche muss danach neu gezeichnet werden, sonst zeigt sie das Textblatt weiter.
      onArt: () => this.refreshArtFace(),
    });
    // SCHARNIER: die Karte haengt in einem Pivot, dessen Ursprung auf ihrer UNTERKANTE liegt.
    // Nur so klappt sie um die Kante auf statt um ihre Mitte zu kippen.
    const pivot = this.pivot = new this.T.Group();
    rec.group.position.set(0, rec.height / 2, 0);
    pivot.add(rec.group);
    this.scene.add(pivot);
    this.card = rec;
    this.prepReveal(rec);
    this.cardRaw = card;
    // FELDNAMEN: der Pool liefert n/title/power/lore/role, cardSemanticVector erwartet
    // cardNumber/cardName/power/lore + Rolle. Vorher stand hier die Kompaktform (t/p/l/g) —
    // damit war der Vektor leer und Biome, Palette und Seed haben sich pro Karte NIE geaendert.
    this.cardData = this.seedCard(card);
    if (this.cubeFaces) this.cubeFaces.forEach((f, i) => {
      if (f.material.map) f.material.map.dispose();
      f.material.map = this.faceTexture(FACE_KIND[i], card);
      f.material.needsUpdate = true;
    });
    // Neue Karte = neue Eintritts-Pose: wieder die Art-Flaeche nach vorn.
    if (this.cube) this.focusedSlot = 0;   // neue Karte = Art-Flaeche vorn, bis der Nutzer dreht
    this.setState({
      cardName: card.t || card.title || card.name || ('Karte ' + card.n),
      cardMeta: [card.packId, card.n != null ? '#' + card.n : '', card.role, rec.artState].filter(Boolean).join(' · '),
    });
    this.applySeed();
  }

  /** Pool-Karte → Feldnamen, die world-context.js liest. */
  seedCard(c) {
    if (!c) return null;
    return {
      cardNumber: c.n, cardName: c.title || c.t || c.name,
      power: c.power || c.p || '', lore: c.lore || c.l || '',
      gradeReason: c.deck || '', role: c.role,
    };
  }

  /** Der Drei-Schlag: die aktuelle Karte dominiert, die zwei naechsten biegen die Welt. */
  triplet() {
    const p = this.pool || [];
    if (!p.length) return { current: null };
    const i = this.cardIdx || 0;
    return {
      current: this.seedCard(p[i % p.length]),
      next: this.seedCard(p[(i + 1) % p.length]),
      nextNext: this.seedCard(p[(i + 2) % p.length]),
    };
  }

  /**
   * KARTEN-SEED STEUERT DIE ZONE. Kein eigenes Regelwerk: der Vektor kommt aus
   * cardSemanticVector (8 Dimensionen, deterministisch aus Titel/Power/Lore + Deck-Rolle),
   * die Zone liest ihn nur aus. Gleiche Karte → gleiche Zone, immer.
   */
  /**
   * BASISLINIE aus dem ganzen Pool. Ohne sie gewinnt immer dieselbe Dimension: `power` ist in
   * jedem Kartentext hoch (die Lexika teilen sich Alltagsverben), also waere jede Zone `heroic`.
   * Entscheidend ist nicht, welche Dimension GROSS ist, sondern welche fuer DIESE Karte
   * AUFFAELLIG ist — deshalb der Abstand zum Mittel, nicht der Rohwert.
   */
  buildBaseline() {
    const p = this.pool || [];
    if (!p.length || !this.WC.cardSemanticVector) return;
    const sum = {}; let n = 0;
    p.forEach((c) => {
      const cd = this.seedCard(c);
      const v = this.WC.cardSemanticVector(cd, cd.role);
      Object.keys(v).forEach((k) => { sum[k] = (sum[k] || 0) + v[k]; });
      n++;
    });
    const mean = {}; Object.keys(sum).forEach((k) => { mean[k] = sum[k] / n; });
    this.baseline = mean;
  }

  /** Abstand zum Pool-Mittel, auf 0..1 gespreizt. 0.5 = durchschnittlich. */
  dev(k) {
    const v = (this.wc && this.wc.vector) || {}, m = this.baseline || {};
    const x = v[k] || 0, mu = m[k] != null ? m[k] : 0.35;
    return Math.max(0, Math.min(1, 0.5 + (x - mu) * 2.6));
  }

  seedMode() {
    return [['tragic', this.dev('melancholy')], ['comic', this.dev('humor')], ['absurd', this.dev('chaos')],
      ['heroic', this.dev('power')], ['mystical', this.dev('wonder')], ['forbidden', this.dev('threat')]]
      .sort((a, b) => b[1] - a[1])[0][0];
  }

  seedSignature() {
    // SIGNATUR-SEED AUS DER KARTENIDENTITAET, nicht aus wc.seed: wc.seed haengt via joinSeeds am
    // Story-Modus, und der wird erst aus dem Vektor abgeleitet — waehrend der Ableitung steht dort
    // noch der Modus der VORHERIGEN Karte. Damit war die Texturwahl von der Vorgeschichte abhaengig.
    const c = this.cardRaw || {};
    const seed = this.WC.joinSeeds
      ? this.WC.joinSeeds('kfb-card-zone', String(c.packId || 'ø'), String(c.n != null ? c.n : 0))
      : h2(c.n || 0, 7, 0x5EED) * 4294967296;
    const g = (k) => this.dev(k);
    const cl = (x) => Math.max(0, Math.min(1, x));
    // Abnutzung ist die Protopia/Dystopia-Achse: Bedrohung und Schwermut machen dreckig,
    // Staunen und Humor machen sauber. Die Deck-Rolle steckt via ROLE_BIAS schon im Vektor.
    const wear = cl(0.42 + g('threat') * 0.5 + g('melancholy') * 0.3 + g('chaos') * 0.16 - g('wonder') * 0.42 - g('humor') * 0.3);
    const fluid = [['saeure', g('threat')], ['oel', g('melancholy')], ['wasser', g('wonder')],
      ['bubblegum', g('humor')], ['schlacke', g('chaos')]].sort((a, b) => b[1] - a[1])[0][0];
    const CLEAN = ['Cardboard003', 'Chipboard007', 'whitewashed_brick'];
    const DIRTY = ['rusty_metal_04', 'PaintedMetal017', 'Leaking018A', 'Tape005', 'RoadLines019B', 'ScrewSet001'];
    const bank = wear < 0.45 ? CLEAN : DIRTY;
    const p = (this.wc && this.wc.params) || {};
    return {
      fluid, wear: +wear.toFixed(2), tex: bank[(seed >>> 7) % bank.length],
      moat: 2 + Math.round(g('chaos') * 3),
      steps: +(0.25 + g('chaos') * 1.05).toFixed(2),
      sink: Math.round(g('threat') * 2),
      deck: 1 + Math.round(g('lore') * 5),
      // heightScale und motionAmplitude NICHT hier: sie kommen aus wc.params und die haengen
      // am Modus. rebuildWorld setzt sie aus dem endgueltigen Kontext.
    };
  }

  applySeed() {
    if (!this.terrain || !this.WC) return;
    // Zwei Durchgaenge: der Vektor haengt nicht am Modus, die PALETTE aber schon — also erst
    // den Vektor holen, daraus den Story-Modus, dann die Welt endgueltig bauen.
    this.wc = this.WC.makeWorldContext({ cardTriplet: this.triplet(), storyMode: this.state.mode, seeds: ['card-zone-lab'] });
    const mode = this.seedMode();
    const sig = this.seedSignature();
    const top = ['power', 'lore', 'chaos', 'wonder', 'threat', 'humor', 'melancholy']
      .map((k) => [k, this.dev(k)]).sort((a, b) => b[1] - a[1]).slice(0, 2)
      .map(([k, x]) => k + ' ' + x.toFixed(2)).join(' · ');
    const patch = Object.assign({ mode, seedInfo: top }, this.state.seedRules ? sig : {});
    this.setState(patch, () => this.rebuildWorld());
  }

  /** Welt neu aus dem aktuellen Kontext — Terrain, Palette, Himmel, Zone, Graben, Deck. */
  rebuildWorld() {
    const T = this.T, s = this.state;
    const wc = this.wc = this.WC.makeWorldContext({ cardTriplet: this.triplet(), storyMode: s.mode, seeds: ['card-zone-lab'] });
    // Hoehe und Hub kommen unter Seed-Herrschaft aus dem ENDGUELTIGEN Kontext (sie sind
    // modus-abhaengig), sonst vom Regler.
    const seeded = s.seedRules;
    const hs = seeded ? +(wc.params.heightScale != null ? wc.params.heightScale : 8).toFixed(1) : s.height;
    const ma = seeded ? +(wc.params.motionAmplitude != null ? wc.params.motionAmplitude : 0.3).toFixed(2) : s.amp;
    wc.params.heightScale = hs;
    wc.params.motionAmplitude = ma;
    wc.params.fogDensity = 0.0055;
    if (seeded && (hs !== s.height || ma !== s.amp)) this.state.height = hs, this.state.amp = ma;
    this.terrain.setWorldContext(wc);
    this.terrain.setPalette(wc.palette);
    const sky = new T.Color(wc.palette[0][0], wc.palette[0][1], wc.palette[0][2]).lerp(new T.Color(0x0e0c0a), 0.55);
    this.scene.background = sky;
    this.terrain.setFog([sky.r, sky.g, sky.b], wc.params.fogDensity);
    this.applyCarve();
    const f = FLUIDS[s.fluid];
    if (this.fluidU) { this.fluidU.uCol.value.setRGB(f.col[0], f.col[1], f.col[2]); this.fluidU.uMoat.value = s.moat; }
    if (this.holePuddle) this.holePuddle.material.color.setRGB(f.col[0], f.col[1], f.col[2]);
    this.layoutZone(); this.layoutMoat(); this.layoutFluid(); this.applyZoneLook();
    this.buildStack(); this.poseCard(this.rev || 0);
    this.setState({ status: wc.storyModeName + ' · Biome ' + wc.biome + ' · Seed ' + wc.seed, height: hs, amp: ma });
  }

  chip(active, extra) {
    return 'border:1px solid ' + (active ? '#d8a24a' : '#3a332b') + ';background:' + (active ? '#2a2013' : '#1c1915')
      + ';color:' + (active ? '#f0c274' : '#9b9084') + ";font-family:'Barlow Condensed',sans-serif;font-size:11.5px;font-weight:600;letter-spacing:0.05em;padding:3px 8px;border-radius:3px;cursor:pointer;text-transform:uppercase;" + (extra || '');
  }

  renderVals() {
    const s = this.state, num = (v, d) => Number(v).toFixed(d);
    this._cref = this._cref || ((el) => { if (el && el !== this.canvas) { this.canvas = el; this.boot(); } });
    return {
      canvasRef: this._cref, status: s.status, dockOpen: s.dockOpen,
      dockStyle: 'position:absolute;right:12px;top:12px;bottom:12px;width:' + (s.dockOpen ? '238px' : '38px')
        + ';box-sizing:border-box;display:flex;flex-direction:column;gap:10px;background:#1a1713e6;border:1px solid #2e2822;border-radius:6px;padding:10px;backdrop-filter:blur(6px)',
      dockToggle: this.chip(false, 'align-self:flex-end;padding:2px 7px'),
      dockIcon: s.dockOpen ? '▸' : '◂',
      toggleDock: () => this.set({ dockOpen: !s.dockOpen }),
      plainBtn: this.chip(false, 'align-self:flex-start'),
      cardName: s.cardName, cardMeta: s.cardMeta,
      nextCard: () => { this.cardIdx = (this.cardIdx || 0) + 1; this.placeCard(); },
      seedStyle: this.chip(s.seedRules, 'align-self:flex-start'),
      seedLabel: s.seedRules ? 'Seed steuert Zone' : 'Regler frei',
      toggleSeed: () => { this.setState({ seedRules: !s.seedRules }, () => { if (this.state.seedRules) this.applySeed(); }); },
      seedInfo: s.seedInfo ? s.seedInfo + ' → ' + s.mode : '—',
      seedDerived: s.seedRules
        ? [FLUIDS[s.fluid].label, 'Abnutzung ' + (+s.wear).toFixed(2), 'Graben ' + s.moat, 'Stufen ' + (+s.steps).toFixed(2), 'Deck ' + s.deck].join(' · ')
        : 'Regler überschreiben den Seed',
      pDeck: s.deck, vDeck: (+s.deck).toFixed(0), setDeck: (e) => this.set({ deck: +e.target.value }),
      revealLabel: s.reveal === 'offen' ? 'zudecken' : s.reveal === 'verdeckt' ? 'aufdecken' : '…',
      revealStyle: this.chip(s.reveal === 'offen', 'align-self:flex-start'),
      toggleReveal: () => { if (this.revDir !== 0) return; this.revDir = this.rev >= 1 ? -1 : 1; this.setState({ reveal: 'läuft' }); },
      autoStyle: this.chip(s.autoReveal, 'align-self:flex-start'),
      toggleAuto: () => this.set({ autoReveal: !s.autoReveal }),

      projChips: PROJECTORS.map((p) => ({ label: p.label, style: this.chip(s.proj === p.id), onClick: () => this.set({ proj: p.id }) })),
      fluidChips: Object.keys(FLUIDS).map((k) => ({ label: FLUIDS[k].label, style: this.chip(s.fluid === k), onClick: () => this.set({ fluid: k }) })),
      texChips: COLLAGE.map(([id, label]) => ({ label, style: this.chip(s.tex === id), onClick: () => this.set({ tex: id }) })),
      pRect: s.rect, vRect: num(s.rect, 2), setRect: (e) => this.set({ rect: +e.target.value }),
      pOff: s.off, vOff: num(s.off, 2), setOff: (e) => this.set({ off: +e.target.value }),
      pHolo: s.holo, vHolo: num(s.holo, 2), setHolo: (e) => this.set({ holo: +e.target.value }),
      pSteps: s.steps, vSteps: num(s.steps, 2), setSteps: (e) => this.set({ steps: +e.target.value }),
      pSink: s.sink, vSink: num(s.sink, 1), setSink: (e) => this.set({ sink: +e.target.value }),
      pMoat: s.moat, vMoat: num(s.moat, 0), setMoat: (e) => this.set({ moat: +e.target.value }),
      soundStyle: this.chip(s.sound), fxStyle: this.chip(s.fx),
      toggleSound: () => this.setState({ sound: !s.sound }, () => { if (this.state.sound) this.initAudio(); }),
      toggleFx: () => this.setState({ fx: !s.fx }),
      focusOn: s.focus != null,
      focusKind: s.focus != null ? FACE_KIND[s.focus] : '',
      isArt: s.focus === 0, isChat: s.focus === 5, isText: s.focus != null && s.focus > 0 && s.focus < 5,
      panelRef: this._pref = this._pref || ((el) => { this.panelEl = el; }),
      artRef: this._aref = this._aref || ((el) => this.drawFocusArt(el)),
      closeFocus: () => this.exitFocus(),
      // PDF-ZOOM: die echte Kartentextur in einem Canvas, per CSS transformiert. Ein Canvas statt
      // <img>, weil die Textur des CardBuilders selbst ein Canvas ist — kein Umweg ueber DataURL.
      artStyle: 'position:absolute;left:50%;top:50%;max-width:none;transform-origin:center;'
        + 'transform:translate(-50%,-50%) translate(' + s.panX + 'px,' + s.panY + 'px) scale(' + s.zoom + ');'
        + 'height:' + (100 * 0.98) + '%;image-rendering:auto',
      zoomLabel: 'ZOOM ' + Math.round(s.zoom * 100) + '%',
      zoomBtn: "border:1px solid #2a211840;background:#2a21180d;color:#2a2118;font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 7px;border-radius:2px;cursor:pointer",
      zoomIn: () => this.setState({ zoom: Math.min(6, s.zoom * 1.35) }),
      zoomOut: () => this.setState({ zoom: Math.max(0.6, s.zoom / 1.35) }),
      zoomReset: () => this.setState({ zoom: 1, panX: 0, panY: 0 }),
      onWheel: (e) => {
        e.preventDefault();
        this.setState({ zoom: Math.max(0.6, Math.min(6, s.zoom * (e.deltaY < 0 ? 1.12 : 0.89))) });
      },
      onPanStart: (e) => { this.pan = { x: e.clientX, y: e.clientY, px: s.panX, py: s.panY }; e.currentTarget.setPointerCapture(e.pointerId); },
      onPanMove: (e) => {

      },
      onPanEnd: () => { this.pan = null; },
      chatLines: (s.chat || []).concat(s.typing ? [{ me: false, t: '…' }] : []).map((m) => ({

        // Sprechblasen mit Schatten auf dem Papier-Grund, keine helle Box — wie im Cube-Academy-UI.
        bubble: 'max-width:78%;padding:8px 12px;border-radius:' + (m.me ? '12px 12px 3px 12px' : '12px 12px 12px 3px')
          + ';background:' + (m.me ? '#2a2118' : '#fffaf0') + ';color:' + (m.me ? '#efe6d0' : '#2a2118')
          + ';font-size:15px;line-height:1.4;box-shadow:0 2px 6px #2a211826;text-wrap:pretty',
      })),
      draft: s.draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      onDraftKey: (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.sendChat(); } },
      onSend: () => { if ((s.draft || '').trim()) this.sendChat(); },
      // VOICE FIRST: ohne Text steht das Mikrofon, mit Text wird daraus Senden.
      sendIcon: (s.draft || '').trim() ? '➤' : '🎙',
      sendTitle: (s.draft || '').trim() ? 'Senden' : 'Sprechen',
      sendStyle: 'flex:none;width:38px;height:38px;border-radius:50%;cursor:pointer;border:1px solid #2a211840;'
        + 'background:' + ((s.draft || '').trim() ? '#2a2118' : '#2a21180d') + ';color:' + ((s.draft || '').trim() ? '#efe6d0' : '#2a2118')
        + ';font-size:15px;display:flex;align-items:center;justify-content:center',
      blocks: this.focusBlocks(),
      riverStyle: this.chip(s.river, 'align-self:flex-start'),
      riverLabel: s.river ? 'Fluss an' : 'Fluss aus',
      toggleRiver: () => this.set({ river: !s.river }),
      pRiverW: s.riverW, vRiverW: num(s.riverW, 0), setRiverW: (e) => this.set({ riverW: +e.target.value }),
      pWear: s.wear, vWear: num(s.wear, 2), setWear: (e) => this.set({ wear: +e.target.value }),
      pScale: s.scale, vScale: num(s.scale, 2), setScale: (e) => this.set({ scale: +e.target.value }),
      pHeight: s.height, vHeight: num(s.height, 1), setHeight: (e) => this.set({ height: +e.target.value }),
      pAmp: s.amp, vAmp: num(s.amp, 2), setAmp: (e) => this.set({ amp: +e.target.value }),
      pTempo: s.tempo, vTempo: num(s.tempo, 2), setTempo: (e) => this.set({ tempo: +e.target.value }),
      flowStyle: this.chip(!!s.flow), flowLabel: s.flow ? 'Flow-Welle' : 'Dancefloor',
      toggleFlow: () => this.set({ flow: s.flow ? 0 : 1 }),
      spinStyle: this.chip(s.spin), beamStyle: this.chip(s.beam),
      toggleSpin: () => this.set({ spin: !s.spin }),
      toggleBeam: () => this.set({ beam: !s.beam }),
    };
  }
}
</script>
</body>
</html>
