<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="kfb-build" content="KFB-HYBRID-SEAM-LAB-01">
<title>KFB ToolBox · Hybrid Surface Seam Lab</title>
<link rel="icon" href="data:,">
<style>
:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;background:#171817;color:#f0e9dd}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#171817}
#stage{position:fixed;inset:0;background:radial-gradient(circle at 47% 34%,#504a3f 0,#2a2b27 44%,#171817 100%)}
canvas.webgl{display:block;width:100%;height:100%}
header{position:fixed;left:0;right:0;top:0;z-index:6;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:10px 14px;background:linear-gradient(#111212ec,#111212ad,transparent);pointer-events:none}
.title{font-weight:850;font-size:13px;letter-spacing:.04em}.sub{font:9px/1.4 ui-monospace,monospace;color:#c8bfb1;margin-top:3px}
.badge{font:9px ui-monospace,monospace;border:1px solid #e2ba7138;padding:5px 7px;border-radius:4px;color:#efd49f;background:#171512b8}
.controls{position:fixed;left:50%;bottom:11px;z-index:7;transform:translateX(-50%);display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:center;width:min(1120px,calc(100vw - 18px));padding:7px;border:1px solid #ffffff22;background:#151716ea;backdrop-filter:blur(8px);border-radius:7px}
button,select,input{font:10px system-ui}button,select{cursor:pointer;padding:6px 8px;border-radius:5px;border:1px solid #ffffff24;background:#292b28;color:#eee7da}button.active{background:#604c30;border-color:#d3ae6d}
label{display:flex;gap:5px;align-items:center;font:9px ui-monospace,monospace;color:#c8c0b4}input[type=range]{width:84px}.sep{width:1px;height:23px;background:#ffffff1f;margin:0 2px}
#status{position:fixed;right:12px;bottom:60px;z-index:5;font:9px/1.45 ui-monospace,monospace;text-align:right;color:#d0c7b9;text-shadow:0 1px 4px #000;max-width:390px}
#status strong,#measurements strong{color:#f0d39a}.error{color:#ff9b8f!important}
#measurements{position:fixed;left:12px;bottom:60px;z-index:5;width:min(470px,45vw);font:8px/1.35 ui-monospace,monospace;background:#101111c9;border:1px solid #ffffff1b;border-radius:5px;padding:7px 8px;color:#c9c0b3}
#measurements>div{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #ffffff0e;padding-top:3px;margin-top:3px}#measurements span{text-align:right}
#mask{position:fixed;right:12px;top:50px;z-index:4;width:74px;padding:4px;background:#101111c7;border:1px solid #ffffff22;border-radius:5px}
#mask canvas{display:block;width:64px;height:64px}#mask span{display:block;text-align:center;font:7px/1.2 ui-monospace,monospace;color:#c7bbaa;margin-top:3px}
@media(max-width:820px){
 .controls{bottom:7px}.sep{display:none}#measurements{display:none}#status{left:9px;right:auto;text-align:left;bottom:104px;max-width:235px}#mask{width:58px;right:8px;top:46px}#mask canvas{width:48px;height:48px}.sub{display:none}
}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="stage"></div>
<header>
  <div><div class="title">KFB ToolBox · Hybrid Surface Seam Lab</div><div class="sub">EXACT DONORS · legacy repeat seam vs truly tileable toroidal macro · same clay/grain and scale</div></div>
  <div class="badge">SEAM-ONLY CANDIDATE</div>
</header>
<div id="mask"><div id="maskMount"></div><span>tileable shared RGB macro<br>+ unchanged 3D grain</span></div>
<div id="measurements">Measuring exact head proxies…</div>
<div id="status">Loading exact donors…</div><div id="edgeOut" style="position:fixed;right:12px;top:128px;z-index:5;font:8px ui-monospace,monospace;color:#efd49f;background:#101111c7;border:1px solid #ffffff1b;border-radius:4px;padding:5px 7px">edge test pending…</div>
<div class="controls" aria-label="Hybrid Surface v2 controls">
  <button data-view="integrated" class="active">Dungeon + Cast</button>
  <button data-view="room">Room</button>
  <button data-view="cast">Cast</button>
  <button data-view="actor">Actor isolate</button>
  <select id="actorSelect" aria-label="Isolated exact actor"></select>
  <button data-view="seam">Seam close-up</button>
  <span class="sep"></span>
  <button data-look="original">Original</button>
  <button data-look="hybrid" class="active">Hybrid material</button>
  <span class="sep"></span>
  <button data-macro-mode="legacy">Legacy non-tileable</button>
  <button data-macro-mode="tileable" class="active">Tileable macro</button>
  <span class="sep"></span>
  <label>Surface <b id="strengthOut">0.62</b><input id="strength" type="range" min="0" max=".9" step=".01" value=".62"></label>
  <label>Macro <b id="macroOut">XL</b><input id="macro" type="range" min=".35" max="1.3" step=".05" value=".72"></label>
  <label>Grain <b id="grainOut">0.52</b><input id="grain" type="range" min="0" max="1" step=".01" value=".52"></label>
</div>
<script type="module" src="./lab.mjs"></script>
</body>
</html>
