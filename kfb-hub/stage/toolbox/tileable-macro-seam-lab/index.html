<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="kfb-build" content="KFB-TILEABLE-MACRO-SEAM-01">
<title>KFB ToolBox · Tileable Macro Seam Lab</title>
<link rel="icon" href="data:,">
<style>
:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;background:#171817;color:#efe8dc}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
#stage{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,#4b463d,#282925 48%,#151615 100%)}
canvas.webgl{display:block;width:100%;height:100%}
header{position:fixed;left:0;right:0;top:0;z-index:6;display:flex;justify-content:space-between;gap:16px;padding:10px 14px;background:linear-gradient(#111212ec,#111212a8,transparent);pointer-events:none}
.title{font-weight:850;font-size:13px;letter-spacing:.04em}.sub{font:9px/1.4 ui-monospace,monospace;color:#c9c0b3;margin-top:3px}
.badge{font:9px ui-monospace,monospace;color:#efd49d;border:1px solid #efd49d33;border-radius:4px;padding:5px 7px;background:#171512b7}
.controls{position:fixed;left:50%;bottom:10px;z-index:7;transform:translateX(-50%);display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;width:min(980px,calc(100vw - 18px));padding:7px;border:1px solid #ffffff22;background:#151716e9;backdrop-filter:blur(8px);border-radius:7px}
button{font:10px system-ui;cursor:pointer;padding:6px 9px;border-radius:5px;border:1px solid #ffffff24;background:#292b28;color:#eee7da}button.active{background:#654f31;border-color:#d7b275}
.sep{width:1px;height:23px;background:#ffffff20}
#status{position:fixed;right:12px;bottom:58px;z-index:5;font:9px/1.5 ui-monospace,monospace;text-align:right;color:#cec5b8;text-shadow:0 1px 4px #000;max-width:420px}
#status strong{color:#f0d49b}.error{color:#ff9b8f!important}
#preview{position:fixed;left:12px;bottom:58px;z-index:5;width:210px;background:#101111d0;border:1px solid #ffffff20;border-radius:5px;padding:6px}
#preview .row{display:grid;grid-template-columns:1fr 1fr;gap:5px}#preview canvas{display:block;width:96px;height:96px;image-rendering:auto}#preview .label{font:8px ui-monospace,monospace;color:#c7bdaf;text-align:center;margin-top:3px}
#metric{font:8px/1.4 ui-monospace,monospace;color:#c7bdaf;margin-top:5px}
@media(max-width:760px){#preview{display:none}#status{left:9px;right:auto;text-align:left;bottom:92px;max-width:235px}.sub{display:none}.sep{display:none}}
</style>
<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="stage"></div>
<header>
 <div><div class="title">KFB ToolBox · Tileable Macro Seam Lab</div><div class="sub">exact World Atlas Dungeon + GothGirl + FrizzleBob · same v2 material · only macro source changes</div></div>
 <div class="badge">SEAM-ONLY GATE</div>
</header>
<div id="preview"><div class="row"><div><div id="oldMount"></div><div class="label">OLD REPEAT</div></div><div><div id="newMount"></div><div class="label">TILEABLE</div></div></div><div id="metric">measuring edges…</div></div>
<div id="status">Loading exact donors…</div>
<div class="controls">
 <button data-view="seam" class="active">Wall seam close-up</button>
 <button data-view="integrated">Room + actors</button>
 <span class="sep"></span>
 <button data-look="original">Original</button>
 <button data-look="old">Old repeat</button>
 <button data-look="tileable" class="active">Tileable macro</button>
</div>
<script type="module" src="./lab.mjs"></script>
</body>
</html>
