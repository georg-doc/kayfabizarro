<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="icon" href="data:,">
<title>KFB Race · Interim HUD 2D v1</title>
<link rel="stylesheet" href="./hud-2d.css">
<script>
window.OW_SRC={
  kfb:(p='')=>'https://raw.githubusercontent.com/georg-doc/kayfabizarro/8d534f013710d4aa57d1ca2baa7358b2957c35a5/media/kfb/'+p,
  rel:(p,self,fallback)=>'https://raw.githubusercontent.com/georg-doc/kayfabizarro/8d534f013710d4aa57d1ca2baa7358b2957c35a5/'+fallback
};
</script>
<script src="https://cdn.jsdelivr.net/gh/georg-doc/kayfabizarro@8d534f013710d4aa57d1ca2baa7358b2957c35a5/overworld/overworld/card-art-2d.js"></script>
</head>
<body>
<iframe id="driveHost" title="KFB Race v0.8 host"></iframe>

<div id="hud2d" aria-label="KFB clean racer HUD">
  <section id="radioDock" class="dock radioDock" aria-label="Radio">
    <div class="radioMeta">
      <span class="eyebrow">KFB RADIO</span>
      <strong id="radioTitle">RADIO OFF</strong>
    </div>
    <div class="radioActions">
      <button id="radioPlay" type="button" aria-label="Play or pause music">▶</button>
      <button id="radioNext" type="button" aria-label="Next track">»</button>
      <input id="radioVolume" aria-label="Radio volume" type="range" min="0" max="1" step="0.05" value="0.45">
    </div>
  </section>

  <section id="speedDock" class="dock speedDock" aria-label="Speed and drive state">
    <div class="dial" aria-hidden="true">
      <i id="needle"></i>
    </div>
    <div class="speedReadout">
      <strong id="speedValue">0</strong>
      <span class="unit">KM/H</span>
    </div>
    <div class="driveState">
      <b id="driveState">GRIP</b>
      <span id="boostState">BOOST</span>
    </div>
    <div class="boostRail"><i id="boostRailFill"></i></div>
  </section>

  <section id="almanacDock" class="almanacDock" tabindex="0" aria-label="Fractal Almanac">
    <div id="almanacCards"></div>
  </section>

  <div id="hudState" aria-live="polite">HUD connecting…</div>
</div>

<div id="failure" hidden></div>
<script type="module" src="./hud-2d.mjs"></script>
</body>
</html>
