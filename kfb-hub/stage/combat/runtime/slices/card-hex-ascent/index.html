<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card-Hex Ascent · KFB Combat</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
<style>
  :root { --ink: #1f1a14; --paper: #f3ead3; --cream: #fbf5e6; --gold: #f2c94c; --red: #c8452f; }
  html, body { margin: 0; height: 100%; background: #1f1a14; overflow: hidden; font-family: ui-rounded, "Avenir Next", system-ui, sans-serif; color: var(--ink); }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .hud-top { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; }
  .hud-zone, .hud-stats { background: var(--paper); border: 3px solid var(--ink); border-radius: 12px; padding: 6px 12px; box-shadow: 3px 3px 0 var(--ink); }
  .hud-zone b { display: block; font-size: 15px; } .hud-zone span { font-size: 12.5px; opacity: .85; }
  .hud-stats { display: flex; gap: 14px; align-items: center; font-weight: 700; font-size: 15px; }
  #hz-hearts { color: var(--red); letter-spacing: 1px; } #hz-coins { color: #9a7413; } #hz-mode { font-size: 12px; font-weight: 600; opacity: .8; }
  .hud-msg { position: absolute; left: 50%; top: 18%; transform: translate(-50%, -6px); background: var(--cream); border: 3px solid var(--ink); border-radius: 14px; padding: 8px 16px; font-weight: 700; opacity: 0; transition: opacity .2s, transform .2s; box-shadow: 3px 3px 0 var(--ink); max-width: min(90vw, 560px); text-align: center; }
  .hud-msg.on { opacity: 1; transform: translate(-50%, 0); }
  .hud-cross { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px; border: 2px solid var(--cream); border-radius: 50%; box-shadow: 0 0 0 2px var(--ink); display: none; }
  .hud-cross.lock { border-color: var(--gold); }
  .hud-keys { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 12px; color: var(--cream); text-shadow: 0 1px 2px #000; padding: 0 16px; }
  .hud-panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--paper); border: 4px solid var(--ink); border-radius: 18px; padding: 18px 24px; text-align: center; pointer-events: auto; box-shadow: 6px 6px 0 var(--ink); width: min(88vw, 440px); }
  .hud-panel h1 { margin: 0 0 6px; font-size: 26px; } .hud-panel p { margin: 6px 0; font-size: 14px; } .hud-panel .small { font-size: 12px; opacity: .7; }
  .hud-panel button { margin-top: 10px; font: inherit; font-weight: 800; font-size: 17px; padding: 10px 22px; border: 3px solid var(--ink); border-radius: 12px; background: var(--gold); cursor: pointer; box-shadow: 3px 3px 0 var(--ink); }
  .hud-panel button:disabled { opacity: .5; cursor: wait; }
  .hud-panel table { margin: 8px auto; border-collapse: collapse; font-size: 14px; } .hud-panel td { padding: 3px 10px; text-align: left; } .hud-panel td + td { text-align: right; font-weight: 700; }
  .hidden { display: none; }
  @media (max-width: 640px) { .hud-top { flex-direction: column; } .hud-keys { display: none; } }
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud"></div>
<script type="module" src="./main.mjs"></script>
</body>
</html>
