<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>SimBlood · Flexikon Embed Design Donor</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="embed-shell" aria-label="SimBlood Flexikon Embed Design Donor">
  <section class="embed-stage">
    <div class="brand-chip" aria-label="SimBlood">SimBlood</div>

    <div class="preset-dock" aria-label="Präparat auswählen">
      <button type="button" data-preset="normal" class="active">Normal</button>
      <button type="button" data-preset="iron_deficiency">Eisenmangel</button>
      <button type="button" data-preset="tma">TMA</button>
    </div>

    <button class="cells-trigger" id="cellsTrigger" type="button" aria-expanded="false" aria-controls="cellsPopover">
      Zellen
      <span aria-hidden="true">⌄</span>
    </button>

    <div class="cells-popover" id="cellsPopover" hidden>
      <div class="popover-title">Zelltyp</div>
      <button type="button" data-cell-mock="normal_erythrocyte">Erythrozyt</button>
      <button type="button" data-cell-mock="normal_platelet">Thrombozyt</button>
      <button type="button" data-cell-mock="segmented_neutrophil">Neutrophiler</button>
      <button type="button" data-cell-mock="mature_lymphocyte">Lymphozyt</button>
      <button type="button" data-cell-mock="monocyte">Monozyt</button>
      <div class="popover-note">Design-Donor: Zellfilter noch nicht an Runtime gekoppelt.</div>
    </div>

    <div class="scope" id="scope" aria-label="Simulierter peripherer Blutausstrich">
      <canvas id="smearCanvas"></canvas>
      <div class="scope-glass" aria-hidden="true"></div>
      <div class="debug-label" id="debugLabel" hidden></div>
    </div>

    <div class="interaction-hint">Ziehen · Scroll/Pinch zum Zoomen · Zelle antippen</div>

    <div class="micro-controls" aria-label="Mikroskop-Steuerung">
      <button type="button" data-objective="40">40×</button>
      <button type="button" data-objective="100" class="active">100×</button>
      <label class="focus-compact">
        <span>Fokus</span>
        <input id="focus" type="range" min="0" max="6" value="0" step="0.1">
      </label>
      <button type="button" id="resetView" aria-label="Ansicht zurücksetzen">↺</button>
    </div>

    <div class="design-note" id="designNote" hidden></div>

    <!-- Hidden compatibility nodes required by the current renderer snapshot. -->
    <div class="compat" aria-hidden="true">
      <span id="focusLabel">0.0</span>
      <span id="objectiveLabel">100×</span>
      <span id="status"></span>
      <span id="recipeSummary"></span>
      <span id="rbcCount"></span>
      <span id="wbcCount"></span>
      <span id="pltCount"></span>
      <button type="button" id="newSeed"></button>
      <button type="button" data-wbc-mode="real" class="active"></button>
      <button type="button" data-wbc-mode="procedural"></button>
    </div>
  </section>
</main>
<script src="./renderer-snapshot.js"></script>
<script src="./ui-donor.js"></script>
</body>
</html>
