<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KFB Race · v0.10 Facility Topology</title>
<link rel="stylesheet" href="./style.css">
<script type="importmap">{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}</script>
</head>
<body>
<main id="app">
  <canvas id="view" aria-label="KFB Race v0.10 topology blockout"></canvas>
  <header>
    <div>
      <div class="eyebrow">KFB STUNT CAR RACE · TOPOLOGY GATE</div>
      <h1>Facility v0.10</h1>
      <p>Main loop, pit lane and overpass are separate concepts.</p>
    </div>
    <div class="controls">
      <button id="top">TOP</button>
      <button id="iso" class="active">ISO</button>
      <button id="pit">PIT ON</button>
      <button id="anchors">ANCHORS ON</button>
    </div>
  </header>
  <aside id="status">
    <strong id="pass">CHECKING…</strong>
    <span id="facts"></span>
  </aside>
  <section id="legend">
    <span><i class="main"></i>Main route</span>
    <span><i class="pit"></i>Pit/service</span>
    <span><i class="bridge"></i>Upper bridge</span>
  </section>
  <div id="labels"></div>
  <footer>
    Topology candidate only · no driving physics attached · v0.8 feel remains untouched
  </footer>
</main>
<script type="module" src="./app.mjs"></script>
</body>
</html>
