, r: Math.floor(p.y / this.T) }; }\n\n  /** Ein Editor-Schritt auf der Welt; `drag` = true bei gezogenem Pinsel. */\n  edApply(p, drag) {\n    const t = this.state.tool, { c, r } = this.cellOf(p);\n    if (t[0] === 'h') {\n      const v = +t[1];\n      if (!this.mapLvl[r]) return;\n      for (const [dc, dr] of [[0,0],[1,0],[0,1],[1,1]]) {\n        const rr = r + dr, cc = c + dc;\n        if (this.mapLvl[rr] && this.land[rr] && this.land[rr][cc]) this.mapLvl[rr][cc] = v;\n      }\n      this.edDirty = true;\n      return;\n    }\n    if (drag) {\n      if (t === 'move' && this.edSel) {\n        const b = this.edSel;\n        b.x = Math.round((p.x - 32) / 64) * 64 + 32;\n        b.y = Math.round((p.y - 32) / 64) * 64 + 32;\n        this.edDirty = true;\n      }\n      return;\n    }\n    if (t === 'move') { this.edSel = this.buildingAt(p.x, p.y) || null; this.edSay(this.edSel ? this.edSel.label + ' gegriffen' : 'kein Gebäude hier'); return; }\n    if (t === 'wp') {\n      let near = -1, bd = 1e9;\n      this.WP.forEach((w, i) => { const d = Math.hypot(w.x - p.x, w.y - p.y); if (d < bd) { bd = d; near = i; } });\n      if (bd < 46) {\n        if (this.edWp === null || this.edWp === undefined) { this.edWp = near; this.edSay('Wegpunkt ' + near + ' gewählt'); }\n        else if (this.edWp === near) { this.edWp = null; this.edSay('Auswahl aufgehoben'); }\n        else { this.EDGES.push([this.edWp, near]); this.buildAdj(); this.edDo('Kante ' + this.edWp + '→' + near); this.edWp = null; this.edDirty = true; }\n      } else {\n        const q = this.snapWalkable(p);\n        if (!q) { this.edSay('hier nicht: Wasser oder Mauer'); return; }\n        const i = this.WP.push(q) - 1;\n        if (this.edWp !== null && this.edWp !== undefined) { this.EDGES.push([this.edWp, i]); this.buildAdj(); }\n        this.edWp = i; this.edDo('Wegpunkt ' + i + ' gesetzt'); this.edDirty = true;\n      }\n      return;\n    }\n    if (t === 'fc' || t === 'fu') {\n      const fc = this.facOf(this.state.fac);\n      this.mapCamps = this.mapCamps || []; this.funits = this.funits || [];\n      if (t === 'fc') {\n        const hit = this.mapCamps.findIndex(c => Math.hypot(c.x - p.x, c.y - p.y) < 70);\n        if (hit >= 0) {\n          const gone = this.mapCamps.splice(hit, 1)[0];\n          this.edDirty = true; this.edDo('Lager ' + this.facOf(gone.fac).name + ' entfernt'); return;\n        }\n        if (!fc.camp) { this.edSay('kein Bau im Pack: ' + fc.name); return; }\n        const q = this.snapFac(p, fc, 4);\n        if (!q) { this.edSay(fc.water ? 'hier nicht: kein Wasser' : 'hier nicht: Wasser oder Mauer'); return; }\n        const rr = this.state.revier;\n        this.mapCamps.push({ fac: fc.id, x: q.x, y: q.y, r: rr });\n        // Ein Lager kommt nicht allein: vier Einheiten aus dem eigenen Kader ins Revier.\n        const us = this.facUnits(fc);\n        for (let k = 0; k < 4 && us.length; k++) {\n          const ang = k / 4 * 6.283, d = rr * .42;\n          const pt = this.snapFac({ x: q.x + Math.cos(ang) * d, y: q.y + Math.sin(ang) * d }, fc, 3);\n          if (pt) this.funits.push({ fac: fc.id, unit: us[k % us.length].id, x: pt.x, y: pt.y, flip: Math.cos(ang) < 0, ph: Math.random() * 6 });\n        }\n        this.facEnsure(fc); this.edDirty = true;\n        this.edDo('Lager ' + fc.name + ' gesetzt');\n        return;\n      }\n      const hit = this.funits.findIndex(u => Math.hypot(u.x - p.x, u.y - p.y) < 44);\n      if (hit >= 0) { this.funits.splice(hit, 1); this.edDirty = true; this.edDo('Einheit entfernt'); return; }\n      const us = this.facUnits(fc);\n      if (!us.length) { this.edSay('kein Kader im Pack: ' + fc.name); return; }\n      const uid = us.some(u => u.id === this.state.facUnit) ? this.state.facUnit : us[0].id;\n      const q = this.snapFac(p, fc, 3);\n      if (!q) { this.edSay(fc.water ? 'hier nicht: kein Wasser' : 'hier nicht: Wasser oder Mauer'); return; }\n      this.funits.push({ fac: fc.id, unit: uid, x: q.x, y: q.y, flip: Math.random() < .5, ph: Math.random() * 6 });\n      this.facEnsure(fc); this.edDirty = true;\n      this.edDo(us.find(u => u.id === uid).label + ' gesetzt');\n      return;\n    }\n    if (t === 'stair') {\n      const c = Math.floor(p.x / this.T);\n      this.mapStairs = this.mapStairs || new Set();\n      if (this.mapStairs.has(c)) { this.mapStairs.delete(c); this.edDo('Treppe entfernt (Spalte ' + c + ')'); }\n      else { this.mapStairs.add(c); this.edDo('Treppe gesetzt (Spalte ' + c + ')'); }\n      this.edDirty = true;\n      return;\n    }\n    if (t[0] === 'd') {\n      // Klick auf eine bestehende Requisite entfernt sie, sonst wird gesetzt — wie beim Abbau-Ort.\n      const hit = (this.deco || []).findIndex(d => Math.hypot(d.x - p.x, d.y - p.y) < (d.kind === 'tree' ? 46 : 26));\n      if (hit >= 0) {\n        const gone = this.deco.splice(hit, 1)[0];\n        this.freezeDeco(); this.edDirty = true;\n        this.edDo((gone.kind === 'tree' ? 'Baum' : gone.kind === 'bush' ? 'Busch' : 'Stein') + ' entfernt');\n        return;\n      }\n      const T = this.T, dc = Math.floor(p.x / T), dr = Math.floor(p.y / T);\n      if (!(this.land && this.land[dr] && this.land[dr][dc])) { this.edSay('hier nicht: Wasser'); return; }\n      const kind = t === 'dt' ? 'tree' : t === 'db' ? 'bush' : 'rock';\n      if (kind === 'tree') this.deco.push({ kind: 'tree', x: p.x, y: p.y, f: Math.floor(Math.random() * 4) });\n      else this.deco.push({\n        kind, x: p.x, y: p.y,\n        key: 'd' + (kind === 'bush' ? 1 + Math.floor(Math.random() * 4) : 9 + Math.floor(Math.random() * 4)),\n        s: 0.8 + Math.random() * 0.5\n      });\n      this.freezeDeco(); this.edDirty = true;\n      this.edDo((kind === 'tree' ? 'Baum' : kind === 'bush' ? 'Busch' : 'Stein') + ' gesetzt');\n      return;\n    }\n    if (t[0] === 'n') {\n      const res = t === 'nw' ? 'wood' : t === 'ng' ? 'gold' : 'meat';\n      const hit = (this.nodes || []).findIndex(n => Math.hypot(n.x - p.x, n.y - p.y) < 40);\n      if (hit >= 0) {\n        const gone = this.nodes.splice(hit, 1)[0];\n        this.mapNodes = this.nodes.map(n => ({ res: n.res, x: n.x, y: n.y, vein: n.vein }));\n        if (gone.res === 'meat') this.sheep = this.sheep.filter(sh => Math.hypot(sh.x + 42 - gone.x, sh.y + 18 - gone.y) > 8);\n        this.edDirty = true; this.edDo('Abbau-Ort entfernt'); return;\n      }\n      const q = this.snapWalkable(p);\n      if (!q) { this.edSay('hier nicht: Wasser oder Mauer'); return; }\n      this.nodes.push({ res, x: q.x, y: q.y, vein: Math.random() < .5 ? 'vein' : 'veinS' });\n      this.mapNodes = this.nodes.map(n => ({ res: n.res, x: n.x, y: n.y, vein: n.vein }));\n      if (res === 'meat') this.sheep.push({ x: q.x - 42, y: q.y - 18, ph: Math.random() * 6, flip: Math.random() < .5 });\n      this.edDirty = true;\n      this.edDo(res + '-Abbau gesetzt');\n      return;\n    }\n    if (t === 'spawn') {\n      const q = this.snapWalkable(p);\n      if (!q) { this.edSay('hier nicht: Wasser oder Mauer'); return; }\n      this.PLAZA = q;\n      this.edDo('Spawn gesetzt'); this.edDirty = true;\n    }\n  }\n\n  edSay(m) { this.setState({ edMsg: m }); }\n  /** Handlung, die den Neuaufbau überleben soll: `edCommit()` stellt sie vor den Befund. */\n  edDo(m) { this.edAct = m; this.edSay(m); }\n\n  /** Begehbar: Land, keine Höhenstufe, keine Klippenwand. Eine Prüfung für alle Knoten. */\n  walkableCell(c, r) { return !!(this.land && this.land[r] && this.land[r][c]) && !this.stepped(c, r); }\n\n  /** Welt-Punkt auf die nächste begehbare Zellmitte einrasten; `null` = hier geht es nicht.\n   *  Jeder Schreibweg des Editors läuft hierdurch — sonst prüft am Ende wieder nur einer. */\n  snapWalkable(p, rad) {\n    const T = this.T;\n    let c = Math.floor(p.x / T), r = Math.floor(p.y / T);\n    if (!this.walkableCell(c, r)) {\n      let found = null;\n      for (let d = 1; d <= (rad || 3) && !found; d++)\n        for (let dr = -d; dr <= d && !found; dr++)\n          for (let dc = -d; dc <= d; dc++)\n            if (this.walkableCell(c + dc, r + dr)) { found = { c: c + dc, r: r + dr }; break; }\n      if (!found) return null;\n      c = found.c; r = found.r;\n    }\n    return { x: c * T + T / 2, y: r * T + T / 2 };\n  }\n\n  /** Das GANZE Netz prüfen — jeder Knoten begehbar, jede Kante ohne Wasser und ohne Mauer.\n   *  Ohne das kann das Panel „ok\" melden, während der Editor eine Straße übers Meer gelegt hat. */\n  checkGraph() {\n    const T = this.T, say = m => (this.warn = this.warn || []).push(m);\n    this.WP.forEach((w, i) => {\n      if (!this.walkableCell(Math.floor(w.x / T), Math.floor(w.y / T))) say('[R2] Wegpunkt ' + i + ' liegt im Wasser oder auf der Stufe');\n    });\n    (this.nodes || []).forEach((n, i) => {\n      if (!this.walkableCell(Math.floor(n.x / T), Math.floor(n.y / T))) say('[R2] Abbau-Ort ' + i + ' (' + n.res + ') liegt im Wasser oder auf der Stufe');\n    });\n    if (!this.walkableCell(Math.floor(this.PLAZA.x / T), Math.floor(this.PLAZA.y / T))) say('[R2] Spawn liegt im Wasser oder auf der Stufe');\n    // R6 — Anschluss. Eine Kante kann begehbar UND gemalt sein und trotzdem nirgendwohin führen:\n    // zwei Wegstücke, die aneinander vorbeilaufen, sind zwei getrennte Netze. Bis v4 hat das\n    // niemand geprüft, weil jede Prüfung eine Kante für sich ansah. Hier zählt die Erreichbarkeit\n    // vom Marktplatz aus — das ist die Frage, die der Nutzer im Bild sieht.\n    const start = this.nearestWp(this.PLAZA);\n    const seen = new Set([start]); const q0 = [start];\n    while (q0.length) {\n      const i = q0.shift();\n      // `adj` ist eine Map — `adj[i]` ist immer `undefined`. `bfs()` macht es richtig, dieser Block\n      // tat es nicht, und die Prüfung meldete deshalb ausnahmslos alles als abgehängt (#76).\n      for (const j of (this.adj && this.adj.get(i)) || []) if (!seen.has(j)) { seen.add(j); q0.push(j); }\n    }\n    if (seen.size < this.WP.length) {\n      const lost = [];\n      for (const b of this.BUILDINGS) if (b.wp !== undefined && !seen.has(b.wp)) lost.push(b.label || b.id);\n      say('[R6] ' + (this.WP.length - seen.size) + ' Wegpunkt(e) ohne Anschluss an den Marktplatz'\n        + (lost.length ? ' — betrifft ' + lost.join(', ') : ''));\n    }\n    for (const [a, b] of this.EDGES) {\n      const p = this.WP[a], q = this.WP[b];\n      if (!p || !q) continue;\n      const n = Math.max(2, Math.ceil(Math.hypot(q.x - p.x, q.y - p.y) / 32));\n      for (let k = 0; k <= n; k++) {\n        const x = p.x + (q.x - p.x) * k / n, y = p.y + (q.y - p.y) * k / n;\n        if (!this.walkableCell(Math.floor(x / T), Math.floor(y / T))) { say('[R2] Kante ' + a + '→' + b + ' kreuzt Wasser oder Mauer'); break; }\n      }\n    }\n  }\n\n  /** Nach einem Schritt: Terrain neu ableiten, Türen und Claims neu rechnen, Befunde melden. */\n  edCommit() {\n    if (!this.edDirty) return;\n    this.edDirty = false;\n    this._foot = null;\n    this._leyMap = null; this._ley = null;       // Türen und Netz können gewandert sein\n    this.warn = [];                     // Befunde sammeln, bevor irgendwer welche schreibt\n    this.deriveLvl();                   // Maske zuerst (ohne zu malen) …\n    this.layoutDoors();                 // … dann die Türen …\n    const old = console.warn;\n    console.warn = (...a) => { this.warn.push(a.join(' ')); old(...a); };\n    this.computeClaims();\n    console.warn = old;\n    this.buildWorld();                  // … und erst dann die Sandmaske und das Bild\n    this.checkGraph();                  // Netz zum Schluss prüfen: erst jetzt stehen Höhe und Land fest\n    this.checkDeco();                   // und die Requisiten, die jetzt nicht mehr von selbst wegwandern\n    this.checkFacs();                   // R5: Revier, Grundart, Übergriff auf einen Nexus-Claim\n    const act = this.edAct; this.edAct = null;\n    this.edSay(this.warn.length ? this.warn.length + ' Befund(e): ' + this.warn[0]\n      : act ? act + ' · ok' : 'ok — keine Befunde');\n  }\n\n  /** Requisiten prüfen. Seit sie Daten sind, korrigiert sie kein Neuaufbau mehr stumm —\n   *  wer die Höhe unter einen Baum malt, bekommt einen Befund statt eines verschwundenen Baums. */\n  checkDeco() {\n    const T = this.T; let bad = 0;\n    for (const d of this.deco || []) {\n      const c = Math.floor(d.x / T), r = Math.floor(d.y / T);\n      if (!(this.land && this.land[r] && this.land[r][c]) || this.stepped(c, r)) bad++;\n    }\n    if (bad) (this.warn = this.warn || []).push('[R4] ' + bad + ' Requisite(n) im Wasser oder an der Klippe');\n  }\n\n  /* ---- Undo: die Karte ist Daten, ein Schritt ist eine Kopie dieser Daten. 20 tief, Redo spiegelbildlich.\n     Ein Schritt = eine Maus-Gestik, ein Import oder ein geladener Slot — nicht jeder gemalte Pinselpunkt. */\n  edSnap() {\n    return {\n      lvl: (this.mapLvl || []).map(row => row.slice()),\n      b: this.BUILDINGS.map(b => ({ id: b.id, x: b.x, y: b.y })),\n      wp: this.WP.map(w => ({ x: w.x, y: w.y })),\n      eg: this.EDGES.map(e => e.slice()),\n      nodes: (this.mapNodes || []).map(n => ({ ...n })),\n      deco: (this.mapDeco || []).map(d => ({ ...d })),\n      stairs: [...(this.mapStairs || [])],\n      camps: (this.mapCamps || []).map(c => ({ ...c })),\n      funits: (this.funits || []).map(u => ({ ...u })),\n      kader: (this.kader || []).map(k => (k ? { ...k } : null)),\n      plaza: { ...this.PLAZA }\n    };\n  }\n  edRestore(s) {\n    for (let r = 0; r < this.ROWS; r++) for (let c = 0; c < this.COLS; c++) this.mapLvl[r][c] = s.lvl[r] ? (s.lvl[r][c] || 0) : 0;\n    for (const p of s.b) { const b = this.BUILDINGS.find(x => x.id === p.id); if (b) { b.x = p.x; b.y = p.y; } }\n    this.WP = s.wp.map(w => ({ ...w }));\n    this.EDGES = s.eg.map(e => e.slice());\n    this.buildAdj();\n    this.mapNodes = s.nodes.map(n => ({ ...n }));\n    this.nodes = this.mapNodes.map(n => ({ ...n, vein: n.vein || 'vein' }));\n    this.sheep = this.nodes.filter(n => n.res === 'meat').map(n => ({ x: n.x - 42, y: n.y - 18, ph: Math.random() * 6, flip: false }));\n    this.mapDeco = s.deco.map(d => ({ ...d }));\n    this.mapStairs = new Set(s.stairs || []);\n    this.mapCamps = (s.camps || []).map(c => ({ ...c }));\n    this.funits = (s.funits || []).map(u => ({ ...u }));\n    this.kader = (s.kader || []).map(k => (k ? { ...k } : null));\n    this.kader.forEach((k, i) => { if (k && this.agents[i]) { this.agents[i].unit = k.unit; this.agents[i].color = k.color; } });\n    this.facEnsureAll();\n    this.PLAZA = { ...s.plaza };\n    this.edWp = null; this.edSel = null;\n    this.edDirty = true; this.edCommit();\n  }\n  /** Vor der Gestik merken, danach nur behalten, wenn sich wirklich etwas geändert hat —\n   *  sonst füllt ein Klick auf leeren Grund den Stapel mit Schritten, die nichts tun. */\n  edBegin() { this.edPend = JSON.stringify(this.edSnap()); }\n  edEnd() {\n    if (!this.edPend) return;\n    if (JSON.stringify(this.edSnap()) !== this.edPend) {\n      this.undoS = this.undoS || []; this.redoS = [];\n      this.undoS.push(JSON.parse(this.edPend));\n      if (this.undoS.length > 20) this.undoS.shift();\n      this.setState({ undoN: this.undoS.length, redoN: 0 });\n    }\n    this.edPend = null;\n  }\n  edUndo() {\n    if (!this.undoS || !this.undoS.length) { this.edSay('nichts zurückzunehmen'); return; }\n    const cur = this.edSnap();\n    this.edRestore(this.undoS.pop());\n    (this.redoS = this.redoS || []).push(cur);\n    if (this.redoS.length > 20) this.redoS.shift();\n    this.setState({ undoN: this.undoS.length, redoN: this.redoS.length });\n    this.edTail('zurückgenommen · ' + this.undoS.length + ' übrig');\n  }\n  edRedo() {\n    if (!this.redoS || !this.redoS.length) { this.edSay('nichts wiederherzustellen'); return; }\n    const cur = this.edSnap();\n    this.edRestore(this.redoS.pop());\n    (this.undoS = this.undoS || []).push(cur);\n    this.setState({ undoN: this.undoS.length, redoN: this.redoS.length });\n    this.edTail('wiederhergestellt');\n  }\n  /** Lehre aus Bug #64: eine Meldung stellt sich VOR den Befund, sie überschreibt ihn nicht. */\n  edTail(msg) {\n    const w = this.warn || [];\n    this.edSay(msg + (w.length ? ' · ' + w.length + ' Befund(e): ' + w[0] : ' · ok'));\n  }\n\n  /* ---- Karten-Slots: dieselbe Serialisierung wie der Download, nur im localStorage. ---- */\n  SLOTKEY = 'nvMapSlots';\n  slotsRead() { try { return JSON.parse(localStorage.getItem(this.SLOTKEY) || '{}') || {}; } catch (e) { return {}; } }\n  slotsWrite(o) { try { localStorage.setItem(this.SLOTKEY, JSON.stringify(o)); } catch (e) { this.edSay('Speicher voll — Slot nicht geschrieben'); } }\n  slotNames() { return Object.keys(this.slotsRead()).sort(); }\n  slotSave(name) {\n    const n = String(name || '').trim() || 'Karte ' + (this.slotNames().length + 1);\n    const o = this.slotsRead();\n    o[n] = this.mapConfig(n);\n    this.slotsWrite(o);\n    this.setState({ slots: Object.keys(o).sort(), slotName: '' });\n    this.edSay('gespeichert: ' + n);\n  }\n  slotLoad(n) {\n    const cfg = this.slotsRead()[n];\n    if (!cfg) { this.edSay('Slot fehlt: ' + n); return; }\n    this.edBegin();\n    const r = this.applyConfig(cfg);\n    this.edEnd();\n    this.edTail('geladen: ' + n + (r.skipped ? ' · ' + r.skipped + ' übersprungen' : ''));\n  }\n  slotDel(n) {\n    const o = this.slotsRead(); delete o[n]; this.slotsWrite(o);\n    this.setState({ slots: Object.keys(o).sort() });\n    this.edSay('Slot gelöscht: ' + n);\n  }\n\n  /** Eine Serialisierung für alle Ausgänge: Download, Slot, später der Konverter. */\n  mapConfig(name) {\n    const T = this.T, terrain = {};\n    for (let r = 0; r < this.ROWS; r++) for (let c = 0; c < this.COLS; c++) {\n      const v = (this.mapLvl && this.mapLvl[r] && this.mapLvl[r][c]) || 0;\n      const landC = !!(this.land && this.land[r] && this.land[r][c]);\n      if (!landC && !v) continue;\n      terrain[c + ',' + r] = { tile: { set: v ? 'elevated-' + v : 'flat', frame: v }, walkable: landC && !this.stepp
