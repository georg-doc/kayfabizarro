`;
ESSAY.en=`
<h1 class="origin-title">Let the AI <span class="swipe">Read</span> Your Comics, Not Draw Them</h1>
<p class="origin-subtitle">A proposal to broaden the debate, constructively. With 14 comic readings as prompts to <a class="tablink" href="#readings">try out right now</a>.</p>
<div class="note">A note for my friends from the comic seminar: This piece is the practical extension of my `+A(L.vid,'mini-workshop at the Erlangen Comic Seminar in 2023')+` and the article `+A(L.sub,'\u201cAI: Your Enemy and Helper\u201d')+` that grew out of it (both in German). The \u201cand\u201d was deliberate; it was never an either/or for me. The really big questions I\u2019m leaving out on purpose: technocracy, the `+A(L.darkEN,'\u201cDark Enlightenment\u201d')+`, the `+A(L.alj,'military use of AI in Ukraine, Gaza and elsewhere')+`. Those deserve more tears, with good reason, than the fate of our own draftsmanship, and in our artistic navel-gazing they barely come up at all. But they belong at a different table. This is about craft, about what you can try tomorrow.</div>
<p class="prose">\u201cAI: friend or foe?\u201d That was the framing on the panel, and honestly I found the question flat before it was even discussed. Not because the worry is groundless. <span class="hl">The fear of losing work is real</span>, generative style-theft is a genuine problem, and the copyright questions are anything but settled. That fight has to happen, and in many places it is being fought hard, rightly so.</p>
<p class="prose">But the debate has fixated on a single use: the AI that <em>draws</em> (animates, composes, and so on). The machine that imitates a style, spits out an image, is meant to replace a human at the drawing table. Next to it sits <span class="hl">a second register almost nobody talks about</span>: the AI that <em>reads</em>.</p>
<p class="prose">An AI that doesn\u2019t generate a picture but looks at one. That doesn\u2019t copy my style but tells me what lands with it. That is <span class="hl">a very different lever</span>, and a far less threatening one.</p>
<h2 class="sec-sub">From Producing to Reading</h2>
<p class="prose">We touched on this on the panel with the example of translation: AI can do an enormous amount here <span class="hl">without making translators and editors redundant</span>. Their role shifts toward curation, co-creation, polish instead of raw conversion. Not replaced, but promoted into a new job profile, if you let it happen.</p>
<p class="prose">The same pattern carries over to a lot of work steps, as soon as you think of AI as <em>receptive</em> rather than productive. And the best way into this field isn\u2019t the most comfortable one, it\u2019s <span class="hl">the one almost nobody argues against</span>.</p>
<h2 class="sec-sub">Opening the Comic to More People</h2>
<p class="prose">For blind and visually impaired people, comics have always been a wall: a medium that tells almost everything through the image can\u2019t be unlocked with a screen reader. <span class="hl">This is exactly where a reading AI is strong.</span></p>
<p class="prose">It can draft a panel-by-panel image description (who\u2019s in the frame, what\u2019s happening, what the line and the colors carry) and prepare <span class="hl">the most laborious layer of an accessible edition</span>. From that description text you can then produce what was previously too expensive to happen at all:</p>
<ul class="elist"><li>an <strong class="hl">audio track</strong> that makes the comic experienceable like a little radio play: dialogue plus a described visual layer, read aloud;</li><li>the text basis for a <strong class="hl">Braille or tactile edition</strong>, where the visual storytelling is translated into descriptive language;</li><li>a version in <strong class="hl">plain language</strong> for people with cognitive impairments or reading difficulties.</li></ul>
<p class="prose">Important: <strong class="hl">the AI delivers the draft, not the finished product.</strong> The artist decides whether \u201cthe figure seems threatened\u201d is right or whether more ambivalence belongs there. That turns accessibility from a duty tacked on at the very end into something doable. And nobody loses a job in the process, because this work simply wasn\u2019t being done before. Here AI adds something that would otherwise have been missing. A better way into the whole debate is hard to imagine.</p>
<h2 class="sec-sub">Translation as Access</h2>
<p class="prose">Closely related, and already mentioned on the panel: the same reading logic carries a comic across language borders. An AI can draft a raw translation of the speech balloons, onto which a human then sets the actual tone, the wordplay, the rhythm, the lettering. Combined with the description text from above, a multilingual audio version emerges almost as a byproduct. Here too the translator isn\u2019t replaced. She\u2019s freed from the mechanical first pass and can concentrate on what only she can do: <span class="hl">the feel for voice and culture</span>.</p>
<h2 class="sec-sub">Editing Without the Drudgery</h2>
<p class="prose">Graphic novels carry a lot of thankless diligence in things nobody enjoys doing and that still get noticed when they\u2019re missing. An AI that has read the whole work can assist precisely here:</p>
<ul class="elist"><li><strong class="hl">Continuity:</strong> Does the character suddenly have no scar on page 12? Is the jacket a different color in chapter 5 than in chapter 2? Is the order of the flashbacks right?</li><li><strong class="hl">Linguistic consistency:</strong> Does a character sound the same across 200 pages, or does their tone drift without anyone noticing?</li><li><strong class="hl">Lettering and errors:</strong> inconsistent spellings, forgotten quotation marks, speech balloons set too tight.</li></ul>
<p class="prose">The editorial judgment, what\u2019s intentional and what\u2019s an error, stays with the human. What the AI takes off your plate is the dull combing-through. That shifts editing from hunting for mistakes to curating: <span class="hl">away from searching, toward deciding</span>.</p>
<h2 class="sec-sub">The Tireless Research Assistant</h2>
<p class="prose">Comics are often surprisingly research-heavy, historical and documentary material especially. If you\u2019re telling a story set in Berlin in 1925, you need to know what a tram looked like, what uniform the conductor wore, how a shop sign was lettered, what hung at a newspaper kiosk, how people dressed. Here an AI is <span class="hl">a fast first port of call</span>: it offers leads, search terms, and threads to pull on.</p>
<p class="prose">The catch, and you owe your colleagues this honestly: AI occasionally invents details that sound plausible and are simply wrong. <strong class="hl">It\u2019s the first address, not the last.</strong> What it gives you, you check against the archive, the photo book, or the expert. Excellent as a research accelerator, useless as a source of truth.</p>
<h2 class="sec-sub">Talking About the Work</h2>
<p class="prose">Plenty of people are brilliant at the drawing table and suffer the moment they have to <span class="hl">explain their own work</span>: the blurb, the crowdfunding pitch, the grant application, the three sentences for a jury. An AI that has read the comic is a good sparring partner for putting your own idea into words. Not by inventing something, but by reflecting back what the thing is apparently about and offering phrasings you accept, reject, or rewrite. In the German funding jungle especially, that has gotten more than one good project over the application hurdle in the first place.</p>
<h2 class="sec-sub">Opening Up Your Own Archive</h2>
<p class="prose">If you\u2019ve been drawing for twenty years, you\u2019re sitting on a mountain of your own work that nobody can survey anymore. An AI can <span class="hl">make that jumble navigable</span>: descriptions, tags, a searchable index. \u201cShow me every page where it rains\u201d or \u201cwhich stories take place at night\u201d becomes answerable. It touches no one else\u2019s copyright, because it\u2019s purely your own material. And it\u2019s useful in an unspectacular way.</p>
<h2 class="sec-sub">Learning by Reading</h2>
<p class="prose">And finally, maybe the loveliest case: the AI as a study partner working through other people\u2019s masterpieces. \u201c<span class="hl">Explain how Moebius handles negative space.</span>\u201d \u201cWhat makes the panel timing on this page so breathless?\u201d \u201cWhy does this page break work and the one before it doesn\u2019t?\u201d You don\u2019t learn here by having the machine draw, but by having it help you see more precisely. And that is exactly the receptive stance this whole piece is about.</p>
<p class="prose">In every one of these cases the decisive thing stays with the human: the judgment, the style, the authorship. The machine reads, checks, describes, organizes. It doesn\u2019t replace your eye, <span class="hl">it gives you a second one</span>.</p>
<h2 class="sec-sub">The Honest Caveat</h2>
<p class="prose">None of this makes the tools innocent. They come from the same corporations whose handling of training data is rightly being fought over. But the question of which tool is the smaller one. The bigger one is: <span class="hl">which use shifts power toward creators</span>, and which shifts it away from them?</p>
<p class="prose">An AI that copies my style subtracts value. An AI that makes my comic readable for more people, or gives me an honest first round of feedback, adds some. That\u2019s not an argument for the corporations, it\u2019s an argument for not letting them dictate the use.</p>
<h2 class="sec-sub">Readings for Your Comic</h2>
<p class="prose">The most convincing version of all this isn’t an argument anyway, it’s an experience. So here are a few prompts to try – or just use the <a class="tablink" href="#readings">Readings</a> tab above.</p>
<p class="prompt-intro">1. The First Reading. Reads your comic the way a real audience would, seeing it for the first time. It doesn’t judge whether it’s “good”, it reports what actually goes through the reader’s head. Swap the target audience in square brackets for your own: fantasy fans, comic nerds, a school class, whoever.</p>
<div class="promptblock" data-prompt="first">`+esc(VOICES[0].en.prompt)+`</div>
<p class="prompt-intro">2. The Collegial Critique. An experienced, well-meaning colleague who sees the craft. Strengths first, then concrete, actionable improvements, and at the end the one question that gets you furthest in revising.</p>
<div class="promptblock" data-prompt="colleague">`+esc(VOICES[1].en.prompt)+`</div>
<p class="prompt-intro">3. The Finger in the Wound. No diplomacy. It names the weakest spot, the conventional, the comfortable: unsparing, but in service of the work, not of cruelty. It’ll twist the blunt spoon in the wound, but at the end it tells you what would save the piece.</p>
<div class="promptblock" data-prompt="critic">`+esc(VOICES[2].en.prompt)+`</div>
<p class="prompt-intro">4. Yourself in Five Years. Not a stranger, but you yourself: older, further along, with distance on your own work. What will still make you proud, what will make you cringe a little, and which seed in here is worth developing further?</p>
<div class="promptblock" data-prompt="future">`+esc(VOICES[3].en.prompt)+`</div>
<p class="prompt-intro">5. The Eye. No opinion, just mechanics: where the eye lands first, the path it takes, where it snags.</p>
<div class="promptblock" data-prompt="eye">`+esc(voiceById('eye').en.prompt)+`</div>
<p class="prompt-intro">6. The Publisher Pitch. Not a reader but a sparring partner for a moment we all know right now: you’re at the comic salon, half drenched in sweat, across from a publisher, you have two minutes, and afterward you can barely say what you actually told them. From what’s actually on your pages, it builds you a pitch you can say out loud beforehand. Upload a few pages as PNG or PDF (three are enough, ten work too).</p>
<div class="promptblock" data-prompt="pitch">`+esc(VOICES[4].en.prompt)+`</div>
<p class="prose">It replaces neither your instinct for the right publisher nor the nerve to sit down. But it takes away the dread that the words will desert you at the decisive moment. And it’s a nice proof, in passing, of this whole piece’s thesis: the AI doesn’t draw your comic, it helps you talk about it.</p>
<h2 class="sec-sub">Try Them, Change Them, Share Them</h2>
<p class="prose">The point isn’t that these readings are the right ones. The point is that you can build the readings yourself, and that the interesting question becomes a different one. No longer “friend or foe”, but:</p>
<p class="bigq">Which reading of my comic would I love to have that I could never otherwise get?</p>
<p class="prose">An editor who never tires. A child who sugarcoats nothing. A stranger from the target audience I’d otherwise never meet. My own self ten years from now. These aren’t replacement people, they’re a trial run before you hand the comic over.</p>
<p class="prose">Bring your own comics, change the prompts, write your own. And let’s talk about which readings you’re still missing.</p>
<h2 class="sec-sub">P.S. More readings</h2>
<p class="prose">A few more readings have joined since this was first written – some finished, some still work in progress. You can try them right away in the <a class="tablink" href="#readings">Readings</a> tab above; here they are to take with you and build on.</p>
<p class="prompt-cc">All prompts: CC BY-NC-SA 4.0 · originals (plain text, versioned) on `+A(PROMPT_REPO,'GitHub')+`.</p>
<p class="prompt-intro">7. The Doomscroller. Reads with zero patience, thumb on the swipe – tests whether anything stops them at all.</p>
<div class="promptblock" data-prompt="doomscroller">`+esc(voiceById('doomscroller').en.prompt)+`</div>
<p class="prompt-intro">8. The Literalist. Describes only what is literally there, and shows the gap between intent and page.</p>
<div class="promptblock" data-prompt="literalist">`+esc(voiceById('literalist').en.prompt)+`</div>
<p class="prompt-intro">9. FrizzleBob, Carny Barker. Sells your comic as a sideshow – whatever he can’t hype is the diagnosis.</p>
<div class="promptblock" data-prompt="carny">`+esc(voiceById('carny').en.prompt)+`</div>
<p class="prompt-intro">10. The Heckler in the Margins. Finds the accidental gags and cursed details. Truth through mockery.</p>
<div class="promptblock" data-prompt="heckler">`+esc(voiceById('heckler').en.prompt)+`</div>
<p class="prompt-intro">11. The Superfan. Reads with maximum generosity and finds depth you never planned.</p>
<div class="promptblock" data-prompt="superfan">`+esc(voiceById('superfan').en.prompt)+`</div>
<p class="prompt-intro">12. The Archaeologist from 2525. Excavates your comic with no context – what survives, what gets misread?</p>
<div class="promptblock" data-prompt="archaeologist">`+esc(voiceById('archaeologist').en.prompt)+`</div>
<p class="prompt-intro">13. The Page Speaks Back. The comic itself tells you how it feels to be drawn this way.</p>
<div class="promptblock" data-prompt="pagespeaks">`+esc(voiceById('pagespeaks').en.prompt)+`</div>
<p class="prompt-intro">14. The Synaesthete. Hears the silent comic: soundtrack, rhythm, silence – and reveals timing and pacing.</p>
<div class="promptblock" data-prompt="synaesthete">`+esc(voiceById('synaesthete').en.prompt)+`</div>

`;

// ---------------- COPY ----------------
function copyPrompt(){
  const txt=getPromptText();const b=$('copybtn');
  const done=()=>{b.classList.add('done');b.innerHTML='<span>\u2713 '+t().copied+'</span>';setTimeout(()=>{b.classList.remove('done');b.innerHTML=COPY_ICON+'<span>'+t().copy+'</span>';},1500);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));}
  else fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){try{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();done();}catch(e){}}
function copyText(txt,b){const done=()=>{b.classList.add('done');b.innerHTML='<span>✓ '+t().copied+'</span>';setTimeout(()=>{b.classList.remove('done');b.innerHTML=COPY_ICON+'<span>'+t().copy+'</span>';},1500);};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));else fallbackCopy(txt,done);}
function renderEssay(){$('essay-content').innerHTML=ESSAY[S.lang];fillEssayPrompts();decorateEssay();}
function fillEssayPrompts(){
  const root=$('essay-content');if(!root)return;
  root.querySelectorAll('.promptblock[data-prompt]').forEach(pb=>{
    const v=voiceById(pb.getAttribute('data-prompt'));if(!v)return;
    const txt=(v[S.lang]&&v[S.lang].prompt)||'';
    let chip;
    if(PROMPT_SRC[v.id]){
      const ttl=(v.synced?(S.lang==='de'?'aktuelle Version von GitHub':'current version from GitHub'):(S.lang==='de'?'mitgelieferte Version':'bundled version'))+' \u00b7 '+PROMPT_SRC[v.id]+'.md';
      chip='<span class="pb-ver'+(v.synced?' is-synced':'')+'" title="'+esc(ttl)+'">v'+esc(v.version||'1.0')+'</span>';
    }else{
      chip='<span class="pb-ver pb-wip" title="'+(S.lang==='de'?'Work in Progress':'work in progress')+'">WIP</span>';
    }
    pb.innerHTML=chip+'<div class="pb-text">'+esc(txt)+'</div>';
  });
}
function decorateEssay(){
  const root=$('essay-content');
  root.querySelectorAll('.prompt-intro').forEach(p=>{
    const m=p.textContent.match(/^(\d+\.\s+[^.]+\.)\s*([\s\S]*)$/);
    if(m)p.innerHTML='<span class="pi-title">'+esc(m[1])+'</span>'+esc(m[2]);
  });
  root.querySelectorAll('.promptblock').forEach(pb=>{
    const tEl=pb.querySelector('.pb-text');const text=tEl?tEl.textContent:pb.textContent;
    const b=document.createElement('button');b.className='pb-copy';b.type='button';
    b.innerHTML=COPY_ICON+'<span>'+esc(t().copy)+'</span>';
    b.onclick=()=>copyText(text,b);
    pb.appendChild(b);
  });
  // read-aloud control, woven onto the headline baseline (after the title)
  if('speechSynthesis'in window){
    const title=root.querySelector('.origin-title');
    if(title){
      const b=document.createElement('button');b.className='essay-read';b.id='essay-read';b.type='button';b.setAttribute('aria-pressed','false');
      b.addEventListener('click',toggleEssayRead);
      title.appendChild(document.createTextNode('\u00a0'));title.appendChild(b);
      const words=buildEssayQueue().reduce((n,o)=>n+o.text.split(/\s+/).length,0);
      essayTts.mins=Math.max(1,Math.round(words/150));
      setEssayBtn(essayTts.playing);
    }
  }
}

// ---------------- VOICES RENDER ----------------
function voiceCard(v,n){
  const d=v[S.lang];
  const el=document.createElement('button');
  const isWip=WIP_IDS.includes(v.id);
  el.className='voice vbg'+(((n-1)%6)+1)+(v.id===S.voice?' on':'')+(isWip?' wip':'');
  let tag='';
  if(v.id==='pitch')tag='<span class="tag">'+esc(t().pitchTag)+'</span>';
  else if(isWip)tag='<span class="tag wip-tag">'+esc(t().wipTag)+'</span>';
  el.innerHTML='<span class="pick">'+esc(t().pick)+'</span><span class="vn"><span class="vn-n">'+n+'.</span>'+esc(d.name)+'</span><span class="vb">'+esc(d.blurb)+'</span>'+tag;
  el.onclick=()=>chooseVoice(v.id);
  return el;
}
function renderVoices(){
  const box=$('voices-all');box.innerHTML='';

function toggleWip(){

function mdInline(s){
  s=esc(s);
  s=s.replace(/\*\*([^*]+?)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/__([^_]+?)__/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*])\*([^*\n]+?)\*/g,'$1<em>$2</em>');
  s=s.replace(/(^|[^_\w])_([^_\n]+?)_(?=[^_\w]|$)/g,'$1<em>$2</em>');
  s=s.replace(/`([^`]+?)`/g,'<code>$1</code>');
  s=s.replace(/\[([^\]]+?)\]\((https?:[^)]+?)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function renderMarkdown(src){
  const lines=(src||'').replace(/\r/g,'').split('\n');
  const out=[];let i=0;
  const isH=l=>/^#{1,6}\s/.test(l), isUl=l=>/^\s*[-*\u2022]\s+/.test(l),
        isOl=l=>/^\s*\d+[.)]\s+/.test(l), isQ=l=>/^\s*>\s?/.test(l),
        isHr=l=>/^\s*([-*_])(\s*\1){2,}\s*$/.test(l), blank=l=>/^\s*$/.test(l);
  const stop=l=>blank(l)||isH(l)||isUl(l)||isOl(l)||isQ(l)||isHr(l);
  while(i<lines.length){
    const line=lines[i];
    if(blank(line)){i++;continue;}
    if(isHr(line)){out.push('<hr>');i++;continue;}
    let h=line.match(/^(#{1,6})\s+(.*)$/);
    if(h){const lvl=h[1].length<=3?3:4;out.push('<h'+lvl+' class="mdh">'+mdInline(h[2].replace(/\s*#+\s*$/,'').trim())+'</h'+lvl+'>');i++;continue;}
    if(isQ(line)){const buf=[];while(i<lines.length&&isQ(lines[i])){buf.push(lines[i].replace(/^\s*>\s?/,''));i++;}out.push('<blockquote>'+mdInline(buf.join(' ')).replace(/\n/g,'<br>')+'</blockquote>');continue;}
    if(isOl(line)){const items=[];while(i<lines.length&&isOl(lines[i])){let t=lines[i].replace(/^\s*\d+[.)]\s+/,'');i++;while(i<lines.length&&!stop(lines[i])){t+=' '+lines[i].trim();i++;}items.push(t);}out.push('<ol>'+items.map(t=>'<li>'+mdInline(t.trim())+'</li>').join('')+'</ol>');continue;}
    if(isUl(line)){const items=[];while(i<lines.length&&isUl(lines[i])){let t=lines[i].replace(/^\s*[-*\u2022]\s+/,'');i++;while(i<lines.length&&!stop(lines[i])){t+=' '+lines[i].trim();i++;}items.push(t);}out.push('<ul>'+items.map(t=>'<li>'+mdInline(t.trim())+'</li>').join('')+'</ul>');continue;}
    const buf=[];while(i<lines.length&&!stop(lines[i])){buf.push(lines[i]);i++;}
    out.push('<p>'+mdInline(buf.join('\n')).replace(/\n/g,'<br>')+'</p>');
  }
  return out.join('');
}

let ttsCurrent=null;
function pickVoice(lang){
  const vs=window.speechSynthesis?window.speechSynthesis.getVoices():[];
  const pref=lang==='de'?['de-DE','de']:['en-GB','en-US','en'];
  for(const p of pref){const m=vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith(p.toLowerCase()));if(m)return m;}
  return null;
}

function startSpeak(btn,text){
  if(!('speechSynthesis'in window))return;
  stopSpeak();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=S.lang==='de'?'de-DE':'en-US';
  const v=pickVoice(S.lang);if(v)u.voice=v;
  u.rate=1;u.pitch=1;
  u.onend=()=>{if(ttsCurrent&&ttsCurrent.btn===btn){resetTtsBtn(btn);ttsCurrent=null;}};
  u.onerror=()=>{if(ttsCurrent&&ttsCurrent.btn===btn){resetTtsBtn(btn);ttsCurrent=null;}};
  ttsCurrent={btn,text};
  setTtsBtnPlaying(btn);
  window.speechSynthesis.speak(u);
}

  if(ttsCurrent&&ttsCurrent.btn===btn){stopSpeak();return;}
  startSpeak(btn,text);
}

// ---------------- API ----------------
async function callClaude(messages){
  const key=localStorage.getItem('fb_key');
  if(key){
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1400,messages})});
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    if(data.error)throw new Error(data.error.message||"api");
    const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
    if(!text)throw new Error("empty");
    return text;
  }
  if(window.claude&&window.claude.complete){
    const out=await window.claude.complete({messages});
    const text=(typeof out==='string'?out:String(out||'')).trim();
    if(!text)throw new Error("empty");
    return text;
  }
  throw new Error("no-backend");
}
function fbHasKey(){return !!localStorage.getItem('fb_key');}
function blkCfg(){return fbHasKey()?{dim:1568,q:0.85,max:6,pdf:6,budget:Infinity}:{dim:780,q:0.55,max:4,pdf:4,budget:235000};}
function b64ToBuf(b64){const bin=atob(b64);const len=bin.length;const a=new Uint8Array(len);for(let i=0;i<len;i++)a[i]=bin.charCodeAt(i);return a.buffer;}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('img'));i.src=src;});}
function canvasToBlock(c,q){const url=c.toDataURL('image/jpeg',q);return {type:"image",source:{type:"base64",media_type:"image/jpeg",data:url.split(',')[1]}};}
async function imageToBlock(dataURL,cfg){
  const img=await loadImg(dataURL);
  let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
  const s=Math.min(1,cfg.dim/Math.max(w,h));
  w=Math.max(1,Math.round(w*s));h=Math.max(1,Math.round(h*s));
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
  return canvasToBlock(c,cfg.q);
}
async function pdfPages(dataURL,budget,cfg){
  if(!window.pdfjsLib)throw new Error('pdfjs');
  try{pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_BASE+'pdf.worker.min.js';}catch(e){}
  const doc=await pdfjsLib.getDocument({data:b64ToBuf(dataURL.split(',')[1])}).promise;
  const count=doc.numPages;
  const n=Math.min(count,cfg.pdf,Math.max(0,budget));const out=[];
  for(let p=1;p<=n;p++){
    const page=await doc.getPage(p);const vp1=page.getViewport({scale:1});
    const vp=page.getViewport({scale:Math.min(2,cfg.dim/vp1.width)});
    const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
    await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    out.push(canvasToBlock(c,cfg.q));
  }
  return {pages:out,count};
}
async function buildBlocks(){
  const cfg=blkCfg();const blocks=[];let total=0,used64=0;
  const tryAdd=(blk)=>{
    if(blocks.length>=cfg.max)return false;
    if(cfg.budget!==Infinity&&blocks.length>0&&used64+blk.source.data.length>cfg.budget)return false;
    blocks.push(blk);used64+=blk.source.data.length;return true;
  };
  for(const f of S.files){
    if(f.kind==='image'){total+=1;if(blocks.length<cfg.max){tryAdd(await imageToBlock(f.dataURL,cfg));}}
    else{const r=await pdfPages(f.dataURL,cfg.max-blocks.length,cfg);total+=r.count;for(const blk of r.pages){if(!tryAdd(blk))break;}}
  }
  return {blocks,total,used:blocks.length,truncated:blocks.length<total};
}
function setLoading(on){S.loading=on;$('send').disabled=on;updateReadState();}
async function runRead(){
  if(S.files.length===0){appendError(t().needfile);return;}
  appendUserRead();setLoading(true);showThinking();
  try{
    const r=await buildBlocks();
    if(!r.blocks.length)throw new Error('noblocks');
    S.messages=[{role:"user",content:[...r.blocks,{type:"text",text:getPromptText()}]}];
    const text=await callClaude(S.messages);
    hideThinking();
    if(r.truncated){let _n=t().richMaterial.replace('{used}',r.used).replace('{total}',r.total);if(!fbHasKey())_n+=' '+t().keyHint;appendNote(_n);}
    appendBot(text);S.messages.push({role:"assistant",content:text});
    S.read=true;updateSteps();
    $('followup').classList.add('show');$('reset').style.display='inline-block';
  }catch(e){hideThinking();if(e&&e.message==='no-backend')appendNoBackend();else appendError(t().err);}finally{setLoading(false);}
}
async function sendFollowup(){
  const inp=$('fuinput');const txt=inp.value.trim();if(!txt||S.loading)return;
  inp.value='';S.messages.push({role:"user",content:txt});appendUserText(txt);setLoading(true);showThinking();
  try{const text=await callClaude(S.messages);hideThinking();appendBot(text);S.messages.push({role:"assistant",content:text});}
  catch(e){hideThinking();if(e&&e.message==='no-backend')appendNoBackend();else appendError(t().err);}finally{setLoading(false);}
}
function resetAll(){stopSpeak();S.messages=[];S.read=false;$('log').innerHTML='';$('followup').classList.remove('show');$('reset').style.display='none';updateReadState();}
async function addFiles(list){for(const file of Array.from(list)){if(S.files.length>=MAX_FILES)break;const isPdf=file.type==='application/pdf';try{const {dataURL,base64}=await fileToData(file);S.files.push({name:file.name,mediaType:file.type,kind:isPdf?'pdf':'image',dataURL,base64});}catch(e){}}afterFilesChanged();}

const PDFJS_BASE='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let deckDoc=null,deckPage=1,deckTotal=0,deckZoom=1,deckBusy=false;
function updateDeckInfo(){
  const info=$('deck-info');if(info)info.textContent=(t().deckPagePrefix||'')+' '+deckPage+' / '+(deckTotal||'\u2026');
  const zl=$('deck-zlabel');if(zl)zl.textContent=Math.round(deckZoom*100)+'%';
  const pv=$('deck-prev'),nx=$('deck-next');
  if(pv)pv.disabled=!deckDoc||deckPage<=1;
  if(nx)nx.disabled=!deckDoc||deckPage>=deckTotal;
}
function ensureDeck(){
  if(deckDoc||deckBusy)return;
  const ph=$('deck-ph');
  if(!window.pdfjsLib){if(ph)ph.textContent=t().deckErr;return;}
  deckBusy=true;
  try{pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_BASE+'pdf.worker.min.js';}catch(e){}
  if(ph)ph.textContent=t().deckLoading;
  fetch(DECK_PDF).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.arrayBuffer();})
    .then(buf=>pdfjsLib.getDocument({data:buf,cMapUrl:PDFJS_BASE+'cmaps/',cMapPacked:true}).promise)
    .then(doc=>{deckDoc=doc;deckTotal=doc.numPages;deckPage=1;deckBusy=false;renderDeck();})
    .catch(()=>{deckBusy=false;const p=$('deck-ph');if(p)p.textContent=t().deckErr;});
}
function renderDeck(){
  if(!deckDoc)return;
  const wrap=$('deck-canvas');if(!wrap)return;
  const token=Date.now();wrap._tk=token;
  deckDoc.getPage(deckPage).then(page=>{
    if(wrap._tk!==token)return;
    const avail=(wrap.clientWidth||800)-28;
    const vp1=page.getViewport({scale:1});
    const fit=avail/vp1.width;
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const vp=page.getViewport({scale:fit*deckZoom*dpr});
    const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
    c.style.width=(avail*deckZoom)+'px';
    wrap.innerHTML='';wrap.appendChild(c);
    page.render({canvasContext:c.getContext('2d'),viewport:vp});
    updateDeckInfo();
  }).catch(()=>{});
}
function deckNav(dir){if(!deckDoc)return;const n=deckPage+dir;if(n<1||n>deckTotal)return;deckPage=n;const w=$('deck-canvas');if(w)w.scrollTop=0;renderDeck();}
function deckZoomBy(d){if(!deckDoc)return;deckZoom=Math.min(3,Math.max(0.6,Math.round((deckZoom+d)*100)/100));renderDeck();}

$('key-clear').addEventListener('click',()=>{localStorage.removeItem('fb_key');$('apikey').value='';$('key-state').textContent=t().keyNone;});
if(window.speechSynthesis)window.speechSynthesis.onvoiceschanged=()=>{};

// ---------------- INIT ----------------
setAutoread(S.autoread);
renderVoices();renderStrings();
applyTheme(localStorage.getItem('fb_theme')||'paper');
if(!routeFromHash())showTab('essay');
window.addEventListener('hashchange',routeFromHash);
syncPrompts();
</script>
</body>
</html>
