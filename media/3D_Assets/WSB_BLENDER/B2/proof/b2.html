  for (const [i, a] of A.anchors.entries()) { const m = new THREE.Mesh(ballGeo.clone(), mats[FLUFF.findIndex(f => f[0] === a.proofColour)]); m.position.fromArray(a.ballCenter); m.scale.setScalar(a.sizeScale || 1); grp.add(m); }
  for (const o of grp.children.slice(1)) await clayify(o, 'figure', 500 + grp.children.indexOf(o));
  return { T, grp }; }
const shot = c => c.toDataURL('image/png');

try {
  if (MODE === 'inspect') { const out = {};
    for (const n of MODELS) { const T = await loadTree(n); const leaf = T.tris.filter(t => t.kind === 'leaf'); out[n] = { tris: T.tris.length, leafTris: leaf.length, leafArea: +leaf.reduce((a, t) => a + t.area, 0).toFixed(3), woodArea: +T.tris.filter(t => t.kind === 'wood').reduce((a, t) => a + t.area, 0).toFixed(3), bbox: [T.box.min.toArray().map(v => +v.toFixed(3)), T.box.max.toArray().map(v => +v.toFixed(3))] }; }
    job.out = out; await save('data/inspect.json', JSON.stringify(out, null, 1)); log('inspect ok'); }
  if (MODE === 'anchors') { const out = { schema: 'kfb.tree-fluff-anchors.v1', params: P, models: {} };
    for (const n of MODELS) { const T = await loadTree(n); out.models[n] = anchorsFor(T); log(n + ' ' + out.models[n].anchors.length); await new Promise(r => setTimeout(r, 0)); }
    job.out = Object.fromEntries(Object.entries(out.models).map(([k, v]) => [k, [v.kind, v.anchors.length, v.candidates, v.minSpacing]])); await save('data/anchors_raw.json', JSON.stringify(out, null, 1)); log('anchors ok'); }
  if (MODE === 'sheet') { // 2 sheets x 10 trees, 5 x 2 tiles of 384 x 540
    const A = await fetch('../data/anchors_raw.json').then(r => r.json()), W = 1920, H = 1080, S = stage(W, H), page = +(Q.get('page') || 0), names = MODELS.slice(page * 10, page * 10 + 10);
    S.renderer.setClearColor('#d9d4ca'); S.renderer.setScissor(0, 0, W, H); S.renderer.setViewport(0, 0, W, H); S.renderer.clear();
    for (const [k, n] of names.entries()) { const { T, grp } = await dressed(n, A.models[n]); S.scene.add(grp);
      const x = (k % 5) * 384, y = (k < 5 ? 1 : 0) * 540; S.renderer.setViewport(x, y, 384, 540); S.renderer.setScissor(x, y, 384, 540); S.cam.aspect = 384 / 540; S.cam.updateProjectionMatrix();
      const h = T.box.max.y - T.box.min.y, w = Math.max(T.box.max.x - T.box.min.x, T.box.max.z - T.box.min.z); look(S.cam, new THREE.Vector3((T.box.min.x + T.box.max.x) / 2, h * 0.5, (T.box.min.z + T.box.max.z) / 2), 30, 12, Math.max(h * 0.58, w * 0.8));
      S.renderer.render(S.scene, S.cam); S.scene.remove(grp); }
    job.out = await save('renders/B2_sheet_' + (page + 1) + '.png', shot(S.renderer.domElement)); log('sheet ok'); }
  if (MODE === 'hero') { const A = await fetch('../data/anchors_raw.json').then(r => r.json()), W = 1920, H = 1080, S = stage(W, H), n = Q.get('model');
    const { T, grp } = await dressed(n, A.models[n]); S.scene.add(grp); S.renderer.setViewport(0, 0, W, H); S.renderer.setScissor(0, 0, W, H); S.cam.aspect = W / H; S.cam.updateProjectionMatrix();
    const h = T.box.max.y - T.box.min.y; look(S.cam, new THREE.Vector3(0, h * (+(Q.get('ty') || 0.55)), 0), +(Q.get('az') || 30), +(Q.get('el') || 12), h * (+(Q.get('zoom') || 0.6)));
    S.renderer.render(S.scene, S.cam); job.out = await save('renders/B2_hero_' + n + (Q.get('suffix') || '') + '.png', shot(S.renderer.domElement)); log('hero ok'); }
  job.done = true;
} catch (e) { job.err = String(e && e.stack || e); log('FEHLER ' + job.err); }
</script></body></html>
