  for (const [i, f] of figs.entries()) { if (!f.mixer) f.mixer = new THREE.AnimationMixer(f.fig); if (!f.clay) { f.clay = await clayify(f.fig, { profile: 'figure', seed: 10 + i * 50 }); S.scene.add(f.fig); }
    f.fig.position.set((i - 0.5) * gap, 0, 0); f.fig.rotation.y = (i ? -1 : 1) * THREE.MathUtils.degToRad(+(Q.get('turn') || 12)); }
  return S; }
const shot = (canvas, type = 'image/png', q) => canvas.toDataURL(type, q);
async function renderSheets(figs, clips) {
  const W = 1920, H = 1080, S = await dressFigs(figs, +(Q.get('gap') || 1.9)); stage(W, H);
  const meas = await fetch('../data/measure.json').then(r => r.ok ? r.json() : null).catch(() => null), sheets = {};
  for (const c of clips) { const clip = getClip(c), d = clip.duration, ts = [d / 8, 3 * d / 8, 5 * d / 8];
    let worst = 7 * d / 8, why = 'phase 7/8';
    if (meas) { const A = meas.clips[c].A, B = meas.clips[c].B, cand = [];
      for (const [k, m] of [['A', A], ['B', B]]) { const P = m.penetration;
        for (const [nm, p, n] of [['hand in body', P.handInBody, P.sampledHandVerts], ['hand in head', P.handInHead, P.sampledHandVerts], ['forearm in body', P.forearmInBody, P.sampledForearmVerts], ['forearm in head', P.forearmInHead, P.sampledForearmVerts]])
          if (p.worstFrame != null) cand.push([p.maxVerts / n, p.worstFrame, k + ' ' + nm + ' ' + p.maxVerts + '/' + n + ' sampled verts']);
        cand.push([Math.max(0, -m.ground.footMinY.min) * 2, m.ground.footMinFrame, k + ' foot ' + (-m.ground.footMinY.min * 100).toFixed(1) + ' cm below ground']); }
      cand.sort((a, b) => b[0] - a[0]); if (cand.length && cand[0][0] > 0.02) { worst = cand[0][1] / FPS; why = 'worst: ' + cand[0][2]; } }
    ts.push(worst);
    for (const f of figs) { f.mixer.stopAllAction(); f.mixer.clipAction(clip).reset().play(); }
    S.renderer.setScissorTest(true);
    for (const [k, t] of ts.entries()) { for (const f of figs) f.mixer.setTime(t); S.scene.updateMatrixWorld(true);
      const x = (k % 2) * W / 2, y = (k < 2 ? 1 : 0) * H / 2; S.renderer.setViewport(x, y, W / 2, H / 2); S.renderer.setScissor(x, y, W / 2, H / 2);
      S.cam.aspect = (W / 2) / (H / 2); S.cam.updateProjectionMatrix(); look(S.cam, new THREE.Vector3(0, 1.05, 0), +(Q.get('az') || 0), +(Q.get('el') || 8), +(Q.get('halfh') || 1.45));
      S.renderer.render(S.scene, S.cam); }
    const path = 'renders/B1_sheet_' + c + '.png'; await save(path, shot(S.renderer.domElement)); sheets[c] = { file: path, times_s: ts.map(t => +t.toFixed(3)), panel4: why, layout: '2x2: TL t1, TR t2, BL t3, BR t4; Mummy_A left, Mummy_B right' }; log('sheet ' + c); }
  await save('data/sheets.json', JSON.stringify(sheets, null, 1)); job.out = sheets; }
async function renderFrame(figs) { // single evidence frame: ?mode=frame&clip=&t=&az=&el=&halfh=&ty=&name=
  const W = 1920, H = 1080, S = await dressFigs(figs, +(Q.get('gap') || 1.9)); stage(W, H); const clip = getClip(Q.get('clip'));
  for (const f of figs) { f.mixer.stopAllAction(); f.mixer.clipAction(clip).reset().play(); f.mixer.setTime(+Q.get('t')); }
  if (Q.get('only')) figs.forEach(f => { f.fig.visible = f.key === Q.get('only'); if (f.fig.visible) f.fig.position.x = 0; });
  if (Q.get('seeground')) S.scene.traverse(o => { if (o.isMesh && o.geometry.type === 'PlaneGeometry') { o.material.transparent = true; o.material.opacity = 0.45; o.material.depthWrite = false; } });
  S.scene.updateMatrixWorld(true); S.renderer.setViewport(0, 0, W, H); S.renderer.setScissor(0, 0, W, H); S.cam.aspect = W / H; S.cam.updateProjectionMatrix();
  look(S.cam, new THREE.Vector3(+(Q.get('tx') || 0), +(Q.get('ty') || 1.05), 0), +(Q.get('az') || 0), +(Q.get('el') || 8), +(Q.get('halfh') || 1.3));
  S.renderer.render(S.scene, S.cam); const path = 'renders/' + (Q.get('name') || 'B1_frame') + '.png'; await save(path, shot(S.renderer.domElement)); job.out = path; }
async function renderVideo(figs) { // beat-locked duet on the song: data/video_plan.json (built from tempo.json + beats.json)
  const plan = await fetch('../data/video_plan.json').then(r => r.json()), W = plan.w, H = plan.h, S = await dressFigs(figs, +(Q.get('gap') || 1.9)); stage(W, H);
  S.renderer.setViewport(0, 0, W, H); S.renderer.setScissor(0, 0, W, H); S.cam.aspect = W / H; S.cam.updateProjectionMatrix();
  look(S.cam, new THREE.Vector3(0, 1.0, 0), +(Q.get('az') || 0), +(Q.get('el') || 8), +(Q.get('halfh') || 1.45));
  for (const f of figs) { f.mixer.stopAllAction(); f.acts = plan.figs[f.key].map(s => { const clip = getClip(s.clip), a = f.mixer.clipAction(clip); a.reset().play(); a.setEffectiveWeight(0); return { s, a, d: clip.duration }; }); }
  const clipT = (x, tau) => { const t = x.s.clip_time_at_anchor + (tau - x.s.anchor_beat_song_s) * x.s.timeScale; return ((t % x.d) + x.d) % x.d; };
  const N = Math.round((plan.song_to_s - plan.song_from_s) * plan.fps), from = +(Q.get('from') || 0), to = Math.min(N, +(Q.get('to') || N));
  for (let i = from; i < to; i++) { const tau = plan.song_from_s + i / plan.fps;
    for (const f of figs) { f.acts.forEach((x, k) => { let w = 0; const nx = f.acts[k + 1];
        if (tau >= x.s.from_song_s && tau < x.s.to_song_s) w = 1;
        if (nx && tau >= nx.s.from_song_s && tau < nx.s.from_song_s + plan.blend_s) w = 1 - (tau - nx.s.from_song_s) / plan.blend_s;
        if (k > 0 && tau >= x.s.from_song_s && tau < x.s.from_song_s + plan.blend_s) w = (tau - x.s.from_song_s) / plan.blend_s;
        x.a.setEffectiveWeight(w); x.a.time = clipT(x, tau); });
      f.mixer.update(0); }
    S.scene.updateMatrixWorld(true); S.renderer.render(S.scene, S.cam);
    await save('_frames/f_' + String(i).padStart(4, '0') + '.jpg', shot(S.renderer.domElement, 'image/jpeg', 0.92)); if (i % 30 === 0) log('video frame ' + i + '/' + N); }
  job.out = { frames: to - from, of: N }; }

try {
  const figs = [await loadFig('A'), await loadFig('B')];
  if (MODE === 'inspect') {
    const out = { libClips: lib.animations.length, libBones: [], figs: {} };
    lib.scene.traverse(o => { if (o.isBone) out.libBones.push(o.name); });
    for (const f of figs) { f.fig.updateMatrixWorld(true); const box = new THREE.Box3().setFromObject(f.fig);
      out.figs[f.key] = { bones: Object.keys(f.bones), ownClips: f.ownClips.length,
        meshes: f.meshes.map(m => ({ name: m.name, skinned: !!m.isSkinnedMesh, verts: m.geometry.attributes.position.count, tris: m.geometry.index ? m.geometry.index.count / 3 : null, mat: (Array.isArray(m.material) ? m.material : [m.material]).map(x => x.name + (x.map ? '+map' : '')) })),
        bbox: [box.min.toArray(), box.max.toArray()],
        hipsY: f.bones.hips ? f.bones.hips.getWorldPosition(new THREE.Vector3()).y : null,
        clips: Object.fromEntries(CLIPS.map(c => { const cl = getClip(c); return [c, cl ? { dur: +cl.duration.toFixed(4), tracks: cl.tracks.length, unbound: bindReport(f, cl) } : 'MISSING']; })) }; }
    job.out = out; await save('data/inspect.json', JSON.stringify(out, null, 1)); log('inspect ok');

  if (MODE === 'sheet') await renderSheets(figs, (Q.get('clip') || CLIPS.join(',')).split(','));
