<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KFB · 2D Asset Browser</title>
<style>
:root{--paper:#f3ede1;--card:#faf7f2;--p3:#e9e1d2;--ink:#221c14;--ink3:#7a6f5c;--ink4:#a89a80;--rust:#b5502e;--border:#d8cdb8;--r:8px}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;color:var(--ink);background:var(--paper)}
.head{position:sticky;top:0;z-index:50;display:grid;grid-template-columns:auto auto 1fr auto;gap:16px;align-items:center;padding:9px 18px;background:var(--card);border-bottom:2px solid var(--ink)}
.brand{width:36px;height:36px;background:var(--rust);color:#f5f0e8;border:1.5px solid var(--ink);font-weight:800;font-size:13px;display:grid;place-items:center;border-radius:var(--r);line-height:.95;text-align:center}
.tabs{display:flex;gap:4px}.tabs a{padding:6px 13px;border:1px solid var(--border);border-radius:var(--r);font-size:13px;font-weight:600;text-decoration:none;background:var(--paper)}
.tabs a.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.search{position:relative;max-width:520px;width:100%;justify-self:center}
.search input{width:100%;font-size:14px;padding:8px 32px;background:var(--paper);border:1px solid var(--border);border-radius:var(--r);color:var(--ink);outline:none}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.count{font-size:12px;color:var(--ink3);white-space:nowrap}
.crumb{padding:9px 18px;font-size:13px;color:var(--ink3);border-bottom:1px solid var(--border);background:var(--card)}
.crumb a{color:var(--rust);cursor:pointer;text-decoration:none}.crumb a:hover{text-decoration:underline}
.crumb span.sep{margin:0 6px;color:var(--ink4)}
main{padding:16px 18px}
.grid{display:grid;gap:13px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:border-color .12s,transform .12s}
.card:hover{border-color:var(--rust);transform:translateY(-2px)}
.th{aspect-ratio:1/1;background:repeating-conic-gradient(var(--p3) 0 25%,var(--paper) 0 50%) 0/22px 22px;background-repeat:no-repeat;background-position:center;background-size:contain;image-rendering:pixelated}
.card.folder .th{background-size:cover;image-rendering:auto;filter:saturate(.95)}
.cap{padding:6px 8px;font-size:11.5px;color:var(--ink3);border-top:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between;gap:6px}
.cap b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--p3);border-radius:20px;padding:0 7px;font-size:10.5px;color:var(--ink3);flex:none}
.folder .th::after{content:"▸";position:absolute}
.folder{position:relative}.folder .fi{position:absolute;top:6px;left:6px;background:rgba(34,28,20,.8);color:var(--paper);font-size:10px;padding:1px 6px;border-radius:5px}
.strip .th::after{content:"▶ anim";position:absolute;bottom:6px;right:6px;background:rgba(34,28,20,.72);color:var(--paper);font-size:9px;padding:1px 5px;border-radius:4px;pointer-events:none}
.strip{position:relative}
.empty{color:var(--ink4);padding:40px;text-align:center}
.dr{position:fixed;top:0;right:0;height:100%;width:420px;max-width:94vw;background:var(--card);border-left:2px solid var(--ink);transform:translateX(100%);transition:transform .2s;z-index:80;overflow-y:auto;padding:16px}
.dr.on{transform:translateX(0)}
.dr .big{aspect-ratio:1/1;background:repeating-conic-gradient(var(--p3) 0 25%,var(--paper) 0 50%) 0/26px 26px;background-repeat:no-repeat;background-position:center;background-size:contain;image-rendering:pixelated;border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px}
.dr h3{margin:0 0 3px;font-size:15px;word-break:break-all}
.dr .p{font-size:12px;color:var(--ink3);margin:2px 0;word-break:break-all}
.dr details{margin-top:10px;font-size:12px}.dr summary{cursor:pointer;color:var(--rust);font-weight:600}
.dr .url{font-size:10.5px;background:var(--paper);border:1px solid var(--border);border-radius:6px;padding:7px;word-break:break-all;margin:8px 0}
.dr .copy{background:var(--ink);color:var(--card);border:0;border-radius:6px;padding:8px 12px;cursor:pointer;font-size:12px;font-weight:600}
.dr .x{position:absolute;top:12px;right:14px;background:transparent;border:0;font-size:20px;cursor:pointer;color:var(--ink3)}
.dr .pvbtn{background:var(--paper);border:1px solid var(--border);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:12px;margin-bottom:10px}
</style>
</head>
<body>
<div class="head">
  <div class="brand">KFB</div>
  <nav class="tabs"><a href="asset-browser.html">3D</a><a class="on" href="asset-browser-2d.html">2D</a></nav>
  <div class="search"><span class="ic">⌕</span><input id="q" type="search" placeholder="Suche — Name oder Ordner…" autocomplete="off"></div>
  <div class="count" id="count">…</div>
</div>
<div class="crumb" id="crumb"></div>
<main><div class="grid" id="grid"></div></main>
<div class="dr" id="dr"><button class="x" onclick="closeDr()">×</button><div id="drin"></div></div>

<script>
const RAW='https://raw.githubusercontent.com/georg-doc/kayfabizarro/main/media/2D_Assets/';
let CAT=null, items=[], folderPaths=[], path=[], q='';
const $=id=>document.getElementById(id);
const url=(fp,f)=>RAW+encodeURI(fp+'/'+f);

// LIVE aus dem GitHub-Ordnerbaum — kein gebackener Katalog. Neue Packs (TreasureHunters,
// Pirate_Bomb, jedes künftige) erscheinen automatisch. (Baukasten-Falle F1: der Baum ist die Wahrheit.)
const TREE='https://api.github.com/repos/georg-doc/kayfabizarro/git/trees/main?recursive=1';
const ROOT='media/2D_Assets/', IMG=/\.(png|jpe?g|gif|webp|svg|bmp)$/i, CKEY='kfb2d-tree-v1';
function ingest(d){
  if(!d||!d.tree){$('grid').innerHTML='<div class="empty">Unerwartete Tree-Antwort.</div>';return;}
  const seen={};items=[];folderPaths=[];
  for(const it of d.tree){
    if(it.type!=='blob'||!it.path.startsWith(ROOT)||!IMG.test(it.path))continue;
    const rel=it.path.slice(ROOT.length),seg=rel.split('/'),file=seg.pop(),fp=seg.join('/');
    seen[fp]=1;items.push({fp,file,url:url(fp,file),key:rel.toLowerCase()});
  }
  folderPaths=Object.keys(seen);
  if(d.truncated)console.warn('[2d-browser] Tree abgeschnitten — Repo sehr groß, nicht alle Assets sichtbar');
  render();
}
function loadTree(force){
  if(!force){try{const c=JSON.parse(sessionStorage.getItem(CKEY)||'null');if(c&&Date.now()-c.t<600000){ingest(c.d);return;}}catch(e){}}
  $('grid').innerHTML='<div class="empty">Lade Ordnerbaum (live aus GitHub)…</div>';
  fetch(TREE,{cache:'no-store'}).then(r=>{if(r.status===403)throw new Error('GitHub-Rate-Limit (60/h) erreicht — kurz warten, dann Zähler klicken zum Neuladen');return r.json();})
    .then(d=>{try{sessionStorage.setItem(CKEY,JSON.stringify({t:Date.now(),d}));}catch(e){}ingest(d);})
    .catch(e=>{$('grid').innerHTML='<div class="empty">Live-Tree nicht ladbar.<br>'+e+'</div>';});
}
$('count').style.cursor='pointer';$('count').title='klicken: live neu laden';
$('count').addEventListener('click',()=>loadTree(true));
loadTree(false);

// ---- Navigation ----
function childNames(cur){const L=cur.length,pre=cur.join('/'),out={};
  for(const fp of folderPaths){const s=fp.split('/');
    if(s.length>L && (L===0||s.slice(0,L).join('/')===pre)){out[s[L]]=1;}}
  return Object.keys(out).sort();}
function coverOf(prefix){const p=items.find(i=>i.fp===prefix||i.fp.startsWith(prefix+'/'));return p?p.url:null;}
function countUnder(prefix){return items.filter(i=>i.fp===prefix||i.fp.startsWith(prefix+'/')).length;}
function filesAt(cur){const j=cur.join('/');return items.filter(i=>i.fp===j);}

function render(){cfgCrumb();
  if(q){const s=q.toLowerCase();const list=items.filter(i=>i.key.includes(s));
    $('count').textContent=list.length+' Treffer';grid(list.map(imgCard).join(''));after(list);return;}
  const kids=childNames(path),files=filesAt(path);
  $('count').textContent=(kids.length?kids.length+' Ordner · ':'')+files.length+' Bilder';
  let h=kids.map(name=>{const pre=path.concat(name).join('/');return folderCard(name,countUnder(pre),coverOf(pre));}).join('');
  h+=files.map(imgCard).join('');
  grid(h||'<div class="empty">leer</div>');after(files);}
function grid(h){$('grid').innerHTML=h;}
function cfgCrumb(){let h='<a onclick="go([])">Alle</a>';let acc=[];
  for(const seg of path){acc=acc.concat(seg);const a=JSON.stringify(acc);h+='<span class="sep">/</span><a onclick=\'go('+a+')\'>'+seg.split('/').pop()+'</a>';}
  $('crumb').innerHTML=h;}
function go(p){path=p;q='';$('q').value='';render();}
function drill(name){path=path.concat(name);render();}

function folderCard(name,n,cover){
  return '<div class="card folder" onclick=\'drill('+JSON.stringify(name)+')\'>'+
    '<div class="th" style="'+(cover?'background-image:url(\''+cover+'\')':'')+'"><span class="fi">Ordner</span></div>'+
    '<div class="cap"><b>'+name+'</b><span class="badge">'+n+'</span></div></div>';}
function imgCard(i,ix){return '<div class="card img" data-url="'+i.url+'" data-file="'+enc(i.file)+'" data-fp="'+enc(i.fp)+'">'+
    '<div class="th" style="background-image:url(\''+i.url+'\')"></div>'+
    '<div class="cap" title="'+i.file+'"><b>'+i.file+'</b></div></div>';}
function enc(s){return s.replace(/"/g,'&quot;');}

// nach dem Rendern: Spritesheet-Erkennung + Hover-Animation + Klick
function after(list){
  for(const card of document.querySelectorAll('.card.img')){
    const u=card.dataset.url,th=card.querySelector('.th');
    const im=new Image();im.onload=()=>{const r=im.naturalWidth/im.naturalHeight;
      if(r>1.8){const frames=Math.max(2,Math.round(r));card.classList.add('strip');
        th.style.backgroundSize='auto 100%';th.style.backgroundPosition='0 center';
        card.dataset.frames=frames;
        let t=null,fi=0;const H=()=>th.clientHeight||150;
        card.addEventListener('mouseenter',()=>{t=setInterval(()=>{fi=(fi+1)%frames;th.style.backgroundPositionX=(-fi*H())+'px';},110);});
        card.addEventListener('mouseleave',()=>{clearInterval(t);fi=0;th.style.backgroundPositionX='0px';});
      }};im.src=u;
    card.addEventListener('click',()=>openDr(card));}
}
// ---- Detail ----
function openDr(card){const u=card.dataset.url,file=card.dataset.file,fp=card.dataset.fp,frames=+card.dataset.frames||0;
  let big='<div class="big" id="bigim" style="background-image:url(\''+u+'\')"></div>';
  let ctl=frames?'<button class="pvbtn" id="pvb">▶ Animation abspielen ('+frames+' Frames)</button>':'';
  $('drin').innerHTML=big+ctl+'<h3>'+file+'</h3><div class="p"><b>Ordner:</b> '+fp+'</div>'+
    '<details><summary>Technisch (RAW-URL)</summary><div class="url" id="u">'+u+'</div>'+
    '<button class="copy" onclick="navigator.clipboard.writeText(document.getElementById(\'u\').textContent)">RAW-URL kopieren</button></details>';
  if(frames){const b=$('bigim');b.style.backgroundSize='auto 100%';b.style.backgroundPosition='0 center';
    let fi=0,t=null;const H=()=>b.clientHeight||360;
    $('pvb').onclick=()=>{if(t){clearInterval(t);t=null;$('pvb').textContent='▶ Animation abspielen ('+frames+' Frames)';return;}
      $('pvb').textContent='⏸ Pause';t=setInterval(()=>{fi=(fi+1)%frames;b.style.backgroundPositionX=(-fi*H())+'px';},110);};}
  $('dr').classList.add('on');}
function closeDr(){$('dr').classList.remove('on');}
$('q').addEventListener('input',e=>{q=e.target.value;render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDr();});
</script>
</body>
</html>
