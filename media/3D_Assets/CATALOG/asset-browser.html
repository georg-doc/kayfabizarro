<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KFB · 3D Asset Browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
/* ============ Kayfabizarro Design System — tokens (inlined) ============ */
@import url("https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@500;600;700;800&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap");
:root{
 --kfb-paper:#f5f0e8;--kfb-paper-2:#ede8dc;--kfb-paper-3:#e5dfd1;--kfb-paper-card:#faf7f2;
 --kfb-border:#d4c5a0;--kfb-border-2:#c0ae88;--kfb-ink:#2c2416;--kfb-ink-2:#4a3f2c;--kfb-ink-3:#7a6e55;--kfb-ink-4:#a89e88;
 --kfb-accent:#8b6914;--kfb-accent-2:#c8a84b;--kfb-rust:#a0432f;--kfb-mark:#fde68a;--kfb-head-bg:#28231e;
 --g1:#2d6a0a;--g1-bg:#e8f4e1;--g2:#8b6914;--g2-bg:#fdf6e3;--g3:#a0432f;--g3-bg:#fdeee9;
 --med-paper:#f4f7fa;--med-paper-2:#e6edf4;--med-paper-3:#d8e2ed;--med-paper-card:#fbfcfe;
 --med-border:#c8d6e4;--med-border-2:#a8bbd2;--med-ink:#0e1c2c;--med-ink-2:#1f3147;--med-ink-3:#3d5470;--med-ink-4:#87a0bd;
 --med-accent:#0b6b6b;--med-accent-2:#b85c00;--med-rust:#a01818;--med-mark:#b3e4e4;--med-head-bg:#28231e;
 --paper:var(--kfb-paper);--paper-2:var(--kfb-paper-2);--paper-3:var(--kfb-paper-3);--paper-card:var(--kfb-paper-card);
 --border:var(--kfb-border);--border-2:var(--kfb-border-2);--ink:var(--kfb-ink);--ink-2:var(--kfb-ink-2);--ink-3:var(--kfb-ink-3);--ink-4:var(--kfb-ink-4);
 --accent:var(--kfb-accent);--accent-2:var(--kfb-accent-2);--rust:var(--kfb-rust);--mark:var(--kfb-mark);--head-bg:var(--kfb-head-bg);
 --ff-display:"Barlow Condensed","Oswald","Arial Narrow",sans-serif;--ff-ui:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;
 --ff-body:"Barlow",-apple-system,system-ui,sans-serif;--ff-mono:"IBM Plex Mono","SF Mono",Menlo,ui-monospace,monospace;
 --fs-xs:11px;--fs-sm:13px;--fs-base:15px;--r-1:3px;--r-2:4px;--r-3:6px;--r-4:8px;
 --sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-6:24px;
 --dur-fast:120ms;--dur-norm:180ms;--ease-out:cubic-bezier(0.2,0.7,0.2,1);
 --shd-hover:0 2px 10px rgba(139,105,20,0.14);--shd-pop:0 4px 16px rgba(44,36,22,0.16);
}
body.med{--paper:var(--med-paper);--paper-2:var(--med-paper-2);--paper-3:var(--med-paper-3);--paper-card:var(--med-paper-card);
 --border:var(--med-border);--border-2:var(--med-border-2);--ink:var(--med-ink);--ink-2:var(--med-ink-2);--ink-3:var(--med-ink-3);--ink-4:var(--med-ink-4);
 --accent:var(--med-accent);--accent-2:var(--med-accent-2);--rust:var(--med-rust);--mark:var(--med-mark);--shd-hover:0 2px 10px rgba(11,107,107,0.14);}

/* ============ layout ============ */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{background:var(--paper);color:var(--ink);font-family:var(--ff-body);font-size:var(--fs-base);-webkit-font-smoothing:antialiased;transition:background var(--dur-norm);}
::selection{background:var(--mark);color:var(--ink);}
.app{min-height:100vh;display:flex;flex-direction:column;}

.app-head{position:sticky;top:0;z-index:50;display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;padding:10px 20px;background:var(--paper-card);border-bottom:2px solid var(--ink);}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{width:38px;height:38px;background:var(--rust);color:#f5f0e8;border:1.5px solid var(--ink);font-family:var(--ff-display);font-weight:800;font-size:15px;display:grid;place-items:center;border-radius:var(--r-2);line-height:.95;text-align:center;}
.brand-title{font-family:var(--ff-display);font-weight:800;font-size:19px;line-height:1;color:var(--ink);letter-spacing:-.01em;}
.brand-sub{font-family:var(--ff-ui);font-weight:600;font-size:10px;line-height:1;color:var(--ink-3);margin-top:4px;letter-spacing:.08em;text-transform:uppercase;}
.app-search{position:relative;max-width:560px;width:100%;justify-self:center;}
.app-search input{width:100%;font-family:var(--ff-body);font-size:14px;padding:9px 34px;background:var(--paper);border:1px solid var(--border);border-radius:var(--r-2);color:var(--ink);outline:none;transition:border-color var(--dur-fast);}
.app-search input:focus{border-color:var(--accent);}
.app-search input::placeholder{color:var(--ink-4);}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);}
.search-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;border:0;color:var(--ink-3);cursor:pointer;font-size:16px;padding:2px 6px;}
.app-controls{display:flex;gap:10px;align-items:center;}
.seg{display:inline-flex;border:1px solid var(--border-2);border-radius:var(--r-2);overflow:hidden;font-family:var(--ff-ui);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;}
.seg button{background:transparent;border:0;padding:7px 11px;cursor:pointer;color:var(--ink-3);}
.seg button+button{border-left:1px solid var(--border);}
.seg button.on{background:var(--accent);color:var(--paper-card);}

.app-body{display:flex;flex:1;min-height:0;}
.rail{width:224px;flex-shrink:0;background:var(--paper-2);border-right:1px solid var(--border);padding:14px 10px;overflow-y:auto;height:calc(100vh - 60px);position:sticky;top:60px;}
.rail-section{margin-bottom:18px;}
.rail-h{font-family:var(--ff-ui);font-weight:700;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:0 4px 6px;display:flex;justify-content:space-between;align-items:center;}
.rail-h button{background:transparent;border:0;color:var(--accent);font:inherit;font-size:10px;cursor:pointer;text-transform:uppercase;letter-spacing:.04em;}
.rrow{display:flex;justify-content:space-between;align-items:center;width:100%;padding:5px 8px;background:transparent;border:0;cursor:pointer;border-radius:var(--r-1);font-family:var(--ff-body);font-size:12.5px;color:var(--ink-2);transition:background var(--dur-fast);text-align:left;gap:6px;}
.rrow:hover{background:var(--paper-3);color:var(--ink);}
.rrow.on{background:var(--accent);color:var(--paper-card);}
.rrow .rn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;}
.rrow .rc{font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-4);}
.rrow.on .rc{color:var(--paper-2);}
.toggle-row{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:12.5px;color:var(--ink-2);cursor:pointer;border-radius:var(--r-1);}
.toggle-row:hover{background:var(--paper-3);}
.toggle-row input{accent-color:var(--accent);}

.content{flex:1;padding:18px 26px 90px;overflow-y:auto;min-width:0;}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:18px;flex-wrap:wrap;}
.chead h1{font-family:var(--ff-display);font-weight:800;font-size:26px;letter-spacing:-.01em;margin:0;color:var(--ink);}
.ccount{font-family:var(--ff-mono);font-size:12px;color:var(--ink-3);margin-left:10px;}
.chead-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.lbl{font-family:var(--ff-ui);font-weight:700;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);}
select.sortsel{font-family:var(--ff-ui);font-weight:600;font-size:12px;padding:6px 8px;background:var(--paper-card);border:1px solid var(--border);border-radius:var(--r-2);color:var(--ink);cursor:pointer;}
.btn{font-family:var(--ff-ui);font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:6px 10px;background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:var(--r-1);cursor:pointer;}
.btn:hover{background:var(--accent);color:var(--paper-card);}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));}
body[data-density="compact"] .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;}
.card{background:var(--paper-card);border:1px solid var(--border);border-radius:var(--r-3);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform var(--dur-norm) var(--ease-out),border-color var(--dur-fast),box-shadow var(--dur-norm);}
.card:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shd-hover);}
.thumb{position:relative;aspect-ratio:1/1;background:var(--paper-3);display:grid;place-items:center;border-bottom:1px solid var(--border);overflow:hidden;}
.thumb img{width:100%;height:100%;object-fit:contain;padding:6px;image-rendering:auto;}
.thumb .noimg{font-family:var(--ff-mono);font-size:10px;color:var(--ink-4);}
.badge{position:absolute;top:6px;left:6px;font-family:var(--ff-ui);font-weight:700;font-size:9px;letter-spacing:.04em;text-transform:uppercase;padding:2px 5px;border-radius:var(--r-1);background:var(--head-bg);color:#f5f0e8;opacity:.92;}
.git{position:absolute;bottom:6px;left:6px;font-family:var(--ff-ui);font-weight:700;font-size:9px;letter-spacing:.03em;padding:2px 6px;border-radius:var(--r-1);display:flex;align-items:center;gap:3px;}
.git.on{background:#2f7a4a;color:#f2fbf4;}
.git.wait{background:#c68a1e;color:#fffaf0;}
.linkrow{display:block;padding:7px 10px;border:1px solid var(--border);border-radius:var(--r-2);font-family:var(--ff-ui);font-weight:600;font-size:12px;color:var(--ink);text-decoration:none;background:var(--paper-card);transition:background var(--dur-fast),border-color var(--dur-fast);}
.linkrow:hover{background:var(--accent);color:var(--paper-card);border-color:var(--accent);}
.linkrow.ok{border-color:#2f7a4a;color:#2f7a4a;}
.linkrow.na{opacity:.6;}
.git.off{background:var(--paper-3);color:var(--ink-4);border:1px solid var(--border);}
.fav{position:absolute;top:5px;right:5px;background:rgba(250,247,242,.85);border:1px solid var(--border);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;cursor:pointer;font-size:13px;color:var(--ink-4);line-height:1;}
.fav.on{color:var(--rust);border-color:var(--rust);}
.cbody{padding:8px 9px 10px;display:flex;flex-direction:column;gap:6px;}
.cname{font-family:var(--ff-mono);font-size:11.5px;color:var(--ink);word-break:break-word;line-height:1.25;}
.cmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.chip{font-family:var(--ff-ui);font-weight:600;font-size:9px;letter-spacing:.03em;text-transform:uppercase;padding:2px 5px;border-radius:var(--r-1);background:var(--paper-2);color:var(--ink-3);border:1px solid var(--border);}
.chip.anim{background:var(--g2-bg);color:var(--g2);border-color:var(--accent-2);}
.dims{font-family:var(--ff-mono);font-size:10px;color:var(--ink-4);}
.scores{display:flex;flex-direction:column;gap:3px;margin-top:2px;}
.scorerow{display:flex;align-items:center;gap:6px;}
.scorerow .sk{font-family:var(--ff-ui);font-weight:700;font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);width:30px;}
.meter{flex:1;height:6px;background:var(--paper-3);border-radius:3px;overflow:hidden;}
.meter i{display:block;height:100%;background:var(--accent-2);}
.scorerow.active .meter i{background:var(--accent);}
.sv{font-family:var(--ff-mono);font-size:10px;color:var(--ink-3);width:14px;text-align:right;}
.stars{display:flex;gap:1px;}
.stars span{cursor:pointer;font-size:13px;line-height:1;color:var(--ink-4);}
.stars span.f{color:var(--accent);}
.stars.usr span.f{color:var(--rust);}

.loadmore{display:block;margin:24px auto;}
.empty{padding:60px 20px;text-align:center;color:var(--ink-3);font-family:var(--ff-ui);}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(44,36,22,.4);opacity:0;pointer-events:none;transition:opacity var(--dur-norm);z-index:80;}
.scrim.on{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;right:0;height:100%;width:420px;max-width:92vw;background:var(--paper-card);border-left:2px solid var(--ink);transform:translateX(100%);transition:transform var(--dur-slow,220ms) var(--ease-out);z-index:81;overflow-y:auto;box-shadow:var(--shd-pop);}
.drawer.on{transform:translateX(0);}
.dhead{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:sticky;top:0;background:var(--paper-card);}
.dhead h2{font-family:var(--ff-mono);font-size:15px;margin:0;color:var(--ink);word-break:break-word;}
.dclose{background:transparent;border:0;font-size:22px;color:var(--ink-3);cursor:pointer;line-height:1;}
.dbody{padding:16px 18px;display:flex;flex-direction:column;gap:14px;}
.dthumb{aspect-ratio:1/1;background:var(--paper-3);border:1px solid var(--border);border-radius:var(--r-3);display:grid;place-items:center;overflow:hidden;}
.dthumb img{width:100%;height:100%;object-fit:contain;padding:14px;}
.drow{display:flex;justify-content:space-between;gap:12px;font-size:13px;border-bottom:1px dashed var(--border);padding-bottom:6px;}
.drow .dk{font-family:var(--ff-ui);font-weight:700;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);}
.drow .dv{font-family:var(--ff-mono);font-size:12px;color:var(--ink-2);text-align:right;word-break:break-all;}
.pathbox{display:flex;gap:6px;align-items:center;}
.pathbox code{flex:1;font-family:var(--ff-mono);font-size:11px;background:var(--paper-2);padding:6px 8px;border-radius:var(--r-2);border:1px solid var(--border);color:var(--ink-2);word-break:break-all;}
.rate-block{display:flex;flex-direction:column;gap:8px;background:var(--paper-2);border:1px solid var(--border);border-radius:var(--r-3);padding:12px;}
.rate-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.rate-row .rk{font-family:var(--ff-ui);font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);}
.rate-row .stars span{font-size:17px;}
.reset{background:transparent;border:0;color:var(--ink-4);cursor:pointer;font-size:11px;font-family:var(--ff-ui);text-transform:uppercase;letter-spacing:.04em;}
.foot{position:fixed;bottom:0;left:0;right:0;background:var(--head-bg);color:#e9e2d6;font-family:var(--ff-mono);font-size:11px;padding:6px 20px;display:flex;justify-content:space-between;z-index:40;}
.foot .quote{font-family:var(--ff-body);font-style:italic;color:#c8bda8;}
@media(max-width:820px){.rail{display:none;}.app-search{max-width:none;}}
</style>
</head>
<body data-density="cozy">
<div class="app">
  <header class="app-head">
    <div class="brand">
      <div class="brand-mark">KFB</div>
      <div><div class="brand-title">3D Asset Browser</div><div class="brand-sub" id="brandsub">Crit-Engine · 1825 assets</div></div>
    </div>
    <div class="app-search">
      <span class="search-icon">⌕</span>
      <input id="q" type="search" placeholder="live search — name, pack, category…" autocomplete="off">
      <button class="search-clear" id="qclear" title="clear">×</button>
    </div>
    <div class="app-controls">
      <div class="seg" id="theme">
        <button data-theme="kfb" class="on">KFB</button>
        <button data-theme="med">MED</button>
      </div>
      <div class="seg" id="density">
        <button data-den="cozy" class="on">Cozy</button>
        <button data-den="compact">Dense</button>
      </div>
    </div>
  </header>

  <div class="app-body">
    <aside class="rail">
      <div class="rail-section">
        <div class="rail-h">Verträge / Docs (live aus GitHub)</div>
        <div id="contractList" style="font-size:12px;color:var(--ink-2)">lädt…</div>
      </div>
      <div class="rail-section">
        <div class="rail-h">Quick filters</div>
        <label class="toggle-row"><input type="checkbox" id="fAnim"> Animated only <span class="rc" id="cAnim" style="margin-left:auto"></span></label>
        <label class="toggle-row"><input type="checkbox" id="fFav"> ★ Favorites only <span class="rc" id="cFav" style="margin-left:auto"></span></label>
        <label class="toggle-row"><input type="checkbox" id="fPrev"> Has 3D preview</label>
        <label class="toggle-row"><input type="checkbox" id="fRated"> My-rated only</label>
        <label class="toggle-row"><input type="checkbox" id="fGit"> ✓ Auf GitHub only <span class="rc" id="cGit" style="margin-left:auto"></span></label>
      </div>
      <div class="rail-section">
        <div class="rail-h">Packs <button id="clearPacks">reset</button></div>
        <div id="packList"></div>
      </div>
      <div class="rail-section">
        <div class="rail-h">Category <button id="clearSubs">reset</button></div>
        <div id="subList"></div>
      </div>
    </aside>

    <main class="content">
      <div class="chead">
        <div><h1 id="htitle">All assets</h1><span class="ccount" id="hcount"></span></div>
        <div class="chead-right">
          <span class="lbl">Rank by</span>
          <select class="sortsel" id="sort">
            <option value="combined">Best fit (theme-weighted)</option>
            <option value="kfb">KFB fit ↓</option>
            <option value="med">MED fit ↓</option>
            <option value="ease">Ease of use ↓</option>
            <option value="anim">Animated first</option>
            <option value="size">Footprint (small→large)</option>
            <option value="sizeD">Footprint (large→small)</option>
            <option value="name">Name A→Z</option>
            <option value="pack">Pack</option>
          </select>
          <button class="btn" id="export">Export ratings</button>
        </div>
      </div>
      <div class="grid" id="grid"></div>
      <button class="btn loadmore" id="loadmore" style="display:none">Load more</button>
      <div class="empty" id="empty" style="display:none">No assets match these filters.</div>
    </main>
  </div>
  <div class="foot">
    <span id="footcount"></span>
    <span class="quote" id="footquote">“Re-frame, don’t erase.” — Kayfabizarro</span>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>

<script src="catalog.js"></script>
<script>
(function(){
  const DATA = (window.CATALOG && window.CATALOG.assets) ? window.CATALOG.assets : [];
  const IMGBASE = "../"; // browser lives in CATALOG/, images in ../<pack>/...
  const LS_RATE="kfb_asset_ratings", LS_FAV="kfb_asset_favs";
  let ratings={}, favs={};
  try{ratings=JSON.parse(localStorage.getItem(LS_RATE)||"{}");}catch(e){}
  try{favs=JSON.parse(localStorage.getItem(LS_FAV)||"{}");}catch(e){}
  const saveR=()=>{try{localStorage.setItem(LS_RATE,JSON.stringify(ratings));}catch(e){}};
  const saveF=()=>{try{localStorage.setItem(LS_FAV,JSON.stringify(favs));}catch(e){}};

  // effective score: user override wins over heuristic
  const eff=(a,dim)=>{const r=ratings[a.path]; if(r&&r[dim]!=null)return r[dim]; return a.scores?a.scores[dim]:0;};
  const isRated=a=>!!ratings[a.path];
  const theme=()=>document.body.classList.contains("med")?"med":"kfb";
  const fitDim=()=>theme()==="med"?"med":"kfb";
  const combined=a=>{const f=eff(a,fitDim()); return (eff(a,"ease")+2*f)/3;};

  // ---- GitHub-Status ----
  // 1) LIVE aus dem Repo (GitHub-Baum, ein Aufruf) = die Wahrheit.
  // 2) Faellt der Aufruf aus (Rate-Limit/offline), Fallback auf github_status.json (gepflegt).
  const GH_TREE="https://api.github.com/repos/georg-doc/kayfabizarro/git/trees/main?recursive=1";
  const GH_PREFIX="media/3D_Assets/";
  let GIT={packs:{},assets_github:[]};
  let LIVE=null;                 // Set der real im Repo liegenden Katalog-Pfade, oder null
  const gitSet=new Set();        // Einzel-Overrides aus dem Manifest
  // Zwei Spuren: manche Packs liegen auf GitHub FLACH unter GLB_* , der Katalog fuehrt sie nested.
  // Ohne diese Zuordnung matchen die Pfade nie -> faelschlich grau. (Gemessen 23.07. am Repo-Baum.)
  // Nur Packs, deren VOLLER Inhalt (gleiche Dateinamen + Anzahl) am 23.07. auf GitHub bestaetigt ist.
  // NICHT gemappt: mini-arcade/arena/dungeon/market + platformer-kit — davon liegen auf GitHub nur
  // kleine Character-Teilmengen (2/1/2/1/5), nicht die vollen Kits (20/22/25/20/153).
  const GH_PACKMAP={
    "kenney_pirate-kit":"GLB_pirate/",          // 72=72, Namen exakt geprueft
    "kenney_cube-pets_1.0":"GLB_cube-pets/",    // 24=24
    "kenney_hexagon-kit":"GLB_hexagon_kit/",    // 72=72
    "kenney_mini-characters":"GLB_mini_chars/", // 26=26
    "kenney_blocky-characters_20":"GLB_blocky_chars/" // 18=18
  };
  // echter GitHub-Pfad (fuer Gruen-Pruefung + GitHub-Link); lokaler a.path bleibt fuer lokale Links.
  function ghPathOf(a){ const pre=GH_PACKMAP[a.pack]; return pre ? pre + a.path.split("/").pop() : a.path; }
  function gitState(a){
    if(LIVE){ return LIVE.has(ghPathOf(a))?"github":"local"; }   // live: nur github/local, kein "ungeprueft"
    if(gitSet.has(ghPathOf(a)))return "github";
    return GIT.packs[a.pack]||"local";
  }
  function isOnGit(a){return gitState(a)==="github";}
  // ---- Links (GitHub + lokal) ----
  const GH_BLOB="https://github.com/georg-doc/kayfabizarro/blob/main/media/3D_Assets/";
  const encPath=p=>p.split("/").map(encodeURIComponent).join("/");
  function ghBlobURL(p){return GH_BLOB+encPath(p);}
  function localFileURL(p){try{return new URL("../"+encPath(p),location.href).href;}catch(e){return "../"+encPath(p);}}
  function localDirURL(p){const d=p.substring(0,p.lastIndexOf("/"));try{return new URL("../"+encPath(d)+"/",location.href).href;}catch(e){return "../"+encPath(d)+"/";}}
  // ---- Verträge/Docs: Version + letzter Commit, live ----
  const RAW="https://raw.githubusercontent.com/georg-doc/kayfabizarro/main/media/3D_Assets/";
  const CMT="https://api.github.com/repos/georg-doc/kayfabizarro/commits?per_page=1&path=media/3D_Assets/";
  const TRACK=[
    {f:"kfb-pets.json", ver:"json"},
    {f:"kfb-pets.js",   ver:"const"},
    {f:"ASSETS.md",     ver:"none"},
  ];
  async function loadContracts(){
    const el=document.getElementById("contractList"); if(!el)return; el.innerHTML="";
    for(const t of TRACK){
      const row=document.createElement("div");
      row.style.cssText="display:flex;gap:6px;align-items:baseline;padding:3px 0;border-bottom:1px solid var(--border)";
      let ver="—", date="—";
      try{
        const r=await fetch(RAW+encodeURI(t.f)+"?v="+Date.now(),{cache:"no-store"});
        if(r.ok){ const txt=await r.text();
          if(t.ver==="json"){ try{const j=JSON.parse(txt); ver="v"+(j.version||"?"); }catch(e){} }
          else if(t.ver==="const"){ const m=txt.match(/VERSION\s*=\s*([0-9]+)/); if(m)ver="v"+m[1]; }
        }
      }catch(e){}
      try{
        const c=await fetch(CMT+encodeURIComponent(t.f)); if(c.ok){ const j=await c.json();
          if(j[0]&&j[0].commit) date=(j[0].commit.committer.date||"").slice(0,10); }
      }catch(e){}
      row.innerHTML=`<a href="https://github.com/georg-doc/kayfabizarro/blob/main/media/3D_Assets/${encodeURI(t.f)}" target="_blank" rel="noopener" style="color:var(--ink);text-decoration:none;font-family:var(--ff-mono);font-size:11px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.f}</a><b style="color:var(--green);font-size:11px">${ver}</b><span style="color:var(--ink-4);font-size:10.5px">${date}</span>`;
      el.appendChild(row);
    }
  }
  loadContracts();
  function setGitCount(src){
    const n=DATA.filter(isOnGit).length;
    const el=document.getElementById("cGit"); if(el)el.textContent=n+(src?(" · "+src):"");
  }
  // Manifest zuerst laden (schneller Fallback), dann live drueberlegen.
  fetch("github_status.json").then(r=>r.json()).then(j=>{ GIT=j||GIT; (GIT.assets_github||[]).forEach(p=>gitSet.add(p)); setGitCount("Manifest"); render(true); }).catch(()=>{});
  fetch(GH_TREE).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }).then(j=>{
    if(!j || !j.tree){ throw new Error("kein tree"); }
    LIVE=new Set();
    for(const t of j.tree){ if(t.type==="blob" && t.path.startsWith(GH_PREFIX)){ LIVE.add(t.path.slice(GH_PREFIX.length)); } }
    if(j.truncated){ console.warn("[git] Baum abgeschnitten - Anzeige evtl. unvollstaendig"); }
    setGitCount("live"); render(true);
  }).catch(e=>{ console.warn("[git] Live-Abruf fehlgeschlagen, Fallback Manifest:", e.message); });

  const state={q:"",packs:new Set(),subs:new Set(),anim:false,fav:false,prev:false,rated:false,git:false,sort:"combined",shown:0,PAGE:120};

  // ---- build rail facets ----
  const packCounts={},subCounts={};
  DATA.forEach(a=>{packCounts[a.pack]=(packCounts[a.pack]||0)+1;subCounts[a.subcategory]=(subCounts[a.subcategory]||0)+1;});
  const packList=document.getElementById("packList");
  Object.keys(packCounts).sort().forEach(p=>{
    const b=document.createElement("button");b.className="rrow";b.dataset.pack=p;
    b.innerHTML=`<span class="rn">${p.replace(/^kenney_/,"").replace(/_[0-9.]+$/,"")}</span><span class="rc">${packCounts[p]}</span>`;
    b.onclick=()=>{state.packs.has(p)?state.packs.delete(p):state.packs.add(p);b.classList.toggle("on");render(true);};
    packList.appendChild(b);
  });
  const subList=document.getElementById("subList");
  Object.keys(subCounts).sort((a,b)=>subCounts[b]-subCounts[a]).forEach(s=>{
    const b=document.createElement("button");b.className="rrow";b.dataset.sub=s;
    b.innerHTML=`<span class="rn">${s}</span><span class="rc">${subCounts[s]}</span>`;
    b.onclick=()=>{state.subs.has(s)?state.subs.delete(s):state.subs.add(s);b.classList.toggle("on");render(true);};
    subList.appendChild(b);
  });
  document.getElementById("cAnim").textContent=DATA.filter(a=>a.animations&&a.animations.length).length;

  // ---- filtering ----
  function filtered(){
    const q=state.q.toLowerCase();
    return DATA.filter(a=>{
      if(state.packs.size&&!state.packs.has(a.pack))return false;
      if(state.subs.size&&!state.subs.has(a.subcategory))return false;
      if(state.anim&&!(a.animations&&a.animations.length))return false;
      if(state.fav&&!favs[a.path])return false;
      if(state.prev&&!(a.preview&&(a.preview.indexOf("/Previews/")>-1||a.preview.indexOf("/Isometric/")>-1)))return false;
      if(state.rated&&!isRated(a))return false;
      if(state.git&&!isOnGit(a))return false;
      if(q){const hay=(a.name+" "+a.pack+" "+a.subcategory+" "+a.category).toLowerCase();if(hay.indexOf(q)<0)return false;}
      return true;
    });
  }
  function sorted(list){
    const s=state.sort;const fp=a=>a.footprint_xz?(a.footprint_xz[0]*a.footprint_xz[1]):0;
    const cmp={
      combined:(a,b)=>combined(b)-combined(a)||a.name.localeCompare(b.name),
      kfb:(a,b)=>eff(b,"kfb")-eff(a,"kfb")||a.name.localeCompare(b.name),
      med:(a,b)=>eff(b,"med")-eff(a,"med")||a.name.localeCompare(b.name),
      ease:(a,b)=>eff(b,"ease")-eff(a,"ease")||a.name.localeCompare(b.name),
      anim:(a,b)=>((b.animations?b.animations.length:0)-(a.animations?a.animations.length:0))||a.name.localeCompare(b.name),
      size:(a,b)=>fp(a)-fp(b),sizeD:(a,b)=>fp(b)-fp(a),
      name:(a,b)=>a.name.localeCompare(b.name),
      pack:(a,b)=>a.pack.localeCompare(b.pack)||a.name.localeCompare(b.name),
    }[s];
    return list.slice().sort(cmp);
  }

  // ---- star widget ----
  function starsHTML(val,usr){let h=`<div class="stars${usr?' usr':''}">`;for(let i=1;i<=5;i++)h+=`<span data-v="${i}" class="${i<=Math.round(val)?'f':''}">★</span>`;return h+"</div>";}

  const grid=document.getElementById("grid");
  let curList=[];
  function cardHTML(a){
    const dim=fitDim();
    const img=a.preview?`<img loading="lazy" src="${IMGBASE+encodeURI(a.preview)}" onerror="this.style.display='none';this.parentNode.querySelector('.noimg').style.display='block'">`:"";
    const anim=a.animations&&a.animations.length?`<span class="chip anim">🎞 ${a.animations.length}</span>`:"";
    const gs=gitState(a);
    const git=gs==="github"?`<span class="git on" title="im GitHub-Repo, per URL geprueft">✓ GitHub</span>`
      :gs==="unverified"?`<span class="git wait" title="angeblich hochgeladen, per URL NICHT bestaetigt">? ungeprueft</span>`
      :`<span class="git off" title="nur lokal, noch nicht hochgeladen">lokal</span>`;
    const fp=a.footprint_xz?`${a.footprint_xz[0]}×${a.footprint_xz[1]}`:"—";
    const rows=[["EASE","ease"],["KFB","kfb"],["MED","med"]].map(([lab,d])=>{
      const v=eff(a,d);const on=d===dim?"active":"";
      return `<div class="scorerow ${on}"><span class="sk">${lab}</span><div class="meter"><i style="width:${v/5*100}%"></i></div><span class="sv">${v}</span></div>`;
    }).join("");
    return `<article class="card" data-path="${encodeURIComponent(a.path)}">
      <div class="thumb"><span class="badge">${a.pack.replace(/^kenney_/,"").replace(/_[0-9.]+$/,"").slice(0,10)}</span>
        <button class="fav ${favs[a.path]?'on':''}" data-fav="${encodeURIComponent(a.path)}" title="favorite">${favs[a.path]?'♥':'♡'}</button>
        ${img}<span class="noimg" style="display:${a.preview?'none':'block'}">no preview</span>${git}</div>
      <div class="cbody">
        <div class="cname">${a.name}</div>
        <div class="cmeta"><span class="chip">${a.subcategory}</span>${anim}<span class="dims">fp ${fp}</span></div>
        <div class="scores">${rows}</div>
      </div></article>`;
  }
  function render(reset){
    if(reset)state.shown=0;
    curList=sorted(filtered());
    document.getElementById("hcount").textContent=curList.length+" of "+DATA.length;
    document.getElementById("footcount").textContent=curList.length+" shown · "+DATA.length+" total · "+Object.keys(ratings).length+" rated";
    const end=Math.min(curList.length,state.shown+state.PAGE);
    if(reset)grid.innerHTML="";
    let html="";for(let i=state.shown;i<end;i++)html+=cardHTML(curList[i]);
    if(reset)grid.innerHTML=html;else grid.insertAdjacentHTML("beforeend",html);
    state.shown=end;
    document.getElementById("loadmore").style.display=end<curList.length?"block":"none";
    document.getElementById("empty").style.display=curList.length?"none":"block";
    const t=[...state.packs].map(p=>p.replace(/^kenney_/,"")).join(", ");
    document.getElementById("htitle").textContent=state.packs.size?t:(state.subs.size?[...state.subs].join(", "):"All assets");
  }

  // ---- events ----
  const q=document.getElementById("q");
  q.oninput=()=>{state.q=q.value;render(true);};
  document.getElementById("qclear").onclick=()=>{q.value="";state.q="";render(true);};
  document.getElementById("sort").onchange=e=>{state.sort=e.target.value;render(true);};
  document.getElementById("loadmore").onclick=()=>render(false);
  document.getElementById("fAnim").onchange=e=>{state.anim=e.target.checked;render(true);};
  document.getElementById("fFav").onchange=e=>{state.fav=e.target.checked;render(true);};
  document.getElementById("fPrev").onchange=e=>{state.prev=e.target.checked;render(true);};
  document.getElementById("fRated").onchange=e=>{state.rated=e.target.checked;render(true);};
  document.getElementById("fGit").onchange=e=>{state.git=e.target.checked;render(true);};
  document.getElementById("clearPacks").onclick=()=>{state.packs.clear();document.querySelectorAll("#packList .rrow").forEach(b=>b.classList.remove("on"));render(true);};
  document.getElementById("clearSubs").onclick=()=>{state.subs.clear();document.querySelectorAll("#subList .rrow").forEach(b=>b.classList.remove("on"));render(true);};
  document.getElementById("theme").onclick=e=>{const b=e.target.closest("button");if(!b)return;document.body.classList.toggle("med",b.dataset.theme==="med");document.querySelectorAll("#theme button").forEach(x=>x.classList.toggle("on",x===b));render(true);};
  document.getElementById("density").onclick=e=>{const b=e.target.closest("button");if(!b)return;document.body.dataset.density=b.dataset.den;document.querySelectorAll("#density button").forEach(x=>x.classList.toggle("on",x===b));};

  grid.addEventListener("click",e=>{
    const fav=e.target.closest(".fav");
    if(fav){e.stopPropagation();const p=decodeURIComponent(fav.dataset.fav);favs[p]=!favs[p];if(!favs[p])delete favs[p];saveF();fav.classList.toggle("on",!!favs[p]);fav.textContent=favs[p]?"♥":"♡";document.getElementById("cFav").textContent=Object.keys(favs).length;return;}
    const card=e.target.closest(".card");if(card)openDrawer(decodeURIComponent(card.dataset.path));
  });
  document.getElementById("cFav").textContent=Object.keys(favs).length;

  // ---- drawer ----
  const drawer=document.getElementById("drawer"),scrim=document.getElementById("scrim");
  function openDrawer(path){
    const a=DATA.find(x=>x.path===path);if(!a)return;
    const img=a.preview?`<img src="${IMGBASE+encodeURI(a.preview)}">`:`<span class="noimg">no preview</span>`;
    const anims=a.animations&&a.animations.length?a.animations.join(", "):"—";
    const rate=[["Ease of use","ease"],["KFB fit","kfb"],["MED fit","med"]].map(([lab,d])=>{
      const v=eff(a,d),usr=ratings[a.path]&&ratings[a.path][d]!=null;
      return `<div class="rate-row"><span class="rk">${lab}</span><div style="display:flex;align-items:center;gap:8px">${starsHTML(v,usr)}${usr?`<button class="reset" data-reset="${d}">reset</button>`:""}</div></div>`;
    }).join("");
    drawer.innerHTML=`<div class="dhead"><h2>${a.name}</h2><button class="dclose">×</button></div>
      <div class="dbody">
        <div class="dthumb">${img}</div>
        <div class="rate-block"><div class="lbl" style="margin-bottom:2px">Your ratings override the heuristic defaults</div>${rate}</div>
        <div class="drow"><span class="dk">Pack</span><span class="dv">${a.pack}</span></div>
        <div class="drow"><span class="dk">Category</span><span class="dv">${a.category} · ${a.subcategory}</span></div>
        <div class="drow"><span class="dk">Size w×h×d</span><span class="dv">${a.size?a.size.join(" × "):"—"}</span></div>
        <div class="drow"><span class="dk">Footprint x×z</span><span class="dv">${a.footprint_xz?a.footprint_xz.join(" × "):"—"}</span></div>
        <div class="drow"><span class="dk">Meshes · skinned</span><span class="dv">${a.n_meshes} · ${a.skinned?"yes":"no"}</span></div>
        <div class="drow"><span class="dk">Animations (${a.animations?a.animations.length:0})</span><span class="dv" style="max-width:230px">${anims}</span></div>
        <div><div class="lbl" style="margin-bottom:4px">GLB path (relative to 3D Assets/)</div>
          <div class="pathbox"><code id="pcode">${a.path}</code><button class="btn" id="copyPath">Copy</button></div></div>
        <div><div class="lbl" style="margin-bottom:4px">Links</div>
          <div style="display:flex;flex-direction:column;gap:6px">
            <a class="linkrow ${gitState(a)==='github'?'ok':'na'}" href="${ghBlobURL(ghPathOf(a))}" target="_blank" rel="noopener" title="${gitState(a)==='github'?'im Repo':'noch nicht im Repo — Link zeigt trotzdem den erwarteten Ort'}">${gitState(a)==='github'?'✓':'·'} GitHub öffnen</a>
            <a class="linkrow" href="${localFileURL(a.path)}" target="_blank" rel="noopener" title="Datei lokal oeffnen">↗ Lokale Datei öffnen</a>
            <a class="linkrow" href="${localDirURL(a.path)}" target="_blank" rel="noopener" title="Ordner im Finder zeigen">📁 Ordner im Finder</a>
          </div></div>
      </div>`;
    drawer.dataset.path=path;drawer.classList.add("on");scrim.classList.add("on");
    drawer.querySelector(".dclose").onclick=closeDrawer;
    drawer.querySelector("#copyPath").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(a.path);const b=drawer.querySelector("#copyPath");b.textContent="Copied";setTimeout(()=>b.textContent="Copy",1200);};
    drawer.querySelectorAll(".rate-row .stars").forEach((sw,idx)=>{
      const dim=["ease","kfb","med"][idx];
      sw.querySelectorAll("span").forEach(st=>st.onclick=()=>{
        const v=+st.dataset.v;ratings[a.path]=ratings[a.path]||{};ratings[a.path][dim]=v;saveR();openDrawer(path);render(false);syncCard(path);
      });
    });
    drawer.querySelectorAll(".reset").forEach(rb=>rb.onclick=()=>{const d=rb.dataset.reset;if(ratings[a.path]){delete ratings[a.path][d];if(!Object.keys(ratings[a.path]).length)delete ratings[a.path];}saveR();openDrawer(path);render(false);});
  }
  function syncCard(path){/* re-render list to reflect new score ordering lazily */}
  function closeDrawer(){drawer.classList.remove("on");scrim.classList.remove("on");}
  scrim.onclick=closeDrawer;
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();});

  // ---- export ratings ----
  document.getElementById("export").onclick=()=>{
    const out={exported:new Date().toISOString(),ratings,favorites:Object.keys(favs)};
    const blob=new Blob([JSON.stringify(out,null,1)],{type:"application/json"});
    const url=URL.createObjectURL(blob);const link=document.createElement("a");
    link.href=url;link.download="kfb_asset_ratings.json";link.click();URL.revokeObjectURL(url);
  };

  document.getElementById("brandsub").textContent="Crit-Engine · "+DATA.length+" assets";
  render(true);
})();
</script>
</body>
</html>
