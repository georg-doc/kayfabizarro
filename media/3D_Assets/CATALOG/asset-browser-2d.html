<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KFB · 2D Asset Browser</title>
<style>
:root{
  --paper:#f3ede1; --paper-card:#faf7f2; --paper-3:#e9e1d2; --ink:#221c14; --ink-3:#7a6f5c; --ink-4:#a89a80;
  --rust:#b5502e; --accent:#b5502e; --border:#d8cdb8; --r-2:7px; --r-3:5px;
  --ff-body:'Segoe UI',system-ui,sans-serif; --ff-display:'Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--ff-body);color:var(--ink);background:var(--paper);}
a{color:inherit}
.head{position:sticky;top:0;z-index:50;display:grid;grid-template-columns:auto auto 1fr auto;gap:16px;align-items:center;padding:9px 18px;background:var(--paper-card);border-bottom:2px solid var(--ink);}
.brand{width:36px;height:36px;background:var(--rust);color:#f5f0e8;border:1.5px solid var(--ink);font-weight:800;font-size:13px;display:grid;place-items:center;border-radius:var(--r-2);line-height:.95;text-align:center;}
.tabs{display:flex;gap:4px}
.tabs a{padding:6px 13px;border:1px solid var(--border);border-radius:var(--r-2);font-size:13px;font-weight:600;text-decoration:none;background:var(--paper)}
.tabs a.on{background:var(--ink);color:var(--paper-card);border-color:var(--ink)}
.search{position:relative;max-width:520px;width:100%;justify-self:center}
.search input{width:100%;font-size:14px;padding:8px 32px;background:var(--paper);border:1px solid var(--border);border-radius:var(--r-2);color:var(--ink);outline:none}
.search input:focus{border-color:var(--accent)}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.count{font-size:12px;color:var(--ink-3);white-space:nowrap}
.wrap{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 55px)}
.rail{border-right:1px solid var(--border);padding:12px 10px;overflow-y:auto;max-height:calc(100vh - 55px);position:sticky;top:55px}
.rail-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);margin:10px 4px 4px}
.pk{width:100%;text-align:left;background:transparent;border:0;padding:7px 9px;border-radius:var(--r-3);cursor:pointer;font-size:13px;display:flex;justify-content:space-between;gap:8px;color:var(--ink)}
.pk:hover{background:var(--paper-3)}
.pk.on{background:var(--ink);color:var(--paper-card);font-weight:600}
.pk .rc{color:var(--ink-4);font-size:11px}
.pk.on .rc{color:var(--paper-3)}
.sub{margin:2px 0 6px 6px;border-left:1px solid var(--border);padding-left:6px}
.sub button{width:100%;text-align:left;background:transparent;border:0;padding:4px 8px;border-radius:var(--r-3);cursor:pointer;font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between;gap:6px}
.sub button:hover{background:var(--paper-3);color:var(--ink)}
.sub button.on{color:var(--rust);font-weight:600}
.main{padding:14px 18px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
.card{background:var(--paper-card);border:1px solid var(--border);border-radius:var(--r-2);overflow:hidden;cursor:pointer;transition:border-color .12s,transform .12s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.th{aspect-ratio:1/1;display:grid;place-items:center;overflow:hidden;
  background:conic-gradient(#e9e1d2 25%,#f3ede1 0 50%,#e9e1d2 0 75%,#f3ede1 0) 0/22px 22px}
.th img{max-width:100%;max-height:100%;image-rendering:pixelated;display:block}
.cap{padding:5px 7px;font-size:11px;color:var(--ink-3);border-top:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* drawer */
.dr{position:fixed;top:0;right:0;height:100%;width:400px;max-width:92vw;background:var(--paper-card);border-left:2px solid var(--ink);transform:translateX(100%);transition:transform .2s;z-index:80;overflow-y:auto;padding:16px}
.dr.on{transform:translateX(0)}
.dr .big{aspect-ratio:1/1;background:conic-gradient(#e9e1d2 25%,#f3ede1 0 50%,#e9e1d2 0 75%,#f3ede1 0) 0/26px 26px;display:grid;place-items:center;border:1px solid var(--border);border-radius:var(--r-2);overflow:hidden;margin-bottom:12px}
.dr .big img{max-width:100%;max-height:100%;image-rendering:pixelated}
.dr h3{margin:0 0 3px;font-size:15px;word-break:break-all}
.dr .p{font-size:12px;color:var(--ink-3);word-break:break-all;margin:2px 0}
.dr .url{font-size:11px;background:var(--paper);border:1px solid var(--border);border-radius:var(--r-3);padding:7px;word-break:break-all;margin:8px 0}
.dr button.x{position:absolute;top:12px;right:14px;background:transparent;border:0;font-size:20px;cursor:pointer;color:var(--ink-3)}
.dr .copy{background:var(--ink);color:var(--paper-card);border:0;border-radius:var(--r-2);padding:8px 12px;cursor:pointer;font-size:13px;font-weight:600}
.empty{color:var(--ink-4);padding:40px;text-align:center;font-size:14px}
@media(max-width:760px){.wrap{grid-template-columns:1fr}.rail{display:none}}
</style>
</head>
<body>
<div class="head">
  <div class="brand">KFB</div>
  <nav class="tabs">
    <a href="asset-browser.html">3D</a>
    <a class="on" href="asset-browser-2d.html">2D</a>
  </nav>
  <div class="search"><span class="ic">⌕</span><input id="q" type="search" placeholder="Suche — Name oder Ordner…" autocomplete="off"></div>
  <div class="count" id="count">…</div>
</div>
<div class="wrap">
  <aside class="rail" id="rail"></aside>
  <main class="main"><div class="grid" id="grid"></div></main>
</div>
<div class="dr" id="dr"><button class="x" onclick="closeDr()">×</button><div id="drin"></div></div>

<script>
const RAW='https://raw.githubusercontent.com/georg-doc/kayfabizarro/main/media/2D_Assets/';
let CAT=null, items=[], pack=null, folder=null, q='';
const $=id=>document.getElementById(id);

fetch('2d-catalog.json').then(r=>r.json()).then(c=>{
  CAT=c;
  for(const [pk,pv] of Object.entries(c.packs))
    for(const [fld,files] of Object.entries(pv.folders))
      for(const f of files) items.push({pack:pk,folder:fld,file:f,url:RAW+encodeURI(fld)+'/'+encodeURIComponent(f)});
  buildRail(); render();
}).catch(e=>{$('grid').innerHTML='<div class="empty">2d-catalog.json nicht gefunden.<br>'+e+'</div>';});

function buildRail(){
  let h='<div class="rail-h">Packs · '+CAT.total_files+' Bilder</div>';
  h+='<button class="pk'+(pack===null?' on':'')+'" onclick="setPack(null)">Alle<span class="rc">'+CAT.total_files+'</span></button>';
  for(const [pk,pv] of Object.entries(CAT.packs)){
    h+='<button class="pk'+(pack===pk?' on':'')+'" onclick="setPack(\''+esc(pk)+'\')">'+pk+'<span class="rc">'+pv.count+'</span></button>';
    if(pack===pk){
      h+='<div class="sub">';
      for(const [fld,files] of Object.entries(pv.folders)){
        const short=fld.split('/').slice(1).join('/')||fld;
        h+='<button class="'+(folder===fld?'on':'')+'" onclick="setFolder(\''+esc(fld)+'\',event)">'+short+'<span>'+files.length+'</span></button>';
      }
      h+='</div>';
    }
  }
  $('rail').innerHTML=h;
}
function esc(s){return s.replace(/'/g,"\\'")}
function setPack(p){pack=p;folder=null;buildRail();render();}
function setFolder(f,e){e.stopPropagation();folder=(folder===f?null:f);buildRail();render();}

function render(){
  let list=items;
  if(pack)list=list.filter(i=>i.pack===pack);
  if(folder)list=list.filter(i=>i.folder===folder);
  if(q){const s=q.toLowerCase();list=list.filter(i=>(i.file+' '+i.folder).toLowerCase().includes(s));}
  $('count').textContent=list.length+' / '+CAT.total_files;
  if(!list.length){$('grid').innerHTML='<div class="empty">Nichts gefunden.</div>';return;}
  const cap=1200;
  $('grid').innerHTML=list.slice(0,cap).map((i,ix)=>
    '<div class="card" onclick="openDr('+ix+')"><div class="th"><img loading="lazy" src="'+i.url+'" alt=""></div><div class="cap" title="'+i.file+'">'+i.file+'</div></div>'
  ).join('');
  window.__list=list.slice(0,cap);
}
function openDr(ix){
  const i=window.__list[ix];
  $('drin').innerHTML='<div class="big"><img src="'+i.url+'"></div><h3>'+i.file+'</h3>'+
    '<div class="p"><b>Pack:</b> '+i.pack+'</div><div class="p"><b>Ordner:</b> '+i.folder+'</div>'+
    '<div class="url" id="u">'+i.url+'</div><button class="copy" onclick="navigator.clipboard.writeText(document.getElementById(\'u\').textContent)">RAW-URL kopieren</button>';
  $('dr').classList.add('on');
}
function closeDr(){$('dr').classList.remove('on');}
$('q').addEventListener('input',e=>{q=e.target.value;render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDr();});
</script>
</body>
</html>
