<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Irish+Grover&family=Special+Elite&family=Space+Grotesk:wght@400;500;600;700&family=Shantell+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#131210;overflow:hidden;font-family:'Special Elite',monospace;-webkit-font-smoothing:antialiased;}
  #dc-root,.sc-host{height:100%;}
  a{color:#b8361f;} a:hover{color:#8a6a16;}
  input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:0;background:#c2ad79;outline:none;width:100%;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:0;background:#b8361f;border:2px solid #1f1a14;cursor:pointer;}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:0;background:#b8361f;border:2px solid #1f1a14;cursor:pointer;}
  .pe-scroll::-webkit-scrollbar{width:8px;} .pe-scroll::-webkit-scrollbar-thumb{background:#a89a78;border-radius:0;}
  ::selection{background:rgba(233,193,74,.5);}
  /* --- v2-Chrome (Studio v3) --- */
  .v2c input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:var(--track,#e2e5e8);outline:none;width:100%;cursor:pointer;}
  .v2c input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--thumb,#2a2d31);border:3px solid var(--surface,#fff);box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer;}
  .v2c input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--thumb,#2a2d31);border:3px solid var(--surface,#fff);cursor:pointer;}
  .v2scroll::-webkit-scrollbar{width:8px;} .v2scroll::-webkit-scrollbar-thumb{background:var(--scroll,#cfd3d8);border-radius:4px;} .v2scroll::-webkit-scrollbar-track{background:transparent;}
  @keyframes kfSlideIn{from{opacity:0;transform:translateY(-5px);}to{opacity:1;transform:none;}}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
  window.__PETED = { THREE, OrbitControls, GLTFLoader, RoomEnvironment };
  window.dispatchEvent(new Event('petedready'));
</script>
</helmet>

<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="#f3ead3"/><rect x="30" y="30" width="340" height="340" fill="#b8361f" transform="rotate(-1.5 200 200)"/><circle cx="200" cy="205" r="118" fill="#f7f0da" stroke="#1f1a14" stroke-width="8"/><circle cx="228" cy="228" r="52" fill="#1f1a14"/><circle cx="246" cy="210" r="15" fill="#f7f0da"/></svg></template>
<div style="position:absolute;inset:0;background:radial-gradient(120% 100% at 50% 0%,#2a2723 0%,#131210 70%);">

  <canvas ref="{{ canvasRef }}" style="position:absolute;top:48px;left:0;width:calc(100% - 324px);height:calc(100% - 100px);display:block;"></canvas>
  <input type="file" accept="application/json,.json" ref="{{ fileRef }}" onChange="{{ onImport }}" style="display:none;">

  <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;pointer-events:none;transition:opacity .5s;z-index:9;opacity:{{ loaderOpacity }};">
    <div style="font-family:'Irish Grover',cursive;font-size:26px;color:#f6efd9;text-shadow:3px 3px 0 rgba(31,26,20,.6);transform:rotate(-1deg);">Pet-Studio v4 lädt …</div>
    <div style="font-size:12px;color:#e3d5af;opacity:.75;">GLB-Cube-Pets + pet-LIBRARY.json aus dem Repo</div>
  </div>

  <!-- v2-Chrome (Skin) über dem v9-Motor. Regler/IO in Schritt 1 inert. -->
  <div ref="{{ chromeRef }}" class="v2c" style="position:absolute;inset:0;font-family:'Space Grotesk',sans-serif;color:var(--text,#1b1e23);pointer-events:none;z-index:5;">

    <!-- HEADER -->
    <div style="position:absolute;top:0;left:0;right:0;height:48px;display:flex;align-items:stretch;gap:8px;padding:0 12px 0 14px;background:var(--surface,#fff);border-bottom:1px solid var(--border,#e4e7ea);pointer-events:auto;">
      <div style="display:flex;flex:1;min-width:0;">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="6">
          <button onClick="{{ t.on }}" style="{{ t.style }}" style-hover="{{ t.hover }}">{{ t.label }}</button>
        </sc-for>
      </div>
      <div style="display:flex;align-items:center;gap:2px;flex:0 0 auto;">
        <div style="width:34px;height:34px;flex:0 0 auto;margin-right:6px;background:var(--chip,#eef0f2);border:1px solid var(--border,#e4e7ea);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--muted,#6b7178);">{{ petInitial }}</div>
        <sc-for list="{{ v2ioBtns }}" as="b" hint-placeholder-count="4">
          <button onClick="{{ b.on }}" title="{{ b.title }}" style="width:34px;height:34px;display:grid;place-items:center;background:none;border:none;cursor:pointer;color:var(--muted,#6b7178);font-size:15px;" style-hover="color:var(--text,#1b1e23);">{{ b.icon }}</button>
        </sc-for>
        <span style="width:1px;height:20px;background:var(--border,#e4e7ea);margin:0 5px;flex:0 0 auto;"></span>
        <button onClick="{{ onThemeCycle }}" title="{{ themeTitle }}" style="width:34px;height:34px;display:grid;place-items:center;background:none;border:none;cursor:pointer;color:var(--muted,#6b7178);font-size:15px;" style-hover="color:var(--text,#1b1e23);">{{ themeIcon }}</button>
      </div>
    </div>

    <!-- SIDE PANEL -->
    <div class="v2scroll" style="position:absolute;top:48px;right:0;bottom:52px;width:324px;background:var(--surface,#fff);border-left:1px solid var(--border,#e4e7ea);overflow-y:auto;pointer-events:auto;">
      <div style="display:flex;align-items:center;gap:8px;padding:10px 14px 9px;background:{{ th.tint }};border-bottom:1px solid {{ th.line }};">
        <span style="font-weight:700;font-size:15px;color:{{ th.tcol }};letter-spacing:.2px;">{{ tabTitle }}</span>
        <span style="margin-left:auto;font-size:11px;color:var(--faint,#9aa1a8);">{{ liveLabel }}</span>
      </div>
      <div style="padding:0 16px 20px;">
        <sc-for list="{{ sections }}" as="sec" hint-placeholder-count="4">
          <div style="border-bottom:1px solid var(--border-soft,#eef0f2);">
            <button onClick="{{ sec.onToggle }}" style="{{ sec.headStyle }}">
              <span>{{ sec.title }}</span>
              <span style="display:inline-flex;color:{{ sec.chevColor }};transition:transform .2s;transform:{{ sec.chev }};">▸</span>
            </button>
            <div style="{{ sec.contentStyle }}">
              <sc-for list="{{ sec.rows }}" as="r" hint-placeholder-count="3">
                <sc-if value="{{ r.isSlider }}" hint-placeholder-val="{{ true }}">
                  <div style="margin-bottom:11px;">
                    <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;"><span style="color:var(--faint,#9aa1a8);">{{ r.label }}</span><span style="color:{{ r.accent }};font-weight:700;font-variant-numeric:tabular-nums;">{{ r.val }}</span></div>
                    <input type="range" min="{{ r.min }}" max="{{ r.max }}" step="{{ r.step }}" value="{{ r.value }}" onInput="{{ r.on }}">
                  </div>
                </sc-if>
                <sc-if value="{{ r.isButtons }}" hint-placeholder-val="{{ true }}">
                  <div style="margin-bottom:11px;">
                    <div style="font-size:12px;color:var(--faint,#9aa1a8);margin-bottom:6px;">{{ r.label }}</div>
                    <div style="display:grid;grid-template-columns:{{ r.cols }};gap:6px;">
                      <sc-for list="{{ r.items }}" as="it" hint-placeholder-count="3"><button onClick="{{ it.on }}" style="{{ it.style }}">{{ it.label }}</button></sc-for>
                    </div>
                  </div>
                </sc-if>
                <sc-if value="{{ r.isToggle }}" hint-placeholder-val="{{ true }}">
                  <button onClick="{{ r.on }}" style="width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:none;padding:7px 1px;cursor:pointer;margin-bottom:3px;">
                    <span style="font-size:13px;color:var(--text,#1b1e23);text-align:left;">{{ r.label }}</span>
                    <span style="width:44px;height:24px;border-radius:12px;background:{{ r.trackBg }};position:relative;flex:0 0 auto;"><span style="position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transform:{{ r.knobX }};"></span></span>
                  </button>
                </sc-if>
                <sc-if value="{{ r.isNote }}" hint-placeholder-val="{{ true }}">
                  <div style="font-size:13px;line-height:1.55;color:var(--muted,#6b7178);margin-bottom:10px;padding:9px 12px;background:{{ th.tint }};">{{ r.text }}</div>
                </sc-if>
                <sc-if value="{{ r.isRich }}" hint-placeholder-val="{{ false }}">
                  <div style="margin-bottom:11px;">
                    <div style="font-size:12px;color:var(--faint,#9aa1a8);margin-bottom:6px;">{{ r.label }}</div>
                    <div contenteditable="true" ref="{{ r.ref }}" onInput="{{ r.on }}" style="min-height:38px;box-sizing:border-box;padding:8px 10px;border:1px solid var(--border,#e4e7ea);background:var(--chip,#eef0f2);color:var(--text,#1b1e23);font-family:'Space Grotesk',sans-serif;font-size:13px;line-height:1.4;outline:none;"></div>
                  </div>
                </sc-if>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- BOTTOM -->
    <div class="v2scroll" style="position:absolute;bottom:0;left:0;right:0;height:52px;background:var(--surface,#fff);border-top:1px solid var(--border,#e4e7ea);overflow-x:auto;pointer-events:auto;display:flex;align-items:center;padding:0 16px;">
      <div style="display:flex;gap:20px;align-items:center;min-width:min-content;">
        <sc-for list="{{ bottomGroups }}" as="g" hint-placeholder-count="4">
          <div style="display:flex;align-items:center;gap:8px;flex:0 0 auto;">
            <span style="font-size:11px;font-weight:600;color:{{ g.color }};white-space:nowrap;">{{ g.label }}</span>
            <div style="display:flex;gap:6px;">
              <sc-for list="{{ g.pads }}" as="p" hint-placeholder-count="4"><button onClick="{{ p.on }}" style="{{ p.style }}">{{ p.label }}</button></sc-for>
            </div>
          </div>
        </sc-for>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;turntable&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Editor&quot;},&quot;zenMode&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Editor&quot;},&quot;lightMood&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;tag&quot;,&quot;daemmerung&quot;,&quot;nacht&quot;,&quot;untergrund&quot;],&quot;default&quot;:&quot;tag&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Editor&quot;}}">

  async init() {

  }

  async loadSky() {
    if (!this._texLoader) return;
    try {
      const t = await new Promise((res, rej) => this._texLoader.load(SKY, res, undefined, rej));
      t.mapping = this.THREE.EquirectangularReflectionMapping; t.colorSpace = this.THREE.SRGBColorSpace;
      this._sky = t; this.applyLights();       // Watercolor-Backdrop für Tag/Dämmerung
    } catch (e) { this._sky = null; }           // 404 -> Gradient-Backdrop bleibt
  }

  setSunDir() {
    if (!this.sun) return;
    const az = this.state.sunAz * Math.PI / 180, el = this.state.sunEl * Math.PI / 180, r = 4.8;
    this.sun.position.set(Math.cos(el) * Math.sin(az) * r, Math.sin(el) * r, Math.cos(el) * Math.cos(az) * r);

  }

  }

    this.ambient.color.setHex(mp.amb[0]); this.ambient.intensity = mp.amb[1];

    const gi = (t, c) => idx ? idx.getX(t * 3 + c) : (t * 3 + c);
    const arr = [];
    for (const t of sh.tris) for (let c = 0; c < 3; c++) { const i = gi(t, c); arr.push(pos.getX(i), pos.getY(i), pos.getZ(i)); }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3)); g.computeVertexNormals();
    const mesh = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: 0xb8361f, transparent: true, opacity: 0.9, side: THREE.DoubleSide, depthTest: false, toneMapped: false }));
    mesh.userData.petOverlay = true; mesh.frustumCulled = false; mesh.renderOrder = 999; mesh.raycast = () => {};
    body.add(mesh); this._hl = mesh;
  }
  _clearHighlight() { if (this._hl) { if (this._hl.parent) this._hl.parent.remove(this._hl); this._hl.geometry.dispose(); this._hl = null; } }
  _petHex(p) {
    p = p || this._pet();
    return (this.state.recolor && p && p.color) ? hexInt(p.color) : null;
  }
  _petEye() {
    const p = this._pet();
    p.eye = p.eye || {};
    p.eye.anchor = p.eye.anchor || { dx: 0.345, dy: -0.10, ring: 0.30, track: 0.10 };
    return p.eye;
  }

  // v6: CPU-lesbare Colormap fuer die Lid-Farbe. Einmal je Pet auf ein Offscreen-Canvas, getImageData,
  // gecacht. Liefert fn(u,v)->THREE.Color der ROHEN Colormap. GLTFLoader setzt flipY=false -> Zeile ist
  // v*H, NICHT (1-v)*H (die eine Stelle, an der man still Unsinn bekommt). uv koennen negativ sein -> wrappen.
  _buildLidSampler() {
    this._lidSampler = null;
    const THREE = this.THREE, body = this.ch && this.ch._body;
    const tex = body && (body.userData._glbMap || (body.material && body.material.map));
    const img = tex && tex.image;
    if (!img || !img.width) return;
    const pid = this._pet().id;
    this._cmCache = this._cmCache || {};
    let data = this._cmCache[pid];
    if (!data) {
      const w = img.width, h = img.height;
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const g = cv.getContext('2d', { willReadFrequently: true });
      g.drawImage(img, 0, 0, w, h);
      let px; try { px = g.getImageData(0, 0, w, h); } catch (e) { return; }
      data = { d: px.data, w, h }; this._cmCache[pid] = data;
    }
    const d = data.d, w = data.w, h = data.h;
    this._lidSampler = (u, v) => {
      const uu = ((u % 1) + 1) % 1, vv = ((v % 1) + 1) % 1;
      const x = Math.min(w - 1, Math.max(0, Math.floor(uu * w)));
      const y = Math.min(h - 1, Math.max(0, Math.floor(vv * h)));   // v*H: GLTF flipY=false
      const i = (y * w + x) * 4;
      return new THREE.Color().setStyle('rgb(' + d[i] + ',' + d[i + 1] + ',' + d[i + 2] + ')');
    };
  }

  // In-Place-Reskin: KEIN GLB-Reload -> Kamera bleibt stehen (Feedback A3)
  reskin() {
    if (!this.ch || !this.ch.inner) return;
    const p = this._pet();
    const hex = this._petHex(p);
    const baseHex = (p && p.color) ? hexInt(p.color) : 0xf2c93c;
    this.ch.inner.traverse((n) => {
      if (!n.isMesh || n.userData.petOverlay) return;
      const glbMap = n.userData._glbMap !== undefined ? n.userData._glbMap : ((n.material && n.material.map) || null);   // Original-Colormap (ueberlebt Textur-Wechsel), fuer kenneyBase/paperGold + recolor
      // v7 Eingriff 1: facet=AN facettiert (computeVertexNormals, destruktiv), facet=AUS behält Kenneys
      // runde Normalen. Original-Normalen pro Geometrie gemerkt -> Toggle reversibel (kein Kippen).
      if (n.geometry) {
        const g = n.geometry;
        if (this.state.facet) {
          if (!g.userData._faceted) { if (g.attributes.normal && !g.userData._origNorm) g.userData._origNorm = g.attributes.normal.clone(); g.computeVertexNormals(); g.userData._faceted = true; }
        } else if (g.userData._faceted && g.userData._origNorm) { g.setAttribute('normal', g.userData._origNorm.clone()); g.attributes.normal.needsUpdate = true; g.userData._faceted = false; }
      }
      let map = glbMap, color = 0xffffff;
      if (this.state.paperGold) { map = glbMap; color = (hex != null ? hex : 0xffffff); }   // v7 Pfad 2: Colormap behalten, Gelb per Uniform (nicht in die Map gebacken)
      else if (this.state.kenneyBase) { map = glbMap; color = 0xffffff; }   // originale Kenney-Colormap als Basis (native Pet-Farben via UV)
      else if (this.state.hideEyes) { map = null; color = baseHex; }   // Original-(Colormap-)Augen ausblenden -> flache Base-Color
      else if (map && hex != null) map = this.ch._recolorMap(map, hex);
      n.material = this.makeMat({ map, color });
      if (this.state.colormap === 'fluffy_fur' && this._furTex && this.state.texture !== 'fur_fluffy') { n.material.map = this._furTex; n.material.needsUpdate = true; }   // Coworker-Diagnose: material.map 1:1 tauschen. Wenn der Fell-Triplanar aktiv ist, NICHT clobbern (sonst gewinnt der kaputte-UV-Pfad).
      n.castShadow = true; n.receiveShadow = false;
      n.frustumCulled = false;  // node-animierte GLB-Nodes: lokale BoundingSphere trackt die Clip-Transforms nicht -> sonst gecullt
    });
    if (this.disc) this.disc.material = this.makeMat({ color: 0xe3d5af, plain: true });
    if (this.rig) { this.rig.baseColor = baseHex; const petC = this._pet() && this._pet().color; this.rig.lidSampler = (this.state.kenneyBase || !petC) ? this._lidSampler : null; if (this.rig.reskinLids) this.rig.reskinLids(); }  // v7: native/ohne pet.color -> Lid aus Colormap; mit pet.color -> Base-Color; folgt Look ohne Rebuild
    // Materialien deterministisch kompilieren -> onBeforeCompile läuft + bindet die Custom-Uniforms
    // (uTex/uHasTex/…) SOFORT. Ohne das kompiliert three lazy/uneinheitlich -> Textur fehlt (gold).
    if (this.renderer && this.scene && this.cam) this.renderer.compile(this.scene, this.cam);
  }

  async loadPet(idx) {
    if (this._loading || !this.lib) return;
    this._loading = true;
    this._clearHighlight();
    const p = this.roster[idx];
    this.setState({ status: 'lädt ' + p.id + ' …', petIdx: idx });
    try {
      if (this.rig) { this.rig.dispose(); this.rig = null; }
      await this.ch.load('animals', p.id, { mods: [], recolor: null, face: this.lib.face });  // v5: face-Block gibt stripEyes/stripSnout, v7: + face.facet (Normalen)
      this._buildLidSampler();                                                 // v6: CPU-Colormap fuer die Lid-Farbe
      await new Promise((r) => this.setState({ facet: this.lib.face.facet === true }, r));  // v7 Eingriff 3: Look hängt NICHT mehr an !p.color; Normalen kommen aus dem Contract
      this.reskin();
      const er = this.lib.eyeRig || {};
      const eye = p.eye || {};
      const lashes = eye.lashes || (this.lib.face && this.lib.face.eye && this.lib.face.eye.lashes) || { length: 0, density: 6, width: 1 };
      const rig = this.rig = new this._RigMod.EyeRig(this.ch, {
        anchor: eye.anchor, pupilStyle: eye.pupilStyle || 'matte-cute',
        blink: this.state.blink,
        pupilSize: eye.pupilSize != null ? eye.pupilSize : (er.pupilSize != null ? er.pupilSize : 0.4),
        inset: eye.inset != null ? eye.inset : (er.inset != null ? er.inset : 0),
        lidFit: eye.lidFit != null ? eye.lidFit : (er.lidFit != null ? er.lidFit : 0.9),
        gloss: (er.gloss && er.gloss[eye.pupilStyle || 'matte-cute']) != null ? er.gloss[eye.pupilStyle || 'matte-cute'] : 0.85,
        converge: eye.converge != null ? eye.converge : (er.converge != null ? er.converge : 0),
        lidSampler: p.color ? null : this._lidSampler,   // v6: native -> Lid aus Colormap, umgefaerbt -> Base-Color
        baseColor: p.color ? hexInt(p.color) : 0xf2c93c,
        lashes: lashes,
      });
      this.setState({ lashesP: { ...lashes } });
      rig.build();
      this._applyEmote(this._emote(this.state.emoteSel));   // v8: Asymmetrie-Deltas einmischen
      rig.setLife(this.state.life); rig.setKinetics(this.state.kin);
      rig.setGazeFollow(this.state.gazeFollow);   // Cursor-Follow überlebt Pet-Wechsel
      this._mountMouth();                          // v9: Mund neu fitten (pet.mouth > lib.mouth > Default)
      const shells = this.ch.getFaceShells();
      const eyeIdx = this._CharMod.selectEyeShells(shells, this.lib.face || {}) || [];
      this.setState({
        anchor: { ...rig.anchor }, pupilStyle: rig.pupilStyle,
        shape: { inset: rig.inset, pupilSize: rig.pupilSize, lidFit: rig.lidFit, gloss: rig.gloss, converge: rig.converge },
        shells: shells.map((sh) => ({ count: sh.count, xmin: sh.xmin, xmax: sh.xmax, ymin: sh.ymin, ymax: sh.ymax, zmin: sh.zmin, zmax: sh.zmax })),
        eyeShellIdx: eyeIdx,
        status: '✓ ' + (p.name || p.id), ready: true,
      });
    } catch (e) { this.setState({ status: 'Fehler: ' + e.message }); }
    this._loading = false;
  }

  // v8: Emote + Asymmetrie-Deltas (linkes Auge) -> Arrays [L,R] ins Rig (rig v5, Eingriff 1).
  // Bewusst NICHT im Contract, bis Abnahme — die Deltas leben nur im Editor-State.
  _applyEmote(em) {
    // v4: der Ausdruck praegt jetzt AUCH den Ruhe-Mund (restMap: Decal + Mundwinkel). Vorher trugen
    // happy/sad/angry nur Lider und Pupillen — der Mund blieb die neutrale Kerbe. Das war der offene
    // Backlog-Punkt „happy-Emote ↔ Mund-Verdrahtung"; der Hook existierte im Modul, nur ungenutzt.
    if (this.mouth && em && em.id) this.mouth.setRest(em.id);
    if (!this.rig) return;
    const A = this.state.asym, n = (v) => Array.isArray(v) ? (v[0] || 0) : (v || 0);
    const e = Object.assign({}, em || {});
    if (A.u || A.l || A.sl) {
      e.lidUpper = [n(e.lidUpper) + A.u, n(e.lidUpper)];
      e.lidLower = [n(e.lidLower) + A.l, n(e.lidLower)];
      e.slant = [n(e.slant) + A.sl, n(e.slant)];
    }
    this.rig.applyEmote(e);
  }
  // Fake-Ride: 12s-Skript liefert a/c/j wie der Ride. Das Skript wiederholt sich EXAKT —
  // die Nicht-Wiederholung des Gesichts muss aus dem Leben-Layer kommen (Abnahme 4).
  _rideKin(t) {
    const T = t % 12;
    const env = (t0, t1, v) => (T > t0 && T < t1) ? v * Math.sin((T - t0) / (t1 - t0) * Math.PI) : 0;
    const k = { a: 0.15 + env(3.0, 4.2, -1.1), c: env(0.8, 2.6, 0.9) + env(6.2, 8.2, -0.9), j: env(9.4, 10.4, 1.0) };
    const phase = T < 0.8 ? 'Fahrt' : T < 2.6 ? 'Kurve R' : T < 3 ? 'Fahrt' : T < 4.2 ? 'BREMSE' : T < 6.2 ? 'Fahrt' : T < 8.2 ? 'Kurve L' : T < 9.4 ? 'Fahrt' : T < 10.4 ? 'DROP' : 'Fahrt';
    if (phase !== this.state.ridePhase) this.setState({ ridePhase: phase });
    return k;
  }

  // v9 Mund: Platzierung pro Pet (pet.mouth) > globaler Default (lib.mouth) > MOUTH_DEF
  _mouthParams() {
    const p = this._pet();
    const mp = Object.assign({}, MOUTH_DEF, (this.lib && this.lib.mouth) || {}, (p && p.mouth) || {});
    // v4: visemeMap ist eine Karte, kein Skalar — Teil-Overrides ERGAENZEN den Default, statt ihn
    // wegzuwerfen (Object.assign ist flach; ohne diese Zeile kippt ein einzelnes getuntes Visem
    // die anderen vier auf undefined).
    mp.visemeMap = Object.assign({}, MOUTH_DEF.visemeMap,
      (this.lib && this.lib.mouth && this.lib.mouth.visemeMap) || {},
      (p && p.mouth && p.mouth.visemeMap) || {});
    return mp;
  }
  _mountMouth() {
    if (!this._MouthMod || !this.ch || !this.ch.inner) return;
    const mp = this._mouthParams();
    if (!this.mouth) this.mouth = new this._MouthMod.PetMouth(this.ch, { params: mp });
    else Object.assign(this.mouth.p, mp);
    this.mouth.build();
    this.mouth.enabled = this.state.mouthOn;
    this.mouth.talk(this.state.mouthTalk);
    if (!this.state.mouthTalk) { this.mouth.rest = this.state.mouthSel; this.mouth.setTex(this.state.mouthSel); }
    this.setState({ mouthP: mp });
    this._mountPuppet();
  }

  // v4 §2b: der Treiber-Vertrag. Der Puppet ist eine FASSADE — er haelt keine zweite Wahrheit,
  // sondern ruft Mund/Rig/Emote-Tabelle/Clips des Studios ueber deren oeffentliche Wege. Deshalb
  // wird er nach dem Mund gebaut und bei Pet-Wechsel nur nachverdrahtet, nicht neu erfunden.
  _mountPuppet() {
    if (!this._PuppetMod || !this.mouth) return;
    const parts = {
      THREE: this.THREE, mouth: this.mouth, rig: this.rig, cam: this.cam, controls: this.controls,
      scene: this.scene, renderer: this.renderer,
      focus: () => this._petFocus(), radius: () => this._petRadius(), facing: () => this._petFacing(),
      emote: (id) => this.h.emoteSel(id),
      clip: (id) => this.h.anim(id),
      background: (mode) => this._puppetBackground(mode),
    };
    if (this.puppet) { Object.assign(this.puppet.parts, parts); return; }
    this.puppet = this._PuppetMod.createPuppet(parts, { warn: (m) => this._flash(m, '#b8361f') });
  }
  _petBox() {
    const ch = this.ch; if (!ch || !ch.group) return null;
    return new this.THREE.Box3().setFromObject(ch.group);
  }
  _petFocus() {   // Kamera-Ziel = Gesichtshöhe. 0,60 der Bauhöhe ab Boden gemessen (nicht Mitte+Offset):
                  // Mitte+0,18 landete beim Hasen auf der Kopf-Oberkante und die Kamera schaute von oben drauf.
    const b = this._petBox(); if (!b) return new this.THREE.Vector3(0, 0.4, 0);
    const c = b.getCenter(new this.THREE.Vector3()), s = b.getSize(new this.THREE.Vector3());
    c.y = b.min.y + s.y * 0.60; return c;
  }
  _petRadius() {
    const b = this._petBox(); if (!b) return 0.5;
    const s = b.getSize(new this.THREE.Vector3());
    return Math.max(s.x, s.y, s.z) * 0.5;
  }
  // Blickrichtung = Frontnormale der Mundfläche. Gemessen am Modell (der Mund wurde per Raycast
  // von vorn auf den Körper gefittet), nicht aus einer Achsen-Annahme abgeleitet — genau die Falle,
  // in die der Travel-Cut mit „Gesicht ist −Z" getappt ist.
  _petFacing() {
    const T = this.THREE;
    if (this.mouth && this.mouth.mesh) {
      this.mouth.mesh.updateWorldMatrix(true, false);
      return new T.Vector3(0, 0, 1).transformDirection(this.mouth.mesh.matrixWorld).normalize();
    }
    if (this.ch && this.ch.group) return new T.Vector3(0, 0, 1).transformDirection(this.ch.group.matrixWorld).normalize();
    return new T.Vector3(0, 0, 1);
  }
  // Der Studio besitzt seine Stimmungen + den Skydome — der Puppet fragt hier nach, statt sie zu
  // ueberschreiben. 'transparent' ist der einzige Modus, der wirklich etwas Neues tut.
  _puppetBackground(mode) {
    if (!this.scene) return;
    // Der Schatten haengt NICHT am Hintergrund-Modus: er ist eine eigene Entscheidung des Hosts
    // (Regler unten). Genau deshalb kann „transparent" den halbtransparenten 3D-Schatten behalten.
    if (mode === 'transparent') { this.scene.background = null; if (this.renderer) this.renderer.setClearAlpha(0); if (this.disc) this.disc.visible = false; return; }
    if (this.renderer) this.renderer.setClearAlpha(1);
    if (this.disc) this.disc.visible = this.state.showDisc;
    if (mode === 'studio') { this.scene.background = this.bgTex((MOOD[this.state.mood] || MOODS[0]).bg); return; }
    this.applyLights();   // 'world' = Stimmung + Skydome, die Wahrheit des Studios
  }

  h = {
    selPet: (i) => { if (i !== this.state.petIdx) this.loadPet(i); },
    mouthOn: () => this.setState((s) => ({ mouthOn: !s.mouthOn }), () => { if (this.mouth) this.mouth.enabled = this.state.mouthOn; }),
    mouthTalk: () => this.setState((s) => ({ mouthTalk: !s.mouthTalk }), () => { if (this.mouth) this.mouth.talk(this.state.mouthTalk); }),
    mouthSel: (e) => { const id = e.target.value; this.setState({ mouthSel: id }, () => { if (this.mouth && !this.state.mouthTalk) { this.mouth.rest = id; this.mouth.setTex(id); } }); },
    mouthSlider: (k, e) => {
      const v = parseFloat(e.target.value);
      const p = this._pet(); this._ensureInLib(p);
      p.mouth = Object.assign({}, MOUTH_DEF, (this.lib && this.lib.mouth) || {}, p.mouth || {});
      p.mouth[k] = v;
      this.lib.mouth = this.lib.mouth || { src: 'FrizzelBob-Mouth_01 (GitHub raw)' };   // Quelle einmal im Contract vermerken
      this.setState({ mouthP: { ...p.mouth }, dirty: true });
      if (this.mouth) this.mouth.setParams({ [k]: v });
    },
    lashes: (k, e) => {
      const v = parseFloat(e.target.value);
      const p = this._pet(); this._ensureInLib(p);
      p.eye = p.eye || {};
      p.eye.lashes = Object.assign({ length: 0, density: 6, width: 1 }, p.eye.lashes || {});
      p.eye.lashes[k] = v;
      this.setState({ lashesP: { ...p.eye.lashes }, dirty: true });
      if (this.rig) this.rig.setLashes(p.eye.lashes);
    },
    // v4 §2a: Visem zeigen. Stoppt den Sprech-Shuffle — sonst kaempfen zwei Besitzer um den Mund.
    viseme: (id) => {
      if (this._visCy) { clearInterval(this._visCy); this._visCy = null; }
      this.setState({ visemeSel: id, mouthTalk: false }, () => {
        if (!this.mouth) return;
        this.mouth.talk(false);
        this.mouth.setViseme(id);
      });
    },
    // Form-Zuweisung = Georgs Look-Entscheidung. Wandert nach p.mouth.visemeMap (Vertrag).
    visemeShape: (key) => {
      const p = this._pet(); this._ensureInLib(p);
      p.mouth = Object.assign({}, MOUTH_DEF, (this.lib && this.lib.mouth) || {}, p.mouth || {});
      p.mouth.visemeMap = Object.assign({}, MOUTH_DEF.visemeMap, p.mouth.visemeMap || {}, { [this.state.visemeSel]: key });
      this.lib.mouth = this.lib.mouth || { src: 'FrizzelBob-Mouth_01 (GitHub raw)' };
      this._touchPet(p);   // sonst faellt der Look aus dem Export (nur beruehrte Pets werden gemerged)
      this.setState({ mouthP: { ...p.mouth }, dirty: true }, () => {
        if (!this.mouth) return;
        this.mouth.setVisemeMap(p.mouth.visemeMap);
        this.mouth.setViseme(this.state.visemeSel);
      });
    },
    visemeStep: (id) => { if (this.mouth) this.mouth.setViseme(id); this.setState({ visemeSel: id }); },
    visemeCycle: () => {
      if (this._visCy) { clearInterval(this._visCy); this._visCy = null; this.forceUpdate(); return; }
      this.setState({ mouthTalk: false }, () => { if (this.mouth) this.mouth.talk(false); });
      let i = 0;
      const step = () => { if (this.mouth) this.h.visemeStep(VISEME_LABELS[i++ % VISEME_LABELS.length][0]); };
      step(); this._visCy = setInterval(step, 620);   // 620ms = lang genug, um die Form zu lesen
      this.forceUpdate();
    },
    visemeReset: () => {
      const p = this._pet(); if (p && p.mouth) { delete p.mouth.visemeMap; this._touchPet(p); }
      const mp = this._mouthParams();
      this.setState({ mouthP: mp, dirty: true }, () => {
        if (!this.mouth) return;
        this.mouth.setVisemeMap(mp.visemeMap);
        if (this.mouth.viseme) this.mouth.setViseme(this.mouth.viseme);
      });
    },
    // v4: alter Zustand als Rueckweg — Mund ohne Tiefentest, liegt vor allem.
    mouthOnTop: () => {
      const p = this._pet(); this._ensureInLib(p);
      p.mouth = Object.assign({}, MOUTH_DEF, (this.lib && this.lib.mouth) || {}, p.mouth || {});
      p.mouth.onTop = !p.mouth.onTop;
      this._touchPet(p);
      this.setState({ mouthP: { ...p.mouth }, dirty: true }, () => { if (this.mouth) this.mouth.setParams({ onTop: p.mouth.onTop }); });
    },
    // v4 §2b: Testsatz über die Puppet-Uhr. Betonungen werden nur GEZÄHLT — der Körper gehört
    // PetMotion (§2c), und PetMotion ist in diesem Studio nicht eingehängt. Ehrlicher Zwischenstand.
    puppetSpeak: () => {
      const P = this.puppet; if (!P) return;
      if (P.speaking) { P.stop(); this.setState({ puppetRun: P.lastRun }); return; }
      if (this._speaking) this._stopSpeak();   // die Stimme des Studios ist ein anderer Besitzer
      if (!this._emphOff) this._emphOff = P.onEmphasis((k) => { this._emphSeen = (this._emphSeen || 0) + 1; });
      this._emphSeen = 0;
      const DEMO = [
        { t: 0.00, viseme: 'open', emphasis: 1 },
        { t: 0.16, viseme: 'closed' },
        { t: 0.30, viseme: 'wide' },
        { t: 0.44, viseme: 'closed' },
        { t: 0.56, viseme: 'round' },
        { t: 0.70, viseme: 'closed' },
        { t: 0.84, viseme: 'open', emphasis: 1 },
        { t: 1.00, viseme: 'wide' },
        { t: 1.14, viseme: 'closed' },
        { t: 1.28, viseme: 'round', emphasis: 0.6 },
        { t: 1.46, viseme: 'smile' },
      ];
      P.speak(DEMO, { onDone: (run) => this.setState({ puppetRun: run }) });
      this.forceUpdate();
    },
    mouthSet: (id) => {
      const p = this._pet(); this._ensureInLib(p);
      p.mouth = Object.assign({}, MOUTH_DEF, (this.lib && this.lib.mouth) || {}, p.mouth || {});
      const cur = p.mouth.set || 'male';
      if (id !== cur) {
        p.mouth['_' + cur] = { size: p.mouth.size, dy: p.mouth.dy, sx: p.mouth.sx, dx: p.mouth.dx || 0 };   // aktuelle Platzierung dem alten Set merken
        const here = { size: p.mouth.size, dy: p.mouth.dy, sx: p.mouth.sx, dx: p.mouth.dx || 0 };
        // red hat dieselbe Leinwand wie male (274x169) -> erbt dessen Platzierung, nicht die
        // engere female-Lage; female bringt eigene Startwerte mit.
        const seed = id === 'female' ? { size: 0.40, dy: -0.73, sx: p.mouth.sx, dx: p.mouth.dx || 0 }
                   : id === 'red'    ? (p.mouth._male || here)
                   : here;
        const saved = p.mouth['_' + id] || seed;
        Object.assign(p.mouth, saved);

  // --- Schritt 5: getrennte Export-Schicht (kfb-pets.json). Motor unberührt; nur berührte Pets + material.live. ---
  async _loadExportContract() {
    const CANON = 'https://raw.githubusercontent.com/georg-doc/kayfabizarro/main/media/3D_Assets/kfb-pets.json';
    const load = async (u) => { const r = await fetch(u, { cache: 'no-store' }); if (!r.ok) throw new Error(u + ' ' + r.status); return r.json(); };
    const sv = (v) => String(v || '0').split('.').map(Number);
    const cmp = (a, b) => { a = sv(a); b = sv(b); for (let i = 0; i < 3; i++) { if ((a[i] || 0) !== (b[i] || 0)) return (a[i] || 0) - (b[i] || 0); } return 0; };
    let canon = null, local = null;
    try { canon = await load(CANON); } catch (e) {}
    try { local = await load('./studio-v3/kfb-pets.json'); } catch (e) {}
    // canonical zuerst, aber die neuere Version gewinnt: GitHub laggt evtl. hinter der lokalen Fassung (Georgs Hinweis 2026-07-22)
    this.contract = (canon && local) ? (cmp(local.version, canon.version) > 0 ? local : canon) : (canon || local);
    if (this.contract) { this._touchedPets = new Set(); this._touchedMat = false; this._seedVoiceState(); }
    else console.warn('[studio] kfb-pets.json weder canonical noch lokal geladen');
  }
  _buildContract(bump, useTouches) {
    const out = JSON.parse(JSON.stringify(this.contract));
    const tP = useTouches ? this._touchedPets : null, tM = useTouches ? this._touchedMat : false;
    if (tM && this.lib && this.lib.material && this.lib.material.live) { out.koerper = out.koerper || {}; out.koerper.material = out.koerper.material || {}; out.koerper.material.live = JSON.parse(JSON.stringify(this.lib.material.live)); }
    if (tP) for (const id of tP) { const src = (this.lib.pets || []).find((p) => p.id === id); if (!src) continue; out.pets = out.pets || []; const i = out.pets.findIndex((p) => p.id === id); const m = V2deepMerge(i >= 0 ? out.pets[i] : {}, src); if (i >= 0) out.pets[i] = m; else out.pets.push(m); }
    if (bump) { out.version = bumpPatch(out.version); out.updated = today(); }
    return out;
  }
  _exportContract() {
    if (!this.contract) { this._flash('kfb-pets.json nicht geladen', '#b8361f'); return; }
    const out = this._buildContract(true, true);
    const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'kfb-pets.json'; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
    this._flash('Export · kfb-pets.json v' + out.version, '#4f6029');
  }
  _roundtrip() {   // Test „mit Zähnen": EIN Pet verstellen -> exportieren A -> A laden -> exportieren B -> A==B & Sonde überlebt
    if (!this.contract) { this._flash('kfb-pets.json nicht geladen', '#b8361f'); return; }
    const id = (this.roster && this.roster[this.state.petIdx] && this.roster[this.state.petIdx].id) || (this.contract.pets && this.contract.pets[0] && this.contract.pets[0].id);
    if (!id) { this._flash('kein Pet für den Test', '#b8361f'); return; }
    this.lib = this.lib || {}; this.lib.pets = this.lib.pets || [];
    let lp = this.lib.pets.find((p) => p.id === id), added = false;
    if (!lp) { lp = { id }; this.lib.pets.push(lp); added = true; }
    lp.eye = lp.eye || {}; lp.eye.anchor = lp.eye.anchor || {};
    const prevDx = lp.eye.anchor.dx, probe = 0.4242;
    lp.eye.anchor.dx = probe;                                   // 1) EIN Pet verstellen
    const sTP = this._touchedPets, sTM = this._touchedMat, sC = this.contract;
    this._touchedPets = new Set([id]); this._touchedMat = false;
    const A = this._buildContract(false, true);                // 2) exportieren
    this.contract = JSON.parse(JSON.stringify(A));             // 3) Export wieder laden
    this._touchedPets = new Set(); this._touchedMat = false;
    const B = this._buildContract(false, false);              // 4) nochmal exportieren
    this.contract = sC; this._touchedPets = sTP; this._touchedMat = sTM;   // aufräumen
    if (added) this.lib.pets = this.lib.pets.filter((p) => p !== lp); else lp.eye.anchor.dx = prevDx;
    const norm = (o) => { const c = JSON.parse(JSON.stringify(o)); delete c.version; delete c.updated; return c; };
    const d = V2deepDiff(norm(A), norm(B));                    // 5) A und B müssen gleich sein
    const ap = (A.pets || []).find((p) => p.id === id);
    const survived = !!(ap && ap.eye && ap.eye.anchor && ap.eye.anchor.dx === probe);
    const ok = d.length === 0 && survived;
    this._flash(ok ? ('✓ Round-Trip mit Zähnen leer — Spiegelung verlustfrei (' + id + ')') : ('✗ ' + (d.length ? (d.length + ' Abweichung(en)') : 'Sonde verloren')), ok ? '#4f6029' : '#b8361f');
    if (!ok) console.warn('[studio] teeth-diff', d.slice(0, 40), 'survived', survived);
  }
  _flash(msg, color) {
    let el = this._flashEl;
    if (!el) { el = this._flashEl = document.createElement('div'); el.style.cssText = 'position:fixed;left:50%;bottom:72px;transform:translateX(-50%);z-index:99;padding:9px 16px;background:#1e2126;color:#fff;font:600 13px/1.3 \'Space Grotesk\',sans-serif;box-shadow:0 8px 26px rgba(0,0,0,.28);pointer-events:none;transition:opacity .3s;'; document.body.appendChild(el); }
    el.style.borderLeft = '3px solid ' + color; el.textContent = msg; el.style.opacity = '1';
    clearTimeout(this._flashT); this._flashT = setTimeout(() => { el.style.opacity = '0'; }, 2000);
  }

    const E = [ { a:[x0,y0], b:[x1,y0], n:[0,-1], id:1 }, { a:[x1,y0], b:[x1,y1], n:[1,0], id:2 }, { a:[x1,y1], b:[x0,y1], n:[0,1], id:0 }, { a:[x0,y1], b:[x0,y0], n:[-1,0], id:3 } ];
    const foot = 18, hlen = Math.hypot(dx, dy) || 1;
    const b2 = this.state.v2bubble || {};
    const aMin = 14, aMax = b2.arrow != null ? b2.arrow : 34;   // Luftballon an Schnur: die Spitze zielt
    // aufs Pet-Zentrum, aber die Schnur ist KURZ — ein Gummiband quer durchs Bild liest sich nicht.
    const tailLen = Math.max(aMin, Math.min(aMax, hlen - 8));
    const P = [];
    for (const e of E) {
      P.push([e.a[0], e.a[1]]);
      const len = Math.hypot(e.b[0] - e.a[0], e.b[1] - e.a[1]), ux = (e.b[0] - e.a[0]) / len, uy = (e.b[1] - e.a[1]) / len;
      const K = 4, mids = [];

        let ha = (hlx == null) ? len / 2 : (hlx - e.a[0]) * ux + (hly - e.a[1]) * uy;

        // v4: PFEIL statt Kerbe — zwei Schulterpunkte bei 55 % der Länge verjüngen den Zug, so liest
        // sich der Zipfel als Spitze und nicht als abgeschnittenes Dreieck (Befund Georg 30.7., Bild 3).
        const shx = footCx + (tx - footCx) * 0.55, shy = footCy + (ty - footCy) * 0.55;

  _blobPath(M, w, hh, seed) {
    // Wolke, IRREGULAER: ungleiche Lappen-Abstaende, ungleiche Radien, ungleiche Bogen-Woelbung (seeded,
    // also stabil pro Blase, aber handgezeichnet-unregelmaessig). Gross genug, dass der Text hineinpasst.
    // Scallop-Wolke: N Lappen nahezu gleichmaessig um eine Ellipse, nur KLEINE seeded Unregelmaessigkeit
    // (Winkel < halber Lappenabstand, Radius +-7%) -> Lappen ueberholen sich nie und kreuzen nie. Jeder
    // Lappen ein nach aussen gewoelbter Bogen mit Radius ~ halbe Sehne (sauberer Halbkreis, kein Einknick).
    const rng = this._bmul(seed);
    const cx = M + w / 2, cy = M + hh / 2, rx = w * 0.60 + 12, ry = hh * 0.64 + 12;
    const N = 11 + Math.floor(rng() * 3);
    const step = Math.PI * 2 / N;
    const P = []; const a0 = -Math.PI / 2 + (rng() * 2 - 1) * 0.15;
    for (let i = 0; i < N; i++) {
      const a = a0 + i * step + (rng() * 2 - 1) * step * 0.28;
      const rr = 1 + (rng() * 2 - 1) * 0.07;
      P.push([cx + Math.cos(a) * rx * rr, cy + Math.sin(a) * ry * rr]);
    }
    let d = 'M' + P[0][0].toFixed(1) + ' ' + P[0][1].toFixed(1);
    for (let i = 0; i < N; i++) { const p1 = P[(i + 1) % N]; const ch = Math.hypot(p1[0] - P[i][0], p1[1] - P[i][1]); const r = (ch / 2 * 1.02).toFixed(1); d += ' A' + r + ' ' + r + ' 0 0 1 ' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1); }

  _thinkTail(g, M, w, hh, hlx, hly, paper, line) {

    g.innerHTML = c(9, 4.5) + c(20, 3);
  }
  _md(s) { s = String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); s = s.replace(/[*][*]([^*]+)[*][*]/g, '<b>$1</b>').replace(/[*]([^*]+)[*]/g, '<i>$1</i>'); return s; }

  _bubbleTick() {

    // Die Blase sitzt ueber dem KOPF (Abstand Zentrum->Oberkante aus dem aktuellen Frame), der Pfeil
