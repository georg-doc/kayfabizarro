ife&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;subtle&quot;,&quot;options&quot;:[&quot;off&quot;,&quot;subtle&quot;,&quot;full&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Ground&quot;},&quot;seed&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:7,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;World&quot;},&quot;worldSize&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;large&quot;,&quot;options&quot;:[&quot;small&quot;,&quot;medium&quot;,&quot;large&quot;,&quot;huge&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;World&quot;},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;utopia&quot;,&quot;options&quot;:[&quot;utopia&quot;,&quot;noise&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;World&quot;},&quot;zones&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:6,&quot;min&quot;:2,&quot;max&quot;:12,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;World&quot;},&quot;townColor&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Blue&quot;,&quot;options&quot;:[&quot;Blue&quot;,&quot;Red&quot;,&quot;Yellow&quot;,&quot;Purple&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;World&quot;},&quot;heroUnit&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;random&quot;,&quot;options&quot;:[&quot;random&quot;,&quot;warrior&quot;,&quot;archer&quot;,&quot;pawn&quot;,&quot;frizzlebob&quot;,&quot;rogue&quot;,&quot;knight&quot;,&quot;mage&quot;,&quot;torch_goblin_ep&quot;,&quot;spear_goblin&quot;,&quot;hex_shaman&quot;,&quot;pig_rider&quot;,&quot;pig&quot;,&quot;bear&quot;,&quot;lizard&quot;,&quot;snake&quot;,&quot;spider&quot;,&quot;turtle&quot;,&quot;gnoll&quot;,&quot;gnome&quot;,&quot;panda&quot;,&quot;skull&quot;,&quot;thief&quot;,&quot;bomb_fish&quot;,&quot;harpoon_shark&quot;,&quot;paddle_shark&quot;,&quot;minotaur&quot;,&quot;troll&quot;,&quot;sheep&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Hero&quot;},&quot;heroColor&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Blue&quot;,&quot;options&quot;:[&quot;Blue&quot;,&quot;Red&quot;,&quot;Yellow&quot;,&quot;Purple&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Hero&quot;},&quot;zoom&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.5,&quot;max&quot;:1.4,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;World&quot;},&quot;sound&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;World&quot;},&quot;lootStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;pen&quot;,&quot;options&quot;:[&quot;pen&quot;,&quot;chest&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;World&quot;}}">
class Component extends DCLogic {
  renderVals(){
    return {
      seed: this.props.seed ?? 7,
      heroUnit: this.props.heroUnit ?? 'random',
      heroColor: this.props.heroColor ?? 'Blue',
      zoom: this.props.zoom ?? 1,
      townColor: this.props.townColor ?? 'Blue',
      worldSize: this.props.worldSize ?? 'large',
      zones: this.props.zones ?? 6,
      sound: (this.props.sound ?? true) ? 'true' : 'false',
      layout: this.props.layout ?? 'utopia',
      lootStyle: this.props.lootStyle ?? 'pen',
      ground: (this.props.ground ?? true) ? 'true' : 'false',
      life: this.props.life ?? 'subtle',
      terrain: this.props.terrain ?? 'paint',
      shade: this.props.shade ?? 'off',
      fluid: this.props.fluid ?? 'wasser',
      waber: String(this.props.waber ?? 4.5),
      waberProps: String(this.props.waberProps ?? 0.45),
      coastInk: this.props.coastInk ?? 'feather',
      relief: this.props.relief ?? 'bevel',
      reliefTex: String(this.props.reliefTex ?? 0.55),
      hudSkin: this.props.hudSkin ?? 'v7',
      propSheet: this.props.propSheet ?? 'mix',
      propGrid: this.props.propGrid ?? 'smooth',
      shadow: this.props.shadow ?? 'contact',
      puddles: this.props.puddles ?? 'on',
      renderScale: String(this.props.renderScale ?? 1),
      bubbleFont: this.props.bubbleFont ?? 'potty',
      chatter: this.props.chatter ?? 'on',
    };
  }
}
