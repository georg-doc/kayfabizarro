document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"80eee316-d85d-4845-9f61-9afa0a417f19\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<!-- KFB Blasen-Formen v1 (2026-08-12) — die Abnahme von Slice v13-C2.\n     Fünf Register nebeneinander, gezeichnet mit **denselben** Funktionen, die im Spiel laufen\n     (`OW_BUBBLE.formen`) und um **denselben** Textblock (`OW_BLAYOUT.layout`). Ein Messblatt, das\n     die Formen nachbaut, prüft seinen eigenen Nachbau — deshalb baut dieses hier nichts nach.\n\n     Georgs Befund vom 12.8. ist der Anlass: der Ruf war ein Rechteck mit Zähnen. Jetzt ist er ein\n     **Sternplatzer** — Spitzen strahlen radial nach außen, lang und kurz abwechselnd, und der\n     Zipfel ist eine gestreckte Spitze, die GERADE auf die Einheit zeigt. -->\n<style>\nhtml,body{margin:0;background:#241f1a}\n*{box-sizing:border-box}\na{color:#0e3d3c}a:hover{color:#000}\n<\u002Fstyle>\n<style>/* vietnamese */\n@font-face {\n  font-family: 'Bangers';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"b34b7c43-e094-4872-917b-836410c0983d\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Bangers';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"5e312184-f59b-4c2e-bc24-3682370910a3\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Bangers';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"79670ae9-de49-4dde-907a-617417eab308\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Shantell Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"eb4ffb48-5648-4375-9709-cd0ce7bda5ce\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Shantell Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"c6bcc4d0-0eff-4f29-a5d3-d0b69d58e44a\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Shantell Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"4364bd08-2e98-47a2-af5a-f67769cf89d0\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Shantell Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"631fa85a-c595-4293-83bd-f95164bde560\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Shantell Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"d905d252-c288-4661-8398-3b5afd49e8ec\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Shantell Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"eb4ffb48-5648-4375-9709-cd0ce7bda5ce\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Shantell Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"c6bcc4d0-0eff-4f29-a5d3-d0b69d58e44a\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Shantell Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"4364bd08-2e98-47a2-af5a-f67769cf89d0\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Shantell Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"631fa85a-c595-4293-83bd-f95164bde560\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Shantell Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"d905d252-c288-4661-8398-3b5afd49e8ec\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Special Elite';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"74f95750-0c84-423d-a260-37e5a871c56b\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Special Elite';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"e8ef2446-1087-4ea4-b06d-60a2c68af76d\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<!-- `card-ink-2d.js` liefert die **Kanon-Feder** für das Flüstern (`OW_CARD.canon`, Import über den\n     CDN-Kanal, deshalb `asset-source.js` davor). Fehlt sie, fällt die Blase auf einen gestrichelten\n     Strich zurück und sagt es in der Konsole — ein fehlender Kanon heißt dünnere Kante, nicht keine. -->\n<script src=\"7b93dc89-d838-4ab0-8a0e-b3ea3703b065\"><\u002Fscript>\n<script src=\"0f0d3a28-d588-482a-a402-5bd139b2f523\"><\u002Fscript>\n<script src=\"52873b5a-dc71-4810-a54e-d1483f50bd50\"><\u002Fscript>\n<script src=\"6f940184-9950-4055-9d9d-c8b15832f23b\"><\u002Fscript>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;padding:24px 28px 60px;font-family:Georgia,'Times New Roman',serif;color:#efe7d4;background:#241f1a\">\n\n  <div style=\"display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;border-bottom:2px solid #000;padding-bottom:12px\">\n    <div style=\"font-size:22px;font-weight:700\">Blasen-Formen <span style=\"color:#47aba9\">C2<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:13px;color:#b8ad95\">fünf Register · Kontur legt sich um den Block<\u002Fdiv>\n    <div style=\"margin-left:auto;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#e8d38a\">{{ stamp }}<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin:14px 0 18px;font-size:13px;line-height:1.6;color:#8a8069;max-width:92ch\">\nStand 12.8. Nacht: <b style=\"color:#b8ad95\">eine ovale Grundform<\u002Fb> für Wolke und Ruf — gebaut als <b style=\"color:#b8ad95\">Superellipse (n = 3)<\u002Fb> mit Polster 13/11 (Ruf) bzw. 12/10 (Wolke) und einer Mindestskalierung, damit die Blockecken sicher innen liegen. Zwei Fassungen davor sind gefallen: der Abstand zur <i>Rechteckkante<\u002Fi> (springt an den Diagonalen — daher zwei waagerechte Hörner und die gewellte Kartoffel) und die Ellipse durch die Ecken (Halbmaß × √2: sitzt an den Ecken am Block, steht seitlich 41 % ab — 40 px links gegen 14 px oben). <b style=\"color:#b8ad95\">Die Grundform ist die Harmonie, die Bögen sind die Handschrift.<\u002Fb> Dazu: Pfeilbasis der Rede ein Viertel schmaler (13,5 px), Denk-Kreise <b style=\"color:#b8ad95\">außerhalb<\u002Fb> der Wolke, Kasten mit Feder-Jitter statt toter Linie, Mindestpolster 11/8 px. Die <b style=\"color:#b8ad95\">Kante<\u002Fb> zeichnet der KFB-Kanon auf einer Canvas-Ebene (<span style=\"font-family:ui-monospace,Menlo,monospace\">inkRibbon2D<\u002Fspan>) — in Bildschirmfotos fehlt sie, im Browser ist sie da. Schrift, Winkel, Streuung liegen in den <b style=\"color:#b8ad95\">Tweaks<\u002Fb>.\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:16px\">\n    <sc-for list=\"{{ karten }}\" as=\"k\" hint-placeholder-count=\"5\">\n      <div style=\"flex:1 1 340px;min-width:320px;background:#1b1712;border:1px solid #332d25;border-radius:5px;padding:12px 14px 14px\">\n        <div style=\"display:flex;align-items:baseline;gap:10px\">\n          <div style=\"font-size:16px;font-weight:700\">{{ k.name }}<\u002Fdiv>\n          <div style=\"font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#8a8069\">{{ k.art }}<\u002Fdiv>\n          <div style=\"margin-left:auto;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#8a8069\">{{ k.form }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:4px;font-size:12px;line-height:1.5;color:#8a8069\">{{ k.regel }}<\u002Fdiv>\n        <div ref=\"{{ k.mount }}\" style=\"margin-top:10px;position:relative;height:290px;background:#7fa64e;border-radius:4px;overflow:hidden\"><\u002Fdiv>\n        <div style=\"margin-top:8px;font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.55;white-space:pre-wrap;color:#a89b80\">{{ k.zahlen }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:22px;padding:14px 16px;background:#1b1712;border:1px solid #332d25;border-radius:5px;font-size:12.5px;line-height:1.6;color:#8a8069;max-width:96ch\">\n    <b style=\"color:#b8ad95\">Was hier absichtlich fehlt:<\u002Fb> Anker über dem Kopf, Ausweichen am Bildrand, Ablage mit vier Ankern und die zweite Blase im Bild. Das ist <b style=\"color:#b8ad95\">C3<\u002Fb> — die Zahlen dafür liegen schon als <span style=\"font-family:ui-monospace,Menlo,monospace\">OW_BLAYOUT.PLACE<\u002Fspan> bereit (Anker +6 px, Zipfel max 22 px, Emanatum 4 px, höchstens zwei Blasen). Der grüne Grund steht hier nur, damit man das Papier gegen die Welt sieht; er ist keine Terrainprobe.\n    <div style=\"margin-top:8px\"><b style=\"color:#b8ad95\">Offen (O2):<\u002Fb> Kayfabulate als Kasten — so steht es hier — oder als Blase mit doppelter Kontur.<\u002Fdiv>\n    <div style=\"margin-top:8px\"><b style=\"color:#b8ad95\">Flüstern:<\u002Fb> der Kanon v2 hat keine gestrichelte Variante (kein <span style=\"font-family:ui-monospace,Menlo,monospace\">dashedPathD<\u002Fspan>, kein Preset <span style=\"font-family:ui-monospace,Menlo,monospace\">card-dash<\u002Fspan>) — der alte Aufruf griff nach einer API, die es nicht gibt. Gelöst nach Georgs Weg: <b style=\"color:#b8ad95\">Lücken als Maske über einer durchgängigen Kante<\u002Fb>. Der Strich bleibt einer, er wird nur stellenweise nicht gezeigt — und dieselbe Maske liegt später über der Kanon-Feder, sobald die im SVG ankommt. <b style=\"color:#b8ad95\">Ein Stil ist eine Maske über der Kante, keine zweite Kante.<\u002Fb><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1100},\n &quot;schrift&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;shantell&quot;,&quot;elite&quot;,&quot;courier&quot;],&quot;default&quot;:&quot;shantell&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Schrift&quot;},\n &quot;winkel&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:360,&quot;step&quot;:5,&quot;default&quot;:90,&quot;unit&quot;:&quot;°&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Anker&quot;},\n &quot;seed&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;min&quot;:1,&quot;max&quot;:99,&quot;default&quot;:7,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Anker&quot;}}\">\n/* Abnahme C2. Alles Gezeichnete kommt aus `OW_BUBBLE.formen` und `OW_BLAYOUT.layout` —\n   dieses Blatt rechnet nur den Anker aus und hängt die Ergebnisse in die Bühne. */\n\nconst M=30;                       // Rand um den Block, wie im Träger (KANON.M)\nconst KARTEN=[\n  {name:'Rede',        typ:'speech',      text:\"Methinks, our little hero has been here before.\",\n   regel:'jittriges Rechteck, getaperter Pfeil, Fuß im mittleren Band'},\n  {name:'Gedanke',     typ:'thought',     text:\"This is either a trap or an extremely confident sandwich.\",\n   regel:'ovale Grundform, mit fetten Lappen nachgezeichnet · Kreise außerhalb'},\n  {name:'Ruf',         typ:'shout',       text:\"KayfaBINGO!\",\n   regel:'ovale Grundform mit 12–18 Zacken + Aufprall-Striche, Zipfel gestreckt'},\n  {name:'Flüstern',    typ:'whisper',     text:\"not so loud, the ditch listens\",\n   regel:'durchgängige Kante, Lücken aus einer Maske — nicht dasharray'},\n  {name:'Kayfabulate', typ:'kayfabulate', text:\"Freedom is ultimately the greatest virtue.\",\n   regel:'Kasten mit Feder-Jitter, kein Zipfel, höher — Erzählung in Special Elite'}\n];\n\nconst INK='#1f1a14';\nclass Component extends DCLogic {\n  /* **Bühnen als Klassenfeld, nicht in `componentDidMount`.** Die `ref`-Rückrufe der Karten feuern\n     VOR dem Mount: `this.b[k.typ]` lief dort in einen TypeError, der als `render error … {}`\n     gemeldet wurde — fünf Mal beim Aufbau, danach nie wieder. Ein leeres Fehlerobjekt ist keine\n     Erklärung; die Reihenfolge ist es. */\n  b = {};\n  componentDidMount(){\n    /* Die Kanon-Feder kommt asynchron (ES-Import über den CDN). **Einmal fragen reicht nicht:**\n       beim ersten `componentDidMount` ist `window.OW_CARD` noch nicht da (die Helmet-Kette läuft\n       noch), der Guard greift nicht, und danach fragt niemand mehr — das Flüstern blieb auf dem\n       Rückfall stehen, ohne dass etwas fehlschlug. Also nachziehen, bis es da ist.\n       *Ein Guard auf ein noch nicht geladenes Modul ist ein stiller Verzicht.* */\n    let n=0;\n    this.poll=setInterval(()=>{\n      if(window.OW_CARD && OW_CARD.ready){\n        clearInterval(this.poll);\n        OW_CARD.ready().then(()=>this.forceUpdate())\n          .catch(e=>console.warn('[blasen-formen] Kanon nicht erreichbar:', e && e.message));\n      }else if(++n>40)clearInterval(this.poll);\n    },200);\n    this.raf = requestAnimationFrame(t=>this.loop(t));\n  }\n  componentWillUnmount(){ cancelAnimationFrame(this.raf); if(this.poll)clearInterval(this.poll); }\n\n  winkel(){ return +(this.props.winkel ?? 90); }   // 90° = Anker unten (Einheit steht unter der Blase)\n  seed(){ return +(this.props.seed ?? 7); }\n\n  /* **Dieselbe Rechnung wie im Spiel** — `OW_BUBBLE.satz`. Ein Messblatt, das Umbruch und\n     Schriftgröße selbst rechnet, prüft seine eigene Rechnung. */\n  lay(k){\n    const B = window.OW_BUBBLE;\n    if(!B || !B.satz) return null;\n    const S = B.satz(k.text, k.typ, {schrift:(this.props.schrift ?? 'courier')});\n    return S.lay ? {art:S.art, l:S.lay, gesetzt:S.gesetzt, fam:S.fam, stil:S.stil} : null;\n  }\n\n  loop(t){\n    const B = window.OW_BUBBLE;\n    /* **Eine Kopfzeile, die einmal beim Mount gelesen wird, altert sofort.** Im Standalone sind die\n       Module beim ersten Rendern noch nicht da: die Karten zeichneten, die Zeile sagte »fehlt«.\n       Also einmal nachziehen, sobald beide stehen. */\n    if(B && window.OW_BLAYOUT && !this._gestempelt){ this._gestempelt=1; this.forceUpdate(); }\n    /* **Die Feder wird angefordert, bis sie da ist — aus der Schleife heraus.** Ein Intervall, das\n       beim Mount startet, ist genau einmal richtig; hier fragt der Zeichner selbst nach, solange er\n       ohne Kante zeichnet. Alle 2 s, nicht je Bild. */\n    if(window.OW_CARD && OW_CARD.ready && !OW_CARD.canon && t-(this._letzteFrage||0)>2000){\n      this._letzteFrage=t;\n      OW_CARD.ready().catch(e=>console.warn('[blasen-formen] Kanon nicht erreichbar:',e&&e.message));\n    }\n    if(B) for(const k of KARTEN){\n      const st = this.b[k.typ];\n      if(!st) continue;\n      /* Hausregel 8: **eine Kachel darf misslingen, die Bildschleife nicht.** Ohne diese Klammer\n         hat ein einziger Fehler in einer Form alle fünf Karten eingefroren — und eingefrorene\n         Karten sehen aus wie fertige Karten. */\n      try{\n      const q = this.lay(k);\n      if(!q) continue;\n      const w = q.l.box.w, hh = q.l.box.h;\n      // Anker: der Punkt, auf den der Zipfel zeigt — hier vom Regler, im Spiel der Kopf der Einheit\n      const a = this.winkel()*Math.PI/180;\n      const cx = M+w/2, cy = M+hh/2, R = Math.max(w,hh)*0.62+58;\n      const hlx = cx+Math.cos(a)*R, hly = cy+Math.sin(a)*R;\n      const paper = '#fbf6ea';\n      const F = B.formen;\n      let d;\n      if(q.art==='gedanke')      d = F.gedanke(M,w,hh,this.seed());\n      else if(q.art==='ruf')     d = F.ruf(M,w,hh,this.seed(),hlx,hly,B.KANON.arrow);\n      else if(q.art==='kayfabulate') d = F.kayfabulate(M,w,hh,this.seed());\n      else                       d = F.rede(M,w,hh,this.seed(),hlx,hly,B.KANON.arrow);\n\n      st.svg.setAttribute('width', w+2*M);\n      st.svg.setAttribute('height', hh+2*M);\n      st.path.setAttribute('d', d);\n      st.path.setAttribute('fill', paper);\n      /* **Die Kante kommt aus dem Kanon**, auf einer Canvas-Ebene über derselben Punktkette\n         (`kanonFeder`); Lücken beim Flüstern werden herausradiert. Gelingt das nicht, zeichnet\n         das SVG weiter — mit Maskenlücken, damit der Rückfall sichtbar dasselbe meint. */\n      st.dash.setAttribute('d','');\n      const fl = q.art==='fluester';\n      const gaps = fl ? F.lueckenGeo(d,13,6,B.KANON.line*3) : null;\n      const ok = F.kanonFeder(st.feder, w+2*M, hh+2*M, d, this.seed(), gaps, 'card');\n      if(ok){\n        st.path.setAttribute('stroke','none');\n        st.path.removeAttribute('mask');\n        st.gaps.innerHTML='';\n      }else{\n        st.path.setAttribute('stroke', INK);\n        st.path.setAttribute('stroke-width', q.art==='ruf' ? B.KANON.line*1.6 : B.KANON.line);\n        if(fl){ st.gaps.innerHTML=F.luecken(d,13,6,B.KANON.line*3);\n          st.path.setAttribute('mask','url(#'+st.maskId+')'); }\n        else { st.gaps.innerHTML=''; st.path.removeAttribute('mask'); }\n      }\n      st.federOk = ok;\n      st.dash.setAttribute('fill', INK);\n      if(q.art==='gedanke') F.denkzipfel(st.think,M,w,hh,hlx,hly,paper,B.KANON.line,t/1000);\n      else if(q.art==='ruf') F.aufprall(st.think,M,w,hh,this.seed(),hlx,hly);\n      else st.think.innerHTML='';\n\n      // Anker sichtbar machen: das ist der Punkt, an dem im Spiel der Kopf steht\n      st.dot.setAttribute('cx', hlx.toFixed(1));\n      st.dot.setAttribute('cy', hly.toFixed(1));\n\n      st.txt.setAttribute('style','position:absolute;display:flex;align-items:center;'+\n        'justify-content:center;'+q.stil);\n      /* **Randabstand messen statt schätzen** (Georg: »padding bei allen checken«): kleinster\n         Abstand von der **Schrift** zur gezeichneten Kontur — nicht vom Block. Der Block enthält\n         das Polster schon; von ihm aus gemessen ist der Rand der Rede definitionsgemäß 0, und die\n         Zahl sagt nichts. Gemessen wird also vom Textrechteck (Block minus Polster). */\n      const pts=F.punkteAus(d);\n      const tx0=M+q.l.box.padX, ty0=M+q.l.box.padY;\n      const tx1=M+w-q.l.box.padX, ty1=M+hh-q.l.box.padY;\n      let min=1e9;\n      for(const pt of pts){\n        const dxr=Math.max(tx0-pt[0], 0, pt[0]-tx1);\n        const dyr=Math.max(ty0-pt[1], 0, pt[1]-ty1);\n        const dist=Math.hypot(dxr,dyr);\n        if(dist<min)min=dist;\n      }\n      st.rand=Math.round(min);\n      st.txt.style.left = M+'px'; st.txt.style.top = M+'px';\n      st.txt.style.width = w+'px'; st.txt.style.height = hh+'px';\n      /* Der Ruf wird gesetzt, nicht getippt — derselbe Bogen wie im Träger (`bogenSatz`). */\n      const block=q.l.lines.join('\\n');\n      if(q.art==='ruf'){\n        const html=\"<span style='display:inline-block;transform:rotate(\"+(((this.seed()%7)-3)*0.9).toFixed(1)+\n          \"deg) skewX(-3deg)'>\"+B.bogenSatz(block,this.seed(),15)+\"<\u002Fspan>\";\n        if(st.txt.innerHTML!==html)st.txt.innerHTML=html;\n      }else if(st.txt.textContent!==block) st.txt.textContent=block;\n      /* Der Wickel hat nur absolut gesetzte Kinder, also keine eigene Größe — ohne diese zwei\n         Zeilen greift `translate(-50%,-50%)` an einem 0×0-Kasten und die Blase rutscht in die Ecke. */\n      st.wrap.style.width = (w+2*M)+'px';\n      st.wrap.style.height = (hh+2*M)+'px';\n      st.wrap.style.transform = 'translate(-50%,-50%)';\n      }catch(e){\n        if(!this._loopWarn){this._loopWarn=1;\n          console.warn('[blasen-formen] Karte »'+k.name+'« zeichnet nicht:',e&&e.message);}\n      }\n    }\n    this.raf = requestAnimationFrame(n=>this.loop(n));\n  }\n\n  mount(k, el){\n    if(!el || this.b[k.typ]) return;\n    const wrap = document.createElement('div');\n    wrap.style.cssText = 'position:absolute;left:50%;top:50%;filter:drop-shadow(2px 3px 0 rgba(31,26,20,.18))';\n    wrap.innerHTML =\n      \"<canvas class='feder' style='position:absolute;left:0;top:0;pointer-events:none'><\u002Fcanvas>\"+\n      \"<svg style='position:absolute;left:0;top:0;overflow:visible'>\"+\n        \"<defs><mask id='fl-\"+k.typ+\"' maskUnits='userSpaceOnUse' x='-40' y='-40' width='4000' height='4000'>\"+\n          \"<rect x='-40' y='-40' width='4000' height='4000' fill='#fff'><\u002Frect>\"+\n          \"<g class='mk-gaps'><\u002Fg><\u002Fmask><\u002Fdefs>\"+\n        \"<path class='out' stroke-linejoin='round'><\u002Fpath>\"+\n        \"<path class='dash'><\u002Fpath><g class='think'><\u002Fg>\"+\n        \"<circle class='dot' r='3.5' fill='#c9422e'><\u002Fcircle>\"+\n      \"<\u002Fsvg>\"+\n      \"<div class='txt' style='position:absolute;display:flex;align-items:center;justify-content:center;\"+\n        \"text-align:center;white-space:pre;color:\"+INK+\"'><\u002Fdiv>\";\n    el.appendChild(wrap);\n    this.b[k.typ] = {wrap, svg:wrap.querySelector('svg'), path:wrap.querySelector('.out'),\n      dash:wrap.querySelector('.dash'), think:wrap.querySelector('.think'),\n      dot:wrap.querySelector('.dot'), txt:wrap.querySelector('.txt'),\n      gaps:wrap.querySelector('.mk-gaps'), maskId:'fl-'+k.typ,\n      feder:wrap.querySelector('.feder')};\n  }\n\n  renderVals(){\n    const B = window.OW_BUBBLE, L = window.OW_BLAYOUT;\n    return {\n      stamp: (B?B.version:'bubble-ts fehlt')+' · '+(L?L.version:'bubble-layout fehlt')\n        +' · Anker '+this.winkel()+'° · Streuung '+this.seed(),\n      karten: KARTEN.map(k=>{\n        const q = this.lay(k);\n        return {\n          name:k.name, art:(q?q.art:'—'), regel:k.regel,\n          form: q ? (q.art==='ruf'?'Sternplatzer':q.art==='gedanke'?'Wolke + Kreise'\n                    :q.art==='kayfabulate'?'Kasten':q.art==='fluester'?'Rechteck + Feder':'Rechteck') : '',\n          zahlen: q ? (q.l.lines.length+' Zeilen · längste '+q.l.cols+'/'+q.l.maxChars+' Zchn\\n'\n            +'Block '+q.l.box.w+'×'+q.l.box.h+' px · Schrift '+q.gesetzt+' px · Polster '\n            +q.l.box.padX+'/'+q.l.box.padY+'\\nRand bis Kontur '+((this.b[k.typ]&&this.b[k.typ].rand)!=null?this.b[k.typ].rand+' px':'…')\n            +' · Feder '+((window.OW_CARD&&OW_CARD.canon)?'Kanon':'SVG-Rückfall')\n            +'\\n'+q.l.times.total+' ms gesamt'\n            +(q.l.overflow?' · ÜBERLAUF':'')) : '',\n          mount: el=>this.mount(k, el)\n        };\n      })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
