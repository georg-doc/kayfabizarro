document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"ef8250a0-bbfa-4a57-bdd4-cf7a9f7ac4f4\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<!-- KFB Terrain-Probe v1 (tp-probe-v1, 2026-08-12) — Messplatz, kein Spiel.\n     Zweck: Pirate Bomb (CC0, 20 fps, Seitenansicht) neben Tiny-Swords-Einheiten und -Requisiten\n     auf EINEM Boden sehen und den Maßstab MESSEN statt zu schätzen (offene Entscheidung 11 aus\n     `uploads/HANDOVER_Cowork_2026-08-12.md`).\n\n     Drei Regeln, die dieses Blatt einhält:\n     (a) Der Kanal ist EINE Stelle: alle Bytes über `OW_SRC` (asset-source.js), nichts hart verdrahtet.\n     (b) Der Maßstab ist die Regel des Spiels: `OW_UNITS.heroDef` + `OW_LOADER.loadUnit(refBody 91)`\n         — dieselbe Kette wie im Runner. Ein eigener Maßstab hier wäre die zweite Wahrheit.\n     (c) Boden ist ABSICHTLICH lean: Grundton aus der BIOMES-Tabelle von `ground-paint.js`,\n         KEINE Texturen, kein Relief, keine Tusche. Wer hier Terrain beurteilt, beurteilt das Spiel.\n\n     Kein Modul dieses Ordners wird verändert; die Probe liest nur. -->\n<style>\nhtml,body{margin:0;height:100%;background:#241f1a}\n*{box-sizing:border-box}\na{color:#0e3d3c}a:hover{color:#000}\n::-webkit-scrollbar{width:9px;height:9px}\n::-webkit-scrollbar-thumb{background:#5b5346;border-radius:5px}\n<\u002Fstyle>\n<script src=\"09ec50ee-6d13-4fc6-9a7f-04d3b9080555\"><\u002Fscript>\n<script src=\"be4123a7-e4c2-47a5-9472-dc5ac209c175\"><\u002Fscript>\n<script src=\"244c1255-2e10-4e33-867d-640c110b68d5\"><\u002Fscript>\n<!-- ohne `hero-frames.js` zählt `roster()` 27 statt der gemessenen 30: die drei Helden aus\n     Einzelframes hängen an `window.OW_HERO`. Die Zahl 30 gehört dem Katalog, nicht diesem Blatt. -->\n<script src=\"79d40b9f-bc08-4a8b-aa34-262fdda7094c\"><\u002Fscript>\n<\u002Fhelmet>\n\n<div style=\"height:100vh;display:flex;flex-direction:column;font-family:Georgia,'Times New Roman',serif;color:#efe7d4;background:#241f1a\">\n\n  <div style=\"display:flex;align-items:baseline;gap:18px;padding:10px 16px;background:#14100c;border-bottom:2px solid #000\">\n    <div style=\"font-size:18px;font-weight:700;letter-spacing:.4px\">KFB Terrain-Probe <span style=\"color:#47aba9\">v1<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:12.5px;color:#b8ad95\">Pirate Bomb neben Tiny Swords · ein Boden, ein Maßstab, gemessene Zahlen<\u002Fdiv>\n    <div style=\"margin-left:auto;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#e8d38a\">{{ status }}<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"flex:1;min-height:0;display:flex\">\n\n    <div style=\"width:266px;flex:none;display:flex;flex-direction:column;background:#1b1712;border-right:2px solid #000\">\n      <div style=\"padding:9px 12px 7px\">\n        <input value=\"{{ query }}\" sc-camel-on-input=\"{{ onQuery }}\" placeholder=\"filtern …\" style=\"width:100%;padding:6px 8px;font:13px Georgia,serif;color:#efe7d4;background:#0f0c09;border:1px solid #3c352c;border-radius:3px;outline:none\">\n      <\u002Fdiv>\n      <div style=\"flex:1;overflow:auto;padding:0 8px 12px\">\n        <sc-for list=\"{{ groups }}\" as=\"g\" hint-placeholder-count=\"3\">\n          <div style=\"margin:10px 0 5px;padding:0 4px;font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:#8a8069\">{{ g.title }}<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:3px\">\n            <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"6\">\n              <div sc-camel-on-click=\"{{ it.pick }}\" style=\"display:flex;align-items:baseline;gap:8px;padding:5px 7px;background:#241f19;border:1px solid #332d25;border-radius:3px;cursor:pointer\" style-hover=\"background:#2f2921;border-color:#5f574a\">\n                <div style=\"font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ it.label }}<\u002Fdiv>\n                <div style=\"font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:#8a8069;flex:none\">{{ it.sub }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"padding:8px 12px;border-top:1px solid #2c2620;font-size:11.5px;line-height:1.45;color:#8a8069\">\n        Weitere Pirate-Bomb-Figuren kommen dazu: eine Zeile in <span style=\"font-family:ui-monospace,Menlo,monospace\">PB_CHARS<\u002Fspan> (Ordner, Leinwandmaß, Bilderzahl je Animation).\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;background:#2b251e\">\n      <div ref=\"{{ stageRef }}\" style=\"flex:1;min-height:0;position:relative\">\n        <canvas ref=\"{{ canvasRef }}\" sc-camel-on-pointer-down=\"{{ onDown }}\" sc-camel-on-pointer-move=\"{{ onMove }}\" sc-camel-on-pointer-up=\"{{ onUp }}\" style=\"position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none\"><\u002Fcanvas>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 14px;background:#14100c;border-top:2px solid #000;font-size:12px\">\n        <div sc-camel-on-click=\"{{ onRow }}\" style=\"padding:5px 11px;background:#e8d38a;color:#14100c;font-weight:700;border-radius:3px;cursor:pointer\" style-hover=\"background:#f3e2a6\">Reihe nach Körperhöhe<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ onSpread }}\" style=\"padding:5px 11px;background:#2f2921;border:1px solid #4b4438;border-radius:3px;cursor:pointer\" style-hover=\"border-color:#8a8069\">verteilen<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ onClear }}\" style=\"padding:5px 11px;background:#2f2921;border:1px solid #4b4438;border-radius:3px;cursor:pointer\" style-hover=\"border-color:#8a8069\">alle weg<\u002Fdiv>\n        <div style=\"min-width:0;color:#8a8069\">Ziehen verschiebt · Klick wählt aus<\u002Fdiv>\n        <div style=\"margin-left:auto;flex:none;white-space:nowrap;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:#8a8069\">{{ modeNote }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"width:322px;flex:none;display:flex;flex-direction:column;background:#1b1712;border-left:2px solid #000\">\n      <div style=\"padding:9px 12px 6px;font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:#8a8069\">Auf dem Boden · {{ actorCount }}<\u002Fdiv>\n      <div style=\"flex:1;overflow:auto;padding:0 10px 12px;display:flex;flex-direction:column;gap:7px\">\n        <sc-for list=\"{{ actors }}\" as=\"a\" hint-placeholder-count=\"2\">\n          <div sc-camel-on-click=\"{{ a.select }}\" style=\"padding:8px 9px;background:#241f19;border:1px solid #332d25;border-left:3px solid #47aba9;border-radius:3px;cursor:pointer\">\n            <div style=\"display:flex;align-items:baseline;gap:8px\">\n              <div style=\"font-size:13.5px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ a.label }}<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ a.remove }}\" style=\"font-size:11px;color:#c98b7a;cursor:pointer\">entfernen<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:4px;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;line-height:1.5;color:#a89b80\">{{ a.measure }}<\u002Fdiv>\n            <div style=\"margin-top:6px;display:flex;align-items:center;gap:6px\">\n              <sc-raw-select value=\"{{ a.anim }}\" sc-camel-on-change=\"{{ a.onAnim }}\" style=\"flex:1;min-width:0;padding:3px 4px;font:12px ui-monospace,Menlo,monospace;color:#efe7d4;background:#0f0c09;border:1px solid #3c352c;border-radius:3px\">\n                <sc-for list=\"{{ a.animOptions }}\" as=\"o\" hint-placeholder-count=\"3\">\n                  <option value=\"{{ o.key }}\">{{ o.label }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n              <div sc-camel-on-click=\"{{ a.onFlip }}\" style=\"padding:3px 8px;font-size:11.5px;background:#2f2921;border:1px solid #4b4438;border-radius:3px;cursor:pointer\">spiegeln<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ a.onWalk }}\" style=\"padding:3px 8px;font-size:11.5px;background:#2f2921;border:1px solid #4b4438;border-radius:3px;cursor:pointer\">{{ a.walkLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"padding:9px 12px;border-top:1px solid #2c2620;font-size:11.5px;line-height:1.5;color:#8a8069\">\n        Maßstab, Zoom, Ufer, Raster und Grundton liegen in den <b style=\"color:#b8ad95\">Tweaks<\u002Fb> — eine Wahrheit je Regler, keine zweite Reihe Knöpfe.\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},\n &quot;scaleMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ref91&quot;,&quot;src&quot;],&quot;default&quot;:&quot;ref91&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Maßstab&quot;},\n &quot;zoom&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.5,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Maßstab&quot;},\n &quot;biome&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;grass&quot;,&quot;wilds&quot;,&quot;swamp&quot;,&quot;ash&quot;,&quot;highland&quot;,&quot;winter&quot;,&quot;waste&quot;,&quot;paper&quot;],&quot;default&quot;:&quot;grass&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Boden&quot;},\n &quot;water&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Boden&quot;},\n &quot;grid&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Boden&quot;}}\">\n/* Terrain-Probe · tp-probe-v1\n   Sie lädt über die Kette des Spiels: OW_SRC → OW_UNITS.heroDef → OW_LOADER.loadUnit(refBody 91).\n   Pirate Bomb hat keinen Katalog, also messe ich hier — mit DEMSELBEN Werkzeug (OW_LOADER.probeBox),\n   damit Fußpunkt und Körperhöhe nach derselben Definition entstehen wie bei Tiny Swords. */\n\nconst HERO_REF = 91;            // Bezugskörper der Welt in Quellpixeln (overworld-game-v10.js)\nconst PB_FPS   = 20;            // vom Hersteller kanonisch angegeben (Handover §5)\n\n/* Pirate Bomb, CC0 (Pixel Frog). Bilderzahlen aus dem **Franken-Bündel v2** übernommen (Georg,\n   12.8.) — nicht geschätzt: fünf Figuren, 485 Bilder. `*` = umgewidmetes Seitenscroller-Verb,\n   `**` = Eigenheit dieser Figur. Weitere Pakete (Kings and Pigs) sind eine Zeile hier — und laut\n   Bündel §6 später ein **Manifest**, damit ein neues Paket keine Codezeile kostet. */\nconst PB_CHARS = [\n  { id:'guy', label:'Bomb Guy', dir:'1-Player-Bomb Guy', w:58, h:58, anims:[\n    {folder:'1-Idle',n:26,map:'idle'},{folder:'2-Run',n:14,map:'walk / chase'},\n    {folder:'7-Hit',n:8,map:'hurt'},{folder:'8-Dead Hit',n:6,map:'death 1'},\n    {folder:'9-Dead Ground',n:4,map:'death 2'},{folder:'10-Door In',n:16,map:'spawn**'},\n    {folder:'11-Door Out',n:16,map:'despawn**'},{folder:'3-Jump Anticipation',n:1,map:'aggro tell*'},\n    {folder:'4-Jump',n:4,map:'lunge*'},{folder:'5-Fall',n:2,map:'knockback*'},\n    {folder:'6-Ground',n:3,map:'recover*'} ]},\n  { id:'bald', label:'Bald Pirate', dir:'2-Enemy-Bald Pirate', w:63, h:67, anims:[\n    {folder:'1-Idle',n:34,map:'idle'},{folder:'2-Run',n:14,map:'walk / chase'},\n    {folder:'7-Attack',n:12,map:'attack'},{folder:'8-Hit',n:8,map:'hurt'},\n    {folder:'9-Dead Hit',n:6,map:'death 1'},{folder:'10-Dead Ground',n:4,map:'death 2'},\n    {folder:'3-Jump Anticipation',n:1,map:'aggro tell*'},{folder:'4-Jump',n:4,map:'lunge*'},\n    {folder:'5-Fall',n:2,map:'knockback*'},{folder:'6-Ground',n:3,map:'recover*'} ]},\n  { id:'cuc', label:'Cucumber', dir:'3-Enemy-Cucumber', w:64, h:68, anims:[\n    {folder:'1-Idle',n:36,map:'idle'},{folder:'2-Run',n:12,map:'walk / chase'},\n    {folder:'7-Attack',n:11,map:'attack'},{folder:'8-Blow the wick',n:11,map:'defuse / deny**'},\n    {folder:'9-Hit',n:8,map:'hurt'},{folder:'10-Dead Hit',n:6,map:'death 1'},\n    {folder:'11-Dead Ground',n:4,map:'death 2'},{folder:'3-Jump Anticipation',n:1,map:'aggro tell*'},\n    {folder:'4-Jump',n:4,map:'lunge*'},{folder:'5-Fall',n:2,map:'knockback*'},\n    {folder:'6-Ground',n:3,map:'recover*'} ]},\n  { id:'cap', label:'Captain', dir:'5-Enemy-Captain', w:80, h:72, anims:[\n    {folder:'1-Idle',n:32,map:'idle'},{folder:'2-Run',n:14,map:'walk / chase'},\n    {folder:'7-Attack',n:7,map:'attack'},{folder:'8-Scare Run',n:12,map:'flee**'},\n    {folder:'9-Hit',n:8,map:'hurt'},{folder:'10-Dead Hit',n:6,map:'death 1'},\n    {folder:'11-Dead Ground',n:4,map:'death 2'},{folder:'3-Jump Anticipation',n:1,map:'aggro tell*'},\n    {folder:'4-Jump',n:4,map:'lunge*'},{folder:'5-Fall',n:2,map:'knockback*'},\n    {folder:'6-Ground',n:3,map:'recover*'} ]},\n  { id:'whale', label:'Whale', dir:'6-Enemy-Whale', w:68, h:46, anims:[\n    {folder:'1-Idle',n:44,map:'idle'},{folder:'2-Run',n:14,map:'walk / chase'},\n    {folder:'7-Attack',n:11,map:'attack'},{folder:'8-Swalow (Bomb)',n:10,map:'swallow / accept**'},\n    {folder:'9-Hit',n:7,map:'hurt'},{folder:'10-Dead Hit',n:6,map:'death 1'},\n    {folder:'11-Dead Ground',n:4,map:'death 2'},{folder:'3-Jump Anticipation',n:1,map:'aggro tell*'},\n    {folder:'4-Jump',n:4,map:'lunge*'},{folder:'5-Fall',n:2,map:'knockback*'},\n    {folder:'6-Ground',n:3,map:'recover*'} ]}\n];\n\n/* Grundton je Biom — abgeschrieben wäre falsch, deshalb steht daneben, woher er kommt:\n   ground-paint.js BIOMES.tint. Hier OHNE Textur und Relief (lean, siehe Kopf des Blattes). */\nconst TINT = {grass:'#7fa64e',wilds:'#5e7f3e',swamp:'#4d6b52',ash:'#6b6259',\n  highland:'#8a9a86',winter:'#c6d4dc',waste:'#a8895c',paper:'#d8cdb2'};\n\nclass Component extends DCLogic {\n  state = { actors:[], sel:null, groups:[], query:'', status:'lade Katalog …', tick:0 };\n\n  componentDidMount(){\n    this.acts = [];                 // Laufzeit-Objekte (Bilder, Frames) — NICHT in state\n    this.drag = null;\n    this.buildGroups();\n    /* `hero-frames.js` kann nach dem Mount fertig werden — dann sind es 27 statt der gemessenen 30\n       Einheiten. Also einmal nachsehen statt die Zahl hier zu behaupten (Naht: eine Zahl, ein Ort). */\n    let tries = 0;\n    this.poll = setInterval(()=>{\n      if(window.OW_HERO){ this.buildGroups(); clearInterval(this.poll); }\n      else if(++tries > 20) clearInterval(this.poll);\n    }, 250);\n    this.ro = new ResizeObserver(()=>this.fit());\n    if(this.stage) this.ro.observe(this.stage);\n    this.fit();\n    this.last = performance.now();\n    this.raf = requestAnimationFrame(t=>this.loop(t));\n    console.log('[terrain-probe] tp-probe-v1 · Kanal', window.OW_SRC?OW_SRC.mode:'?',\n      '· Maßstab HERO_REF', HERO_REF, '· Pirate Bomb', PB_FPS+' fps');\n  }\n  componentWillUnmount(){ cancelAnimationFrame(this.raf); if(this.ro) this.ro.disconnect();\n    if(this.poll) clearInterval(this.poll); }\n\n  /* ── Panel-Listen ─────────────────────────────────────────────────────────── */\n  buildGroups(){\n    const U = window.OW_UNITS;\n    const pb = PB_CHARS.map(c=>({key:'pb:'+c.id,label:c.label,sub:c.w+'×'+c.h,\n      pick:()=>this.addPirate(c)}));\n    const units = (U&&U.roster?U.roster():[]).map(r=>({key:'ts:'+r.id,label:r.label,sub:r.group,\n      pick:()=>this.addUnit(r)}));\n    const props = [];\n    if(U&&U.props) for(const k in U.props){\n      const p = U.props[k];\n      const url = Array.isArray(p) ? p[0] : (p.url || (p.urls&&p.urls.right));\n      if(!url) continue;\n      props.push({key:'prop:'+k,label:(p.name||k),sub:p.animated?'anim':'still',\n        pick:()=>this.addProp(k,p,url)});\n    }\n    this.setState({groups:[\n      {title:'Pirate Bomb · CC0 · 20 fps', items:pb},\n      {title:'Tiny Swords · Einheiten ('+units.length+')', items:units},\n      {title:'Tiny Swords · Requisiten ('+props.length+')', items:props}\n    ], status:units.length+' Einheiten · '+props.length+' Requisiten · '+PB_CHARS.length+' Piraten'});\n  }\n\n  /* ── Laden ────────────────────────────────────────────────────────────────── */\n  pbUrl(dir,folder,i){\n    const S = window.OW_SRC;\n    const p = 'Pirate_Bomb/'+encodeURIComponent(dir)+'/'+encodeURIComponent(folder)+'/'+i+'.png';\n    return S ? S.a2d(p) : p;\n  }\n  img(url){ return new Promise((res,rej)=>{ const i=new Image(); i.crossOrigin='anonymous';\n    i.onload=()=>res(i); i.onerror=()=>rej(new Error(url)); i.src=url; }); }\n\n  async addPirate(c){\n    this.setState({status:'lade '+c.label+' …'});\n    let n=0, all=c.anims.reduce((s,a)=>s+a.n,0);\n    const anims={};\n    for(const a of c.anims){\n      const imgs = await Promise.all(Array.from({length:a.n},(_,k)=>\n        this.img(this.pbUrl(c.dir,a.folder,k+1)).catch(()=>null)));\n      n += a.n; this.setState({status:'lade '+c.label+' · '+n+'/'+all});\n      anims[a.folder]={label:a.folder.replace(/^\\d+-/,'')+' → '+a.map,imgs,frames:a.n,fps:PB_FPS};\n    }\n    const first = anims[c.anims[0].folder].imgs.find(i=>i);\n    const box = first ? OW_LOADER.probeBox(first,0,0,c.w,c.h) : null;\n    const srcBodyH = box?box.h:c.h;\n    this.push({ kind:'pb', label:c.label, anims, order:c.anims.map(a=>a.folder),\n      anim:c.anims[0].folder, srcBodyH, anchorX:box?box.cx:c.w/2, anchorY:box?box.bottom:c.h,\n      fw:c.w, fh:c.h, srcNote:c.w+'×'+c.h });\n    /* Naht 65 in klein: »lade …« stehenzulassen liest sich als »läuft noch«. Der Endzustand ist das\n       gemessene Ergebnis — damit steht die Zahl im Blatt und nicht nur in der Konsole. */\n    this.setState({status:c.label+' · Körper '+Math.round(srcBodyH)+' px → ×'+\n      (HERO_REF/srcBodyH).toFixed(2)+' = '+HERO_REF+' px'});\n    console.log('[terrain-probe] '+c.label+' · Leinwand '+c.w+'×'+c.h+' · Körper '+Math.round(srcBodyH)+\n      'px → ×'+(HERO_REF/srcBodyH).toFixed(2)+' = '+HERO_REF+'px · Fußpunkt '+\n      (box?Math.round(box.cx):'?')+'/'+(box?box.bottom:'?'));\n  }\n\n  async addUnit(r){\n    this.setState({status:'lade '+r.label+' …'});\n    try{\n      const d = await OW_UNITS.heroDef(r.id,'Blue');\n      const u = await OW_LOADER.loadUnit(d.id, d.def, {refBody:HERO_REF});\n      const keys = Object.keys(u.anims);\n      this.push({ kind:'ts', label:r.label+' · '+r.group, unit:u, order:keys,\n        anim:u.anims.idle?'idle':keys[0], srcBodyH:u.srcBodyH, sizeRel:u.scale/(HERO_REF/u.srcBodyH),\n        srcNote:(u.kind==='rowsheet'?'192er-Zelle':'Streifen') });\n      this.setState({status:r.label+' geladen'});\n    }catch(e){ this.setState({status:'FEHLER bei '+r.label+': '+e.message});\n      console.error('[terrain-probe]',r.id,e); }\n  }\n\n  async addProp(key,p,url){\n    this.setState({status:'lade '+(p.name||key)+' …'});\n    try{\n      const im = await this.img(url);\n      const st = p.animated ? OW_LOADER.probeStrip(im) : {fw:im.width,frames:1};\n      const box = OW_LOADER.probeBox(im,0,0,st.fw,im.height);\n      this.push({ kind:'prop', label:(p.name||key), img:im, fw:st.fw, fh:im.height,\n        frames:st.frames, fps:8, anim:'—', order:['—'], srcBodyH:box?box.h:im.height,\n        anchorX:box?box.cx:st.fw/2, anchorY:box?box.bottom:im.height,\n        srcNote:st.fw+'×'+im.height+(st.frames>1?' · '+st.frames+' Bilder':'') });\n      this.setState({status:(p.name||key)+' geladen'});\n    }catch(e){ this.setState({status:'FEHLER bei '+key+': '+e.message}); }\n  }\n\n  push(a){\n    const W = this.cw||1000, H = this.ch||600;\n    a.uid = 'a'+(++this._n||(this._n=1));\n    a.frame = 0; a.t = 0; a.flip = false; a.walk = false; a.vx = 60;\n    a.x = 90 + (this.acts.length%8)*Math.max(80,(W-220)/8);\n    a.y = H*0.60;\n    this.acts.push(a);\n    this.sync(a.uid);\n  }\n  sync(sel){ this.setState({actors:this.acts.map(a=>a.uid), sel:sel!==undefined?sel:this.state.sel, tick:this.state.tick+1}); }\n\n  /* ── Bühne ────────────────────────────────────────────────────────────────── */\n  fit(){\n    const c = this.canvas, s = this.stage;\n    if(!c||!s) return;\n    const dpr = Math.min(2, window.devicePixelRatio||1);\n    const r = s.getBoundingClientRect();\n    c.width = Math.max(2,Math.round(r.width*dpr));\n    c.height = Math.max(2,Math.round(r.height*dpr));\n    this.dpr = dpr; this.cw = r.width/this.zoom(); this.ch = r.height/this.zoom();\n  }\n  zoom(){ return +(this.props.zoom ?? 1) || 1; }\n  refMode(){ return (this.props.scaleMode ?? 'ref91') === 'ref91'; }\n\n  scaleOf(a){\n    if(!this.refMode()) return 1;\n    if(a.kind==='ts') return a.unit.scale;\n    if(a.kind==='pb') return HERO_REF/a.srcBodyH;\n    return 1;                                  // Requisiten: Originalgröße (scale = 1, Naht 8)\n  }\n  frameOf(a){\n    if(a.kind==='ts'){ const an=a.unit.anim(a.anim); return {img:an.img,sx:an.sx||0,sy:an.sy||0,\n      fw:an.fw,fh:an.fh,n:an.frames,fps:an.fps||12,ax:an.anchorX,ay:an.anchorY}; }\n    if(a.kind==='pb'){ const g=a.anims[a.anim]; const im=g.imgs[a.frame%g.frames];\n      return {img:im,sx:0,sy:0,fw:a.fw,fh:a.fh,n:g.frames,fps:g.fps,ax:a.anchorX,ay:a.anchorY}; }\n    return {img:a.img,sx:(a.frame%a.frames)*a.fw,sy:0,fw:a.fw,fh:a.fh,n:a.frames,fps:a.fps,\n      ax:a.anchorX,ay:a.anchorY};\n  }\n\n  loop(t){\n    const dt = Math.min(0.05,(t-this.last)/1000); this.last = t;\n    const c = this.canvas;\n    if(c){\n      const z = this.zoom(), dpr = this.dpr||1;\n      const W = c.width/(dpr*z), H = c.height/(dpr*z);\n      this.cw = W; this.ch = H;\n      const g = c.getContext('2d');\n      g.setTransform(dpr*z,0,0,dpr*z,0,0);\n      g.imageSmoothingEnabled = false;\n      this.ground(g,W,H);\n      for(const a of this.acts){\n        const f = this.frameOf(a);\n        a.t += dt;\n        const step = 1/(f.fps||12);\n        while(a.t >= step){ a.t -= step; a.frame = (a.frame+1)%Math.max(1,f.n); }\n        if(a.walk){\n          a.x += a.vx*dt*(a.flip?-1:1);\n          if(a.x > W-60){ a.flip = true; } if(a.x < 60){ a.flip = false; }\n        }\n        this.paint(g,a,f);\n      }\n    }\n    this.raf = requestAnimationFrame(n=>this.loop(n));\n  }\n\n  ground(g,W,H){\n    const biome = this.props.biome ?? 'grass';\n    g.fillStyle = TINT[biome]||TINT.grass;\n    g.fillRect(0,0,W,H);\n    if(this.props.grid ?? true){\n      g.strokeStyle = 'rgba(0,0,0,.07)'; g.lineWidth = 1;\n      for(let x=0;x<=W;x+=64){ g.beginPath(); g.moveTo(x+.5,0); g.lineTo(x+.5,H); g.stroke(); }\n      for(let y=0;y<=H;y+=64){ g.beginPath(); g.moveTo(0,y+.5); g.lineTo(W,y+.5); g.stroke(); }\n    }\n    if(this.props.water ?? true){\n      const top = Math.round(H*0.80);\n      g.fillStyle = '#3f7d86'; g.fillRect(0,top,W,H-top);\n      g.fillStyle = 'rgba(255,255,255,.10)'; g.fillRect(0,top,W,6);\n      g.strokeStyle = '#14100c'; g.lineWidth = 3;\n      g.beginPath(); g.moveTo(0,top-1.5); g.lineTo(W,top-1.5); g.stroke();\n    }\n  }\n\n  paint(g,a,f){\n    const s = this.scaleOf(a);\n    if(!f.img || !f.img.complete || !f.img.naturalWidth) return;\n    // Kontaktschatten: eine Ellipse, damit der Fußpunkt sichtbar ist — Prüfmittel, kein Look\n    g.save();\n    g.globalAlpha = .22; g.fillStyle = '#000';\n    g.beginPath(); g.ellipse(a.x, a.y, Math.max(6,f.fw*s*0.20), Math.max(3,f.fw*s*0.08), 0, 0, 6.2832);\n    g.fill(); g.restore();\n    g.save();\n    g.translate(a.x, a.y);\n    if(a.flip) g.scale(-1,1);\n    g.drawImage(f.img, f.sx, f.sy, f.fw, f.fh, -f.ax*s, -f.ay*s, f.fw*s, f.fh*s);\n    g.restore();\n    if(this.state.sel === a.uid){\n      g.save(); g.strokeStyle = '#47aba9'; g.lineWidth = 2;\n      g.strokeRect(a.x-f.ax*s, a.y-f.ay*s, f.fw*s, f.fh*s);\n      g.beginPath(); g.moveTo(a.x-10,a.y); g.lineTo(a.x+10,a.y); g.stroke(); g.restore();\n    }\n  }\n\n  hit(x,y){\n    for(let i=this.acts.length-1;i>=0;i--){\n      const a = this.acts[i], f = this.frameOf(a), s = this.scaleOf(a);\n      if(x >= a.x-f.ax*s && x <= a.x-f.ax*s+f.fw*s && y >= a.y-f.ay*s && y <= a.y+8) return a;\n    }\n    return null;\n  }\n  pt(e){ const r = this.canvas.getBoundingClientRect(), z = this.zoom();\n    return {x:(e.clientX-r.left)/z, y:(e.clientY-r.top)/z}; }\n\n  renderVals(){\n    const q = this.state.query.trim().toLowerCase();\n    const groups = this.state.groups.map(g=>({title:g.title,\n      items:q ? g.items.filter(i=>i.label.toLowerCase().includes(q)) : g.items}));\n    const actors = this.acts.map(a=>{\n      const s = this.scaleOf(a);\n      const body = Math.round(a.srcBodyH*s);\n      return {\n        uid:a.uid, label:a.label, anim:a.anim,\n        walkLabel: a.walk?'anhalten':'laufen',\n        measure: a.srcNote+' · Körper '+Math.round(a.srcBodyH)+' px → ×'+s.toFixed(2)+' = '+body+' px'\n          + (a.kind==='ts'?' · sizeRel '+(a.sizeRel||1).toFixed(2):''),\n        animOptions: a.order.map(k=>({key:k,\n          label: a.kind==='pb' ? a.anims[k].label\n               : a.kind==='ts' ? k+' · '+a.unit.anim(k).frames+' Bilder'\n               : '— · '+a.frames+' Bilder'})),\n        select: ()=>this.setState({sel:a.uid}),\n        remove: (e)=>{ if(e&&e.stopPropagation)e.stopPropagation();\n          this.acts = this.acts.filter(x=>x!==a); this.sync(this.state.sel===a.uid?null:this.state.sel); },\n        onAnim: (e)=>{ a.anim = e.target.value; a.frame = 0; a.t = 0; this.sync(a.uid); },\n        onFlip: (e)=>{ if(e&&e.stopPropagation)e.stopPropagation(); a.flip = !a.flip; this.sync(); },\n        onWalk: (e)=>{ if(e&&e.stopPropagation)e.stopPropagation(); a.walk = !a.walk;\n          if(a.walk && a.kind==='ts' && a.unit.has('run')){ a.anim='run'; }\n          if(a.walk && a.kind==='pb' && a.anims['2-Run']){ a.anim='2-Run'; }\n          this.sync(a.uid); }\n      };\n    });\n    return {\n      groups, actors, status:this.state.status, query:this.state.query,\n      actorCount: this.acts.length+(this.acts.length===1?' Figur':' Figuren'),\n      modeNote: (this.refMode()?'Maßstab HERO_REF '+HERO_REF:'Maßstab 1:1 (Quellpixel)')\n        + ' · Zoom '+this.zoom().toFixed(1)+'×',\n      onQuery: e=>this.setState({query:e.target.value}),\n      canvasRef: el=>{ this.canvas = el; },\n      stageRef: el=>{ this.stage = el; if(el&&this.ro) this.ro.observe(el); },\n      onDown: e=>{ const p=this.pt(e); const a=this.hit(p.x,p.y);\n        if(a){ this.drag={a,dx:a.x-p.x,dy:a.y-p.y}; this.setState({sel:a.uid});\n          e.currentTarget.setPointerCapture&&e.currentTarget.setPointerCapture(e.pointerId); }\n        else this.setState({sel:null}); },\n      onMove: e=>{ if(!this.drag) return; const p=this.pt(e);\n        this.drag.a.x = p.x+this.drag.dx; this.drag.a.y = p.y+this.drag.dy; },\n      onUp: ()=>{ this.drag = null; },\n      onRow: ()=>{ const W=this.cw||1000, H=this.ch||600;\n        const list=[...this.acts].sort((a,b)=>a.srcBodyH*this.scaleOf(a)-b.srcBodyH*this.scaleOf(b));\n        const gap=W/(list.length+1);\n        list.forEach((a,i)=>{ a.x=gap*(i+1); a.y=H*0.62; a.walk=false; });\n        this.acts=list; this.sync(); },\n      onSpread: ()=>{ const W=this.cw||1000, H=this.ch||600;\n        this.acts.forEach((a,i)=>{ a.x=90+(i%8)*Math.max(80,(W-200)/8); a.y=H*(0.42+0.12*Math.floor(i/8)); });\n        this.sync(); },\n      onClear: ()=>{ this.acts=[]; this.sync(null); }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
