<!-- v13 · 2026-08-12 · Fork von `KFB Overworld v12.dc.html` (Stand §4v, water-v2.0 · Glitzern aus ·

     v12 bleibt Vergleichsmaßstab (SUPERSEDED, nicht löschen). Die 39 Skriptpfade zeigen auf
     `./overworld-v13/`; die Module lösen ihre Nachbarn über die EIGENE Adresse auf, deshalb
     wandert `icons-rpg/` mit dem Ordner und keine Modulzeile ändert sich.
     Offen in Georgs Reihenfolge (unverändert aus v12): Ink-Outline als System · Gummiband greift
     zu früh (vor dem Bauen messen) · Linienstärken · Sprechblasen mit Level · sieben Einheiten
     ohne Porträt · Referenzen für Cartoon-Wasser (Georg recherchiert).

     ── Erbe aus v12 ──────────────────────────────────────────────────────────────────────────
     v12 · 2026-08-12 · Fork von `KFB Overworld v11.dc.html` (Stand §4u). Der Runner ist beim
     Fork NICHT angefasst; v11 bleibt als Vergleichsmaßstab stehen (SUPERSEDED, nicht löschen).
     Offene Slices in Georgs Reihenfolge: Wasser KISS · Ink-Outline als System · Gummiband ·
     Linienstärken · Sprechblasen mit Level · sieben Einheiten ohne Porträt.

     ── Erbe aus v11 ──────────────────────────────────────────────────────────────────────────
     v11 · 2026-08-11 · Fork von `KFB Overworld v10.dc.html` (WS0-Stand mit den drei Reparaturen:
     anim-clock 1.2 MIN_SLIP 7 · mob-ai Lauf-Hysterese 34/16 · Rücksprung auf Bild 0 raus).
     Neu in v11: `reach.js` — eine Reichweite für Held und Gegner (Block C1) und ein Nachlauf
     nach dem Schlag (Block C2). Beides in overworld-game-v10.js und mob-ai.js verdrahtet.

     RE-HOME WS0 · 2026-08-09 · Quelle: WS1-Export `overworld-v10-S5_2026-08-09`.
     EINZIGE Änderung gegenüber dem Export: die 39 Skriptpfade zeigen auf `./overworld-v12/`
     statt `./overworld/`, weil in WS0 unter `overworld/` noch die eingefrorene v8/v9-B-Linie
     liegt (KFB Overworld v8/v9-B.dc.html laden von dort und müssen bitgleich bleiben).
     Der Runner selbst ist NICHT angefasst. -->

<style>
/* v10-S3b · Blasenschrift »PottyMouth BB« (Blambot, von Georg gekauft — Live-Lizenz noch offen,
   intern zum Ansehen). Fällt sie aus, zeichnet mob-ai.js in Monospace weiter.
   v12-P1: die Schrift liegt im Repo und läuft über den CDN-Kanal (`kayfabizarro.pages.dev`), nicht
   mehr aus `overworld-v12/fonts/`. Eine @font-face-Regel kann `OW_SRC` nicht fragen — CSS läuft vor
   dem ersten Skript —, deshalb steht die Adresse hier ausgeschrieben. `?src=raw` schaltet die
   übrigen Kanäle um, die Schrift bleibt auf dem CDN; das ist der Preis dafür, dass sie sofort da
   ist statt nach dem ersten Skript. */
@font-face{font-family:"PottyMouth BB";src:url("https://kayfabizarro.pages.dev/overworld/overworld/fonts/pottymouthbb_reg.otf") format("opentype");font-display:swap}
html,body{margin:0;height:100%;overflow:hidden;background:#47aba9}
a{color:#0e3d3c}a:hover{color:#000}
</style>

      seed: this.props.seed ?? 7,
      heroUnit: this.props.heroUnit ?? 'random',
