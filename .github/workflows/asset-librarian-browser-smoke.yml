name: KFB Asset Librarian Browser Smoke

on:
  pull_request:
    paths:
      - "asset-librarian/**"
      - "tools/asset_registry/librarian/**"
      - "tools/asset_registry/tests/**"
      - "tools/asset_registry/consumer_profiles.json"
      - "registry/assets/v1/**"
      - "registry/resources/v1/**"
      - ".github/scripts/asset-librarian-browser-smoke.mjs"
      - ".github/scripts/asset-librarian-v1.3-resources-smoke.mjs"
      - ".github/scripts/asset-librarian-v1.4-live-rigs-smoke.mjs"
      - ".github/scripts/asset-librarian-v1.5-animation-framing-smoke.mjs"
      - ".github/scripts/asset-librarian-v1.6-town-workbench-smoke.mjs"
      - ".github/scripts/asset-librarian-v1.7-browse-filters-smoke.mjs"
      - ".github/workflows/asset-librarian-browser-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "asset-librarian/**"
      - "tools/asset_registry/librarian/**"
      - "tools/asset_registry/tests/**"
      - "tools/asset_registry/consumer_profiles.json"
      - "registry/assets/v1/**"
      - "registry/resources/v1/**"
      - ".github/scripts/asset-librarian-browser-smoke.mjs"
      - ".github/scripts/asset-librarian-v1.3-resources-smoke.mjs"
      - ".github/scripts/asset-librarian-v1.4-live-rigs-smoke.mjs"
      - ".github/scripts/asset-librarian-v1.5-animation-framing-smoke.mjs"
      - ".github/scripts/asset-librarian-v1.6-town-workbench-smoke.mjs"
      - ".github/scripts/asset-librarian-v1.7-browse-filters-smoke.mjs"
      - ".github/workflows/asset-librarian-browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kfb-asset-librarian-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Show runtime
        run: |
          node --version
          python3 --version
          command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser

      - name: Check browser modules and smoke syntax
        run: |
          node --check tools/asset_registry/librarian/app.js
          node --check tools/asset_registry/librarian/state.js
          node --check tools/asset_registry/librarian/registry.js
          node --check tools/asset_registry/librarian/search.js
          node --check tools/asset_registry/librarian/render.js
          node --check tools/asset_registry/librarian/asset-types.js
          node --check tools/asset_registry/librarian/resources-ui.js
          node --check tools/asset_registry/librarian/rig-preview.js
          node --check tools/asset_registry/librarian/animation-sources.js
          node --check tools/asset_registry/librarian/motion-preview.js
          node --check tools/asset_registry/librarian/related-assets.js
          node --check tools/asset_registry/librarian/town-workbench.js
          node --check tools/asset_registry/librarian/framing3d.js
          node --check tools/asset_registry/librarian/preview3d.js
          node --check .github/scripts/asset-librarian-v1.3-resources-smoke.mjs
          node --check .github/scripts/asset-librarian-v1.4-live-rigs-smoke.mjs
          node --check .github/scripts/asset-librarian-v1.5-animation-framing-smoke.mjs
          node --check .github/scripts/asset-librarian-v1.6-town-workbench-smoke.mjs
          node --check .github/scripts/asset-librarian-v1.7-browse-filters-smoke.mjs

      - name: Run existing Asset Librarian / WebGL regression smoke
        run: node .github/scripts/asset-librarian-browser-smoke.mjs

      - name: Run v1.3 production-resource smoke
        run: node .github/scripts/asset-librarian-v1.3-resources-smoke.mjs

      - name: Run v1.4 live-registry and rig-preview smoke
        run: node .github/scripts/asset-librarian-v1.4-live-rigs-smoke.mjs

      - name: Run v1.5 animation-discovery framing and permanent-URL smoke
        run: node .github/scripts/asset-librarian-v1.5-animation-framing-smoke.mjs

      - name: Run v1.6 Town workbench and on-character motion preview smoke
        run: node .github/scripts/asset-librarian-v1.6-town-workbench-smoke.mjs

      - name: Run v1.7 browse pagination and multiselect filter smoke
        run: node .github/scripts/asset-librarian-v1.7-browse-filters-smoke.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kfb-asset-librarian-browser-smoke
          path: artifacts/asset-librarian-smoke/
          if-no-files-found: warn
