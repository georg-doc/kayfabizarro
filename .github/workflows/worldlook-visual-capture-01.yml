name: WorldLook Visual Capture 01

on:
  push:
    branches:
      - chatgpt-web/worldlook-visual-capture-01-2026-10-03
    paths:
      - '.github/workflows/worldlook-visual-capture-01.yml'
      - 'tools/KFB-ToolBox/_handover/BILLBOARD_CONTEXT_WORLDLOOK_01_2026-10-02/**'
  pull_request:
    branches:
      - chatgpt-web/billboard-context-worldlook-01-2026-10-02
    paths:
      - '.github/workflows/worldlook-visual-capture-01.yml'
      - 'tools/KFB-ToolBox/_handover/BILLBOARD_CONTEXT_WORLDLOOK_01_2026-10-02/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framebuffer-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify frozen functional candidate
        shell: bash
        run: |
          set -euo pipefail
          R='tools/KFB-ToolBox/_handover/BILLBOARD_CONTEXT_R11_2026-10-02'
          test "$(git rev-parse HEAD:"$R/bb-worldlook-boot.js")" = "4b1c746674d0ad896a3ca6bbb2585dc37e77a1f7"
          test "$(git rev-parse HEAD:"$R/worldlook-travel.html")" = "37c858a34a195fa6463c926e99921ccf150fd8b8"
          test "$(git rev-parse HEAD:"$R/worldlook-context-adapter.js")" = "f4a47ba4b0d4ea36d541060d05da3a12d058118c"
          test "$(git rev-parse HEAD:"$R/worldlook-k2/clay-material.v10.js")" = "d994a9b656131be3b7a13d45edcb4253d34f3620"
          test "$(git rev-parse HEAD:"$R/worldlook-k2/clay-profiles.v2.js")" = "af57b88ae382a36514f9fa50beed5ab6ca18647a"
          test "$(git rev-parse HEAD:"$R/worldlook-k2/clay-relief.v2.js")" = "2bb843d29e9f2571f87d9e6210f34240b1a0a1a9"
          test "$(git rev-parse HEAD:"$R/worldlook-k2/clay-relief.v5.js")" = "1dfd171e08b14f996601189a7f2c108101f84132"
          test "$(git rev-parse HEAD:"$R/worldlook-k2/clay-toolmix.v1.js")" = "b9a039ccfb90ea04910db3cf05928817d92e9399"
          echo 'Frozen WorldLook candidate verified'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium

      - name: Capture framebuffer without stability wait
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/worldlook-visual-capture-01
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/worldlook-capture-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1

          cat > artifacts/worldlook-visual-capture-01/capture.mjs <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { chromium } from 'playwright';

          const url = 'http://127.0.0.1:4173/tools/KFB-ToolBox/_handover/BILLBOARD_CONTEXT_R11_2026-10-02/worldlook-travel.html?state=idle&packId=forget_utopia&card=7&worldLook=off';
          const report = {
            url,
            status: 'FAIL',
            checks: [],
            captures: [],
            pageErrors: [],
            consoleErrors: [],
            firstPartyFailures: [],
            externalNoise: []
          };
          const check = (name, pass, detail=null) => {
            report.checks.push({ name, pass: !!pass, detail });
            if (!pass) process.exitCode = 1;
          };

          const browser = await chromium.launch({
            headless: true,
            args: ['--use-angle=swiftshader', '--enable-unsafe-swiftshader']
          });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });

          page.on('pageerror', e => report.pageErrors.push(String(e)));
          page.on('console', m => {
            if (m.type() === 'error') report.consoleErrors.push(m.text());
          });
          page.on('requestfailed', req => {
            const item = { url: req.url(), error: req.failure()?.errorText || 'unknown' };
            if (req.url().startsWith('http://127.0.0.1:4173/')) report.firstPartyFailures.push(item);
            else report.externalNoise.push(item);
          });
          page.on('response', res => {
            if (res.status() < 400) return;
            const item = { url: res.url(), status: res.status() };
            if (res.url().startsWith('http://127.0.0.1:4173/')) report.firstPartyFailures.push(item);
            else report.externalNoise.push(item);
          });

          async function capture(name) {
            const frame = await page.evaluate(() => {
              const canvas = document.querySelector('body > canvas');
              if (!canvas) throw new Error('WebGL canvas missing');
              const probe = document.createElement('canvas');
              probe.width = 64;
              probe.height = 40;
              const p = probe.getContext('2d', { willReadFrequently: true });
              p.drawImage(canvas, 0, 0, probe.width, probe.height);
              const data = p.getImageData(0, 0, probe.width, probe.height).data;
              let r=0,g=0,b=0,a=0;
              for (let i=0;i<data.length;i+=4) {
                r+=data[i]; g+=data[i+1]; b+=data[i+2]; a+=data[i+3];
              }
              const n=data.length/4;
              return {
                width: canvas.width,
                height: canvas.height,
                png: canvas.toDataURL('image/png'),
                mean: {
                  r:+(r/n).toFixed(2),
                  g:+(g/n).toFixed(2),
                  b:+(b/n).toFixed(2),
                  a:+(a/n).toFixed(2)
                }
              };
            });
            const buf = Buffer.from(frame.png.split(',')[1], 'base64');
            const file = 'artifacts/worldlook-visual-capture-01/' + name + '.png';
            fs.writeFileSync(file, buf);
            const sha256 = crypto.createHash('sha256').update(buf).digest('hex');
            const rec = { name, file, bytes: buf.length, sha256, width: frame.width, height: frame.height, mean: frame.mean };
            report.captures.push(rec);
            check(name + ' PNG nontrivial', buf.length > 50000, rec);
            return rec;
          }

          try {
            const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 90000 });
            check('candidate HTTP', !!response && response.ok(), response?.status());

            await page.waitForFunction(() =>
              window.__consumer01?.snapshot?.()?.ready &&
              window.__worldlook01?.snapshot?.()?.ready &&
              window.__r11?.snapshot?.()?.ready,
              {}, { timeout: 150000 }
            );

            const source = await page.evaluate(() => ({
              consumer: window.__consumer01.snapshot(),
              worldlook: window.__worldlook01.snapshot(),
              r11: window.__r11.snapshot()
            }));
            check('source unadapted', source.r11.worldLook?.applied === false, source.r11.worldLook);
            check('source H13 live', source.r11.mode === 'hyper' && source.r11.h13?.ready, source.r11.h13);
            check('real Travel accent available', source.consumer.worldContext?.accent === '#ffb27a', source.consumer.worldContext);
            const sourceCap = await capture('01-source-front');

            const adapted = await page.evaluate(async () => {
              const c = window.__consumer01.snapshot();
              await window.__r11.setWorldLook({
                accent: c.worldContext.accent,
                seed: c.worldContext.seed
              });
              return window.__r11.snapshot();
            });
            await page.waitForTimeout(1200);

            check('K2 applied', adapted.worldLook?.applied === true, adapted.worldLook);
            check('accent exact', adapted.worldLook?.accent === '#ffb27a', adapted.worldLook);
            check('seed exact', adapted.worldLook?.seed === 1985738440, adapted.worldLook);
            check('body 4/4', adapted.worldLook?.bodyMeshes === 4 && adapted.worldLook?.clayMaterials === 4, adapted.worldLook);
            check('source materials preserved', adapted.worldLook?.sourceMaterialsPreserved === true, adapted.worldLook);
            check('geometry unchanged', adapted.worldLook?.geometryUnchanged === true, adapted.worldLook);
            check('content plane untouched', adapted.worldLook?.contentPlaneUntouched === true, adapted.worldLook);
            check('H13 still live', adapted.mode === 'hyper' && adapted.h13?.ready, adapted.h13);

            const frontCap = await capture('02-adapted-front');
            check('adapted front differs from source', frontCap.sha256 !== sourceCap.sha256, { source: sourceCap.sha256, adapted: frontCap.sha256 });

            await page.evaluate(() => window.__r11.setView('RIGHT34'));
            await page.waitForTimeout(500);
            const rightCap = await capture('03-adapted-right34');
            check('3/4 differs from front', rightCap.sha256 !== frontCap.sha256, { front: frontCap.sha256, right34: rightCap.sha256 });

            await page.evaluate(() => window.__r11.setView('BACK'));
            await page.waitForTimeout(500);
            const backCap = await capture('04-adapted-back');
            check('back differs from front', backCap.sha256 !== frontCap.sha256, { front: frontCap.sha256, back: backCap.sha256 });

            check('no page errors', report.pageErrors.length === 0, report.pageErrors);
            check('no first-party failures', report.firstPartyFailures.length === 0, report.firstPartyFailures);

            fs.writeFileSync(
              'artifacts/worldlook-visual-capture-01/worldlook-snapshot.json',
              JSON.stringify(adapted, null, 2) + '\n'
            );
          } catch (e) {
            report.pageErrors.push(String(e?.stack || e));
            process.exitCode = 1;
          } finally {
            report.status = process.exitCode ? 'FAIL' : 'PASS';
            report.passed = report.checks.filter(x => x.pass).length;
            report.total = report.checks.length;
            fs.writeFileSync(
              'artifacts/worldlook-visual-capture-01/report.json',
              JSON.stringify(report, null, 2) + '\n'
            );
            console.log(JSON.stringify({
              status: report.status,
              checks: report.passed + '/' + report.total,
              captures: report.captures.map(x => ({ name:x.name, bytes:x.bytes, sha256:x.sha256 })),
              pageErrors: report.pageErrors.length,
              firstPartyFailures: report.firstPartyFailures.length,
              externalNoise: report.externalNoise.length
            }, null, 2));
            await browser.close();
          }
          JS

          node artifacts/worldlook-visual-capture-01/capture.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worldlook-visual-capture-01
          path: artifacts/worldlook-visual-capture-01
          retention-days: 90
