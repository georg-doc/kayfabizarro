name: img2threejs TinySkies OSM public Stage v1
on:
  push:
    branches: [main]
    paths:
      - 'kfb-hub/stage/img2threejs/tinyskies-osm-cohesion-v1/**'
      - '.github/workflows/img2threejs-tinyskies-osm-stage-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kfb-hub/stage/img2threejs/tinyskies-osm-cohesion-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cloudflare Stage browser proof
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
          node kfb-hub/stage/img2threejs/tinyskies-osm-cohesion-v1/public-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tinyskies-osm-stage-v1-public-evidence
          path: tinyskies-osm-stage-evidence
          retention-days: 14
