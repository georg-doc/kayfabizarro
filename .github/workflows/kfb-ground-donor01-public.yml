name: GROUND-CONTROLLER-DONOR-01 public Stage proof
on:
  push:
    branches: [cloudflare-live]
    paths:
      - 'kfb-hub/stage/game-container/ground-controller-donor-01/**'
      - '.github/workflows/kfb-ground-donor01-public.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for exact Cloudflare revision
        shell: bash
        run: |
          URL='https://kayfabizarro.pages.dev/kfb-hub/stage/game-container/ground-controller-donor-01/DEPLOYMENT.json'
          WANT='ee1abb9fe6736fe4cf6926846f7d298f9d22b9e4'
          for i in {1..90}; do
            BODY="$(curl -fsS "$URL" 2>/dev/null || true)"
            if printf '%s' "$BODY" | grep -q "$WANT"; then
              printf '%s\n' "$BODY"
              exit 0
            fi
            sleep 4
          done
          echo "Exact Cloudflare revision did not appear"
          exit 1
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Public Chromium proof
        run: |
          mkdir -p ground-donor01-public-evidence
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          const STAGE='https://kayfabizarro.pages.dev/kfb-hub/stage/game-container/ground-controller-donor-01/?ground=1&groundFeel=velocity';
          const HUB='https://kayfabizarro.pages.dev/kfb-hub/';
          const WANT='ee1abb9fe6736fe4cf6926846f7d298f9d22b9e4';
          const checks=[];
          const ok=(name,cond,extra='')=>{checks.push({name,pass:!!cond,extra});if(!cond)throw new Error('FAIL '+name+(extra?' · '+extra:''));console.log('PASS',name,extra);};
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
          const key=async(type,code,k)=>page.evaluate(({type,code,k})=>window.dispatchEvent(new KeyboardEvent(type,{code,key:k,bubbles:true,cancelable:true})),{type,code,k});
          try{
            await page.goto(STAGE,{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(()=>window.__game?.state==='ground'&&window.__game?.world?.groundPlayer?.ready===true,null,{timeout:45000});
            const meta=await page.locator('meta[name="kfb-source-head"]').getAttribute('content');
            ok('exact runtime marker visible',meta===WANT,meta||'missing');
            const g0=await page.evaluate(()=>window.__game.world.groundPlayer.report());
            ok('velocity candidate active',g0.feelMode==='velocity'&&g0.enhanced===true,JSON.stringify({feel:g0.feelMode,enhanced:g0.enhanced}));
            ok('Running_B bound',g0.clips.includes('Running_B'),JSON.stringify(g0.clips));
            ok('directional source clips bound',g0.clips.includes('Walking_Backwards')&&g0.clips.includes('Running_Strafe_Left')&&g0.clips.includes('Running_Strafe_Right'));
            ok('actor-scale jump marker',g0.jump?.apex>1&&g0.jump?.apex<1.4,JSON.stringify(g0.jump));
            await key('keydown','KeyW','w'); await page.evaluate(()=>window.__game.advanceBy(.8));
            const walk=await page.evaluate(()=>window.__game.world.groundPlayer.report());
            ok('public Walk active',walk.currentAnimation==='Walking_A',walk.currentAnimation);
            await key('keydown','ShiftLeft','Shift'); await page.evaluate(()=>window.__game.advanceBy(.75));
            const sprint=await page.evaluate(()=>window.__game.world.groundPlayer.report());
            ok('public Sprint uses Running_B',sprint.currentAnimation==='Running_B'&&sprint.semantic==='sprint',JSON.stringify({a:sprint.currentAnimation,s:sprint.semantic,v:sprint.speed}));
            await key('keydown','Space',' '); await key('keyup','Space',' '); await page.evaluate(()=>window.__game.advanceBy(.36));
            const air=await page.evaluate(()=>window.__game.world.groundPlayer.report());
            ok('public Jump reaches air',air.onGround===false&&air.currentAnimation==='Jump_Idle',JSON.stringify({g:air.onGround,a:air.currentAnimation}));
            await page.evaluate(()=>window.__game.advanceBy(.7));
            const land=await page.evaluate(()=>window.__game.world.groundPlayer.report());
            ok('public Jump lands',land.onGround===true,JSON.stringify({g:land.onGround,a:land.currentAnimation}));
            await key('keyup','ShiftLeft','Shift'); await key('keyup','KeyW','w');
            ok('runtime errors empty',(await page.evaluate(()=>window.__game.errors())).length===0,JSON.stringify(await page.evaluate(()=>window.__game.errors())));
            ok('page errors empty',errors.length===0,JSON.stringify(errors));
            await page.screenshot({path:'ground-donor01-public-evidence/stage.png',fullPage:true});
            await page.goto(HUB,{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForLoadState('domcontentloaded');
            const link=page.locator('a[href*="ground-controller-donor-01"]').first();
            ok('Hub contains candidate link',await link.count()===1);
            const href=await link.getAttribute('href');
            ok('Hub link targets dedicated route',String(href||'').includes('/kfb-hub/stage/game-container/ground-controller-donor-01/'),href||'missing');
            await page.screenshot({path:'ground-donor01-public-evidence/hub.png',fullPage:true});
            await fs.writeFile('ground-donor01-public-evidence/report.json',JSON.stringify({stage:STAGE,hub:HUB,revision:WANT,checks,errors,testedAt:new Date().toISOString()},null,2));
            console.log('RESULT',checks.filter(c=>c.pass).length+'/'+checks.length,'PASS');
          }finally{await browser.close()}
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ground-donor01-public-evidence
          path: ground-donor01-public-evidence/
          retention-days: 30
