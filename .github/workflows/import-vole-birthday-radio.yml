name: One-shot import VOLE birthday radio

on:
  push:
    paths:
      - '.github/workflows/import-vole-birthday-radio.yml'

permissions:
  contents: write

jobs:
  import-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download six CC0 birthday tracks and write provenance
        shell: bash
        run: |
          set -euo pipefail
          DEST='media/3D_Assets/Audio/Music/Birthday Radio - VOLE CC0'
          mkdir -p "$DEST"

          base='https://media.vole.wtf/happy-birthday'
          for file in jazz-trio church-organ reggae drum-n-bass 8-bit death-metal; do
            curl --fail --location --retry 3 --retry-delay 2 \
              "$base/$file.mp3" -o "$DEST/$file.mp3"
            test -s "$DEST/$file.mp3"
          done

          python3 - <<'PY'
          import hashlib, json, pathlib
          dest = pathlib.Path('media/3D_Assets/Audio/Music/Birthday Radio - VOLE CC0')
          rows = [
              (1, 'Jazz Trio', 'jazz-trio.mp3'),
              (2, 'Church Organ', 'church-organ.mp3'),
              (3, 'Reggae', 'reggae.mp3'),
              (4, 'Drum’n’Bass', 'drum-n-bass.mp3'),
              (5, '8-bit', '8-bit.mp3'),
              (6, 'Death Metal', 'death-metal.mp3'),
          ]
          tracks=[]
          for face, style, name in rows:
              p=dest/name
              data=p.read_bytes()
              tracks.append({
                  'd6Face': face,
                  'style': style,
                  'file': name,
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'sourceUrl': f'https://media.vole.wtf/happy-birthday/{name}',
              })
          manifest={
              'schema':'kfb.audio-provenance.v1',
              'collection':'KFB Birthday Radio · VOLE CC0',
              'sourcePage':'https://vole.wtf/happy-birthday/',
              'creator':'Tom Kincaid',
              'publisher':'VOLE.wtf',
              'license':'CC0 1.0 / Public Domain Dedication',
              'licenseUrl':'https://creativecommons.org/publicdomain/zero/1.0/',
              'attributionRequired':False,
              'attributionSuggested':'Tom Kincaid · VOLE.wtf Happy Birthday collection',
              'usageNote':'Six selected recordings from VOLE’s 20-version Happy Birthday collection. D6 face mapping is a KFB presentation choice, not source metadata.',
              'tracks':tracks,
          }
          (dest/'MANIFEST.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          lines=[
              '# KFB Birthday Radio · VOLE CC0',
              '',
              'Six selected recordings from the VOLE.wtf “Happy Birthday To You” collection.',
              '',
              '- Source: https://vole.wtf/happy-birthday/',
              '- Audio creator: Tom Kincaid',
              '- License stated by source: CC0 / public domain; attribution not required, but appreciated.',
              '- KFB use: Birthday Radio candidate; one track per D6 face.',
              '',
              '| D6 | Style | File |',
              '|---:|---|---|',
          ]
          for face,style,name in rows:
              lines.append(f'| {face} | {style} | `{name}` |')
          lines += [
              '',
              'The D6 mapping is a KFB presentation decision. It does not alter the source recordings or their license.',
              'See `MANIFEST.json` for exact source URLs, byte sizes and SHA-256 hashes.',
              ''
          ]
          (dest/'README.md').write_text('\n'.join(lines),encoding='utf-8')
          PY

          echo 'Imported files:'
          ls -lh "$DEST"
          sha256sum "$DEST"/*.mp3

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KFB Asset Import Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add 'media/3D_Assets/Audio/Music/Birthday Radio - VOLE CC0'
          git commit -m 'assets: import VOLE CC0 birthday radio'
          git pull --rebase origin main
          git push origin HEAD:main
