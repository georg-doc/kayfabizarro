name: Travel TMB-1 Surf Cloudflare QA

on:
  push:
    branches: ['cloudflare-live']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium

      - name: Verify exact TMB-1 S33 Surf candidate
        run: |
          mkdir -p tmb1-surf-public-proof
          cat > tmb1-surf-public-proof/check.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const url='https://kayfabizarro.pages.dev/kfb-hub/stage/travel/travel-mode-bridge/tmb1/surf.html';
          const sourceUrl='https://kayfabizarro.pages.dev/kfb-hub/stage/travel/travel-mode-bridge/tmb1/SURF_SOURCE.json';
          const expectedRevision='TMB1-SURF-S33-01';
          const expectedTravelHead='2333c78fdaa1a1e2e14b697f2283abcbcacfe3dc';
          const expectedCarrier='2eef4db5aa38fffc8e9c23457815e3be12fc3bd8';
          const expectedActor='4785276defdb929cb397954eb74b76aecb84486b';
          const expectedArt='36da589c1227dc796097d71bd0fd30a539905b1f';
          const expectedPoseRig='a418fe550d66afea51dd95cf3229a13a343e1957';

          const report={url,sourceUrl,checks:[],errors:[],httpErrors:[]};
          const check=(name,pass,detail=null)=>{
            report.checks.push({name,pass:!!pass,detail});
            if(!pass) process.exitCode=1;
          };
          const near=(a,b,eps=1e-6)=>Number.isFinite(Number(a))&&Math.abs(Number(a)-Number(b))<=eps;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));

          const browser=await chromium.launch({
            headless:true,
            args:['--use-angle=swiftshader','--enable-unsafe-swiftshader','--enable-webgl','--ignore-gpu-blocklist']
          });
          const page=await browser.newPage({viewport:{width:1440,height:920},deviceScaleFactor:1});
          page.on('pageerror',e=>report.errors.push('pageerror: '+String(e)));
          page.on('console',m=>{if(m.type()==='error'&&!/favicon/i.test(m.text()))report.errors.push('console: '+m.text())});
          page.on('response',r=>{if(r.status()>=400&&!/favicon/i.test(r.url()))report.httpErrors.push({status:r.status(),url:r.url()})});
          page.on('requestfailed',r=>report.httpErrors.push({status:0,url:r.url(),error:r.failure()?.errorText}));

          try{
            let marker=null,last=null;
            for(let i=0;i<80;i++){
              try{
                const r=await page.request.get(sourceUrl+'?proof='+Date.now(),{timeout:15000});
                const text=await r.text();
                let j=null;try{j=JSON.parse(text)}catch{}
                last={
                  status:r.status(),
                  revision:j?.revision||null,
                  travelHead:j?.travel?.head||null,
                  poseRig:j?.sources?.poseRig?.blob||null
                };
                if(r.ok() &&
                   j?.revision===expectedRevision &&
                   j?.travel?.head===expectedTravelHead &&
                   j?.sources?.poseRig?.blob===expectedPoseRig){
                  marker=j;break;
                }
              }catch(e){last={error:String(e)}}
              await sleep(3000);
            }
            check('deployed SURF_SOURCE marker',!!marker,last);
            if(!marker) throw Error('Surf Stage marker timeout '+JSON.stringify(last));
            report.marker=marker;

            check('marker carrier',marker.sources?.carrier?.blob===expectedCarrier,marker.sources?.carrier);
            check('marker actor',marker.sources?.actor?.blob===expectedActor,marker.sources?.actor);
            check('marker art',marker.sources?.cardArtwork?.blob===expectedArt,marker.sources?.cardArtwork);
            check('marker exact PoseRig donor',marker.sources?.poseRig?.blob===expectedPoseRig,marker.sources?.poseRig);
            check('marker Surf hip',marker.surfPreset?.hip===16,marker.surfPreset);
            check('marker Surf knee',marker.surfPreset?.knee===30,marker.surfPreset);
            check('marker Surf spread',marker.surfPreset?.spread===17,marker.surfPreset);
            check('marker Surf lean',marker.surfPreset?.lean===7,marker.surfPreset);
            check('marker Surf stagger',marker.surfPreset?.stagger===24,marker.surfPreset);
            check('marker Surf hands',marker.surfPreset?.hands==='surf',marker.surfPreset);
            check('marker no transition',marker.transitionImplemented===false,marker.transitionImplemented);

            const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
            check('Stage HTTP',!!response&&response.ok(),response?.status());
            check('Stage title',await page.title()==='KFB Travel Mode Bridge · TMB-1 · Surf Presentation Candidate',await page.title());

            await page.waitForFunction(
              ()=>window.__TMB1_SURF_PROOF__?.sourceObjectVisible===true || (window.__TMB1_SURF_PROOF__?.runtimeErrors||[]).length>0,
              null,{timeout:120000}
            );
            await page.waitForTimeout(1200);

            const snap=await page.evaluate(()=>({
              proof:window.__TMB1_SURF_PROOF__,
              stateText:document.querySelector('#proof-state')?.textContent||'',
              canvas:{width:document.querySelector('#view')?.width||0,height:document.querySelector('#view')?.height||0}
            }));
            report.snap=snap;
            const p=snap.proof;
            const pr=p?.poseRig?.report;

            check('Surf candidate visible',p?.sourceObjectVisible===true,p);
            check('runtime phase',p?.phase==='SURF_PRESENTATION_CANDIDATE',p?.phase);
            check('runtime exact carrier',p?.sources?.carrier?.blob===expectedCarrier,p?.sources?.carrier);
            check('runtime exact actor',p?.sources?.actor?.blob===expectedActor,p?.sources?.actor);
            check('runtime exact PoseRig',p?.sources?.poseRig?.blob===expectedPoseRig,p?.sources?.poseRig);

            check('PoseRig build OK',p?.poseRig?.build?.status==='OK',p?.poseRig?.build);
            check('PoseRig report OK',pr?.status==='OK',pr);
            check('PoseRig preset surf',pr?.preset==='surf',pr?.preset);
            check('PoseRig enabled',pr?.on===true,pr?.on);
            check('PoseRig knee wanted 30',pr?.kneeWanted===30,pr?.kneeWanted);
            check('PoseRig hip wanted 16',pr?.hipWanted===16,pr?.hipWanted);
            check('PoseRig knee measured finite',Number.isFinite(Number(pr?.kneeMeasured)),pr?.kneeMeasured);
            check('PoseRig knee delta finite',Number.isFinite(Number(pr?.kneeDelta)),pr?.kneeDelta);
            check('PoseRig left hand target finite',Number.isFinite(Number(pr?.hands?.L?.miss)),pr?.hands?.L);
            check('PoseRig right hand target finite',Number.isFinite(Number(pr?.hands?.R?.miss)),pr?.hands?.R);

            check('foot bones found',Array.isArray(p?.measurement?.footBoneNames)&&p.measurement.footBoneNames.length>0,p?.measurement?.footBoneNames);
            check('posed foot vertices measured',Number(p?.measurement?.footPoints)>0,p?.measurement?.footPoints);
            check('Surf footprint inside card',p?.measurement?.insideCard===true,p?.measurement);
            check('Surf footprint radius positive',Number(p?.measurement?.footprintRadius)>0,p?.measurement?.footprintRadius);
            check('Surf stagger measured',Number.isFinite(Number(p?.measurement?.staggerZ))&&Math.abs(Number(p.measurement.staggerZ))>0.01,p?.measurement?.staggerZ);
            check('Surf lateral gap positive',Number(p?.measurement?.lateralGap)>0.01,p?.measurement?.lateralGap);

            check('actor scale retained',near(p?.mount?.actorScale,0.3789375002829705,1e-12),p?.mount?.actorScale);
            check('Ground-equivalent world height retained',near(p?.mount?.actorEquivalentWorldHeight,0.022,1e-9),p?.mount?.actorEquivalentWorldHeight);
            check('seat footprint remeasured',near(p?.mount?.seatFootprint,p?.measurement?.footprintRadius,1e-6),{seat:p?.mount?.seatFootprint,r:p?.measurement?.footprintRadius});
            check('seat lift remeasured',near(p?.mount?.seatLift,-Number(p?.measurement?.contactLowestY),1e-6),{lift:p?.mount?.seatLift,lowest:p?.measurement?.contactLowestY});
            check('yaw 180 retained',p?.mount?.mountYawDegrees===180,p?.mount?.mountYawDegrees);
            check('parented under carrier seat',p?.mount?.parentedUnderCarrierSeat===true,p?.mount?.parentedUnderCarrierSeat);
            check('clip owner CardCarrier',p?.mount?.clipOwner==='card-carrier',p?.mount?.clipOwner);

            check('Surf pose flag true',p?.runtime?.surfPoseApplied===true,p?.runtime?.surfPoseApplied);
            check('no AnimationMixer',p?.runtime?.animationMixerCreated===false,p?.runtime?.animationMixerCreated);
            check('no root motion',p?.runtime?.rootMotionApplied===false,p?.runtime?.rootMotionApplied);
            check('no movement owner',p?.runtime?.movementOwnerCreated===false,p?.runtime?.movementOwnerCreated);
            check('no transition',p?.runtime?.transitionImplemented===false,p?.runtime?.transitionImplemented);
            check('visible S33 marker',/S33 SURF/.test(snap.stateText),snap.stateText);
            check('canvas sized',snap.canvas.width>0&&snap.canvas.height>0,snap.canvas);
            check('no runtime errors',(p?.runtimeErrors||[]).length===0,p?.runtimeErrors);
            check('no page errors',report.errors.length===0,report.errors);
            check('no failed HTTP assets',report.httpErrors.length===0,report.httpErrors);

            await page.screenshot({path:'tmb1-surf-public-proof/01-s33-surf-candidate.png',fullPage:true});
          }catch(e){
            report.errors.push(String(e?.stack||e));
            process.exitCode=1;
          }finally{
            report.status=process.exitCode?'FAIL':'PASS';
            fs.writeFileSync('tmb1-surf-public-proof/report.json',JSON.stringify(report,null,2)+'\n');
            console.log(JSON.stringify({
              status:report.status,
              pass:report.checks.filter(x=>x.pass).length,
              total:report.checks.length,
              errors:report.errors.length,
              httpErrors:report.httpErrors.length,
              kneeDelta:report.snap?.proof?.poseRig?.report?.kneeDelta ?? null,
              staggerZ:report.snap?.proof?.measurement?.staggerZ ?? null,
              lateralGap:report.snap?.proof?.measurement?.lateralGap ?? null,
              footprintRadius:report.snap?.proof?.measurement?.footprintRadius ?? null
            },null,2));
            await browser.close();
          }
          JS
          node tmb1-surf-public-proof/check.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: travel-tmb1-s33-surf-cloudflare-proof
          path: tmb1-surf-public-proof
          retention-days: 90
