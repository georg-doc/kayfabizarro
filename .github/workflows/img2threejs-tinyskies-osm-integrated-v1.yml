name: img2threejs TinySkies OSM integrated proof v1
on:
  pull_request:
    paths:
      - 'tools/img2threejs/landmarks/pilot-08/**'
      - 'tools/img2threejs/tests/check_tinyskies_osm_integrated_v1.mjs'
      - '.github/workflows/img2threejs-tinyskies-osm-integrated-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static/source proof
        run: node tools/img2threejs/tests/check_tinyskies_osm_integrated_v1.mjs
      - name: Install browser
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/kfb-http.log 2>&1 &
          echo $! > /tmp/kfb-http.pid
          sleep 2
      - name: Browser screenshots
        run: node tools/img2threejs/landmarks/pilot-08/browser-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tinyskies-osm-integrated-v1-evidence
          path: |
            tinyskies-osm-integrated-evidence
            tools/img2threejs/evidence/2026-09-19-tinyskies-osm-integrated-v1
          retention-days: 14
