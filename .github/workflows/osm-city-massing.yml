name: OSM City S1c presentation proof

on:
  push:
    branches:
      - osm-city/s1c-road-labels-grotesque-forest-2026-09-18
      - main
    paths:
      - 'tools/osm-city-lab/index.html'
      - 'tools/osm-city-lab/src/viewer/**'
      - 'tools/osm-city-lab/src/style/**'
      - 'tools/osm-city-lab/styles/**'
      - 'tools/osm-city-lab/qa/massing-local.mjs'
      - 'media/3D_Assets/KayKit_Forest_Nature_Pack_1.0_FREE/Assets/gltf/**'
      - '.github/workflows/osm-city-massing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/osm-city-lab
            media/3D_Assets/KayKit_Forest_Nature_Pack_1.0_FREE/Assets/gltf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Verify roads, clean/cartoon/grotesque, OSM signs and KayKit forest POC
        run: node tools/osm-city-lab/qa/massing-local.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osm-city-s1c-presentation-proof
          path: osm-city-massing-evidence
          retention-days: 30
