name: WORLD-ZONE-BAKE-01
on:
  push:
    branches:
      - chatgpt-web/world-zone-bake-01-cologne-2026-09-24
  pull_request:
    branches: [main]
    paths:
      - 'tools/osm-city-lab/src/world-zone/**'
      - 'tools/osm-city-lab/scripts/build-world-zone.mjs'
      - 'tools/osm-city-lab/tests/world-zone-bake-01.mjs'
      - 'tools/KFB-ToolBox/worldbuilder/world-zone-bake-01/**'
      - '.github/workflows/world-zone-bake-01.yml'
permissions:
  contents: write
jobs:
  compile-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KFB_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify cached raw source and deterministic normalization
        shell: bash
        run: |
          set -euo pipefail
          RAW='tools/osm-city-lab/data/dom-zentrum-v0/source.overpass.json'
          NORM='tools/osm-city-lab/data/dom-zentrum-v0/normalized.json'
          test "$(sha256sum "$RAW" | cut -d' ' -f1)" = '5a7d32efe5c83711d189c501d6d93af3b81ecfcea8770ba9592cc9a066b91e7a'
          test "$(jq -r .sourceSha256 tools/osm-city-lab/data/dom-zentrum-v0/PROVENANCE.json)" = '8ab058da444eee7bd54c367aec770bbe10c4bef2ddda636cd95b886f5dca244c'
          node tools/osm-city-lab/scripts/build-city.mjs dom-zentrum-v0
          test "$(sha256sum "$NORM" | cut -d' ' -f1)" = '4fced62a95499aaba0bfbd111da41db8222ef6f507a330f55e1f033b41bb8702'
      - name: Compile twice
        run: |
          node tools/osm-city-lab/scripts/build-world-zone.mjs dom-zentrum-v0 2026-09-24.1 --out-root /tmp/world-zone-a
          node tools/osm-city-lab/scripts/build-world-zone.mjs dom-zentrum-v0 2026-09-24.1 --out-root /tmp/world-zone-b
      - name: Contract + determinism tests
        shell: bash
        run: |
          set -euo pipefail
          node tools/osm-city-lab/tests/world-zone-bake-01.mjs /tmp/world-zone-a/cologne-dom-zentrum-v0/2026-09-24.1 /tmp/world-zone-b/cologne-dom-zentrum-v0/2026-09-24.1 | tee /tmp/WORLD_ZONE_BAKE_01_TEST_REPORT.json
      - name: Build canonical package for review artifact
        run: node tools/osm-city-lab/scripts/build-world-zone.mjs dom-zentrum-v0 2026-09-24.1
      - name: Assemble evidence
        shell: bash
        run: |
          cp /tmp/WORLD_ZONE_BAKE_01_TEST_REPORT.json tools/osm-city-lab/world-zones/cologne-dom-zentrum-v0/2026-09-24.1/TEST_REPORT.json
          sha256sum tools/osm-city-lab/world-zones/cologne-dom-zentrum-v0/2026-09-24.1/* > tools/osm-city-lab/world-zones/cologne-dom-zentrum-v0/2026-09-24.1/SHA256SUMS.txt
      - name: Commit tested baked package
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/osm-city-lab/world-zones/cologne-dom-zentrum-v0/2026-09-24.1
          git diff --cached --quiet && exit 0
          git commit -m "WORLD-ZONE-BAKE-01: bake Cologne world zone package"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: world-zone-bake-01-cologne
          if-no-files-found: error
          retention-days: 14
          path: |
            tools/osm-city-lab/world-zones/cologne-dom-zentrum-v0/2026-09-24.1/
            tools/KFB-ToolBox/worldbuilder/world-zone-bake-01/
