name: ENV-PREVIEW-01 contract

on:
  push:
    branches:
      - chatgpt-web/env-preview-01-2026-09-25
  pull_request:
    paths:
      - 'tools/KFB-ToolBox/lib/environment-preview.v1.js'
      - 'tools/KFB-ToolBox/_inbox/KFB_Resident_Atlas_S9/S40-disco-rotation/**'
      - 'tools/KFB-ToolBox/_inbox/KFB ToolBox Production-01/KFB_TOOLBOX_CLAUDE_DESIGN_SESSION_CUT_2026-09-25_r1/**'
      - 'tools/KFB-ToolBox/tests/env_preview_01_contract_test.mjs'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax · shared adapter
        run: node --check tools/KFB-ToolBox/lib/environment-preview.v1.js
      - name: Syntax · Resident Atlas adapter
        run: node --check "tools/KFB-ToolBox/_inbox/KFB_Resident_Atlas_S9/S40-disco-rotation/lib/host-env.js"
      - name: Contract · owner and consumer seams
        run: node tools/KFB-ToolBox/tests/env_preview_01_contract_test.mjs
