name: HUD Racer v2 Stage public proof
on:
  push:
    branches: [main]
    paths:
      - 'kfb-hub/stage/stunt-world/hud-racer-v2/**'
      - 'kfb-hub/index.html'
      - '.github/workflows/hud-racer-v2-stage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kfb-hub/stage/stunt-world/hud-racer-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cloudflare Stage proof
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
          node kfb-hub/stage/stunt-world/hud-racer-v2/public-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hud-racer-v2-stage-evidence
          path: hud-racer-v2-stage-evidence
          retention-days: 14
