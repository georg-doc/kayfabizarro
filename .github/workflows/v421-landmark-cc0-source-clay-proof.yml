name: V421 CC0 landmark source and clay proof
on:
  push:
    branches:
      - research/v421-landmark-source-clay-proof-2026-10-17
    paths:
      - .github/workflows/v421-landmark-cc0-source-clay-proof.yml
      - tools/KFB-ToolBox/_inbox/KFB_HUB/30_DECISIONS/replies/V421_SOURCE_PROOF/cc0_clay_proof.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-and-clay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      V421_PROOF_DIR: v421-proof
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            tools/KFB-ToolBox/_inbox/KFB_HUB/30_DECISIONS/replies/V421_SOURCE_PROOF/cc0_clay_proof.py
          sparse-checkout-cone-mode: false
      - name: Compile safe source-audit script
        run: python3 -m py_compile tools/KFB-ToolBox/_inbox/KFB_HUB/30_DECISIONS/replies/V421_SOURCE_PROOF/cc0_clay_proof.py
      - name: Install native Blender (headless, not a KFB runtime)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy
          blender -b --version | head -3
      - name: Get original CC0 archives and archive/source hashes
        id: download
        continue-on-error: true
        run: python3 tools/KFB-ToolBox/_inbox/KFB_HUB/30_DECISIONS/replies/V421_SOURCE_PROOF/cc0_clay_proof.py fetch
      - name: Render isolated ORIGINAL and CLAY from original source meshes
        id: render
        continue-on-error: true
        if: steps.download.outcome == 'success'
        run: blender -b --factory-startup --disable-autoexec --python tools/KFB-ToolBox/_inbox/KFB_HUB/30_DECISIONS/replies/V421_SOURCE_PROOF/cc0_clay_proof.py -- render
      - name: Checkpoint isolated CC0 proof images in research branch
        id: checkpoint
        if: steps.download.outcome == 'success' && steps.render.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json, pathlib, hashlib, shutil
          folder=pathlib.Path('v421-proof')
          data=json.loads((folder/'final-audit.json').read_text())
          assert data['passed']>=2, 'Require baseline two actual CC0 geometry previews; new source may remain separately blocked'
          root=pathlib.Path('tools/KFB-ToolBox/_inbox/KFB_HUB/30_DECISIONS/replies/V421_SOURCE_PROOF/evidence')
          root.mkdir(parents=True,exist_ok=True)
          manifest={'schema':'kfb.landmark.source-isolation/1','run':'GitHub Actions CI source proof','selectionReady':False,'sources':[]}
          for src in data['sources']:
              assert src['license']=='CC0-1.0'
              if src['state']!='SOURCE_ISOLATED_AND_CLAY_RENDERED':
                  print('SOURCE NOT RENDERED, HELD:',src['id'],src['state'],src.get('error',src.get('renderError','')))
                  continue
              source_dir=folder/src['id']
              dest=root/src['id'];dest.mkdir(exist_ok=True)
              for name,digest in [('source-isolation.png','sourceImageSha256'),('clay-preview.png','clayImageSha256')]:
                  p=source_dir/name
                  assert p.exists() and hashlib.sha256(p.read_bytes()).hexdigest()==src[digest]
                  shutil.copyfile(p,dest/name)
              manifest['sources'].append({k:src[k] for k in ['id','source_page','creator','license','kind','archiveSha256','selectedRelativeFile','selectedSourceSha256','meshCount','trianglesMeasured','facePolygonsMeasured','sourceImageSha256','clayImageSha256']})
          (root/'MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print('CHECKPOINT SOURCE MESH PROOFS',len(manifest['sources']))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse tools/KFB-ToolBox/_inbox/KFB_HUB/30_DECISIONS/replies/V421_SOURCE_PROOF/evidence/
          if ! git diff --cached --quiet; then
            git commit -m 'evidence(V-421): source-isolated CC0 originals and clay images'
            git push origin HEAD:refs/heads/research/v421-landmark-source-clay-proof-2026-10-17
          else
            echo 'No new source evidence, previous manifest retained'
          fi
      - name: Publish audit evidence for agent-only source QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v421-real-mesh-cc0-clay-proofs
          path: v421-proof/
          retention-days: 14
          if-no-files-found: warn
      - name: Fail closed unless real geometry was rendered
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('v421-proof/final-audit.json')
          if not p.exists():
              raise SystemExit('BLOCKED: no final mesh audit and no clay rendering proof')
          j=json.loads(p.read_text())
          assert j['passed']>=2, 'BLOCKED: baseline two actual source mesh proofs must remain valid'
          assert j['readyForGeorg'] is False
          for record in j['sources']:
              if record['state']=='SOURCE_ISOLATED_AND_CLAY_RENDERED':
                  folder=Path('v421-proof')/record['id']
                  assert (folder/'source-isolation.png').stat().st_size>1024
                  assert (folder/'clay-preview.png').stat().st_size>1024
                  assert record['trianglesMeasured']>0
                  print(record['id'],record['trianglesMeasured'],record['sourceImageSha256'],record['clayImageSha256'])
          print('RESEARCH PREVIEW SOURCE PROOF PASS; GEORG SELECTION STILL BLOCKED')
          PY
