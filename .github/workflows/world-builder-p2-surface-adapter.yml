name: WorldBuilder WB1-P2 Surface Adapter static proof
on:
  push:
    branches:
      - 'chatgpt-web/world-builder-p2-surface-adapter-2026-09-23'
    paths:
      - 'tools/KFB-ToolBox/world-building-preflight/surface-adapter/**'
      - '.github/workflows/world-builder-p2-surface-adapter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic Surface Adapter contract
        run: |
          cd tools/KFB-ToolBox/world-building-preflight/surface-adapter
          node test/surface-core.test.mjs
          node --check surface-core.mjs
          node --check recipe.mjs
          node --check demo.mjs
