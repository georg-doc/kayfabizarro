name: ToolBox KayKit Ranged Calibration proof
on:
  push:
    branches:
      - 'chatgpt-web/ca2-02-ranged-calibration-2026-09-20'
    paths:
      - 'kfb-hub/stage/toolbox/kaykit-ranged-calibration-v1/index.html'
      - 'kfb-hub/stage/toolbox/kaykit-ranged-calibration-v1/lab.mjs'
      - 'kfb-hub/stage/toolbox/kaykit-ranged-calibration-v1/proof.mjs'
      - '.github/workflows/toolbox-kaykit-ranged-calibration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  branch-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static syntax and JSON
        run: |
          node --check kfb-hub/stage/toolbox/kaykit-ranged-calibration-v1/lab.mjs
          node --check kfb-hub/stage/toolbox/kaykit-ranged-calibration-v1/proof.mjs
          node -e "JSON.parse(require('fs').readFileSync('kfb-hub/stage/toolbox/kaykit-ranged-calibration-v1/SOURCE.json','utf8'));console.log('JSON PASS')"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Serve exact branch
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/krc-http.log 2>&1 &
          echo $! >/tmp/krc-http.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/kfb-hub/stage/toolbox/kaykit-ranged-calibration-v1/SOURCE.json >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/krc-http.log
          exit 1
      - name: Browser proof
        env:
          KRC_BASE_URL: http://127.0.0.1:4173/kfb-hub/stage/toolbox/kaykit-ranged-calibration-v1/
          KRC_SOURCE_HEAD: 155becf16a467f125ee44958b2f2a295dbe27cd0
          KRC_PROOF_DIR: kaykit-ranged-calibration-evidence
        run: node kfb-hub/stage/toolbox/kaykit-ranged-calibration-v1/proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaykit-ranged-calibration-evidence
          path: kaykit-ranged-calibration-evidence
          retention-days: 14

  public-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Wait for exact Cloudflare candidate
        env:
          KRC_PUBLIC_BASE: https://kayfabizarro.pages.dev/kfb-hub/stage/toolbox/kaykit-ranged-calibration-v1/
          KRC_SOURCE_HEAD: 155becf16a467f125ee44958b2f2a295dbe27cd0
        run: |
          node <<'NODE'
          const base=process.env.KRC_PUBLIC_BASE;
          const expected=process.env.KRC_SOURCE_HEAD;
          let last=null;
          for(let i=0;i<120;i++){
            try{
              const r=await fetch(base+'SOURCE.json?proof='+Date.now(),{cache:'no-store'});
              const t=await r.text();
              let j=null;try{j=JSON.parse(t)}catch{}
              last={status:r.status,head:j?.implementationHead||null,preview:t.slice(0,100)};
              if(r.ok&&j?.implementationHead===expected){
                console.log('PUBLIC MARKER PASS',base,expected);
                process.exit(0);
              }
            }catch(e){last={error:String(e)}}
            await new Promise(r=>setTimeout(r,3000));
          }
          console.error('PUBLIC MARKER FAIL',JSON.stringify(last));
          process.exit(1);
          NODE
      - name: Verify public Hub and Stage navigation
        run: |
          node <<'NODE'
          const hub=await fetch('https://kayfabizarro.pages.dev/kfb-hub/?proof='+Date.now(),{cache:'no-store'}).then(r=>r.text());
          const stage=await fetch('https://kayfabizarro.pages.dev/kfb-hub/stage/?proof='+Date.now(),{cache:'no-store'}).then(r=>r.text());
          if(!hub.includes('kaykit-ranged-calibration-v1')) throw Error('KFB Hub missing CA2-02 route');
          if(!stage.includes('./toolbox/kaykit-ranged-calibration-v1/')) throw Error('Stage navigator missing CA2-02 route');
          console.log('PUBLIC NAV PASS');
          NODE
      - name: Exact public browser proof
        env:
          KRC_BASE_URL: https://kayfabizarro.pages.dev/kfb-hub/stage/toolbox/kaykit-ranged-calibration-v1/
          KRC_SOURCE_HEAD: 155becf16a467f125ee44958b2f2a295dbe27cd0
          KRC_PROOF_DIR: kaykit-ranged-calibration-public-evidence
        run: node kfb-hub/stage/toolbox/kaykit-ranged-calibration-v1/proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaykit-ranged-calibration-public-evidence
          path: kaykit-ranged-calibration-public-evidence
          retention-days: 14
