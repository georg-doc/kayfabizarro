name: KFB Production Resource Registry R0.1

on:
  push:
    branches:
      - main
    paths:
      - 'tools/resource_registry/**'
      - 'tools/KFB-ToolBox/**'
      - 'media/3D_Assets/kfb-pets.json'
      - 'registry/assets/v1/**'
      - '.github/workflows/resource-registry.yml'
      - '!registry/resources/v1/**'
  pull_request:
    paths:
      - 'tools/resource_registry/**'
      - 'tools/KFB-ToolBox/**'
      - 'media/3D_Assets/kfb-pets.json'
      - 'registry/assets/v1/**'
      - '.github/workflows/resource-registry.yml'
      - '!registry/resources/v1/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: kfb-resource-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build Resource Registry R0.1
        run: python3 tools/resource_registry/r01.py build

      - name: Validate Resource Registry R0.1
        run: python3 tools/resource_registry/r01.py validate

      - name: Run R0 and R0.1 tests
        run: python3 -m unittest tools/resource_registry/test_resource_registry.py tools/resource_registry/test_r01.py -v

      - name: Smoke query
        run: |
          mkdir -p artifacts
          python3 tools/resource_registry/query.py --motions frizzlebob-driver-graft --limit 3
          python3 tools/resource_registry/query.py --compose frizzlebob-driver-graft > artifacts/composition-plan.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('registry/resources/v1/motions.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          assert any(r['resourceId']=='motion:kfb-pets/semantic/kayfabulate' for r in rows)
          assert any(r['resourceId']=='motion:kfb-pets/procedural/hop' for r in rows)
          fx=[json.loads(x) for x in Path('registry/resources/v1/fx.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          assert any(r['resourceId']=='fx:kfb-pets/eye/spiral' for r in fx)
          assert any(r['resourceId']=='fx:kfb-pets/trigger/dust' for r in fx)
          print('R0.1 custom motion / FX smoke OK')
          PY

      - name: Upload review evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: kfb-resource-registry-r0-1
          path: |
            registry/resources/v1/
            artifacts/composition-plan.json

      - name: Detect generated resource diff
        id: resource_diff
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- registry/resources/v1)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update reviewable resource bot branch
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          steps.resource_diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_BRANCH: bot/resource-registry-update
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          tmpdir="$(mktemp -d)"
          mkdir -p "$tmpdir/registry/resources"
          cp -a registry/resources/v1 "$tmpdir/registry/resources/v1"

          git reset --hard HEAD
          git clean -fd -- registry/resources/v1
          git switch -C "$BOT_BRANCH"

          rm -rf registry/resources/v1
          mkdir -p registry/resources
          cp -a "$tmpdir/registry/resources/v1" registry/resources/v1

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/resources/v1
          git commit -m "chore: refresh KFB Production Resource Registry"
          git push --force origin "HEAD:$BOT_BRANCH"

          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          ## KFB Production Resource Registry refresh

          Generated from source commit \`$SOURCE_SHA\` by the **KFB Production Resource Registry R0.1** workflow.

          Review especially:

          - \`registry/resources/v1/manifest.json\`
          - \`registry/resources/v1/actors.jsonl\`
          - \`registry/resources/v1/configs.jsonl\`
          - \`registry/resources/v1/motions.jsonl\`
          - \`registry/resources/v1/fx.jsonl\`
          - \`registry/resources/v1/compositions.jsonl\`

          R0.1 preserves the source contract's distinction between procedural motion definitions, embedded clips and semantic animation triggers. Configured custom motions/FX do not imply executable compatibility; their owner runtime remains authoritative.

          This workflow-owned branch never writes generated resource output directly to \`main\`.
          EOF

          pr_number="$(gh pr list --head "$BOT_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            if ! gh pr create --head "$BOT_BRANCH" --base main --title "chore: refresh KFB Production Resource Registry" --body-file "$body_file"; then
              echo "::warning::Bot branch was published, but repository policy blocked automatic PR creation. Open the PR manually from $BOT_BRANCH."
            fi
          else
            gh pr edit "$pr_number" --title "chore: refresh KFB Production Resource Registry" --body-file "$body_file" || true
          fi
