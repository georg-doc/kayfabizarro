name: KFB World Corridor Source Parity + Boot

on:
  pull_request:
    paths:
      - "tools/KFB-ToolBox/worldbuilder/world-corridor-01/**"
      - ".github/scripts/world-corridor-wc1-baseline-smoke.mjs"
      - ".github/workflows/world-corridor-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wc1-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show runtime
        run: |
          node --version
          python3 --version
          command -v google-chrome-stable || command -v google-chrome || command -v chromium

      - name: Check local baseline helpers
        run: |
          node --check tools/KFB-ToolBox/worldbuilder/world-corridor-01/performance-probe.js
          node --check tools/KFB-ToolBox/worldbuilder/world-corridor-01/local-static-server.mjs
          node --check .github/scripts/world-corridor-wc1-baseline-smoke.mjs
          bash -n tools/KFB-ToolBox/worldbuilder/world-corridor-01/run-local-gpu-baseline.sh

      - name: Upload local GPU baseline pack
        uses: actions/upload-artifact@v6
        with:
          name: kfb-world-corridor-wc1-local-gpu-baseline
          path: tools/KFB-ToolBox/worldbuilder/world-corridor-01/
          if-no-files-found: error

      - name: Run WC1 exact-parity and browser boot
        run: node .github/scripts/world-corridor-wc1-baseline-smoke.mjs

      - name: Upload WC1 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kfb-world-corridor-wc1-source-parity-boot
          path: artifacts/world-corridor/wc1-baseline/
          if-no-files-found: warn
