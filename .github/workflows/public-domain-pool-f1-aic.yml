name: PD-POOL-F1 isolated AIC transport

on:
  push:
    branches:
      - chatgpt-web/public-domain-pool-f1-aic-2026-09-27
    paths:
      - ".github/workflows/public-domain-pool-f1-aic.yml"
      - "tools/public_domain/fetch_pool.py"
      - "tools/public_domain/pd-f1-aic-manifest.jsonl"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pd-pool-f1-aic
  cancel-in-progress: false

jobs:
  aic-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-web/public-domain-pool-f1-aic-2026-09-27
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static syntax
        run: python -m py_compile tools/public_domain/fetch_pool.py

      - name: AIC 24645 API plus one 843px IIIF download
        run: |
          set -euo pipefail
          rm -rf media/public_domain/aic
          python tools/public_domain/fetch_pool.py \
            tools/public_domain/pd-f1-aic-manifest.jsonl \
            --report /tmp/pd-f1-aic.json \
            --expect 1

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/pd-f1-aic.json").read_text(encoding="utf-8"))
          assert report["counts"] == {"loaded": 1, "rejected": 0, "unchanged": 0}, report
          assert len(report["results"]) == 1, report
          result = report["results"][0]
          assert result["provider"] == "aic", result
          assert result["id"] == "aic-24645-great-wave-f1", result
          assert result["apiHttpStatus"] == 200, result
          assert result["httpStatus"] == 200, result

          asset = Path("media/public_domain") / result["localPath"]
          assert asset.is_file(), asset
          payload = asset.read_bytes()
          digest = hashlib.sha256(payload).hexdigest()
          assert len(payload) == result["bytes"] > 0, (len(payload), result)
          assert digest == result["sha256"], (digest, result)

          sidecar = asset.with_name(asset.name + ".license.json")
          lic = json.loads(sidecar.read_text(encoding="utf-8"))
          url = lic["sourceFileUrl"]
          facts = lic["sourceFacts"]
          assert url.endswith("/full/843,/0/default.jpg"), url
          assert facts["apiHttpStatus"] == 200, facts
          assert facts["downloadHttpStatus"] == 200, facts
          assert lic["sourceId"] == 24645, lic
          assert lic["tier"] == "free", lic

          evidence = {
              "status": "PASS",
              "artworkId": 24645,
              "apiHttpStatus": result["apiHttpStatus"],
              "imageHttpStatus": result["httpStatus"],
              "bytes": result["bytes"],
              "sha256": result["sha256"],
              "iiifUrl": url,
          }
          print("PD_F1_EVIDENCE=" + json.dumps(evidence, sort_keys=True))
          PY

      - name: Confirm proof is ephemeral
        run: |
          set -euo pipefail
          test -n "$(find media/public_domain/aic -type f -print -quit)"
          git diff --exit-code -- tools/public_domain/fetch_pool.py tools/public_domain/pd-f1-aic-manifest.jsonl
