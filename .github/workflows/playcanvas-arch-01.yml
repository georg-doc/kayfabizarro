name: PlayCanvas Architecture Bench 01 · frozen headless telemetry
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            game-container/turbo-kfb/bench/playcanvas-arch-01
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen gate notice
        run: |
          echo "PC-ARCH-01 headless AppStats telemetry is frozen after two repair passes."
          echo "See game-container/turbo-kfb/bench/playcanvas-arch-01/recovery/RECOVERY.md"
          exit 1
