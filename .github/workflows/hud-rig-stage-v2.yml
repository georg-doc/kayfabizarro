name: HUD Rig Stage v2 public proof
on:
  push:
    branches: [main]
    paths:
      - 'kfb-hub/stage/stunt-world/hud-rig-v2/**'
      - '.github/workflows/hud-rig-stage-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kfb-hub/stage/stunt-world/hud-rig-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public Stage browser proof
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
          node kfb-hub/stage/stunt-world/hud-rig-v2/public-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hud-rig-stage-v2-public-evidence
          path: hud-stage-v2-evidence
          retention-days: 14
