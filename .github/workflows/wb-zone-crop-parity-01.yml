name: WB Zone Crop Parity 01

on:
  push:
    branches:
      - chatgpt-web/wb-zone-crop-parity-01-2026-09-27
  pull_request:
    paths:
      - "tools/KFB-ToolBox/worldbuilder/world-integration-01/test/wb-zone-crop-parity-01.mjs"
      - ".github/workflows/wb-zone-crop-parity-01.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crop-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Exact 369-id crop parity
        shell: bash
        run: |
          set -o pipefail
          node tools/KFB-ToolBox/worldbuilder/world-integration-01/test/wb-zone-crop-parity-01.mjs | tee wb-zone-crop-parity-01-report.txt

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wb-zone-crop-parity-01-report
          path: wb-zone-crop-parity-01-report.txt
          if-no-files-found: error
