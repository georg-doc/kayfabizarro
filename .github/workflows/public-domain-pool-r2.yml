name: PD-POOL-R2 Asset Librarian registration

on:
  push:
    branches:
      - chatgpt-web/public-domain-pool-r2-librarian-2026-09-27
    paths:
      - ".github/workflows/public-domain-pool-r2.yml"
      - ".github/scripts/asset-librarian-public-domain-r2-smoke.mjs"
      - "media/public_domain/**"
      - "tools/asset_registry/config.json"
      - "tools/asset_registry/build.py"
      - "tools/asset_registry/query.py"
      - "tools/asset_registry/librarian/**"
      - "tools/asset_registry/tests/test_public_domain_registry.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pd-pool-r2-librarian
  cancel-in-progress: false

jobs:
  registration:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt-web/public-domain-pool-r2-librarian-2026-09-27
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Static syntax
        run: |
          python -m py_compile tools/asset_registry/build.py tools/asset_registry/query.py
          node --check tools/asset_registry/librarian/render.js
          node --check .github/scripts/asset-librarian-public-domain-r2-smoke.mjs

      - name: Asset Registry and Librarian regressions
        run: python -m unittest discover -s tools/asset_registry/tests -v

      - name: Build existing canonical Registry shape with public-domain root
        run: python tools/asset_registry/build.py

      - name: Validate generated Registry
        run: python tools/asset_registry/validate.py

      - name: Prove exact four registrations and rights passthrough
        run: |
          set -euo pipefail
          mkdir -p artifacts/asset-librarian-smoke/public-domain-r2
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("registry/assets/v1")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          records = [
              json.loads(line)
              for line in (root / "catalog.jsonl").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          public = [r for r in records if r["assetId"].startswith("media/public_domain/")]
          expected = {
              "media/public_domain/met/bathing-suit-1890-95.jpg": ("met", "86434", "8d4696259a2fa664da351e6f619a8808ca129c1bd45e4d0f80e87381c151917c"),
              "media/public_domain/aic/great-wave-hokusai-1830-33.jpg": ("aic", "24645", "e0aa55ad5865f5ffa3e0fb7087e91a1e11ce5d7f13f392ba0f493c513b7f0f56"),
              "media/public_domain/commons/silent-film.svg": ("commons", "File:Silent film.svg", "e55e5d25eb1c834816a10d4d15d9ef30fa8a467c92d853f7439556b5774aadc7"),
              "media/public_domain/ia/the-general-1926-item-tile.jpg": ("ia", "TheGeneral1926", "bbc1321e8ca53998e8bb2761a199d0130dc6230de589087ea62eddaf7888ee19"),
          }
          assert len(public) == 4, [r["assetId"] for r in public]
          assert {r["assetId"] for r in public} == set(expected), [r["assetId"] for r in public]
          assert manifest["counts"]["byRoot"]["media/public_domain"] == 4, manifest["counts"]
          assert manifest["explicitMetadata"]["rightsMode"] == "persisted-sidecar-passthrough-only"
          assert manifest["explicitMetadata"]["licenseInference"] is False

          summary = []
          for record in public:
              provider, source_id, sha = expected[record["assetId"]]
              rights = record.get("rightsEvidence") or {}
              assert record["kind"] == "image-2d", record
              assert record.get("license"), record
              assert rights.get("mode") == "explicit-sidecar", record
              assert rights.get("provider") == provider, record
              assert str(rights.get("sourceId")) == source_id, record
              assert rights.get("sha256") == sha, record
              assert rights.get("tier") == "free", record
              assert str(rights.get("sidecarPath", "")).endswith(".license.json"), record
              assert record.get("provenance", {}).get("rights") == "explicit-sidecar", record
              summary.append({
                  "assetId": record["assetId"],
                  "name": record["name"],
                  "packId": record.get("packId"),
                  "license": record["license"],
                  "provider": rights["provider"],
                  "sourceId": rights["sourceId"],
                  "sha256": rights["sha256"],
                  "sidecarPath": rights["sidecarPath"],
              })

          out = {
              "schema": "kfb.pd-pool-r2-registry-proof/0.1",
              "sourceCommit": manifest["sourceCommit"],
              "registryTotal": manifest["counts"]["total"],
              "publicDomainCount": 4,
              "assets": sorted(summary, key=lambda x: x["assetId"]),
              "status": "PASS",
          }
          Path("artifacts/asset-librarian-smoke/public-domain-r2/registry-result.json").write_text(
              json.dumps(out, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(out, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Prove CLI discoverability and handoff provenance
        run: |
          set -euo pipefail
          python tools/asset_registry/query.py "Bathing suit" --kind image-2d --json > /tmp/Bathing_suit.json
          python tools/asset_registry/query.py "Great Wave" --kind image-2d --json > /tmp/Great_Wave.json
          python tools/asset_registry/query.py "Silent film" --kind image-2d --json > /tmp/Silent_film.json
          python tools/asset_registry/query.py "The General" --kind image-2d --json > /tmp/The_General.json
          python - <<'PY'
          import json
          from pathlib import Path

          cases = {
              "Bathing_suit": "media/public_domain/met/bathing-suit-1890-95.jpg",
              "Great_Wave": "media/public_domain/aic/great-wave-hokusai-1830-33.jpg",
              "Silent_film": "media/public_domain/commons/silent-film.svg",
              "The_General": "media/public_domain/ia/the-general-1926-item-tile.jpg",
          }
          for key, path in cases.items():
              rows = json.loads(Path(f"/tmp/{key}.json").read_text(encoding="utf-8"))
              target = next((row for row in rows if row["assetId"] == path), None)
              assert target is not None, (key, [row["assetId"] for row in rows])
              assert target["license"]
              assert target["rightsEvidence"]["mode"] == "explicit-sidecar"
              assert target["rightsEvidence"]["sidecarPath"].endswith(".license.json")
          print("PD_R2_CLI_DISCOVERABILITY=4/4 PASS")
          PY

      - name: Real Chrome Librarian search/detail proof
        run: node .github/scripts/asset-librarian-public-domain-r2-smoke.mjs

      - name: Upload R2 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pd-pool-r2-asset-librarian
          path: artifacts/asset-librarian-smoke/public-domain-r2/
          if-no-files-found: error
