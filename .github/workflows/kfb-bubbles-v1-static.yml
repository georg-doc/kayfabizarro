name: KFB bubbles v1 source and R10.1 checks
on:
  push:
    branches:
      - 'wsa/kfb-bubbles-ssot-r1-*'
  workflow_dispatch:
jobs:
  syntax-donor-r101:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/KFB-ToolBox/_inbox/KFB_HUB/30_DECISIONS/replies/KFB_BUBBLES_SSOT_R1/
            /tools/KFB-ToolBox/_inbox/KFB_CHATTERBOX_STUDIO_CLAUDE_DESIGN_SESSION_CUT_2026-10-05_r2/lib/chatterbox/chatterbox-core.js
            /tools/KFB-ToolBox/_inbox/KFB_HUB/30_DECISIONS/replies/CLAUDE_DESIGN_STAGE_LIVE_R1/modules/bubbles.module.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, generated outputs and R10.1 behavior
        run: |
          cd tools/KFB-ToolBox/_inbox/KFB_HUB/30_DECISIONS/replies/KFB_BUBBLES_SSOT_R1/kfb-bubbles.v1
          for file in chatterbox-core.js bubbles.module.js fluffolect-r101.js kfb-bubbles.mjs kfb-bubbles.classic.js demo.js build.mjs test.mjs; do node --check "$file"; done
          node build.mjs --check
          node test.mjs
      - name: Original donor byte identities and retained geometry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          root=Path('tools/KFB-ToolBox/_inbox/KFB_HUB/30_DECISIONS/replies/KFB_BUBBLES_SSOT_R1/kfb-bubbles.v1')
          old_core=Path('tools/KFB-ToolBox/_inbox/KFB_CHATTERBOX_STUDIO_CLAUDE_DESIGN_SESSION_CUT_2026-10-05_r2/lib/chatterbox/chatterbox-core.js').read_bytes()
          old_adapter=Path('tools/KFB-ToolBox/_inbox/KFB_HUB/30_DECISIONS/replies/CLAUDE_DESIGN_STAGE_LIVE_R1/modules/bubbles.module.js').read_bytes()
          assert (root/'chatterbox-core.js').read_bytes()==old_core+b'\n'
          assert (root/'bubbles.module.js').read_bytes()==old_adapter+b'\n'
          for name in ['kfbFaceShade','kfbWallShade','kfbSoftShadow','kfbCornerMask','kfbDotsDeep','kfbDotsPink','kfbDotsViolet']:
              assert 'id="'+name+'"' in (root/'defs.svg').read_text()
          for name in ['speech:','thought:','whisper:','shout:','caption:','kayfabulate:','ambient:','choice:','impact:','reaction:','movement:','reward:']:
              assert name in (root/'chatterbox-core.js').read_text()
          for html in ['demo.single.html','browser-tests.html']:
              scripts=re.findall(r'<script(?: type="module")?>(.*?)</script>',(root/html).read_text(),re.S)
              assert scripts,html
              for script in scripts:
                  with tempfile.NamedTemporaryFile(mode='w',suffix='.mjs') as f:
                      f.write(script);f.flush();subprocess.run(['node','--check',f.name],check=True)
          print('PASS: original donor bytes2/2; defs7/7; KINDS8/8; WORD4/4; inline scripts syntax')
          PY
