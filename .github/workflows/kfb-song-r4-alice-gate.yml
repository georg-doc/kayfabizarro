name: KFB Alice R3.1 correction gate
on:
  push:
    branches:
      - "songs/frizzlebob_bloedsinnland_alice-r4-2026-10-17"
permissions:
  contents: read
jobs:
  r31:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact plugin lexical checker
        run: python3 songs/frizzlebob_bloedsinnland_alice/triplet_set_check.py songs/frizzlebob_bloedsinnland_alice/frizzlebob_bloedsinnland_alice.r31.qa.deck.json songs/frizzlebob_bloedsinnland_alice/frizzlebob_bloedsinnland_alice.r31.qa.set.csv
      - name: R3.1 gates
        run: python3 songs/frizzlebob_bloedsinnland_alice/format_gate_r31.py
