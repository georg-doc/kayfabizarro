name: KFB Alice R4 lyric gate
on:
  push:
    branches:
      - "songs/frizzlebob_bloedsinnland_alice-r4-2026-10-17"
permissions:
  contents: read
jobs:
  r4_lexical_format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact plugin triplet_set_check.py
        run: python3 songs/frizzlebob_bloedsinnland_alice/triplet_set_check.py songs/frizzlebob_bloedsinnland_alice/frizzlebob_bloedsinnland_alice.qa.deck.json songs/frizzlebob_bloedsinnland_alice/frizzlebob_bloedsinnland_alice.qa.set.csv
      - name: R4 Unicode format gate
        run: python3 songs/frizzlebob_bloedsinnland_alice/format_gate.py
