name: OSM City · current Ehrenfeld Hürth corridor detail

on:
  # Current-detail Overpass refresh is explicit; committed source stays reproducible.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: osm-city-ehrenfeld-huerth-corridor-detail
  cancel-in-progress: true

jobs:
  fetch-detail:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          sparse-checkout: |
            tools/osm-city-lab/data/ehrenfeld-huerth-corridor-v0
            tools/osm-city-lab/evidence/ehrenfeld-huerth-route.json
            tools/osm-city-lab/scripts/fetch-ehrenfeld-huerth-corridor-detail.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node --check tools/osm-city-lab/scripts/fetch-ehrenfeld-huerth-corridor-detail.mjs
      - name: Fetch current narrow corridor source
        run: |
          for attempt in 1 2 3; do
            echo "Current corridor detail pass $attempt/3"
            if node tools/osm-city-lab/scripts/fetch-ehrenfeld-huerth-corridor-detail.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          echo "::error::Current corridor detail source incomplete after 3 bounded passes"
          exit 1
      - name: Commit current corridor detail source
        run: |
          git config user.name "KFB OSM City Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/osm-city-lab/data/ehrenfeld-huerth-corridor-v0/QUERY_PLAN.json \
                  tools/osm-city-lab/data/ehrenfeld-huerth-corridor-v0/source.overpass.json \
                  tools/osm-city-lab/data/ehrenfeld-huerth-corridor-v0/PROVENANCE.json
          if git diff --cached --quiet; then
            echo "No corridor detail source delta."
            exit 0
          fi
          git commit -m "OSM City: cache current Ehrenfeld-Hürth corridor detail [osm-city-corridor-detail]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
