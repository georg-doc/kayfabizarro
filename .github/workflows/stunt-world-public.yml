name: Stunt World public browser proof

on:
  push:
    branches:
      - osm-city/recovery-sync-stage-main-2026-09-19
      - main
    paths:
      - 'kfb-hub/stage/stunt-world/**'
      - 'kfb-hub/stage/qa/stunt-world-public.mjs'
      - '.github/workflows/stunt-world-public.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stunt-world-public-proof
  cancel-in-progress: true

jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kfb-hub/stage/stunt-world/DEPLOYMENT.json
            kfb-hub/stage/qa/stunt-world-public.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Verify public Cloudflare Stage and short C0 drive
        run: node kfb-hub/stage/qa/stunt-world-public.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stunt-world-public-evidence
          path: stunt-world-public-evidence
          retention-days: 30
