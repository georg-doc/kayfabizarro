name: resident-chat-ensemble-01b

on:
  push:
    branches:
      - chatgpt-web/resident-chat-ensemble-01b-2026-10-01
  pull_request:
    paths:
      - 'skills/chat/workflows/RESIDENT_CHAT_ENSEMBLE_01B_2026-10-01/**'
      - 'skills/chat/workflows/RESIDENT_CHAT_POC_01_2026-10-01/**'
      - 'tools/KFB-ToolBox/_inbox/KFB_RESIDENT_ATLAS_CLAUDE_DESIGN_SESSION_CUT_2026-09-30_r1/**'
      - 'tools/KFB-ToolBox/_inbox/KFB Resident Card Speculation Scene/npc-card-spec-01_2026-09-24/**'
      - '.github/workflows/resident-chat-ensemble-01b.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ensemble-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            skills/chat/workflows/RESIDENT_CHAT_ENSEMBLE_01B_2026-10-01
            skills/chat/workflows/RESIDENT_CHAT_POC_01_2026-10-01
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check ensemble modules
        shell: bash
        run: |
          set -euo pipefail
          node --check skills/chat/workflows/RESIDENT_CHAT_ENSEMBLE_01B_2026-10-01/src/resident-chat-ensemble-data.mjs
          node --check skills/chat/workflows/RESIDENT_CHAT_ENSEMBLE_01B_2026-10-01/src/resident-chat-ensemble-dialogue.mjs
          node --check skills/chat/workflows/RESIDENT_CHAT_ENSEMBLE_01B_2026-10-01/src/resident-chat-ensemble-browser.mjs
          node --check skills/chat/workflows/RESIDENT_CHAT_ENSEMBLE_01B_2026-10-01/test/ensemble-contract.test.mjs
      - name: Run deterministic ensemble contract tests
        run: node --test skills/chat/workflows/RESIDENT_CHAT_ENSEMBLE_01B_2026-10-01/test/ensemble-contract.test.mjs

  browser-gates:
    needs: ensemble-contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            skills/chat/workflows/RESIDENT_CHAT_ENSEMBLE_01B_2026-10-01
            skills/chat/workflows/RESIDENT_CHAT_POC_01_2026-10-01
            tools/KFB-ToolBox/_inbox/KFB_RESIDENT_ATLAS_CLAUDE_DESIGN_SESSION_CUT_2026-09-30_r1/**
            tools/KFB-ToolBox/_inbox/KFB Resident Card Speculation Scene/npc-card-spec-01_2026-09-24/**
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source-data pins and current integration seams
        shell: bash
        run: |
          set -euo pipefail
          git_hash () { git hash-object "$1"; }
          test "$(git_hash 'tools/KFB-ToolBox/_inbox/KFB_RESIDENT_ATLAS_CLAUDE_DESIGN_SESSION_CUT_2026-09-30_r1/RETURN.md')" = '64670df2c39d65c63242ef7fc1f7d7e57dc5023b'
          test "$(git_hash 'tools/KFB-ToolBox/_inbox/KFB_RESIDENT_ATLAS_CLAUDE_DESIGN_SESSION_CUT_2026-09-30_r1/data/cast.js')" = 'dc62757ead4ba13906c3e5b6cf2f22d239a6f6b9'
          test "$(git_hash 'tools/KFB-ToolBox/_inbox/KFB_RESIDENT_ATLAS_CLAUDE_DESIGN_SESSION_CUT_2026-09-30_r1/lib/atlas.js')" = '9c54869db0c208c019fe87e356c625cdaf5c35fd'
          test "$(git_hash 'skills/chat/workflows/RESIDENT_CHAT_POC_01_2026-10-01/src/resident-chatter-adapter.v0.1.mjs')" = 'bc3cf5194747bcb71b2b93bcfdec349c9db710f2'
          test "$(git_hash 'tools/KFB-ToolBox/_inbox/KFB_RESIDENT_ATLAS_CLAUDE_DESIGN_SESSION_CUT_2026-09-30_r1/KFB_Resident_Atlas_S15.html')" = '367f04616c061e5133b9839c9077204b292ede61'
          test "$(git_hash 'tools/KFB-ToolBox/_inbox/KFB Resident Card Speculation Scene/npc-card-spec-01_2026-09-24/npc-card-spec-01/resident-scene.mjs')" = '41b1a246222fc6ff248b946ecf065f120cb36b2e'
      - name: Syntax check browser gates
        shell: bash
        run: |
          set -euo pipefail
          node --check skills/chat/workflows/RESIDENT_CHAT_ENSEMBLE_01B_2026-10-01/qa/source-isolation.mjs
          node --check skills/chat/workflows/RESIDENT_CHAT_ENSEMBLE_01B_2026-10-01/qa/ensemble-browser.mjs
      - name: Install Playwright once
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local HTTP server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/resident-ensemble-01b-http.log 2>&1 &
          echo $! >/tmp/resident-ensemble-01b-http.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/resident-ensemble-01b-http.log
          exit 1
      - name: Re-run four-Resident source isolation on integration host
        env:
          KFB_BROWSER_BASE: http://127.0.0.1:4173
        run: xvfb-run -a node skills/chat/workflows/RESIDENT_CHAT_ENSEMBLE_01B_2026-10-01/qa/source-isolation.mjs
      - name: Run deterministic four-Resident ensemble browser proof
        env:
          KFB_BROWSER_BASE: http://127.0.0.1:4173
        run: xvfb-run -a node skills/chat/workflows/RESIDENT_CHAT_ENSEMBLE_01B_2026-10-01/qa/ensemble-browser.mjs
      - name: Upload source-isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resident-chat-ensemble-01b-source-isolation-current-host
          path: skills/chat/workflows/RESIDENT_CHAT_ENSEMBLE_01B_2026-10-01/evidence/source-isolation/
          if-no-files-found: warn
      - name: Upload ensemble browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resident-chat-ensemble-01b-browser-proof
          path: skills/chat/workflows/RESIDENT_CHAT_ENSEMBLE_01B_2026-10-01/evidence/ensemble-browser/
          if-no-files-found: warn
