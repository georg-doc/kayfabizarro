name: Extract Medieval Hexagon Pack once

on:
  push:
    branches:
      - chat/extract-medieval-hexagon-2026-09-17
    paths:
      - .github/workflows/extract-medieval-hexagon-once.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chat/extract-medieval-hexagon-2026-09-17
          fetch-depth: 0

      - name: Extract existing owned archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil, zipfile

          archive = Path('media/3D_Assets/KayKit_Medieval_Hexagon_Pack_1.0_FREE 2.zip')
          dest = Path('media/3D_Assets/KayKit_Medieval_Hexagon_Pack_1.0_FREE')
          tmp = Path('.tmp-medieval-hexagon')

          if not archive.is_file():
              raise SystemExit(f'missing archive: {archive}')
          if dest.exists():
              raise SystemExit(f'destination already exists: {dest}')

          if tmp.exists():
              shutil.rmtree(tmp)
          tmp.mkdir()
          with zipfile.ZipFile(archive) as z:
              z.extractall(tmp)

          roots = [p for p in tmp.iterdir() if p.name != '__MACOSX']
          source = tmp
          if len(roots) == 1 and roots[0].is_dir():
              candidate = roots[0]
              if (candidate / 'Assets').exists() or (candidate / 'License.txt').exists():
                  source = candidate

          dest.mkdir(parents=True)
          for p in source.iterdir():
              if p.name == '__MACOSX':
                  continue
              target = dest / p.name
              if p.is_dir():
                  shutil.copytree(p, target)
              else:
                  shutil.copy2(p, target)

          shutil.rmtree(tmp)

          required = [
              dest / 'License.txt',
              dest / 'Assets/gltf/buildings/blue/building_castle_blue.gltf',
              dest / 'Assets/gltf/buildings/blue/building_mine_blue.gltf',
          ]
          missing = [str(p) for p in required if not p.is_file()]
          if missing:
              raise SystemExit('required files missing after extraction:\n' + '\n'.join(missing))

          files = [p for p in dest.rglob('*') if p.is_file()]
          total = sum(p.stat().st_size for p in files)
          print(f'extracted {len(files)} files, {total} bytes -> {dest}')
          PY

      - name: Commit extracted pack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KFB Asset Import Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- 'media/3D_Assets/KayKit_Medieval_Hexagon_Pack_1.0_FREE'
          git diff --cached --stat
          git commit -m "assets: extract KayKit Medieval Hexagon Pack 1.0 FREE"
          git push origin HEAD:chat/extract-medieval-hexagon-2026-09-17
