name: Theatre Curtain v1 Stage proof
on:
  push:
    branches:
      - 'chat/gds-theatre-curtain-v1-2026-09-20'
    paths:
      - 'game-ready/theatre-curtain-v1/**'
      - 'kfb-hub/stage/game-dev-studio/theatre-curtain-v1/**'
      - '.github/workflows/theatre-curtain-v1-stage.yml'
  pull_request:
    branches: [main]
    paths:
      - 'game-ready/theatre-curtain-v1/**'
      - 'kfb-hub/stage/game-dev-studio/theatre-curtain-v1/**'
      - '.github/workflows/theatre-curtain-v1-stage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            game-ready/theatre-curtain-v1
            kfb-hub/stage/game-dev-studio/theatre-curtain-v1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax
        run: |
          node --check game-ready/theatre-curtain-v1/runtime/kfb-theatre-curtain.mjs
          node --check kfb-hub/stage/game-dev-studio/theatre-curtain-v1/lab.mjs
          node --check kfb-hub/stage/game-dev-studio/theatre-curtain-v1/local-proof.mjs
          node --check kfb-hub/stage/game-dev-studio/theatre-curtain-v1/public-proof.mjs

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium

      - name: Start local Stage
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/curtain-v1-http.log 2>&1 &
          echo $! > /tmp/curtain-v1-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/kfb-hub/stage/game-dev-studio/theatre-curtain-v1/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/curtain-v1-http.log
          exit 1

      - name: Curtain state-contract browser proof
        run: node kfb-hub/stage/game-dev-studio/theatre-curtain-v1/local-proof.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theatre-curtain-v1-local-evidence
          path: curtain-v1-local-evidence
          retention-days: 14

  public-proof:
    needs: local-proof
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kfb-hub/stage/game-dev-studio/theatre-curtain-v1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium

      - name: Fixed Cloudflare Stage browser proof
        run: node kfb-hub/stage/game-dev-studio/theatre-curtain-v1/public-proof.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theatre-curtain-v1-public-evidence
          path: curtain-v1-public-evidence
          retention-days: 14
