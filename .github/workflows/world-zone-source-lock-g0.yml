name: WORLD-ZONE-SOURCE-LOCK-G0

on:
  push:
    branches:
      - chatgpt-web/world-zone-source-lock-g0-2026-09-24
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify cached Cologne source locks
        shell: bash
        run: |
          set -euo pipefail
          node tools/osm-city-lab/tests/world-zone-source-lock-g0.mjs dom-zentrum-v0 | tee /tmp/WORLD_ZONE_SOURCE_LOCK_G0_REPORT.json

      - uses: actions/upload-artifact@v4
        with:
          name: world-zone-source-lock-g0
          if-no-files-found: error
          retention-days: 14
          path: /tmp/WORLD_ZONE_SOURCE_LOCK_G0_REPORT.json
