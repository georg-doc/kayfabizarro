name: ToolBox Legacy RPG Rigging candidate proof
on:
  push:
    branches:
      - chatgpt-web/toolbox-legacy-rpg-rigging-2026-09-21
    paths:
      - 'tools/KFB-ToolBox/legacy-rpg-rigging/**'
      - 'kfb-hub/stage/toolbox/legacy-rpg-rigging/**'
      - '.github/workflows/toolbox-legacy-rpg-rigging-test.yml'
  pull_request:
    paths:
      - 'tools/KFB-ToolBox/legacy-rpg-rigging/**'
      - 'kfb-hub/stage/toolbox/legacy-rpg-rigging/**'
      - '.github/workflows/toolbox-legacy-rpg-rigging-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source and syntax checks
        run: |
          node --experimental-vm-modules tools/KFB-ToolBox/legacy-rpg-rigging/tests/static-check.mjs
          node --check tools/KFB-ToolBox/legacy-rpg-rigging/app.js
          node --check tools/KFB-ToolBox/legacy-rpg-rigging/lib/legacy-facehost.v1.js
          node --check tools/KFB-ToolBox/legacy-rpg-rigging/lib/legacy-rig-adapter.v1.js
          node --check tools/KFB-ToolBox/legacy-rpg-rigging/proof.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Start local Stage mirror
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/legacy-rpg-http.log 2>&1 &
          echo $! > /tmp/legacy-rpg-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/kfb-hub/stage/toolbox/legacy-rpg-rigging/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/legacy-rpg-http.log
          exit 1
      - name: Real browser / WebGL proof
        env:
          KLR_PROOF_DIR: legacy-rpg-rigging-evidence
        run: node tools/KFB-ToolBox/legacy-rpg-rigging/proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolbox-legacy-rpg-rigging-evidence
          path: legacy-rpg-rigging-evidence
          retention-days: 14
