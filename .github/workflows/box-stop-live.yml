name: Box Stop public URL proof
on:
  push:
    branches: [main]
    paths: ['kfb-hub/_deploy/BOX1_LIVE_TRIGGER.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: kfb-hub/_deploy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Exercise the actual deployed page
        run: |
          mkdir -p live-proof
          cat > live-proof/check.mjs <<'JS'
          import fs from 'node:fs';import crypto from 'node:crypto';import {chromium} from 'playwright';
          const cfg=JSON.parse(fs.readFileSync('kfb-hub/_deploy/BOX1_LIVE_TRIGGER.json')),base='https://kayfabizarro.pages.dev/kfb-hub/stunt-race/track-environment-lab/';
          const r={url:base,stageUrl:base+'?world=facility&seed=KFB-1842&audio=roadtrip-v2',sourceCommit:cfg.sourceCommit,stagePatchSourceCommit:cfg.stagePatchSourceCommit,checks:[],errors:[],httpErrors:[],status:'RUNNING',humanVisualAcceptance:'PENDING',humanAudioAcceptance:'PENDING',physicalDeviceTest:'NOT_RUN'};
          const check=(name,ok,detail)=>{r.checks.push({name,pass:!!ok,detail});if(!ok)throw Error(name)};const pause=ms=>new Promise(a=>setTimeout(a,ms));let browser,page;
          try{
            let live=false;for(let i=0;i<36;i++){try{const res=await fetch(base+'DEPLOYMENT.json?ci='+Date.now());if(res.ok){const d=await res.json();if(d.sourceCommit===cfg.sourceCommit&&d.stagePatchSourceCommit===cfg.stagePatchSourceCommit){live=true;break}}}catch{}await pause(10000)}check('deployed source marker',live);
            const manifest=await (await fetch(base+'PUBLIC_MANIFEST.json?ci='+Date.now())).json();
            for(const file of ['boot.mjs','host-bootstrap.mjs','index.html','box-stop/session.mjs','box-stop/vehicles.mjs','box-stop/host-glue.mjs','box-stop/presentation.mjs','box-stop/radio.mjs','host/feel-lab-v08.mjs']){const res=await fetch(base+file+'?ci='+Date.now());const bytes=Buffer.from(await res.arrayBuffer());check('public bytes '+file,res.ok&&crypto.createHash('sha256').update(bytes).digest('hex')===manifest[file])}
            browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-unsafe-swiftshader']});r.browser=browser.version();const c=await browser.newContext({viewport:{width:1440,height:900}});page=await c.newPage();
            const watch=p=>{p.on('pageerror',e=>r.errors.push(String(e)));p.on('console',m=>{if(m.type()==='error')r.errors.push(m.text())});p.on('response',res=>{if(res.status()>=400)r.httpErrors.push({url:res.url(),status:res.status()})})};watch(page);
            await page.goto(base+'?world=facility&seed=KFB-1842',{waitUntil:'networkidle',timeout:90000});await page.waitForFunction(()=>window.__KFB_BOX_READY__||window.__KFB_BOX_ERROR__,{},{timeout:90000});check('public Box Stop ready',await page.evaluate(()=>!!window.__KFB_BOX_READY__));
            const snap=()=>page.evaluate(()=>window.__KFB_BOX__.snapshot());const clickInstrument=async(p,action)=>{const pt=await p.evaluate(a=>window.__KFB_BOX__.snapshot().instruments.controls[a],action);check('3D instrument '+action,pt&&Number.isFinite(pt.x)&&Number.isFinite(pt.y),pt);await p.mouse.click(pt.x,pt.y)};check('source list 43',(await snap()).count===43);check('no autoplay',!(await snap()).radio.playing);check('default catalog remains 10',(await snap()).radio.trackCount===10&&!(await snap()).radio.stageMode,(await snap()).radio);check('legacy DOM radio removed',await page.locator('#radioControls,#radioMorePanel').count()===0);check('diagnostics hidden',await page.locator('#labPanel').isHidden());await page.screenshot({path:'live-proof/drive-desktop.png'});await clickInstrument(page,'radio.play');await page.waitForFunction(()=>window.__KFB_BOX__.snapshot().radio.position>.1,{},{timeout:45000});await page.waitForFunction(()=>window.__KFB_BOX__.snapshot().radio.sfxLoaded>=11,{},{timeout:45000});await clickInstrument(page,'radio.next');await page.keyboard.press('Space');await page.waitForFunction(()=>window.__KFB_RACE_TELEMETRY__.airborne,{},{timeout:10000});check('Space jump survives 3D radio',true);await page.waitForFunction(()=>window.__KFB_BOX__.snapshot().radio.lastSfx==='jump',{},{timeout:10000});check('jump state SFX',true);await page.waitForFunction(()=>!window.__KFB_RACE_TELEMETRY__.airborne,{},{timeout:15000});await page.waitForFunction(()=>window.__KFB_BOX__.snapshot().radio.lastSfx==='land',{},{timeout:10000});check('landing state SFX',true);await clickInstrument(page,'radio.play');
            await page.locator('#boxOpen').click();await page.waitForFunction(()=>window.__KFB_BOX__.snapshot().draft&&!window.__KFB_BOX__.snapshot().loading);await page.evaluate(()=>window.__KFB_BOX__.select('wagon-by-poly-by-google-136bu5geshs'));check('wagon upright adapter',(await snap()).draft.measured.uprighted===false&&(await snap()).draft.measured.orientX===0,(await snap()).draft.measured);await page.screenshot({path:'live-proof/wagon.png'});
            await page.evaluate(()=>window.__KFB_BOX__.select('car-sedan'));await page.locator('[data-vote="keep"]').click();await page.screenshot({path:'live-proof/box-desktop.png'});const start=Date.now();await page.locator('#testLap').click();await page.keyboard.down('w');await pause(250);check('countdown blocks gas',(await snap()).race.speed===0);await page.keyboard.up('w');await page.waitForFunction(()=>window.__KFB_BOX__.snapshot().mode==='drive',{},{timeout:15000});check('countdown uses elapsed time',Date.now()-start<11000,Date.now()-start);
            await page.keyboard.down('w');await page.waitForFunction(()=>window.__KFB_RACE_TELEMETRY__.speed>9,{},{timeout:30000});check('public keyboard driving',(await snap()).race.speed>9);const b0=(await snap()).radio.sfxCounts.boost||0;await page.keyboard.down('Shift');await page.waitForFunction(()=>window.__KFB_RACE_TELEMETRY__.boostActive,{},{timeout:10000});await page.waitForFunction(n=>(window.__KFB_BOX__.snapshot().radio.sfxCounts.boost||0)>n,b0,{timeout:10000});check('boost state SFX',(await snap()).radio.sfxCounts.boost===b0+1,(await snap()).radio);const br0=(await snap()).radio.sfxCounts.boostRelease||0;await page.keyboard.up('Shift');await page.waitForFunction(n=>(window.__KFB_BOX__.snapshot().radio.sfxCounts.boostRelease||0)>n,br0,{timeout:10000});check('boost release SFX',(await snap()).radio.sfxCounts.boostRelease===br0+1,(await snap()).radio);await page.keyboard.down('q');await page.waitForFunction(()=>Math.abs(window.__KFB_BOX__.snapshot().active.pose.pose.yaw)>1,{},{timeout:15000});check('public real drift deforms',true);await page.keyboard.up('q');await page.keyboard.up('w');await page.screenshot({path:'live-proof/drift-desktop.png'});
            await page.locator('#worldSelect').selectOption('surreal');check('route unchanged across environment',await page.evaluate(()=>window.__KFB_ENV__.snapshot().unchangedRoute&&window.__KFB_ENV__.snapshot().unchangedWidths));await page.evaluate(()=>window.__KFB_BOX__.radio.choose(0));await clickInstrument(page,'radio.play');await page.waitForFunction(()=>window.__KFB_BOX__.snapshot().radio.position>.1,{},{timeout:45000});check('public Van Metronome via 3D radio',(await snap()).radio.track==='van_metronome');check('music one source',(await snap()).radio.sourceCount===1);await clickInstrument(page,'radio.play');await page.screenshot({path:'live-proof/surreal-desktop.png'});
            const rp=await c.newPage();watch(rp);await rp.goto(r.stageUrl,{waitUntil:'networkidle',timeout:90000});await rp.waitForFunction(()=>window.__KFB_BOX_READY__,{},{timeout:90000});const rsnap=()=>rp.evaluate(()=>window.__KFB_BOX__.snapshot());check('RoadTrip v2 Stage catalog',(await rsnap()).radio.stageMode&&(await rsnap()).radio.trackCount===18,(await rsnap()).radio);
            await rp.keyboard.down('w');await rp.waitForFunction(()=>window.__KFB_RACE_TELEMETRY__.speed>9,{},{timeout:30000});const rtIndex=await rp.evaluate(()=>window.__KFB_BOX__.radio.tracks.findIndex(t=>t.id==='roadtrip_night_circuit_runner_a'));check('Night Circuit Runner A listed',rtIndex>=10,rtIndex);await rp.evaluate(i=>window.__KFB_BOX__.radio.choose(i),rtIndex);await clickInstrument(rp,'radio.play');await rp.waitForFunction(()=>window.__KFB_BOX__.snapshot().radio.track==='roadtrip_night_circuit_runner_a'&&window.__KFB_BOX__.snapshot().radio.position>.1,{},{timeout:45000});check('RoadTrip v2 plays while driving',(await rsnap()).race.speed>9&&(await rsnap()).radio.playing&&(await rsnap()).radio.sourceCount===1&&(await rsnap()).radio.collection==='roadtrip-v2',(await rsnap()));await rp.screenshot({path:'live-proof/roadtrip-v2-drive.png'});await rp.keyboard.up('w');await clickInstrument(rp,'radio.play');await rp.close();
            const mobile=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:1});const mp=await mobile.newPage();watch(mp);await mp.goto(base+'?world=facility&seed=KFB-1842',{waitUntil:'networkidle',timeout:90000});await mp.waitForFunction(()=>window.__KFB_BOX_READY__,{},{timeout:90000});check('mobile viewport fits',await mp.evaluate(()=>document.documentElement.scrollWidth<=innerWidth));
            const client=await mobile.newCDPSession(mp),b=await mp.locator('[data-key="KeyW"]').boundingBox();await client.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:b.x+b.width/2,y:b.y+b.height/2}]});await mp.waitForFunction(()=>window.__KFB_RACE_TELEMETRY__.speed>3,{},{timeout:30000});check('simulated mobile touch drives',true);await client.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});await mp.screenshot({path:'live-proof/mobile-drive.png'});
            await mp.locator('#boxOpen').tap();await mp.waitForFunction(()=>window.__KFB_BOX__.snapshot().draft&&!window.__KFB_BOX__.snapshot().loading);check('touch opens paused Box Stop',await mp.evaluate(()=>window.__KFB_BOX__.snapshot().host.paused));await mp.screenshot({path:'live-proof/mobile-box.png'});check('mobile Test Lap inside view',await mp.evaluate(()=>document.getElementById('testLap').getBoundingClientRect().right<=innerWidth));
            await mp.locator('#testLap').tap();const jump=await mp.locator('[data-key="Space"]').boundingBox();await client.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:jump.x+jump.width/2,y:jump.y+jump.height/2}]});await pause(150);await client.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});check('countdown blocks touch jump',await mp.evaluate(()=>!window.__KFB_BOX__.snapshot().race.airborne));
            check('no console/page errors',r.errors.length===0,r.errors);check('no failed HTTP assets',r.httpErrors.length===0,r.httpErrors);r.final=await snap();r.status='PASS';
          }catch(e){r.status='FAIL';r.failure=String(e.stack||e);process.exitCode=1;if(page)await page.screenshot({path:'live-proof/FAIL.png'}).catch(()=>{})}finally{fs.writeFileSync('live-proof/results.json',JSON.stringify(r,null,2));console.log(JSON.stringify({status:r.status,checks:r.checks.length,failure:r.failure}));if(browser)await browser.close()}
          JS
          node live-proof/check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: box-stop-live-proof
          path: live-proof
          retention-days: 14
