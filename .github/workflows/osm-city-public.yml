name: OSM City public S1 proof

on:
  push:
    branches: [main]
    paths:
      - 'kfb-hub/free-roam/cities.json'
      - 'kfb-hub/free-roam/cities/**'
      - 'tools/osm-city-lab/index.html'
      - 'tools/osm-city-lab/src/viewer/**'
      - 'tools/osm-city-lab/src/style/**'
      - 'tools/osm-city-lab/styles/**'
      - 'tools/osm-city-lab/data/ehrenfeld-v0/**'
      - 'tools/osm-city-lab/data/huerth-v0/**'
      - 'kfb-hub/free-roam/qa/cities-public.mjs'
      - '.github/workflows/osm-city-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-s1-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kfb-hub/free-roam
            tools/osm-city-lab
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Verify public city entries and real S1 browser consumers
        run: node kfb-hub/free-roam/qa/cities-public.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osm-city-public-proof
          path: osm-city-public-evidence
          retention-days: 30
