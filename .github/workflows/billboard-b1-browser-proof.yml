name: Billboard B1 Browser Proof

on:
  pull_request:
    paths:
      - 'tools/KFB-ToolBox/_handover/BILLBOARD_B1_2026-09-24/**'
      - '.github/workflows/billboard-b1-browser-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prove literal B0 fork + JavaScript syntax
        run: |
          set -euo pipefail
          B1='tools/KFB-ToolBox/_handover/BILLBOARD_B1_2026-09-24'
          B0='tools/KFB-ToolBox/_inbox/KFB Billboard Media Szene · B0 Source Proof/BILLBOARD_B0_SOURCE_PROOF_2026-09-24'
          cmp "$B1/bb-scene.js" "$B0/bb-scene.js"
          cmp "$B1/bb0-boot.js" "$B0/bb0-boot.js"
          node --check "$B1/bb1-boot.js"
          node --check "$B1/bb-scene.js"
          node --check "$B1/bb0-boot.js"
          node --check "$B1/wd-donors.js"
          node --check "$B1/wd-registry.js"

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium

      - name: Browser-check B1 modes
        run: |
          mkdir -p artifacts/billboard-b1
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/b1-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          cat > artifacts/billboard-b1/check.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const url='http://127.0.0.1:4173/tools/KFB-ToolBox/_handover/BILLBOARD_B1_2026-09-24/';
          const report={url,checks:[],errors:[],httpErrors:[],modes:{}};
          const check=(name,pass,detail=null)=>{
            report.checks.push({name,pass:!!pass,detail});
            if(!pass) process.exitCode=1;
          };

          const browser=await chromium.launch({
            headless:true,
            args:['--use-angle=swiftshader','--enable-unsafe-swiftshader']
          });
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          page.on('pageerror',e=>report.errors.push('pageerror: '+String(e)));
          page.on('console',m=>{
            if(m.type()==='error'&&!/favicon/i.test(m.text())) report.errors.push('console: '+m.text());
          });
          page.on('response',r=>{
            if(r.status()>=400&&!/favicon/i.test(r.url())) report.httpErrors.push({status:r.status(),url:r.url()});
          });

          async function waitMode(mode){
            await page.evaluate((m)=>window.__b1.setMode(m),mode);
            await page.waitForFunction((m)=>{
              const r=window.__B1_REPORT__;
              return r?.mode===m && r?.ready===true;
            },mode,{timeout:90000});
            const snap=await page.evaluate(()=>structuredClone(window.__B1_REPORT__));
            report.modes[mode]=snap;
            return snap;
          }

          try{
            const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
            check('local HTTP',!!response&&response.ok(),response?.status());
            await page.waitForFunction(()=>window.__b1&&window.__B1_REPORT__,{}, {timeout:90000});
            await page.waitForFunction(()=>window.__B1_REPORT__.ready===true,{}, {timeout:90000});

            const quarter=await page.evaluate(()=>structuredClone(window.__B1_REPORT__));
            report.modes.quarter=quarter;
            check('default is card quarter',quarter.mode==='quarter',quarter.mode);
            check('B0 face measured 4.20 x 2.10',quarter.sourceFace==='4.20 × 2.10 world units',quarter.sourceFace);
            check('B0 bb-scene unchanged marker',quarter.b0Fork?.bbScene==='UNCHANGED',quarter.b0Fork);
            check('B0 bb0-boot unchanged marker',quarter.b0Fork?.bb0Boot==='UNCHANGED',quarter.b0Fork);
            check('quarter aspect measured',Number.isFinite(quarter.sourceAspect)&&quarter.sourceAspect>1,quarter.sourceAspect);
            check('quarter face follows source aspect',Math.abs(quarter.faceAspect-quarter.sourceAspect)<0.001,{face:quarter.faceAspect,source:quarter.sourceAspect});
            check('quarter no aspect clamp',quarter.clamped===false,quarter.clamped);
            await page.screenshot({path:'artifacts/billboard-b1/01-card-quarter.png',fullPage:true});

            const cover=await waitMode('cover');
            check('cover page 1 loaded',/cover page 1/.test(cover.content||''),cover.content);
            check('cover face follows source aspect',Math.abs(cover.faceAspect-cover.sourceAspect)<0.001,{face:cover.faceAspect,source:cover.sourceAspect});
            check('cover no aspect clamp',cover.clamped===false,cover.clamped);
            await page.screenshot({path:'artifacts/billboard-b1/02-cover.png',fullPage:true});

            const video=await waitMode('video');
            check('video poster uses Travel source',/Travel VIDEO MTCSwppblk0/.test(video.content||''),video.content);
            check('video face is 16:9',Math.abs(video.faceAspect-16/9)<0.001,video.faceAspect);
            await page.screenshot({path:'artifacts/billboard-b1/03-video-poster.png',fullPage:true});

            let opened=false;
            for(const y of [240,280,320,360,400]){
              await page.mouse.click(720,y);
              opened=await page.locator('#b1-video').evaluate(el=>el.classList.contains('open'));
              if(opened) break;
            }
            check('billboard click opens video player',opened);
            if(opened){
              const src=await page.locator('#b1-video iframe').getAttribute('src');
              check('player is YouTube no-cookie embed',/youtube-nocookie\.com\/embed\/MTCSwppblk0/.test(src||''),src);
              await page.locator('#b1-video-close').click();
            }

            const slogan=await waitMode('slogan');
            check('slogan starts with SHOW IT',slogan.content==='CHATTERBOX SHOW IT',slogan.content);
            check('slogan face uses original 2:1 B0 proportion',Math.abs(slogan.faceAspect-2)<0.001,slogan.faceAspect);
            await page.screenshot({path:'artifacts/billboard-b1/04-slogan.png',fullPage:true});

            check('runtime report has no caught errors',(slogan.errors||[]).length===0,slogan.errors);
            check('no page/console errors',report.errors.length===0,report.errors);
            check('no failed HTTP assets',report.httpErrors.length===0,report.httpErrors);
          }catch(e){
            report.errors.push(String(e?.stack||e));
            process.exitCode=1;
          }finally{
            report.status=process.exitCode?'FAIL':'PASS';
            report.passed=report.checks.filter(x=>x.pass).length;
            report.total=report.checks.length;
            fs.writeFileSync('artifacts/billboard-b1/report.json',JSON.stringify(report,null,2)+'\n');
            console.log(JSON.stringify({
              status:report.status,
              checks:report.passed+'/'+report.total,
              errors:report.errors.length,
              httpErrors:report.httpErrors.length,
              modes:Object.fromEntries(Object.entries(report.modes).map(([k,v])=>[k,{sourceAspect:v.sourceAspect,faceAspect:v.faceAspect,xScale:v.xScale,content:v.content}]))
            },null,2));
            await browser.close();
          }
          JS
          node artifacts/billboard-b1/check.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: billboard-b1-browser-proof
          path: artifacts/billboard-b1
          retention-days: 90


  public-proof:
    needs: browser-proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for exact Cloudflare marker
        run: |
          set -euo pipefail
          URL='https://kayfabizarro.pages.dev/kfb-hub/pruefen/billboard-b1/SOURCE.json'
          ok=0
          for i in $(seq 1 36); do
            body="$(curl -fsS --max-time 20 "$URL" || true)"
            if printf '%s' "$body" | grep -q '"id": "BILLBOARD-B1-2026-09-24"'; then
              printf '%s\n' "$body" > /tmp/source.json
              ok=1
              break
            fi
            echo "marker not deployed yet · attempt $i/36"
            sleep 10
          done
          test "$ok" = 1
          cat /tmp/source.json

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium

      - name: Browser-check exact Cloudflare route
        run: |
          mkdir -p artifacts/billboard-b1-public
          cat > artifacts/billboard-b1-public/check.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const url='https://kayfabizarro.pages.dev/kfb-hub/pruefen/billboard-b1/';
          const report={url,checks:[],errors:[],httpErrors:[],modes:{}};
          const check=(name,pass,detail=null)=>{
            report.checks.push({name,pass:!!pass,detail});
            if(!pass) process.exitCode=1;
          };

          const browser=await chromium.launch({
            headless:true,
            args:['--use-angle=swiftshader','--enable-unsafe-swiftshader']
          });
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          page.on('pageerror',e=>report.errors.push('pageerror: '+String(e)));
          page.on('console',m=>{if(m.type()==='error'&&!/favicon/i.test(m.text()))report.errors.push('console: '+m.text())});
          page.on('response',r=>{if(r.status()>=400&&!/favicon/i.test(r.url()))report.httpErrors.push({status:r.status(),url:r.url()})});

          async function setMode(name,file){
            await page.evaluate((m)=>window.__b1.setMode(m),name);
            await page.waitForFunction((m)=>window.__B1_REPORT__?.mode===m&&window.__B1_REPORT__?.ready===true,name,{timeout:90000});
            await page.waitForTimeout(250);
            const snap=await page.evaluate(()=>structuredClone(window.__B1_REPORT__));
            report.modes[name]=snap;
            check(name+' owner canvas non-black',Number(snap.sourceStats?.mean)>20,snap.sourceStats);
            check(name+' face follows source aspect',Math.abs(Number(snap.faceAspect)-Number(snap.sourceAspect))<0.001,{source:snap.sourceAspect,face:snap.faceAspect});
            await page.screenshot({path:'artifacts/billboard-b1-public/'+file,fullPage:true});
            return snap;
          }

          try{
            const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
            check('Cloudflare HTTP',!!response&&response.ok(),response?.status());
            check('exact B1 title',(await page.title())==='KFB Billboard · B1 Content-Fit Face',await page.title());
            await page.waitForFunction(()=>window.__b1&&window.__B1_REPORT__,{}, {timeout:90000});
            await page.waitForFunction(()=>window.__B1_REPORT__.ready===true,{}, {timeout:90000});

            const q=await page.evaluate(()=>structuredClone(window.__B1_REPORT__));
            report.modes.quarter=q;
            check('B0 bb-scene unchanged marker',q.b0Fork?.bbScene==='UNCHANGED',q.b0Fork);
            check('B0 bb0-boot unchanged marker',q.b0Fork?.bb0Boot==='UNCHANGED',q.b0Fork);
            check('quarter owner canvas non-black',Number(q.sourceStats?.mean)>20,q.sourceStats);
            check('quarter face follows source aspect',Math.abs(Number(q.faceAspect)-Number(q.sourceAspect))<0.001,{source:q.sourceAspect,face:q.faceAspect});
            await page.screenshot({path:'artifacts/billboard-b1-public/01-card-quarter.png',fullPage:true});

            const c=await setMode('cover','02-cover.png');
            check('cover page 1',/cover page 1/.test(c.content||''),c.content);

            const v=await setMode('video','03-video-poster.png');
            check('Travel video id',/MTCSwppblk0/.test(v.content||''),v.content);
            let opened=false;
            for(const y of [240,280,320,360,400]){
              await page.mouse.click(720,y);
              opened=await page.locator('#b1-video').evaluate(el=>el.classList.contains('open'));
              if(opened) break;
            }
            check('billboard click opens player',opened);
            if(opened){
              const src=await page.locator('#b1-video iframe').getAttribute('src');
              check('YouTube no-cookie player',/youtube-nocookie\.com\/embed\/MTCSwppblk0/.test(src||''),src);
              await page.locator('#b1-video-close').click();
            }

            const sl=await setMode('slogan','04-slogan.png');
            check('large slogan starts SHOW IT',sl.content==='CHATTERBOX SHOW IT',sl.content);
            check('slogan keeps 2:1 face',Math.abs(Number(sl.faceAspect)-2)<0.001,sl.faceAspect);
            check('no runtime caught errors',(sl.errors||[]).length===0,sl.errors);
            check('no page/console errors',report.errors.length===0,report.errors);
            check('no failed HTTP assets',report.httpErrors.length===0,report.httpErrors);
          }catch(e){
            report.errors.push(String(e?.stack||e));
            process.exitCode=1;
          }finally{
            report.status=process.exitCode?'FAIL':'PASS';
            report.passed=report.checks.filter(x=>x.pass).length;
            report.total=report.checks.length;
            fs.writeFileSync('artifacts/billboard-b1-public/report.json',JSON.stringify(report,null,2)+'\n');
            console.log(JSON.stringify({
              status:report.status,
              checks:report.passed+'/'+report.total,
              errors:report.errors.length,
              httpErrors:report.httpErrors.length,
              modes:Object.fromEntries(Object.entries(report.modes).map(([k,v])=>[k,{sourceAspect:v.sourceAspect,faceAspect:v.faceAspect,xScale:v.xScale,sourceStats:v.sourceStats,content:v.content}]))
            },null,2));
            await browser.close();
          }
          JS
          node artifacts/billboard-b1-public/check.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: billboard-b1-cloudflare-proof
          path: artifacts/billboard-b1-public
          retention-days: 90
