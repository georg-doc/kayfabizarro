name: One-shot patch ToolBox Birthday latest

on:
  push:
    paths:
      - '.github/workflows/patch-toolbox-birthday-latest.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch latest correction route
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/KFB-ToolBox/_handover/BIRTHDAY_STARTSCREEN_2026-09-15/START_HERE.md')
          s=p.read_text(encoding='utf-8')
          marker='**Grundsatz:** vorhandene Owner und Contracts bleiben unverändert.\n'
          latest='\n**LATEST CORRECTION:** vor weiterer Arbeit `POST_RETURN_CORRECTIONS_2026-09-15.md` und `RETURN_BIRTHDAY_CONSUMER.md` lesen. Player-facing: **Uncle FrizzleBob** · **Little Miss Messy** (`GothGirl` source) · **Hihi Love-Hope**. Der aktuelle FrizzleBob-Export ist Candidate / not final.\n'
          if 'LATEST CORRECTION' not in s:
              s=s.replace(marker,marker+latest,1)
          s=s.replace('### 4.2 Novacyy / GothGirl','### 4.2 Little Miss Messy / source asset GothGirl')
          s=s.replace('`GothGirl` ist der Asset-/Librarian-Name; `Novacyy` ist die Birthday-Player-Identität. Datei nicht umbenennen, wenn das Asset dadurch seine Registry-Identität verliert.','`GothGirl` bleibt Asset-/Librarian-Name; **Little Miss Messy** ist die aktuelle player-facing Rolle. Datei nicht umbenennen, wenn das Asset dadurch seine Registry-Identität verliert.')
          s=s.replace('### 4.3 Hihi','### 4.3 Hihi Love-Hope')
          s=s.replace('| Novacyy/GothGirl |','| Little Miss Messy / GothGirl source |')
          s=s.replace('| Hihi inactive |','| Hihi Love-Hope inactive |')
          s=s.replace('FrizzleBob sowie Novacyy/GothGirl', 'Uncle FrizzleBob sowie Little Miss Messy / source asset GothGirl')
          s=s.replace('und Hihi als inaktiven', 'und Hihi Love-Hope als inaktiven')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'LATEST CORRECTION' tools/KFB-ToolBox/_handover/BIRTHDAY_STARTSCREEN_2026-09-15/START_HERE.md
          grep -q 'Little Miss Messy' tools/KFB-ToolBox/_handover/BIRTHDAY_STARTSCREEN_2026-09-15/START_HERE.md
      - name: Commit and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KFB ToolBox Handoff Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/patch-toolbox-birthday-latest.yml
          git add tools/KFB-ToolBox/_handover/BIRTHDAY_STARTSCREEN_2026-09-15/START_HERE.md
          git commit -m 'docs(toolbox): route Birthday handoff through latest corrections'
          git pull --rebase origin main
          git push origin HEAD:main
