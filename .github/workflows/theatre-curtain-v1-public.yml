name: Theatre Curtain v1 public Stage proof
on:
  push:
    branches:
      - 'chat/gds-theatre-curtain-v1-2026-09-20'
    paths:
      - 'tools/game-dev-studio/qa/theatre-curtain-v1-public.mjs'
      - '.github/workflows/theatre-curtain-v1-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/game-dev-studio/qa/theatre-curtain-v1-public.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax
        run: node --check tools/game-dev-studio/qa/theatre-curtain-v1-public.mjs

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium

      - name: Verify fixed Cloudflare Curtain Stage
        run: node tools/game-dev-studio/qa/theatre-curtain-v1-public.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theatre-curtain-v1-public-evidence
          path: curtain-v1-public-evidence
          retention-days: 14
