name: One-shot extract ToolBox(1) Birthday return

on:
  push:
    paths:
      - '.github/workflows/extract-toolbox-1-birthday-return.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract readable Birthday return files
        shell: bash
        run: |
          set -euo pipefail
          ZIP='tools/KFB-ToolBox/_inbox/KFB ToolBox(1).zip'
          for p in \
            'tools/KFB-ToolBox/_handover/BIRTHDAY_STARTSCREEN_2026-09-15/RETURN_BIRTHDAY_CONSUMER.md' \
            'tools/KFB-ToolBox/_handover/BIRTHDAY_STARTSCREEN_2026-09-15/CHANGELOG.toolbox.md' \
            'tools/KFB-ToolBox/_handover/BIRTHDAY_STARTSCREEN_2026-09-15/profiles/kfb-pet-graft-driver.georg-2026-09-15.json' \
            'tools/KFB-ToolBox/_handover/BIRTHDAY_STARTSCREEN_2026-09-15/qa/QA_EVIDENCE.md' \
            'tools/KFB-ToolBox/_handover/BIRTHDAY_STARTSCREEN_2026-09-15/qa/casting-probe.json'
          do
            mkdir -p "$(dirname "$p")"
            unzip -p "$ZIP" "$p" > "$p.tmp"
            test -s "$p.tmp"
            mv "$p.tmp" "$p"
          done
      - name: Commit and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KFB Intake Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/extract-toolbox-1-birthday-return.yml
          git add tools/KFB-ToolBox/_handover/BIRTHDAY_STARTSCREEN_2026-09-15
          git commit -m 'docs(toolbox): expose Birthday consumer return'
          git pull --rebase origin main
          git push origin HEAD:main
