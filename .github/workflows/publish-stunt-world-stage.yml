name: Publish tested Stunt World Stage mirror

on:
  push:
    branches:
      - publish/stunt-world-stage-2026-09-19
    paths:
      - 'kfb-hub/_deploy/STUNT_WORLD.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-stunt-world-stage
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          sparse-checkout: |
            kfb-hub
            .github/workflows/publish-stunt-world-stage.yml
      - name: Verify public-only Race package and mirror only Stage runtime
        shell: python
        run: |
          import pathlib,urllib.request,zipfile,io,json,hashlib,subprocess,shutil

          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()

          request=json.loads(pathlib.Path('kfb-hub/_deploy/STUNT_WORLD.json').read_text())
          target=pathlib.Path('kfb-hub/stage/stunt-world')
          stage_index=pathlib.Path('kfb-hub/stage/index.html')

          protected_paths=[
            'media','tools','travel',
            'kfb-hub/stunt-race',
            'kfb-hub/free-roam',
            'kfb-hub/stage/vehicle-deformer-v2'
          ]
          protected={p:git('rev-parse','HEAD:'+p) for p in protected_paths}

          url=request['downloadUrl']
          assert url.startswith('https://') and '.oaiusercontent.com/' in url,'Unexpected transport host'
          with urllib.request.urlopen(url,timeout=60) as r:
              data=r.read()
          assert hashlib.sha256(data).hexdigest()==request['artifactSha256'],'Artifact identity mismatch'

          outer=zipfile.ZipFile(io.BytesIO(data))
          assert set(outer.namelist())=={'site.zip','package.json'},outer.namelist()
          pkg=json.loads(outer.read('package.json'))
          inner=outer.read('site.zip')
          assert hashlib.sha256(inner).hexdigest()==pkg['zipSha256']==request['siteZipSha256'],'site.zip identity mismatch'
          assert pkg['sourceCommit']==request['testedRuntimeCommit']
          assert pkg['browserEvidenceCommit']==request['browserEvidenceCommit']
          assert pkg['runtimeFileCount']==9
          assert pkg['publicFileCount']==13

          z=zipfile.ZipFile(io.BytesIO(inner))
          names=set(z.namelist())
          assert 'PUBLIC_MANIFEST.json' in names and 'DEPLOYMENT.json' in names and 'index.html' in names
          manifest=json.loads(z.read('PUBLIC_MANIFEST.json'))
          deployment=json.loads(z.read('DEPLOYMENT.json'))
          assert manifest['implementationSSOT']=='georg-doc/KFB-Stunt-Car-Race'
          assert manifest['testedRuntimeCommit']==request['testedRuntimeCommit']
          assert deployment['implementationSSOT']=='georg-doc/KFB-Stunt-Car-Race'
          assert deployment['testedRuntimeCommit']==request['testedRuntimeCommit']
          assert deployment['browserEvidenceCommit']==request['browserEvidenceCommit']
          assert deployment['route']=='/kfb-hub/stage/stunt-world/'

          allowed=set(manifest['files'])|{'PUBLIC_MANIFEST.json'}
          assert names==allowed,(names-allowed,allowed-names)

          for name in names:
              rel=pathlib.PurePosixPath(name)
              assert not rel.is_absolute() and '..' not in rel.parts
              assert 'tests' not in rel.parts and '_handover' not in rel.parts and '_inbox' not in rel.parts
              assert 'RECOVERY' not in name and 'RETURN' not in name
              if name in manifest['files']:
                  expected=manifest['files'][name]['sha256']
                  assert hashlib.sha256(z.read(name)).hexdigest()==expected,name

          if target.exists():
              shutil.rmtree(target)
          for name in sorted(names):
              p=target/name
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(z.read(name))

          # Promote mirror status only; runtime bytes remain source-identical.
          dep=json.loads((target/'DEPLOYMENT.json').read_text())
          dep['status']='PUBLIC_STAGE_MIRROR_CANDIDATE_HUMAN_ACCEPTANCE_PENDING'
          dep['publicMirrorCommit']='PENDING_BRANCH_COMMIT'
          (target/'DEPLOYMENT.json').write_text(json.dumps(dep,indent=2)+'\n')

          # Update only the existing OSM Stage card, preserving parallel Stage work.
          s=stage_index.read_text()
          old='''<div class="top"><h2>OSM City Drive · C0</h2><span class="badge">Current review</span></div>
      <p>Der aktuelle echte Hürth-/Ehrenfeld-Stadtausschnitt auf der vorhandenen Fahrbasis. Dieser Stand bleibt der Vergleich für C1.</p>
      <div class="facts"><span class="fact">Physics baseline</span><span class="fact">Hürth + Ehrenfeld</span><span class="fact">Grotesque look</span></div>
      <div class="question"><b>Nächster Schnitt:</b> C0 + Vehicle Deformer + TinySkies/Travel-Weltbild, weiterhin mit unveränderter Fahrphysik.</div>
      <div class="actions"><a class="button" href="https://github.com/georg-doc/KFB-Stunt-Car-Race/pull/9">Review / Quelle</a><a class="button" href="https://github.com/georg-doc/kayfabizarro/blob/main/skills/chat/workflows/VEHICLE_DEFORMER_V3_TINYSKIES_2026-09-19/START_HERE.md">C1/v3‑Brief</a></div>'''
          new='''<div class="top"><h2>Stunt World · Hürth → Ehrenfeld</h2><span class="badge">Human gate</span></div>
      <p>Ein durchgehender echter OSM-Korridor auf der vorhandenen C0-Fahrbasis, mit Vehicle Deformer v2 als rein visueller Schicht. Start am Hürth-Join, Ehrenfeld liegt im selben World-Space.</p>
      <div class="facts"><span class="fact">10/10 module PASS</span><span class="fact">26/26 Hürth PASS</span><span class="fact">17/17 corridor PASS</span></div>
      <div class="question"><b>Prüffrage:</b> Fühlt sich die zusammenhängende Hürth→Ehrenfeld-Welt beim Fahren in realem Maßstab kohärent an?</div>
      <div class="actions"><a class="button primary" href="./stunt-world/">Öffnen</a><a class="button" href="https://github.com/georg-doc/KFB-Stunt-Car-Race/pull/12">Race PR #12</a></div>'''
          assert s.count(old)==1,'Expected OSM Stage card changed concurrently'
          stage_index.write_text(s.replace(old,new))

          subprocess.run(['git','add','--',str(target),str(stage_index)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)

          tree=git('write-tree')
          for p,sha in protected.items():
              assert git('rev-parse',tree+':'+p)==sha,'Protected tree changed: '+p

          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','deploy(stage): mirror tested Hürth-Ehrenfeld Stunt World; preserve Race SSOT'],check=True)
          subprocess.run(['git','push','origin','HEAD:'+request['targetBranch']],check=True)

          result={
            'status':'MIRRORED_BRANCH_PUBLIC_URL_PENDING',
            'testedRuntimeCommit':request['testedRuntimeCommit'],
            'browserEvidenceCommit':request['browserEvidenceCommit'],
            'branchCommit':git('rev-parse','HEAD'),
            'publicRoute':request['publicRoute'],
            'fileCount':len(names),
            'artifactSha256':request['artifactSha256'],
            'siteZipSha256':request['siteZipSha256']
          }
          pathlib.Path('deployment-result.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stunt-world-stage-deployment
          path: deployment-result.json
          retention-days: 14
