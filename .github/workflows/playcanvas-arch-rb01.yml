name: PlayCanvas Architecture RB01 layout proof
on:
  push:
    branches: [chatgpt-web/playcanvas-arch-rb01-2026-09-29]
    paths:
      - 'game-container/turbo-kfb/bench/playcanvas-arch-01/style.css'
      - 'game-container/turbo-kfb/bench/playcanvas-arch-01/rb01-proof.mjs'
      - '.github/workflows/playcanvas-arch-rb01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            game-container/turbo-kfb/bench/playcanvas-arch-01
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check game-container/turbo-kfb/bench/playcanvas-arch-01/bench.mjs
          node --check game-container/turbo-kfb/bench/playcanvas-arch-01/rb01-proof.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Start local preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/pc-arch-rb01-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/game-container/turbo-kfb/bench/playcanvas-arch-01/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pc-arch-rb01-http.log
          exit 1
      - name: Browser layout proof
        run: node game-container/turbo-kfb/bench/playcanvas-arch-01/rb01-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playcanvas-arch-rb01-evidence
          path: playcanvas-arch-rb01-evidence
          retention-days: 14
