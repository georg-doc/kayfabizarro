name: ToolBox coherent integration smoke

on:
  push:
    branches:
      - chatgpt-web/toolbox-source-lock-2026-09-23
    paths:
      - 'tools/KFB-ToolBox/stage-first/**'
      - 'tools/KFB-ToolBox/lib/edit-layer.js'
      - '.github/workflows/toolbox-coherent-integration-01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coherent-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static owner and contract checks
        run: node tools/KFB-ToolBox/stage-first/test/coherent-integration-01.static.mjs
      - name: AN-PROFILE-02 static integration checks
        run: node tools/KFB-ToolBox/stage-first/test/an-profile-02.static.mjs
      - name: Install browser runner
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start repository server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/kfb-toolbox-http.log 2>&1 &
          echo $! >/tmp/kfb-toolbox-http.pid
          sleep 2
      - name: Browser coherent-flow smoke
        run: node tools/KFB-ToolBox/stage-first/test/coherent-integration-01.browser.mjs
      - name: Browser AN-PROFILE-02 Animation Studio smoke
        run: node tools/KFB-ToolBox/stage-first/test/an-profile-02.browser.mjs
      - name: Browser AN-PROFILE-02 plain review smoke
        run: node tools/KFB-ToolBox/stage-first/test/an-profile-02-review.browser.mjs
