name: WorldBuilder WB1-P1 Stage review proof
on:
  push:
    branches:
      - 'chatgpt-web/world-builder-p1-environment-profile-2026-09-23'
    paths:
      - 'kfb-hub/stage/toolbox/world-builder-p1-review/**'
      - '.github/workflows/world-builder-p1-stage-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for exact Cloudflare Stage marker
        env:
          URL: https://kayfabizarro.pages.dev/kfb-hub/stage/toolbox/world-builder-p1-review/
        run: |
          for i in $(seq 1 180); do
            BODY="$(curl -fsS "$URL" || true)"
            if printf '%s' "$BODY" | grep -q 'WB1-P1 · STAGE A487294'; then
              echo "DEPLOYED_MARKER_OK attempt=$i"
              exit 0
            fi
            sleep 2
          done
          echo "Cloudflare marker not observed"
          exit 1
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser proof
        env:
          URL: https://kayfabizarro.pages.dev/kfb-hub/stage/toolbox/world-builder-p1-review/
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1440,height:900}});
          const pageErrors = [];
          const requestFailures = [];
          page.on('pageerror', e => pageErrors.push(String(e)));
          page.on('requestfailed', r => requestFailures.push(r.url()+' :: '+(r.failure()?.errorText||'failed')));
          await page.goto(process.env.URL,{waitUntil:'domcontentloaded',timeout:120000});
          await page.waitForFunction(() => window.__WB1_P1?.sourceIsolationRendered === true,{timeout:120000});
          const source = await page.evaluate(() => window.__WB1_P1.snapshot());
          if (!source.sourceIsolationRendered) throw new Error('source isolation marker false');
          if (source.consoleErrors !== 0) throw new Error('source consoleErrors='+source.consoleErrors);
          const status = await page.locator('#status').textContent();
          if (!status?.includes('SOURCE OBJECT RENDERED')) throw new Error('source status='+status);
          await page.locator('#env-btn').click();
          await page.selectOption('#environment','DAY');
          await page.selectOption('#environment','DUSK');
          await page.locator('#torch-toggle').uncheck();
          await page.locator('#torch-toggle').check();
          await page.locator('#local').evaluate((el) => { el.value='1'; el.dispatchEvent(new Event('input',{bubbles:true})); });
          await page.selectOption('#material','MATTE');
          await page.selectOption('#material','SOURCE');
          await page.waitForTimeout(1200);
          const integrated = await page.evaluate(() => window.__WB1_P1.snapshot());
          if (integrated.consoleErrors !== 0) throw new Error('integrated consoleErrors='+integrated.consoleErrors);
          if (integrated.activePool > integrated.poolMax) throw new Error('pool '+integrated.activePool+' > '+integrated.poolMax);
          if (integrated.proof !== 'ENVIRONMENT') throw new Error('proof='+integrated.proof);
          if (pageErrors.length) throw new Error('pageErrors='+JSON.stringify(pageErrors));
          if (requestFailures.length) throw new Error('requestFailures='+JSON.stringify(requestFailures));
          await page.screenshot({path:'wb1-p1-stage-review.png',fullPage:true});
          console.log('SOURCE', JSON.stringify(source));
          console.log('INTEGRATED', JSON.stringify(integrated));
          console.log('STATUS', status);
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wb1-p1-stage-review-evidence
          path: wb1-p1-stage-review.png
          if-no-files-found: ignore
          retention-days: 14
