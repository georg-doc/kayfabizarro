name: Storytelling Map Animator Hub proof

on:
  pull_request:
    paths:
      - 'skills/chat/workflows/KFB_STORYTELLING_MAPS_V1_2026-09-20/**'
      - 'kfb-hub/index.html'
      - 'qa/storytelling-map-animator-hub-public.mjs'
      - '.github/workflows/storytelling-map-animator-hub-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-hub-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Verify public Hub routing
        run: node qa/storytelling-map-animator-hub-public.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storytelling-map-animator-hub-proof
          path: storytelling-map-animator-hub-evidence
          retention-days: 30
