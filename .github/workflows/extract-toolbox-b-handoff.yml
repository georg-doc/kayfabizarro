name: One-shot extract ToolBox B handoff

on:
  push:
    paths:
      - '.github/workflows/extract-toolbox-b-handoff.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract only current WS0 entry and B surface files
        shell: bash
        run: |
          set -euo pipefail
          ZIP='tools/KFB-ToolBox/_inbox/KFB ToolBox.zip'
          for p in \
            'tools/KFB-ToolBox/_inbox/WS0_2026-09-15/START_HERE.md' \
            'tools/KFB-ToolBox/_inbox/WS0_2026-09-15/DELTA_WSA.md' \
            'tools/KFB-ToolBox/_inbox/WS0_2026-09-15/FIELD_COVERAGE.md' \
            'tools/KFB-ToolBox/_inbox/WS0_2026-09-15/RETURN_WSA.md' \
            'tools/KFB-ToolBox/_inbox/WS0_2026-09-15/SOURCE_MANIFEST.json' \
            'tools/KFB-ToolBox/_inbox/WS0_2026-09-15/unpacked/LIES_MICH.md' \
            'tools/KFB-ToolBox/_inbox/WS0_2026-09-15/unpacked/B_OBERFLAECHE/BERICHT_UI_PILOT_v1.md' \
            'tools/KFB-ToolBox/_inbox/WS0_2026-09-15/unpacked/B_OBERFLAECHE/KRITIK_UX_CARL_WEG_v1.md' \
            'tools/KFB-ToolBox/_inbox/WS0_2026-09-15/unpacked/B_OBERFLAECHE/KFB ToolBox Pilot v1.dc.html'
          do
            unzip -p "$ZIP" "$p" > "$p.tmp"
            test -s "$p.tmp"
            mkdir -p "$(dirname "$p")"
            mv "$p.tmp" "$p"
          done
      - name: Commit extracted handoff and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KFB Intake Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/extract-toolbox-b-handoff.yml
          git add tools/KFB-ToolBox/_inbox/WS0_2026-09-15
          git commit -m 'docs(toolbox): expose current WS0 A/B handoff entry files'
          git pull --rebase origin main
          git push origin HEAD:main
