name: AUDIO-STEM-BED-02 mood pool QA

on:
  push:
    branches:
      - 'chatgpt-web/audio-stem-bed-02-mood-pool-2026-10-03'
    paths:
      - 'kfb-hub/stage/audio-stem-bed-02/**'
      - '.github/workflows/audio-stem-bed-02-stage.yml'
  pull_request:
    paths:
      - 'kfb-hub/stage/audio-stem-bed-02/**'
      - '.github/workflows/audio-stem-bed-02-stage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kfb-hub/stage/audio-stem-bed-02
            media/3D_Assets/Sounds/KFB RoadTrip JukeBox v2/Cyclical Warmth Stems (76BPM)
            media/3D_Assets/Sounds/KFB RoadTrip JukeBox v2/Awe Before Drama Stems (82BPM)
            media/3D_Assets/Sounds/KFB RoadTrip JukeBox v2/Buant Groove Stems (105BPM)
            media/3D_Assets/Sounds/KFB RoadTrip JukeBox v2/Dorian Rests Stems (66BPM)
            media/3D_Assets/Sounds/KFB RoadTrip JukeBox v2/Stalking Groove Stems (107BPM)
            .github/workflows/audio-stem-bed-02-stage.yml
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate exact mood-pool donors
        run: node kfb-hub/stage/audio-stem-bed-02/validate.mjs

      - name: Syntax check
        run: |
          node --check kfb-hub/stage/audio-stem-bed-02/mood-pool.js
          node --check kfb-hub/stage/audio-stem-bed-02/qa.mjs

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium

      - name: Start preview
        run: |
          python3 -m http.server 4173 >/tmp/mood-pool-http.log 2>&1 &
          sleep 2

      - name: Browser QA
        run: node kfb-hub/stage/audio-stem-bed-02/qa.mjs

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-stem-bed-02-proof
          path: audio-stem-bed-02-proof/
          retention-days: 14
