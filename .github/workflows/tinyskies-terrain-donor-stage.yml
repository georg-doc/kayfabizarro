name: TinySkies terrain donor · Stage mirror QA

on:
  push:
    branches:
      - stage/tinyskies-terrain-donor-2026-09-19
    paths:
      - 'kfb-hub/stage/stunt-world/tinyskies-terrain-donor/**'
      - 'kfb-hub/stage/index.html'
      - 'kfb-hub/index.html'
      - '.github/workflows/tinyskies-terrain-donor-stage.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'kfb-hub/stage/stunt-world/tinyskies-terrain-donor/**'
      - 'kfb-hub/stage/index.html'
      - 'kfb-hub/index.html'
      - '.github/workflows/tinyskies-terrain-donor-stage.yml'
  workflow_dispatch:

jobs:
  browser-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Mirror/source contract
        run: |
          node --check kfb-hub/stage/stunt-world/tinyskies-terrain-donor/terrain-donor.mjs
          node - <<'NODE'
          const fs=require('fs'), cp=require('child_process');
          const root='kfb-hub/stage/stunt-world/tinyskies-terrain-donor/';
          const d=JSON.parse(fs.readFileSync(root+'DEPLOYMENT.json','utf8'));
          const m=JSON.parse(fs.readFileSync(root+'PUBLIC_MANIFEST.json','utf8'));
          if(d.implementationSSOT!=='georg-doc/KFB-Travel-Globe') throw Error('wrong implementation owner');
          if(d.testedTravelEvidenceHead!=='80cfaa685cdfcdeab7cbd52f2cea6fb16bd8d4f4') throw Error('wrong Travel evidence pin');
          if(d.tinySkiesPin!=='2659a5cc987d7e4a4c5aa7e79c86a1626ad75df6') throw Error('wrong TinySkies pin');
          if(d.voxelRuntime!==false) throw Error('Voxel runtime unexpectedly enabled');
          const blobs=m.publicTravelMirrorBlobs;
          const files={
            'globe.js':'travel/wip/travel_globe_wsa/globe-v13/globe.js',
            'terrain-surface.js':'travel/wip/travel_globe_wsa/globe-v13/terrain-surface.js',
            'simplex-noise.js':'travel/wip/travel_globe_wsa/globe-v13/simplex-noise.js',
            'globe-biome.js':'travel/wip/travel_globe_wsa/globe-v13/globe-biome.js',
            'sky-presets.js':'travel/wip/travel_globe_wsa/globe-v13/sky-presets.js',
            'welt-id.js':'travel/wip/travel_globe_wsa/globe-v13/welt-id.js',
            'erde-maske.js':'travel/wip/travel_globe_wsa/globe-v13/erde-maske.js',
            'rim-light.js':'travel/wip/travel_globe_wsa/globe-v13/rim-light.js'
          };
          for(const [name,path] of Object.entries(files)){
            const got=cp.execFileSync('git',['hash-object',path],{encoding:'utf8'}).trim();
            if(got!==blobs[name]) throw Error(name+' public mirror blob mismatch '+got+' != '+blobs[name]);
          }
          const js=fs.readFileSync(root+'terrain-donor.mjs','utf8');
          if(!js.includes('/travel/wip/travel_globe_wsa/globe-v13/globe.js')) throw Error('viewer does not use public current Travel mirror');
          if(/voxel-terrain|track-terrain-sleeve-st01b/i.test(js)) throw Error('wrong donor leaked into Stage');
          console.log('mirror/source contract PASS');
          NODE

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local public mirror
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/kfb-tiny-terrain-stage.log 2>&1 &
          echo $! > /tmp/kfb-tiny-terrain-stage.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/kfb-hub/stage/stunt-world/tinyskies-terrain-donor/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kfb-tiny-terrain-stage.log
          exit 1

      - name: Real Chromium Stage-mirror proof
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          const url='http://127.0.0.1:4173/kfb-hub/stage/stunt-world/tinyskies-terrain-donor/';
          (async()=>{
            const r={date:new Date().toISOString(),url,checks:[],errors:[],httpErrors:[]};
            const check=(n,p,d)=>{r.checks.push({name:n,pass:!!p,details:d});if(!p)throw Error(n)};
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            const page=await browser.newPage({viewport:{width:1600,height:900}});
            page.on('pageerror',e=>r.errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error'&&!/favicon/i.test(m.text()))r.errors.push(m.text())});
            page.on('response',x=>{if(x.status()>=400&&!/favicon/i.test(x.url()))r.httpErrors.push({status:x.status(),url:x.url()})});
            const t0=Date.now();
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:180000});
            await page.waitForFunction(()=>window.__KFB_TERRAIN_DONOR__?.ready===true,{},{timeout:180000});
            r.bootMs=Date.now()-t0;
            const d=await page.evaluate(()=>window.__KFB_TERRAIN_DONOR__);
            r.snapshot=d;
            check('Travel remains terrain owner',d.owner==='georg-doc/KFB-Travel-Globe',d.owner);
            check('Travel evidence head pin',d.travelHead==='8614282aab2ced43bb5dda9fcf7abadf9768100a',d.travelHead);
            check('TinySkies pin',d.tinySkiesPin==='2659a5cc987d7e4a4c5aa7e79c86a1626ad75df6',d.tinySkiesPin);
            check('no Voxel runtime',d.noVoxelRuntime===true,d.noVoxelRuntime);
            check('same current world/seed',d.baseReport.seed===d.zonedReport.seed&&d.baseReport.typ===d.zonedReport.typ,d.baseReport);
            check('256-segment globe',d.baseReport.segmente===256&&d.baseReport.vertices===66049,d.baseReport);
            check('one existing Travel terrain zone',d.zone.configuredCount===1,d.zone);
            check('zone changes actual baked vertices',d.geometryDelta.changedVertices===1562&&d.geometryDelta.maxDelta>.4,d.geometryDelta);
            check('deformation remains local',d.geometryDelta.changedFraction>0&&d.geometryDelta.changedFraction<.03,d.geometryDelta.changedFraction);
            check('current Travel source probe clean',d.sourceProbe?.fehler===0,d.sourceProbe);
            check('no page/script errors',r.errors.length===0,r.errors);
            check('no failed HTTP assets',r.httpErrors.length===0,r.httpErrors);
            r.status='PASS';
            fs.mkdirSync('stage-proof',{recursive:true});
            await page.screenshot({path:'stage-proof/tinyskies-terrain-donor-stage.png',fullPage:true});
            fs.writeFileSync('stage-proof/results.json',JSON.stringify(r,null,2)+'\n');
            await browser.close();
            console.log(JSON.stringify({status:r.status,checks:r.checks.length,bootMs:r.bootMs,errors:r.errors.length,httpErrors:r.httpErrors.length},null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tinyskies-terrain-donor-stage-proof
          path: stage-proof
