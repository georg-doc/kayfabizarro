name: KFB BlödsinnLand R4.5 canonical writer gate
on:
  push:
    branches: ["songs/frizzlebob_bloedsinnland_alice-r4-2026-10-17"]
permissions:
  contents: read
jobs:
  r44:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: f0f07a27e9e98ee005fc35de61a070853fec2246
          path: .kfb-register-readonly
      - name: Canonical original triplet checker
        run: python3 .kfb-register-readonly/tools/KFB-ToolBox/_inbox/KFB_HUB/30_DECISIONS/replies/triplet_set_check.py songs/frizzlebob_bloedsinnland_alice/frizzlebob_bloedsinnland_alice.r31.qa.deck.json songs/frizzlebob_bloedsinnland_alice/frizzlebob_bloedsinnland_alice.r31.qa.set.csv
      - name: Canonical original song gate
        run: python3 .kfb-register-readonly/tools/KFB-ToolBox/_inbox/KFB_HUB/30_DECISIONS/replies/song_gate.py lyrics songs/frizzlebob_bloedsinnland_alice/frizzlebob_bloedsinnland_alice.r4.5.suno.txt --deck songs/frizzlebob_bloedsinnland_alice/frizzlebob_bloedsinnland_alice.r31.qa.deck.json --songlines songs/frizzlebob_bloedsinnland_alice/frizzlebob_bloedsinnland_alice.r4.4.songlines.json --cards 1-30 --tone frizzlebob_bloedsinnland_alice --corpus .kfb-register-readonly/tools/KFB-ToolBox/_inbox/KFB_HUB/30_DECISIONS/replies/OPENER_ARC_R2

      - name: Original style gate
        run: python3 .kfb-register-readonly/tools/KFB-ToolBox/_inbox/KFB_HUB/30_DECISIONS/replies/song_gate.py style songs/frizzlebob_bloedsinnland_alice/frizzlebob_bloedsinnland_alice.r4.5.style.txt --corpus .kfb-register-readonly/tools/KFB-ToolBox/_inbox/KFB_HUB/30_DECISIONS/replies/OPENER_ARC_R2
