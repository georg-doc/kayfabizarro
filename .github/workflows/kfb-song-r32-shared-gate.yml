name: KFB 1001 R3.2 Shared Song Gate
on:
  push:
    branches: ["songs/1001_kayfabe_nights-r4-2026-10-17"]
permissions:
  contents: read
jobs:
  shared-r32-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 3c72b727e8a694a51de7ab5033b7a4eae92c1062
          path: .kfb-register-readonly
      - name: R3.2 song_gate.py — Part One
        run: python3 .kfb-register-readonly/tools/KFB-ToolBox/_inbox/KFB_HUB/30_DECISIONS/replies/song_gate.py lyrics songs/1001_kayfabe_nights/1001_kayfabe_nights.part1.r4.2.suno.txt --deck registry/assets/v1/decks/1001_kayfabe_nights.json --media media/kfb/1001_Kayfabe_Nights_-_ADD_web_ID.pdf.json --songlines songs/1001_kayfabe_nights/1001_kayfabe_nights.songlines.json --cards 5-32 --tone 1001_kayfabe_nights --corpus .kfb-register-readonly/tools/KFB-ToolBox/_inbox/KFB_HUB/30_DECISIONS/replies/OPENER_ARC_R2
      - name: R3.2 song_gate.py — Part Two
        run: python3 .kfb-register-readonly/tools/KFB-ToolBox/_inbox/KFB_HUB/30_DECISIONS/replies/song_gate.py lyrics songs/1001_kayfabe_nights/1001_kayfabe_nights.part2.r4.2.suno.txt --deck registry/assets/v1/decks/1001_kayfabe_nights.json --media media/kfb/1001_Kayfabe_Nights_-_ADD_web_ID.pdf.json --songlines songs/1001_kayfabe_nights/1001_kayfabe_nights.songlines.json --cards 33-60 --tone 1001_kayfabe_nights --corpus .kfb-register-readonly/tools/KFB-ToolBox/_inbox/KFB_HUB/30_DECISIONS/replies/OPENER_ARC_R2
