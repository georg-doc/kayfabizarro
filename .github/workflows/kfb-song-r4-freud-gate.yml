name: KFB Freud R3.1 lyric gate
on:
  push:
    branches:
      - "songs/dream_wrestling_with_kayfabe_freud-r4-2026-10-17"
permissions:
  contents: read
jobs:
  r31:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact plugin lexical
        run: python3 songs/dream_wrestling_with_kayfabe_freud/triplet_set_check.py songs/dream_wrestling_with_kayfabe_freud/dream_wrestling_with_kayfabe_freud.r31.qa.deck.json songs/dream_wrestling_with_kayfabe_freud/dream_wrestling_with_kayfabe_freud.r31.qa.set.csv
      - name: R3.1 format
        run: python3 songs/dream_wrestling_with_kayfabe_freud/format_gate_r31.py
