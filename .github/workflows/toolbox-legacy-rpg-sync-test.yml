name: ToolBox Legacy RPG KLR-SYNC-01
on:
  push:
    branches:
      - chatgpt-web/toolbox-legacy-rpg-rigging-2026-09-21
    paths:
      - 'tools/KFB-ToolBox/legacy-rpg-rigging/**'
      - 'kfb-hub/stage/toolbox/legacy-rpg-rigging/**'
      - '.github/workflows/toolbox-legacy-rpg-sync-test.yml'
  pull_request:
    paths:
      - 'tools/KFB-ToolBox/legacy-rpg-rigging/**'
      - 'kfb-hub/stage/toolbox/legacy-rpg-rigging/**'
      - '.github/workflows/toolbox-legacy-rpg-sync-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  klr-sync-01:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/KFB-ToolBox/legacy-rpg-rigging
            kfb-hub/stage/toolbox/legacy-rpg-rigging
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contract and syntax
        run: |
          node --experimental-vm-modules tools/KFB-ToolBox/legacy-rpg-rigging/tests/static-check.mjs
          node --check tools/KFB-ToolBox/legacy-rpg-rigging/app.js
          node --check tools/KFB-ToolBox/legacy-rpg-rigging/sync-proof.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Start local Stage mirror
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/legacy-rpg-sync-http.log 2>&1 &
          echo $! > /tmp/legacy-rpg-sync-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/kfb-hub/stage/toolbox/legacy-rpg-rigging/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/legacy-rpg-sync-http.log
          exit 1
      - name: KLR-SYNC-01 browser proof
        env:
          KLR_SYNC_PROOF_DIR: legacy-rpg-sync-evidence
        run: node tools/KFB-ToolBox/legacy-rpg-rigging/sync-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: klr-sync-01-evidence
          path: legacy-rpg-sync-evidence
          retention-days: 14
