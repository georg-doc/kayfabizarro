name: WSA MVP consolidation · public Stage proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wsa-mvp-consolidation-stage.yml'
      - 'kfb-hub/stage/wsa-mvp-consolidation/**'
      - 'kfb-hub/index.html'
      - 'kfb-hub/stage/index.html'
      - 'skills/chat/workflows/WSA_MVP_CONSOLIDATION_2026-09-20/**'

permissions:
  contents: read

jobs:
  public-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ROUTE: https://kayfabizarro.pages.dev/kfb-hub/stage/wsa-mvp-consolidation/
      SOURCE: https://kayfabizarro.pages.dev/kfb-hub/stage/wsa-mvp-consolidation/SOURCE.json
      HUB: https://kayfabizarro.pages.dev/kfb-hub/
      STAGE: https://kayfabizarro.pages.dev/kfb-hub/stage/
      BUILD: KFB-WSA-MVP-CONSOLIDATION-20260920
      SOURCE_HEAD: 02a127cc3625887b3f66b402c0b45d49322c09ed
    steps:
      - uses: actions/checkout@v4

      - name: Wait for exact published marker
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in {1..18}; do
            if curl -fsSL --max-time 15 "$SOURCE" -o /tmp/source.json &&
               grep -Fq "$BUILD" /tmp/source.json &&
               grep -Fq "$SOURCE_HEAD" /tmp/source.json; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = 1
          python3 -m json.tool /tmp/source.json >/dev/null

      - name: HTTP and marker proof
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "$ROUTE" -o /tmp/route.html
          curl -fsSL "$HUB" -o /tmp/hub.html
          curl -fsSL "$STAGE" -o /tmp/stage.html
          grep -Fq 'WSA MVP Consolidation' /tmp/route.html
          grep -Fq "id:'wsa-mvp-consolidation'" /tmp/hub.html
          grep -Fq '24/24 handoff PASS' /tmp/stage.html

      - name: Headless Chrome visible proof
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --window-size=1440,1000             --dump-dom "$ROUTE" > /tmp/dom.html
          grep -Fq 'WSA MVP Consolidation' /tmp/dom.html
          "$CHROME" --headless --no-sandbox --disable-gpu --window-size=1440,1000             --screenshot="$GITHUB_WORKSPACE/wsa-mvp-consolidation.png" "$ROUTE"

      - name: Write evidence
        shell: bash
        run: |
          cat > public-proof.txt <<EOF
          route=$ROUTE
          build=$BUILD
          sourceHead=$SOURCE_HEAD
          routeMarker=PASS
          sourceMarker=PASS
          hubCard=PASS
          stageCard=PASS
          headlessChrome=PASS
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: wsa-mvp-consolidation-public-proof
          path: |
            public-proof.txt
            wsa-mvp-consolidation.png
