name: GROUND-ORBIT-INTEGRATION-01 public Stage proof
on:
  push:
    branches: [cloudflare-live]
    paths:
      - 'kfb-hub/stage/game-container/ground-orbit-integration-01/**'
      - '.github/workflows/kfb-ground-orbit-integration01-public.yml'
      - 'kfb-hub/stage/hub-ui-v2/index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kfb-hub/stage/game-container/ground-orbit-integration-01
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for exact Cloudflare revision
        shell: bash
        run: |
          URL='https://kayfabizarro.pages.dev/kfb-hub/stage/game-container/ground-orbit-integration-01/DEPLOYMENT.json'
          WANT='9a71c79d63cd985f0ab622e4309656ab522ccea4'
          for i in {1..90}; do
            BODY="$(curl -fsS "$URL" 2>/dev/null || true)"
            if printf '%s' "$BODY" | grep -q "$WANT"; then
              printf '%s\n' "$BODY"
              exit 0
            fi
            sleep 4
          done
          echo "Exact Cloudflare revision did not appear"
          exit 1
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Public Chromium proof
        run: |
          mkdir -p ground-orbit-integration01-public-evidence
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          const STAGE='https://kayfabizarro.pages.dev/kfb-hub/stage/game-container/ground-orbit-integration-01/?ground=1&groundFeel=velocity';
          const HUB='https://kayfabizarro.pages.dev/kfb-hub/#briefings';
          const WANT='9a71c79d63cd985f0ab622e4309656ab522ccea4';
          const checks=[];
          const ok=(name,cond,extra='')=>{checks.push({name,pass:!!cond,extra});if(!cond)throw new Error('FAIL '+name+(extra?' · '+extra:''));console.log('PASS',name,extra);};
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
          const key=async(type,code,k)=>page.evaluate(({type,code,k})=>window.dispatchEvent(new KeyboardEvent(type,{code,key:k,bubbles:true,cancelable:true})),{type,code,k});
          try{
            await page.goto(STAGE,{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(()=>window.__game?.state==='ground'&&window.__game?.world?.groundPlayer?.ready===true,null,{timeout:45000});
            const meta=await page.locator('meta[name="kfb-source-head"]').getAttribute('content');
            ok('exact runtime marker visible',meta===WANT,meta||'missing');
            const g0=await page.evaluate(()=>window.__game.world.groundPlayer.report());
            ok('velocity candidate active',g0.feelMode==='velocity'&&g0.enhanced===true,JSON.stringify({feel:g0.feelMode,enhanced:g0.enhanced}));
            ok('Running_B bound',g0.clips.includes('Running_B'),JSON.stringify(g0.clips));
            ok('directional clips bound',g0.clips.includes('Walking_Backwards')&&g0.clips.includes('Running_Strafe_Left')&&g0.clips.includes('Running_Strafe_Right'));
            ok('actor-scale jump marker',g0.jump?.apex>1&&g0.jump?.apex<1.4,JSON.stringify(g0.jump));
            const orbit0=await page.evaluate(()=>{
              const w=window.__game.world,r=w.groundOrbit?.report?.(),c=window.__game.camera.position;
              return {r,c:{x:c.x,y:c.y,z:c.z},heading:w.groundPlayer.heading};
            });
            ok('Orbit owner mounted',!!orbit0.r&&orbit0.r.enabled===true,JSON.stringify(orbit0.r));
            await page.evaluate(()=>{
              const canvas=document.getElementById('game-canvas');
              const fire=(type,x,y,buttons,button=0)=>canvas.dispatchEvent(new PointerEvent(type,{pointerId:23,pointerType:'mouse',clientX:x,clientY:y,button,buttons,bubbles:true,cancelable:true}));
              fire('pointerdown',720,420,1,0); fire('pointermove',520,360,1,0); fire('pointerup',520,360,0,0);
              for(let i=0;i<24;i++)window.__game.world.groundOrbit.update(1/60,window.__game.world.groundPlayer);
            });
            const orbit1=await page.evaluate(()=>{const r=window.__game.world.groundOrbit.report(),c=window.__game.camera.position;return {r,c:{x:c.x,y:c.y,z:c.z}}});
            const camMove=Math.hypot(orbit1.c.x-orbit0.c.x,orbit1.c.y-orbit0.c.y,orbit1.c.z-orbit0.c.z);
            ok('Orbit drag changes yaw',Math.abs(orbit1.r.targetYaw-orbit0.r.targetYaw)>.5,JSON.stringify({before:orbit0.r.targetYaw,after:orbit1.r.targetYaw}));
            ok('Orbit drag moves camera',camMove>1,'distance='+camMove.toFixed(2));
            await page.evaluate(()=>{
              document.getElementById('game-canvas').dispatchEvent(new WheelEvent('wheel',{deltaY:-420,bubbles:true,cancelable:true}));
              for(let i=0;i<24;i++)window.__game.world.groundOrbit.update(1/60,window.__game.world.groundPlayer);
            });
            const orbit2=await page.evaluate(()=>window.__game.world.groundOrbit.report());
            ok('Orbit wheel zoom works',orbit2.targetDistance<orbit1.r.targetDistance-.2,JSON.stringify({before:orbit1.r.targetDistance,after:orbit2.targetDistance}));
            await key('keydown','KeyC','c'); await key('keyup','KeyC','c');
            await page.evaluate(()=>{for(let i=0;i<28;i++)window.__game.world.groundOrbit.update(1/60,window.__game.world.groundPlayer)});
            const rec=await page.evaluate(()=>{
              const w=window.__game.world,r=w.groundOrbit.report();
              const expected=((w.groundPlayer.heading+Math.PI+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;
              return Math.atan2(Math.sin(r.targetYaw-expected),Math.cos(r.targetYaw-expected));
            });
            ok('Orbit C recenter works',Math.abs(rec)<.02,String(rec));
            await key('keydown','KeyW','w'); await page.evaluate(()=>window.__game.advanceBy(.8));
            const walk=await page.evaluate(()=>window.__game.world.groundPlayer.report());
            ok('public Walk active',walk.currentAnimation==='Walking_A',walk.currentAnimation);
            await key('keydown','ShiftLeft','Shift'); await page.evaluate(()=>window.__game.advanceBy(.75));
            const sprint=await page.evaluate(()=>window.__game.world.groundPlayer.report());
            ok('public Sprint uses Running_B',sprint.currentAnimation==='Running_B'&&sprint.semantic==='sprint',JSON.stringify({a:sprint.currentAnimation,s:sprint.semantic,v:sprint.speed}));
            await key('keydown','Space',' '); await key('keyup','Space',' '); await page.evaluate(()=>window.__game.advanceBy(.36));
            const air=await page.evaluate(()=>window.__game.world.groundPlayer.report());
            ok('public Jump reaches air',air.onGround===false&&air.currentAnimation==='Jump_Idle',JSON.stringify({g:air.onGround,a:air.currentAnimation}));
            await page.evaluate(()=>window.__game.advanceBy(.7));
            const land=await page.evaluate(()=>window.__game.world.groundPlayer.report());
            ok('public Jump lands',land.onGround===true,JSON.stringify({g:land.onGround,a:land.currentAnimation}));
            await key('keyup','ShiftLeft','Shift'); await key('keyup','KeyW','w');
            ok('runtime errors empty',(await page.evaluate(()=>window.__game.errors())).length===0,JSON.stringify(await page.evaluate(()=>window.__game.errors())));
            ok('page errors empty',errors.length===0,JSON.stringify(errors));
            await page.screenshot({path:'ground-orbit-integration01-public-evidence/stage.png',fullPage:true});
            await page.goto(HUB,{waitUntil:'domcontentloaded',timeout:45000});
            const link=page.locator('a[href*="ground-orbit-integration-01"]').first();
            ok('Hub contains integrated link',await link.count()===1);
            const href=await link.getAttribute('href');
            ok('Hub link targets integrated route',String(href||'').includes('/kfb-hub/stage/game-container/ground-orbit-integration-01/'),href||'missing');
            await page.screenshot({path:'ground-orbit-integration01-public-evidence/hub.png',fullPage:true});
            await fs.writeFile('ground-orbit-integration01-public-evidence/report.json',JSON.stringify({stage:STAGE,hub:HUB,revision:WANT,checks,errors,testedAt:new Date().toISOString()},null,2));
            console.log('RESULT',checks.filter(c=>c.pass).length+'/'+checks.length,'PASS');
          }finally{await browser.close()}
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ground-orbit-integration01-public-evidence
          path: ground-orbit-integration01-public-evidence/
          retention-days: 30
