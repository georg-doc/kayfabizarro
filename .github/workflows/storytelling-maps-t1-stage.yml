name: Storytelling Maps T1 public proof
on:
  pull_request:
    paths:
      - 'kfb-hub/stage/storytelling-maps/t1-donors/**'
      - '.github/workflows/storytelling-maps-t1-stage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static checks
        run: |
          node --check kfb-hub/stage/storytelling-maps/t1-donors/src/main.js
          node -e "const fs=require('fs'); for(const p of ['kfb-hub/stage/storytelling-maps/t1-donors/DEPLOYMENT.json','kfb-hub/stage/storytelling-maps/t1-donors/SOURCE.json']) JSON.parse(fs.readFileSync(p,'utf8')); console.log('JSON PASS')"
          grep -q "playerstand_red.gltf" kfb-hub/stage/storytelling-maps/t1-donors/src/main.js
          grep -q "playercard_knight_red.gltf" kfb-hub/stage/storytelling-maps/t1-donors/src/main.js
          grep -q "D20_red.gltf" kfb-hub/stage/storytelling-maps/t1-donors/src/main.js
          grep -q "@3d-dice/dice-box-threejs@0.0.12" kfb-hub/stage/storytelling-maps/t1-donors/src/main.js
      - run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Verify fixed Cloudflare Stage
        run: node kfb-hub/stage/storytelling-maps/t1-donors/qa/public.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storytelling-maps-t1-public-proof
          path: storytelling-maps-t1-evidence
          retention-days: 30
