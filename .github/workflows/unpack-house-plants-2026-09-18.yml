name: One-shot unpack Tiny Treats House Plants 2026-09-18

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/unpack-house-plants-2026-09-18.yml"

permissions:
  contents: write

concurrency:
  group: kfb-unpack-house-plants-2026-09-18
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Verify and unpack House Plants ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, shutil, stat, subprocess, tempfile, zipfile
          from pathlib import Path, PurePosixPath

          root=Path.cwd()
          zip_rel="media/3D_Assets/Tiny_Treats_House_Plants_1.0_FREE 2.zip"
          expected_blob="7f4d1581c6f56d4090f9d728f4b684dceccfff4a"
          target_rel="media/3D_Assets/Tiny_Treats_House_Plants_1.0_FREE 2"
          zpath=root/zip_rel
          target=root/target_rel
          if not zpath.is_file(): raise SystemExit("MISSING ZIP")
          actual=subprocess.check_output(["git","hash-object",str(zpath)],text=True).strip()
          if actual!=expected_blob: raise SystemExit(f"BLOB MISMATCH {actual}")
          if target.exists(): raise SystemExit("TARGET ALREADY EXISTS")

          with tempfile.TemporaryDirectory(prefix="kfb-houseplants-") as td:
              tmp=Path(td)
              with zipfile.ZipFile(zpath) as z:
                  infos=[i for i in z.infolist() if not i.is_dir()]
                  if not infos: raise SystemExit("EMPTY ZIP")
                  for info in infos:
                      p=PurePosixPath(info.filename)
                      if p.is_absolute() or ".." in p.parts: raise SystemExit(f"UNSAFE PATH {info.filename}")
                      mode=(info.external_attr>>16)&0xFFFF
                      if stat.S_ISLNK(mode): raise SystemExit(f"SYMLINK NOT ALLOWED {info.filename}")
                  z.extractall(tmp)

              for p in sorted(tmp.rglob("*"),reverse=True):
                  if p.name in {".DS_Store","Thumbs.db"} or "__MACOSX" in p.parts:
                      if p.is_dir(): shutil.rmtree(p,ignore_errors=True)
                      else: p.unlink(missing_ok=True)

              desired=tmp/Path(target_rel).name
              if desired.is_dir():
                  source=desired
              else:
                  top=[p for p in tmp.iterdir()]
                  dirs=[p for p in top if p.is_dir()]
                  files=[p for p in top if p.is_file()]
                  if len(dirs)==1 and not files:
                      source=dirs[0]
                  else:
                      names={p.name for p in top}
                      if "Assets" in names or "Models" in names or "gltf" in {n.lower() for n in names}:
                          source=tmp
                      else:
                          raise SystemExit(f"AMBIGUOUS ROOT {sorted(names)}")
              shutil.copytree(source,target)

          files=[p for p in target.rglob("*") if p.is_file()]
          model_ext={".glb",".gltf",".fbx",".obj",".dae"}
          models=[p for p in files if p.suffix.lower() in model_ext]
          if not models: raise SystemExit("NO MODELS EXTRACTED")
          exts={}
          for p in files:
              e=p.suffix.lower() or "<none>"
              exts[e]=exts.get(e,0)+1
          report={
            "schema":"kfb.asset-pack-unpack/1",
            "date":"2026-09-18",
            "status":"SOURCE_RECEIVED_UNPACKED_REGISTRY_REFRESH_REQUESTED",
            "zipPath":zip_rel,
            "zipBlobSha":actual,
            "targetPath":target_rel,
            "fileCount":len(files),
            "bytes":sum(p.stat().st_size for p in files),
            "modelFileCount":len(models),
            "formats":dict(sorted(exts.items())),
            "licensePresent":any(p.name.lower().startswith("license") for p in files),
            "zipPreserved":True
          }
          out=root/"media/3D_Assets/TINY_TREATS_HOUSE_PLANTS_UNPACK_2026-09-18.json"
          out.write_text(json.dumps(report,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,indent=2))
          PY

      - name: Commit extracted pack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             "media/3D_Assets/Tiny_Treats_House_Plants_1.0_FREE 2"             "media/3D_Assets/TINY_TREATS_HOUSE_PLANTS_UNPACK_2026-09-18.json"
          git diff --cached --stat
          git commit -m "assets: unpack Tiny Treats House Plants pack"
          git pull --rebase origin main
          git push origin HEAD:main
