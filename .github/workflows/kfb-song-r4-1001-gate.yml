name: KFB 1001 R3.1 lyric gate
on:
  push:
    branches:
      - "songs/1001_kayfabe_nights-r4-2026-10-17"
permissions:
  contents: read
jobs:
  r31:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact plugin lexical gate
        run: python3 songs/1001_kayfabe_nights/triplet_set_check.py songs/1001_kayfabe_nights/1001_kayfabe_nights.r31.qa.deck.json songs/1001_kayfabe_nights/1001_kayfabe_nights.r31.qa.set.csv
      - name: R3.1 gate
        run: python3 songs/1001_kayfabe_nights/format_gate_r31.py
