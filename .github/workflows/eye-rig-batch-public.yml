name: KFB EyeRig Batch public Stage proof

on:
  push:
    branches: [cloudflare-live]
    paths:
      - 'kfb-hub/stage/toolbox/eye-rig-batch/**'
      - '.github/workflows/eye-rig-batch-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify fixed Cloudflare EyeRig Stage
        run: |
          mkdir -p public-proof
          cat > public-proof/check.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const BASE='https://kayfabizarro.pages.dev/kfb-hub/stage/toolbox/eye-rig-batch/';
          const WANT={
            sourcePR:104,
            sourceHead:'1416092e87018ce32507d4d91e1d13d39f62c1ac',
            implementationCheckpoint:'c6608ab5c76509bb54ae6b4375b87ed338e61427'
          };
          const result={url:BASE,want:WANT,checks:[],errors:[],screenshots:[],status:'RUNNING'};
          const check=(name,pass,detail)=>{result.checks.push({name,pass:Boolean(pass),detail});if(!pass)throw Error(name+' :: '+JSON.stringify(detail))};
          const pause=ms=>new Promise(r=>setTimeout(r,ms));
          let browser,page;

          async function shot(name){
            const p='public-proof/'+name+'.png';
            await page.screenshot({path:p,fullPage:false});
            result.screenshots.push(p);
          }

          try{
            let marker=null,ready=false;
            for(let i=0;i<42;i++){
              try{
                const r=await fetch(BASE+'DEPLOYMENT.json?ci='+Date.now(),{cache:'no-store'});
                if(r.ok){
                  marker=await r.json();
                  if(marker.sourcePR===WANT.sourcePR &&
                     marker.sourceHead===WANT.sourceHead &&
                     marker.implementationCheckpoint===WANT.implementationCheckpoint){
                    ready=true;break;
                  }
                }
              }catch{}
              await pause(10000);
            }
            check('deployment marker',ready,marker);

            browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            page=await browser.newPage({viewport:{width:1440,height:900}});
            page.on('pageerror',e=>result.errors.push('pageerror: '+String(e)));
            page.on('console',m=>{if(m.type()==='error')result.errors.push('console: '+m.text())});

            const response=await page.goto(BASE+'?ci='+Date.now(),{waitUntil:'domcontentloaded',timeout:180000});
            check('stage http',response?.ok(),response?.status());

            await page.waitForFunction(
              ()=>window.__EYE_RIG_BATCH && typeof window.__EYE_RIG_BATCH.report==='function' &&
                  document.querySelector('#bootBadge')?.textContent!=='BOOTING',
              {},
              {timeout:180000}
            );

            const initial=await page.evaluate(()=>({
              title:document.title,
              marker:document.querySelector('.branch')?.textContent||'',
              boot:document.querySelector('#bootBadge')?.textContent||'',
              report:window.__EYE_RIG_BATCH.report()
            }));

            check('page title',/Batch EyeRig Atlas/.test(initial.title),initial.title);
            check('visible revision marker',initial.marker.includes('Rig_Medium')&&initial.marker.includes('PR #104'),initial.marker);
            check('runtime no boot error',!initial.report.error,initial.report.error);
            check('source gate',initial.report.gates?.source===true,initial.report.gates);
            check('cleanup gate',initial.report.gates?.cleanup===true,initial.report.cleanup);
            check('facehost gate',initial.report.gates?.host===true,initial.report.eyes?.faceHost);
            check('eyerig gate',initial.report.gates?.eye===true,initial.report.eyes?.eyeFrame);
            check('motion gate',initial.report.gates?.motion===true,initial.report.clips);
            check('12 source components',initial.report.cleanup?.connectedComponents===12,initial.report.cleanup);
            check('eye components 2+3',
              JSON.stringify((initial.report.cleanup?.eyeCandidates||[]).map(x=>x.component))===JSON.stringify([2,3]),
              initial.report.cleanup?.eyeCandidates);
            check('source-measured seed report-only',
              initial.report.cleanup?.sourceMeasuredSeed?.status==='MEASURED_NOT_APPLIED' &&
              ['dx','dy','ring'].every(k=>Number.isFinite(initial.report.cleanup?.sourceMeasuredSeed?.anchorCandidate?.[k])),
              initial.report.cleanup?.sourceMeasuredSeed);
            check('eyeFrame ready',Boolean(initial.report.eyes?.eyeFrame?.left&&initial.report.eyes?.eyeFrame?.right),initial.report.eyes?.eyeFrame);
            check('required clips',
              ['Idle_A','Walking_A','Running_A','Jump_Full_Short'].every(x=>initial.report.clips.includes(x)),
              initial.report.clips);

            const measuredTarget=initial.report.cleanup?.sourceMeasuredSeed?.anchorCandidate;
            const p=initial.report.profile?.eye, a0=p?.anchor, oval=p?.oval;
            check('Rig_Medium authoring default',
              Math.abs(a0?.dx-0.295)<1e-6 &&
              Math.abs(a0?.dy-0.045)<1e-6 &&
              Math.abs(a0?.ring-0.153)<1e-6 &&
              Math.abs(a0?.track-0.15)<1e-6 &&
              Math.abs(p?.pupilSize-0.34)<1e-6 &&
              Math.abs(p?.inset-0.40)<1e-6 &&
              Math.abs(p?.lidFit-0.90)<1e-6 &&
              Math.abs(p?.converge-0.18)<1e-6 &&
              Math.abs(p?.splay-0)<1e-6 &&
              Math.abs(p?.gloss-0.10)<1e-6,
              p);
            check('source measurement suggestion only',
              ['dx','dy','ring'].every(k=>Number.isFinite(measuredTarget?.[k])) &&
              Math.abs(a0?.ring-measuredTarget?.ring)>1e-3,
              {authoring:a0,measuredTarget});
            check('GothGirl pupil default 0.34',Math.abs(p?.pupilSize-0.34)<1e-6,p?.pupilSize);
            check('lid base uses GothGirl face color',
              initial.report.eyes?.controls?.baseColor==='#e6cbc3' &&
              p?.lidColorMode==='face-base-darkened',
              {baseColor:initial.report.eyes?.controls?.baseColor,lidColorMode:p?.lidColorMode});
            check('oval donor neutral default',
              oval?.w===1 && oval?.h===1 && oval?.d===1 && oval?.tilt===0,
              oval);
            check('tracking default Life',p?.trackingMode==='life',p?.trackingMode);
            check('batchbar visible',
              await page.locator('.batchbar').isVisible() &&
              await page.locator('#batchApplySelectedBtn').isVisible(),
              await page.locator('#batchSelectionStatus').textContent());
            check('Medium actor catalog 27',
              initial.report.roster?.count===27 &&
              await page.locator('#actorList [data-actor-id]').count()===27,
              {runtime:initial.report.roster,dom:await page.locator('#actorList [data-actor-id]').count()});
            check('Next unreviewed visible',
              await page.locator('#nextUnreviewedBtn').isVisible(),
              await page.locator('#nextUnreviewedBtn').textContent());
            check('measured baseline button available',
              !(await page.locator('#useMeasuredBtn').isDisabled()),
              await page.locator('#useMeasuredBtn').textContent());
            await page.click('#useMeasuredBtn');
            await pause(220);
            const measuredApplied=await page.evaluate(()=>window.__EYE_RIG_BATCH.report());
            check('measured baseline explicit apply',
              ['dx','dy','ring'].every(k=>Math.abs(measuredApplied.profile?.eye?.anchor?.[k]-measuredTarget?.[k])<1e-6) &&
              measuredApplied.profile?.status==='AUTO_CANDIDATE',
              {target:measuredTarget,actual:measuredApplied.profile?.eye?.anchor,status:measuredApplied.profile?.status});
            await shot('00-source-measured-baseline');

            await page.click('#resetSeedBtn');
            await pause(220);
            const resetApplied=await page.evaluate(()=>window.__EYE_RIG_BATCH.report());
            check('reset seed restores Medium authoring default',
              Math.abs(resetApplied.profile?.eye?.anchor?.dx-0.295)<1e-6 &&
              Math.abs(resetApplied.profile?.eye?.anchor?.dy-0.045)<1e-6 &&
              Math.abs(resetApplied.profile?.eye?.anchor?.ring-0.153)<1e-6 &&
              Math.abs(resetApplied.profile?.eye?.anchor?.track-0.15)<1e-6 &&
              Math.abs(resetApplied.profile?.eye?.pupilSize-0.34)<1e-6 &&
              Math.abs(resetApplied.profile?.eye?.inset-0.40)<1e-6 &&
              Math.abs(resetApplied.profile?.eye?.converge-0.18)<1e-6,
              resetApplied.profile?.eye);

            await page.locator('[data-param="ovalW"]').evaluate(el=>{el.value='1.12';el.dispatchEvent(new Event('input',{bubbles:true}))});
            await page.locator('[data-param="ovalTilt"]').evaluate(el=>{el.value='8';el.dispatchEvent(new Event('input',{bubbles:true}))});
            await pause(160);
            const ovalEdited=await page.evaluate(()=>window.__EYE_RIG_BATCH.report());
            check('oval donor edits apply',
              Math.abs(ovalEdited.profile?.eye?.oval?.w-1.12)<1e-6 &&
              Math.abs(ovalEdited.profile?.eye?.oval?.tilt-8)<1e-6 &&
              Math.abs(ovalEdited.eyes?.controls?.oval?.w-1.12)<1e-6,
              {profile:ovalEdited.profile?.eye?.oval,rig:ovalEdited.eyes?.controls?.oval});

            await page.click('[data-tracking-mode="pointer"]'); await pause(80);
            let tracking=await page.evaluate(()=>window.__EYE_RIG_BATCH.report());
            check('tracking Pointer mode',tracking.profile?.eye?.trackingMode==='pointer',tracking.profile?.eye?.trackingMode);
            await page.click('[data-gaze="0,-0.85"]'); await pause(80);
            tracking=await page.evaluate(()=>window.__EYE_RIG_BATCH.report());
            check('tracking Fixed mode + gaze',tracking.profile?.eye?.trackingMode==='fixed'&&tracking.profile?.eye?.fixedGaze?.[1]===-0.85,tracking.profile?.eye);
            await page.click('[data-tracking-mode="life"]'); await pause(80);
            tracking=await page.evaluate(()=>window.__EYE_RIG_BATCH.report());
            check('tracking Life mode',tracking.profile?.eye?.trackingMode==='life',tracking.profile?.eye?.trackingMode);

            await page.locator('[data-param="ring"]').evaluate(el=>{el.value='0.18';el.dispatchEvent(new Event('input',{bubbles:true}))});
            await page.click('#batchApplySelectedBtn'); await pause(100);
            const appliedSelected=await page.evaluate(()=>window.__EYE_RIG_BATCH.report());
            check('Apply to Selected restores class default',
              Math.abs(appliedSelected.profile?.eye?.anchor?.ring-0.153)<1e-6 &&
              appliedSelected.selectedActors?.includes('gothgirl'),
              {ring:appliedSelected.profile?.eye?.anchor?.ring,selected:appliedSelected.selectedActors});

            const batchDownloadPromise=page.waitForEvent('download');
            await page.click('#batchExportBatchBtn');
            const batchDownload=await batchDownloadPromise;
            check('Export Batch download',batchDownload.suggestedFilename()==='eye-rig-medium.batch.json',batchDownload.suggestedFilename());

            const roundtrip=await page.evaluate(()=>{
              const r=window.__EYE_RIG_BATCH.report();
              return {schema:'kfb.eye-profile-batch/0.2-candidate',rigClass:'Rig_Medium',inheritanceOrder:['rigClass','character','session'],classDefault:r.classSeed.authoringDefault,selectedActorIds:r.selectedActors,profiles:[r.profile]};
            });
            await page.setInputFiles('#importInput',{name:'eye-rig-medium.batch.json',mimeType:'application/json',buffer:Buffer.from(JSON.stringify(roundtrip))});
            await page.waitForSelector('#importPreview:not([hidden])');
            check('Import Batch preview visible',await page.locator('#importPreview').isVisible(),await page.locator('#importPreviewText').textContent());
            await page.click('#acceptImportBtn'); await pause(100);
            const imported=await page.evaluate(()=>window.__EYE_RIG_BATCH.report());
            check('Import Batch roundtrip',
              Math.abs(imported.profile?.eye?.anchor?.ring-0.153)<1e-6 &&
              imported.mediumSeed?.authoringDefault?.eye?.anchor?.dx===0.295,
              {profile:imported.profile?.eye,default:imported.mediumSeed?.authoringDefault});

            check('component selector has 12 entries',
              await page.locator('#componentSelect option').count()===12,
              await page.locator('#componentSelect option').allTextContents());

            await page.selectOption('#componentSelect','0');
            await page.click('#isolateComponentBtn');
            await pause(180);
            await page.click('[data-view="face"]');
            await pause(180);

            const componentProof=[];
            for(let i=0;i<12;i++){
              if(i>0){
                await page.selectOption('#componentSelect',String(i));
                await pause(140);
              }
              const diag=await page.evaluate(()=>window.__EYE_RIG_BATCH.report().cleanup?.componentDiagnostic);
              check(`component ${i} isolated`,
                diag?.status==='ISOLATED_SOURCE_COMPONENT' && diag?.selected===i,
                diag);
              componentProof.push(diag);
              await shot(`component-${String(i).padStart(2,'0')}-face`);
            }

            await page.click('#exitComponentBtn');
            await pause(180);
            const afterDiagnostic=await page.evaluate(()=>window.__EYE_RIG_BATCH.report());
            check('component diagnostic exit restores state',
              afterDiagnostic.cleanup?.componentDiagnostic?.status==='OFF' &&
              document.querySelector('#eyeRigToggle')?.checked===true &&
              document.querySelector('#cleanupToggle')?.checked===true,
              {diagnostic:afterDiagnostic.cleanup?.componentDiagnostic,
               eyeRig:await page.locator('#eyeRigToggle').isChecked(),
               cleanup:await page.locator('#cleanupToggle').isChecked()});
            result.componentProof=componentProof;
            await page.click('[data-view="front"]');
            await pause(120);

            const actorSmoke=[];
            for(const actorId of ['clown','ninja','magical-girl']){
              await page.click(`[data-actor-id="${actorId}"]`);
              await page.waitForFunction((id)=>{
                const r=window.__EYE_RIG_BATCH?.report?.();
                return r?.currentActor?.id===id && r?.gates?.source===true && r?.gates?.host===true && r?.gates?.eye===true;
              },actorId,{timeout:180000});
              await pause(180);
              const actorReport=await page.evaluate(()=>window.__EYE_RIG_BATCH.report());
              check(`actor switch ${actorId}`,
                actorReport.currentActor?.id===actorId &&
                actorReport.gates?.source===true &&
                actorReport.gates?.host===true &&
                actorReport.gates?.eye===true,
                {actor:actorReport.currentActor,gates:actorReport.gates,cleanup:actorReport.cleanup?.status});
              check(`actor profile preserved ${actorId}`,
                actorReport.profile?.actorId===actorId &&
                actorReport.profile?.rigClass==='Rig_Medium',
                actorReport.profile);
              actorSmoke.push({actorId,cleanup:actorReport.cleanup?.status||null,gates:actorReport.gates});
              await shot(`actor-${actorId}-front`);
            }
            result.actorSmoke=actorSmoke;

            await page.click('[data-actor-id="gothgirl"]');
            await page.waitForFunction(()=>{
              const r=window.__EYE_RIG_BATCH?.report?.();
              return r?.currentActor?.id==='gothgirl' && r?.gates?.source===true && r?.gates?.cleanup===true && r?.gates?.host===true && r?.gates?.eye===true;
            },{timeout:180000});
            await pause(180);
            const backToGoth=await page.evaluate(()=>window.__EYE_RIG_BATCH.report());
            check('switch back GothGirl',
              backToGoth.currentActor?.id==='gothgirl' && backToGoth.cleanup?.status==='SOURCE_IDENTITY_VERIFIED_AUTO_CANDIDATE',
              {actor:backToGoth.currentActor,cleanup:backToGoth.cleanup});

            const qaDownloadPromise=page.waitForEvent('download');
            await page.click('#qaCaptureBtn');
            const qaDownload=await qaDownloadPromise;
            const qaPath='public-proof/qa-4view-contact-sheet.png';
            await qaDownload.saveAs(qaPath);
            result.screenshots.push(qaPath);
            check('QA four-view contact sheet download',
              qaDownload.suggestedFilename()==='gothgirl-qa-front-3q-side.png',
              qaDownload.suggestedFilename());

            await shot('01-front-bind');

            await page.click('[data-expression="happy"]');
            await page.click('[data-view="three-left"]');
            await page.click('[data-motion="Idle_A"]');
            await pause(900);
            await shot('02-three-quarter-happy-idle');

            await page.click('[data-expression="thinking"]');
            await page.click('[data-view="side-right"]');
            await page.click('[data-motion="Running_A"]');
            await pause(900);
            await shot('03-side-thinking-run');

            await page.click('[data-expression="surprised"]');
            await page.click('[data-view="front"]');
            await page.click('[data-motion="Jump_Full_Short"]');
            await pause(900);
            await shot('04-front-surprised-jump');

            await page.click('#blinkBtn');
            await pause(80);
            const interaction=await page.evaluate(()=>window.__EYE_RIG_BATCH.report());
            check('interaction runtime remains clean',!interaction.error,interaction.error);
            check('single actor mixer state',interaction.gates?.motion===true,interaction.gates);

            await page.click('[data-rig-class="Rig_Large"]');
            await page.waitForFunction(()=>{
              const r=window.__EYE_RIG_BATCH?.report?.();
              return r?.rigClass==='Rig_Large' && r?.currentActor?.id==='monstrosity' &&
                r?.gates?.source===true && r?.gates?.host===true && r?.gates?.eye===true && r?.gates?.motion===true;
            },{timeout:180000});
            await pause(220);
            const largeInitial=await page.evaluate(()=>window.__EYE_RIG_BATCH.report());
            check('Large class switch',largeInitial.rigClass==='Rig_Large'&&largeInitial.currentActor?.id==='monstrosity',largeInitial.currentActor);
            check('Large catalog 4',
              largeInitial.roster?.count===4 && await page.locator('#actorList [data-actor-id]').count()===4,
              {runtime:largeInitial.roster,dom:await page.locator('#actorList [data-actor-id]').count()});
            check('Large has no accepted default yet',
              largeInitial.classSeed?.status==='CALIBRATION_START_ONLY' && largeInitial.classSeed?.authoringDefault===null,
              largeInitial.classSeed);
            check('Set as Large default available',
              await page.locator('#promoteClassDefaultBtn').isVisible() &&
              !(await page.locator('#promoteClassDefaultBtn').isDisabled()),
              await page.locator('#promoteClassDefaultBtn').textContent());
            check('Apply to Selected blocked before Large default',
              await page.locator('#batchApplySelectedBtn').isDisabled(),
              await page.locator('#batchApplySelectedBtn').isDisabled());
            check('Large jump disabled',
              await page.locator('[data-motion="Jump_Full_Short"]').isDisabled(),
              await page.locator('[data-motion="Jump_Full_Short"]').isDisabled());
            check('Large Idle Walk Run available',
              !(await page.locator('[data-motion="Idle_A"]').isDisabled()) &&
              !(await page.locator('[data-motion="Walking_A"]').isDisabled()) &&
              !(await page.locator('[data-motion="Running_A"]').isDisabled()),
              largeInitial.clips);
            check('Monstrosity Large profile',
              largeInitial.profile?.actorId==='monstrosity' && largeInitial.profile?.rigClass==='Rig_Large',
              largeInitial.profile);
            await shot('06-large-monstrosity-front');

            await page.click('[data-actor-id="black-knight"]');
            await page.waitForFunction(()=>{
              const r=window.__EYE_RIG_BATCH?.report?.();
              return r?.rigClass==='Rig_Large' && r?.currentActor?.id==='black-knight' &&
                r?.gates?.source===true && r?.gates?.host===true && r?.gates?.eye===true;
            },{timeout:180000});
            await pause(180);
            const largeKnight=await page.evaluate(()=>window.__EYE_RIG_BATCH.report());
            check('Large Black Knight switch',
              largeKnight.currentActor?.id==='black-knight' && largeKnight.profile?.rigClass==='Rig_Large',
              {actor:largeKnight.currentActor,profile:largeKnight.profile,cleanup:largeKnight.cleanup?.status});
            await shot('07-large-black-knight-front');

            await page.click('[data-actor-id="monstrosity"]');
            await page.waitForFunction(()=>window.__EYE_RIG_BATCH?.report?.().currentActor?.id==='monstrosity',{timeout:180000});
            const largeBack=await page.evaluate(()=>window.__EYE_RIG_BATCH.report());
            check('Large default still unpromoted after smoke',
              largeBack.classSeed?.authoringDefault===null,
              largeBack.classSeed);

            result.largeSmoke={monstrosity:largeInitial,blackKnight:{actor:largeKnight.currentActor,cleanup:largeKnight.cleanup?.status||null}};

            await page.setViewportSize({width:832,height:900});
            await pause(400);
            await shot('05-832-review');

            check('console/page errors',result.errors.length===0,result.errors);
            result.initial=initial;
            result.afterInteractions=interaction;
            result.status='PASS';
          }catch(e){
            result.status='FAIL';
            result.failure=String(e.stack||e);
            process.exitCode=1;
            if(page)await page.screenshot({path:'public-proof/FAIL.png'}).catch(()=>{});
          }finally{
            fs.writeFileSync('public-proof/results.json',JSON.stringify(result,null,2)+'\n');
            if(browser)await browser.close();
            console.log(JSON.stringify({
              status:result.status,
              checks:result.checks.length,
              passed:result.checks.filter(x=>x.pass).length,
              screenshots:result.screenshots.length,
              failure:result.failure||null
            }));
          }
          JS
          node public-proof/check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kfb-eye-rig-batch-public-stage-proof
          path: public-proof
          retention-days: 30
