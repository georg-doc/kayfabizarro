name: Race Box Stop status sync 2026-09-18
on:
  push:
    branches: [main]
    paths: ['.github/workflows/race-box-stop-status-sync-2026-09-18.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: race-box-stop-status-sync-2026-09-18
  cancel-in-progress: false
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            kfb-hub
            skills/chat/recovery
      - name: Reconcile only the named Race status entries
        shell: python
        run: |
          import pathlib,subprocess,re,json,datetime,tempfile
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          evidence=pathlib.Path('skills/chat/recovery/RACE_BOX_STOP_STATUS_SYNC_2026-09-18.json')
          if evidence.exists():
              print('Already synchronized; no dated decision replay.')
              raise SystemExit(0)
          pin='f510a35f027148b7d6238fcb0ffec18848aecd25'
          subprocess.run(['git','fetch','--filter=blob:none','--depth=1','origin',pin],check=True)
          names=['kfb-hub/index.html','kfb-hub/stunt-race.html','skills/chat/recovery/CURRENT_LEAD_CHECKPOINT_2026-09-18.md','skills/chat/recovery/CURRENT_PRIORITY_BOARD_2026-09-18.md']
          for name in names:assert git('rev-parse','HEAD:'+name)==git('rev-parse',pin+':'+name),'Concurrent source change: '+name
          protected=['media','tools','travel','kfb-hub/stunt-race']
          before={p:git('rev-parse','HEAD:'+p) for p in protected}
          link='https://github.com/georg-doc/KFB-Stunt-Car-Race/blob/main/_handover/BOX_STOP_RADIO_FACILITY_DECISIONS_2026-09-18.md'
          p=pathlib.Path(names[0]);s=p.read_text();lines=s.splitlines(keepends=True)
          old=[i for i,line in enumerate(lines) if line.startswith("{id:'race-audio-a1',")];assert len(old)==1
          lines.pop(old[0])
          task={'id':'race-box-stop-integration','title':'Build Box Stop + approved audio integration','lane':'Stunt Race / Production','priority':'P0','desc':'Audio A1 sonic direction is accepted by Georg; full test coverage is unknown and exact source transfer remains open. Deformer lab-v7/v2 source is received: 43 candidates, no rider rigs. Use KFB Atlas UI, a test-lap countdown and compact kinetic radio/tacho; plan Facility topology together with Environment. Not a new playable release yet.','url':link,'tags':['stunt','race','box stop','vehicle','deformer','audio','production']}
          idx=next(i for i,line in enumerate(lines) if line.startswith("{id:'toolbox-stage-first',"))
          lines.insert(idx,json.dumps(task,ensure_ascii=False)+',\n');s=''.join(lines)
          assert "id:'race-audio-a1'" not in s
          for js in re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s):
              if not js.strip():continue
              with tempfile.NamedTemporaryFile(mode='w',suffix='.mjs') as f:
                  f.write(js);f.flush();subprocess.run(['node','--check',f.name],check=True)
          p.write_text(s)
          p=pathlib.Path(names[1]);s=p.read_text()
          def replace(old,new):
              global s
              assert s.count(old)==1,'Expected one status text: '+old[:80]
              s=s.replace(old,new,1)
          replace('AUDIO A1 · LISTENING PENDING','AUDIO A1 · DIRECTION ACCEPTED')
          replace('2 · Race Audio A1 · listening acceptance','2 · Race Audio A1 · direction accepted')
          replace('A1 is reported implemented + static/browser tested, but not yet pushed to GitHub. Use the standalone HTML from the Audio production chat: demo first, then Music solo / Next seed, then drift → re-grip → boost → jump/landing. Human listening remains the gate.','Georg accepts the sonic direction and authorizes integration. Full feature coverage is unknown. Exact A1 source and provenance transfer remain open; technical regression belongs to production, not another blanket listening checklist.')
          replace('6 · Vehicle Deformer / VFX lane','6 · Box Stop / Vehicle Deformer intake')
          replace('Parallel presentation donor. No human approval is requested until its implementation return exists.','Review source lab-v7/v2 is now received: 43 vehicle candidates, four profiles. Next: Box Stop in the Race site, no rider rigs, KFB Atlas UI and 3D test-lap countdown. Profiles and all vehicles are not automatically accepted.')
          replace('v0.10 Kenney topology is not implemented yet, so there is nothing to approve. Vehicle Deformer/VFX likewise waits for an implementation return. Audio A1 publication/integration is a production task after the listening verdict, not a substitute for it.','The new Box Stop, kinetic radio/tacho, A1 Race integration and v0.10 Facility are not implemented by this status update. Deformer source exists; source intake is not a Race browser PASS. Audio direction is accepted; original-source integration and regression are the next production tasks. Facility geometry and Environment dressing are planned together without mixing owners.')
          s=s.replace('</section><section class="panel"><h2>Current direction</h2>',f'<p><a href="{link}" target="_blank" rel="noreferrer">Box Stop / radio / Facility decisions and exact source intake</a></p></section><section class="panel"><h2>Current direction</h2>',1)
          p.write_text(s)
          note=('## Current Race delta · audio accepted / Box Stop · 18.09.2026\n\n'
                'Georg accepts Audio A1 sonic direction and authorizes integration; full feature-test coverage is unknown. Original A1 source transfer is still required. Do not repeat the completed blanket listening gate.\n\n'
                'The Vehicle Deformer review is now SOURCE RECEIVED / REVIEWED at kayfabizarro@f510a35f027148b7d6238fcb0ffec18848aecd25: `tools/KFB-ToolBox/_inbox/KFB Cartoon Vehicle + Deformer Lab v1/WS1_Vehicles_Review_2026-09-18`, active lab-v7 / deformer v2, 43 candidates and four profiles. The DocCheck UI is rejected; use the Resident/World Atlas interface family. No rider rigs in the first Race comparison.\n\n'
                'Proposed next playable loop: Drive → Box Stop → Vehicle / Motion profile → Test Lap → 3D countdown → Drive. Compact kinetic radio/tacho and the existing ten-track Jukebox are the approved product direction, not newly implemented runtime. Facility geometry and Environment dressing must be planned together.\n\n'
                f'[Authoritative Race decisions / exact sources]({link}). Older pending statements below are dated recovery history where superseded by this delta. Other project lanes retain their own owners and priorities.\n\n')
          for name in names[2:]:
              p=pathlib.Path(name);title,rest=p.read_text().split('\n\n',1);p.write_text(title+'\n\n'+note+rest)
          subprocess.run(['git','add','--',*names],check=True)
          after={p:git('rev-parse',git('write-tree')+':'+p) for p in protected}
          assert before==after,'Protected source changed'
          assert set(git('diff','--cached','--name-only').splitlines())<=set(names)
          evidence.write_text(json.dumps({'status':'PASS_STATUS_SYNC','atUtc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'sourceHead':git('rev-parse','HEAD'),'reviewedSource':pin,'changedFiles':names,'protectedBefore':before,'protectedAfter':after,'hubScriptSyntax':'PASS','newRuntime':'NONE','publicDeploymentRechecked':False},indent=2)+'\n')
          subprocess.run(['git','add','--',str(evidence)],check=True)
      - name: Commit only current status pages
        run: |
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(hub): audio direction accepted; Box Stop/deformer source and integration tasks current'
          git push origin HEAD:main
