name: WC1 Environment Family P2

on:
  push:
    branches:
      - chatgpt-web/wc1-procedural-environment-p2-2026-10-02
    paths:
      - 'tools/KFB-ToolBox/worldbuilder/world-corridor-01/procedural-environment-p2/**'
      - '.github/workflows/wc1-environment-family-p2.yml'
  workflow_dispatch:

jobs:
  source-object-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static QA syntax
        run: node --check tools/KFB-ToolBox/worldbuilder/world-corridor-01/procedural-environment-p2/qa/source-object-isolation.mjs
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Start internal static server
        run: |
          python3 -m http.server 4173 >/tmp/kfb-env-p2-http.log 2>&1 &
          sleep 2
          curl -f http://127.0.0.1:4173/tools/KFB-ToolBox/worldbuilder/world-corridor-01/procedural-environment-p2/source-object-isolation.html >/dev/null
      - name: Exact source-object isolation
        run: node tools/KFB-ToolBox/worldbuilder/world-corridor-01/procedural-environment-p2/qa/source-object-isolation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wc1-environment-family-p2-evidence
          path: environment-family-p2-evidence/
          if-no-files-found: error
