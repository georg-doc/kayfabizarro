name: Eye Actor Studio v1
on:
  push:
    branches:
      - chatgpt-web/toolbox-eye-actor-studio-v1-2026-09-21
    paths:
      - 'tools/KFB-ToolBox/eye-actor-studio-v1/**'
      - 'kfb-hub/stage/toolbox/eye-actor-studio/**'
      - '.github/workflows/eye-actor-studio-v1.yml'
      - 'skills/chat/workflows/KFB_EYE_ACTOR_STUDIO_V1_2026-09-21/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Static contracts
        run: node kfb-hub/stage/toolbox/eye-actor-studio/static-check.mjs
      - name: Syntax
        run: |
          node --check tools/KFB-ToolBox/eye-actor-studio-v1/clay-lid.v1.mjs
          node --check tools/KFB-ToolBox/eye-actor-studio-v1/poses.v1.mjs
          node --check tools/KFB-ToolBox/eye-actor-studio-v1/eye-cluster.v1.mjs
          node --check kfb-hub/stage/toolbox/eye-actor-studio/app.mjs
      - name: Install browser
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Start local repo server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/eas1-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/kfb-hub/stage/toolbox/eye-actor-studio/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/eas1-http.log; exit 1
      - name: Desktop + mobile WebGL proof
        run: node kfb-hub/stage/toolbox/eye-actor-studio/browser-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eye-actor-studio-v1-evidence
          path: eas1-evidence
          retention-days: 14
