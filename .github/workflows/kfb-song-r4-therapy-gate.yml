name: KFB Therapy R3.1 correction gate
on:
  push:
    branches:
      - "songs/the_carnival_of_unsolved_problems_therapy-r4-2026-10-17"
permissions:
  contents: read
jobs:
  r31:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact plugin lexical
        run: python3 songs/the_carnival_of_unsolved_problems_therapy/triplet_set_check.py songs/the_carnival_of_unsolved_problems_therapy/the_carnival_of_unsolved_problems_therapy.r31.qa.deck.json songs/the_carnival_of_unsolved_problems_therapy/the_carnival_of_unsolved_problems_therapy.r31.qa.set.csv
      - name: R3.1 format
        run: python3 songs/the_carnival_of_unsolved_problems_therapy/format_gate_r31.py
