name: OSM City · Ehrenfeld Hürth corridor discovery

on:
  push:
    branches:
      - osm-city/s1c-road-labels-grotesque-forest-2026-09-18
    paths:
      - 'tools/osm-city-lab/data/corridors/ehrenfeld-huerth-v0/**'
      - 'tools/osm-city-lab/scripts/fetch-ehrenfeld-huerth-corridor.mjs'
      - 'tools/osm-city-lab/scripts/route-ehrenfeld-huerth.mjs'
      - '.github/workflows/osm-city-corridor.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: osm-city-ehrenfeld-huerth-corridor
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: osm-city/s1c-road-labels-grotesque-forest-2026-09-18
          fetch-depth: 0
          sparse-checkout: |
            tools/osm-city-lab/data/corridors
            tools/osm-city-lab/scripts/fetch-ehrenfeld-huerth-corridor.mjs
            tools/osm-city-lab/scripts/route-ehrenfeld-huerth.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check tools/osm-city-lab/scripts/fetch-ehrenfeld-huerth-corridor.mjs
          node --check tools/osm-city-lab/scripts/route-ehrenfeld-huerth.mjs
      - name: Fetch OSM road graph
        run: node tools/osm-city-lab/scripts/fetch-ehrenfeld-huerth-corridor.mjs
      - name: Route source graph
        run: node tools/osm-city-lab/scripts/route-ehrenfeld-huerth.mjs
      - name: Commit discovery source and route evidence
        run: |
          git config user.name "KFB OSM City Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/osm-city-lab/data/corridors/ehrenfeld-huerth-v0/source.overpass.json                   tools/osm-city-lab/data/corridors/ehrenfeld-huerth-v0/PROVENANCE.json                   tools/osm-city-lab/evidence/ehrenfeld-huerth-route.json
          if git diff --cached --quiet; then
            echo "No corridor discovery delta."
            exit 0
          fi
          git commit -m "OSM City: cache Ehrenfeld-Hürth corridor discovery [osm-city-corridor]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
