name: Box Stop pinned public preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/box-stop-pinned-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Run the existing live suite against the same immutable public source
        shell: python
        run: |
          import pathlib,subprocess
          source=pathlib.Path('.github/workflows/box-stop-live.yml').read_text()
          original=source.split("          cat > live-proof/check.mjs <<'JS'\n",1)[1].split('\n          JS\n',1)[0]
          import textwrap
          code=textwrap.dedent(original)
          code=code.replace("const cfg=JSON.parse(fs.readFileSync('kfb-hub/_deploy/BOX1_LIVE_TRIGGER.json')),base='https://kayfabizarro.pages.dev/kfb-hub/stunt-race/track-environment-lab/';", "const cfg={sourceCommit:'1d88a887fc6ff4a1fc907afe5dbdef154181b221'},base='https://rawcdn.githack.com/georg-doc/kayfabizarro/94ba1cd444548fef7508a0bd11ed2757de5d755f/kfb-hub/stunt-race/track-environment-lab/';")
          code=code.replace("page.goto(base+'?world=", "page.goto(base+'index.html?world=").replace("mp.goto(base+'?world=", "mp.goto(base+'index.html?world=")
          # Use the CDN's ordinary human-facing confirmation if it appears. Never suppress
          # security headers or manually set its confirmation cookie.
          helper='''async function confirmPublicFile(p){
            if(await p.evaluate(()=>!!window.__KFB_BOX_READY__||!!document.getElementById('gl')))return;
            const body=await p.locator('body').innerText();
            if(/confirm|phish|rawgit|githack|open.*file/i.test(body)){
              const button=p.getByRole('button',{name:/continue|confirm|open|proceed/i}).first();
              const link=p.getByRole('link',{name:/continue|confirm|open|proceed/i}).first();
              if(await button.count())await button.click();else if(await link.count())await link.click();
              else{fs.writeFileSync('live-proof/confirmation.html',await p.content());throw Error('Public CDN confirmation needs manual review; no bypass attempted');}
              await p.waitForLoadState('networkidle');
            }
          }
          '''
          code=helper+code
          code=code.replace("await page.waitForFunction(()=>window.__KFB_BOX_READY__||window.__KFB_BOX_ERROR__", "await confirmPublicFile(page);await page.waitForFunction(()=>window.__KFB_BOX_READY__||window.__KFB_BOX_ERROR__")
          code=code.replace("await mp.waitForFunction(()=>window.__KFB_BOX_READY__", "await confirmPublicFile(mp);await mp.waitForFunction(()=>window.__KFB_BOX_READY__")
          code=code.replace("i<36", "i<3")
          code=code.replace("const manifest=await (await fetch", "r.publicOrigin='PINNED_CDN_PREVIEW_NOT_CLOUDFLARE_PAGES';const manifest=await (await fetch")
          out=pathlib.Path('live-proof');out.mkdir(exist_ok=True);(out/'check.mjs').write_text(code)
          subprocess.run(['node','--check',str(out/'check.mjs')],check=True)
          subprocess.run(['node',str(out/'check.mjs')],check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: box-stop-pinned-preview-proof
          path: live-proof
          retention-days: 14
