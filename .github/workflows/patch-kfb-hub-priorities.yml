name: One-shot refresh KFB Hub priorities

on:
  push:
    paths:
      - '.github/workflows/patch-kfb-hub-priorities.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh current priorities and handoff links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('kfb-hub/index.html')
          s=p.read_text(encoding='utf-8')
          todos="""const todos=[
          {id:'actor-handoff',title:'Close the Birthday actor + motion handoff',lane:'Birthday opener',priority:'P0',desc:'Design/ToolBox: use the new A/B package without rebuilding A. Return FrizzleBob plus Novacyy/GothGirl with tested Idle → Focus → Select/Celebrate → Rest; one Dance only as P1. Hihi stays Coming Soon.',url:G+'tools/KFB-ToolBox/_handover/BIRTHDAY_STARTSCREEN_2026-09-15/START_HERE.md',tags:['birthday','toolbox','animation','novacyy','frizzlebob']},
          {id:'astra-birthday',title:'Build the P0 Birthday Character Select in Travel',lane:'Birthday opener',priority:'P0',desc:'Astra: separate WIP route, Curtain/18/Enter, Travel sunset + water + Town silhouette, FrizzleBob + Novacyy selectable, Hihi inactive, real state motion, one Birthday track after user gesture, desktop + mobile landscape.',url:'https://github.com/georg-doc/KFB-Travel-Globe/blob/main/_handover/BIRTHDAY_STARTSCREEN_ASTRA_2026-09-15/START_HERE.md',tags:['birthday','astra','travel','mobile','landscape']},
          {id:'birthday-qa',title:'QA, publish, then Georg freeplay',lane:'Birthday opener',priority:'P0',desc:'Check desktop 1440×900 and phone landscape ~844×390, reveal, both active actors, Hihi disabled, audio/reload and no duplicate actor/mixer. Publish WIP URL, then do visual/freeplay acceptance.',url:G+'skills/chat/recovery/CURRENT_PRIORITY_BOARD_2026-09-15.md',tags:['birthday','qa','publish','freeplay']},
          {id:'librarian-recovery',title:'Close the Asset Librarian v1.7 recovery loop',lane:'Infrastructure',priority:'P0',desc:'Reconcile README/CHANGELOG/BUILD_MANIFEST/RETURN, verify the permanent Cloudflare URL and check whether Birthday Radio appears through Registry → Live. Do not start another broad taxonomy pass.',url:G+'tools/asset_registry/librarian/ONBOARDING_FRESH_CHAT_2026-09-15.md',tags:['librarian','recovery','v1.7','birthday']},
          {id:'d6-radio',title:'Add the full six-track D6 Birthday Radio',lane:'Birthday juice',priority:'P1',desc:'The six VOLE/Tom-Kincaid CC0 tracks are already imported. Wire faces 1–6 through the existing Travel audio seam, with tap/swipe/flip and no forced autoplay. One working track is enough for P0.',url:D+'media/3D_Assets/Audio/Music/Birthday%20Radio%20-%20VOLE%20CC0',tags:['birthday','audio','d6','radio','cc0']},
          {id:'birthday-juice',title:'Add speaker, letter, disco and fireworks juice',lane:'Birthday juice',priority:'P1',desc:'After P0 is stable: EyeRig speaker if clean, analyser-driven speaker/letter motion, three disco balls, one tested groove and one bounded fireworks event. Keep world lighting coherent.',url:G+'skills/chat/town/references/TOWN_POST_R022_BIRTHDAY_STARTSCREEN_TRAVEL_HANDOFF_2026-09-15.md',tags:['speaker','letters','disco','fireworks','dance']},
          {id:'toolbox-b',title:'Continue ToolBox B without blocking Birthday',lane:'Infrastructure',priority:'P1',desc:'Pilot exists. Next: responsive drawer/four real viewport tests, independent embed roundtrip, then transfer the same shell to other Labs. Keep A/B separate.',url:G+'tools/KFB-ToolBox/_inbox/WS0_2026-09-15/unpacked/B_OBERFLAECHE/BERICHT_UI_PILOT_v1.md',tags:['toolbox','ux','responsive','roundtrip']},
          {id:'town-terrain',title:'Grow Birthday scene into the Town start zone',lane:'Town / Travel',priority:'P2',desc:'Weekend: plateau, King hill, shared show stage, settlement, river/mouth and visible pirate island. Reuse Travel/TinySkies terrain, coast, sky and lighting instead of creating a second world stack.',url:G+'skills/chat/recovery/CURRENT_PRIORITY_BOARD_2026-09-15.md',tags:['town','terrain','travel','river','pirate island']},
          {id:'look-audio-calibration',title:'Run look + soundscape calibration stages',lane:'Town / Travel',priority:'P2',desc:'After Birthday P0: first Golden Hour Town, then Graveyard Night and Ring Performance. Use existing Travel light/audio owners; color grading last and no new audio engine.',url:G+'skills/chat/town/references/TOWN_TRAVEL_AUDIO_SOUNDSCAPE_TBD_2026-09-15.md',tags:['lighting','audio','soundscape','calibration']},
          {id:'suno-biomes',title:'Render the six biome instrumentals in Suno',lane:'External AI',priority:'P2',desc:'Locate the existing prompt set and render six instrumental mood tracks with prompt/file provenance. Useful for later Town moods, not a Birthday blocker.',url:G+'skills/chat/town/START_HERE.md',tags:['suno','music','biome','soundtrack']},
          {id:'elevenlabs-triplets',title:'Prepare a small ElevenLabs Triplet calibration set',lane:'External AI',priority:'P2',desc:'Record only a small calibration set and preserve source/persona. Browser TTS remains acceptable for the early Town/Birthday POC.',url:G+'skills/chat/masterplan/CHATTERBOX_TOURBUS_REUSE_2026-09-14.md',tags:['elevenlabs','tts','triplet','voice']}
          ];
          """
          s2,repl=re.subn(r"const todos=\[.*?\];\nconst links=",todos+'const links=',s,count=1,flags=re.S)
          if repl!=1: raise SystemExit('todos array anchor not found')
          s=s2

          recovery_anchor="{section:'Recovery & coordination',title:'Recovery Path',badge:'RECOVERY',kind:'recovery',url:G+'skills/chat/RECOVERY_PATH.md',desc:'Provider-neutral recovery contract. Fresh chats recover from GitHub instead of transcript reconstruction.',tags:['recovery','chat','handoff']},"
          priority="{section:'Recovery & coordination',title:'Current Priority Board',badge:'CURRENT',kind:'recovery',url:G+'skills/chat/recovery/CURRENT_PRIORITY_BOARD_2026-09-15.md',desc:'Immediate P0/P1/P2 order for Birthday, ToolBox/Librarian and the weekend Town expansion.',tags:['priority','birthday','current','todo']},"
          if 'Current Priority Board' not in s:
              s=s.replace(recovery_anchor,recovery_anchor+'\n'+priority,1)

          toolbox_anchor="{section:'Live tools & workbenches',title:'KFB ToolBox · START HERE',badge:'TOOL',kind:'tools',url:G+'tools/KFB-ToolBox/START_HERE.md',desc:'ToolBox re-entry, source/export rules and current A/B handoff boundary.',tags:['toolbox','studio','rigging','animation']},"
          toolbox_bday="{section:'Live tools & workbenches',title:'ToolBox · Birthday Consumer Handoff',badge:'HANDOFF',kind:'tools',url:G+'tools/KFB-ToolBox/_handover/BIRTHDAY_STARTSCREEN_2026-09-15/START_HERE.md',desc:'Small actor/motion handoff for FrizzleBob, Novacyy/GothGirl and Hihi; full ToolBox UI is not a Birthday prerequisite.',tags:['toolbox','birthday','actor','motion']},"
          if 'ToolBox · Birthday Consumer Handoff' not in s:
              s=s.replace(toolbox_anchor,toolbox_anchor+'\n'+toolbox_bday,1)

          travel_anchor="{section:'Project SSOTs & previews',intro:'Implementation truth lives in the named project repository; public previews are separate evidence.',title:'Travel Globe · repository',badge:'SSOT',kind:'projects',url:'https://github.com/georg-doc/KFB-Travel-Globe',desc:'Travel implementation SSOT: world, terrain, sky, movement and current MVP work.',tags:['travel','terrain','sky','ssot']},"
          astra="{section:'Project SSOTs & previews',title:'Travel · Birthday Astra Slice',badge:'HANDOFF',kind:'projects',url:'https://github.com/georg-doc/KFB-Travel-Globe/blob/main/_handover/BIRTHDAY_STARTSCREEN_ASTRA_2026-09-15/START_HERE.md',desc:'P0 vertical-slice execution brief: Birthday reveal, two active actors, one track, responsive QA and separate WIP publication.',tags:['travel','birthday','astra','handoff']},"
          if 'Travel · Birthday Astra Slice' not in s:
              s=s.replace(travel_anchor,travel_anchor+'\n'+astra,1)

          lighting="{section:'KFB Town & meta',title:'World Color & Lighting Cohesion · TBD',badge:'TBD',kind:'town',url:G+'skills/chat/masterplan/WORLD_COLOR_LIGHTING_COHESION_TBD_2026-09-15.md',desc:'Travel-owned look-cohesion handoff: shared world light/color response, small asset calibration, mood presets, color grading last.',tags:['town','travel','lighting','color','mood']},"
          sound="{section:'KFB Town & meta',title:'World Audio & Soundscape Cohesion · TBD',badge:'TBD',kind:'town',url:G+'skills/chat/town/references/TOWN_TRAVEL_AUDIO_SOUNDSCAPE_TBD_2026-09-15.md',desc:'Global bed, local ambience, diegetic music, SFX/TTS priority and ducking direction; consume the existing Travel audio architecture.',tags:['town','travel','audio','soundscape','tts']},"
          if 'World Audio & Soundscape Cohesion · TBD' not in s:
              s=s.replace(lighting,lighting+'\n'+sound,1)

          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'Build the P0 Birthday Character Select in Travel' kfb-hub/index.html
          grep -q 'Current Priority Board' kfb-hub/index.html
          grep -q 'Travel · Birthday Astra Slice' kfb-hub/index.html
          grep -q 'World Audio & Soundscape Cohesion · TBD' kfb-hub/index.html
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KFB Hub Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/patch-kfb-hub-priorities.yml
          git add kfb-hub/index.html
          git commit -m 'feat(hub): prioritize Birthday production path'
          git pull --rebase origin main
          git push origin HEAD:main
