name: GROUND-WALK-PACE-TUNE-01 public Stage proof
on:
  push:
    branches: [cloudflare-live]
    paths:
      - 'kfb-hub/stage/game-container/ground-walk-pace-tune-01/**'
      - '.github/workflows/kfb-ground-walk-pace-tune01-public.yml'
      - 'kfb-hub/stage/hub-ui-v2/index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kfb-hub/stage/game-container/ground-walk-pace-tune-01
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for exact Cloudflare revision
        shell: bash
        run: |
          URL='https://kayfabizarro.pages.dev/kfb-hub/stage/game-container/ground-walk-pace-tune-01/DEPLOYMENT.json'
          WANT='d6e9d42149670af290d96fe19dfdc28095f2f337'
          for i in {1..90}; do
            BODY="$(curl -fsS "$URL" 2>/dev/null || true)"
            if printf '%s' "$BODY" | grep -q "$WANT"; then
              printf '%s\n' "$BODY"
              exit 0
            fi
            sleep 4
          done
          echo "Exact Cloudflare revision did not appear"
          exit 1
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Public Chromium proof
        run: |
          mkdir -p ground-walk-pace-tune01-public-evidence
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          const STAGE='https://kayfabizarro.pages.dev/kfb-hub/stage/game-container/ground-walk-pace-tune-01/?ground=1&groundFeel=velocity&walkPace=travel';
          const HUB='https://kayfabizarro.pages.dev/kfb-hub/#briefings';
          const WANT='d6e9d42149670af290d96fe19dfdc28095f2f337';
          const checks=[];
          const ok=(name,cond,extra='')=>{checks.push({name,pass:!!cond,extra});if(!cond)throw new Error('FAIL '+name+(extra?' · '+extra:''));console.log('PASS',name,extra);};
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
          const key=async(type,code,k)=>page.evaluate(({type,code,k})=>window.dispatchEvent(new KeyboardEvent(type,{code,key:k,bubbles:true,cancelable:true})),{type,code,k});
          try{
            await page.goto(STAGE,{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(()=>window.__game?.state==='ground'&&window.__game?.world?.groundPlayer?.ready===true,null,{timeout:45000});
            const meta=await page.locator('meta[name="kfb-source-head"]').getAttribute('content');
            ok('exact runtime marker visible',meta===WANT,meta||'missing');
            const g0=await page.evaluate(()=>window.__game.world.groundPlayer.report());
            ok('travel pace active',g0.walkPace==='travel',g0.walkPace);
            ok('walk target ~1.10',g0.walkSpeed>1.09&&g0.walkSpeed<1.11,String(g0.walkSpeed));
            ok('walk playback 1.8x',Math.abs(g0.walkPlaybackRate-1.8)<1e-9,String(g0.walkPlaybackRate));
            ok('Orbit mounted',await page.evaluate(()=>!!window.__game.world.groundOrbit?.report?.().enabled));
            await key('keydown','KeyW','w'); await page.evaluate(()=>window.__game.advanceBy(.84));
            const walk=await page.evaluate(()=>window.__game.world.groundPlayer.report());
            ok('public faster Walk active',walk.currentAnimation==='Walking_A'&&walk.speed>1.06,JSON.stringify({a:walk.currentAnimation,v:walk.speed}));
            await key('keydown','ShiftLeft','Shift'); await page.evaluate(()=>window.__game.advanceBy(.18));
            const run=await page.evaluate(()=>window.__game.world.groundPlayer.report());
            ok('public Run tier retained',run.currentAnimation==='Running_A'&&run.semantic==='run',JSON.stringify({a:run.currentAnimation,s:run.semantic,v:run.speed}));
            await page.evaluate(()=>window.__game.advanceBy(.55));
            const sprint=await page.evaluate(()=>window.__game.world.groundPlayer.report());
            ok('public Sprint retained',sprint.currentAnimation==='Running_B'&&sprint.semantic==='sprint',JSON.stringify({a:sprint.currentAnimation,s:sprint.semantic,v:sprint.speed}));
            await key('keyup','ShiftLeft','Shift'); await page.evaluate(()=>window.__game.advanceBy(.55));
            const back=await page.evaluate(()=>window.__game.world.groundPlayer.report());
            ok('release returns to faster Walk',back.currentAnimation==='Walking_A'&&back.speed>1.05,JSON.stringify({a:back.currentAnimation,v:back.speed}));
            await key('keyup','KeyW','w');
            ok('runtime errors empty',(await page.evaluate(()=>window.__game.errors())).length===0,JSON.stringify(await page.evaluate(()=>window.__game.errors())));
            ok('page errors empty',errors.length===0,JSON.stringify(errors));
            await page.screenshot({path:'ground-walk-pace-tune01-public-evidence/stage.png',fullPage:true});
            await page.goto(HUB,{waitUntil:'domcontentloaded',timeout:45000});
            const link=page.locator('a[href*="ground-walk-pace-tune-01"]').first();
            ok('Hub contains pace tune link',await link.count()===1);
            const href=await link.getAttribute('href');
            ok('Hub link targets pace tune route',String(href||'').includes('/kfb-hub/stage/game-container/ground-walk-pace-tune-01/'),href||'missing');
            await page.screenshot({path:'ground-walk-pace-tune01-public-evidence/hub.png',fullPage:true});
            await fs.writeFile('ground-walk-pace-tune01-public-evidence/report.json',JSON.stringify({stage:STAGE,hub:HUB,revision:WANT,checks,errors,testedAt:new Date().toISOString()},null,2));
            console.log('RESULT',checks.filter(c=>c.pass).length+'/'+checks.length,'PASS');
          }finally{await browser.close()}
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ground-walk-pace-tune01-public-evidence
          path: ground-walk-pace-tune01-public-evidence/
          retention-days: 30
