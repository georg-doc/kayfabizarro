name: GROUND-WALK-PACE-TUNE-02 public Stage proof
on:
  push:
    branches: [cloudflare-live]
    paths:
      - 'kfb-hub/stage/game-container/ground-walk-pace-tune-01/**'
      - '.github/workflows/kfb-ground-walk-pace-tune01-public.yml'
      - 'kfb-hub/stage/hub-ui-v2/index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kfb-hub/stage/game-container/ground-walk-pace-tune-01
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for exact Cloudflare revision
        shell: bash
        run: |
          URL='https://kayfabizarro.pages.dev/kfb-hub/stage/game-container/ground-walk-pace-tune-01/DEPLOYMENT.json'
          WANT='4475271b61e65fae95e5044925b83f2e39c18e6e'
          for i in {1..90}; do
            BODY="$(curl -fsS "$URL" 2>/dev/null || true)"
            if printf '%s' "$BODY" | grep -q "$WANT"; then
              printf '%s\n' "$BODY"
              exit 0
            fi
            sleep 4
          done
          echo "Exact Cloudflare revision did not appear"
          exit 1
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Public Chromium proof
        run: |
          mkdir -p ground-walk-pace-tune02-public-evidence
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          const STAGE='https://kayfabizarro.pages.dev/kfb-hub/stage/game-container/ground-walk-pace-tune-01/?ground=1&groundFeel=velocity&walkPace=travel';
          const HUB='https://kayfabizarro.pages.dev/kfb-hub/#briefings';
          const WANT='4475271b61e65fae95e5044925b83f2e39c18e6e';
          const checks=[];
          const ok=(name,cond,extra='')=>{checks.push({name,pass:!!cond,extra});if(!cond)throw new Error('FAIL '+name+(extra?' · '+extra:''));console.log('PASS',name,extra);};
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
          const key=async(type,code,k)=>page.evaluate(({type,code,k})=>window.dispatchEvent(new KeyboardEvent(type,{code,key:k,bubbles:true,cancelable:true})),{type,code,k});
          try{
            await page.goto(STAGE,{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(()=>window.__game?.state==='ground'&&window.__game?.world?.groundPlayer?.ready===true,null,{timeout:45000});
            const meta=await page.locator('meta[name="kfb-source-head"]').getAttribute('content');
            ok('exact runtime marker visible',meta===WANT,meta||'missing');
            const g0=await page.evaluate(()=>window.__game.world.groundPlayer.report());
            ok('travel profile active',g0.walkPace==='travel',g0.walkPace);
            ok('normal target is Running_A speed',Math.abs(g0.forwardSpeed-g0.runSpeed)<1e-9&&g0.forwardSpeed>2.47&&g0.forwardSpeed<2.49,JSON.stringify({forward:g0.forwardSpeed,run:g0.runSpeed}));
            ok('default Travel clip is Running_A',g0.travelDefaultClip==='Running_A',g0.travelDefaultClip);
            ok('Shift Travel clip is Running_B',g0.travelShiftClip==='Running_B',g0.travelShiftClip);
            ok('Orbit mounted',await page.evaluate(()=>!!window.__game.world.groundOrbit?.report?.().enabled));
            await key('keydown','KeyW','w'); await page.evaluate(()=>window.__game.advanceBy(.06));
            const runStart=await page.evaluate(()=>window.__game.world.groundPlayer.report());
            ok('public W immediately Running_A',runStart.currentAnimation==='Running_A'&&runStart.semantic==='run'&&runStart.speed>0.8,JSON.stringify({a:runStart.currentAnimation,s:runStart.semantic,v:runStart.speed}));
            await page.evaluate(()=>window.__game.advanceBy(.78));
            const run=await page.evaluate(()=>window.__game.world.groundPlayer.report());
            ok('public W settles Running_A',run.currentAnimation==='Running_A'&&run.semantic==='run'&&run.speed>2.42&&run.speed<2.50,JSON.stringify({a:run.currentAnimation,s:run.semantic,v:run.speed}));
            await key('keydown','ShiftLeft','Shift'); await page.evaluate(()=>window.__game.advanceBy(.06));
            const sprintStart=await page.evaluate(()=>window.__game.world.groundPlayer.report());
            ok('public Shift immediately Running_B',sprintStart.currentAnimation==='Running_B'&&sprintStart.semantic==='sprint',JSON.stringify({a:sprintStart.currentAnimation,s:sprintStart.semantic,v:sprintStart.speed}));
            await page.evaluate(()=>window.__game.advanceBy(.55));
            const sprint=await page.evaluate(()=>window.__game.world.groundPlayer.report());
            ok('public Shift settles Sprint',sprint.currentAnimation==='Running_B'&&sprint.semantic==='sprint'&&sprint.speed>2.95,JSON.stringify({a:sprint.currentAnimation,s:sprint.semantic,v:sprint.speed}));
            await key('keyup','ShiftLeft','Shift'); await page.evaluate(()=>window.__game.advanceBy(.12));
            const back=await page.evaluate(()=>window.__game.world.groundPlayer.report());
            ok('public Shift release returns Running_A',back.currentAnimation==='Running_A'&&back.semantic==='run',JSON.stringify({a:back.currentAnimation,s:back.semantic,v:back.speed}));
            await key('keyup','KeyW','w');
            ok('runtime errors empty',(await page.evaluate(()=>window.__game.errors())).length===0,JSON.stringify(await page.evaluate(()=>window.__game.errors())));
            ok('page errors empty',errors.length===0,JSON.stringify(errors));
            await page.screenshot({path:'ground-walk-pace-tune02-public-evidence/stage.png',fullPage:true});
            await page.goto(HUB,{waitUntil:'domcontentloaded',timeout:45000});
            const link=page.locator('a[href*="ground-walk-pace-tune-01"]').first();
            ok('Hub contains two-gear link',await link.count()===1);
            const href=await link.getAttribute('href');
            ok('Hub link targets Pace route',String(href||'').includes('/kfb-hub/stage/game-container/ground-walk-pace-tune-01/'),href||'missing');
            await page.screenshot({path:'ground-walk-pace-tune02-public-evidence/hub.png',fullPage:true});
            await fs.writeFile('ground-walk-pace-tune02-public-evidence/report.json',JSON.stringify({stage:STAGE,hub:HUB,revision:WANT,checks,errors,runStart,run,sprintStart,sprint,back,testedAt:new Date().toISOString()},null,2));
            console.log('RESULT',checks.filter(c=>c.pass).length+'/'+checks.length,'PASS');
          }finally{await browser.close()}
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ground-walk-pace-tune02-public-evidence
          path: ground-walk-pace-tune02-public-evidence/
          retention-days: 30
