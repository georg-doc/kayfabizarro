name: KFB Geopolitical R5 Canonical Song Gates
on:
  push:
    branches: ["songs/geopolitical_thrillers_conspiracy_theories-r5-2026-10-17"]
permissions:
  contents: read
jobs:
  r5-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: R4 and R5 earlier corpus
        shell: bash
        run: |
          mkdir -p .song-corpus
          for b in songs/1001_kayfabe_nights-r4-2026-10-17 songs/frizzlebob_bloedsinnland_alice-r4-2026-10-17 songs/the_carnival_of_unsolved_problems_therapy-r4-2026-10-17 songs/dream_wrestling_with_kayfabe_freud-r4-2026-10-17 songs/the_kayfabe_money_trail_9_11-r4-2026-10-17 songs/federal_kayfabe-r5-2026-10-17 songs/grimms_kayfabe_legends_expansion_set_02-r5-2026-10-17 songs/kayfabizarro_monopolies_manipulation_murder_vol-r5-2026-10-17; do
            git fetch --depth=1 origin "refs/heads/${b}:refs/remotes/origin/${b}"
            git ls-tree -r --name-only "refs/remotes/origin/${b}" | grep '\.suno\.txt$' | while IFS= read -r p; do
              git show "refs/remotes/origin/${b}:$p" > ".song-corpus/$(echo "${b}" | tr / _)-$(basename "$p")"
            done
          done
      - name: Source triplets part one
        run: python3 tools/KFB-ToolBox/_inbox/KFB_HUB/30_DECISIONS/replies/triplet_set_check.py songs/geopolitical_thrillers_conspiracy_theories/geopolitical_thrillers_conspiracy_theories.r5.qa.deck.json songs/geopolitical_thrillers_conspiracy_theories/geopolitical_thrillers_conspiracy_theories.part1.r5.qa.set.csv
      - name: R3.2 original lyrics part one
        run: python3 tools/KFB-ToolBox/_inbox/KFB_HUB/30_DECISIONS/replies/song_gate.py lyrics songs/geopolitical_thrillers_conspiracy_theories/geopolitical_thrillers_conspiracy_theories.part1.r5.suno.txt --deck registry/assets/v1/decks/geopolitical_thrillers_conspiracy_theories.json --songlines songs/geopolitical_thrillers_conspiracy_theories/geopolitical_thrillers_conspiracy_theories.songlines.json --media media/kfb/Uncle_FrizzleBob_s_Kayfabizarro_-_Geopolitical_Thrillers_and_Conspiracy_Theories_-_ADD_web_ID.pdf.json --cards 1-28 --corpus tools/KFB-ToolBox/_inbox/KFB_HUB/30_DECISIONS/replies/OPENER_ARC_R2 .song-corpus
      - name: Source triplets part two
        run: python3 tools/KFB-ToolBox/_inbox/KFB_HUB/30_DECISIONS/replies/triplet_set_check.py songs/geopolitical_thrillers_conspiracy_theories/geopolitical_thrillers_conspiracy_theories.r5.qa.deck.json songs/geopolitical_thrillers_conspiracy_theories/geopolitical_thrillers_conspiracy_theories.part2.r5.qa.set.csv
      - name: R3.2 original lyrics part two
        run: python3 tools/KFB-ToolBox/_inbox/KFB_HUB/30_DECISIONS/replies/song_gate.py lyrics songs/geopolitical_thrillers_conspiracy_theories/geopolitical_thrillers_conspiracy_theories.part2.r5.suno.txt --deck registry/assets/v1/decks/geopolitical_thrillers_conspiracy_theories.json --songlines songs/geopolitical_thrillers_conspiracy_theories/geopolitical_thrillers_conspiracy_theories.songlines.json --media media/kfb/Uncle_FrizzleBob_s_Kayfabizarro_-_Geopolitical_Thrillers_and_Conspiracy_Theories_-_ADD_web_ID.pdf.json --cards 29-56 --corpus tools/KFB-ToolBox/_inbox/KFB_HUB/30_DECISIONS/replies/OPENER_ARC_R2 .song-corpus
