name: KCL-M1 Locomotion Sync Stage public proof
on:
  push:
    branches: [main]
    paths:
      - 'kfb-hub/stage/game-dev-studio/kcl-m1-locomotion-sync/**'
      - '.github/workflows/kcl-m1-locomotion-sync-stage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kfb-hub/stage/game-dev-studio/kcl-m1-locomotion-sync
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cloudflare Stage browser proof
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
          node kfb-hub/stage/game-dev-studio/kcl-m1-locomotion-sync/public-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kcl-m1-locomotion-sync-stage-evidence
          path: kcl-m1-stage-evidence
          retention-days: 14
