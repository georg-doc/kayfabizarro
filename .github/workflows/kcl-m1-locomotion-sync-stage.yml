name: KCL-M1 Locomotion Sync Stage proof
on:
  push:
    branches: [main]
    paths:
      - 'kfb-hub/stage/game-dev-studio/kcl-m1-locomotion-sync/**'
      - '.github/workflows/kcl-m1-locomotion-sync-stage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kfb-hub/stage/game-dev-studio/kcl-m1-locomotion-sync
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node --check kfb-hub/stage/game-dev-studio/kcl-m1-locomotion-sync/bench.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Start local Stage mirror
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/kcl-m1-http.log 2>&1 &
          echo $! > /tmp/kcl-m1-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/kfb-hub/stage/game-dev-studio/kcl-m1-locomotion-sync/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kcl-m1-http.log
          exit 1
      - name: Local WebGL + measurement proof
        run: node kfb-hub/stage/game-dev-studio/kcl-m1-locomotion-sync/local-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kcl-m1-locomotion-sync-local-evidence
          path: kcl-m1-local-evidence
          retention-days: 14

  public-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kfb-hub/stage/game-dev-studio/kcl-m1-locomotion-sync
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cloudflare Stage browser proof
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
          node kfb-hub/stage/game-dev-studio/kcl-m1-locomotion-sync/public-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kcl-m1-locomotion-sync-stage-evidence
          path: kcl-m1-stage-evidence
          retention-days: 14
