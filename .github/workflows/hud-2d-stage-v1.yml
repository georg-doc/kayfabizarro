name: HUD 2D Stage v1 public proof
on:
  push:
    branches: [main]
    paths:
      - 'kfb-hub/stage/stunt-world/hud-2d-v1/**'
      - '.github/workflows/hud-2d-stage-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kfb-hub/stage/stunt-world/hud-2d-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cloudflare Stage browser proof
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
          node kfb-hub/stage/stunt-world/hud-2d-v1/public-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hud-2d-stage-v1-public-evidence
          path: hud-2d-stage-evidence
          retention-days: 14
