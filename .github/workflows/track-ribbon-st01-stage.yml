name: Track Ribbon S-T01 · Stage mirror QA

on:
  pull_request:
    branches:
      - main
    paths:
      - 'kfb-hub/stage/stunt-world/track-ribbon-st01/**'
      - 'kfb-hub/stage/index.html'
      - '.github/workflows/track-ribbon-st01-stage.yml'
  workflow_dispatch:

jobs:
  browser-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mirror source contract
        run: |
          node --check kfb-hub/stage/stunt-world/track-ribbon-st01/site/feel-lab-st01.mjs
          node --check kfb-hub/stage/stunt-world/track-ribbon-st01/site/race-track-adapter.mjs
          node - <<'NODE'
          const fs=require('fs');
          const root='kfb-hub/stage/stunt-world/track-ribbon-st01/';
          const d=JSON.parse(fs.readFileSync(root+'DEPLOYMENT.json','utf8'));
          const m=JSON.parse(fs.readFileSync(root+'PUBLIC_MANIFEST.json','utf8'));
          if(d.testedRaceCommit!=='9d67a259e496f2f2fdbbf3940553446fae20890a') throw Error('wrong Race evidence pin');
          if(m.testedRaceCommit!==d.testedRaceCommit) throw Error('manifest/deployment pin mismatch');
          const cfg=JSON.parse(fs.readFileSync(root+'site/RACE_TRACK_ST01_CONFIG.json','utf8'));
          if(JSON.stringify(cfg.widthClasses)!==JSON.stringify({NARROW:10.8,STANDARD:14.4,WIDE:18,HERO:21.6})) throw Error('width ladder mismatch');
          console.log('mirror contract PASS');
          NODE
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local public mirror
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/st01-stage.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/kfb-hub/stage/stunt-world/track-ribbon-st01/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/st01-stage.log
          exit 1
      - name: Chromium mirror proof
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const r={checks:[],errors:[],httpErrors:[]};
            const check=(n,p,d)=>{r.checks.push({name:n,pass:!!p,details:d});if(!p)throw Error(n)};
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            page.on('pageerror',e=>r.errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error'&&!/favicon/i.test(m.text()))r.errors.push(m.text())});
            page.on('response',x=>{if(x.status()>=400&&!/favicon/i.test(x.url()))r.httpErrors.push({status:x.status(),url:x.url()})});
            const t0=Date.now();
            await page.goto('http://127.0.0.1:4173/kfb-hub/stage/stunt-world/track-ribbon-st01/',{waitUntil:'domcontentloaded',timeout:180000});
            await page.waitForFunction(()=>window.__KFB_ST01_READY__===true,{},{timeout:180000});
            r.bootMs=Date.now()-t0;
            const s=await page.evaluate(()=>window.__KFB_ST01__.snapshot());
            check('Stage mirror boots',s.id==='kfb-track-ribbon-st01',s.id);
            check('Race v0.8 remains physical owner',s.physicalOwner==='TRACK_LAB_V08_RACE',s.physicalOwner);
            check('single-surface Toy Grid',s.grid.mode==='SINGLE_SURFACE_SHADER'&&s.grid.overlayMeshes===0,s.grid);
            check('3/3 cue assets',s.cueCluster.loaded===3&&s.cueCluster.failed.length===0,s.cueCluster);
            for(const [key,w] of Object.entries({standard:14.4,wide:18,narrow:10.8,ramp:21.6,landing:21.6})){
              const t=await page.evaluate(k=>window.__KFB_ST01__.samples[k],key);
              await page.evaluate(t=>window.__KFB_ST01__.teleport(t),t);
              await page.waitForTimeout(80);
              const q=await page.evaluate(()=>window.__KFB_ST01__.snapshot());
              check('width '+key,Math.abs(q.trackWidth-w)<.06,q.trackWidth);
            }
            check('no page errors',r.errors.length===0,r.errors);
            check('no failed HTTP assets',r.httpErrors.length===0,r.httpErrors);
            r.status='PASS';
            await page.screenshot({path:'/tmp/st01-stage.png'});
            await browser.close();
            fs.mkdirSync('stage-proof',{recursive:true});
            fs.writeFileSync('stage-proof/results.json',JSON.stringify(r,null,2)+'\n');
            fs.copyFileSync('/tmp/st01-stage.png','stage-proof/st01-stage.png');
            console.log(JSON.stringify({status:r.status,checks:r.checks.length,bootMs:r.bootMs,errors:r.errors.length,httpErrors:r.httpErrors.length}));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: track-ribbon-st01-stage-proof
          path: stage-proof
