name: Travel Ground regression probe
on:
  push:
    branches: ['fix/travel-ground-regression-*']
    paths: ['.github/workflows/travel-ground-regression.yml','travel/wip/travel_globe_wsa/world-builder/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Inspect actual current KFB Ground runtime
        shell: bash
        run: |
          mkdir -p ground-probe
          cat > ground-probe/probe.mjs <<'JS'
          import fs from 'node:fs';import {chromium} from 'playwright';
          const url='https://kayfabizarro.pages.dev/travel/wip/travel_globe_wsa/world-builder/?wb0=1&ground=8';
          const r={url,date:new Date().toISOString(),checks:[],errors:[],humanAcceptance:'PENDING',status:'DIAGNOSTIC'};
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-unsafe-swiftshader']});let page;
          try{
            const ctx=await browser.newContext({viewport:{width:1440,height:900}});page=await ctx.newPage();
            page.on('pageerror',e=>r.errors.push(String(e)));page.on('console',m=>{if(m.type()==='error')r.errors.push(m.text())});
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>window.__globe&&window.__wb0?.movementLab&&window.__globe?.teppiche,{},{timeout:120000});
            await page.waitForTimeout(12000);
            r.cards=await page.evaluate(()=>{
              const g=window.__globe,w=window.__wb0,T=g.THREE,root=g.scene.getObjectByName('WB0 Ground Player');
              const list=g.teppiche?.teppiche||[];const player=root?.getWorldPosition(new T.Vector3())||null;
              let nearest=Infinity,nearestPoint=null,visible=0,textured=0,art=0;
              for(const t of list){if(t.mesh?.visible!==false&&t.mesh?.parent)visible++;if(t.mat?.map)textured++;if(t.art===true)art++;
                if(player&&t.n&&Number.isFinite(t.rOben)){const p=t.n.clone().multiplyScalar(t.rOben);const d=p.distanceTo(player);if(d<nearest){nearest=d;nearestPoint=p.toArray();}}}
              return {count:list.length,groupVisible:g.teppiche?.group?.visible!==false,visible,textured,art,nearest:Number.isFinite(nearest)?nearest:null,nearestPoint,tor:g.teppiche?.tor?.(),deckName:g.deckName,params:{...g.teppiche?.params}};
            });
            r.profiles={};
            for(const id of ['actionFigure','monstrosity','legacyWarband','frizzleBeeMech','flamingoMech']){
              await page.evaluate(async id=>{await window.__wb0.movementLab.activate(id,false)},id);await page.waitForTimeout(800);
              r.profiles[id]=await page.evaluate(()=>{
                const w=window.__wb0,g=window.__globe,T=g.THREE,visual=g.scene.getObjectByName('WB0 Player Visual');
                const box=visual?new T.Box3().setFromObject(visual):null,size=box?.getSize(new T.Vector3());
                return {report:w.movementLab.report(),groundSpeed:w.ground.params.speed,runMul:w.ground.params.runMul,visibleHeight:size?.y||null,rootScale:g.scene.getObjectByName('WB0 Ground Player')?.scale?.x||null};
              });
            }
            r.ground=await page.evaluate(()=>({state:window.__wb0.ground.state,params:{...window.__wb0.ground.params},support:window.__wb0.supportSurfaces?.report?.()}));
            await page.screenshot({path:'ground-probe/runtime.png',fullPage:false});
            r.checks.push({name:'runtime boot',pass:true});
            r.checks.push({name:'terrain cards built',pass:(r.cards.count||0)>0,details:r.cards});
            r.checks.push({name:'terrain cards visible',pass:(r.cards.visible||0)>0,details:r.cards.visible});
            r.checks.push({name:'terrain cards textured',pass:(r.cards.textured||0)>0,details:r.cards.textured});
            r.status='PASS_WITH_DIAGNOSTICS';
          }catch(e){r.status='FAIL';r.failure=String(e.stack||e);if(page)await page.screenshot({path:'ground-probe/fail.png'}).catch(()=>{});process.exitCode=1}
          finally{await browser.close();fs.writeFileSync('ground-probe/report.json',JSON.stringify(r,null,2));console.log(JSON.stringify(r,null,2));}
          JS
          node ground-probe/probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: travel-ground-regression-probe
          path: ground-probe
          retention-days: 14
