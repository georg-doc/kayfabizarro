name: AUDIO emotional donor census
on:
  push:
    branches: ['chatgpt-web/audio-stem-bed-02-mood-pool-2026-10-03']
    paths: ['kfb-hub/stage/audio-emotional-census/**','.github/workflows/audio-emotional-census.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kfb-hub/stage/audio-emotional-census
            media/3D_Assets/Sounds/KFB RoadTrip JukeBox v2/Awe Before Drama.mp3
            media/3D_Assets/Sounds/KFB RoadTrip JukeBox v2/Awe Before Drama Stems (82BPM)
            media/3D_Assets/Sounds/KFB RoadTrip JukeBox v2/Buant Groove.mp3
            media/3D_Assets/Sounds/KFB RoadTrip JukeBox v2/Buant Groove Stems (105BPM)
            media/3D_Assets/Sounds/KFB RoadTrip JukeBox v2/Dorian Rests.mp3
            media/3D_Assets/Sounds/KFB RoadTrip JukeBox v2/Dorian Rests Stems (66BPM)
            media/3D_Assets/Sounds/KFB RoadTrip JukeBox v2/Stalking Groove.mp3
            media/3D_Assets/Sounds/KFB RoadTrip JukeBox v2/Stalking Groove Stems (107BPM)
            .github/workflows/audio-emotional-census.yml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.51.1 && npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 >/tmp/http.log 2>&1 & sleep 2
      - run: node kfb-hub/stage/audio-emotional-census/qa.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: audio-emotional-census-proof, path: audio-emotional-census-proof/, retention-days: 14}
