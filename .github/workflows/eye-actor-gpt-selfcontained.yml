name: Eye Actor GPT Self-contained
on:
  push:
    branches:
      - chatgpt-web/toolbox-eye-actor-studio-v1-2026-09-21
    paths:
      - 'kfb-hub/stage/toolbox/eye-actor-studio/gpt-selfcontained/**'
      - 'tools/KFB-ToolBox/eye-actor-studio-v1/_generated/mannequin-medium-compact.js'
      - '.github/workflows/eye-actor-gpt-selfcontained.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax
        run: node --check kfb-hub/stage/toolbox/eye-actor-studio/gpt-selfcontained/browser-proof.mjs
      - name: Install browser
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/gpt-self.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/kfb-hub/stage/toolbox/eye-actor-studio/gpt-selfcontained/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/gpt-self.log; exit 1
      - name: Desktop + mobile proof
        run: node kfb-hub/stage/toolbox/eye-actor-studio/gpt-selfcontained/browser-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eye-actor-gpt-selfcontained-evidence
          path: gpt-selfcontained-evidence
          retention-days: 14
