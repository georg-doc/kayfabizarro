name: AUDIO-CAL-01 branch QA

on:
  push:
    branches:
      - 'web/kfb-audio-soundscape-baseline-2026-09-24'
    paths:
      - 'kfb-hub/stage/audio-calibration/**'
      - 'media/3D_Assets/Audio/ui-sfx.json'
      - 'media/3D_Assets/CATALOG/audio-catalog.json'
      - 'media/3D_Assets/CATALOG/build_catalog.py'
      - 'tools/audio/validate-audio-manifests.mjs'
      - '.github/workflows/audio-calibration-stage.yml'
  pull_request:
    paths:
      - 'kfb-hub/stage/audio-calibration/**'
      - 'media/3D_Assets/Audio/ui-sfx.json'
      - 'media/3D_Assets/CATALOG/audio-catalog.json'
      - 'media/3D_Assets/CATALOG/build_catalog.py'
      - 'tools/audio/validate-audio-manifests.mjs'
      - '.github/workflows/audio-calibration-stage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate manifests and catalog
        run: node tools/audio/validate-audio-manifests.mjs

      - name: Syntax check calibration modules
        run: |
          node --check kfb-hub/stage/audio-calibration/audio-calibration.js
          node --check kfb-hub/stage/audio-calibration/qa.mjs

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium

      - name: Start repository HTTP preview
        run: |
          python3 -m http.server 4173 > /tmp/audio-cal-http.log 2>&1 &
          echo $! > /tmp/audio-cal-http.pid
          sleep 2

      - name: Run AUDIO-CAL-01 browser QA
        run: node kfb-hub/stage/audio-calibration/qa.mjs

      - name: Upload AUDIO-CAL-01 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-cal-01-proof
          path: audio-cal-proof/
          retention-days: 14
