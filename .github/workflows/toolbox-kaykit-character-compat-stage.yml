name: ToolBox KayKit Character Compatibility v0 Stage proof
on:
  push:
    branches: [main]
    paths:
      - 'kfb-hub/stage/toolbox/kaykit-character-compat-v0/**'
      - '.github/workflows/toolbox-kaykit-character-compat-stage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            kfb-hub/stage/toolbox/kaykit-character-compat-v0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check kfb-hub/stage/toolbox/kaykit-character-compat-v0/app.mjs
          node --check kfb-hub/stage/toolbox/kaykit-character-compat-v0/proof.mjs
      - name: Exact public donor-isolation proof
        env:
          KCC_BASE_URL: https://kayfabizarro.pages.dev/kfb-hub/stage/toolbox/kaykit-character-compat-v0/
          KCC_PUBLIC: '1'
          KCC_SOURCE_HEAD: 0fd958f6c35c1b6d74abac2dfc37340eaec6c0c5
          KCC_PROOF_DIR: kcc-v0-stage-evidence
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node kfb-hub/stage/toolbox/kaykit-character-compat-v0/proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kcc-v0-stage-evidence
          path: kcc-v0-stage-evidence
          retention-days: 14
