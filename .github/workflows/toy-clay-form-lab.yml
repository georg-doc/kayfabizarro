name: Toy Clay Form Lab
on:
  push:
    branches:
      - chatgpt-web/mobile-preview-chatterbox-legacy-pet-2026-09-21
    paths:
      - 'tools/KFB-ToolBox/toy-clay-form-lab/**'
      - 'kfb-hub/stage/toolbox/toy-clay-form-lab/**'
      - 'skills/chat/workflows/KFB_MOBILE_PREVIEW_CHATTERBOX_LEGACY_PET_2026-09-21/**'
      - '.github/workflows/toy-clay-form-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static contracts
        run: node kfb-hub/stage/toolbox/toy-clay-form-lab/static-check.mjs
      - name: Install browser
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Start local repo server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kfb-toy-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/kfb-hub/stage/toolbox/toy-clay-form-lab/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/kfb-toy-http.log; exit 1
      - name: Desktop + mobile WebGL proof
        run: node kfb-hub/stage/toolbox/toy-clay-form-lab/browser-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toy-clay-form-lab-evidence
          path: toy-clay-evidence
          retention-days: 14
