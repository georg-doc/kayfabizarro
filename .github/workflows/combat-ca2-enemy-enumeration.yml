name: Combat CA2-03B state playback
on:
  push:
    branches: ['chatgpt-web/ca2-03-enemy-adapters-2026-09-20']
    paths:
      - 'kfb-hub/stage/combat/ca2-enemy-adapters/index.html'
      - 'kfb-hub/stage/combat/ca2-enemy-adapters/lab.mjs'
      - 'kfb-hub/stage/combat/ca2-enemy-adapters/proof.mjs'
      - '.github/workflows/combat-ca2-enemy-enumeration.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  branch-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Static
        run: |
          node --check kfb-hub/stage/combat/ca2-enemy-adapters/lab.mjs
          node --check kfb-hub/stage/combat/ca2-enemy-adapters/proof.mjs
          node -e "JSON.parse(require('fs').readFileSync('kfb-hub/stage/combat/ca2-enemy-adapters/SOURCE.json','utf8'))"
      - name: Browser playback proof
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ca203.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/kfb-hub/stage/combat/ca2-enemy-adapters/SOURCE.json >/dev/null && break; sleep 1; done
          CA203_BASE_URL=http://127.0.0.1:4173/kfb-hub/stage/combat/ca2-enemy-adapters/ CA203_SOURCE_HEAD=a1594a60805a2254c45eceb4ca8f5053a3e8aad4 CA203_PROOF_DIR=ca203-playback-evidence node kfb-hub/stage/combat/ca2-enemy-adapters/proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: ca203-playback-evidence, path: ca203-playback-evidence, retention-days: 14}
