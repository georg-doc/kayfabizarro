name: One-shot patch lead recovery priority

on:
  push:
    paths:
      - '.github/workflows/patch-lead-recovery-priority.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add current priority pointer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('skills/chat/recovery/CURRENT_LEAD_CHECKPOINT_2026-09-15.md')
          s=p.read_text(encoding='utf-8')
          anchor='**Human bookmark:** `https://kayfabizarro.pages.dev/kfb-hub/` — searchable navigator across the links below; never a replacement SSOT.\n'
          extra='\n**Current execution order:** `skills/chat/recovery/CURRENT_PRIORITY_BOARD_2026-09-15.md` — P0 Birthday actor handoff → Astra startscreen → QA/freeplay; P1 juice/ToolBox-B; P2 Town terrain + look/audio calibration.\n\n**Current direct handoffs:** ToolBox/Design `tools/KFB-ToolBox/_handover/BIRTHDAY_STARTSCREEN_2026-09-15/START_HERE.md`; Travel/Astra `georg-doc/KFB-Travel-Globe/_handover/BIRTHDAY_STARTSCREEN_ASTRA_2026-09-15/START_HERE.md`.\n'
          if 'Current execution order:' not in s:
              if anchor not in s: raise SystemExit('bookmark anchor missing')
              s=s.replace(anchor,anchor+extra,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KFB Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/patch-lead-recovery-priority.yml
          git add skills/chat/recovery/CURRENT_LEAD_CHECKPOINT_2026-09-15.md
          git commit -m 'docs(recovery): route current Birthday execution order'
          git pull --rebase origin main
          git push origin HEAD:main
