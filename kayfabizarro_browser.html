<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kayfabizarro Corpus Browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow+Semi+Condensed:wght@400;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#f5f0e8; --paper2:#ede8dc; --paper3:#e5dfd1;
  --ink:#2c2416; --ink2:#4a3f2c; --ink3:#7a6e55; --ink4:#a89e88;
  --amber:#8b6914; --amber2:#c8a84b; --rust:#a0432f;
  --green:#2d6a0a; --green2:#4a8f20;
  --border:#d4c5a0; --border2:#c0ae88;
  --g1:#2d6a0a; --g1b:#e8f4e1;
  --g2:#8b6914; --g2b:#fdf6e3;
  --g3:#a0432f; --g3b:#fdeee9;
  --fd:'Barlow Condensed',sans-serif;  /* display */
  --fu:'Barlow Semi Condensed',sans-serif; /* ui */
  --fb:'Barlow',sans-serif;            /* body */
}
html,body{height:100%;background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.5}

/* ── Header ─────────────────────────────────────────────── */
#hdr{
  position:sticky;top:0;z-index:100;
  background:var(--ink);border-bottom:2px solid var(--amber);
  padding:7px 14px 5px;
}
#hdr-row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
#logo{font-family:var(--fd);font-size:1.3rem;font-weight:800;
  letter-spacing:.06em;color:var(--paper);text-transform:uppercase;white-space:nowrap}
#hdr-controls{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
#search-box{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  color:var(--paper);padding:5px 11px;border-radius:4px;
  font-family:var(--fu);font-size:13px;width:180px;outline:none;
}
#search-box::placeholder{color:#7a6e58}
#search-box:focus{border-color:var(--amber2)}
#sort-lbl{font-family:var(--fu);font-size:11px;font-weight:600;
  color:#8a7a5a;text-transform:uppercase;letter-spacing:.07em}
#sort-sel{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  color:var(--paper);padding:4px 8px;border-radius:4px;
  font-family:var(--fu);font-size:13px;outline:none;cursor:pointer;
}
#sort-sel:focus{border-color:var(--amber2)}
.view-btn{
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);
  color:#8a7a5a;padding:4px 8px;border-radius:4px;
  font-family:var(--fu);font-size:12px;cursor:pointer;transition:all .12s;
}
.view-btn.active{background:var(--amber);border-color:var(--amber);color:#fff}
#stats-bar{font-family:var(--fu);font-size:12px;color:#b0a078;
  display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ss{color:#4a3f2c}
#result-count{color:#6a5e44;font-family:var(--fu);font-size:12px;margin-left:auto}

/* ── Layout ──────────────────────────────────────────────── */
#app{display:flex;height:calc(100vh - var(--hh,64px));overflow:hidden}

/* ── Sidebar ─────────────────────────────────────────────── */
#sb{
  background:var(--paper2);border-right:1px solid var(--border);
  overflow-y:auto;overflow-x:hidden;
  transition:width .2s ease;
  flex-shrink:0;
  width:216px;
}
#sb.collapsed{width:38px;overflow:hidden}
#sb-inner{width:216px;padding:10px 9px}
#sb.collapsed #sb-inner{opacity:0;pointer-events:none}
#sb-toggle{
  display:flex;align-items:center;justify-content:center;
  width:38px;height:38px;cursor:pointer;
  background:var(--paper3);border-bottom:1px solid var(--border);
  color:var(--ink3);font-size:16px;flex-shrink:0;
  transition:background .12s;user-select:none;
  position:sticky;top:0;z-index:10;
}
#sb-toggle:hover{background:var(--border);color:var(--ink)}
#sb-collapsed-indicators{
  display:none;flex-direction:column;align-items:center;
  gap:6px;padding:8px 0;
}
#sb.collapsed #sb-collapsed-indicators{display:flex}
.sb-ind{
  width:8px;height:8px;border-radius:50%;
  background:var(--amber);opacity:.75;cursor:pointer;
  transition:opacity .12s;
}
.sb-ind:hover{opacity:1}
.sb-ind-count{
  font-family:var(--fu);font-size:9px;font-weight:700;
  color:var(--amber);background:rgba(139,105,20,.12);
  border-radius:8px;padding:1px 5px;
}

.fg{margin-bottom:12px}
.fl{font-family:var(--fu);font-size:10px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);
  margin-bottom:5px;padding-bottom:3px;border-bottom:1px solid var(--border)}
.chips{display:flex;flex-wrap:wrap;gap:3px}
.chip{cursor:pointer;padding:2px 7px;border-radius:10px;
  border:1px solid var(--border2);background:var(--paper);
  color:var(--ink3);font-family:var(--fu);font-size:11px;
  user-select:none;transition:all .12s}
.chip:hover{border-color:var(--amber);color:var(--amber)}
.chip.on{background:var(--amber);border-color:var(--amber);color:#fff}
select.fsel{width:100%;padding:4px 6px;border:1px solid var(--border2);
  border-radius:4px;background:var(--paper);color:var(--ink);
  font-family:var(--fu);font-size:12px;outline:none;cursor:pointer}
select.fsel:focus{border-color:var(--amber)}
.toggles{display:flex;gap:4px;flex-wrap:wrap}
.tog{cursor:pointer;padding:2px 8px;border-radius:4px;
  border:1px solid var(--border2);background:var(--paper);
  color:var(--ink3);font-family:var(--fu);font-size:11px;
  user-select:none;transition:all .12s}
.tog:hover{border-color:var(--amber)}
.tog.on{background:var(--amber);border-color:var(--amber);color:#fff}
.tog.off{background:var(--rust);border-color:var(--rust);color:#fff}
.rrow{display:flex;align-items:center;gap:5px;margin-top:3px}
.rrow input[type=range]{flex:1;accent-color:var(--amber);height:3px}
.rl{font-family:var(--fu);font-size:10px;color:var(--ink3);min-width:20px}
.rv{font-family:var(--fu);font-size:10px;color:var(--amber);min-width:30px;text-align:right;float:right}
.reset-btn{width:100%;padding:4px;border:1px solid var(--border2);background:transparent;
  color:var(--ink3);border-radius:4px;cursor:pointer;
  font-family:var(--fu);font-size:11px;margin-top:4px;transition:all .12s}
.reset-btn:hover{border-color:var(--rust);color:var(--rust)}

/* ── Main ────────────────────────────────────────────────── */
#main{flex:1;overflow-y:auto;padding:12px 13px}

/* ── Gallery grid ────────────────────────────────────────── */
#deck-grid.gallery{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
#deck-grid.list{display:flex;flex-direction:column;gap:0}

/* ── Deck card — gallery ─────────────────────────────────── */
.dk{background:#faf7f2;border:1px solid var(--border);border-radius:6px;
  cursor:pointer;transition:border-color .12s,box-shadow .12s;overflow:hidden;position:relative}
#deck-grid.gallery .dk{display:flex;flex-direction:column}
.dk:hover{border-color:var(--amber2);box-shadow:0 2px 10px rgba(139,105,20,.12)}
.dk.superseded{opacity:.35}

/* Thumbnail */
.dk-thumb{
  width:100%;height:120px;overflow:hidden;
  background:var(--paper3);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;position:relative;
}
.dk-thumb canvas{width:100%;height:auto;display:block}
.dk-thumb.loaded canvas{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.dk-thumb-ph{color:var(--ink4);font-family:var(--fu);font-size:11px}
#deck-grid.list .dk-thumb{width:64px;height:64px;flex-shrink:0;border-bottom:none;border-right:1px solid var(--border)}

/* Card body */
.dk-body{padding:8px 10px 7px;flex:1;display:flex;flex-direction:column}
#deck-grid.list .dk{flex-direction:row;align-items:stretch;border-radius:0;border-left:none;border-right:none;border-top:none}
#deck-grid.list .dk:first-child{border-top:1px solid var(--border)}

.dk-et{position:absolute;top:6px;right:7px;
  font-family:var(--fu);font-size:9px;color:rgba(255,255,255,.7);
  background:rgba(44,36,22,.5);padding:1px 5px;border-radius:3px;
  pointer-events:none;
}
#deck-grid.gallery .dk-thumb+.dk-body .dk-et{/* above thumb, not needed */ display:none}
/* re-position et badge inside body for gallery */
.dk-body{position:relative}
.dk-body .dk-et{position:absolute;top:6px;right:6px;
  background:rgba(44,36,22,.08);color:var(--ink4);padding:1px 5px;}

.dk-title{font-family:var(--fd);font-size:1rem;font-weight:700;
  color:var(--ink);line-height:1.2;margin-bottom:3px;padding-right:64px}
#deck-grid.list .dk-title{font-size:.9rem;margin-bottom:1px}

.dk-meta{font-family:var(--fu);font-size:11px;color:var(--ink3);margin-bottom:6px}
#deck-grid.list .dk-meta{margin-bottom:2px;font-size:10px}

/* Grade row — bigger & bolder */
.dk-grades{display:flex;gap:10px;align-items:baseline;margin-bottom:5px;flex-wrap:wrap}
.dkg1{font-family:var(--fd);font-size:1rem;font-weight:800;color:var(--g1)}
.dkg2{font-family:var(--fd);font-size:.9rem;font-weight:700;color:var(--g2)}
.dkg3{font-family:var(--fd);font-size:.9rem;font-weight:700;color:var(--g3)}
.dkov{font-family:var(--fu);font-size:12px;font-weight:600;color:var(--ink3)}
.dkcs{font-family:var(--fu);font-size:12px;font-weight:600;color:var(--amber)}
#deck-grid.list .dkg1{font-size:.85rem}.#deck-grid.list .dkg2,.#deck-grid.list .dkg3{font-size:.8rem}

.dk-series{font-family:var(--fu);font-size:10px;color:var(--ink3);margin-bottom:5px}

/* Bottom row: tags + actions on baseline */
.dk-bottom{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.tag{font-family:var(--fu);font-size:10px;font-weight:700;
  padding:2px 6px;border-radius:3px;border:1px solid currentColor;
  text-transform:uppercase;letter-spacing:.04em;line-height:1.4}
.t-raf{color:var(--amber)}.t-demo{color:var(--rust)}.t-font{color:var(--ink4)}
.t-pub{color:var(--green)}.t-sup{color:var(--ink4)}
.t-stub{color:var(--rust)}.t-partial{color:var(--amber)}
.btn-browse{
  padding:3px 10px;border:1px solid var(--border2);border-radius:3px;
  background:transparent;color:var(--ink3);
  font-family:var(--fu);font-size:11px;font-weight:600;
  cursor:pointer;transition:all .12s;white-space:nowrap;
}
.btn-browse:hover{border-color:var(--amber);color:var(--amber);background:rgba(139,105,20,.04)}
.btn-pdf{
  padding:3px 9px;border:1px solid var(--green);border-radius:3px;
  background:transparent;color:var(--green);
  font-family:var(--fu);font-size:11px;font-weight:700;
  cursor:pointer;transition:all .12s;white-space:nowrap;
}
.btn-pdf:hover{background:var(--green);color:#fff}
.dk-spacer{flex:1}

/* ── Panel ───────────────────────────────────────────────── */
#backdrop{display:none;position:fixed;inset:0;z-index:150;background:rgba(44,36,22,.22)}
#backdrop.v{display:block}
#panel{
  position:fixed;top:0;right:0;bottom:0;
  width:min(760px,100vw);background:var(--paper);
  border-left:2px solid var(--border2);
  box-shadow:-6px 0 24px rgba(44,36,22,.18);
  display:flex;flex-direction:column;z-index:200;
  transform:translateX(110%);transition:transform .22s ease;
}
#panel.open{transform:translateX(0)}
#panel-hdr{padding:11px 15px 9px;background:var(--ink);
  border-bottom:2px solid var(--amber);flex-shrink:0;position:relative}
#panel-close{position:absolute;top:9px;right:12px;background:none;
  border:none;color:rgba(255,255,255,.5);cursor:pointer;font-size:20px;line-height:1}
#panel-close:hover{color:#fff}
#panel-title{font-family:var(--fd);font-size:1.2rem;font-weight:800;
  color:var(--paper);line-height:1.2;padding-right:32px;margin-bottom:3px}
#panel-sub{font-family:var(--fu);font-size:12px;color:#b0a078}
#panel-body{flex:1;overflow-y:auto}

/* Panel top strip */
#panel-top{padding:10px 15px 8px;border-bottom:1px solid var(--border)}
#panel-grades{margin-bottom:6px}
.grade-trk{height:8px;border-radius:4px;overflow:hidden;display:flex;
  background:var(--border);margin-bottom:4px}
.gs{transition:width .3s}.gs-1{background:var(--g1)}.gs-2{background:var(--g2)}.gs-3{background:var(--g3)}
.grade-labs{display:flex;gap:12px;font-family:var(--fd);font-size:.9rem;font-weight:700}
.gl1{color:var(--g1)}.gl2{color:var(--g2)}.gl3{color:var(--g3)}
#panel-tags{display:flex;gap:4px;flex-wrap:wrap;align-items:center}

/* Accordion */
.acc{border-bottom:1px solid var(--border)}
.acc-hdr{display:flex;align-items:center;gap:7px;padding:8px 15px;
  cursor:pointer;background:var(--paper2);user-select:none;transition:background .12s}
.acc-hdr:hover{background:var(--paper3)}
.arr{font-size:10px;color:var(--amber);transition:transform .15s;flex-shrink:0}
.acc.open .arr{transform:rotate(90deg)}
.acc-label{font-family:var(--fd);font-size:.9rem;font-weight:700;
  color:var(--ink);text-transform:uppercase;letter-spacing:.04em}
.acc-sum{font-family:var(--fu);font-size:12px;color:var(--ink3);margin-left:auto}
.acc-body{display:none;padding:12px 15px}
.acc.open .acc-body{display:block}

/* QA scores */
.qa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:7px;margin-bottom:11px}
.qa-item{background:var(--paper2);border:1px solid var(--border);
  border-radius:5px;padding:6px 10px}
.qa-key{font-family:var(--fu);font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-bottom:3px}
.qa-val{font-family:var(--fd);font-size:1.35rem;font-weight:800;line-height:1}
.qa-num{/* just the number */}
.qa-num.hi{color:var(--green)}.qa-num.lo{color:var(--rust)}.qa-num.mid{color:var(--amber)}
.qa-denom{font-family:var(--fu);font-size:.75rem;font-weight:500;color:var(--ink4)}
.verdict-box{background:var(--paper2);border-left:3px solid var(--amber);
  padding:9px 13px;border-radius:0 5px 5px 0;
  font-family:var(--fb);font-size:14px;font-style:italic;
  color:var(--ink2);line-height:1.55;margin-bottom:11px}
.info-row{display:flex;gap:6px;align-items:flex-start;margin-bottom:5px}
.ik{font-family:var(--fu);font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);
  min-width:100px;flex-shrink:0;margin-top:2px}
.iv{font-family:var(--fb);font-size:14px;color:var(--ink2);flex:1;line-height:1.5}
.flag-box{background:var(--g3b);border:1px solid var(--g3);border-radius:4px;
  padding:5px 9px;font-family:var(--fu);font-size:12px;color:var(--rust);margin-bottom:8px}

/* Cover section */
.cover-hdr{display:flex;align-items:baseline;gap:10px;margin-bottom:7px;flex-wrap:wrap}
.cover-score{font-family:var(--fd);font-size:1.3rem;font-weight:700;color:var(--amber)}
.cover-subs{display:flex;gap:5px;flex-wrap:wrap}
.cover-sub{font-family:var(--fu);font-size:11px;background:var(--paper2);
  border:1px solid var(--border);border-radius:3px;padding:1px 6px;color:var(--ink3)}
.cover-note{font-family:var(--fb);font-size:14px;color:var(--ink2);line-height:1.5;margin-bottom:7px}

/* PDF viewer accordion */
#pdf-viewer-wrap{background:var(--ink);padding:0;text-align:center}
#pdf-canvas-el{max-width:100%;display:block;margin:0 auto}
#pdf-nav-bar{display:flex;align-items:center;justify-content:center;gap:10px;
  padding:7px 12px;background:rgba(0,0,0,.3)}
.pdf-nav-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  color:#f0e8d0;padding:4px 12px;border-radius:4px;cursor:pointer;
  font-family:var(--fu);font-size:12px;transition:background .12s}
.pdf-nav-btn:hover{background:rgba(255,255,255,.2)}
.pdf-nav-btn:disabled{opacity:.35;cursor:default}
#pdf-page-info{font-family:var(--fu);font-size:12px;color:#b0a078;min-width:70px;text-align:center}
#pdf-fs-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  color:#b0a078;padding:4px 9px;border-radius:4px;cursor:pointer;
  font-family:var(--fu);font-size:12px;margin-left:auto;transition:all .12s}
#pdf-fs-btn:hover{background:rgba(255,255,255,.15);color:#f0e8d0}
#pdf-status{font-family:var(--fu);font-size:12px;color:#8a7a5a;
  padding:20px;text-align:center}

/* Card list */
#card-ctrl{display:flex;gap:6px;align-items:center;
  padding:7px 15px;border-bottom:1px solid var(--border);
  background:var(--paper2);flex-wrap:wrap}
#card-q{flex:1;min-width:120px;padding:5px 10px;
  border:1px solid var(--border2);border-radius:4px;
  background:var(--paper);color:var(--ink);
  font-family:var(--fu);font-size:14px;outline:none}
#card-q:focus{border-color:var(--amber)}
.cgf{cursor:pointer;padding:3px 9px;border-radius:4px;
  border:1px solid var(--border2);
  font-family:var(--fu);font-size:12px;font-weight:700;
  color:var(--ink3);user-select:none;transition:all .12s}
.cgf.on1{background:var(--g1);border-color:var(--g1);color:#fff}
.cgf.on2{background:var(--g2);border-color:var(--g2);color:#fff}
.cgf.on3{background:var(--g3);border-color:var(--g3);color:#fff}
#ccount{font-family:var(--fu);font-size:12px;color:var(--ink4);margin-left:auto}
#card-list{padding-bottom:12px}
.ci{border-bottom:1px solid var(--border);cursor:pointer}
.ci:last-child{border-bottom:none}
.ci-hdr{display:flex;align-items:baseline;gap:7px;
  padding:7px 15px 5px;transition:background .1s}
.ci:hover .ci-hdr,.ci.open .ci-hdr{background:rgba(139,105,20,.05)}
.ci-n{font-family:var(--fu);font-size:11px;color:var(--ink4);min-width:24px;flex-shrink:0}
.ci-t{font-family:var(--fd);font-size:.95rem;font-weight:700;color:var(--ink);flex:1;line-height:1.2}
.ci-g{font-family:var(--fu);font-size:10px;font-weight:700;
  padding:2px 5px;border-radius:3px;flex-shrink:0}
.ci-g.g1{background:var(--g1b);color:var(--g1);border:1px solid #a8d490}
.ci-g.g2{background:var(--g2b);color:var(--g2);border:1px solid #d8c070}
.ci-g.g3{background:var(--g3b);color:var(--g3);border:1px solid #d09080}
.ci-arr{font-size:9px;color:var(--ink4);flex-shrink:0;transition:transform .12s;margin-left:2px}
.ci.open .ci-arr{transform:rotate(90deg)}
.ci-body{display:none;padding:3px 15px 9px 46px}
.ci.open .ci-body{display:block}
.cf{display:flex;gap:6px;align-items:flex-start;margin-bottom:4px}
.cf-k{font-family:var(--fu);font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;color:var(--ink4);
  flex-shrink:0;min-width:50px;padding-top:2px}
.cf-v{font-family:var(--fb);font-size:15px;color:var(--ink2);line-height:1.4;flex:1}
.cf-r{margin-top:3px;padding:4px 8px;background:rgba(139,105,20,.06);
  border-left:2px solid var(--border2);border-radius:0 4px 4px 0;
  font-family:var(--fb);font-size:13px;color:var(--ink3);line-height:1.4}
#empty{grid-column:1/-1;text-align:center;padding:50px 20px;
  color:var(--ink4);font-style:italic;font-family:var(--fu)}
</style>
</head>
<body>
<div id="hdr">
  <div id="hdr-row1">
    <div id="logo">Kayfabizarro Corpus Browser</div>
    <div id="hdr-controls">
      <input id="search-box" type="search" placeholder="Search…" autocomplete="off">
      <span id="sort-lbl">Sort</span>
      <select id="sort-sel">
        <option value="cs_d">Cover ↓</option>
        <option value="ov_d">Overall ↓</option>
        <option value="g1_d">G1% ↓</option>
        <option value="vs_d">Viral ↓</option>
        <option value="cc_d">Cards ↓</option>
        <option value="tit_a">A–Z</option>
        <option value="tit_d">Z–A</option>
      </select>
      <button class="view-btn active" id="btn-gallery">▦ Gallery</button>
      <button class="view-btn" id="btn-list">☰ List</button>
      <span id="result-count"></span>
    </div>
  </div>
  <div id="stats-bar"></div>
</div>

<div id="app">
  <!-- Sidebar -->

function updateSbIndicators(){
  const el=document.getElementById('sb-collapsed-indicators');
  el.innerHTML='';
  const groups=[
    {key:'gm',active:F.gm.size>0},{key:'df',active:F.df.size>0},
    {key:'st',active:F.st.size>0},
    {key:'flags',active:F.raf!==null||F.demo!==null||F.font!==null||F.pub!==null||F.pdf!==null},
    {key:'series',active:!!F.series},{key:'tool',active:!!F.tool},
    {key:'ranges',active:F.csMin>0||F.csMax<5||F.ovMin>1||F.ovMax<10||F.g1Min>0},
  ];
  const active=groups.filter(g=>g.active);

    const cnt=document.createElement('div');
    cnt.className='sb-ind-count';cnt.textContent=active.length;
    cnt.title='Active filters';cnt.onclick=()=>{ sbOpen=true;document.getElementById('sb').classList.remove('collapsed');document.getElementById('sb-toggle').textContent='≡'; };

    active.forEach(()=>{const d=document.createElement('div');d.className='sb-ind';el.appendChild(d);});
  }
}

    [['rcs-min',0],['rcs-max',5],['rov-min',1],['rov-max',10],['rg1',0]].forEach(([id,v])=>document.getElementById(id).value=v);
    document.getElementById('cs-lbl').textContent='0–5';
    document.getElementById('ov-lbl').textContent='1–10';
    document.getElementById('g1-lbl').textContent='0%';
    updateSbIndicators();renderGrid();
  };
}

// ── Filter / sort ────────────────────────────────────────
function pass(d){
  if(F.q){const h=(d.dt+' '+d.sf+' '+d.si).toLowerCase();if(!h.includes(F.q))return false;}
  if(F.gm.size&&!F.gm.has(d.gm))return false;
  if(F.df.size&&!F.df.has(d.df))return false;
  if(F.st.size&&!F.st.has(normSt(d.st)))return false;
  if(F.raf!==null&&d.raf!==F.raf)return false;
  if(F.demo!==null&&d.dm!==F.demo)return false;
  if(F.font!==null&&(d.fa>0)!==F.font)return false;
  if(F.pub!==null&&d.ip!==F.pub)return false;
  if(F.pdf!==null&&!!d.pdf!==F.pdf)return false;
  if(F.series&&d.si!==F.series)return false;
  if(F.tool&&d.et!==F.tool)return false;
  if(d.cs!=null){if(d.cs<F.csMin||d.cs>F.csMax)return false;}else if(F.csMin>0)return false;
  if(d.ov!=null){if(d.ov<F.ovMin||d.ov>F.ovMax)return false;}
  if(F.g1Min>0&&d.gt>0&&d.g1/d.gt*100<F.g1Min)return false;
  return true;
}
function sorted(arr){
  const[k,dir]=F.sort.split('_');const asc=dir==='a';
  return arr.slice().sort((a,b)=>{
    let av,bv;
    if(k==='cs'){av=a.cs??-1;bv=b.cs??-1}
    else if(k==='ov'){av=a.ov??-1;bv=b.ov??-1}
    else if(k==='g1'){av=a.gt>0?a.g1/a.gt:-1;bv=b.gt>0?b.g1/b.gt:-1}
    else if(k==='vs'){av=a.vs??-1;bv=b.vs??-1}
    else if(k==='cc'){av=a.cc??0;bv=b.cc??0}
    else if(k==='tit'){av=a.dt.toLowerCase();bv=b.dt.toLowerCase()}
    else{av=0;bv=0}
    if(av<bv)return asc?-1:1;if(av>bv)return asc?1:-1;return 0;
  });
}

// ── Thumbnail queue ──────────────────────────────────────
const thumbCache={};let thumbQueue=[],thumbActive=0,THUMB_MAX=3;
const thumbObs=typeof IntersectionObserver!=='undefined'?new IntersectionObserver(entries=>{
  entries.forEach(e=>{if(!e.isIntersecting)return;const el=e.target;thumbObs.unobserve(el);queueThumb(el);});
},{rootMargin:'300px'}):null;

function queueThumb(el){
  const rel=el.dataset.pdf; if(!rel||el.dataset.done)return;
  el.dataset.done='1';
  thumbQueue.push(el); drainThumb();
}
async function drainThumb(){
  while(thumbQueue.length&&thumbActive<THUMB_MAX){
    const el=thumbQueue.shift(); thumbActive++;
    try{await loadThumb(el);}catch(e){}
    thumbActive--; drainThumb();
  }
}
function loadThumb(wrap){
  /* Native <embed> thumbnail — avoids fetch() which is blocked for file:// URLs */
  const rel=wrap.dataset.pdf;
  wrap.style.position='relative';wrap.style.overflow='hidden';
  const em=document.createElement('embed');
  em.src=localUrl(rel);em.type='application/pdf';
  /* Scale a wide embed down to fit the thumb height (120px). The embed renders
     the PDF at ~full width internally; we scale it down 28% via CSS transform. */
  em.style.cssText='position:absolute;top:0;left:0;width:360%;height:360%;'
    +'transform:scale(0.278);transform-origin:top left;pointer-events:none;border:none';
  wrap.innerHTML='';wrap.appendChild(em);wrap.classList.add('loaded');
}

// ── Render grid ──────────────────────────────────────────
function metaLine(d){
  const tot=d.gt||d.cc||0;
  return[d.df.replace(/_/g,' '),d.gm.replace(/_/g,' '),tot?tot+' cards':'']
    .filter((v,i,a)=>v&&a.indexOf(v)===i).join(' · ');
}
function gradeHtml(d){
  const tot=d.gt||1,p1=Math.round(d.g1/tot*100);
  const ov=d.ov!=null?`<span class="dkov">ov ${d.ov}</span>`:'';
  const cs=d.cs!=null?`<span class="dkcs">★${d.cs.toFixed(1)}</span>`:'';
  return`<div class="dk-grades"><span class="dkg1">G1 ${d.g1} (${p1}%)</span><span class="dkg2">G2 ${d.g2}</span><span class="dkg3">G3 ${d.g3}</span>${ov}${cs}</div>`;
}
function tagsHtml(d){
  const t=[];
  if(d.raf)t.push('<span class="tag t-raf">RAF</span>');
  if(d.dm) t.push('<span class="tag t-demo">Demo</span>');
  if(d.ip) t.push('<span class="tag t-pub">Published</span>');
  if(d.fa>0)t.push(`<span class="tag t-font">✱${d.fa} font</span>`);
  const ns=normSt(d.st);
  if(ns==='stub')t.push('<span class="tag t-stub">Stub</span>');
  if(ns==='partial')t.push('<span class="tag t-partial">Partial</span>');
  if(ns==='superseded')t.push('<span class="tag t-sup">Superseded</span>');
  return t.join('');
}

function renderGrid(){
  const fil=sorted(CORPUS.decks.filter(pass));
  const grid=document.getElementById('deck-grid');
  grid.className=VIEW==='gallery'?'gallery':'list';
  grid.innerHTML='';
  if(!fil.length){grid.innerHTML='<div id="empty">No decks match.</div>';document.getElementById('result-count').textContent='0 / '+CORPUS.decks.length+' decks';return;}

  const frag=document.createDocumentFragment();
  fil.forEach(d=>{
    const tot=d.gt||d.cc||0;
    const ns=normSt(d.st);
    const el=document.createElement('div');
    el.className='dk'+(ns==='superseded'?' superseded':'');

    // Thumbnail
    const thumb=document.createElement('div');
    thumb.className='dk-thumb';
    if(d.pdf){
      thumb.dataset.pdf=d.pdf;
      thumb.innerHTML='<span class="dk-thumb-ph">PDF</span>';
      if(thumbObs)thumbObs.observe(thumb);
      else queueThumb(thumb);
    } else {
      thumb.innerHTML=`<span class="dk-thumb-ph" style="opacity:.3">${esc(d.gm||d.df||'')}</span>`;
    }

    // Body
    const body=document.createElement('div');
    body.className='dk-body';
    const series=d.si?`<div class="dk-series">${esc(d.si.replace(/_/g,' '))}${d.sn?' #'+d.sn:''}</div>`:'';
    body.innerHTML=`
      <div class="dk-et">${esc(fmtTool(d.et))}</div>
      <div class="dk-title">${esc(d.dt)}</div>
      <div class="dk-meta">${esc(metaLine(d))}</div>
      ${gradeHtml(d)}
      ${series}
      <div class="dk-bottom">
        ${tagsHtml(d)}
        <div class="dk-spacer"></div>
        <button class="btn-browse">Cards ▶</button>
        ${d.pdf?'<button class="btn-pdf">PDF</button>':''}
      </div>`;

    body.querySelector('.btn-browse').onclick=e=>{e.stopPropagation();openPanel(d,true);};
    if(d.pdf) body.querySelector('.btn-pdf').onclick=e=>{e.stopPropagation();window.open(localUrl(d.pdf),'_blank');};
    el.onclick=()=>openPanel(d,false);
    el.appendChild(thumb);
    el.appendChild(body);
    frag.appendChild(el);
  });
  grid.appendChild(frag);
  document.getElementById('result-count').textContent=fil.length+' / '+CORPUS.decks.length+' decks';
}

// ── View toggle ──────────────────────────────────────────
document.getElementById('btn-gallery').onclick=()=>{
  VIEW='gallery';document.getElementById('btn-gallery').classList.add('active');
  document.getElementById('btn-list').classList.remove('active');renderGrid();};
document.getElementById('btn-list').onclick=()=>{
  VIEW='list';document.getElementById('btn-list').classList.add('active');
  document.getElementById('btn-gallery').classList.remove('active');renderGrid();};

// ── Panel ────────────────────────────────────────────────
function openPanel(d,scrollCards){
  activeDeck=d;cardGF.clear();
  document.querySelectorAll('.cgf').forEach(el=>el.classList.remove('on1','on2','on3'));
  document.getElementById('card-q').value='';

  // Header
  document.getElementById('panel-title').textContent=d.dt;
  document.getElementById('panel-sub').textContent=metaLine(d);

  // Top
  const tot=d.gt||1,p1=Math.round(d.g1/tot*100),p2=Math.round(d.g2/tot*100),p3=Math.round(d.g3/tot*100);
  document.getElementById('panel-grades').innerHTML=`
    <div class="grade-trk"><div class="gs gs-1" style="width:${p1}%"></div><div class="gs gs-2" style="width:${p2}%"></div><div class="gs gs-3" style="width:${p3}%"></div></div>
    <div class="grade-labs"><span class="gl1">G1 ${d.g1} (${p1}%)</span><span class="gl2">G2 ${d.g2}</span><span class="gl3">G3 ${d.g3}</span></div>`;
  document.getElementById('panel-tags').innerHTML=
    tagsHtml(d)+(d.pdf?`<button class="btn-pdf" style="margin-left:auto" onclick="window.open(localUrl('${d.pdf.replace(/'/g,"\\'")}'),'_blank')">PDF</button>`:'');

  // QA
  const qa=d.qa||{};
  document.getElementById('sum-qa').textContent=qa.overall!=null?`overall ${qa.overall}`:'';
  document.getElementById('qa-verdict').innerHTML=qa.verdict?`<div class="verdict-box">${esc(qa.verdict)}</div>`:'';
  const scoreFields=[
    ['Overall',qa.overall],['Readability',qa.read],['Artwork',qa.art],
    ['Comedy',qa.comedy],['Satirical',qa.sat],['FrizzleBob',qa.frizz],
    ['Concept',qa.concept],['Freestyle',qa.freestyle],['Viral',qa.viral],
  ].filter(([,v])=>v!=null);
  document.getElementById('qa-scores').innerHTML=scoreFields.length?
    `<div class="qa-grid">${scoreFields.map(([k,v])=>
      `<div class="qa-item"><div class="qa-key">${k}</div><div class="qa-val"><span class="qa-num ${scoreClass(v)}">${v}</span><span class="qa-denom">/10</span></div></div>`
    ).join('')}</div>`:'';
  const miscRows=[
    qa.editorial&&['Editorial Flag',qa.editorial],
    qa.tableready&&['Table-ready',qa.tableready],
    qa.structnote&&['Structure',qa.structnote],
    qa.typonote&&['Typos',qa.typonote],
    qa.fontnote&&['Font Artifacts',qa.fontnote],
  ].filter(Boolean);
  document.getElementById('qa-misc').innerHTML=miscRows.map(([k,v])=>
    `<div class="info-row"><span class="ik">${k}</span><span class="iv">${esc(v)}</span></div>`).join('');
  if(qa.editorial) document.getElementById('qa-misc').insertAdjacentHTML('afterbegin',
    `<div class="flag-box">⚠ ${esc(qa.editorial)}</div>`);

  // Cover
  const hasCover=qa.cscore!=null;
  document.getElementById('sum-cover').textContent=hasCover?`★${qa.cscore.toFixed(1)}`:'';
  if(hasCover){
    const subs=[qa.cvisual&&`Visual ${qa.cvisual}`,qa.ctitle&&`Title ${qa.ctitle}`,
      qa.cvibe&&`Vibe ${qa.cvibe}`,qa.corig&&`Orig ${qa.corig}`,qa.cviral&&`Viral ${qa.cviral}`]
      .filter(Boolean).map(s=>`<span class="cover-sub">${s}</span>`).join('');
    document.getElementById('body-cover').innerHTML=
      `<div class="cover-hdr"><span class="cover-score">★${qa.cscore.toFixed(1)}</span><div class="cover-subs">${subs}</div></div>`+
      (qa.cnote?`<div class="cover-note">${esc(qa.cnote)}</div>`:'')+
      (qa.outro?`<div class="info-row"><span class="ik">Outro</span><span class="iv">${esc(qa.outro)}</span></div>`:'');
  } else {
    document.getElementById('body-cover').innerHTML='<span style="color:var(--ink4);font-style:italic;font-size:14px">No cover QA data.</span>';
  }

  // PDF accordion
  panelPdfLoaded=false;
  const hasPdf=!!d.pdf;
  document.getElementById('sum-pdf').textContent=hasPdf?'available':'';
  document.getElementById('pdf-status').textContent=hasPdf?'':'No PDF linked for this deck.';
  document.getElementById('pdf-viewer-wrap').style.display='none';
  document.getElementById('pdf-status').style.display='block';
  document.getElementById('acc-pdf').classList.remove('open');

  // Bundle
  const bundleRows=[
    qa.bundle&&['Bundle',qa.bundle],
    qa.serctx&&['Series Context',qa.serctx],
    d.si&&['Series',d.si.replace(/_/g,' ')+(d.sn?' #'+d.sn:'')],
    d.et&&['Tool',fmtTool(d.et)],
    d.st&&['Status',d.st],
  ].filter(Boolean);
  document.getElementById('sum-bundle').textContent=qa.bundle?'✓':'';
  document.getElementById('body-bundle').innerHTML=bundleRows.length?
    bundleRows.map(([k,v])=>`<div class="info-row"><span class="ik">${k}</span><span class="iv">${esc(v)}</span></div>`).join(''):
    '<span style="color:var(--ink4);font-style:italic;font-size:14px">No bundle data.</span>';

  // Cards
  document.getElementById('sum-cards').textContent=(d.cards&&d.cards.length?d.cards.length+' cards':'no cards');
  renderCards();

  document.getElementById('panel').classList.add('open');
  document.getElementById('backdrop').classList.add('v');
  if(scrollCards) setTimeout(()=>document.getElementById('acc-cards').scrollIntoView({behavior:'smooth',block:'start'}),260);
}

function closePanel(){
  document.getElementById('panel').classList.remove('open');
  document.getElementById('backdrop').classList.remove('v');
  activeDeck=null;
  document.getElementById('pdf-embed-el').src='';
}

// ── Panel PDF viewer ─────────────────────────────────────
function loadPanelPdf(){
  if(!activeDeck||!activeDeck.pdf||panelPdfLoaded)return;
  if(!document.getElementById('acc-pdf').classList.contains('open'))return;
  panelPdfLoaded=true;
  const status=document.getElementById('pdf-status');
  const wrap=document.getElementById('pdf-viewer-wrap');
  /* Native <embed> — works with file:// without fetch() restrictions */
  document.getElementById('pdf-embed-el').src=localUrl(activeDeck.pdf);
  status.style.display='none';
  wrap.style.display='block';
}
document.getElementById('pdf-fs-btn').onclick=()=>{
  const el=document.getElementById('pdf-embed-el');
  if(!document.fullscreenElement)el.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closePanel();
});

// ── Card list ────────────────────────────────────────────
function renderCards(){
  if(!activeDeck)return;
  const q=document.getElementById('card-q').value.toLowerCase().trim();
  const all=activeDeck.cards||[];
  const fil=all.filter(c=>{
    if(cardGF.size&&!cardGF.has(c.g))return false;
    if(q&&!((c.t||'')+' '+(c.p||'')+' '+(c.l||'')+' '+(c.r||'')).toLowerCase().includes(q))return false;
    return true;
  });
  document.getElementById('ccount').textContent=fil.length+' / '+all.length;
  const list=document.getElementById('card-list');
  if(!fil.length){list.innerHTML='<div style="padding:16px;color:var(--ink4);font-style:italic;font-size:14px;text-align:center">No cards match.</div>';return;}
  list.innerHTML='';
  const frag=document.createDocumentFragment();
  fil.forEach(c=>{
    const gc=c.g===1?'g1':c.g===2?'g2':'g3';
    const gl=c.g===1?'G1':c.g===2?'G2':'G3';
    const hasD=c.p||c.l||c.r||c.a;
    const item=document.createElement('div');item.className='ci';
    let h=`<div class="ci-hdr"><span class="ci-n">${String(c.n||'').padStart(2,'0')}</span><span class="ci-t">${esc(c.t||'')}</span><span class="ci-g ${gc}">${gl}</span>${hasD?'<span class="ci-arr">▶</span>':''}</div>`;
    if(hasD){
      h+=`<div class="ci-body">`;
      if(c.p)h+=`<div class="cf"><span class="cf-k">Power</span><span class="cf-v">${esc(c.p)}</span></div>`;
      if(c.l)h+=`<div class="cf"><span class="cf-k">Lore</span><span class="cf-v">${esc(c.l)}</span></div>`;
      if(c.r)h+=`<div class="cf"><span class="cf-k">Reason</span><div class="cf-r">${esc(c.r)}</div></div>`;
      if(c.a)h+=`<div class="cf"><span class="cf-k">Art</span><span class="cf-v" style="color:var(--ink4);font-style:italic">${esc(c.a)}</span></div>`;
      h+=`</div>`;
      item.onclick=()=>item.classList.toggle('open');
    }
    item.innerHTML=h;
    if(hasD)item.onclick=()=>item.classList.toggle('open');
    frag.appendChild(item);
  });
  list.appendChild(frag);
}
document.querySelectorAll('.cgf').forEach(el=>{
  el.onclick=()=>{
    const g=parseInt(el.dataset.g);const cls='on'+g;
    if(cardGF.has(g)){cardGF.delete(g);el.classList.remove(cls);}
    else{cardGF.add(g);el.classList.add(cls);}renderCards();};
});
document.getElementById('card-q').oninput=renderCards;
document.getElementById('panel-close').onclick=closePanel;
document.getElementById('backdrop').onclick=closePanel;

// ── Search / sort ────────────────────────────────────────
document.getElementById('search-box').oninput=e=>{F.q=e.target.value.toLowerCase().trim();renderGrid();};
document.getElementById('sort-sel').onchange=e=>{F.sort=e.target.value;renderGrid();};

// ── Init ─────────────────────────────────────────────────
function init(){
  renderStats();
  const gms=[...new Set(CORPUS.decks.map(d=>d.gm).filter(Boolean))].sort();
  const dfs=[...new Set(CORPUS.decks.map(d=>d.df).filter(Boolean))].sort();
  setupChips('c-gm',gms,'gm');
  setupChips('c-df',dfs,'df');
  setupChips('c-st',['complete','stub','partial','superseded'],'st');
  setupToggles();setupSelects();setupRanges();setupReset();setupSb();
  const hh=document.getElementById('hdr').offsetHeight;
  document.documentElement.style.setProperty('--hh',hh+'px');
  renderGrid();
}
init();
</script>
