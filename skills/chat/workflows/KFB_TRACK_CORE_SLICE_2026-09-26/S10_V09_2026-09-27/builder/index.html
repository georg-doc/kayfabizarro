<title>KFB Streckenbauer</title>

<style>
:root {
  --ground: #eceee9; --panel: #f8f9f6; --panel-2: #f1f3ef; --ink: #1c2226; --muted: #5d676c; --line: #d3d8d2;
  --accent: #d9622b; --accent-ink: #ffffff; --teal: #1f8a86; --pass: #2f8a4c; --warn: #b7791f; --fail: #c8412f;
  --sel: rgba(217, 98, 43, 0.12); --view: #dfe4de; --grid: #b9c0b8; --shadow: 0 1px 0 rgba(0,0,0,.04);
  --f-disp: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #131719; --panel: #1b2023; --panel-2: #20262a; --ink: #e6ebe8; --muted: #9aa5a8; --line: #2c3438;
    --accent: #ef7a43; --accent-ink: #1b1109; --teal: #3fb3ad; --pass: #55b872; --warn: #d9a441; --fail: #e8664f;
    --sel: rgba(239, 122, 67, 0.16); --view: #0f1315; --grid: #2d3538;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #131719; --panel: #1b2023; --panel-2: #20262a; --ink: #e6ebe8; --muted: #9aa5a8; --line: #2c3438;
  --accent: #ef7a43; --accent-ink: #1b1109; --teal: #3fb3ad; --pass: #55b872; --warn: #d9a441; --fail: #e8664f;
  --sel: rgba(239, 122, 67, 0.16); --view: #0f1315; --grid: #2d3538;
}
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font: 400 14px/1.45 var(--f-body); padding-inline: 0; }
* { box-sizing: border-box; }
button, select, input, textarea { font: inherit; color: inherit; }
.app { display: grid; height: 100%; grid-template-rows: auto 1fr; }
header.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 16px;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { font: 700 22px/1 var(--f-disp); letter-spacing: .02em; margin: 0; text-transform: uppercase; }
.brand h1 b { color: var(--accent); font-weight: 700; }
.brand small { font: 500 12px/1 var(--f-mono); color: var(--muted); }
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn {
  border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 6px 10px; cursor: pointer;
  font: 600 13px/1 var(--f-body); display: inline-flex; gap: 6px; align-items: center; min-height: 32px;
}
.btn:hover { border-color: var(--muted); }
.btn:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, .piece:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--fail); }
select, input[type=number], input[type=text], textarea {
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; min-height: 32px;
}
.main { display: grid; grid-template-columns: 290px minmax(0, 1fr) 330px; min-height: 0; }
.col { background: var(--panel); min-height: 0; overflow: auto; }
.col.left { border-right: 1px solid var(--line); }
.col.right { border-left: 1px solid var(--line); }
.sec { padding: 12px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.sec h2 {
  margin: 0; font: 600 15px/1.1 var(--f-disp); text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
}
.sec h2 .count { font: 500 12px var(--f-mono); letter-spacing: 0; }
.plist { list-style: none; margin: 0; padding: 0; display: grid; }
.piece {
  display: grid; grid-template-columns: 26px 44px 1fr auto; gap: 8px; align-items: center; padding: 6px 14px 6px 10px;
  border-left: 3px solid transparent; cursor: pointer; font-variant-numeric: tabular-nums;
}
.piece:hover { background: var(--panel-2); }
.piece.on { background: var(--sel); border-left-color: var(--accent); }
.piece .n { font: 500 11px var(--f-mono); color: var(--muted); text-align: right; }
.piece .code {
  font: 700 12px/1 var(--f-disp); letter-spacing: .05em; text-align: center; padding: 4px 0; border-radius: 4px;
  background: var(--panel-2); border: 1px solid var(--line);
}
.piece .code.stunt { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.piece .code.tun { color: var(--teal); border-color: color-mix(in srgb, var(--teal) 45%, var(--line)); }
.piece .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.piece .nm small { display: block; color: var(--muted); font: 400 11px var(--f-mono); overflow: hidden; text-overflow: ellipsis; }
.piece .flag { width: 8px; height: 8px; border-radius: 50%; background: transparent; }
.piece .flag.fail { background: var(--fail); } .piece .flag.warn { background: var(--warn); }
.palette { display: grid; gap: 8px; }
.palette .grp { display: grid; gap: 4px; }
.palette .grp span { font: 600 11px var(--f-disp); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.palette .row { display: flex; flex-wrap: wrap; gap: 4px; }
.palette .btn { min-height: 28px; padding: 4px 8px; font-size: 12px; }
.view { position: relative; min-height: 0; background: var(--view); }
.view canvas { display: block; width: 100%; height: 100%; }
.hud {
  position: absolute; left: 10px; bottom: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none;
}
.chip {
  pointer-events: auto; font: 500 12px/1 var(--f-mono); background: color-mix(in srgb, var(--panel) 88%, transparent);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; font-variant-numeric: tabular-nums;
}
.viewtools { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.banner {
  position: absolute; top: 10px; left: 10px; right: 170px; background: var(--panel); border: 1px solid var(--fail);
  border-left: 4px solid var(--fail); border-radius: 6px; padding: 8px 12px; font-size: 13px;
}
.banner b { color: var(--fail); }
.field { display: grid; grid-template-columns: 96px 1fr 76px; gap: 8px; align-items: center; }
.field label { font-size: 13px; color: var(--muted); }
.field input[type=range] { width: 100%; accent-color: var(--accent); }
.field input[type=number] { width: 100%; font: 400 13px var(--f-mono); text-align: right; }
.field.wide { grid-template-columns: 96px 1fr; }
.field .auto { display: flex; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); }
.field.off input[type=range], .field.off input[type=number] { opacity: .35; }
.row2 { display: flex; flex-wrap: wrap; gap: 6px; }
.hint { font-size: 12px; color: var(--muted); margin: 0; max-width: 60ch; }
.kv { font: 400 12px/1.5 var(--f-mono); color: var(--muted); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px; white-space: pre-wrap; overflow-x: auto; max-height: 140px; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.ck {
  display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: baseline; padding: 5px 6px; border-radius: 5px;
  font-size: 13px; cursor: default;
}
.ck.jump { cursor: pointer; } .ck.jump:hover { background: var(--panel-2); }
.ck .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pass); align-self: center; }
.ck.warn .dot { background: var(--warn); } .ck.fail .dot { background: var(--fail); }
.ck .id { font: 500 12px var(--f-mono); }
.ck .v { font: 400 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.ck .note { grid-column: 2 / 4; font-size: 12px; color: var(--muted); }
.ck.pass .note { display: none; }
.sumpill { white-space: nowrap; font: 600 12px/1 var(--f-mono); padding: 4px 8px; border-radius: 999px; border: 1px solid var(--line); }
.sumpill.ok { color: var(--pass); } .sumpill.bad { color: var(--fail); border-color: var(--fail); }
.json { display: grid; gap: 8px; }
.json textarea { width: 100%; min-height: 180px; font: 400 12px/1.4 var(--f-mono); resize: vertical; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 6px; font-size: 13px; }
@media (max-width: 1100px) { .main { grid-template-columns: 250px minmax(0, 1fr) 300px; } }
@media (max-width: 900px) {
  html, body { height: auto; }
  .app { height: auto; }
  .main { grid-template-columns: 1fr; }
  .view { height: 58vh; min-height: 320px; order: -1; }
  .col.left, .col.right { border: 0; border-top: 1px solid var(--line); overflow: visible; }
  .banner { right: 10px; top: 52px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="bar">
    <div class="brand"><h1>KFB <b>Streckenbauer</b></h1><small id="coreTag">Track Core</small></div>
    <div class="tools">
      <label class="hint" for="preset" style="margin:0">Strecke</label>
      <select id="preset" aria-label="Beispielstrecke laden">
        <option value="sandbox">Sandkasten (je ein Stück)</option>
        <option value="td03">TD03 Uni-Center</option>
        <option value="td05">TD05 Balkon-Twist</option>
        <option value="seed">Showcase-Seed</option>
        <option value="blank">Leer (eine Gerade)</option>
        <option value="draft" hidden>Eigener Entwurf</option>
      </select>
      <button class="btn" id="undo" title="Rückgängig (Strg/Cmd+Z)">↶ Zurück</button>
      <button class="btn" id="redo" title="Wiederholen (Strg/Cmd+Umschalt+Z)">↷ Vor</button>
      <button class="btn" id="jsonBtn">Rezept-JSON</button>
      <button class="btn primary" id="copyBtn">JSON kopieren</button>
    </div>
  </header>

  <div class="main">
    <aside class="col left">
      <section class="sec">
        <h2>Stücke <span class="count" id="pcount"></span></h2>
        <ul class="plist" id="plist" role="listbox" aria-label="Stücke der Strecke"></ul>
      </section>
      <section class="sec">
        <h2>Einfügen <span class="count">nach der Auswahl</span></h2>
        <div class="palette" id="palette"></div>
      </section>
    </aside>

    <div class="view" id="view">
      <div class="banner" id="err" hidden></div>
      <div class="viewtools">
        <button class="btn" id="fitBtn">Alles zeigen</button>
        <button class="btn" id="focusBtn">Stück zeigen</button>
        <button class="btn" id="povBtn">Fahrersicht</button>
      </div>
      <div class="hud" id="hud"></div>
    </div>

    <aside class="col right">
      <section class="sec" id="inspector"></section>
      <section class="sec">
        <h2>Prüfungen <span id="sum"></span></h2>
        <ul class="checks" id="checks"></ul>
        <p class="hint">Grün = Core-Prüfung bestanden. Klick auf eine Zeile mit Ort springt dorthin.</p>
      </section>
      <section class="sec json" id="jsonSec" hidden>
        <h2>Rezept-JSON</h2>
        <textarea id="jsonTa" spellcheck="false" aria-label="Rezept als JSON"></textarea>
        <div class="row2">
          <button class="btn primary" id="applyJson">Übernehmen</button>
          <button class="btn" id="copyJson">Kopieren</button>
          <button class="btn" id="closeJson">Schließen</button>
        </div>
        <p class="hint" id="jsonMsg">JSON einfügen und übernehmen, um ein eigenes Rezept zu laden.</p>
      </section>
    </aside>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

const GROUPS = [['plan', 'Gerade & Kurven'], ['up', 'Höhe'], ['stunt', 'Stunt'], ['width', 'Breite, Anschluss & Boxen']];
const TYPE_NAME = { STRAIGHT: 'Gerade', CURVE_EASE: 'Kurve', HAIRPIN_180: 'Kehre', SPIRAL: 'Spirale', OFFSET_S: 'S-Versatz', CREST: 'Kuppe', DIP: 'Mulde',

const WIDTH_OPTS = [['', '— bleibt'], ['NARROW', 'NARROW 10,8'], ['STANDARD', 'STANDARD 14,4'], ['WIDE', 'WIDE 18'], ['HERO', 'HERO 21,6'], ['HERO_XL', 'HERO_XL 28,8 (Weiche)']];

const SKIN_OPTS = [['', '— aus Markierung'], ['street', 'street'], ['track', 'track'], ['mag', 'mag'], ['buoy', 'buoy'], ['toy', 'toy']];
const DRIVE_OPTS = [['', '— frei (Standard)'], ['free', 'free'], ['assist', 'assist'], ['locked', 'locked']];
const FX = ['bounce', 'magnet_catch', 'zero_g'];
const TUNNEL_OPTS = [['keep', '— bleibt'], ['leave', 'Tunnel verlassen'], ['p:gotthard', 'Gotthard (Bogen)'], ['p:dumb', 'Bunker (D.U.M.B.)'], ['p:alien', 'Alien-Basis'],
  ['p:toy', 'Spielzeug-Röhre'], ['p:hangar', 'Hangar'], ['s:round', 'rund'], ['s:oval', 'oval'], ['s:rect', 'eckig'], ['s:poly', 'Vieleck'], ['s:arch', 'Bogen']];
const STUNT = new Set(['KICKER', 'AIR', 'LANDING', 'LOOP']);
const CHECK_NAME = { s_monotonic: 's steigt', s_matches_arc: 'Bogenlänge', frame_orthonormal: 'Rahmen', frame_flip: 'kein Umklappen', frame_flips: 'kein Umklappen', jump_speed: 'Sprungtempo', tangent_kink: 'kein Knick',

// ------------------------------------------------------------------ state
let presets = {};
let recipe = null;
let sel = -1;             // selected piece index, -1 = route settings
const undoStack = [], redoStack = [];
let pendingSnap = null;
let lastStream = null, lastGraph = null, lastChecks = [];
const $ = (id) => document.getElementById(id);
const clone = (o) => JSON.parse(JSON.stringify(o));
const fmt = (v, d = 1) => (typeof v === 'number' ? v.toLocaleString('de-DE', { maximumFractionDigits: d }) : String(v));

function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 1800); }
const DRAFT_KEY = 'kfb-builder-draft-v09';
function store() { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(recipe)); } catch (e) { /* storage off */ } }
function snapshot() { undoStack.push(JSON.stringify(recipe)); if (undoStack.length > 200) undoStack.shift(); redoStack.length = 0; syncUndo(); }
function beginEdit() { if (!pendingSnap) { pendingSnap = JSON.stringify(recipe); } }
function endEdit() { if (pendingSnap && pendingSnap !== JSON.stringify(recipe)) { undoStack.push(pendingSnap); redoStack.length = 0; } pendingSnap = null; syncUndo(); }
function syncUndo() { $('undo').disabled = !undoStack.length; $('redo').disabled = !redoStack.length; }
function undo() { if (!undoStack.length) return; redoStack.push(JSON.stringify(recipe)); recipe = JSON.parse(undoStack.pop()); sel = Math.min(sel, recipe.pieces.length - 1); changed(true); }
function redo() { if (!redoStack.length) return; undoStack.push(JSON.stringify(recipe)); recipe = JSON.parse(redoStack.pop()); sel = Math.min(sel, recipe.pieces.length - 1); changed(true); }

function uid(type) { const base = (TYPE_NAME[type] ?? type).toLowerCase().replace(/[^a-z0-9]+/g, '_'); let i = 1; const ids = new Set(recipe.pieces.map((p) => p.id)); while (ids.has(`${base}_${i}`)) i++; return `${base}_${i}`; }

// ------------------------------------------------------------------ compile (worker, fallback main thread)
let worker = null, reqId = 0, coreFallback = null;
try { worker = new Worker(new URL('./worker.mjs', location.href), { type: 'module' }); worker.onmessage = (ev) => onResult(ev.data); worker.onerror = () => { worker = null; compileNow(); }; } catch (e) { worker = null; }
let compileTimer = 0;
function compileSoon() { clearTimeout(compileTimer); compileTimer = setTimeout(compileNow, 90); }
async function compileNow() {
  const id = ++reqId, r = clone(recipe);
  if (worker) { worker.postMessage({ id, recipe: r }); return; }
  coreFallback = coreFallback || await import('./track-core.mjs');

}

  const acts = document.createElement('div'); acts.className = 'row2';
  acts.innerHTML = `<button class="btn" id="mvUp">↑ nach oben</button><button class="btn" id="mvDn">↓ nach unten</button><button class="btn" id="dup">Duplizieren</button><button class="btn danger" id="del">Löschen</button>`;
  box.append(acts);
  $('mvUp').onclick = () => movePiece(-1); $('mvDn').onclick = () => movePiece(1); $('dup').onclick = dupPiece; $('del').onclick = delPiece;
}
function pieceChanged() { const li = $('plist').children[sel + 1]; if (li && sel >= 0) li.querySelector('.nm small').textContent = summary(recipe.pieces[sel]); store(); compileSoon(); }
function changed(fromUndo) { syncUndo(); renderList(); renderInspector(); store(); compileSoon(); if (fromUndo) drawSelection(); }

function renderChecks() {
  const ul = $('checks'); ul.innerHTML = '';
  const fails = lastChecks.filter((c) => !c.pass && c.severity !== 'warn').length, warns = lastChecks.filter((c) => !c.pass && c.severity === 'warn').length, ok = lastChecks.filter((c) => c.pass).length;
  $('sum').innerHTML = lastChecks.length ? `<span class="sumpill ${fails ? 'bad' : 'ok'}">${ok}/${lastChecks.length} grün${warns ? ` · ${warns} Warnung` : ''}${fails ? ` · ${fails} Fehler` : ''}</span>` : '';
  const order = (c) => (c.pass ? 2 : c.severity === 'warn' ? 1 : 0);
  for (const c of [...lastChecks].sort((a, b) => order(a) - order(b))) {
    const li = document.createElement('li'); const st = c.pass ? 'pass' : c.severity === 'warn' ? 'warn' : 'fail'; const places = checkPlaces(c);
    li.className = `ck ${st}${places.length && !c.pass ? ' jump' : ''}`;
    const v = c.value == null ? '' : typeof c.value === 'number' ? fmt(c.value, 3) : String(c.value);
    li.innerHTML = `<span class="dot"></span><span class="id" title="${escapeHtml(c.id)}">${escapeHtml(CHECK_NAME[c.id] ?? c.id)}</span><span class="v">${escapeHtml(v)}</span><span class="note">${escapeHtml(c.note ?? '')}</span>`;
    if (places.length && !c.pass) { li.tabIndex = 0; li.onclick = () => focusS(places[0]); li.onkeydown = (e) => { if (e.key === 'Enter') focusS(places[0]); }; }
    ul.append(li);
  }
}
function renderHud() {
  if (!lastStream) return; const S = lastStream.samples; const L = S[S.length - 1].s;
  $('hud').innerHTML = [`${fmt(L, 0)} m`, `${S.length.toLocaleString('de-DE')} Samples`, `${fmt(compileMs, 0)} + ${fmt(checkMs, 0)} ms`, `fp ${lastStream.fingerprint ?? '–'}`].map((t) => `<span class="chip">${t}</span>`).join('');
  $('coreTag').textContent = coreVersion.replace('kfb.track-core/', 'Track Core v');
}

// ------------------------------------------------------------------ load, json, keys
function loadRecipe(r, msg) { recipe = clone(r); recipe.pieces ??= []; if (!recipe.pieces.length) recipe.pieces.push({ id: 'gerade_1', type: 'STRAIGHT', length: 60 }); sel = -1; drawTrack.fitted = false; changed(); if (msg) toast(msg); }
function blank() { return { schema: 'kfb.route-recipe/0.1-draft', id: 'NEUE_STRECKE', start: { p: [0, 0, 0], headingDeg: 0 }, defaults: { widthClass: 'STANDARD', markings: 'TRACK' }, pieces: [{ id: 'gerade_1', type: 'STRAIGHT', length: 60 }] }; }
$('preset').onchange = (e) => { snapshot(); const k = e.target.value; loadRecipe(k === 'blank' ? blank() : presets[k], 'Strecke geladen'); };
$('undo').onclick = undo; $('redo').onclick = redo;
$('fitBtn').onclick = fitAll; $('focusBtn').onclick = focusPiece; $('povBtn').onclick = driverView;
function recipeText() { return JSON.stringify(recipe, null, 1); }
async function copyText(t) { try { await navigator.clipboard.writeText(t); toast('Rezept kopiert'); } catch (e) { openJson(); const ta = $('jsonTa'); ta.focus(); ta.select(); toast('Text ist markiert – mit Strg/Cmd+C kopieren'); } }
$('copyBtn').onclick = () => copyText(recipeText());
function openJson() { $('jsonSec').hidden = false; $('jsonTa').value = recipeText(); $('jsonMsg').textContent = 'JSON einfügen und übernehmen, um ein eigenes Rezept zu laden.'; $('jsonSec').scrollIntoView({ block: 'nearest' }); }
$('jsonBtn').onclick = openJson; $('closeJson').onclick = () => { $('jsonSec').hidden = true; };
$('copyJson').onclick = () => copyText($('jsonTa').value);
$('applyJson').onclick = () => { try { const r = JSON.parse($('jsonTa').value); if (!Array.isArray(r.pieces)) throw new Error('Es fehlt die Liste "pieces".'); if (r.routes) throw new Error('Graphen mit mehreren Routen kann der Builder noch nicht bearbeiten.'); snapshot(); loadRecipe(r, 'Rezept übernommen'); $('jsonMsg').textContent = 'Übernommen.'; } catch (e) { $('jsonMsg').textContent = `Nicht übernommen: ${e.message}`; } };
addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
});

// ------------------------------------------------------------------ boot
renderPalette(); applyTheme(); resize();
presets = await (await fetch('./presets.json')).json();
let draft = null, oldDraft = null; try { draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); oldDraft = JSON.parse(localStorage.getItem('kfb-builder-draft') || 'null'); } catch (e) { draft = null; }
if (oldDraft && Array.isArray(oldDraft.pieces)) { presets.olddraft = oldDraft; const o = document.createElement('option'); o.value = 'olddraft'; o.textContent = 'Entwurf vor v0.9'; $('preset').append(o); }
if (draft && Array.isArray(draft.pieces) && draft.pieces.length) { loadRecipe(draft, 'Letzter Entwurf wiederhergestellt'); $('preset').value = 'draft'; }
else loadRecipe(presets.sandbox);
syncUndo();
</script>
