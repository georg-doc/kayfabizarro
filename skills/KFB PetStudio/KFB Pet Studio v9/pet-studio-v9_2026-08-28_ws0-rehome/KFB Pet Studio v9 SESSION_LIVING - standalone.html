document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

background: #e4d9c0; }\n  a { color: #4d7488; text-decoration: underline; text-underline-offset: 2px; }\n  a:hover { color: #1f1a14; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:radial-gradient(120% 100% at 50% 0%,#f7f2e6 0%,#e4d9c0 70%);padding:40px 24px 80px;font-family:'Space Grotesk',system-ui,sans-serif;color:#1f1a14;\">\n  <div style=\"max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:26px;\">\n\n    <div style=\"display:flex;flex-direction:column;gap:10px;border-bottom:2px solid #1f1a14;padding-bottom:18px;\">\n      <div style=\"font-family:'Special Elite',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#6f6753;\">Living Document · additiv geführt · Stand 27.08.2026 (WS1)<\u002Fdiv>\n      <h1 style=\"margin:0;font-family:'Special Elite',monospace;font-size:38px;line-height:1.1;font-weight:400;\">KFB Pet Studio v9<\u002Fh1>\n      <div style=\"font-size:16.5px;line-height:1.6;color:#3a342a;max-width:74ch;text-wrap:pretty;\">Das Pad als Bauteil, und der Zipfel der Sprechblase als eigenes Ding. Gebaut wird an <strong>KFB Pet Studio v9.dc.html<\u002Fstrong>; <strong>v8 ist eingefroren<\u002Fstrong> und bleibt Vergleichsmaßstab. Kein Modul unter <code style=\"font-family:'Special Elite',monospace;\">studio-v7/<\u002Fcode> oder <code style=\"font-family:'Special Elite',monospace;\">studio-v8/<\u002Fcode> wurde angefasst.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px;padding:20px 22px;background:#f7f0da;border:2px solid #1f1a14;box-shadow:5px 5px 0 rgba(31,26,20,.18);\">\n      <div style=\"font-family:'Special Elite',monospace;font-size:16px;\">Einstieg für den nächsten Chat<\u002Fdiv>\n      <div style=\"font-size:15.5px;line-height:1.7;color:#3a342a;\">Dieses Blatt → <strong>docs/CHANGELOG_studio.md<\u002Fstrong> (Eintrag <strong>V9-S1<\u002Fstrong> oben, mit allen Zahlen) → <strong>docs/studio-v5/POST_MORTEM_v5.md<\u002Fstrong> und <strong>docs/spinballcast-v3/POST_MORTEM_re-home.md<\u002Fstrong> (die Hausregeln, alle bezahlt) → <strong>HOUSEKEEPING.md<\u002Fstrong>. Messgriff im laufenden Studio: <code style=\"font-family:'Special Elite',monospace;background:#e7dcc4;padding:1px 5px;\">window.__STUDIO9<\u002Fcode> (die alten Namen <code style=\"font-family:'Special Elite',monospace;\">__STUDIO5…8<\u002Fcode> zeigen auf dieselbe Instanz, damit alte Abnahmeskripte laufen).<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:14px;\">\n      <h2 style=\"margin:0;font-family:'Special Elite',monospace;font-size:24px;font-weight:400;\">Das Vokabular<\u002Fh2>\n      <div style=\"font-size:15px;line-height:1.6;color:#6f6753;max-width:74ch;text-wrap:pretty;\">Zwei Runden gingen an Begriffen verloren. Georg hat den Ursprung selbst gefunden: »Pads« war ein Audio-Bug für »Pets« — und hat den Begriff danach neu und breiter besetzt. Was jetzt gilt:<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:1px;background:#cfc3a4;border:1px solid #cfc3a4;\">\n        <div style=\"background:#efe6d3;padding:11px 14px;font-weight:600;font-size:15px;\">Pad<\u002Fdiv>\n        <div style=\"background:#faf5e8;padding:11px 14px;font-size:15px;line-height:1.55;\">Alles mit einer Bodenfläche: Pet, Requisite, Klo-Rolli. Das <em>ganze<\u002Fem> Bauteil — Modell, Base, Emotes, Mund, Bubble, Klang — als ein Modul, einhängbar in SpinballCast.<\u002Fdiv>\n        <div style=\"background:#efe6d3;padding:11px 14px;font-weight:600;font-size:15px;\">Base<\u002Fdiv>\n        <div style=\"background:#faf5e8;padding:11px 14px;font-size:15px;line-height:1.55;\">Die graue Fläche darunter. Sie fängt den Schatten, trägt den Kontaktsaum und ist Empfängerin der Boden-VFX.<\u002Fdiv>\n        <div style=\"background:#efe6d3;padding:11px 14px;font-weight:600;font-size:15px;\">Anker<\u002Fdiv>\n        <div style=\"background:#faf5e8;padding:11px 14px;font-size:15px;line-height:1.55;\">Punkte am Pad für Gear: Hüfte, Hand-Entsprechungen, Kopf, Fuß, Mund, Bubble. Cartoon-Anatomie, weil ein Cube-Pet keine Gelenke hat.<\u002Fdiv>\n        <div style=\"background:#efe6d3;padding:11px 14px;font-weight:600;font-size:15px;\">Bubble<\u002Fdiv>\n        <div style=\"background:#faf5e8;padding:11px 14px;font-size:15px;line-height:1.55;\">Sammelbegriff für alle vier Arten: <strong>Speech<\u002Fstrong> · <strong>Thought<\u002Fstrong> · <strong>Whisper<\u002Fstrong> · <strong>Scream<\u002Fstrong>.<\u002Fdiv>\n        <div style=\"background:#efe6d3;padding:11px 14px;font-weight:600;font-size:15px;\">Ansatz<\u002Fdiv>\n        <div style=\"background:#faf5e8;padding:11px 14px;font-size:15px;line-height:1.55;\">Die zwei Punkte, wo der Pfeil aus der Bubble-Kante wächst. <em>Nicht<\u002Fem> die Füße des Pets — das war mein Wortfehler, sofort umbenannt.<\u002Fdiv>\n        <div style=\"background:#efe6d3;padding:11px 14px;font-weight:600;font-size:15px;\">Spitze<\u002Fdiv>\n        <div style=\"background:#faf5e8;padding:11px 14px;font-size:15px;line-height:1.55;\">Das dünne Ende des Pfeils, das man zieht. Speech, Whisper und Scream haben Ansatz und Spitze; <strong>Thought hat eine Spur<\u002Fstrong>.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:14px;\">\n      <h2 style=\"margin:0;font-family:'Special Elite',monospace;font-size:24px;font-weight:400;\">Georgs Festlegungen (27.08.)<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;\">\n        <div style=\"padding:14px 16px;background:#f7f0da;border-left:3px solid #5d6b3a;font-size:14.5px;line-height:1.55;\"><strong>Ein Pad pro Pet<\u002Fstrong>, genau eines — mit Ankern für Props, weil »pets haben keine hände«.<\u002Fdiv>\n        <div style=\"padding:14px 16px;background:#f7f0da;border-left:3px solid #5d6b3a;font-size:14.5px;line-height:1.55;\">Die Konfiguration wohnt <strong>im Vertrag<\u002Fstrong>. Daraus wurde der Block <code style=\"font-family:'Special Elite',monospace;\">pad<\u002Fcode> — nicht <code style=\"font-family:'Special Elite',monospace;\">pet.pad<\u002Fcode>: die Rolle ist kein Pet.<\u002Fdiv>\n        <div style=\"padding:14px 16px;background:#f7f0da;border-left:3px solid #4d7488;font-size:14.5px;line-height:1.55;\"><strong>Ansatz bleibt stehen<\u002Fstrong>, wo er gesetzt ist. Nur die Spitze wandert.<\u002Fdiv>\n        <div style=\"padding:14px 16px;background:#f7f0da;border-left:3px solid #4d7488;font-size:14.5px;line-height:1.55;\"><strong>Zwei gerade Schenkel<\u002Fstrong>, dünn zulaufend (Vorlage 4 von 4).<\u002Fdiv>\n        <div style=\"padding:14px 16px;background:#f7f0da;border-left:3px solid #4d7488;font-size:14.5px;line-height:1.55;\"><strong>Kanon-Feder ist Standard<\u002Fstrong>, die glatte Fassung bleibt als Rückfall stehen — falls die Feder im kleinen Maßstab zu laut wird.<\u002Fdiv>\n        <div style=\"padding:14px 16px;background:#f7f0da;border-left:3px solid #4d7488;font-size:14.5px;line-height:1.55;\"><strong>Thought:<\u002Fstrong> Lappen rundum, aber die Grundform bleibt klar lesbar. Rechteck bleibt Rechteck.<\u002Fdiv>\n        <div style=\"padding:14px 16px;background:#f7f0da;border-left:3px solid #7a5a92;font-size:14.5px;line-height:1.55;\"><strong>Klang<\u002Fstrong> aus der vorhandenen Pinball-Bank, eine Zuordnung je Pad. Kein zweites Manifest.<\u002Fdiv>\n        <div style=\"padding:14px 16px;background:#f7f0da;border-left:3px solid #7a5a92;font-size:14.5px;line-height:1.55;\">Abnahme <strong>im Studio<\u002Fstrong>, kein eigenes Blatt.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:16px 18px;background:#e9edde;border:1px solid #cfc3a4;font-size:15px;line-height:1.65;text-wrap:pretty;\"><strong>Das Bubble-Verhalten, als eine Regel in vier Erscheinungen:<\u002Fstrong> die Bubble gehört nicht zum Modell, sie <em>hängt<\u002Fem> daran. <strong>Ruhezone<\u002Fstrong> — sie reagiert erst, wenn der Besitzer einen Radius verlässt, sonst zittert sie bei jedem Atemzug mit. <strong>Trägheit<\u002Fstrong> — Luftballon an unsichtbarer Schnur, mit Überschwingen. <strong>Spitze<\u002Fstrong> — zeigt auf die Modellmitte und endet auf der Silhouette, gemessen statt getippt. <strong>Katapult<\u002Fstrong> — das Modell fliegt, die Bubble bleibt und verpufft: die Schnur ist gerissen.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:14px;\">\n      <h2 style=\"margin:0;font-family:'Special Elite',monospace;font-size:24px;font-weight:400;\">Gebaut, mit den Zahlen<\u002Fh2>\n\n      <div style=\"padding:18px 20px;background:#faf5e8;border:2px solid #1f1a14;display:flex;flex-direction:column;gap:9px;\">\n        <div style=\"font-family:'Special Elite',monospace;font-size:17px;\">studio-v9/pad-contract.v1.js <span style=\"color:#6f6753;font-size:13px;\">pad-v1.0<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.65;color:#3a342a;text-wrap:pretty;\">Sieben Anker, alle <strong>gemessen<\u002Fstrong>, keiner getippt. Gemessen wird in <strong>28 Höhenbändern<\u002Fstrong>, nicht an der Hüllkiste: <em>eine Kiste ist keine Form<\u002Fem>. Hüfte = breiteste Stelle unten, Schulter = breiteste Stelle oben; beim Cube-Pet liegt die Hüfte damit an der Würfel-Unterkante und die Schulter an der Oberkante — das ist die richtige Antwort, kein Messfehler. Hände sitzen <strong>6 % außerhalb<\u002Fstrong> der Silhouette, sonst steckt das Gear im Körper. Einheit: <strong>Grundform-Höhen (cubeH), Ursprung Fußmitte, +z = Blickrichtung<\u002Fstrong> — damit wandert kein Anker, wenn die Bühne skaliert.<\u002Fdiv>\n        <div style=\"font-size:14.5px;line-height:1.6;padding:11px 13px;background:#e9edde;\">Erste Fahrt am Hasen: <strong>7 von 7 Ankern geschrieben<\u002Fstrong>, Pad-Felder in der Sitzung angekommen (der Wächter meldet 30 Felder nur im Entwurf, davon 15 aus dem Pad-Block — der Beleg, dass die Persistenz greift).<\u002Fdiv>\n        <div style=\"font-size:14.5px;line-height:1.6;padding:11px 13px;background:#f3e6d0;border-left:3px solid #b8361f;\"><strong>Die cubeH-Gegenprobe ist eingebaut, nicht behauptet.<\u002Fstrong> Das Modul liest <code style=\"font-family:'Special Elite',monospace;\">body.cubeH<\u002Fcode> und <em>misst<\u002Fem> die Bauhöhe. Weichen sie um mehr als 2 % ab, sagt es das im Panel und in der Konsole. Die alte v9-Frage (»<code style=\"font-family:'Special Elite',monospace;\">byCube<\u002Fcode> misst, <code style=\"font-family:'Special Elite',monospace;\">cubeH<\u002Fcode> wird gelesen«) ist damit nicht gelöst — aber <strong>sichtbar statt still<\u002Fstrong>.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:18px 20px;background:#faf5e8;border:2px solid #1f1a14;display:flex;flex-direction:column;gap:9px;\">\n        <div style=\"font-family:'Special Elite',monospace;font-size:17px;\">studio-v9/pad-base.v1.js <span style=\"color:#6f6753;font-size:13px;\">pbase-v1.0<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.65;color:#3a342a;text-wrap:pretty;\">Die Base <strong>schmückt<\u002Fstrong> den Boden, sie ersetzt ihn nicht: kein zweiter Boden, keine zweite Schattenrechnung, keine zweite Kippzahl. Vier Schichten in einer Ordnung — Platte · Boden-FX · Kachelkante und Kontaktsaum · Schattenstempel.<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.65;color:#3a342a;text-wrap:pretty;\"><strong>Der Saum ist kein Schatten.<\u002Fstrong> Der Stempel sagt, welche <em>Form<\u002Fem> auf dem Boden liegt; der Saum sagt, wo etwas ihn <em>berührt<\u002Fem>. Zwei Aussagen, zwei Ebenen — deshalb hängt der Saum am gemessenen Fußradius <code style=\"font-family:'Special Elite',monospace;\">pet.ground.foot<\u002Fcode> (in v8 gemessen: <strong>0,2599 · Deckung 41,7 % · 224 Punkte aus 5 Netzen<\u002Fstrong>) und nicht an der Silhouette.<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.65;color:#3a342a;text-wrap:pretty;\"><strong>Die Kachelkante ist Tusche, keine CAD-Linie:<\u002Fstrong> ein Band zwischen zwei Offsetkurven, Licht oben links, also unten und rechts satter. Eckenradius als <em>Anteil<\u002Fem> der Kante, nie als Pixelzahl. Klick-Ring und Landestaub laufen über <code style=\"font-family:'Special Elite',monospace;\">gnd.addFx<\u002Fcode> — alle Ringe im Haus, eine Bauart.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:18px 20px;background:#faf5e8;border:2px solid #1f1a14;display:flex;flex-direction:column;gap:9px;\">\n        <div style=\"font-family:'Special Elite',monospace;font-size:17px;\">studio-v9/bubble-tail.v1.js <span style=\"color:#6f6753;font-size:13px;\">tail-v1.0<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:14.5px;line-height:1.6;padding:11px 13px;background:#f3e6d0;border-left:3px solid #b8361f;\"><strong>Der Befund, mit Adresse.<\u002Fstrong> In <code style=\"font-family:'Special Elite',monospace;\">bubble-shaper.v3.js<\u002Fcode> ist der Zipfel kein Ding, sondern ein <em>Befund<\u002Fem>: <code style=\"font-family:'Special Elite',monospace;\">shapeForBox<\u002Fcode> sucht in der Silhouette eine Punktgruppe, die »tief unten und in der Minderheit« liegt, <strong>ernennt<\u002Fstrong> sie zum Zipfel und verschiebt sie — bei jeder Bewegung neu. Zwei Rückfallwerte und drei Sonderregeln im Code sind der Beleg, dass <strong>die Suche selbst der Fehler ist<\u002Fstrong>. Eine Suche kann man nicht stabilisieren, nur ersetzen.<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.65;color:#3a342a;text-wrap:pretty;\"><strong>Die Ersetzung:<\u002Fstrong> drei eigene Punkte, die im Entwurf stehen — Ansatz A, Ansatz B, Spitze, alle drei als <em>Ecke<\u002Fem>, in die Kontur <strong>eingehängt<\u002Fstrong> statt daneben gemalt. Damit ist das Ziehen der Spitze eine Zuweisung an zwei Zahlen; nichts wird gesucht, nichts kann kippen. Die <strong>dünn zulaufende Feinspitze kostet keine Zeile<\u002Fstrong>: der Kanon-Zeichner erkennt scharfe Knicke und nimmt die Feder dort auf 30 % zurück. Ein zweiter Zeichner wäre eine sichtbare Naht.<\u002Fdiv>\n        <div style=\"font-size:14.5px;line-height:1.6;padding:11px 13px;background:#e9edde;\">Gemessen, erste Fahrt (Speech, »Bingo!«, Entwurfsgröße): Ansatz-Spanne <strong>14,4 px<\u002Fstrong> · Länge <strong>92,39 px<\u002Fstrong> · Verhältnis <strong>6,416<\u002Fstrong> · Winkel <strong>90,0°<\u002Fstrong> · Spitze <code style=\"font-family:'Special Elite',monospace;\">[0.5, 2.9247]<\u002Fcode>. Der <strong>Stempel<\u002Fstrong> ändert sich genau dann, wenn sich die Zipfelgeometrie ändert — wer nichts anfasst und den Zähler steigen sieht, hat eine versteckte Neuberechnung gefunden.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:18px 20px;background:#faf5e8;border:2px solid #1f1a14;display:flex;flex-direction:column;gap:9px;\">\n        <div style=\"font-family:'Special Elite',monospace;font-size:17px;\">Verdrahtet in v9<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.65;color:#3a342a;text-wrap:pretty;\"><strong>Neuer Tab »Pad«<\u002Fstrong> mit drei Abschnitten: Anker (messen, schreiben, als Kreuze auf der Bühne) · Base (Saum, Tuschekante, Klick-Ring, Probeschuss) · Audio (vier Ereignisse, je vier echte Ids). Die Kreuze tragen <code style=\"font-family:'Special Elite',monospace;\">noMeasure<\u002Fcode> — ein unmarkiertes Hilfsobjekt wird mitgemessen, und genau das hat in SpinballCast v1 eine Ratsche von +1,018 pro Kartenwechsel erzeugt.<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.65;color:#3a342a;text-wrap:pretty;\"><strong>Klang<\u002Fstrong> aus <code style=\"font-family:'Special Elite',monospace;\">kfb-pinball-sfx.json<\u002Fcode> (37 Ereignisse, gezählt). Standard: Klick <code style=\"font-family:'Special Elite',monospace;\">pop<\u002Fcode> · Landen <code style=\"font-family:'Special Elite',monospace;\">banner.land<\u002Fcode> · Emote <code style=\"font-family:'Special Elite',monospace;\">fluff<\u002Fcode> · Auswahl <code style=\"font-family:'Special Elite',monospace;\">ui.select<\u002Fcode>. Keine erfundenen Ids — ein unbekanntes Ereignis meldet das Modul als Fehler und spielt nichts. Geweckt wird im ersten Klick: ohne Nutzergeste bleibt jeder AudioContext stumm, und stumm sieht wie kaputt aus.<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.65;color:#3a342a;text-wrap:pretty;\"><strong>Bild und Klang aus derselben Aufrufstelle.<\u002Fstrong> Klick macht Ton und Bodenring, Landen macht Ton und Staub. Zwei Aufrufstellen laufen auseinander. Und der Klick trifft das <em>Modell<\u002Fem>, nicht die Leinwand — ein Klick daneben ist keine Reaktion.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:14px;\">\n      <h2 style=\"margin:0;font-family:'Special Elite',monospace;font-size:24px;font-weight:400;\">Zwei Hausregeln, in dieser Nacht bezahlt<\u002Fh2>\n      <div style=\"padding:16px 18px;background:#f3e6d0;border:2px solid #b8361f;font-size:15px;line-height:1.65;text-wrap:pretty;\"><strong>R14 · Eine fremde Uhr hat eine fremde Lebensdauer — und eine notierte Regel ist keine gezogene.<\u002Fstrong> Der Anstoß der Werkbank hing erst an einer eigenen rAF-Schleife (tickte <strong>einmal<\u002Fstrong>, dann Stille), dann an der Bildschleife des Studios — und die läuft in der Vorschau nicht durchgehend: <code style=\"font-family:'Special Elite',monospace;\">_gndTick<\u002Fcode> stand nach einer Sekunde noch auf <strong>0<\u002Fstrong>. Der Ersatz-Takt saß dann <em>hinter einem Riegel<\u002Fem>, wurde genau einmal bewaffnet und war nach einem Unmount für immer fort; dazu sind Zeitgeber hier gedrosselt (gemessen: 1 Tick in 800 ms statt ~6). Ergebnis: <strong>0 gezeichnete Pixel<\u002Fstrong> bei frischem Laden, während der Zeichner korrekt war.<\u002Fdiv>\n      <div style=\"padding:16px 18px;background:#e9edde;border:1px solid #cfc3a4;font-size:15px;line-height:1.65;text-wrap:pretty;\"><strong>Die Regel steht jetzt als drei Wege, nicht als einer:<\u002Fstrong> ein <strong>idempotenter<\u002Fstrong> Takt (nie hinter einem Riegel, 120 ms, zeichnet nur bei Änderung) · ein <strong>direkter Anstoß<\u002Fstrong> bei jeder Zustandsänderung · und ein <strong>Termin aus dem Render<\u002Fstrong>, solange noch nichts gezeichnet ist — sichtbar heißt gerendert, und der Render ist das eine, was sicher passiert. Kein Zeichnen im Render, nur ein Termin dafür. Abnahme nach dem Fix, frisches Laden ohne Klick: <strong>Zeichnungen 1 · Geometrie-Änderungen 1<\u002Fstrong> · Spanne 14,4 px · Länge 48,47 px · Verhältnis 3,366 · Winkel 90,0°. Dieselbe Ursache traf die Base: ohne Bildschleife stand die Tuschekante auf Skalierung <strong>1 statt 2,5<\u002Fstrong> und der Fußradius auf dem <strong>Rückfallwert 0,25 statt 0,2599<\u002Fstrong>. <em>Ein Rückfallwert im Bericht ist ein Befund, keine Zahl.<\u002Fem><\u002Fdiv>\n      <div style=\"padding:16px 18px;background:#f3e6d0;border:2px solid #b8361f;font-size:15px;line-height:1.65;text-wrap:pretty;\"><strong>R15 · Eine Vorschau, die nicht neu geladen hat, beweist nichts.<\u002Fstrong> Drei Messrunden liefen gegen eine <em>alte<\u002Fem> Fassung des Codes: <code style=\"font-family:'Special Elite',monospace;\">typeof _tailBeat<\u002Fcode> war <code style=\"font-family:'Special Elite',monospace;\">undefined<\u002Fcode>, obwohl die Methode in der Datei stand. Der Beweis kostet eine Zeile, das Nichtwissen kostete drei Runden. Vor jeder Messung prüfen, ob der gemessene Code der geschriebene ist — die Schwesterregel zu <strong>R1<\u002Fstrong> (»Anwesenheit ist keine Gleichheit«).<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:14px;\">\n      <h2 style=\"margin:0;font-family:'Special Elite',monospace;font-size:24px;font-weight:400;\">Offen, in dieser Reihenfolge<\u002Fh2>\n      <div style=\"display:flex;flex-direction:column;gap:9px;\">\n        <div style=\"display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;padding:13px 15px;background:#faf5e8;border:1px solid #cfc3a4;\"><div style=\"font-family:'Special Elite',monospace;font-size:18px;color:#b8361f;\">1<\u002Fdiv><div style=\"font-size:15px;line-height:1.6;\"><strong>Zacken für Scream.<\u002Fstrong> <code style=\"font-family:'Special Elite',monospace;\">edge-treatment.v1.js<\u002Fcode> baut sie längst — Zacken plus langer schmaler Zipfel, »lang heißt schmal«. Sie hängen nur nicht am Bild. Verkabelung, kein Neubau.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;padding:13px 15px;background:#faf5e8;border:1px solid #cfc3a4;\"><div style=\"font-family:'Special Elite',monospace;font-size:18px;color:#b8361f;\">2<\u002Fdiv><div style=\"font-size:15px;line-height:1.6;\"><strong>Thought:<\u002Fstrong> Lappen rundum bei lesbarer Grundform, plus <strong>Spur<\u002Fstrong> aus 2–3 kleiner werdenden Kreisen zum Kopf. Ansatz und Spitze gelten hier nicht.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;padding:13px 15px;background:#faf5e8;border:1px solid #cfc3a4;\"><div style=\"font-family:'Special Elite',monospace;font-size:18px;color:#b8361f;\">3<\u002Fdiv><div style=\"font-size:15px;line-height:1.6;\"><strong>Verpuffen ohne Fade.<\u002Fstrong> Die geschnittenen Lücken wachsen auf Bogenlänge, bis die Linie aufgehört hat zu sein; das Papier fällt kippend nach; die Spitze zieht sich <em>vorher<\u002Fem> ein, weil sie kein Ziel mehr hat. Drei Zahlen, kein neuer Mechanismus — Papier wird nicht durchsichtig.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;padding:13px 15px;background:#faf5e8;border:1px solid #cfc3a4;\"><div style=\"font-family:'Special Elite',monospace;font-size:18px;color:#6f6753;\">4<\u002Fdiv><div style=\"font-size:15px;line-height:1.6;\"><strong>Bühnen-Blase auf den Kanon-Zeichner<\u002Fstrong> umhängen, glatte Fassung als Umschalter behalten. Heute malt die Bühne noch ihre eigene Outline mit <code style=\"font-family:'Special Elite',monospace;\">dead: 44<\u002Fcode>.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;padding:13px 15px;background:#faf5e8;border:1px solid #cfc3a4;\"><div style=\"font-family:'Special Elite',monospace;font-size:18px;color:#6f6753;\">5<\u002Fdiv><div style=\"font-size:15px;line-height:1.6;\"><strong>Der Zipfel auf der Bühne<\u002Fstrong> — dieselbe Ersetzung wie in der Werkbank. Dort sitzt Georgs Sprung im echten Bild.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;padding:13px 15px;background:#faf5e8;border:1px solid #cfc3a4;\"><div style=\"font-family:'Special Elite',monospace;font-size:18px;color:#6f6753;\">6<\u002Fdiv><div style=\"font-size:15px;line-height:1.6;\"><strong>Import/Export einzeln und als Stapel<\u002Fstrong> gegen den neuen Block nachprüfen. Der Wächter meldet die Pad-Felder korrekt; der Weg über Datei ist noch nicht gemessen.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;padding:13px 15px;background:#faf5e8;border:1px solid #cfc3a4;\"><div style=\"font-family:'Special Elite',monospace;font-size:18px;color:#6f6753;\">7<\u002Fdiv><div style=\"font-size:15px;line-height:1.6;\"><strong>Blickachse auf die Anker drehen.<\u002Fstrong> <code style=\"font-family:'Special Elite',monospace;\">body.faceDir<\u002Fcode> wird gemessen, aber nicht angewendet. Eine Achse drehen, ohne sie abzunehmen, ist die Falle aus dem Travel-Cut.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;padding:13px 15px;background:#faf5e8;border:1px solid #cfc3a4;\"><div style=\"font-family:'Special Elite',monospace;font-size:18px;color:#6f6753;\">8<\u002Fdiv><div style=\"font-size:15px;line-height:1.6;\"><strong>Rückläufer ins Repo<\u002Fstrong> — unverändert offen aus V8-A, und die drei v9-Module kommen dazu. Dazu die 16 Schriftschnitte, sonst zeigt jedes Standalone Ersatzschriften.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:14px;\">\n      <h2 style=\"margin:0;font-family:'Special Elite',monospace;font-size:24px;font-weight:400;\">Dateikarte<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:minmax(230px,auto) 1fr;gap:1px;background:#cfc3a4;border:1px solid #cfc3a4;font-size:14.5px;\">\n        <div style=\"background:#efe6d3;padding:10px 13px;font-family:'Special Elite',monospace;\">KFB Pet Studio v9.dc.html<\u002Fdiv>\n        <div style=\"background:#faf5e8;padding:10px 13px;line-height:1.5;\"><strong>AKTIV<\u002Fstrong> · hier wird gebaut<\u002Fdiv>\n        <div style=\"background:#efe6d3;padding:10px 13px;font-family:'Special Elite',monospace;\">KFB Pet Studio v8.dc.html<\u002Fdiv>\n        <div style=\"background:#faf5e8;padding:10px 13px;line-height:1.5;\"><strong>EINGEFROREN<\u002Fstrong> · Vergleichsmaßstab, darf nicht brechen<\u002Fdiv>\n        <div style=\"background:#efe6d3;padding:10px 13px;font-family:'Special Elite',monospace;\">studio-v9/pad-contract.v1.js<\u002Fdiv>\n        <div style=\"background:#faf5e8;padding:10px 13px;line-height:1.5;\">NEU · der Pad-Block: Anker, Base-Felder, Klang-Zuordnung<\u002Fdiv>\n        <div style=\"background:#efe6d3;padding:10px 13px;font-family:'Special Elite',monospace;\">studio-v9/pad-base.v1.js<\u002Fdiv>\n        <div style=\"background:#faf5e8;padding:10px 13px;line-height:1.5;\">NEU · Kontaktsaum, Tuschekante, Klick-Ring, Landestaub<\u002Fdiv>\n        <div style=\"background:#efe6d3;padding:10px 13px;font-family:'Special Elite',monospace;\">studio-v9/bubble-tail.v1.js<\u002Fdiv>\n        <div style=\"background:#faf5e8;padding:10px 13px;line-height:1.5;\">NEU · Ansatz und Spitze als eigenes Bauteil<\u002Fdiv>\n        <div style=\"background:#efe6d3;padding:10px 13px;font-family:'Special Elite',monospace;\">studio-v7/, studio-v8/<\u002Fdiv>\n        <div style=\"background:#faf5e8;padding:10px 13px;line-height:1.5;\">UNBERÜHRT · Shaper, Kanon-Feder, Boden, Messschicht, Wächter<\u002Fdiv>\n        <div style=\"background:#efe6d3;padding:10px 13px;font-family:'Special Elite',monospace;\">docs/CHANGELOG_studio.md<\u002Fdiv>\n        <div style=\"background:#faf5e8;padding:10px 13px;line-height:1.5;\">additiv · Eintrag <strong>V9-S1<\u002Fstrong> oben, mit allen Messzahlen<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"padding:18px 20px;background:#1f1a14;color:#f7f0da;display:flex;flex-direction:column;gap:8px;\">\n      <div style=\"font-family:'Special Elite',monospace;font-size:15px;\">Was dieses Blatt nicht ist<\u002Fdiv>\n      <div style=\"font-size:14.5px;line-height:1.65;color:#e0d6bd;text-wrap:pretty;\">Es ist kein Ersatz für den Changelog. Hier steht, <em>was gilt<\u002Fem>; dort steht, <em>wie es dazu kam<\u002Fem>, mit den Fehlanläufen. Ein Blatt, das behauptet, statt zu belegen, war der teuerste Fehler der v5.1-Nacht.<\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
