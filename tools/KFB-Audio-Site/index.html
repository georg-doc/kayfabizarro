<!doctype html>
<html lang="en" data-kfb-audio-site="0.3">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KFB Audio</title><link rel="stylesheet" href="./style.css"><link rel="icon" href="data:,"></head>
<body>
<main class="shell">
<header class="top">
  <div><div class="eyebrow">KFB AUDIO</div><h1>Musical World</h1></div>
  <div class="status">69 · 59 · 29</div>
</header>

<nav class="tabs" aria-label="Audio site sections">
  <button data-view="world" aria-selected="true">World</button>
  <button data-view="catalog">Library</button>
  <button data-view="sources">Sources</button>
  <button data-view="prompt">Prompt</button>
</nav>

<section id="world" class="view active">
  <div class="world-head">
    <select id="worldRecipe" aria-label="Mixer recipe"></select>
    <div id="sceneStrip" class="scene-strip"></div>
  </div>

  <div class="world-stage">
    <div class="world-copy">
      <div id="worldMode" class="eyebrow">Town · Explore</div>
      <h2 id="worldTitle">Folk / Acoustic / Storybook Bed</h2>
      <div id="worldTransition" class="world-transition-text">Ready</div>
    </div>
    <button id="worldToggle" class="play-orb" aria-label="Play">▶</button>
  </div>

  <div class="mix-line">
    <div class="fade-times" aria-label="Crossfade duration">
      <button data-world-fade="4">4</button>
      <button data-world-fade="8" class="active">8</button>
      <button data-world-fade="16">16</button>
    </div>
    <div class="mix-progress" aria-hidden="true"><span id="worldProgress"></span></div>
    <button id="worldAlt" class="icon-btn" aria-label="Try alternate">↻</button>
  </div>

  <div class="layer-row" aria-label="Mixer layers">
    <button data-layer="world" class="active">World</button>
    <button data-layer="vehicle">Vehicle</button>
    <button id="voiceDuck">Voice</button>
  </div>
</section>

<section id="catalog" class="view">
  <div class="toolbar compact">
    <input id="search" type="search" placeholder="Search">
    <select id="collection"><option value="">All</option><option value="roadtrip-v2">World</option><option value="legacy-kfb">Legacy</option></select>
    <select id="stemFilter"><option value="">Any</option><option value="stems">Stems</option><option value="certified">Certified</option></select>
  </div>
  <div id="stats" class="stats"></div>
  <div id="catalogGrid" class="catalog"></div>
</section>

<section id="sources" class="view">
  <div class="sourcegrid">
    <div class="sourcegroup"><div class="section-title">Available</div><div id="availableSources"></div></div>
    <div class="sourcegroup"><div class="section-title">Open</div><div id="missingSources"></div></div>
  </div>

  <details class="fold" id="sfxFold">
    <summary>SFX <span id="sfxCount">· 1,704</span></summary>
    <div class="toolbar compact">
      <input id="sfxSearch" type="search" placeholder="Search SFX">
      <select id="sfxUseCase"><option value="">Any use</option></select>
      <select id="sfxTemporal"><option value="">Any length</option><option value="ONE_SHOT">One-shot</option><option value="LOOP">Loop</option><option value="STING">Sting</option></select>
    </div>
    <div id="eventMap" class="event-map"></div>
    <div id="sfxStats" class="stats"></div>
    <div id="sfxGrid" class="catalog"></div>
  </details>

  <details class="fold">
    <summary>Source Lab <span id="sourceLabCount"></span></summary>
    <div class="toolbar compact">
      <select id="candidateStatus"><option value="">All</option><option value="HUMAN_TUNE">Tune</option><option value="UNREVIEWED">Unreviewed</option></select>
      <select id="candidateCategory"><option value="">Any type</option></select>
    </div>
    <div id="candidateStats" class="stats"></div>
    <div id="candidateGrid" class="catalog"></div>
  </details>

  <details class="fold">
    <summary>Intake</summary>
    <label id="drop" class="drop">Drop audio<input id="files" type="file" accept="audio/*,.mp3,.wav,.ogg,.m4a" multiple hidden></label>
    <div id="queue" class="queue"></div>
    <button class="quiet-btn" id="downloadIntake">Manifest</button>
  </details>
</section>

<section id="prompt" class="view">
  <div class="prompt-card">
    <div class="form-grid">
      <label>Mood<input id="pMood" placeholder="rainy midnight melancholy"></label>
      <label>Place<input id="pBiome" placeholder="graveyard"></label>
      <label>Resident<input id="pResident" placeholder="optional"></label>
      <label>Role<select id="pRole"><option>world bed</option><option>resident signature</option><option>event / entrance</option><option>combat</option><option>road / radio</option><option>sting / ident</option></select></label>
    </div>
    <label class="refs">References<select id="pRefs" multiple size="7"></select></label>
    <button class="quiet-btn primary" id="buildPrompt">Build</button>
    <textarea id="promptOut" class="promptOut" readonly></textarea>
    <button class="quiet-btn" id="copyPrompt">Copy</button>
  </div>
</section>

<div id="previewBar" class="nowplaying" hidden>
  <div><strong id="nowTitle">Nothing playing</strong><span id="nowMeta"></span></div>
  <audio id="preview" controls preload="none" crossorigin="anonymous"></audio>
</div>
</main>
<script type="module" src="./audio-site.js"></script>
</body></html>
