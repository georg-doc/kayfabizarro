<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15130f"><title>KFB Resident Atlas</title><style>
:root{--bg:#15130f;--panel:rgba(25,22,17,.92);--line:#4f4838;--text:#f3ead8;--muted:#b8aa90;--accent:#e8b35f;--ok:#8fca8b;--bad:#e58b7d}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}header{position:absolute;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));z-index:5;display:flex;gap:8px;align-items:center;pointer-events:none}.brand,.selectWrap,.status{pointer-events:auto;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);border-radius:12px}.brand{padding:8px 10px;white-space:nowrap}.brand b{display:block;font-size:12px;letter-spacing:.08em}.brand span{font-size:10px;color:var(--muted)}.selectWrap{flex:1;min-width:0;padding:6px 8px}.selectWrap label{display:block;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}select{width:100%;border:0;background:transparent;color:var(--text);font-weight:700;outline:0}.status{padding:8px 10px;font-size:11px;color:var(--muted);white-space:nowrap}.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}#toolbar{position:absolute;z-index:6;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:6px;max-width:calc(100vw - 24px);overflow:auto;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px)}button{border:1px solid var(--line);background:#29251d;color:var(--text);padding:8px 10px;border-radius:9px;font-weight:650;white-space:nowrap}button.active{border-color:var(--accent);color:#ffe3a9}#inspector{position:absolute;z-index:5;right:max(12px,env(safe-area-inset-right));top:78px;width:min(360px,calc(100vw - 24px));max-height:calc(100vh - 165px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(12px);padding:10px;transition:.2s}#inspector.collapsed{transform:translateX(calc(100% + 18px))}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:2px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.asset{border-top:1px solid rgba(255,255,255,.08);padding:8px 0}.asset:first-of-type{border-top:0}.asset b{font-size:12px}.role{font-size:10px;color:var(--accent);margin-left:6px}.path{font:10px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);overflow-wrap:anywhere;margin-top:3px}.meta{font-size:11px;color:var(--muted);margin:3px 0 8px}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:10px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:var(--ok)}.dot.presentation{background:var(--accent)}#hint{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 12px;background:rgba(0,0,0,.55);border-radius:10px;color:#fff;pointer-events:none;opacity:0;transition:.2s}@media(max-width:700px){header{right:12px}.brand{display:none}.status{font-size:10px;padding:7px 8px}#inspector{top:auto;bottom:74px;right:12px;left:12px;width:auto;max-height:42vh}#inspector.collapsed{transform:translateY(calc(100% + 90px))}#toolbar{left:12px;right:12px;transform:none;justify-content:flex-start}}
</style></head><body><div id="app"><header><div class="brand"><b>KFB RESIDENT ATLAS</b><span>real repo assets · composition layer</span></div><div class="selectWrap"><label>Scene</label><select id="sceneSelect"></select></div><div id="status" class="status">loading…</div></header><div id="inspector"><div class="sectionTitle"><span>Scene assets</span><button id="closeInspector">×</button></div><div id="sceneMeta" class="meta"></div><div class="legend"><span><i class="dot"></i>repo asset</span><span><i class="dot presentation"></i>viewer-only presentation</span></div><div id="assetList"></div></div><div id="toolbar"><button data-view="hero" class="active">Hero</button><button data-view="front">Front</button><button data-view="top">Top</button><button id="toggleActor" class="active">Actor</button><button id="toggleHabitat" class="active">Habitat</button><button id="toggleProps" class="active">Props</button><button id="toggleGrid">Grid</button><button id="toggleInfo">Assets</button><button id="reset">Reset</button></div><div id="hint"></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const SOURCE_COMMIT='252449c921d3f8138d68d1faa3f4052e84040dfe',RAW_BASE=`https://raw.githubusercontent.com/georg-doc/kayfabizarro/${SOURCE_COMMIT}/`,BLOB_BASE=`https://github.com/georg-doc/kayfabizarro/blob/${SOURCE_COMMIT}/`,encPath=p=>p.split('/').map(encodeURIComponent).join('/'),raw=p=>RAW_BASE+encPath(p),blob=p=>BLOB_BASE+encPath(p);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.getElementById('app').prepend(renderer.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color(0x8c8170);scene.fog=new THREE.Fog(0x8c8170,14,28);const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.05,100),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.07;controls.minDistance=2.2;controls.maxDistance=24;controls.maxPolarAngle=Math.PI*.49;scene.add(new THREE.HemisphereLight(0xfff0d1,0x383a35,2));const sun=new THREE.DirectionalLight(0xffe0ad,3.2);sun.position.set(6,10,7);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);const warm=new THREE.PointLight(0xff7b2f,6,6,2);warm.position.set(-1.55,1,2.25);scene.add(warm);const stage=new THREE.Mesh(new THREE.CylinderGeometry(6.2,6.5,.22,64),new THREE.MeshStandardMaterial({color:0x625a48,roughness:1}));stage.position.y=-.12;stage.receiveShadow=true;scene.add(stage);const under=new THREE.Mesh(new THREE.CylinderGeometry(6.55,6.7,.2,64),new THREE.MeshStandardMaterial({color:0x2d2922,roughness:1}));under.position.y=-.29;scene.add(under);const grid=new THREE.GridHelper(12,24,0xe8b35f,0x746b59);grid.position.y=.015;grid.visible=false;scene.add(grid);const groups={actor:new THREE.Group(),habitat:new THREE.Group(),props:new THREE.Group()};Object.values(groups).forEach(g=>scene.add(g));const loader=new GLTFLoader();let SCENES=[],loadedScene=null;
function status(t,k=''){const e=document.getElementById('status');e.textContent=t;e.className='status '+k}function hint(t){const e=document.getElementById('hint');e.textContent=t;e.style.opacity=1;clearTimeout(hint.t);hint.t=setTimeout(()=>e.style.opacity=0,1500)}function fitObject(o,f){const b=new THREE.Box3().setFromObject(o),s=new THREE.Vector3();b.getSize(s);let k=1;if(f?.height)k=f.height/Math.max(s.y,1e-6);if(f?.max)k=f.max/Math.max(s.x,s.y,s.z,1e-6);o.scale.multiplyScalar(k)}function anchorObject(o,e){const b=new THREE.Box3().setFromObject(o),c=new THREE.Vector3();b.getCenter(c);if(e.anchor==='center'){o.position.x+=e.at[0]-c.x;o.position.y+=e.at[1]-c.y;o.position.z+=e.at[2]-c.z}else{o.position.x+=e.at[0]-c.x;o.position.y+=e.at[1]-b.min.y;o.position.z+=e.at[2]-c.z}}
async function addAsset(e){return new Promise((resolve,reject)=>loader.load(raw(e.path),g=>{const o=g.scene;o.name=e.name;fitObject(o,e.fit);const r=(e.rotationDeg||[0,0,0]).map(THREE.MathUtils.degToRad);o.rotation.set(...r);o.updateMatrixWorld(true);anchorObject(o,e);o.userData.entry=e;o.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true}});groups[e.group].add(o);resolve({entry:e,obj:o})},undefined,x=>reject({entry:e,error:x})))}function clearGroups(){Object.values(groups).forEach(g=>{while(g.children.length)g.remove(g.children[0])})}
async function loadScene(d){loadedScene=d;clearGroups();status('loading…');document.getElementById('sceneSelect').value=d.id;document.getElementById('sceneMeta').textContent=`${d.subtitle||''} · source ${SOURCE_COMMIT.slice(0,8)} · recipe composition only`;document.getElementById('assetList').innerHTML=d.assets.map(a=>`<div class="asset"><b>${a.name}</b><span class="role">${a.role}</span><div class="path">${a.path}</div><div style="margin-top:5px"><a href="${blob(a.path)}" target="_blank" rel="noopener" style="color:#e8b35f">repo source</a></div></div>`).join('');const r=await Promise.allSettled(d.assets.map(addAsset)),bad=r.filter(x=>x.status==='rejected');setView('hero',false);bad.length?status(`${d.assets.length-bad.length}/${d.assets.length} assets`,'bad'):status(`${d.assets.length} repo assets`,'ok');if(bad.length)console.error('Asset failures',bad)}
function setView(w,a=true){if(!loadedScene)return;const p=loadedScene.camera[w]||loadedScene.camera.hero;camera.position.set(...p);controls.target.set(...loadedScene.camera.target);controls.update();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===w));if(a)hint(w.toUpperCase())}function toggleGroup(n,b){groups[n].visible=!groups[n].visible;b.classList.toggle('active',groups[n].visible)}function reset(){Object.values(groups).forEach(g=>g.visible=true);document.querySelectorAll('#toggleActor,#toggleHabitat,#toggleProps').forEach(b=>b.classList.add('active'));grid.visible=false;document.getElementById('toggleGrid').classList.remove('active');setView('hero')}
function fillSceneSelect(){const e=document.getElementById('sceneSelect');e.innerHTML='';SCENES.forEach(s=>{const o=document.createElement('option');o.value=s.id;o.textContent=s.title;e.append(o)})}document.getElementById('sceneSelect').addEventListener('change',e=>loadScene(SCENES.find(s=>s.id===e.target.value)));document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));document.getElementById('toggleActor').onclick=e=>toggleGroup('actor',e.currentTarget);document.getElementById('toggleHabitat').onclick=e=>toggleGroup('habitat',e.currentTarget);document.getElementById('toggleProps').onclick=e=>toggleGroup('props',e.currentTarget);document.getElementById('toggleGrid').onclick=e=>{grid.visible=!grid.visible;e.currentTarget.classList.toggle('active',grid.visible)};document.getElementById('toggleInfo').onclick=()=>document.getElementById('inspector').classList.toggle('collapsed');document.getElementById('closeInspector').onclick=()=>document.getElementById('inspector').classList.add('collapsed');document.getElementById('reset').onclick=reset;window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
async function boot(){try{const m=await fetch('./scenes/index.json',{cache:'no-store'});if(!m.ok)throw new Error('manifest '+m.status);const manifest=await m.json();for(const item of manifest.scenes||[]){const r=await fetch('./scenes/'+item.file,{cache:'no-store'});if(r.ok)SCENES.push(await r.json())}if(!SCENES.length)throw new Error('no scenes');fillSceneSelect();await loadScene(SCENES[0])}catch(e){status('scene manifest failed','bad');console.error(e)}}boot();
</script></body></html>
