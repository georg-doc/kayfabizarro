<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KFB Landmark Studies · Pilot 03</title>
<style>
:root{font-family:system-ui,sans-serif;background:#d7e0e8;color:#302c33}*{box-sizing:border-box}body{margin:0}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}.bar{background:#f3eee5;border-bottom:2px solid #39343d;padding:12px 16px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}.brand{font-size:14px;font-weight:800;margin-right:6px}.tag{display:block;font-size:10px;font-weight:400;color:#6b625e;letter-spacing:.08em}select,button{font:inherit;font-size:12px;background:#fffaf2;color:#39343d;border:1px solid #a19795;border-radius:6px;padding:7px 9px}button{cursor:pointer}label{font-size:11px;display:flex;align-items:center;gap:4px}.controls{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.stage{min-height:0}canvas{display:block;width:100%;height:100%;touch-action:none}.foot{background:#f3eee5;border-top:1px solid #b5afa5;padding:9px 16px;display:grid;gap:6px}.description{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}h1{font-family:Georgia,serif;font-size:21px;font-weight:500;margin:0}#note,#status,.small{font-size:11px;line-height:1.45;color:#555}#zones{display:flex;gap:10px;flex-wrap:wrap}input[type=color]{width:26px;height:24px;padding:0;border:1px solid #b9b1a6;border-radius:4px}.error{color:#9a3228!important}.small a{color:#355e70}@media(max-width:760px){.brand{width:100%}.bar{gap:6px;padding:8px}.foot{padding:7px 9px}.description{gap:4px}#note{font-size:10px}}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script></head>
<body><main class="app"><header class="bar"><div class="brand">KFB LANDMARK MODES<span class="tag">PILOT 03 · PRESENTATION EXPERIMENT</span></div>
<select id="model"><option value="eiffel">Eiffel Tower</option><option value="giza">Giza pyramids</option><option value="stonehenge">Stonehenge</option><option value="pentagon">The Pentagon</option><option value="spasskaya" selected>Spasskaya Tower</option><option value="kremlin-wall">Kremlin wall study</option><option value="compare">Same-scale lineup</option></select>
<select id="shape"><option value="base">Base geometry</option><option value="city-grotesque">City grotesque · exact</option><option value="soft-cubist">Soft cubist · rounded</option><option value="voxel-steps">Giza voxel steps</option><option value="boxel">Giza boxel blocks</option></select>
<select id="palette"><option value="city">OSM City palette</option><option value="natural">Natural materials</option><option value="colour">KFB colour study</option><option value="zones">Material zone IDs</option></select>
<div class="controls"><button data-view="oblique">Reset</button><button data-view="front">Front</button><button data-view="side">Side</button><button data-view="top">Top</button><label><input id="wire" type="checkbox">Wire</label><label><input id="grid" type="checkbox">Grid</label><button id="export">Export GLB</button></div></header>
<section id="stage" class="stage"><canvas id="view"></canvas></section>
<footer class="foot"><div class="description"><h1 id="title">Landmark</h1><span id="note">Loading…</span></div><div class="controls"><div id="zones"></div><button id="resetColours">Reset colours</button></div><div id="status">Loading Three.js and City style…</div><div class="small">City grotesque uses the existing OSM deformation values and wide lens. Soft cubist is a separate rounded landmark experiment. Voxel / Boxel currently applies only to Giza. <a href="https://github.com/georg-doc/kayfabizarro/tree/main/tools/img2threejs">Source / recovery</a></div></footer></main>
<script type="module">const timer=setTimeout(()=>document.querySelector('#status').textContent='Still loading. Check access to unpkg.com.',12000);try{const {boot}=await import('./viewer.mjs');await boot();clearTimeout(timer);}catch(e){clearTimeout(timer);const s=document.querySelector('#status');s.textContent='Viewer could not start: '+e.message;s.classList.add('error');console.error(e);}</script></body></html>
