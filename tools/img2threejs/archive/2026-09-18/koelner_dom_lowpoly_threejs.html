<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Low-Poly Kölner Dom – Three.js Prototype</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #d7e0e8; font-family: Arial, sans-serif; }
    #info {
      position: absolute; left: 12px; top: 12px; z-index: 10;
      background: rgba(255,255,255,0.88); padding: 10px 12px; border-radius: 10px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.12); max-width: 360px; line-height: 1.35;
    }
    #info h1 { margin: 0 0 6px; font-size: 18px; }
    #info p { margin: 4px 0; font-size: 13px; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="info">
    <h1>Low-Poly Kölner Dom</h1>
    <p>Ein grober, stilisierter Three.js-Prototyp direkt aus einfachen Geometrien.</p>
    <p>Maus: drehen · Mausrad: zoomen · Rechtsklick: verschieben</p>
    <p>Gedacht als Machbarkeitsdemo für einen modularen KFB-/ToolBox-Workflow.</p>
  </div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.161.0/build/three.module.js";
    import { OrbitControls } from "https://unpkg.com/three@0.161.0/examples/jsm/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xd7e0e8);
    scene.fog = new THREE.Fog(0xd7e0e8, 80, 220);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(55, 42, 72);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 18, 0);
    controls.enableDamping = true;
    controls.minDistance = 28;
    controls.maxDistance = 180;

    // Lights
    const hemi = new THREE.HemisphereLight(0xffffff, 0x667788, 1.2);
    scene.add(hemi);

    const dir = new THREE.DirectionalLight(0xffffff, 1.5);
    dir.position.set(35, 60, 25);
    dir.castShadow = true;
    dir.shadow.mapSize.set(2048, 2048);
    dir.shadow.camera.left = -80;
    dir.shadow.camera.right = 80;
    dir.shadow.camera.top = 80;
    dir.shadow.camera.bottom = -80;
    scene.add(dir);

    const fill = new THREE.DirectionalLight(0xbfd3ff, 0.5);
    fill.position.set(-40, 18, -25);
    scene.add(fill);

    // Materials
    const stone = new THREE.MeshStandardMaterial({
      color: 0x8a857c,
      roughness: 0.95,
      metalness: 0.02,
      flatShading: true
    });

    const roof = new THREE.MeshStandardMaterial({
      color: 0x59554d,
      roughness: 0.9,
      metalness: 0.03,
      flatShading: true
    });

    const darkStone = new THREE.MeshStandardMaterial({
      color: 0x6f6a61,
      roughness: 0.96,
      metalness: 0.01,
      flatShading: true
    });

    const glass = new THREE.MeshStandardMaterial({
      color: 0x6586a0,
      roughness: 0.25,
      metalness: 0.0,
      transparent: true,
      opacity: 0.65,
      flatShading: true
    });

    const group = new THREE.Group();
    scene.add(group);

    function addMesh(geometry, material, x=0, y=0, z=0, rx=0, ry=0, rz=0) {
      const m = new THREE.Mesh(geometry, material);
      m.position.set(x, y, z);
      m.rotation.set(rx, ry, rz);
      m.castShadow = true;
      m.receiveShadow = true;
      group.add(m);
      return m;
    }

    // Base platform
    addMesh(new THREE.BoxGeometry(44, 2, 22), darkStone, 0, 1, 0);

    // Nave
    addMesh(new THREE.BoxGeometry(14, 18, 42), stone, 0, 10, 1);
    addMesh(new THREE.CylinderGeometry(0.2, 0.2, 42, 6), darkStone, -7.3, 14, 1, Math.PI/2, 0, 0);
    addMesh(new THREE.CylinderGeometry(0.2, 0.2, 42, 6), darkStone, 7.3, 14, 1, Math.PI/2, 0, 0);

    // Nave roof
    addMesh(new THREE.ConeGeometry(11.5, 42, 4), roof, 0, 22, 1, 0, Math.PI/4, Math.PI/2);

    // Side aisles
    addMesh(new THREE.BoxGeometry(6, 11, 38), stone, -10, 6.5, 1);
    addMesh(new THREE.BoxGeometry(6, 11, 38), stone, 10, 6.5, 1);
    addMesh(new THREE.ConeGeometry(4.8, 38, 4), roof, -10, 12.5, 1, 0, Math.PI/4, Math.PI/2);
    addMesh(new THREE.ConeGeometry(4.8, 38, 4), roof, 10, 12.5, 1, 0, Math.PI/4, Math.PI/2);

    // Transept
    addMesh(new THREE.BoxGeometry(32, 15, 10), stone, 0, 9, -4);
    addMesh(new THREE.ConeGeometry(10.5, 32, 4), roof, 0, 18, -4, Math.PI/2, 0, Math.PI/4);

    // Choir / apse
    addMesh(new THREE.BoxGeometry(12, 16, 12), stone, 0, 9, -23);
    addMesh(new THREE.ConeGeometry(10, 12, 6), roof, 0, 18, -23, Math.PI/2, 0, Math.PI/6);

    // Front facade block
    addMesh(new THREE.BoxGeometry(20, 20, 8), stone, 0, 11, 22);

    // Twin towers
    function buildTower(x) {
      addMesh(new THREE.BoxGeometry(6.4, 36, 6.4), stone, x, 19, 22);
      addMesh(new THREE.BoxGeometry(8, 4, 8), darkStone, x, 37, 22);
      addMesh(new THREE.CylinderGeometry(2.7, 3.6, 18, 8), stone, x, 48, 22);
      addMesh(new THREE.CylinderGeometry(0.3, 0.3, 18, 5), darkStone, x, 48, 22, Math.PI/2, 0, 0);
      addMesh(new THREE.ConeGeometry(3.2, 22, 8), darkStone, x, 68, 22);
      addMesh(new THREE.CylinderGeometry(0.18, 0.18, 8, 5), darkStone, x, 80, 22);
      addMesh(new THREE.BoxGeometry(7.4, 0.7, 0.9), darkStone, x, 37, 22);
      addMesh(new THREE.BoxGeometry(0.9, 0.7, 7.4), darkStone, x, 37, 22);
    }

    buildTower(-6.5);
    buildTower(6.5);

    // Facade central gable
    addMesh(new THREE.ConeGeometry(5.5, 9, 3), darkStone, 0, 26.5, 22, 0, Math.PI/4, Math.PI);

    // Small rear spires
    function spire(x, z, scale=1) {
      addMesh(new THREE.CylinderGeometry(1.2*scale, 1.8*scale, 10*scale, 8), stone, x, 24*scale/1.1, z);
      addMesh(new THREE.ConeGeometry(1.8*scale, 11*scale, 8), darkStone, x, 33*scale/1.1, z);
    }
    spire(-10, -24, 1.1);
    spire(10, -24, 1.1);
    spire(-16, -3, 0.8);
    spire(16, -3, 0.8);

    // Flying-buttress-ish accents (very simplified)
    function buttressRow(side) {
      const x = side * 14.5;
      for (let i = 0; i < 6; i++) {
        const z = 16 - i * 7;
        addMesh(new THREE.BoxGeometry(1.2, 8, 1.2), darkStone, x, 4, z);
        addMesh(new THREE.BoxGeometry(2.3, 0.7, 6), darkStone, x - side*1.2, 8.2, z - 1.3, 0.35*side, 0, 0);
      }
    }
    buttressRow(-1);
    buttressRow(1);

    // Windows
    function windowStrip(x, y, zStart, count, spacing, sideRot = 0) {
      for (let i = 0; i < count; i++) {
        addMesh(new THREE.BoxGeometry(0.28, 4.2, 1.45), glass, x, y, zStart - i * spacing, 0, sideRot, 0);
      }
    }

    windowStrip(-7.15, 13, 18, 8, 4.5);
    windowStrip(7.15, 13, 18, 8, 4.5);
    windowStrip(-13.0, 8, 15, 7, 4.8);
    windowStrip(13.0, 8, 15, 7, 4.8);
    windowStrip(-6.4, 18, 24, 3, 3.6);
    windowStrip(6.4, 18, 24, 3, 3.6);

    // Portal
    addMesh(new THREE.BoxGeometry(5.5, 9, 1.2), darkStone, 0, 5.5, 26.2);
    addMesh(new THREE.CylinderGeometry(0.35, 0.35, 5.5, 6), darkStone, -1.8, 8.5, 26.3, 0, 0, Math.PI/2);
    addMesh(new THREE.CylinderGeometry(0.35, 0.35, 5.5, 6), darkStone, 1.8, 8.5, 26.3, 0, 0, Math.PI/2);

    // Ground
    const ground = new THREE.Mesh(
      new THREE.CylinderGeometry(95, 110, 1.5, 40),
      new THREE.MeshStandardMaterial({ color: 0xa7b79a, roughness: 1.0, metalness: 0.0, flatShading: true })
    );
    ground.position.y = -0.8;
    ground.receiveShadow = true;
    scene.add(ground);

    // Simple plaza
    const plaza = new THREE.Mesh(
      new THREE.CylinderGeometry(32, 35, 0.6, 24),
      new THREE.MeshStandardMaterial({ color: 0xb9b0a3, roughness: 1.0, metalness: 0.0, flatShading: true })
    );
    plaza.position.set(0, 0.1, 12);
    plaza.receiveShadow = true;
    scene.add(plaza);

    // Context cubes for scale
    const cubeMat = new THREE.MeshStandardMaterial({ color: 0x8a6f5f, roughness: 1, flatShading: true });
    for (let i = 0; i < 5; i++) {
      const c = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.8, 1.1), cubeMat);
      c.position.set(-9 + i * 4.2, 0.9, 31.5);
      c.castShadow = true;
      c.receiveShadow = true;
      scene.add(c);
    }

    // Slight overall tilt/placement for nicer view
    group.position.set(0, 0, 0);

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
