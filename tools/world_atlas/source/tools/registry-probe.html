<!doctype html>
<html><head><meta charset="utf-8"><title>registry probe</title></head>
<body style="font:13px ui-monospace,monospace;padding:12px">
<pre id="out">loading…</pre>
<script>
const BASE='https://raw.githubusercontent.com/georg-doc/kayfabizarro/bot/asset-registry-update/registry/assets/v1';
window.CAT=null;
(async()=>{
  try{
    const t=await (await fetch(BASE+'/catalog.jsonl',{cache:'no-store'})).text();
    const rows=t.split(/\r?\n/).filter(Boolean).map(l=>JSON.parse(l));
    window.CAT=rows;
    const byCol={};
    for(const r of rows){const k=r.collectionPath||'(none)';byCol[k]=(byCol[k]||0)+1;}
    document.getElementById('out').textContent=
      'rows: '+rows.length+'\n\nsample:\n'+JSON.stringify(rows.find(r=>r.kind==='model-3d')||rows[0],null,1)+
      '\n\ncollections:\n'+Object.entries(byCol).sort((a,b)=>b[1]-a[1]).slice(0,60).map(([k,v])=>v+'  '+k).join('\n');
  }catch(e){document.getElementById('out').textContent='ERR '+e.message;}
})();
</script>
</body></html>
