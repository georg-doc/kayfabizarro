<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Probe · Dungeon-Pack-Inventar</title>
<script type="importmap">
{"imports":{
 "three":"https://unpkg.com/three@0.184.0/build/three.module.js",
 "three/addons/loaders/GLTFLoader.js":"https://unpkg.com/three@0.184.0/examples/jsm/loaders/GLTFLoader.js",
 "three/addons/controls/OrbitControls.js":"https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js"
}}
</script>
<style>body{margin:0;background:#120c20;color:#ded5ff;font:11px/1.6 ui-monospace,monospace;padding:10px;white-space:pre-wrap}</style>
</head>
<body>
<div id="out">probe…</div>
<script type="module">
import { measure } from '../lib/kit-lab.js';

/* Ladeversuch gegen die Roh-URL: was im FREE-Pack wirklich liegt, entscheidet, was ein Generator
   ausdrücken kann. Dieselbe Reihenfolge wie beim Hex-Pack (S12): erst Inventar, dann Modell,
   dann Form — nicht umgekehrt. Kandidaten aus der S1-Szene plus die Namen, die ein
   Raum-und-Gang-Generator BRAUCHT (Ecken, Enden, Treppen, Türen, Säulen). */
const CAND = [
  // Böden
  'floor_tile_large', 'floor_tile_small', 'floor_wood_large', 'floor_wood_small',
  'floor_dirt_large', 'floor_dirt_small', 'floor_tile_big', 'floor_stone_large',
  // Wände · Grundformen
  'wall', 'wall_half', 'wall_corner', 'wall_corner_inner', 'wall_corner_outer',
  'wall_end', 'wall_pillar', 'wall_column', 'wall_T', 'wall_cross',
  // Wände · Varianten aus S1 bestätigt
  'wall_cracked', 'wall_broken', 'wall_doorway', 'wall_gated', 'wall_shelves',
  'wall_scaffold', 'wall_window_closed', 'wall_window_open', 'wall_arched',
  'wall_doorway_door', 'wall_doorway_gate', 'wall_open_scaffold',
  // Übergänge / Höhe
  'stairs', 'stairs_stone', 'stairs_wood', 'ramp', 'floor_stairs', 'stairs_small',
  'pillar', 'pillar_broken', 'column', 'column_broken', 'arch', 'archway',
  // Durchgänge und Deko, die Räume lesbar machen
  'door', 'door_wood', 'gate', 'portcullis', 'torch_mounted', 'torch',
  'banner_shield_white', 'chandelier', 'brazier',
  // Requisiten (Stichprobe: was S1 benutzt, plus Plausibles)
  'barrel_large', 'barrel_small', 'barrel_small_stack', 'crates_stacked', 'box_stacked',
  'shelves', 'table_medium_decorated_A', 'table_long_tablecloth_decorated_A',
  'bed_decorated', 'bed_frame', 'chair', 'stool', 'trunk_large_A', 'trunk_medium_B',
  'keg_decorated', 'rubble_large', 'rubble_half', 'rubble_small',
  'chest', 'chest_gold', 'coin_stack', 'skull', 'bones', 'sarcophagus', 'statue',
  'well', 'altar', 'cage', 'anvil', 'forge', 'spikes', 'trap', 'lever', 'key', 'keyring_hanging'
];

const hit = [], miss = [];
const out = document.getElementById('out');
for (const n of CAND) {
  try {
    const m = await measure('dungeon', n);
    hit.push({ n, size: m.size.map((v) => +v.toFixed(2)), min: m.min.map((v) => +v.toFixed(2)), max: m.max.map((v) => +v.toFixed(2)) });
  } catch (e) { miss.push(n); }
  out.textContent = `probe ${hit.length + miss.length}/${CAND.length} · ${hit.length} gefunden`;
}
window.HIT = hit; window.MISS = miss;
const group = (re) => hit.filter((h) => re.test(h.n));
const fmt = (list) => list.map((h) => `  ${h.n.padEnd(34)} ${h.size.join(' × ').padEnd(22)} pivot-Offset x ${((h.min[0] + h.max[0]) / 2).toFixed(2)} z ${((h.min[2] + h.max[2]) / 2).toFixed(2)}`).join('\n');
out.textContent = [
  `${hit.length} von ${CAND.length} Kandidaten geladen · ${miss.length} fehlen`,
  '', 'BÖDEN', fmt(group(/^floor/)),
  '', 'WÄNDE', fmt(group(/^wall/)),
  '', 'HÖHE / DURCHGANG', fmt(group(/stair|ramp|pillar|column|arch|door|gate|portcullis/)),
  '', 'REST', fmt(hit.filter((h) => !/^floor|^wall|stair|ramp|pillar|column|arch|door|gate|portcullis/.test(h.n))),
  '', 'FEHLT', '  ' + miss.join(', ')
].join('\n');
</script>
</body>
</html>
