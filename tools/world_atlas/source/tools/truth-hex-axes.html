<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bodenwahrheit · Kachelachsen aus der Geometrie</title>
<script type="importmap">
{"imports":{
 "three":"https://unpkg.com/three@0.184.0/build/three.module.js",
 "three/addons/loaders/GLTFLoader.js":"https://unpkg.com/three@0.184.0/examples/jsm/loaders/GLTFLoader.js",
 "three/addons/controls/OrbitControls.js":"https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js"
}}
</script>
<style>body{margin:0;background:#111;color:#ccc;font:11px ui-monospace,monospace;padding:8px;white-space:pre-wrap}</style>
</head>
<body>
<div id="out">lade…</div>
<script type="module">
import * as THREE from 'three';
import { loadAsset, measure } from '../lib/kit-lab.js';
import { hexMetrics, rotDeg } from '../lib/hex-grid.js';

/* WARUM DIESES WERKZEUG.
   Die Kantentabellen kamen aus einem Draufsicht-RENDERING, und der Sampler rechnete
   `y = ((wz/half)*0.5+0.5)*(SIZE-1)`. `readRenderTargetPixels` liefert Zeilen aber von UNTEN,
   und die Ortho-Kamera auf (cx,10,cz) mit lookAt(cx,0,cz) hat bei up = +Y einen degenerierten
   Blickvektor — three.js rettet sich mit einem Nudge, und der Bildschirm-Aufwärtsvektor landet
   bei −z. Beide Effekte betreffen dieselbe Achse. Ob sie sich aufheben oder verdoppeln, ist
   nicht zu erraten, und genau deshalb wird hier NICHT gespiegelt, sondern gemessen.

   Die Messung braucht keine Kamera: die Wasserfläche einer Uferkachel ist eigene Geometrie
   (Oberkante ≈ −0,20, der Kachelkörper reicht bis −1). Ihr Schwerpunkt im OBJEKTraum zeigt in
   die Richtung des Wasserlaufs — absolut, ohne Pixel, ohne Achsenkonvention. Damit werden zwei
   Grössen einzeln nachgewiesen:
     1 die Kantentabelle (zeigt das Wasser von hex_coast_B wirklich nach 270°, also auf die
       Kanten 4 und 5 — oder nach 90°, dann ist die Tabelle in z gespiegelt)
     2 das Drehvorzeichen (dieselbe Kachel um rotDeg(1) gedreht: wandert der Schwerpunkt nach
       330°, also Kante i → i+1, oder nach 210°)
   Winkel durchweg atan2(z, x) in Grad, Kante d liegt bei d·60°. */

const out = [];
const say = (s) => { out.push(s); document.getElementById('out').textContent = out.join('\n'); };
const ang = (x, z) => ((Math.atan2(z, x) * 180 / Math.PI) + 360) % 360;
const near = (a, b, tol = 20) => Math.min(Math.abs(a - b), 360 - Math.abs(a - b)) <= tol;

/* Schwerpunkt aller Vertices in einem y-Fenster, im Raum des übergebenen Knotens */
function centroidInBand(node, lo, hi) {
  const v = new THREE.Vector3();
  let sx = 0, sz = 0, n = 0;
  node.updateWorldMatrix(true, true);
  node.traverse((o) => {
    if (!o.isMesh) return;
    const pos = o.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld);
      if (v.y < lo || v.y > hi) continue;
      sx += v.x; sz += v.z; n++;
    }
  });
  return n ? { x: sx / n, z: sz / n, n } : null;
}
/* y-Histogramm: zeigt, wo überhaupt waagerechte Flächen liegen */
function yBands(node) {
  const v = new THREE.Vector3(), hist = new Map();
  node.updateWorldMatrix(true, true);
  node.traverse((o) => {
    if (!o.isMesh) return;
    const pos = o.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld);
      const k = (Math.round(v.y * 20) / 20).toFixed(2);
      hist.set(k, (hist.get(k) || 0) + 1);
    }
  });
  return [...hist].sort((a, b) => Number(a[0]) - Number(b[0]));
}

const meas = await measure('hex_coast', 'hex_coast_B');
const M = hexMetrics(meas.size);
say(`hex_coast_B  box y ${meas.min[1].toFixed(3)} … ${meas.max[1].toFixed(3)}  ·  Inradius ${M.inradius.toFixed(3)}`);
const src = await loadAsset('hex_coast', 'hex_coast_B');

/* Knoten und ihre Boxen — falls das Wasser ein eigener Mesh ist, steht es hier */
{
  const probe = src.clone(true);
  probe.updateWorldMatrix(true, true);
  const lines = [];
  probe.traverse((o) => {
    if (!o.isMesh) return;
    const b = new THREE.Box3().setFromObject(o);
    lines.push(`  ${(o.name || '(unbenannt)').padEnd(26)} y ${b.min.y.toFixed(3)}…${b.max.y.toFixed(3)}  mat ${(o.material?.name || '?')}`);
  });
  say('Meshes:\n' + lines.join('\n'));
  say('y-Bänder (y → Vertexzahl):\n  ' + yBands(probe).map(([y, n]) => `${y}:${n}`).join('  '));
}

/* 1 Kantentabelle prüfen: Schwerpunkt der Wasserfläche, unrotiert */
const waterBand = [-0.30, -0.12];
{
  const node = src.clone(true);
  node.updateWorldMatrix(true, true);
  const c = centroidInBand(node, waterBand[0], waterBand[1]);
  if (!c) say('KEIN Wasserband gefunden — Fenster anpassen (siehe y-Bänder oben)');
  else {
    const a = ang(c.x, c.z);
    say(`\n1 WASSERSCHWERPUNKT unrotiert:  ${a.toFixed(1)}°  (${c.n} Vertices, x ${c.x.toFixed(3)} z ${c.z.toFixed(3)})`);
    say(`   Tabelle sagt Kanten 4,5 → Mitte 270°.  gespiegelt wäre 90°.`);
    say(near(a, 270) ? '   ⇒ TABELLE STIMMT (Kanten 4,5 = NW,NO)' : near(a, 90) ? '   ⇒ TABELLE IST IN z GESPIEGELT' : `   ⇒ weder 270 noch 90 — Kante bei ${Math.round(a / 60) % 6}`);
  }
}

/* 2 Drehvorzeichen prüfen: dieselbe Kachel um rotDeg(1) gedreht. Kante i → i+1 heisst, der
   Schwerpunkt wandert von 270° auf 330°. */
{
  const node = new THREE.Group();
  const inner = src.clone(true);
  node.add(inner);
  node.rotation.y = (rotDeg(1) * Math.PI) / 180;
  node.updateWorldMatrix(true, true);
  const c = centroidInBand(node, waterBand[0], waterBand[1]);
  const a = c ? ang(c.x, c.z) : null;
  say(`\n2 DREHUNG rotDeg(1) = ${rotDeg(1)}°:  Schwerpunkt ${a === null ? '—' : a.toFixed(1) + '°'}`);
  say('   Kante i → i+1 verlangt 330°.  i → i−1 wäre 210°.');
  if (a !== null) say(near(a, 330) ? '   ⇒ rotDeG STIMMT (i → i+1, wie rotMask)' : near(a, 210) ? '   ⇒ rotDeg HAT DAS FALSCHE VORZEICHEN' : `   ⇒ unerwartet: ${a.toFixed(1)}°`);
}

/* 3 Gegenprobe an einer zweiten asymmetrischen Kachel: hex_coast_C, Tabelle sagt Wasser auf
   {0,4,5}, Mitte also 300°. */
{
  const node = (await loadAsset('hex_coast', 'hex_coast_C')).clone(true);
  node.updateWorldMatrix(true, true);
  const c = centroidInBand(node, waterBand[0], waterBand[1]);
  const a = c ? ang(c.x, c.z) : null;
  say(`\n3 hex_coast_C unrotiert: Schwerpunkt ${a === null ? '—' : a.toFixed(1) + '°'}  ·  Tabelle {0,4,5} → 300°, gespiegelt {0,1,2} → 60°`);
  if (a !== null) say(near(a, 300) ? '   ⇒ stimmt' : near(a, 60) ? '   ⇒ gespiegelt' : '   ⇒ unerwartet');
}
window.TRUTH = { out };
</script>
</body>
</html>
