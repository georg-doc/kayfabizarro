<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scan · hex Kantenklassen aus dem Rendering</title>
<script type="importmap">
{"imports":{
 "three":"https://unpkg.com/three@0.184.0/build/three.module.js",
 "three/addons/loaders/GLTFLoader.js":"https://unpkg.com/three@0.184.0/examples/jsm/loaders/GLTFLoader.js",
 "three/addons/controls/OrbitControls.js":"https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js"
}}
</script>
<style>body{margin:0;background:#111;color:#ccc;font:11px ui-monospace,monospace;padding:8px;white-space:pre-wrap}</style>
</head>
<body>
<div id="out">scanne…</div>
<script type="module">
import * as THREE from 'three';
import { loadAsset, measure } from '../lib/kit-lab.js';
import { hexMetrics } from '../lib/hex-grid.js';

/* ZWEITE FASSUNG. Die erste nahm die sechs ECKEN jeder Kachel als Land-Referenz. Auf Straßen-
   und Flusskacheln ist das richtig (dort bleiben alle Ecken Wiese), auf KÜSTENkacheln ist es
   falsch: dort liegen Ecken im Wasser, der Median kippt, und drei der fünf Küstenkacheln kamen
   mit leerer Maske zurück. Deshalb jetzt ABSOLUT: die Referenzfarben werden aus hex_grass,
   hex_water und der Mitte von hex_road_L gelernt (alle Renderings nutzen dasselbe flache Licht,
   die Farben sind also vergleichbar), und jede Kante wird in drei Klassen einsortiert:
   g Wiese · s Sand (Straße/Strand) · w Wasser. Pro Kante wird nicht ein Pixel gelesen, sondern
   fünf entlang der Kante — die Mehrheit gewinnt. Zusätzlich wird die Kachelmitte klassifiziert,
   damit „Kachel ist im Kern Wasser" (Küste D/E) sichtbar wird statt geraten. */
const SIZE = 256;
const rt = new THREE.WebGLRenderTarget(SIZE, SIZE);
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.add(new THREE.HemisphereLight(0xffffff, 0xffffff, 3.0));

const JOBS = [
  ['hex_base', 'hex_grass'], ['hex_base', 'hex_water'],
  ...'ABCDEFGHIJKLM'.split('').map((l) => ['hex_roads', `hex_road_${l}`]),
  ...'ABCDEFGHIJKL'.split('').map((l) => ['hex_river', `hex_river_${l}`]),
  ...'ABCDE'.split('').map((l) => ['hex_coast', `hex_coast_${l}`]),
  ...'ABCDE'.split('').map((l) => ['hex_coastw', `hex_coast_${l}_waterless`])
];
const EDGE = [0, 60, 120, 180, 240, 300];   // Reihenfolge wie DIRS: O SO SW W NW NO
const buf = new Uint8Array(SIZE * SIZE * 4);
const out = {};
const log = (t) => { document.getElementById('out').textContent = t; };

function renderTile(src, meas) {
  const M = hexMetrics(meas.size);
  const node = src.clone(true);
  scene.add(node);
  const cx = (meas.min[0] + meas.max[0]) / 2, cz = (meas.min[2] + meas.max[2]) / 2;
  const half = M.H / 2 * 1.02;
  const cam = new THREE.OrthographicCamera(-half, half, half, -half, 0.1, 50);
  cam.position.set(cx, 10, cz);
  cam.lookAt(cx, 0, cz);
  renderer.setRenderTarget(rt);
  renderer.render(scene, cam);
  renderer.readRenderTargetPixels(rt, 0, 0, SIZE, SIZE, buf);
  renderer.setRenderTarget(null);
  scene.remove(node);
  return {
    M, half,
    /* ACHSENBEWEIS (tools/truth-hex-axes.html): readRenderTargetPixels liefert Zeilen von
       UNTEN, und der Bildschirm-Aufwärtsvektor der Draufsichtkamera zeigt auf −z. Die erste
       Fassung rechnete y direkt aus wz und spiegelte damit jede asymmetrische Kachel. */
    px(wx, wz) {
      const x = Math.round(((wx / half) * 0.5 + 0.5) * (SIZE - 1));
      const y = Math.round(((-wz / half) * 0.5 + 0.5) * (SIZE - 1));
      const i = (y * SIZE + x) * 4;
      return [buf[i], buf[i + 1], buf[i + 2]];
    }
  };
}
const dist2 = (a, b) => (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 + (a[2] - b[2]) ** 2;

/* Referenzfarben lernen: Wiese und Wasser aus den Vollkacheln, Sand aus der Mitte von road_L
   (dort kreuzen sich alle sechs Arme, die Mitte ist garantiert Weg). */
const REF = {};
try {
for (const [pack, name, key, at] of [
  ['hex_base', 'hex_grass', 'g', [0, 0]],
  ['hex_base', 'hex_water', 'w', [0, 0]],
  ['hex_roads', 'hex_road_L', 's', [0, 0]]
]) {
  log('lerne Referenz ' + name);
  const R = renderTile(await loadAsset(pack, name), await measure(pack, name));
  REF[key] = R.px(at[0], at[1]);
}
} catch (e) { log('FEHLER Referenz: ' + e.message); throw e; }
const classify = (rgb) => {
  let best = null, bd = Infinity;
  for (const [k, ref] of Object.entries(REF)) { const d = dist2(rgb, ref); if (d < bd) { bd = d; best = k; } }
  return { k: best, d: Math.round(Math.sqrt(bd)) };
};

try {
for (const [pack, name] of JOBS) {
  log('scanne ' + name);
  const meas = await measure(pack, name);
  const R = renderTile(await loadAsset(pack, name), meas);
  const { M } = R;
  const sampleRing = (radius, ang, spread, n) => {
    const votes = {};
    for (let i = 0; i < n; i++) {
      const a = ((ang + (spread * (i / (n - 1) - 0.5) * 2)) * Math.PI) / 180;
      const c = classify(R.px(Math.cos(a) * radius, Math.sin(a) * radius));
      votes[c.k] = (votes[c.k] || 0) + 1;
    }
    return Object.entries(votes).sort((a, b) => b[1] - a[1])[0][0];
  };
  /* Kante: fünf Punkte kurz innerhalb der Kantenmitte, ±14° entlang der Kante */
  const kinds = EDGE.map((ang) => sampleRing(M.inradius * 0.90, ang, 14, 5));
  /* Mitte: fünf Punkte um den Kachelmittelpunkt */
  const centre = [[0, 0], [0.18, 0], [-0.18, 0], [0, 0.18], [0, -0.18]]
    .map(([dx, dz]) => classify(R.px(dx, dz)).k);
  const cVotes = {}; for (const k of centre) cVotes[k] = (cVotes[k] || 0) + 1;
  const core = Object.entries(cVotes).sort((a, b) => b[1] - a[1])[0][0];
  const maskOf = (k) => kinds.reduce((m, kk, i) => (kk === k ? m | (1 << i) : m), 0);
  out[name] = { kinds, core, sand: maskOf('s'), water: maskOf('w'), grass: maskOf('g') };
}
} catch (e) { log('FEHLER Scan: ' + e.message); throw e; }
window.RESULT = out;
window.REF = REF;
log(`ref  g=${REF.g.join(',')}  s=${REF.s.join(',')}  w=${REF.w.join(',')}\n\n` +
  'Kante: g Wiese · s Sand · w Wasser — Reihenfolge O SO SW W NW NO\n\n' +
  Object.entries(out).map(([n, r]) =>
    `${n.padEnd(26)} ${r.kinds.join('')}  kern=${r.core}  sand=${r.sand} water=${r.water}`).join('\n'));
</script>
</body>
</html>
