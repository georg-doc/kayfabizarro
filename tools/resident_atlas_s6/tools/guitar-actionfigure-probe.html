<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Gitarren-Ausrichtung + ActionFigure · Messsonde</title>
<script type="importmap">
{"imports":{
 "three":"https://unpkg.com/three@0.184.0/build/three.module.js",
 "three/addons/controls/OrbitControls.js":"https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
 "three/addons/controls/TransformControls.js":"https://unpkg.com/three@0.184.0/examples/jsm/controls/TransformControls.js",
 "three/addons/loaders/GLTFLoader.js":"https://unpkg.com/three@0.184.0/examples/jsm/loaders/GLTFLoader.js",
 "three/addons/utils/SkeletonUtils.js":"https://unpkg.com/three@0.184.0/examples/jsm/utils/SkeletonUtils.js"
}}
</script>
<style>body{background:#12110d;color:#e8e2cf;font:12px/1.5 ui-monospace,monospace;padding:16px}pre{white-space:pre-wrap}</style>
</head>
<body><pre id="out">messe …</pre>
<script type="module">
import * as THREE from 'three';
import { measure, instance, loadClips, findBone } from '../lib/atlas.js';

const P = 'media/3D_Assets/KayKit_Mystery_Series6/';
const AN = P + '5 - November 2023 - Animatronic/';
const AF = P + '6 - December 2023 - Action Figure/';
const n = (v) => Math.round(v * 1000) / 1000;
const out = { guitar: {}, af: { sizes: {}, heads: {}, figure: {} } };
const med = await loadClips('Rig_Medium');

/* ---------- 1 · Gitarre: aim + grip + roll gegen die Vorlage ---------- */
/* Vorlage: Hals hoch nach vorn/aussen, Korpus diagonal unten quer vor dem Bauch,
   Gitarrenfläche zur Kamera. Nur mit aim allein liegt sie waagerecht (S25-Befund am Bild). */
async function guitarTry(pose, slot, aim, grip, roll) {
  const fig = await instance(AN + 'characters/gltf/Animatronic_Normal.glb');
  const hit = med.find((c) => c.name === pose);
  const m = new THREE.AnimationMixer(fig);
  const a = m.clipAction(hit.clip); a.play(); m.update(0); a.paused = true;
  const g = await instance(AN + 'assets/gltf/Guitar.gltf');
  const f = findBone(fig, slot);
  f.bone.add(g);
  g.position.set(0, 0, 0);
  fig.updateWorldMatrix(true, true);
  /* identisch zur atlas.js-Rechnung */
  const bq = f.bone.getWorldQuaternion(new THREE.Quaternion());
  const axis = new THREE.Vector3(0, 1, 0);
  const wantLocal = new THREE.Vector3(...aim).normalize().applyQuaternion(bq.clone().invert());
  const q = new THREE.Quaternion().setFromUnitVectors(axis, wantLocal);
  if (roll) q.multiply(new THREE.Quaternion().setFromAxisAngle(axis, THREE.MathUtils.degToRad(roll)));
  g.quaternion.copy(q);
  if (grip) g.position.add(axis.clone().applyQuaternion(q).multiplyScalar(grip));
  fig.updateWorldMatrix(true, true);
  const gb = new THREE.Box3().setFromObject(g);
  const wp = (bn) => { const b = findBone(fig, bn); return b ? b.bone.getWorldPosition(new THREE.Vector3()) : null; };
  const dist = (p) => p ? n(gb.clampPoint(p, new THREE.Vector3()).distanceTo(p)) : null;
  /* Flächennormale der Gitarre = lokale Z-Achse in Weltkoordinaten */
  const normal = new THREE.Vector3(0, 0, 1).applyQuaternion(g.getWorldQuaternion(new THREE.Quaternion()));
  const longAxis = new THREE.Vector3(0, 1, 0).applyQuaternion(g.getWorldQuaternion(new THREE.Quaternion()));
  return {
    box: { min: gb.min.toArray().map(n), max: gb.max.toArray().map(n) },
    bottomY: n(gb.min.y), topY: n(gb.max.y),
    faceNormal: normal.toArray().map(n),
    longAxisWorld: longAxis.toArray().map(n),
    elevationDeg: n(THREE.MathUtils.radToDeg(Math.asin(longAxis.y))),
    distFreeHand: dist(wp(slot === 'handslot.r' ? 'handslot.l' : 'handslot.r')),
    distHead: dist(wp('head'))
  };
}

for (const roll of [0, 45, 90, 135, 180, 225, 270, 315]) {
  out.guitar['Holding_B r aim[.5,.82,.28] grip.45 roll' + roll] =
    await guitarTry('Holding_B', 'handslot.r', [0.5, 0.82, 0.28], 0.45, roll);
}
/* zwei Alternativen zum Neigungswinkel, gleicher Roll-Satz nur grob */
for (const aim of [[0.42, 0.88, 0.22], [0.58, 0.72, 0.38]]) {
  out.guitar['Holding_B r aim[' + aim.join(',') + '] grip.45 roll0'] =
    await guitarTry('Holding_B', 'handslot.r', aim, 0.45, 0);
}

/* ---------- 2 · ActionFigure: Kopf-Varianten + Gesichts-Atlas ---------- */
for (const p of [AF + 'character/gltf/ActionFigure.glb',
                 AF + 'assets/gltf/ActionFigure_Head_Normal.gltf',
                 AF + 'assets/gltf/ActionFigure_Head_B.gltf',
                 AF + 'assets/gltf/ActionFigure_Head_C.gltf',
                 AF + 'assets/gltf/ActionFigure_Head_D.gltf']) {
  try {
    const f = await measure(p);
    out.af.sizes[f.name] = { size: f.size.map(n), min: f.min.map(n), max: f.max.map(n), skin: f.skin };
  } catch (e) { out.af.sizes[p] = 'ERR ' + e.message; }
}

/* Mesh-/Material-/Textur-Inventar je Kopf \u2014 welches Material liest das Gesichtsblatt? */
for (const h of ['Normal', 'B', 'C', 'D']) {
  const node = await instance(AF + 'assets/gltf/ActionFigure_Head_' + h + '.gltf');
  const meshes = [];
  node.traverse((o) => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    meshes.push({
      mesh: o.name,
      materials: mats.map((m) => ({
        name: m.name,
        map: m.map ? (m.map.name || m.map.image?.src?.split('/').pop() || 'unnamed') : null,
        mapSize: m.map?.image ? [m.map.image.width, m.map.image.height] : null,
        uvRange: (() => {
          const uv = o.geometry.attributes.uv;
          if (!uv) return null;
          let u0 = 9, u1 = -9, v0 = 9, v1 = -9;
          for (let i = 0; i < uv.count; i++) {
            const u = uv.getX(i), v = uv.getY(i);
            if (u < u0) u0 = u; if (u > u1) u1 = u;
            if (v < v0) v0 = v; if (v > v1) v1 = v;
          }
          return [n(u0), n(u1), n(v0), n(v1)];
        })()
      }))
    });
  });
  out.af.heads[h] = meshes;
}

/* head-Bone-Lage an der Figur: wo muss ein Wechselkopf hin? */
const fig = await instance(AF + 'character/gltf/ActionFigure.glb');
const hit = med.find((c) => c.name === 'Idle_A');
if (hit) { const m = new THREE.AnimationMixer(fig); const a = m.clipAction(hit.clip); a.play(); m.update(0); a.paused = true; }
fig.updateWorldMatrix(true, true);
const hb = findBone(fig, 'head');
out.af.figure.headBoneWorld = hb ? hb.bone.getWorldPosition(new THREE.Vector3()).toArray().map(n) : null;
const figMeshes = [];
fig.traverse((o) => {
  if (!o.isMesh && !o.isSkinnedMesh) return;
  const mats = Array.isArray(o.material) ? o.material : [o.material];
  figMeshes.push({ mesh: o.name, skinned: !!o.isSkinnedMesh,
    materials: mats.map((m) => ({ name: m.name, mapSize: m.map?.image ? [m.map.image.width, m.map.image.height] : null })) });
});
out.af.figure.meshes = figMeshes;

document.getElementById('out').textContent = JSON.stringify(out, null, 1);
window.__p = out;
</script>
</body>
</html>
