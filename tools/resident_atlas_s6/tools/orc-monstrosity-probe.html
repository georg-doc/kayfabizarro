<script type="module">
import * as THREE from 'three';
import { measure, instance, loadClips, findBone } from '../lib/atlas.js';

const P = 'media/3D_Assets/KayKit_Mystery_Series6/';
const OB = P + '2 - August 2025 - Orc Brute/';
const OR = P + '1 - July 2023 - Orc Raider/assets/gltf/';
const MO = P + '4 - October 2025 - Monstrosity/';

const paths = [
  OB + 'OrcBrute.glb',
  OB + 'gltf/Orc_Axe.gltf', OB + 'gltf/Orc_Axe_Large.gltf',
  OB + 'gltf/Orc_Banner.gltf', OB + 'gltf/Orc_Banner_Large.gltf',
  OR + 'Orc_Wardrum.gltf.glb', OR + 'Orc_WardrumStick.gltf.glb',
  OR + 'Orc_Club.gltf.glb', OR + 'Orc_DrinkingHorn.gltf.glb', OR + 'Orc_Backpack.gltf.glb',
  MO + 'Monstrosity.glb',
  MO + 'gltf/Monstrosity_BarndoorShield.gltf', MO + 'gltf/Monstrosity_BarndoorShield_Large.gltf',
  MO + 'gltf/Monstrosity_Pitchfork.gltf', MO + 'gltf/Monstrosity_Pitchfork_Large.gltf'
];

const n = (v) => Math.round(v * 1000) / 1000;
const out = { sizes: {}, clips: {}, rigs: {} };

for (const p of paths) {
  try {
    const f = await measure(p);
    out.sizes[f.name] = { size: f.size.map(n), min: f.min.map(n), max: f.max.map(n), skin: f.skin };
  } catch (e) { out.sizes[p] = 'ERR ' + e.message; }
}

const clips = await loadClips('Rig_Large');
out.clips.Rig_Large = clips.map((c) => c.set + '/' + c.name);

/* handslot + head world positions under candidate poses, measured on the posed figure */
async function probe(path, poses) {
  const res = {};
  for (const pn of poses) {
    const node = await instance(path);
    const hit = clips.find((c) => c.name === pn);
    if (!hit) { res[pn] = 'kein Clip'; continue; }
    const m = new THREE.AnimationMixer(node);
    const a = m.clipAction(hit.clip); a.play(); m.update(0); a.paused = true;
    node.updateWorldMatrix(true, true);
    const g = (bn) => {
      const f = findBone(node, bn);
      if (!f) return null;
      return f.bone.getWorldPosition(new THREE.Vector3()).toArray().map(n);
    };
    const b = new THREE.Box3().setFromObject(node);
    res[pn] = { 'handslot.r': g('handslot.r'), 'handslot.l': g('handslot.l'), head: g('head'),
                'hand.r': g('hand.r'), 'hand.l': g('hand.l'),
                box3: { min: b.min.toArray().map(n), max: b.max.toArray().map(n) } };
  }
  return res;
}

out.rigs.OrcBrute = await probe(OB + 'OrcBrute.glb',
  ['Melee_Blocking', 'Melee_2H_Idle', 'Melee_1H_Idle', 'Idle_A', 'Melee_2H_Attack_Chop']
    .filter((x) => clips.some((c) => c.name === x)));
out.rigs.Monstrosity = await probe(MO + 'Monstrosity.glb',
  ['Melee_Blocking', 'Melee_2H_Idle', 'Melee_1H_Idle', 'Idle_A']
    .filter((x) => clips.some((c) => c.name === x)));

document.getElementById('out').textContent = JSON.stringify(out, null, 1);
window.__probe = out;
</script>
