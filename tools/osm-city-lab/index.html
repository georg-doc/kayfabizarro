<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KFB OSM City Lab · Köln-Ehrenfeld v0</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#251f2f;background:#eadfcd}
*{box-sizing:border-box}body{margin:0}.app{height:100vh;display:grid;grid-template-rows:auto 1fr auto}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:#2d2638;color:#fff;border-bottom:4px solid #d7a83d}
.brand{font-weight:800;letter-spacing:.02em}.pill{font-size:12px;padding:5px 8px;border:1px solid #8c829c;border-radius:99px}.bar button{border:1px solid #d8cedf;background:#f5eee5;color:#2b2631;padding:7px 10px;border-radius:8px;cursor:pointer}
.stage{position:relative;min-height:0}canvas{display:block;width:100%;height:100%}.panel{position:absolute;left:14px;bottom:14px;max-width:min(540px,calc(100% - 28px));background:#f7f0e6e8;border:1px solid #5c5265;border-radius:12px;padding:10px 12px;backdrop-filter:blur(8px)}
.panel strong{display:block;margin-bottom:3px}.small{font-size:12px;line-height:1.4;color:#544c58}
.foot{padding:8px 16px;background:#2d2638;color:#ddd;font-size:11px}.foot a{color:#f3cf69}
@media(max-width:700px){.bar{gap:7px}.pill{display:none}}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body><main class="app">
<header class="bar"><span class="brand">KFB OSM CITY LAB · EHRENFELD v0</span><span class="pill">S0 DATA</span><span class="pill">S1 LOW-POLY</span><span class="pill">S2 EXPORT CONTRACT</span><button data-camera="top">TOP</button><button data-camera="oblique">OBLIQUE</button><button data-camera="street">STREET</button></header>
<section class="stage"><canvas id="view"></canvas><aside class="panel"><strong id="status">Loading cached OSM…</strong><div id="diag" class="small"></div><div class="small">Viewer only. Walk / Drive remains owned by the named Travel + Free-Roam receiver.</div></aside></section>
<footer class="foot">Map data © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>, ODbL 1.0 · no raster tiles used as geometry.</footer>
</main><script type="module" src="./src/viewer/app.js"></script></body></html>
