<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#cfccc4;color:#1f2022;font:13px/1.45 'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#7a4d0d}a:hover{color:#b8781c}
canvas{display:block}
button,select{font:inherit}
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.184.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.184.0/examples/jsm/"}}
</script>
<script type="module">
import { bootGates } from './lab-sky/sky-gates.v1.js?r=1';
window.__KFB_SKY1 = { bootGates };
window.dispatchEvent(new Event('kfbSky1Ready'));
</script>
</helmet>

<div style="display:grid;grid-template-rows:50px minmax(0,1fr);grid-template-columns:minmax(0,1fr) 360px;height:100vh">
  <header style="grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:0 10px 0 0;background:#efece6;border-bottom:1px solid #c9c5bc;overflow:hidden;min-width:0">
    <div style="flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin">
      <div style="font:600 12px/1 'IBM Plex Mono',monospace;margin:0 2px 0 12px;color:#5c6065;letter-spacing:.04em;white-space:nowrap">SKY1</div>
      <div style="font-weight:600;font-size:13px;white-space:nowrap">Skydome + Environment · Gates E0–E3</div>
      <div style="width:1px;height:20px;background:#c9c5bc;flex:none"></div>
      <div title="Gate" style="display:flex;gap:2px;padding:2px;background:#e3e0d9;border-radius:8px;flex:none">
        <sc-for list="{{ gates }}" as="b" hint-placeholder-count="4">
          <button onClick="{{ b.pick }}" title="{{ b.title }}" style="height:26px;border:0;border-radius:6px;padding:0 10px;cursor:pointer;font:500 12px/1 'Space Grotesk',sans-serif;white-space:nowrap;background:{{ b.bg }};color:{{ b.fg }};box-shadow:{{ b.sh }}">{{ b.label }}</button>
        </sc-for>
      </div>
      <div title="Tageszeit (ein Schreiber: day-night.js)" style="display:flex;gap:2px;padding:2px;background:#e3e0d9;border-radius:8px;flex:none">
        <sc-for list="{{ times }}" as="b" hint-placeholder-count="4">
          <button onClick="{{ b.pick }}" style="height:26px;border:0;border-radius:6px;padding:0 9px;cursor:pointer;font:500 12px/1 'Space Grotesk',sans-serif;white-space:nowrap;background:{{ b.bg }};color:{{ b.fg }};box-shadow:{{ b.sh }}">{{ b.label }}</button>
        </sc-for>
      </div>
      <div title="Wetter" style="display:flex;gap:2px;padding:2px;background:#e3e0d9;border-radius:8px;flex:none">
        <sc-for list="{{ weathers }}" as="b" hint-placeholder-count="2">
          <button onClick="{{ b.pick }}" style="height:26px;border:0;border-radius:6px;padding:0 9px;cursor:pointer;font:500 12px/1 'Space Grotesk',sans-serif;white-space:nowrap;background:{{ b.bg }};color:{{ b.fg }};box-shadow:{{ b.sh }}">{{ b.label }}</button>
        </sc-for>
      </div>
      <div title="Aktive Himmelsschale (genau eine)" style="display:flex;gap:2px;padding:2px;background:#e3e0d9;border-radius:8px;flex:none">
        <sc-for list="{{ shells }}" as="b" hint-placeholder-count="3">
          <button onClick="{{ b.pick }}" style="height:26px;border:0;border-radius:6px;padding:0 9px;cursor:pointer;font:500 12px/1 'Space Grotesk',sans-serif;white-space:nowrap;background:{{ b.bg }};color:{{ b.fg }};box-shadow:{{ b.sh }}">{{ b.label }}</button>
        </sc-for>
      </div>
      <div title="Weltstimmung (Farbton-Versatz des Himmels)" style="display:flex;gap:2px;padding:2px;background:#e3e0d9;border-radius:8px;flex:none">
        <sc-for list="{{ moods }}" as="b" hint-placeholder-count="4">
          <button onClick="{{ b.pick }}" style="height:26px;border:0;border-radius:6px;padding:0 9px;cursor:pointer;font:500 12px/1 'Space Grotesk',sans-serif;white-space:nowrap;background:{{ b.bg }};color:{{ b.fg }};box-shadow:{{ b.sh }}">{{ b.label }}</button>
        </sc-for>
      </div>
    </div>
    <a href="KFB Hex-Kosmos HX1 Sky.dc.html" style="flex:none;height:30px;padding:0 12px;display:flex;align-items:center;background:#1f2022;color:#f6f4ef;border-radius:6px;text-decoration:none;font:500 12px/1 'Space Grotesk',sans-serif;white-space:nowrap">E4 · HX1 integriert →</a>
  </header>

  <div style="position:relative;min-width:0;min-height:0;background:#dedbd4">
    <div ref="{{ boxRef }}" style="position:absolute;inset:0"></div>
    <div style="position:absolute;left:10px;top:10px;z-index:5;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 20px);pointer-events:none">
      <sc-for list="{{ chips }}" as="c" hint-placeholder-count="5">
        <div title="{{ c.title }}" style="display:flex;align-items:center;gap:5px;height:24px;padding:0 8px;font:11px/1 'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;border-radius:6px;white-space:nowrap;pointer-events:auto;background:{{ c.bg }};border:1px solid {{ c.line }};color:{{ c.fg }}">
          <span style="opacity:.75">{{ c.k }}</span><span>{{ c.v }}</span>
        </div>
      </sc-for>
    </div>
    <div style="position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center;background:#1f2022;color:#f6f4ef;border-radius:10px;padding:6px;box-shadow:0 6px 24px rgba(31,32,34,.18);max-width:94%">
      <sc-for list="{{ tools }}" as="b" hint-placeholder-count="6">
        <button onClick="{{ b.pick }}" title="{{ b.title }}" style="height:28px;padding:0 10px;border-radius:6px;cursor:pointer;font:500 12px/1 'Space Grotesk',sans-serif;white-space:nowrap;border:1px solid {{ b.line }};background:{{ b.bg }};color:{{ b.fg }}">{{ b.label }}</button>
      </sc-for>
    </div>
    <sc-if value="{{ busy }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#dedbd4e6;pointer-events:none">
        <div style="font:600 12px/1 'IBM Plex Mono',monospace;color:#5c6065;letter-spacing:.04em">SKY1</div>
        <div style="font:12px/1.4 'IBM Plex Mono',monospace;color:#1f2022">{{ busyText }}</div>
      </div>
    </sc-if>
  </div>

  <aside style="border-left:1px solid #c9c5bc;background:#efece6;overflow:auto;padding:0 0 24px;min-width:0">
    <sc-for list="{{ sections }}" as="s" hint-placeholder-count="4">
      <details open="{{ s.open }}" style="border-bottom:1px solid #dedbd4">
        <summary style="font:600 11px/1 'Space Grotesk',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#5c6065;padding:12px 14px;cursor:pointer">{{ s.title }}</summary>
        <div style="padding:0 14px 14px;display:flex;flex-direction:column;gap:6px">
          <div>
            <sc-for list="{{ s.rows }}" as="kv" hint-placeholder-count="3">
              <div style="display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid #dedbd4;font:11px/1.45 'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums">
                <span style="color:#5c6065;flex:none">{{ kv.k }}</span><span style="text-align:right;word-break:break-word;color:{{ kv.c }}">{{ kv.v }}</span>
              </div>
            </sc-for>
          </div>
          <sc-if value="{{ s.text }}" hint-placeholder-val="{{ false }}"><div style="font:11px/1.5 'IBM Plex Mono',monospace;color:#1f2022;background:#f6f4ef;border:1px solid #c9c5bc;border-radius:6px;padding:7px 9px;white-space:pre-wrap;word-break:break-word">{{ s.text }}</div></sc-if>
        </div>
      </details>
    </sc-for>
  </aside>
</div>

</x-dc>

</script>
