      if (toys.live.size) field.update({ x: xc(z - 14), z: z - 14 }) } const r = toys.report(); log.maxAwake = Math.max(log.maxAwake, r.awake); log.maxBodies = Math.max(log.maxBodies, r.bodies); carMesh.position.set(car.x, car.y, car.z); carMesh.rotation.y = car.yaw }
  // --- look switch: style=pencil|water|paint puts the website's style pass (own code, post2.js) over the finished picture ---
  const STYLE = Q.get('style'), post = STYLE && STYLE !== '0' ? (await import('./post2.js')).createPost(THREE, R) : null, stage = { pencil: 1, water: 2, paint: 3 }[STYLE] || 3
  if (post) { post.u.fin.bg.value.set(1e5, 2e5); post.u.fin.expo.value = +(Q.get('expo') ?? 1.15); post.u.fin.vig.value = 0.16; post.u.ao.limit.value = 400; post.u.ao.reach.value = 1.4; if (Q.get('lens') !== '1') post.u.focus.most.value = 0; if (Q.get('ink') === '0') post.u.fin.ink.value = 0 }

    const c = Q.get('cam') || (PHYS ? 'car' : 'chase'), fx = Math.sin(car.yaw), fz = Math.cos(car.yaw); if (Q.get('p')) { const p = Q.get('p').split(',').map(Number), l = Q.get('l').split(',').map(Number), [px, pz] = side(p[2], p[0]), [lx, lz] = side(l[2], l[0]); cam.position.set(px, roadY(p[2]) + p[1], pz); cam.lookAt(lx, roadY(l[2]) + l[1], lz) }
    else if (c === 'car') { const [bk, up, sd] = (Q.get('rig') || '11,5,0').split(',').map(Number); cam.position.set(car.x - fx * bk + fz * sd, car.y + up, car.z - fz * bk - fx * sd); cam.lookAt(car.x + fx * 7, car.y + 1.2, car.z + fz * 7) }
    else if (c === 'high') { cam.position.set(xc(z) + 26, roadY(z) + 30, z + 34); cam.lookAt(xc(z - 22), roadY(z), z - 22) } else if (c === 'side') { cam.position.set(xc(z - 8) + 9.5, roadY(z) + 1.5, z - 2); cam.lookAt(xc(z - 16) - 1, roadY(z) + 0.4, z - 16) } else { cam.position.set(xc(z), roadY(z) + 2.3, z); cam.lookAt(xc(z - 18), roadY(z - 18) + 1.0, z - 18) }
    K.update(1 / 24, { scene: S, camera: cam }); if (post) post.render(S, cam, t, { steps: [0, 1, 2, 3].map((i) => ({ at: cam.position, t0: i < stage ? -1e5 : 1e9, speed: 1 })), focus: 14 }); else R.render(S, cam)
    const rep = world.report(); info.t = t; info.metresDriven = Math.round(-z); info.tilesSewnSinceLast = rep.sewn - sewnBefore; sewnBefore = rep.sewn; info.report = rep; info.props = field.report(); info.drawCalls = R.info.render.calls; info.frameTris = R.info.render.triangles; if (toys) { info.toys = toys.report(); info.log = log; info.bend = bend?.info(); if (link) { info.port = { ...link.stats, lossAsked: +link.stats.lossAsked.toFixed(2), host: port.log, vehicle: PROFILE.vehicleId, speed } } } document.title = 'OK ' + JSON.stringify(info) }
  { const S2 = new THREE.Scene(); S2.add(K.group); cam.position.set(0, 3, 0); for (let i = 0; i < 200; i++) { K.update(1 / 20, { scene: S2, camera: cam }); R.render(S2, cam); await new Promise((r) => setTimeout(r, 25)); if (i > 30 && K.ready()) break } S.add(K.group) }
  if (Q.get('from')) simT = +Q.get('from')
  window.setTime(+(Q.get('from') ?? 0))
  if (Q.get('ts')) { const series = []; for (const t of Q.get('ts').split(',').map(Number)) { const t0 = realNow(); window.setTime(t); series.push({ t, sewn: info.tilesSewnSinceLast, ms: Math.round(realNow() - t0), calls: info.drawCalls, tris: info.frameTris }) } document.title = 'OK ' + JSON.stringify({ series, last: info.report, toys: info.toys, log: info.log, bend: info.bend }) }
