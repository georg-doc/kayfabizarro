function loader() { const ld = new GLTFLoader(); ld.setMeshoptDecoder(MeshoptDecoder); return ld; }

async function loadFB() {

  return { root, height: b.max.y - b.min.y, ruhe, stale };
}
/* eine Figur, zwei Knete-Varianten auf der Haut: je Variante eigene Materialien, Umschalten per Materialtausch (gleiche Geometrie, gleiche Pose) */
async function fbVariants() {
  const fb = await loadFB(), root = fb.root, orig = new Map(); root.traverse((o) => { if (o.isMesh) orig.set(o, o.material); });

    const h = CLAY[v](root, THREE, { profile: 'character', seed: 'frizzlebob', scaleRef: fb.height, skip: (o) => !(o.isMesh && SKIN.test(orig.get(o)?.name || o.material?.name || '')) });
    h.uniforms.uClayMottle.value = 0;   // Marmorierung steckt in der Datei-Textur
    handles[v] = h;
    const m = new Map(); root.traverse((o) => { if (o.isMesh && o.material !== orig.get(o)) { o.material.normalMap = null; o.material.needsUpdate = true; m.set(o, o.material); delete o.userData.kfbClayOrig; } });
    sets[v] = m; info[v] = { haut: h.meshes.length, version: [...m.values()][0]?.userData.kfbClay.version };

  const g5 = {}; for (const v of ['v11', 'v13']) { use(v); let skin = 0, clay = 0; root.traverse((o) => { if (o.isMesh && SKIN.test(orig.get(o).name || '')) { skin++; if (o.material.userData.kfbClay?.version === (v === 'v13' ? V13 : 'kfb-clay.v1.1')) clay++; } }); g5[v] = { skin, clay, ok: skin > 0 && skin === clay }; }

async function felsVariants() {

  const sc = 2.4 / Math.max(s.y, 1e-6); root.scale.setScalar(sc); root.updateMatrixWorld(true); b = new THREE.Box3().setFromObject(root, true); // Fels ~2,4 m hoch (grosser Felsblock am Weg)
  root.position.set(-(b.min.x + b.max.x) / 2, -b.min.y - 0.05, -(b.min.z + b.max.z) / 2); root.updateMatrixWorld(true);
  const orig = new Map(); root.traverse((o) => { if (o.isMesh) orig.set(o, o.material); });
  const sets = {}, handles = {}; for (const v of ['v11', 'v13']) { for (const [o, m] of orig) o.material = m; handles[v] = CLAY[v](root, THREE, { profile: 'midground', seed: 'kfb_stone_felsen', scaleRef: K.FIG_H }); const m = new Map(); root.traverse((o) => { if (o.isMesh && o.material !== orig.get(o)) { m.set(o, o.material); delete o.userData.kfbClayOrig; } }); sets[v] = m; }

function label(ctx, x, y, text, sz = 26) { ctx.font = `600 ${sz}px system-ui, sans-serif`; ctx.textBaseline = 'top'; ctx.fillStyle = 'rgba(0,0,0,0.6)'; const w = ctx.measureText(text).width; ctx.fillRect(x, y, w + 24, sz + 16); ctx.fillStyle = '#fff'; ctx.fillText(text, x + 12, y + 8); }
async function refCrop(file, crop, w, h) {

  const c = document.createElement('canvas'); c.width = w; c.height = h; const ctx = c.getContext('2d');
  const [x, y, cw, ch] = crop, s = Math.max(w / cw, h / ch), dw = cw * s, dh = ch * s;

/* heller Saum (LIGHT_MODEL_R2 L-3): mittlere Helligkeit der Ringe 1..8 px innerhalb der Silhouette bei 1920x1080; Saum = Ringe aussen heller als Ring 6-8 */
function saum(img, mask) {
  const W = img.w, H = img.h, inside = new Uint8Array(W * H); for (let i = 0; i < W * H; i++) inside[i] = mask.data[i * 4] > 127 ? 1 : 0;
  let cur = inside.slice(); const rings = [];
  for (let k = 1; k <= 8; k++) { const nx = cur.slice(); let sum = 0, cnt = 0;
    for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) { const i = y * W + x; if (!cur[i]) continue; if (!cur[i - 1] || !cur[i + 1] || !cur[i - W] || !cur[i + W]) { nx[i] = 0; const p = i * 4; sum += 0.2126 * img.data[p] + 0.7152 * img.data[p + 1] + 0.0722 * img.data[p + 2]; cnt++; } }

}

  const head = FB.root.getObjectByName('CharacterTemplate_Head'), hb = new THREE.Box3().setFromObject(head, true), hc = hb.getCenter(new THREE.Vector3()), hs = hb.getSize(new THREE.Vector3()), d = Math.max(hs.x, hs.y) * 2.0;

  const [a2, b2] = shot(stage, FB.use, camFull);

/* ---------- Textur-Test (16.11., Georgs Frage nach fertigen Knete-Texturen): Normal-Karte triplanar im Objektraum statt prozeduralem Relief.
   Basis = kfb-clay v1.1 mit Relief aus (Farbe, Rauheit, Rig unveraendert), dazu die Karte. Nur Test im Harness, kein Kanon. ---------- */
const TRI_DECL = /* glsl */`
uniform sampler2D uTexMap; uniform float uTexT, uTexK, uTexOn;
vec3 kfbTri( vec3 p, vec3 N ) {
  vec3 w = pow( abs( N ), vec3( 4.0 ) ); w /= ( w.x + w.y + w.z );
  vec3 tx = texture2D( uTexMap, p.zy / uTexT ).xyz * 2.0 - 1.0, ty = texture2D( uTexMap, p.xz / uTexT ).xyz * 2.0 - 1.0, tz = texture2D( uTexMap, p.xy / uTexT ).xyz * 2.0 - 1.0;
  tx.xy *= uTexK; ty.xy *= uTexK; tz.xy *= uTexK;
  tx = vec3( tx.xy + N.zy, abs( tx.z ) * N.x ); ty = vec3( ty.xy + N.xz, abs( ty.z ) * N.y ); tz = vec3( tz.xy + N.xy, abs( tz.z ) * N.z );
  return normalize( tx.zyx * w.x + ty.xzy * w.y + tz.xyz * w.z );
}
`;
const TRI_MAIN = /* glsl */`
if ( uTexOn > 0.5 ) { vec3 triN0 = normalize( vClayN ); vec3 triN = kfbTri( vClayP, triN0 );
  vec3 triDV = normalize( vClayNM * triN ) - normalize( vClayNM * triN0 );
  #ifdef DOUBLE_SIDED
    triDV *= faceDirection;
  #endif
  normal = normalize( normal + triDV ); }
`;

const TEX = { Clay001: '/tex/Clay001/Clay001_1K-JPG_NormalGL.jpg', Clay003: '/tex/Clay003/Clay003_1K-JPG_NormalGL.jpg', Clay005: '/tex/Clay005/Clay005_1K-JPG_NormalGL.jpg',
  Clay007: '/tex/Clay007/Clay007_1K-JPG_NormalGL.jpg', Clay009: '/tex/Clay009/Clay009_1K-JPG_NormalGL.jpg', patterned_clay_plaster: '/tex/pcp/nor_gl.jpg', Ground026: '/tex/Ground026/Ground026_1K-JPG_NormalGL.jpg' };

  const camFace = K.camera(w, h, 30, [hc.x + 0.18 * d, hc.y - 0.02 * d, hc.z + d], [hc.x, hc.y - 0.12 * hs.y, hc.z]);
