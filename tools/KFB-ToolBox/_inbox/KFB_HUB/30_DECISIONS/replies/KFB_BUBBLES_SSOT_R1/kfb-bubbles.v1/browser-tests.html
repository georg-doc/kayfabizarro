<!doctype html><html lang="de"><meta charset="utf-8"><title>KFB bubbles · browser tests</title><style>body{font:16px system-ui,sans-serif;color:#1f1a14;background:#eee9df;margin:20px}button{font:inherit;padding:8px}pre{white-space:pre-wrap}iframe{display:block;border:1px solid #777;height:760px;margin:14px 0}#host{width:640px;height:420px;position:relative;background:#d0b890;overflow:hidden}#fallback{height:100px}#status{font-weight:700}</style>
<h1>KFB bubbles · browser checks</h1><button id="run">Prüfen</button><p id="status">Bereit</p><pre id="results"></pre><div id="host"></div><iframe id="single" title="Einzeldatei im schmalen Viewport" src="./demo.single.html"></iframe><iframe id="fallback" title="Schrift-Fallback"></iframe>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';import * as B from './kfb-bubbles.mjs';
const results=[],out=document.getElementById('results'),status=document.getElementById('status'),frame=document.getElementById('single');
const assert=(ok,msg)=>{if(!ok)throw Error(msg);};
const tick=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
const until=async fn=>{const start=performance.now();while(!fn()){if(performance.now()-start>7000)throw Error('Readiness timeout');await new Promise(r=>setTimeout(r,30));}};
function pass(name,detail){results.push({name,status:'PASS',detail});out.textContent=JSON.stringify(results,null,2);}
window.addEventListener('error',e=>{status.textContent='ERROR: '+e.message;});
document.getElementById('run').onclick=async()=>{results.length=0;status.textContent='Prüfung läuft';try{
 await B.loadFonts();assert(document.fonts.check('400 16px "Shantell Sans"'),'Shantell not loaded');assert(document.fonts.check('400 24px Bangers'),'Bangers not loaded');pass('local OFL fonts',document.fonts.status);
 await until(()=>frame.contentDocument?.body?.dataset.ready==='true');const d=frame.contentDocument,el=id=>d.getElementById(id),stages=()=>[...d.querySelectorAll('#decoded .w')].map(n=>Number(n.dataset.stage));
 el('reset').click();assert(d.querySelectorAll('#decoded .w.g').length===2,'expected two keys');assert(d.querySelectorAll('#decoded .w.f').length>0,'non-key content must be Fluff');assert([...d.querySelectorAll('#decoded .w')].filter(n=>n.dataset.role!=='content').every(n=>n.dataset.stage==='2'),'protected roles coded');
 for(const sp of d.querySelectorAll('#decoded .w.g')){const glyph=sp.querySelector('i').textContent,c=sp.dataset.src.replace(/[^a-z]/gi,'').length;assert(glyph.length===(c<=6?1:2),'glyph count');assert(glyph.length===1||glyph[0]!==glyph[1],'adjacent duplicate');assert(Math.abs(sp.getBoundingClientRect().width-Number(sp.dataset.reservedWidth))<.1,'word advance mismatch');assert(getComputedStyle(sp.querySelector('i')).fontSize===getComputedStyle(sp).fontSize,'font-size enlarged instead of transform');}
 const glyphHeight=el('decoded').getBoundingClientRect().height;pass('initial R10.1 roles and glyph fit',{keys:2,height:glyphHeight});
 el('encounter').click();assert(d.querySelectorAll('#decoded .w.g').length===2,'first encounter must keep keys coded');el('encounter').click();assert(!d.querySelector('#decoded .w.g'),'two encounters must become Fluff');assert(el('decoded').getBoundingClientRect().height===glyphHeight,'glyph changed line height');pass('two encounters -> Fluff, stable line height',glyphHeight);
 el('own').click();assert(stages().every(s=>s===2),'owned card not fully plain');pass('owned card -> plaintext');el('reset').click();el('bundle').click();assert(stages().every(s=>s===2),'three-card bundle did not unlock');pass('three other cards -> plaintext');
 el('reset').click();el('assist').click();el('encounter').click();el('encounter').click();assert(stages().every(s=>s===2),'assist not plain');el('assist').click();assert(!d.querySelector('#decoded .w.g'),'assist stopped encounter progression');pass('assist view keeps host encounter progress');
 el('story').click();el('time').value='0';el('time').dispatchEvent(new Event('input'));el('light').value='0';el('light').dispatchEvent(new Event('input'));assert(parseFloat(el('paper-status').textContent.split('Kontrast ')[1])>=7,'paper contrast low');pass('pastel/night/dark contrast',el('paper-status').textContent);
 for(const width of [375,768,1280]){frame.style.width=width+'px';await tick();assert(d.documentElement.scrollWidth<=d.documentElement.clientWidth,'horizontal document overflow '+width);assert(d.querySelectorAll('[data-kind]').length===8,'lost kind');assert(d.querySelectorAll('[data-word-class]').length===4,'lost word class');pass('single-file viewport '+width,{scrollWidth:d.documentElement.scrollWidth,clientWidth:d.documentElement.clientWidth});}
 const resources=frame.contentWindow.performance.getEntriesByType('resource').filter(r=>!r.name.startsWith('data:'));assert(resources.length===0,'single file made external requests');pass('single-file zero external requests',resources.length);
 const host=document.getElementById('host'),camera=new THREE.PerspectiveCamera(50,640/420,.1,100);camera.position.set(0,0,10);camera.lookAt(0,0,0);camera.updateMatrixWorld();let x=0;const actor={id:'test-anchor',headWorld:()=>new THREE.Vector3(x,0,0)};
 const plain='The Ordinary World: ox dye pie cab dig try fry mix beg buy pay run go.',bubbleHost=B.create({host,maxPx:190,cards:[{id:'test',text:plain}]});
 let b=bubbleHost.say(actor,[plain],'#6b57a1');bubbleHost.update(.8,{camera});assert(b.rows.length>1,'narrow fixture did not wrap');assert(b.rows.every(row=>row.scrollWidth<=row.clientWidth+1),'Fluff overflows core row');assert(b.el.dataset.paper===B.PAPER,'host paper not white');assert(!getComputedStyle(b.rows[0].parentElement).fontFamily.includes('cursive'),'unsafe fallback');
 assert(b.rows.flatMap(row=>[...row.querySelectorAll('.w')]).map(n=>n.dataset.src).join(' ')===plain,'host remap lost words');const initial={rect:{...b.rect},height:b.L.h,rows:b.rows.length},t=b.el.style.transform;
 x=1.2;bubbleHost.update(.016,{camera});assert(b.el.style.transform!==t,'3D head projection did not move');assert(b.rect.x>=12&&b.rect.y>=12,'bubble outside host pads');
 bubbleHost.setLanguageState({owned:{test:true}});bubbleHost.update(0,{camera});assert(b.L.h===initial.height,'unlock changed bubble height');assert(b.rows.every(row=>row.scrollWidth<=row.clientWidth+1),'plain overflows core row');assert(b.rows.every(row=>[...row.querySelectorAll('.w')].every(n=>n.dataset.stage==='2')),'host did not unlock');
 bubbleHost.setPaper({storyMode:true,tint:'#0000ff',light:0,timeOfDay:0});bubbleHost.update(0,{camera});assert(B.contrast(b.el.dataset.paper)>=7,'host pastel contrast');pass('original Wireface host with Three '+THREE.REVISION,{...initial,shiftedRect:b.rect,paper:b.el.dataset.paper,contrast:B.contrast(b.el.dataset.paper)});
 const fallback=document.getElementById('fallback'),base=new URL('.',location.href).href;
 fallback.srcdoc='<body style="font:18px system-ui,sans-serif"><p id="fallback-result">Lädt</p><script src="'+base+'chatterbox-core.js"><\/script><script src="'+base+'fluffolect-r101.js"><\/script><script src="'+base+'kfb-bubbles.classic.js"><\/script><script>KFB_BUBBLES.loadFonts({baseUrl:new URL("missing-fonts/",document.baseURI).href,timeoutMs:200}).then(()=>{document.body.style.fontFamily=KFB_BUBBLES.BODY_FONT;KFB_BUBBLES.renderWords(document.getElementById("fallback-result"),"Dory does not give us 42 engines.",{assist:true});document.body.dataset.ready="true";});<\/script>';
 await until(()=>fallback.contentDocument?.body?.dataset.ready==='true');const f=fallback.contentDocument;assert(!getComputedStyle(f.body).fontFamily.includes('cursive'),'fallback contains cursive');assert(f.getElementById('fallback-result').textContent==='Dory does not give us 42 engines.','fallback lost readable text');pass('fonts unavailable -> readable safe fallback',getComputedStyle(f.body).fontFamily);
 frame.style.width='375px';el('reset').click();status.textContent='PASS · '+results.length+' Browser-Prüfungen';document.body.dataset.result='PASS';document.body.dataset.count=String(results.length);
 }catch(e){results.push({status:'FAIL',error:e.message});out.textContent=JSON.stringify(results,null,2);status.textContent='FAIL · '+e.message;document.body.dataset.result='FAIL';}};
</script></html>
