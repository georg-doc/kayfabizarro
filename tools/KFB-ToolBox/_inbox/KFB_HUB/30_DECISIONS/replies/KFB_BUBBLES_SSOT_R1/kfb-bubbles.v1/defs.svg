<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true"><defs>
      <filter id="kfbClayEdge" filterUnits="userSpaceOnUse" x="-200" y="-200" width="3000" height="3000">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="1" seed="4" result="n"></feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.8" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
      </filter>
      <filter id="kfbClayBevel" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceAlpha" stdDeviation="3.4" result="b"></feGaussianBlur>
        <feDiffuseLighting in="b" surfaceScale="4" diffuseConstant="1.18" lighting-color="#ffffff" result="df"><feDistantLight azimuth="225" elevation="52"></feDistantLight></feDiffuseLighting>
        <feComposite in="df" in2="SourceAlpha" operator="in" result="dfc"></feComposite>
        <feBlend in="SourceGraphic" in2="dfc" mode="multiply" result="lit"></feBlend>
        <feSpecularLighting in="b" surfaceScale="4" specularConstant=".5" specularExponent="22" lighting-color="#fff6e6" result="sp"><feDistantLight azimuth="225" elevation="40"></feDistantLight></feSpecularLighting>
        <feComposite in="sp" in2="SourceAlpha" operator="in" result="spc"></feComposite>
        <feComposite in="spc" in2="lit" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"></feComposite>
      </filter>
      <linearGradient id="kfbFaceShade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".34"></stop><stop offset=".48" stop-color="#ffffff" stop-opacity="0"></stop><stop offset="1" stop-color="#2a1a0c" stop-opacity=".14"></stop></linearGradient>
      <linearGradient id="kfbWallShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000000" stop-opacity="0"></stop><stop offset="1" stop-color="#1a0f05" stop-opacity=".32"></stop></linearGradient>
      <filter id="kfbSoftShadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"></feGaussianBlur></filter>
      <pattern id="kfbDotsWarm" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.3" fill="#b38a55"></circle></pattern>
      <pattern id="kfbDotsDeep" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.8" fill="#8f2416"></circle></pattern>
      <pattern id="kfbDotsPink" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.7" fill="#e86bb7"></circle></pattern>
      <pattern id="kfbDotsViolet" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.8" fill="#43247f"></circle></pattern>
      <radialGradient id="kfbFade" cx="0.8" cy="0.86" r="0.8"><stop offset="0" stop-color="#ffffff"></stop><stop offset="1" stop-color="#000000"></stop></radialGradient>
      <mask id="kfbCornerMask" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="url(#kfbFade)"></rect></mask>
    </defs></svg>
