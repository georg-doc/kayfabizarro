const SCHUB = -0.42, C = new THREE.Vector3(0, BUCH_Y + 0.529, 0), CP = new THREE.Vector3(0, BUCH_Y + 0.529 + 0.32, 0)

const SHOTS = [['0 Machine', 0], ['1 Hero', 1.6], ['2 Turn', 4.8], ['3 Back', 8.4], ['4 Unfold', 9.6], ['5 Panorama', 15.65], ['6 Packshot', 17.0]].map(([id, t0], i, a) => ({ id, t: [t0, a[i + 1]?.[1] ?? LAENGE] }))

// Staub im Licht: feine Teilchen treiben langsam, sichtbar nur im Kegel des Hauptlichts (ein physikalisches Modell, keine Effekt-Sprites)
const STAUB_N = 420, staubPos = new Float32Array(STAUB_N * 3), staubSaat = []
for (let i = 0; i < STAUB_N; i++) { const r = (k) => { const x = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return x - Math.floor(x) }; staubSaat.push([r(1) * 3.6 - 1.4, r(2) * 2.2 - 0.6, r(3) * 1.6 - 1.0, r(4) * 6.28, 0.3 + r(5) * 0.7]) }

function staubSetzen(T) { for (let i = 0; i < STAUB_N; i++) { const [x, y, z, ph, v] = staubSaat[i]; const yy = ((y + T * 0.03 * v + 0.6) % 2.2 + 2.2) % 2.2 - 0.6
    staubPos[i * 3] = x + Math.sin(T * 0.21 * v + ph) * 0.08; staubPos[i * 3 + 1] = C.y + yy; staubPos[i * 3 + 2] = z + Math.cos(T * 0.17 * v + ph) * 0.08 }
  staubGeo.attributes.position.needsUpdate = true; staubMat.uniforms.uLicht.value.copy(key.position); staubMat.uniforms.uRicht.value.copy(key.target.position).sub(key.position).normalize() }

let T = 0
function setze(Tn) {
  T = Tn; shot.textContent = shotBei(T).id
  // Getriebe: ein Antrieb für alles; der Teller hängt am Getriebe, das Buch steht auf dem Teller und rutscht beim Anlauf und Stopp minimal nach (Trägheit)
  const D = spur(BUCH.antrieb, T) * PI * 2 + T * 0.05
  parts.forEach((p) => { p.pose(D, pos, quat); p.mesh.position.copy(pos); p.mesh.quaternion.copy(quat) })
  const a = spur(BUCH.teller, T), h = 1 / 60, acc = (spur(BUCH.teller, T + h) - 2 * a + spur(BUCH.teller, T - h)) / (h * h)
  scheibe.rotation.y = a; const nach = THREE.MathUtils.clamp(-acc * 0.0035, -0.035, 0.035)
  const hub = 0.32 * sin_io(THREE.MathUtils.clamp((T - HUB_T0) / 0.8, 0, 1)); ausfalten({ umschlag: spur(BUCH.umschlag, T), klappeV: spur(BUCH.klappeV, T), klappeH: spur(BUCH.klappeH, T) })
  const sx = SCHUB * sin_io(THREE.MathUtils.clamp((T - HUB_T0) / 0.8, 0, 1)); buch.position.set(sx, BUCH_Y + hub, 0); buch.quaternion.setFromAxisAngle(UPV, a + nach); buch.updateMatrixWorld(true)
  sockel.position.set(0, SCHEIBE_Y + 0.06, 0); const l = Math.max(0.001, hub + 0.02)
  spindelA.scale.y = Math.max(0.001, l * 0.6); spindelA.position.set(0, SCHEIBE_Y + 0.06 + spindelA.scale.y / 2, 0); spindelB.scale.y = l; spindelB.position.set(0, SCHEIBE_Y + 0.06 + l / 2, 0)
  spindelA.visible = spindelB.visible = hub > 0.005
  schiene.visible = reiter.visible = hub > 0.005; schiene.position.set(SCHUB / 2, SCHEIBE_Y + 0.06 + l + 0.012, 0); reiter.position.set(sx, SCHEIBE_Y + 0.06 + l + 0.03, 0)
  // Scan, Ring, Planeten-Glimmen
  scanU.uScanAchse.value.set(0, 1, 0); scanU.uScanPos.value = C.y + spur(BUCH.scanPos, T); scanU.uScan.value = spur(BUCH.scan, T)
  { const offen = spur(BUCH.umschlag, T), gr = THREE.MathUtils.lerp(2.2, 4.4, offen); halo.position.set(0, C.y + hub, -0.95); halo.scale.set(gr, gr * 0.8, 1); halo.material.opacity = 0.55 * spur(BUCH.halo, T) }

  const B = buch.position
  key.position.copy(B).add(new THREE.Vector3(-2.2, 2.6, 2.8)); key.target.position.copy(B); oben.position.copy(B).add(new THREE.Vector3(0.4, 3.2, 0.8)); oben.target.position.copy(B)
  const kante = Math.abs(Math.cos(a)), f = (0.08 + 0.92 * Math.pow(kante, 3)) * spur(BUCH.rand, T); randL.intensity = 30 * f; randR.intensity = 26 * f
  randL.position.copy(B).add(new THREE.Vector3(-2.4, 1.2, -2.6)); randL.target.position.copy(B); randR.position.copy(B).add(new THREE.Vector3(2.6, 0.9, -2.2)); randR.target.position.copy(B)

const zeichne = () => composer.render()
const kammerBereit = () => Promise.race([Promise.resolve(kammer.bereit).catch(() => null), new Promise((r) => setTimeout(r, 8000))])

function frame(t) { if (live) { setze(((t - uhr0) / 1000) % LAENGE); zeichne() } requestAnimationFrame(frame) }
kammerBereit().then(() => { uhr0 = performance.now(); live = true })
requestAnimationFrame(frame)
const groesse = (w, h) => { renderer.setPixelRatio(1); renderer.setSize(w, h, false); composer.setPixelRatio(1); composer.setSize(w, h); bokeh.setSize?.(w, h); camera.aspect = w / h; camera.updateProjectionMatrix() }
window.__bild = async (Tn, datei, w = 1280, h = 720) => { await kammerBereit(); live = false; groesse(w, h); for (let i = 0; i < 4; i++) kammer.update(1 / 30, {}); setze(Tn); zeichne(); await fetch(`/save?f=${datei}`, { method: 'POST', body: renderer.domElement.toDataURL('image/png') }); return shotBei(Tn).id }

}
