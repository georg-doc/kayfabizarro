<script type="module">
// Buchmaschine R8 (Georg 22.11.): 30-s-Trailer-Loop und Game-Piece in der HyperNorm-Kammer. EIN Rezept (src/data/choreo/buchmaschine_trailer.r3.json) steuert
// Einwurf (Buch fällt zu, Cover oben), Hebel öffnet den Deckel, Klammern spannen, Orrery läuft an, Umbau in drei Gruppen, Hydraulik hängt das Buch,
// Blitz-Kette (Planet lädt → Bogen → Treffer an der Kante → Schälwelle), Relief, Finale, Zerfall auf den Boden, zwei KFB-Karten auf den Stapel, Rückbau,
// Hebel wirft das leere Buch aus. Kamera nach der Kritik R7: halten, halten, schneiden. Zwei KFB-Bots tragen die Karten in den Nachbarraum (Takt wie das Pendel).
// Spielmodus: die Maschine wartet leer, bis ein Buch eingeworfen wird (Taste I); jeder Durchlauf gibt zwei Karten.
// Raum und Grundlicht kommen aus der Kammer (src/scenelets/hnKammer.js). Bühnenlicht dieser Testbühne: Buchlicht, Bodenstreiflicht, Blitzlicht.
import * as THREE from 'three'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'

import { createSchaelen } from '../../src/scenelets/buchmaschine/schaelen.js'

import { createRezeptLauf } from '../../src/core/rezept.js'

import { createTon } from './ton.js'

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight)
renderer.shadowMap.enabled = true; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace
document.body.appendChild(renderer.domElement)
const scene = new THREE.Scene(); scene.background = new THREE.Color('#000000')
const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.05, 200)
const controls = new OrbitControls(camera, renderer.domElement); controls.enabled = false
const composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene, camera))
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.42, 0.45, 0.92); composer.addPass(bloom); composer.addPass(new OutputPass())
const env = verlaufUmgebung(renderer, { sky: '#2a3040', ground: '#0a0a10' })
const BODEN = -0.45, UPV = new THREE.Vector3(0, 1, 0)
const rng = (() => { let s = 20261122; return () => { s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } })()
const sm = (x) => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x) }
const V3 = (a) => new THREE.Vector3(...a)

// Kammer: Bühne liegt im Ursprung der Maschine, Boden auf BODEN; Wandhelligkeit und Puls über die Uniforms der Wand
const kammer = createHnKammer({ THREE, renderer, quellen: [{ url: 'pd_pool_klein/manifest.json', src: 'pd' }, { url: '../../engine/hypernorm/test/daten/help-deck.hn-media.json' }], helligkeit: 0.35, lichter: true, seed: 1966, worker: new URLSearchParams(location.search).get('worker') === 'aus' ? false : 'auto' })
kammer.group.position.set(0, BODEN, -kammer.anker.buehne.z); scene.add(kammer.group)
let wandU = null; kammer.group.traverse((o) => { if (o.material?.uniforms?.uHell) wandU = o.material.uniforms })
const SPOTS = kammer.licht.filter((l) => l.isSpotLight)
SPOTS[2] && (SPOTS[2].intensity *= 0.35); SPOTS[0] && (SPOTS[0].intensity *= 0.3)   // weißes Oberlicht überstrahlt das Papier; blaues Kantenlicht spiegelt sonst als heller Fleck im Boden (Kritik R7)
const SPOT_I = SPOTS.map((s) => s.intensity)
for (const s of SPOTS) { s.target.position.y = 3.0; s.castShadow = true; s.shadow.mapSize.set(1024, 1024); s.shadow.bias = -0.0004 }
// Bühne: Schattenfänger auf dem Boden (Würfel, Karten, Bots), Durchgang zum Nachbarraum in der rechten Wand
const fang = new THREE.Mesh(new THREE.PlaneGeometry(26, 26), new THREE.ShadowMaterial({ opacity: 0.55 })); fang.rotation.x = -Math.PI / 2; fang.position.y = BODEN + 0.003; fang.receiveShadow = true; scene.add(fang)

// Orrery mit Rost-Grundfassung
const ladeBild = (src) => new Promise((ok) => { const im = new Image(); im.onload = () => ok(im); im.src = src })
const texVon = (im, srgb) => { const t = new THREE.Texture(im); t.wrapS = t.wrapT = THREE.RepeatWrapping; if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; t.needsUpdate = true; return t }
const [imD, imA] = await Promise.all([ladeBild('_privat/rost/rost_diff.jpg'), ladeBild('_privat/rost/rost_arm.jpg')])
const ROST = { diff: texVon(imD, true), arm: texVon(imA, false) }
const ROLLEN = { antrieb: { ton: 1.0, grau: 0.0, kante: 0.35 }, traeger: { ton: 0.68, grau: 0.1, kante: 0.3 }, arm: { ton: 1.18, grau: 0.45, kante: 0.4 }, eisen: { ton: 0.8, grau: 0.35, kante: 0.4 }, gummi: null, knauf: { ton: 0.9, grau: 0.0, kante: 0.3 }, stahl: { ton: 1.35, grau: 0.85, kante: 0.7 } }
const { parts, train } = buildParts(makeMaterials(), 5)
const maschine = new THREE.Group(); maschine.name = 'buchmaschine'; scene.add(maschine)
const machine = new THREE.Group(); machine.name = 'orrery'; maschine.add(machine)
const mat = (color, roughness = 0.8) => new THREE.MeshStandardMaterial({ color, roughness, metalness: 0 })
const rolle = new Map()
for (const p of parts) {
  machine.add(p.mesh); p.mesh.castShadow = true
  if (p.id === 'sun') { p.mesh.visible = false; continue }
  let r = null
  if (p.kind === 'gear') r = train.gears.get(p.id).teeth >= 36 ? 'antrieb' : 'gummi'
  else if (p.kind === 'plate') r = 'traeger'
  else if (p.kind === 'bar') r = /Arm$|Bracket$/.test(p.id) ? 'arm' : 'eisen'
  else if (p.id === 'crankKnob') r = 'knauf'
  if (r) { p.mesh.material = mat(r === 'gummi' ? '#262422' : '#8a8580', r === 'gummi' ? 0.95 : 0.8); rolle.set(p.mesh, r) }
  else { const c = p.mesh.material.color?.getHex?.() ?? 0xcccccc; p.mesh.material = mat(c, 0.7) }
}
const SCHEIBE_Y = 4.24
const scheibe = new THREE.Mesh(new THREE.CylinderGeometry(1.05, 1.1, 0.07, 48), mat('#8a8580')); scheibe.castShadow = scheibe.receiveShadow = true
const nabe = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.18, 0.12, 20), mat('#8a8580')); nabe.position.y = -0.08; scheibe.add(nabe)
for (let i = 0; i < 6; i++) { const b = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.03, 8), mat('#8a8580')); const t = i / 6 * Math.PI * 2; b.position.set(Math.cos(t) * 0.9, 0.045, Math.sin(t) * 0.9); scheibe.add(b) }
scheibe.position.y = SCHEIBE_Y; machine.add(scheibe)
for (const m of [scheibe, nabe, ...scheibe.children]) rolle.set(m, m === scheibe ? 'traeger' : 'eisen')

// Hilfsmechanik aus schlichten Grundformen im selben Rost (Kritik/Georg: Funktion statt Ornament): Hebel, zwei Klammern, zwei Hydraulikstempel
const auflage = new THREE.Group(); auflage.name = 'auflage'; scene.add(auflage)   // folgt der Ruhelage des Buchs auf der Scheibe (Buch-Koordinaten)
const teil = (geo, r, farbe = '#8a8580') => { const m = new THREE.Mesh(geo, mat(farbe)); m.castShadow = true; rolle.set(m, r); return m }
const hebel = new THREE.Group(), hebelArm = new THREE.Group(); hebel.add(hebelArm); auflage.add(hebel)
const klammern = [-1, 1].map((sg) => { const g = new THREE.Group(), backe = new THREE.Group(); g.add(backe); auflage.add(g); return { g, backe, sg, zu: 0 } })
const stempel = [-1, 1].map(() => { const rohr = teil(new THREE.CylinderGeometry(0.05, 0.05, 1, 12).translate(0, 0.5, 0), 'eisen'), stange = teil(new THREE.CylinderGeometry(0.022, 0.022, 1, 10).translate(0, 0.5, 0), 'stahl')
  scene.add(rohr, stange); return { rohr, stange, raus: 0 } })
const gruppeVon = (p) => (p.kind === 'gear' ? 0 : p.kind === 'plate' || p.kind === 'bar' ? 1 : 2)

// WSB-Buch r3: zu (Cover oben) ↔ offen über den Clip „oeffnen“; Schälhaut und Voxelrelief derselben Doppelseite erscheinen erst im offenen Buch
const gltf = await new GLTFLoader().loadAsync('_privat/buch/KFB_Buch_Mensch.r3.glb')
const buch = new THREE.Group(); buch.name = 'buch'; scene.add(buch)
const buchInnen = new THREE.Group(); buch.add(buchInnen)
const halter = new THREE.Group(); halter.rotation.x = Math.PI / 2; halter.scale.setScalar(4.6); buchInnen.add(halter); halter.add(gltf.scene)
gltf.scene.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = false; o.frustumCulled = false } })
// R9: die Normal-Map des Umschlags lenkt das Licht falsch (weiße Innenseite wirkt dunkelblau, Cover je nach Drehung dunkel) → für Umschlag außen und innen abgeschaltet
gltf.scene.traverse((o) => { if (o.isMesh) for (const m of [].concat(o.material)) if (/^Buch_Umschlag/.test(m.name) && m.normalMap) { m.normalMap = null; m.needsUpdate = true } })   // kein Schattenempfang: das Cover soll nie im eigenen Schatten verschwinden
const mixer = new THREE.AnimationMixer(gltf.scene), aOffen = mixer.clipAction(gltf.animations.find((c) => c.name === 'offen')); aOffen.play(); mixer.update(0.01); gltf.scene.updateMatrixWorld(true)
const kasten = new THREE.Box3(), inv = new THREE.Matrix4(); buchInnen.updateMatrixWorld(true); inv.copy(buchInnen.matrixWorld).invert()
for (const n of ['Blatt_15', 'Blatt_16']) gltf.scene.getObjectByName(n).traverse((o) => { if (!o.isMesh) return; const pos = o.geometry.attributes.position, v = new THREE.Vector3()
  for (let i = 0; i < pos.count; i += 7) { (o.isSkinnedMesh ? o.getVertexPosition(i, v) : v.fromBufferAttribute(pos, i)); v.applyMatrix4(o.matrixWorld).applyMatrix4(inv); kasten.expandByPoint(v) } })
{ const c = kasten.getCenter(new THREE.Vector3()); halter.position.x -= c.x; halter.position.y -= c.y; kasten.min.x -= c.x; kasten.max.x -= c.x; kasten.min.y -= c.y; kasten.max.y -= c.y }
const BREITE = kasten.max.x - kasten.min.x, HOEHE = kasten.max.y - kasten.min.y, ZOBEN = kasten.max.z
const OEFFNEN = gltf.animations.find((c) => c.name === 'oeffnen'), aAuf = mixer.clipAction(OEFFNEN); aAuf.setLoop(THREE.LoopOnce); aAuf.clampWhenFinished = true
// R9 Buch-Posen aus den WSB-Clips (Georg 22.11.: Cover zeigen, aufklappen, durchblättern): je Knochengruppe ein eigener Fortschritt 0…1.
// Jede Spur wird in ihrem eigenen Bewegungsfenster des Clips abgetastet (deckel_v, klappe_v, Paket p01, Blätter b14 und b15, das Fächern der übrigen Pakete).
// Grundpose ist „zu“; „offen“ = alle Gruppen auf 1 = Endpose von „oeffnen“ (dort liegen Schälhaut und Relief).
aOffen.stop(); { const a = mixer.clipAction(gltf.animations.find((c) => c.name === 'zu')); a.play(); mixer.update(0); a.stop() }
const KN = {}; gltf.scene.traverse((o) => { if (o.isBone) KN[o.name] = o })
function spuren(clipName, passt) {
  const clip = gltf.animations.find((c) => c.name === clipName)
  return clip.tracks.filter((t) => passt(t.name.split('.')[0])).map((t) => { const [knoten, eig] = t.name.split('.'), k = t.getValueSize(), v = t.values, n = t.times.length
    const gleich = (i, j) => { for (let c = 0; c < k; c++) if (Math.abs(v[i * k + c] - v[j * k + c]) > 1e-4) return false; return true }
    let i0 = 0, i1 = n - 1; while (i0 < n - 1 && gleich(i0, i0 + 1)) i0++; while (i1 > 0 && gleich(i1, i1 - 1)) i1--; if (i1 <= i0) { i0 = 0; i1 = n - 1 }
    return { ziel: KN[knoten]?.[eig], ip: t.createInterpolant(), t0: t.times[i0], t1: t.times[i1] } }).filter((s) => s.ziel)
}
const GRUPPEN = { deckel: spuren('oeffnen', (n) => n === 'deckel_v'), faecher: spuren('oeffnen', (n) => /^(p0[2-8]|b1[67])/.test(n)), p01: spuren('oeffnen', (n) => /^p01/.test(n)),
  b14: spuren('oeffnen', (n) => /^b14/.test(n)), b15: spuren('oeffnen', (n) => /^b15/.test(n)), klappe: spuren('klappen_aus', (n) => n === 'klappe_v') }
const pose = { deckel: -1, faecher: -1, p01: -1, b14: -1, b15: -1, klappe: -1 }
function buchPose(soll) { let neu = false
  for (const g in GRUPPEN) { const f = Math.min(1, Math.max(0, soll[g] ?? 0)); if (Math.abs(f - pose[g]) < 1e-4) continue; pose[g] = f; neu = true
    for (const S of GRUPPEN[g]) { const w = S.ip.evaluate(S.t0 + f * (S.t1 - S.t0)); S.ziel.fromArray(w) } }
  if (neu) gltf.scene.updateMatrixWorld(true) }
const buchOffen = () => pose.b15 > 0.999 && pose.deckel > 0.999
buchPose({})
const seitenMat = {}; gltf.scene.traverse((o) => { if (o.isMesh) for (const mt of [].concat(o.material)) if (/^Buch_S0(30|31)$/.test(mt.name)) seitenMat[mt.name] = { mt, map: mt.map } })
const leerSeite = (() => { const c = document.createElement('canvas'); c.width = c.height = 8; const g = c.getContext('2d'); g.fillStyle = '#b9b09c'; g.fillRect(0, 0, 8, 8); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t })()
const geist = (map) => { const im = map?.image; if (!im) return leerSeite; const c = document.createElement('canvas'); c.width = 512; c.height = Math.round(512 * im.height / im.width); const g = c.getContext('2d')
  g.fillStyle = '#c9bfa8'; g.fillRect(0, 0, c.width, c.height); g.globalAlpha = 0.1; g.drawImage(im, 0, 0, c.width, c.height); g.globalAlpha = 1
  const r = g.createRadialGradient(c.width / 2, c.height / 2, c.width * 0.3, c.width / 2, c.height / 2, c.width * 0.75); r.addColorStop(0, 'rgba(60,40,20,0)'); r.addColorStop(1, 'rgba(60,40,20,0.45)'); g.fillStyle = r; g.fillRect(0, 0, c.width, c.height)
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.flipY = map.flipY; return t }
for (const e of Object.values(seitenMat)) e.leer = geist(e.map)
const seitenLeer = (leer) => { for (const { mt, map, leer: l } of Object.values(seitenMat)) { mt.map = leer ? l : map; mt.needsUpdate = true } }   // leere Seite: Papier, ein Hauch der alten Seite, versengter Rand
const bildVon = (nr) => { let im = null; gltf.scene.traverse((o) => { if (o.isMesh) for (const mt of [].concat(o.material)) if (mt.name === 'Buch_S' + String(nr).padStart(3, '0') && mt.map) im = mt.map.image }); return im }
const PW = 660, PH = 920, seite = document.createElement('canvas'); seite.width = 2 * PW; seite.height = PH
{ const g = seite.getContext('2d'); g.fillStyle = '#efe9dc'; g.fillRect(0, 0, 2 * PW, PH); g.drawImage(bildVon(30), 0, 0, PW, PH); g.drawImage(bildVon(31), PW, 0, PW, PH) }
const atlas = new THREE.CanvasTexture(seite); atlas.colorSpace = THREE.SRGBColorSpace; atlas.anisotropy = 8
const haut = createSchaelen({ THREE, atlas, zellen: [1, 1], seiten: 1, breite: BREITE, hoehe: HOEHE, spalten: 24, zeilen: 17, rng, einmalig: true })
haut.unter.visible = false; haut.gruppe.position.z = ZOBEN + 0.004; buchInnen.add(haut.gruppe); scene.add(haut.flocken)
const relief = createBildVoxel({ THREE, bild: seite, breite: BREITE, hoehe: HOEHE, spalten: 80, tiefe: 0.12, rng })
relief.gruppe.position.z = ZOBEN - 0.002; buchInnen.add(relief.gruppe); scene.add(relief.lose)
const buchLicht = new THREE.SpotLight('#ffd9b0', 0, 12, Math.PI / 6, 0.8, 1.2); scene.add(buchLicht, buchLicht.target)
const bodenLicht = new THREE.SpotLight('#ffe2c0', 0, 14, Math.PI / 5, 0.7, 1.4); bodenLicht.castShadow = true; bodenLicht.shadow.mapSize.set(1024, 1024); bodenLicht.shadow.bias = -0.0005; scene.add(bodenLicht, bodenLicht.target)
const blitzLicht = new THREE.PointLight('#cfe0ff', 0, 4, 2); scene.add(blitzLicht)
const stapelLicht = new THREE.SpotLight('#ffd8b0', 0, 12, Math.PI / 6, 0.8, 1.3); scene.add(stapelLicht, stapelLicht.target)   // Bühnenlicht über Kartenstapel und Bot-Weg

// Hebel und Klammern in Buch-Koordinaten bauen (x = Breite, y = Höhe, z = Seitennormale; Rücken bei x = 0; der Arm zeigt in Ruhe nach +x an die Deckelkante)
const HEBEL_Y = -HOEHE / 2 - 0.07, HEBEL_L = BREITE / 2 + 0.06
{ const pfosten = teil(new THREE.CylinderGeometry(0.045, 0.06, 0.16, 12), 'eisen'); pfosten.rotation.x = Math.PI / 2; pfosten.position.set(0, HEBEL_Y, -0.02); hebel.add(pfosten)
  hebel.position.set(0, 0, 0); hebelArm.position.set(0, HEBEL_Y, 0.05)
  const arm = teil(new THREE.BoxGeometry(HEBEL_L, 0.06, 0.05).translate(HEBEL_L / 2, 0, 0), 'arm'); hebelArm.add(arm)
  const finger = teil(new THREE.BoxGeometry(0.05, 0.16, 0.022).translate(0, 0.08, 0), 'stahl'); finger.position.set(HEBEL_L - 0.03, 0.02, -0.01); hebelArm.add(finger)
  const nabeH = teil(new THREE.CylinderGeometry(0.035, 0.035, 0.06, 12), 'stahl'); nabeH.rotation.x = Math.PI / 2; hebelArm.add(nabeH) }
for (const K of klammern) { const x = K.sg * (BREITE / 2 + 0.05)
  const bock = teil(new THREE.BoxGeometry(0.07, 0.22, 0.07), 'eisen'); bock.position.set(x, 0, ZOBEN - 0.02); K.g.add(bock)
  K.backe.position.set(x, 0, ZOBEN + 0.03); const backe = teil(new THREE.BoxGeometry(0.15, 0.16, 0.025).translate(-K.sg * 0.075, 0, 0), 'stahl'); K.backe.add(backe) }
applyClay(machine, THREE, { profile: 'midground', seed: 'buchmaschine-orrery', scaleRef: 1.6 })
applyClay(auflage, THREE, { profile: 'midground', seed: 'buchmaschine-hilfsmechanik', scaleRef: 0.6 })
for (const S of stempel) for (const m of [S.rohr, S.stange]) applyClay(m, THREE, { profile: 'midground', seed: 'buchmaschine-stempel', scaleRef: 0.6 })
// große Scheibe: Rost großflächig und flacher, sonst wirkt sie gekachelt und verrauscht (Georg 22.11.)
for (const [mesh, r] of rolle) { const R = ROLLEN[r]; if (!R) continue; const gross = mesh === scheibe; rostLook(mesh.material, { tex: ROST, lack: null, kante: R.kante, skala: gross ? 0.42 : 1.3, ton: R.ton, grau: R.grau, bump: gross ? 0.2 : 0.5 }); mesh.material.envMap = env; mesh.material.envMapIntensity = r === 'stahl' ? 1.1 : 0.6 }
