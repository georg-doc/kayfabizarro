<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voxelrelief · Gate</title>
<style>html,body{margin:0;height:100%;background:#0d0e11;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/addons/"}}</script></head><body><div style="position:fixed;left:12px;top:10px;color:#dfe3ea;font:13px system-ui;background:#0007;padding:6px 10px;border-radius:8px;z-index:2"><b>Voxel-Relief</b> · Membran schält, Relief wächst, zerfällt, fliegt wieder ein · <a href="index.html" style="color:#ffd9a0">◂ Maschine</a> · <a href="voxel.html" style="color:#ffd9a0">neu starten</a></div>
<script type="module">
// Gate Voxelrelief (Georg 22.11. über WS0): Doppelseite → Membran schält → Relief wächst darunter → Relief zerfällt → Würfel fliegen wieder ein.
// Dunkler Raum, streifendes Licht von der Seite (zeigt die Tiefe), kühles Gegenlicht, wenig Bloom. Licht gehört nur der Probebühne.
import * as THREE from 'three'
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js'
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js'
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js'
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js'
import { createBildVoxel } from './modul/bildVoxel.js'
import { createSchaelen } from './modul/schaelen.js'

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight); renderer.shadowMap.enabled = true
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace
document.body.appendChild(renderer.domElement)
const scene = new THREE.Scene(); scene.background = new THREE.Color('#0d0e11')
const camera = new THREE.PerspectiveCamera(32, 16 / 9, 0.05, 60)
scene.add(new THREE.HemisphereLight('#8090a8', '#1a1612', 0.35))
const streif = new THREE.DirectionalLight('#ffe2c0', 3.2); streif.position.set(-4, 2.2, 2.2); streif.castShadow = true
streif.shadow.mapSize.set(2048, 2048); Object.assign(streif.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 0.5, far: 15 }); streif.shadow.bias = -0.0004; streif.shadow.normalBias = 0.01
scene.add(streif, streif.target)
const gegen = new THREE.DirectionalLight('#8fb0ff', 1.4); gegen.position.set(3, 3, -3); scene.add(gegen)
const vorn = new THREE.DirectionalLight('#ffffff', 0.5); vorn.position.set(0.5, 1.2, 4); scene.add(vorn)
const BODEN = 0
const floor = new THREE.Mesh(new THREE.CircleGeometry(10, 64).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: '#25272b', roughness: 0.95 }))
floor.receiveShadow = true; scene.add(floor)
const composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene, camera))
composer.addPass(new UnrealBloomPass(new THREE.Vector2(1280, 720), 0.35, 0.4, 0.9)); composer.addPass(new OutputPass())

// Doppelseite 28/29 aus den Seitenbildern des WSB-Buchs (BUCH v21, ohne Wasserzeichen)
const lade = (s) => new Promise((ok) => { const im = new Image(); im.onload = () => ok(im); im.src = s })
const [L, R] = await Promise.all([lade('seiten/seite_028.jpg'), lade('seiten/seite_029.jpg')])
const cv = document.createElement('canvas'); cv.width = L.width * 2; cv.height = L.height; const g = cv.getContext('2d'); g.drawImage(L, 0, 0); g.drawImage(R, L.width, 0)
const BREITE = 1.8, HOEHE = BREITE * cv.height / cv.width
const tafel = new THREE.Group(); tafel.position.set(0, 0.32 + HOEHE / 2, 0); tafel.rotation.y = 0.18; scene.add(tafel)
const rueck = new THREE.Mesh(new THREE.BoxGeometry(BREITE + 0.06, HOEHE + 0.06, 0.04), new THREE.MeshStandardMaterial({ color: '#2b2622', roughness: 0.8 })); rueck.position.z = -0.025; rueck.castShadow = rueck.receiveShadow = true; tafel.add(rueck)
const fuss = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.06, 0.34, 16), rueck.material); fuss.position.set(0, -HOEHE / 2 - 0.16, -0.03); tafel.add(fuss)
const rng = (() => { let s = 20261122; return () => { s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } })()
const relief = createBildVoxel({ THREE, bild: cv, breite: BREITE, hoehe: HOEHE, spalten: 96, tiefe: 0.17, rng }); tafel.add(relief.gruppe); scene.add(relief.lose)
const atlas = new THREE.CanvasTexture(cv); atlas.colorSpace = THREE.SRGBColorSpace; atlas.anisotropy = 8
const haut = createSchaelen({ THREE, atlas, zellen: [1, 1], seiten: 1, breite: BREITE, hoehe: HOEHE, spalten: 30, zeilen: 21, rng, einmalig: true })
haut.unter.visible = false; haut.gruppe.position.z = 0.003; tafel.add(haut.gruppe); scene.add(haut.flocken)

// Ablauf (feste Zeiten, damit die Aufnahme immer gleich ist)
const ABLAUF = [
  [0.8, () => { haut.welle(0.22, 0.72, { tempo: 1.1, reichweite: 0.6 }); relief.aufbauen(0.22, 0.72, { tempo: 1.1, reichweite: 0.6, verzoegerung: 0.9 }) }],
  [2.4, () => { haut.welle(0.8, 0.3, { tempo: 1.1, reichweite: 0.7 }); relief.aufbauen(0.8, 0.3, { tempo: 1.1, reichweite: 0.7, verzoegerung: 0.9 }) }],
  [4.0, () => { haut.welle(0.5, 0.5, { tempo: 0.9 }); relief.aufbauen(0.5, 0.5, { tempo: 0.9, verzoegerung: 0.9 }) }],
  [9.0, () => relief.zerfallen(0.5, 1.05, { tempo: 1.4, wucht: 1 })],
  [15.0, () => relief.aufbauen(0.5, 0.5, { art: 'einfliegen', tempo: 0.6 })],
]
let zeit = 0, naechster = 0
const kamWeg = (t) => { // langsame Fahrt von vorn-links in die Dreiviertelansicht (zeigt die Tiefe), am Ende zurück
  const k = THREE.MathUtils.smoothstep(t, 0, 9) - 0.6 * THREE.MathUtils.smoothstep(t, 13, 18), a = -0.15 + k * 0.85
  camera.position.set(Math.sin(a) * 3.6, 1.15 + k * 0.25, Math.cos(a) * 3.6); camera.lookAt(0, 0.32 + HOEHE / 2 - 0.05, 0) }
function schritt(dt) {
  zeit += dt
  while (naechster < ABLAUF.length && zeit >= ABLAUF[naechster][0]) ABLAUF[naechster++][1]()
  haut.update(dt, { welt: haut.gruppe, boden: BODEN + 0.005, laufen: 1 }); relief.update(dt, { boden: BODEN })
  kamWeg(zeit)
}
window.__record = async ({ dir, frames, w = 1280, h = 720 }) => {
  renderer.setSize(w, h, false); composer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix()
  for (let i = 0; i < frames; i++) { schritt(1 / 30); composer.render(); await fetch(`/save?f=${dir}/${String(i).padStart(4, '0')}.png`, { method: 'POST', body: renderer.domElement.toDataURL('image/png') }) }
  return { zeit: +zeit.toFixed(2), ...relief.stand(), flocken: haut.lose }
}
window.__relief = relief; window.__haut = haut
window.__bereit = true
renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix()
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix() })
let uhr = performance.now(); (function lauf() { const t = performance.now(), dt = Math.min(0.05, (t - uhr) / 1000); uhr = t; if (zeit < 19.5) schritt(dt); composer.render(); requestAnimationFrame(lauf) })()
</script></body></html>
