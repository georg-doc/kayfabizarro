<div id="kopf"><b>Book machine</b> · intro · <span id="shot">–</span></div>
<script type="module">
// Intro der Buchmaschine nach Georg 23.11. (replies/buchmaschine/INTRO_ABLAUF_R2.md): erst die ganze Maschine, dann Fahrt auf die Präsentationsplatte (Platte des Orrery an der Stelle
// der Sonne), von oben stampft die Mechanik und schießt das Buch auf die Platte, es landet wie Hartgummi (Stauchen, Strecken, Nachfedern), Energieströme heben es schräg
// in die Schwebe, eine volle Drehung wie ein Produkt auf dem Drehteller, die Kamera folgt; der Hero ist bereits die Analyse. Keine Schrift im Bild.
// Alles ist eine Funktion der Zeit T (0…LAENGE), damit Belege bildgenau sind.
import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js'
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js'
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js'
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js'
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js'
import { buildParts, makeMaterials } from '../../src/vendor/codevember-orrery/parts.js'
import { gearGeometry } from '../../src/vendor/codevember-orrery/gears.js'
import { applyClay } from '../../src/vendor/clay/kfb-clay.v1.2.js'
import { rostLook, verlaufUmgebung } from '../../src/scenelets/buchmaschine/rostLook.js'
import { createHnKammer } from '../../src/scenelets/hnKammer.js'

const W0 = innerWidth, H0 = innerHeight
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(W0, H0)
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace
document.body.appendChild(renderer.domElement)
const scene = new THREE.Scene(); scene.background = new THREE.Color('#000000')
const camera = new THREE.PerspectiveCamera(28, W0 / H0, 0.02, 200)
const composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene, camera))
const bokeh = new BokehPass(scene, camera, { focus: 3, aperture: 0.0015, maxblur: 0.008 }); composer.addPass(bokeh)
const bloom = new UnrealBloomPass(new THREE.Vector2(W0, H0), 0.14, 0.4, 0.96); composer.addPass(bloom); composer.addPass(new OutputPass())
const env = verlaufUmgebung(renderer, { sky: '#2a3040', ground: '#0a0a10' })
const BODEN = -0.45, SCHEIBE_Y = 4.24, B = new THREE.Vector3(0, 4.9, 0), UPV = new THREE.Vector3(0, 1, 0)
const V3 = (a) => new THREE.Vector3(...a)

// Raum: HyperNorm-Kammer nur als Glimmen; Licht bringt die Bühne selbst (ein Produktfilm-Aufbau)
const kammer = createHnKammer({ THREE, renderer, quellen: [{ url: 'pd_pool_klein/manifest.json', src: 'pd' }, { url: '../../engine/hypernorm/test/daten/help-deck.hn-media.json' }], helligkeit: 0.06, lichter: false, seed: 1966 })
kammer.group.position.set(0, BODEN, -kammer.anker.buehne.z); scene.add(kammer.group)
let wandU = null; kammer.group.traverse((o) => { if (o.material?.uniforms?.uHell) wandU = o.material.uniforms })
const key = new THREE.SpotLight('#ffe2c4', 16, 14, Math.PI / 7, 0.85, 1.4); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0003
const randL = new THREE.SpotLight('#9fc6ff', 48, 12, Math.PI / 8, 0.6, 1.4), randR = new THREE.SpotLight('#b9d4ff', 42, 12, Math.PI / 8, 0.6, 1.4)
const oben = new THREE.SpotLight('#fff3e2', 9, 10, Math.PI / 6, 0.9, 1.4), fuell = new THREE.HemisphereLight('#2b2f3c', '#0d0a08', 0.35), buehne = new THREE.SpotLight('#ffcfa0', 0, 16, Math.PI / 5, 0.8, 1.3)
for (const l of [key, randL, randR, buehne, oben]) { scene.add(l, l.target) }
scene.add(fuell)

// Maschine als Bühne: Orrery in Rost, Drehteller unter dem Buch
const ladeBild = (src) => new Promise((ok) => { const im = new Image(); im.onload = () => ok(im); im.src = src })
const texVon = (im, srgb) => { const t = new THREE.Texture(im); t.wrapS = t.wrapT = THREE.RepeatWrapping; if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; t.needsUpdate = true; return t }
const [imD, imA] = await Promise.all([ladeBild('_privat/rost/rost_diff.jpg'), ladeBild('_privat/rost/rost_arm.jpg')])
const ROST = { diff: texVon(imD, true), arm: texVon(imA, false) }
const FEST = Date.UTC(2026, 10, 23, 12), EchtDate = Date
globalThis.Date = class extends EchtDate { constructor(...a) { super(...(a.length ? a : [FEST])) } static now() { return FEST } }
const { parts, train } = buildParts(makeMaterials(), 5)
globalThis.Date = EchtDate
const machine = new THREE.Group(); scene.add(machine)
const mat = (color, roughness = 0.8) => new THREE.MeshStandardMaterial({ color, roughness, metalness: 0 })
const rolle = new Map(), planeten = []
for (const p of parts) {
  machine.add(p.mesh); p.mesh.castShadow = true
  if (p.id === 'sun') { p.mesh.visible = false; continue }
  let r = null
  if (p.kind === 'gear') r = train.gears.get(p.id).teeth >= 36 ? 'antrieb' : 'gummi'
  else if (p.kind === 'plate') r = 'traeger'
  else if (p.kind === 'bar') r = /Arm$|Bracket$/.test(p.id) ? 'arm' : 'eisen'
  else if (p.id === 'crankKnob') r = 'knauf'
  if (r) { p.mesh.material = mat(r === 'gummi' ? '#262422' : '#8a8580', r === 'gummi' ? 0.95 : 0.8); rolle.set(p.mesh, r) }
  else { const c = p.mesh.material.color?.getHex?.() ?? 0xcccccc; p.mesh.material = mat(c, 0.7); p.mesh.material.emissive = new THREE.Color('#a8c4ff'); planeten.push(p.mesh) }
}
const ROLLEN = { antrieb: { ton: 1.0, grau: 0.0, kante: 0.35 }, traeger: { ton: 0.68, grau: 0.1, kante: 0.3 }, arm: { ton: 1.18, grau: 0.45, kante: 0.4 }, eisen: { ton: 0.8, grau: 0.35, kante: 0.4 }, knauf: { ton: 0.9, grau: 0.0, kante: 0.3 } }
const scheibe = new THREE.Mesh(new THREE.CylinderGeometry(1.05, 1.1, 0.07, 64), mat('#8a8580')); scheibe.position.y = SCHEIBE_Y; scheibe.castShadow = scheibe.receiveShadow = true; machine.add(scheibe); rolle.set(scheibe, 'traeger')
applyClay(machine, THREE, { profile: 'midground', seed: 'buchmaschine-orrery', scaleRef: 1.6 })
// große Scheibe: Rost großflächig und flacher (R9)
for (const [mesh, r] of rolle) { const R = ROLLEN[r]; if (!R) continue; const gross = mesh === scheibe; rostLook(mesh.material, { tex: ROST, lack: null, kante: R.kante, skala: gross ? 0.22 : 0.35, ton: gross ? 0.7 : R.ton, grau: R.grau, bump: gross ? 0.03 : 0.1 }); mesh.material.roughness = Math.max(mesh.material.roughness, 0.85); mesh.material.envMap = env; mesh.material.envMapIntensity = 0.45 }   // Rost größer skaliert und flacher: flimmert aus der Ferne nicht
const pos = new THREE.Vector3(), quat = new THREE.Quaternion()
// Buch r3c: steht aufrecht auf dem Drehteller; buchVersatz hält die Rücken-Achse, halter trägt das Modell
const gltf = await new GLTFLoader().loadAsync('_privat/buch/KFB_Buch_Mensch.r3c.glb')
const buch = new THREE.Group(), buchVersatz = new THREE.Group(), halter = new THREE.Group(); scene.add(buch); buch.add(buchVersatz); buchVersatz.add(halter)
halter.rotation.x = Math.PI / 2; halter.scale.setScalar(4.6); halter.add(gltf.scene)
gltf.scene.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = false; o.frustumCulled = false } })
gltf.scene.traverse((o) => { if (o.isMesh) for (const m of [].concat(o.material)) { if (m.normalMap) m.normalMap = null; if (m.name === 'Buch_Umschlag') { m.roughness = 0.62; m.envMap = env; m.envMapIntensity = 0.3 } if (m.map) { m.map.anisotropy = renderer.capabilities.getMaxAnisotropy(); m.map.needsUpdate = true } m.needsUpdate = true } })
const mixer = new THREE.AnimationMixer(gltf.scene), clip = (n) => gltf.animations.find((c) => c.name === n)
const KN = {}; gltf.scene.traverse((o) => { if (o.isBone) KN[o.name] = o })
{ const a0 = mixer.clipAction(clip('zu')); a0.play(); mixer.update(0); a0.stop() }
// umschlag_ausfalten in drei Gruppen mit je eigenem Bewegungsfenster: Umschlag, vordere Lasche, hintere Lasche (Georg: Laschen als eigener Effekt danach)
const GRUPPE_VON = (n) => (/^klappe_v/.test(n) ? 'klappeV' : /^klappe_h/.test(n) ? 'klappeH' : 'umschlag')
const SPUREN = clip('umschlag_ausfalten').tracks.map((t) => { const [knoten, eig] = t.name.split('.'), k = t.getValueSize(), v = t.values, n = t.times.length
  const gleich = (i, j) => { for (let c = 0; c < k; c++) if (Math.abs(v[i * k + c] - v[j * k + c]) > 1e-4) return false; return true }
  let i0 = 0, i1 = n - 1; while (i0 < n - 1 && gleich(i0, i0 + 1)) i0++; while (i1 > 0 && gleich(i1, i1 - 1)) i1--; if (i1 <= i0) { i0 = 0; i1 = n - 1 }
  return { ziel: KN[knoten]?.[eig], ip: t.createInterpolant(), t0: t.times[i0], t1: t.times[i1], g: GRUPPE_VON(knoten) } }).filter((x) => x.ziel)
const FENSTER = {}; for (const S of SPUREN) { const F = FENSTER[S.g] ??= [1e9, -1e9]; F[0] = Math.min(F[0], S.t0); F[1] = Math.max(F[1], S.t1) }
const poseJetzt = {}
// Der Clip legt die Drehung in einen kurzen Teil seines Fensters; Fortschritt deshalb nach dem gemessenen Winkel des Leitknochens (gleichmäßig über die geplante Zeit)
const LEIT = { umschlag: 'deckel_v', klappeV: 'klappe_v', klappeH: 'klappe_h' }, TAFEL = {}
for (const g in FENSTER) { const [w0, w1] = FENSTER[g], S = SPUREN.find((x) => x.g === g && x.ziel === KN[LEIT[g]]?.quaternion); if (!S) continue
  const q = (t) => new THREE.Quaternion().fromArray(S.ip.evaluate(t)), q0 = q(w0), ges = q0.angleTo(q(w1)), rows = []; let m = 0
  for (let i = 0; i <= 240; i++) { const t = w0 + (w1 - w0) * i / 240; m = Math.max(m, q0.angleTo(q(t)) / Math.max(1e-6, ges)); rows.push([t, Math.min(1, m)]) }
  TAFEL[g] = rows }
function zeitBei(g, f) { const R = TAFEL[g], [w0, w1] = FENSTER[g]; if (!R) return w0 + f * (w1 - w0); if (f <= 0) return w0; if (f >= 1) return w1
  for (let i = 1; i < R.length; i++) if (R[i][1] >= f) { const [ta, pa] = R[i - 1], [tb, pb] = R[i]; return ta + (tb - ta) * (pb > pa ? (f - pa) / (pb - pa) : 0) } return w1 }
function ausfalten(soll) { const p = typeof soll === 'number' ? { umschlag: soll, klappeV: soll, klappeH: soll } : soll; let neu = false
  for (const g in FENSTER) { const f = THREE.MathUtils.clamp(p[g] ?? 0, 0, 1.2); if (Math.abs(f - (poseJetzt[g] ?? -1)) > 1e-5) { poseJetzt[g] = f; neu = true } }
  if (!neu) return
  const ZT = {}; for (const g in FENSTER) ZT[g] = zeitBei(g, Math.min(1, poseJetzt[g]))
  for (const S of SPUREN) S.ziel.fromArray(S.ip.evaluate(ZT[S.g]))
  gltf.scene.updateMatrixWorld(true) }
const inv = new THREE.Matrix4()
function kastenJetzt() { const k = new THREE.Box3(), v = new THREE.Vector3(); buchVersatz.updateMatrixWorld(true); inv.copy(buchVersatz.matrixWorld).invert()
  gltf.scene.traverse((o) => { if (!o.isMesh || !o.visible) return; const p = o.geometry.attributes.position; for (let i = 0; i < p.count; i += 5) { (o.isSkinnedMesh ? o.getVertexPosition(i, v) : v.fromBufferAttribute(p, i)); v.applyMatrix4(o.matrixWorld).applyMatrix4(inv); k.expandByPoint(v) } }); return k }
ausfalten(0); const K0 = kastenJetzt(); { const c = K0.getCenter(new THREE.Vector3()); halter.position.x -= c.x; halter.position.y -= c.y; halter.position.z -= c.z }
const KZU = kastenJetzt(); ausfalten(1); const KAUF = kastenJetzt(); ausfalten(0)
const DICKE = KZU.max.z - KZU.min.z, HOEHE = KZU.max.y - KZU.min.y, BREITE_ZU = KZU.max.x - KZU.min.x
console.log('kasten zu', KZU.min.toArray().map((x) => x.toFixed(3)), KZU.max.toArray().map((x) => x.toFixed(3)), 'auf', KAUF.min.toArray().map((x) => x.toFixed(3)), KAUF.max.toArray().map((x) => x.toFixed(3)))
window.__kasten = { zu: [KZU.min.toArray(), KZU.max.toArray()], auf: [KAUF.min.toArray(), KAUF.max.toArray()] }

// Buch-Hierarchie: buch (Ort) → deform (Stauchen/Strecken in Weltachsen, Drehpunkt am Kontakt) → dreh (Lage) → buchVersatz → halter
const deform = new THREE.Group(), dreh = new THREE.Group(); buchVersatz.removeFromParent(); buch.add(deform); deform.add(dreh); dreh.add(buchVersatz)
const PI = Math.PI, P0 = new THREE.Vector3(0, SCHEIBE_Y + 0.035, 0), FY = P0.y + 0.98, F = new THREE.Vector3(0, FY, 0)
const sun = parts.find((p) => p.id === 'sun'); if (sun) sun.mesh.visible = false
for (const m of planeten) { m.material.emissiveIntensity = 0; m.material.color.multiplyScalar(0.45); m.material.roughness = 0.6; m.material.envMap = env; m.material.envMapIntensity = 0.35 }
for (const [mesh] of rolle) mesh.material.envMapIntensity = 0.15

// Zuführung von oben: Rohr mit Flanschen und Stempel, in der Formsprache der Maschine (Rost)
const MUND = P0.y + 1.3
const rohrMat = mat('#8a8580', 0.8); rostLook(rohrMat, { tex: ROST, lack: null, kante: 0.4, skala: 0.5, ton: 0.8, grau: 0.35, bump: 0.08 }); rohrMat.envMap = env; rohrMat.envMapIntensity = 0.15; rohrMat.side = THREE.DoubleSide
const rohr = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 5, 40, 1, true), rohrMat); rohr.position.set(0, MUND + 2.5, 0); rohr.castShadow = true; scene.add(rohr)
const flansche = [0.04, 0.9, 2.2].map((dy) => { const fl = new THREE.Mesh(new THREE.TorusGeometry(0.52, 0.045, 10, 48), rohrMat); fl.rotation.x = PI / 2; fl.position.set(0, MUND + dy, 0); scene.add(fl); return fl })
const stempel = new THREE.Mesh(new THREE.CylinderGeometry(0.44, 0.44, 0.1, 40), rohrMat); stempel.castShadow = true; scene.add(stempel)
const stange = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 3, 16), rohrMat); scene.add(stange)

// Energieströme: drei Ströme vom Plattenrand halten das Buch (fließende Lichtbänder)
const stromU = { uZeit: { value: 0 }, uStaerke: { value: 0 } }
const stromMat = new THREE.ShaderMaterial({ uniforms: stromU, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  vertexShader: `varying vec2 vUv; varying float vKern; void main(){ vUv = uv; vec4 mv = modelViewMatrix * vec4(position, 1.0); vec3 n = normalize(normalMatrix * normal); vKern = pow(abs(dot(n, normalize(-mv.xyz))), 2.5); gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `uniform float uZeit, uStaerke; varying vec2 vUv; varying float vKern; void main(){ float fluss = pow(sin(vUv.x * 34.0 - uZeit * 9.0) * 0.5 + 0.5, 3.0) * (0.75 + 0.25 * sin(uZeit * 31.0 + vUv.x * 7.0)); float enden = smoothstep(0.0, 0.12, vUv.x) * smoothstep(0.62, 0.38, vUv.x);
    float flacker = 0.6 + 0.4 * sin(uZeit * 47.0 + vUv.x * 13.0) * sin(uZeit * 23.0); float a = (0.2 + 0.8 * fluss) * enden * uStaerke * 0.9 * flacker * (0.3 + 0.7 * vKern); gl_FragColor = vec4(vec3(1.0, 0.72, 0.38) * a, 1.0); }` })
const STRANG = 3, stroeme = []
for (let i = 0; i < 3; i++) for (let k = 0; k < STRANG; k++) { const m = new THREE.Mesh(new THREE.BufferGeometry(), stromMat); m.frustumCulled = false; m.renderOrder = 4; m.userData = { i, k }; scene.add(m); stroeme.push(m) }
const energieLicht = new THREE.PointLight('#9fd8ff', 0, 1.6, 2); scene.add(energieLicht)
const saeuleU = { uZeit: { value: 0 }, uStaerke: { value: 0 } }
const saeule = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 1, 48, 1, true), new THREE.ShaderMaterial({ uniforms: saeuleU, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  vertexShader: `varying vec2 vUv; varying float vKern; void main(){ vUv = uv; vec4 mv = modelViewMatrix * vec4(position, 1.0); vec3 n = normalize(normalMatrix * normal); vKern = pow(1.0 - abs(dot(n, normalize(-mv.xyz))), 1.5); gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `uniform float uZeit, uStaerke; varying vec2 vUv; varying float vKern; void main(){ float h = vUv.y; float band = 0.7 + 0.3 * sin(vUv.x * 40.0 + h * 6.0 - uZeit * 2.0);
    float a = band * smoothstep(0.0, 0.15, h) * smoothstep(0.95, 0.35, h) * vKern * uStaerke * 0.1; gl_FragColor = vec4(vec3(0.55, 0.82, 1.0) * a, 1.0); }` }))
saeule.frustumCulled = false; saeule.renderOrder = 3; scene.add(saeule)
const ECKEN = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()], ECKE_LOKAL = [new THREE.Vector3(-0.06, -0.2, 0), new THREE.Vector3(0.06, -0.2, 0), new THREE.Vector3(0, -0.2, -0.03)]
function stroemeSetzen(T, staerke, ziel) {
  ECKEN.forEach((e, i) => { e.copy(ECKE_LOKAL[i]); buchVersatz.localToWorld(e) }); stromU.uZeit.value = T; stromU.uStaerke.value = staerke
  for (const m of stroeme) { const { i, k } = m.userData; m.visible = staerke > 0.003; if (!m.visible) continue
    const w = i / 3 * PI * 2 + T * 0.35, a = new THREE.Vector3(Math.cos(w) * 0.55, P0.y + 0.07, Math.sin(w) * 0.55), z = ECKEN[i]
    const quer = new THREE.Vector3(-Math.sin(w), 0, Math.cos(w)), punkte = []
    for (let n = 0; n <= 24; n++) { const u = n / 24, p = a.clone().lerp(z, u), huelle = Math.sin(PI * u)
      p.addScaledVector(quer, huelle * (0.03 * Math.sin(u * 5.5 + T * (2.6 + k * 0.9) + k * 2.1) + 0.012 * Math.sin(u * 11 - T * 4 + i)))
      p.y += huelle * 0.015 * Math.sin(u * 7 + T * 3 + k * 4); punkte.push(p) }
    m.geometry.dispose(); m.geometry = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(punkte), 48, k === 0 ? 0.012 : 0.006, 5, false) }
  energieLicht.position.copy(ziel).add(new THREE.Vector3(0, -0.45, 0.2)); energieLicht.intensity = 0.25 * staerke
  for (let i = 0; i < 3; i++) { const w = i / 3 * PI * 2 + T * 0.35; duesen[i].position.set(Math.cos(w) * 0.55, scheibe.position.y + 0.035 + 0.04 * Math.min(1, staerke * 3), Math.sin(w) * 0.55); duesen[i].scale.y = Math.max(0.01, Math.min(1, staerke * 3)); duesen[i].visible = staerke > 0.001 }
  const hoehe = Math.max(0.05, ziel.y - P0.y); saeule.visible = staerke > 0.003; saeule.scale.set(1, hoehe, 1); saeule.position.set(0, P0.y + hoehe / 2, 0); saeuleU.uZeit.value = T; saeuleU.uStaerke.value = staerke }

// Analyse: feine warme Lichtkante, die über das Buch wandert (keine Schrift)
const scanU = { uScanPos: { value: 0 }, uScan: { value: 0 } }
gltf.scene.traverse((o) => { if (!o.isMesh) return; for (const m of [].concat(o.material)) { if (m.userData.scan) continue; m.userData.scan = true
  m.onBeforeCompile = (sh) => { Object.assign(sh.uniforms, scanU)
    sh.vertexShader = 'varying vec3 vScanW;\n' + sh.vertexShader.replace('#include <project_vertex>', '#include <project_vertex>\nvScanW = (modelMatrix * vec4(transformed, 1.0)).xyz;')
    sh.fragmentShader = 'uniform float uScanPos, uScan; varying vec3 vScanW;\n' + sh.fragmentShader.replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      { float d = vScanW.y - uScanPos; totalEmissiveRadiance += vec3(1.0, 0.62, 0.3) * exp(-d * d / 0.0009) * 0.55 * uScan; }`) }
  m.customProgramCacheKey = () => 'kfb-scan-intro'; m.needsUpdate = true } })

const scanRing = new THREE.Mesh(new THREE.TorusGeometry(0.78, 0.03, 12, 96), mat('#8a8580', 0.8)); rostLook(scanRing.material, { tex: ROST, lack: null, kante: 0.5, skala: 0.4, ton: 1.1, grau: 0.2, bump: 0.08 }); scanRing.material.envMap = env; scanRing.material.envMapIntensity = 0.2; scene.add(scanRing)
const ringLicht = new THREE.Mesh(new THREE.TorusGeometry(0.76, 0.006, 6, 96), new THREE.MeshBasicMaterial({ color: '#ffb066', transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false })); scene.add(ringLicht)
