<!doctype html><html lang="de"><head><meta charset="utf-8"><title>KFB HUD Holo · Konzept R1</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* Konzept „Holo minimal“ (WS0 21.11.): 8-px-Raster · Rand 24 · Kachel 56 · Abstand 8 · Radius 14/10 · eine Schrift · Glas leise, Leuchten nur bei Interaktion.
   Aufbau: oben links Status (Almanach + Radio) · oben Mitte Fluff · oben rechts Karte + Ziel · unten EIN Dock (Porträt mit Lebensring, Aktionen, Rucksack, Reise). */
:root{--glas:rgba(6,26,28,.56);--glas-stark:rgba(5,22,24,.78);--kante:rgba(118,240,214,.42);--kante-stark:rgba(118,240,214,.92);--text:#d6fbf3;--leise:rgba(214,251,243,.62);--tk:#76f0d6;--amber:#ffbe5a;--r:14px;--rk:10px;--u:8px}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b1214;overflow:hidden;font-family:"Avenir Next","Helvetica Neue",system-ui,sans-serif;color:var(--text)}
#bühne{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:50% 50%;background:url(teile/spiel.jpg) center/cover}
.glas{position:absolute;background:var(--glas);border:1px solid var(--kante);border-radius:var(--r);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 0 18px rgba(70,220,190,.12),inset 0 1px 0 rgba(160,255,235,.10)}
.glas::before{content:"";position:absolute;top:-1px;left:20%;width:38%;height:1px;background:linear-gradient(90deg,transparent,rgba(170,255,238,.95),transparent);pointer-events:none}
.leise{color:var(--leise)}
.caps{font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.zahl{font-variant-numeric:tabular-nums}
/* Ring-Knopf */
.ring{width:28px;height:28px;border-radius:50%;border:1px solid var(--kante);display:grid;place-items:center;background:rgba(4,18,20,.6);cursor:pointer;transition:.15s}
.ring:hover{border-color:var(--kante-stark);box-shadow:0 0 10px rgba(118,240,214,.45)}
.ring svg{width:12px;height:12px;fill:var(--tk)}
/* A · Status oben links */
#status{left:24px;top:24px;height:56px;display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px}
#status .karte{width:30px;height:40px;border-radius:4px;background:linear-gradient(160deg,#f3ead8,#d9cbb0);box-shadow:0 0 0 1px rgba(255,255,255,.25);position:relative;overflow:hidden}
#status .karte::after{content:"";position:absolute;inset:5px 4px 12px;border-radius:2px;background:linear-gradient(180deg,#7fb3c9,#3d6f8a)}
#status .titel{font-size:12px;font-weight:600;line-height:1.2}#status .titel small{display:block;font-weight:500;font-size:10px;color:var(--leise)}
#status .knoepfe{display:flex;gap:8px;margin-left:4px}
/* B · Fluff oben Mitte */
#fluff{left:50%;top:24px;transform:translateX(-50%);height:40px;display:flex;align-items:center;gap:8px;padding:0 12px}
#fluff .b{position:relative;width:24px;height:24px}#fluff .b img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
#fluff .b span{position:absolute;right:-6px;bottom:-5px;font-size:10px;font-weight:600}
#fluff .summe{margin-left:8px;padding-left:12px;border-left:1px solid var(--kante);font-size:13px;font-weight:600}
/* C · Karte oben rechts */
#karte{right:24px;top:24px;width:128px;height:128px;border-radius:50%;padding:0;overflow:hidden}
#karte::before{display:none}
#karte .land{position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle at 40% 45%,#2c6f6a,#123a3a 60%,#0a2224);opacity:.95}
#karte .land::after{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-linear-gradient(35deg,rgba(118,240,214,.06) 0 6px,transparent 6px 14px)}
#karte .ich{position:absolute;left:50%;top:50%;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:14px solid var(--tk);transform:translate(-50%,-60%);filter:drop-shadow(0 0 4px var(--tk))}
#karte .zielpunkt{position:absolute;right:16px;bottom:30px;width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber)}
#ziel{position:absolute;right:24px;top:160px;width:128px;text-align:center;font-size:11px;color:var(--leise)}#ziel b{color:var(--text);font-weight:600}
#zahnrad{position:absolute;right:164px;top:24px}
/* D · Dock unten */
#dock{left:50%;bottom:24px;transform:translateX(-50%);height:72px;display:flex;align-items:center;gap:8px;padding:8px}
.port{width:56px;height:56px;border-radius:50%;position:relative;margin-right:4px;flex:none}
.port .lebensring{position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(var(--tk) calc(var(--hp,.86)*360deg),rgba(118,240,214,.14) 0);-webkit-mask:radial-gradient(circle,transparent 31px,#000 32px);mask:radial-gradient(circle,transparent 31px,#000 32px)}
.port img{position:absolute;inset:3px;width:50px;height:50px;border-radius:50%;object-fit:cover}
.port .hp{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);font-size:9px;color:var(--leise)}
.kachel{width:56px;height:56px;border-radius:var(--rk);border:1px solid rgba(118,240,214,.28);background:linear-gradient(180deg,rgba(18,52,52,.55),rgba(6,22,24,.65));position:relative;display:grid;place-items:center;cursor:pointer;transition:.15s;flex:none}
.kachel:hover{border-color:var(--kante-stark);box-shadow:0 0 12px rgba(118,240,214,.35)}
.kachel.aktiv{border-color:var(--kante-stark);box-shadow:inset 0 0 0 1px var(--kante-stark),0 0 12px rgba(118,240,214,.3)}
.kachel.sek{box-shadow:inset 0 0 0 1px rgba(255,190,90,.75)}
.kachel img{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.kachel .taste{position:absolute;right:4px;bottom:2px;font-size:9px;font-weight:600;color:var(--leise)}
.kachel .mehr{position:absolute;right:4px;top:3px;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--leise)}
.kachel.offen .mehr{border-top:0;border-bottom:5px solid var(--tk)}
.kachel .fuell{position:absolute;inset:8px;display:grid;place-items:center}.kachel .fuell img{position:absolute;width:40px;height:40px}
.kachel .fuell .b{filter:saturate(.25) brightness(.7)}.kachel .fuell .f{clip-path:inset(calc((1 - var(--f,1))*100%) 0 0 0)}
.trenner{width:1px;align-self:stretch;margin:6px 4px;background:var(--kante)}
.tempo{width:44px;text-align:center;font-size:13px;font-weight:600;line-height:1.1}.tempo small{display:block;font-size:9px;color:var(--leise);font-weight:500}
/* Icon-Variante: UI-Icons türkis */
body.ui .kachel img.i3d{display:none}body:not(.ui) .kachel img.iui{display:none}
.iui{filter:brightness(0) saturate(100%) invert(86%) sepia(22%) saturate(900%) hue-rotate(112deg) brightness(102%) drop-shadow(0 0 4px rgba(118,240,214,.55))!important;width:30px!important;height:30px!important}
/* E · Flyout über der Kachel */
#flyout{position:absolute;bottom:112px;padding:12px;display:none}
#flyout.auf{display:block}
#flyout h4{margin:0 0 8px;font-weight:600}
#flyout .gitter{display:grid;grid-template-columns:repeat(4,48px);gap:8px}
#flyout .kachel{width:48px;height:48px}#flyout .kachel img{width:32px;height:32px}
/* Steuerung des Prototyps */
#schalter{position:fixed;left:12px;bottom:12px;display:flex;gap:6px;z-index:9;font:12px system-ui}
#schalter button{background:#0e2a2b;color:#d6fbf3;border:1px solid #2e7a70;border-radius:8px;padding:6px 10px;cursor:pointer}#schalter button.an{background:#1d5a54}
</style></head><body>
<div id="bühne">
  <div id="status" class="glas"><div class="karte"></div><div class="titel">Radio KFB<small>Pharaoh Piledriver</small></div>
    <div class="knoepfe"><div class="ring" title="Pause"><svg viewBox="0 0 10 10"><rect x="2" y="1.5" width="2" height="7"/><rect x="6" y="1.5" width="2" height="7"/></svg></div><div class="ring" title="Weiter"><svg viewBox="0 0 10 10"><path d="M2 1.5l5 3.5-5 3.5z"/><rect x="7.5" y="1.5" width="1.2" height="7"/></svg></div><div class="ring" title="Ton"><svg viewBox="0 0 10 10"><path d="M1 3.5h2l3-2.5v8L3 6.5H1z"/></svg></div></div></div>
  <div id="fluff" class="glas"><div class="b"><img src="teile/ball0.webp"><span class="zahl">3</span></div><div class="b"><img src="teile/ball1.webp"><span class="zahl">0</span></div><div class="b"><img src="teile/ball2.webp"><span class="zahl">12</span></div><div class="b"><img src="teile/ball3.webp"><span class="zahl">1</span></div><div class="b"><img src="teile/ball4.webp"><span class="zahl">0</span></div><div class="b"><img src="teile/ball5.webp"><span class="zahl">7</span></div><div class="summe zahl">23</div></div>
  <div id="karte" class="glas"><div class="land"></div><div class="zielpunkt"></div><div class="ich"></div></div>
  <div id="ziel"><b>Next card</b> · 203 m</div>
  <div id="zahnrad" class="ring" title="Einstellungen"><svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="2.2"/><path d="M4.2 0h1.6l.3 1.5 1.3.6 1.3-.9 1.1 1.1-.9 1.3.6 1.3 1.5.3v1.6l-1.5.3-.6 1.3.9 1.3-1.1 1.1-1.3-.9-1.3.6-.3 1.5H4.2l-.3-1.5-1.3-.6-1.3.9-1.1-1.1.9-1.3-.6-1.3L0 5.8V4.2l1.5-.3.6-1.3-.9-1.3 1.1-1.1 1.3.9 1.3-.6z" fill-opacity=".55"/></svg></div>
  <div id="dock" class="glas">
    <div class="port"><div class="lebensring"></div><img src="teile/portrait.webp"><div class="hp zahl">86</div></div>
    <div class="kachel aktiv" id="k-prim" data-fly="Waffen"><img class="i3d" src="teile/fist.png" style="transform:scaleX(-1)"><img class="iui" src="teile/holo/icons/faust.webp"><span class="mehr"></span><span class="taste">LMB</span></div>
    <div class="kachel sek" id="k-sek" data-fly="Spezial"><div class="fuell"><img class="b i3d" src="teile/fist.png"><img class="f i3d" src="teile/fist.png"><img class="b iui" src="teile/holo/icons/kraftfaust.webp"><img class="f iui" src="teile/holo/icons/kraftfaust.webp"></div><span class="mehr"></span><span class="taste">RMB</span></div>
    <div class="kachel" data-fly="Würfe"><img class="i3d" src="teile/hero_bomb.webp"><img class="iui" src="teile/holo/icons/granate.webp"><span class="mehr"></span><span class="taste">Q</span></div>
    <div class="kachel"><img class="i3d" src="teile/glyph_base_jump.webp"><img class="iui" src="teile/holo/icons/sprung.webp"><span class="taste">␣</span></div>
    <div class="kachel"><img class="i3d" src="teile/hand-four-finger-r2.webp"><img class="iui" src="teile/holo/icons/hand.webp"><span class="taste">I</span></div>
    <div class="trenner"></div>
    <div class="kachel" data-fly="Rucksack"><img class="i3d" src="teile/backpack.png"><img class="iui" src="teile/holo/icons/rucksack.webp"><span class="mehr"></span><span class="taste">B</span></div>
    <div class="kachel" data-fly="Reise"><img class="i3d" src="teile/rust_runner.png"><img class="iui" src="teile/holo/icons/sprung.webp"><span class="mehr"></span><span class="taste">T</span></div>
    <div class="tempo zahl">42<small>km/h</small></div>
  </div>
  <div id="flyout" class="glas"><h4 class="caps">Waffen</h4><div class="gitter">
    <div class="kachel aktiv"><img class="i3d" src="teile/fist.png"><img class="iui" src="teile/holo/icons/faust.webp"></div>
    <div class="kachel"><img class="i3d" src="teile/hero_blaster.webp"><img class="iui" src="teile/holo/icons/pistole.webp"></div>
    <div class="kachel"><img class="i3d" src="teile/gatling.png"><img class="iui" src="teile/holo/icons/mp.webp"></div>
    <div class="kachel"><img class="i3d" src="teile/hero_bomb.webp"><img class="iui" src="teile/holo/icons/rakete.webp"></div>
  </div></div>
</div>
<div id="schalter"><button id="b3d" class="an">3D-Icons</button><button id="bui">UI-Icons</button><button id="bfly">Waffen-Flyout</button></div>
<script>
const B = document.getElementById('bühne'), fit = () => { const s = Math.min(innerWidth / 1600, innerHeight / 900); B.style.transform = `translate(-50%,-50%) scale(${s})` }; addEventListener('resize', fit); fit()
const fly = document.getElementById('flyout'), prim = document.getElementById('k-prim')
function toggleFly(k) { const auf = !fly.classList.contains('auf') || fly.dataset.von !== k.id; document.querySelectorAll('.kachel.offen').forEach((x) => x.classList.remove('offen')); fly.classList.toggle('auf', auf); if (!auf) return
  fly.dataset.von = k.id; fly.querySelector('h4').textContent = k.dataset.fly; k.classList.add('offen'); const r = k.getBoundingClientRect(), rb = B.getBoundingClientRect(), s = rb.width / 1600; fly.style.left = Math.max(24, ((r.left - rb.left) / s) - 12) + 'px' }
document.querySelectorAll('#dock .kachel[data-fly]').forEach((k) => k.addEventListener('click', () => toggleFly(k)))
document.getElementById('bfly').onclick = () => toggleFly(prim)
document.getElementById('b3d').onclick = (e) => { document.body.classList.remove('ui'); e.target.classList.add('an'); document.getElementById('bui').classList.remove('an') }
document.getElementById('bui').onclick = (e) => { document.body.classList.add('ui'); e.target.classList.add('an'); document.getElementById('b3d').classList.remove('an') }
let t = 0; setInterval(() => { t = (t + 0.02) % 1.4; document.getElementById('k-sek').style.setProperty('--f', Math.min(1, t).toFixed(2)) }, 40)
if (location.hash.includes('ui')) document.getElementById('bui').click(); if (location.hash.includes('fly')) toggleFly(prim)
</script></body></html>
