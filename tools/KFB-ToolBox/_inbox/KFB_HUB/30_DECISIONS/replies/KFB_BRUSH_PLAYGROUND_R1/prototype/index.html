<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Georg Brush Playground · private source trial</title>
<style>
:root{font:15px system-ui,sans-serif;color:#25201e;background:#e5ded2}
body{margin:0}header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 22px;background:#fbf8f2;border-bottom:1px solid #b9ae9e}
h1{font-size:18px;margin:0}small{color:#6c635e}main{max-width:1200px;margin:auto;padding:16px}
.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:12px}
label{display:flex;gap:6px;align-items:center}button,.file{border:1px solid #998b7a;border-radius:6px;background:#fff9ef;padding:8px;cursor:pointer}
button:disabled{opacity:.4}.surface{background:white;box-shadow:0 2px 16px #0002;overflow:hidden}
canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
#status{margin-top:12px}a{color:inherit}input[type=color]{height:36px}
</style>
<header><h1>Georg Brush Playground <small>· source-isolated study</small></h1><span>Local-only brush import · no upload</span></header>
<main>
<div class="controls">
<label class="file">Import original .brush <input id="file" type="file" accept=".brush" hidden></label>
<label>Color <input id="color" type="color" value="#382722"></label>
<label>Size <input id="size" type="range" min="4" max="120" value="34"><output id="sizeOut">34</output></label>
<label>Opacity <input id="opacity" type="range" min=".1" max="1" step=".05" value=".9"></label>
<label>Speed sensitivity <input id="speed" type="range" min="-1" max="1" step=".1" value="-.3"></label>
<label>Scatter <input id="scatter" type="range" min="0" max="1" step=".05" value=".35"></label>
<button id="undo" disabled>Undo</button><button id="redo" disabled>Redo</button><button id="clear">Clear</button><button id="png">Export PNG</button>
</div>
<div class="surface"><canvas id="paper" width="1100" height="650" aria-label="Drawing area"></canvas></div>
<p id="status" role="status">Import a private Procreate .brush file. The original stays on this device. Parameters are manual study controls, not decoded Procreate values.</p>
</main>
<script type="module">
const $=id=>document.getElementById(id), canvas=$('paper'), ctx=canvas.getContext('2d'), W=canvas.width,H=canvas.height;
const undo=[],redo=[];let tip=null,tipName='',drawing=null,activePointer=null;const tintCache=new Map();
function tintedTip(color){if(!tip)return null;if(tintCache.has(color))return tintCache.get(color);const off=document.createElement('canvas');off.width=tip.width;off.height=tip.height;const c=off.getContext('2d');c.drawImage(tip,0,0);c.globalCompositeOperation='source-in';c.fillStyle=color;c.fillRect(0,0,off.width,off.height);tintCache.set(color,off);return off;}
const num=id=>Number($(id).value);
function stateButtons(){ $('undo').disabled=!undo.length; $('redo').disabled=!redo.length;}
function seedRand(seed){let x=seed|0;return ()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return (x>>>0)/4294967296;};}
function renderStroke(s){
 const random=seedRand(s.seed), points=s.points;if(!points.length)return;
 const opacity=s.opacity;let prev=points[0],carry=0,prevTime=prev.t;
 for(let i=0;i<points.length;i++){
  const pt=points[i],dx=pt.x-prev.x,dy=pt.y-prev.y,dist=Math.hypot(dx,dy),dt=Math.max(1,pt.t-prevTime),velocity=dist/dt;
  const spacing=Math.max(1,s.size*.13);
  const count=i===0?1:Math.floor((carry+dist)/spacing);
  for(let j=0;j<count;j++){
   const f=i===0?0:Math.min(1,((j+1)*spacing-carry)/Math.max(dist,.001));
   const x=prev.x+dx*f,y=prev.y+dy*f;
   const pressure=(prev.p+(pt.p-prev.p)*f);
   const v=Math.max(.2,Math.min(2,1+s.speed*(velocity-.45)));
   const radius=s.size*(.22+.78*pressure)*v;
   const angle=Math.atan2(dy,dx)+(random()-.5)*s.scatter*1.5;
   const offset=s.scatter*radius*.35;
   const ox=(random()-.5)*offset,oy=(random()-.5)*offset;
   ctx.save();ctx.translate(x+ox,y+oy);ctx.rotate(angle);ctx.globalAlpha=opacity*(.25+.75*pressure);
   if(tip){
    ctx.drawImage(tintedTip(s.color),-radius/2,-radius/2,radius,radius);
   }else{ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(0,0,radius/2,0,Math.PI*2);ctx.fill();}
   ctx.restore();
  }
  carry=i===0?0:Math.max(0,(carry+dist)-count*spacing);prev=pt;prevTime=pt.t;
 }
}
function redraw(){ctx.clearRect(0,0,W,H);for(const s of undo)renderStroke(s);if(drawing)renderStroke(drawing);stateButtons();}
function coord(ev){const b=canvas.getBoundingClientRect();return {x:(ev.clientX-b.left)*W/b.width,y:(ev.clientY-b.top)*H/b.height,p:ev.pointerType==='mouse'?.65:(ev.pressure||.65),t:ev.timeStamp};}
canvas.addEventListener('pointerdown',e=>{if(activePointer!==null)return;activePointer=e.pointerId;canvas.setPointerCapture(e.pointerId);const s={seed:((Date.now()^undo.length)|0),color:$('color').value,size:num('size'),opacity:num('opacity'),speed:num('speed'),scatter:num('scatter'),points:[coord(e)]};drawing=s;redraw();});
canvas.addEventListener('pointermove',e=>{if(e.pointerId!==activePointer||!drawing)return;const batch=e.getCoalescedEvents?.()||[e];for(const x of batch)drawing.points.push(coord(x));redraw();});
function finish(e){if(e.pointerId!==activePointer)return;if(drawing){undo.push(drawing);redo.length=0;drawing=null;}activePointer=null;stateButtons();}
canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);
$('undo').onclick=()=>{if(undo.length)redo.push(undo.pop());redraw();};
$('redo').onclick=()=>{if(redo.length)undo.push(redo.pop());redraw();};
$('clear').onclick=()=>{undo.length=redo.length=0;redraw();};
$('png').onclick=()=>{const out=document.createElement('a');out.download='georg-brush-playground.png';out.href=canvas.toDataURL('image/png');out.click();};
$('size').oninput=()=>{$('sizeOut').value=$('size').value;};
async function unzipEntry(file,target){
 const buf=await file.arrayBuffer(),view=new DataView(buf);
 if(view.getUint32(0,true)!==0x04034b50)throw Error('Not a ZIP-based .brush');
 let eocd=-1;for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65557);i--)if(view.getUint32(i,true)===0x06054b50){eocd=i;break;}
 if(eocd<0)throw Error('ZIP directory not found');
 const entries=view.getUint16(eocd+10,true);if(entries>1500)throw Error('Too many entries');
 let off=view.getUint32(eocd+16,true);
 for(let n=0;n<entries;n++){
  if(view.getUint32(off,true)!==0x02014b50)throw Error('Invalid ZIP central directory');
  const method=view.getUint16(off+10,true),size=view.getUint32(off+20,true),raw=view.getUint32(off+24,true),len=view.getUint16(off+28,true),extra=view.getUint16(off+30,true),comment=view.getUint16(off+32,true),local=view.getUint32(off+42,true);
  const name=new TextDecoder().decode(new Uint8Array(buf,off+46,len));
  if(name===target){if(raw>10000000||size>10000000)throw Error('Texture too large');
   const start=local+30+view.getUint16(local+26,true)+view.getUint16(local+28,true);
   const bytes=new Uint8Array(buf,start,size);if(method===0)return new Blob([bytes],{type:'image/png'});
   if(method!==8)throw Error('Unsupported compression method');
   const decompressed=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
   const b=await new Response(decompressed).blob();if(b.size!==raw)throw Error('ZIP data size mismatch');return b;
  }
  off+=46+len+extra+comment;
 }
 throw Error('Shape.png absent: not a supported single brush');
}
$('file').onchange=async e=>{
 const file=e.target.files?.[0];if(!file)return;
 try{if(file.size>32e6)throw Error('Archive exceeds 32 MB private-import limit');
 const blob=await unzipEntry(file,'Shape.png');const bitmap=await createImageBitmap(blob);
 if(bitmap.width>4096||bitmap.height>4096){bitmap.close();throw Error('Tip exceeds 4096px');}
 tip?.close?.();tip=bitmap;tintCache.clear();tipName=file.name;
 $('status').textContent='Loaded '+tipName+' locally ('+bitmap.width+'×'+bitmap.height+'). Stamp dynamics are experimental; Procreate parameters are NOT yet decoded.';
 redraw();
 }catch(err){$('status').textContent='Import error: '+err.message;}
};
redraw();
</script></html>
