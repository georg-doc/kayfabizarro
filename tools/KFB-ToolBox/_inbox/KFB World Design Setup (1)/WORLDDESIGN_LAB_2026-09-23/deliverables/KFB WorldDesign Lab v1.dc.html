<x-dc>
<helmet>

<script type="importmap">
{ "imports": {

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;modus&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;MATERIAL BENCH&quot;,&quot;WORLD SCENE&quot;],&quot;default&quot;:&quot;MATERIAL BENCH&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Lab&quot;,&quot;label&quot;:&quot;Bank = ein Asset in 4 Feldern · Welt = alle Familien auf Gelände&quot;},&quot;licht&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;BASELINE&quot;,&quot;WHACKMAN&quot;],&quot;default&quot;:&quot;BASELINE&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Lab&quot;,&quot;label&quot;:&quot;Lichtprofil (unabhängig vom Material)&quot;},&quot;raster&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Ansicht&quot;,&quot;label&quot;:&quot;Messraster&quot;},&quot;feldnamen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Ansicht&quot;,&quot;label&quot;:&quot;Feldnamen in der Feldecke&quot;},&quot;bewegung&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Ansicht&quot;,&quot;label&quot;:&quot;Eigene Clips der Quelle spielen&quot;}}">
class Component extends DCLogic {
  push() {
    window.__wdProps = {
      modus: this.props.modus ?? 'MATERIAL BENCH',
      licht: this.props.licht ?? 'BASELINE',
      raster: this.props.raster ?? true,
      feldnamen: this.props.feldnamen ?? true,
      bewegung: this.props.bewegung ?? true
    };
  }
  componentDidMount() { this.push(); }
  componentDidUpdate() { this.push(); }
  renderVals() { this.push(); return {}; }
}
</script>
