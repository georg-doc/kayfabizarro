<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scan · Küstenkanten über einen Radienfächer</title>
<script type="importmap">
{"imports":{
 "three":"https://unpkg.com/three@0.184.0/build/three.module.js",
 "three/addons/loaders/GLTFLoader.js":"https://unpkg.com/three@0.184.0/examples/jsm/loaders/GLTFLoader.js",
 "three/addons/controls/OrbitControls.js":"https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js"
}}
</script>
<style>body{margin:0;background:#111;color:#ccc;font:11px ui-monospace,monospace;padding:8px;white-space:pre-wrap}</style>
</head>
<body>
<div id="out">scanne…</div>
<script type="module">
import * as THREE from 'three';
import { loadAsset, measure } from '../lib/kit-lab.js';
import { hexMetrics } from '../lib/hex-grid.js';

/* Die vorige Messung nahm je Kante EINE Ringlage (0,90 · Inradius) und liess die Mehrheit
   gewinnen. Für „liegt Wasser an dieser Kante?" reicht das; für „reicht der Strand bis an diese
   Kante?" nicht: der Strand ist ein schmaler Streifen, und eine Mehrheitsentscheidung auf einer
   einzigen Lage überstimmt ihn mit Wiese. Deshalb hier ein FÄCHER aus vier Radien × sieben
   Winkeln je Kante, und eine Regel, die der Frage entspricht:
     Wasser  wenn die Mehrheit der Proben Wasser ist
     Sand    sonst, wenn IRGENDEINE Probe Sand ist
     Wiese   sonst
   Das ist der Unterschied zwischen „woraus besteht die Kante" und „läuft der Strand hier weiter". */
const SIZE = 384;
const rt = new THREE.WebGLRenderTarget(SIZE, SIZE);
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.add(new THREE.HemisphereLight(0xffffff, 0xffffff, 3.0));
const buf = new Uint8Array(SIZE * SIZE * 4);
const log = (t) => { document.getElementById('out').textContent = t; };

function renderTile(src, meas) {
  const M = hexMetrics(meas.size);
  const node = src.clone(true);
  scene.add(node);
  const cx = (meas.min[0] + meas.max[0]) / 2, cz = (meas.min[2] + meas.max[2]) / 2;
  const half = M.H / 2 * 1.02;
  const cam = new THREE.OrthographicCamera(-half, half, half, -half, 0.1, 50);
  cam.position.set(cx, 10, cz);
  cam.lookAt(cx, 0, cz);
  renderer.setRenderTarget(rt);
  renderer.render(scene, cam);
  renderer.readRenderTargetPixels(rt, 0, 0, SIZE, SIZE, buf);
  renderer.setRenderTarget(null);
  scene.remove(node);
  /* ACHSENBEWEIS siehe tools/truth-hex-axes.html: Zeilen kommen von UNTEN, Bildschirm-oben
     ist −z. Ohne das Minus ist jede gemessene Kantentabelle in z gespiegelt. */
  return { M, half, px(wx, wz) {
    const x = Math.round(((wx / half) * 0.5 + 0.5) * (SIZE - 1));
    const y = Math.round(((-wz / half) * 0.5 + 0.5) * (SIZE - 1));
    const i = (y * SIZE + x) * 4;
    return [buf[i], buf[i + 1], buf[i + 2]];
  } };
}
const dist2 = (a, b) => (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 + (a[2] - b[2]) ** 2;

const REF = {};
for (const [pack, name, k] of [['hex_base', 'hex_grass', 'g'], ['hex_base', 'hex_water', 'w'], ['hex_roads', 'hex_road_L', 's']]) {
  const R = renderTile(await loadAsset(pack, name), await measure(pack, name));
  REF[k] = R.px(0, 0);
}
const classify = (rgb) => {
  if (rgb[0] + rgb[1] + rgb[2] < 24) return 'x';            // Loch: keine Geometrie
  let best = null, bd = Infinity;
  for (const [k, ref] of Object.entries(REF)) { const d = dist2(rgb, ref); if (d < bd) { bd = d; best = k; } }
  return best;
};

const RADII = [0.78, 0.86, 0.92, 0.97];
const ANGLES = [-21, -14, -7, 0, 7, 14, 21];
const EDGE = [0, 60, 120, 180, 240, 300];
const JOBS = [
  ...'ABCDE'.split('').map((l) => ['hex_coast', `hex_coast_${l}`]),
  ...'ABCDEFGHIJKLM'.split('').map((l) => ['hex_roads', `hex_road_${l}`])
];
const out = {};
for (const [pack, name] of JOBS) {
  const meas = await measure(pack, name);
  const R = renderTile(await loadAsset(pack, name), meas);
  const kinds = [], detail = [];
  for (const ang of EDGE) {
    const votes = { g: 0, s: 0, w: 0, x: 0 };
    for (const rr of RADII) for (const da of ANGLES) {
      const a = ((ang + da) * Math.PI) / 180;
      votes[classify(R.px(Math.cos(a) * R.M.inradius * rr, Math.sin(a) * R.M.inradius * rr))]++;
    }
    const total = RADII.length * ANGLES.length;
    kinds.push(votes.w > total / 2 ? 'w' : votes.s > 0 ? 's' : 'g');
    detail.push(`${votes.g}/${votes.s}/${votes.w}`);
  }
  out[name] = { kinds: kinds.join(''), detail };
  log(`scanne ${Object.keys(out).length}/${JOBS.length}`);
}
window.RESULT = out;
log('Fächer 4 Radien × 7 Winkel · Wasser=Mehrheit, Sand=mindestens eine Probe\nReihenfolge O SO SW W NW NO · Zählung g/s/w je Kante\n\n'
  + Object.entries(out).map(([n, r]) => `${n.padEnd(14)} ${r.kinds}   ${r.detail.join('  ')}`).join('\n'));
</script>
</body>
</html>
