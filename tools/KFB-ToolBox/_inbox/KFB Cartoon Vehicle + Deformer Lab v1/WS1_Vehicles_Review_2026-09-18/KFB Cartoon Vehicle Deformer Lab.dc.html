<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/doccheck-group-design-system-a5295f37-5367-4f36-87fe-7234486c8b92/colors_and_type.css">
  <script src="_ds/doccheck-group-design-system-a5295f37-5367-4f36-87fe-7234486c8b92/_ds_bundle.js"></script>
  <style>
    html,body{margin:0;padding:0;height:100%;background:#fff;}
    a{color:var(--dc-red,#c03);} a:hover{color:var(--dc-red-dark,#902);}
    input[type=range]{accent-color:var(--dc-red,#c03);}
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    window.__KFB3D = window.__KFB3D || { THREE, OrbitControls, GLTFLoader };
    window.dispatchEvent(new Event('kfb3dready'));
  </script>
</helmet>
<div style="display:flex;flex-direction:column;height:100vh;min-height:540px;background:#fff;font-family:var(--font-sans,Roboto,sans-serif);color:#000;">

  <div style="display:flex;align-items:center;gap:20px;height:52px;flex:0 0 52px;background:var(--dc-red,#c03);padding:0 20px;">
    <span style="font-family:var(--font-slab,'Roboto Slab',serif);font-weight:700;font-size:20px;line-height:1;color:#fff;">DocCheck</span>
    <span style="font-size:13px;line-height:1;color:#fff;opacity:.9;">Cartoon Vehicle Deformer Lab · presentation only</span>
    <span style="flex:1 1 auto;"></span>
    <div style="display:flex;gap:5px;align-items:center;">
      <button onClick="{{ onFlip }}" title="Blickrichtung umkehren. Kein Modell gibt sie her — die Korrektur wird je Fahrzeug gemerkt." style="height:28px;padding:0 10px;border:1px solid #fff;border-radius:5px;background:transparent;color:#fff;font-size:12px;font-weight:700;cursor:pointer;">Flip {{ facingTxt }}</button>
      <button onClick="{{ onOrient }}" title="Modell um 90° um die Querachse aufrichten. Für Assets, deren Hochachse nicht y ist — die Hüllbox kann das nicht unterscheiden, das Auge schon. Die Korrektur wird je Fixture gemerkt." style="height:28px;padding:0 10px;border:1px solid #fff;border-radius:5px;background:transparent;color:#fff;font-size:12px;font-weight:700;cursor:pointer;">{{ orientTxt }}</button>
      <button onClick="{{ onPanel }}" title="Seitenleiste ein- und ausblenden — das Review-Fenster soll groß und UI-arm bleiben" style="height:28px;padding:0 10px;border:1px solid #fff;border-radius:5px;background:transparent;color:#fff;font-size:12px;font-weight:700;cursor:pointer;">{{ panelTxt }}</button>
      <button onClick="{{ onReset }}" title="Alle Springs auf exakt null, alle Signale auf null" style="height:28px;padding:0 12px;border:0;border-radius:5px;background:var(--dc-green,#9c3);color:#000;font-size:12px;font-weight:700;cursor:pointer;">RESET</button>
    </div>
  </div>

  <div style="display:flex;flex:1 1 auto;min-height:0;">

    <div style="display:flex;flex-direction:column;flex:1 1 auto;min-width:0;">
      <div style="position:relative;flex:1 1 auto;min-height:0;background:var(--dc-bg-grey,#eee);">
        <div ref="{{ stageRef }}" style="position:absolute;inset:0;"></div>
        <div style="position:absolute;left:10px;right:10px;bottom:10px;display:flex;pointer-events:none;">
          <div style="background:rgba(23,24,26,.78);color:#fff;font-family:var(--font-mono,monospace);font-size:11px;line-height:1.5;padding:5px 10px;border-radius:5px;min-width:0;">{{ stampTxt }}</div>
        </div>
        <div style="position:absolute;left:10px;right:10px;top:10px;display:flex;gap:10px;align-items:flex-start;pointer-events:none;">
          <sc-if value="{{ readTxt }}" hint-placeholder-val="{{ false }}">
            <div style="flex:1 1 auto;min-width:0;background:rgba(204,0,51,.92);color:#fff;font-size:12px;line-height:1.5;padding:7px 12px;border-radius:5px;text-wrap:pretty;">{{ readTxt }}</div>
          </sc-if>
          <span style="flex:1 1 auto;min-width:0;"></span>
          <div style="flex:0 0 auto;background:rgba(23,24,26,.78);color:#fff;font-family:var(--font-mono,monospace);font-size:11px;line-height:1.6;padding:6px 10px;border-radius:5px;white-space:pre;">{{ liveTxt }}</div>
        </div>
      </div>

      <div style="display:flex;flex-wrap:wrap;gap:5px;padding:10px 20px;border-top:2px solid #eee;flex:0 0 auto;">
        <sc-for list="{{ testRows }}" as="t" hint-placeholder-count="12">
          <button onClick="{{ t.on }}" title="{{ t.title }}" style="height:30px;padding:0 11px;border:1px solid #ccc;border-radius:5px;background:{{ t.bg }};color:{{ t.fg }};font-family:var(--font-mono,monospace);font-size:11px;font-weight:700;cursor:pointer;" style-hover="border-color:var(--dc-red,#c03);">{{ t.label }}</button>
        </sc-for>
      </div>
    </div>

    <sc-if value="{{ panel }}" hint-placeholder-val="{{ true }}">
      <div style="width:300px;max-width:46%;min-width:232px;flex:0 0 auto;border-left:2px solid #eee;overflow-y:auto;box-sizing:border-box;background:#fff;">

        <div style="padding:14px 20px 10px;">
          <div style="font-size:12px;font-weight:700;line-height:1.2;color:var(--color-fg-subtle,#666);">Profil</div>
          <div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;">
            <sc-for list="{{ profileRows }}" as="p" hint-placeholder-count="4">
              <button onClick="{{ p.on }}" title="{{ p.title }}" style="height:26px;padding:0 9px;border:1px solid {{ p.border }};border-radius:5px;background:{{ p.bg }};color:{{ p.fg }};font-family:var(--font-mono,monospace);font-size:10px;font-weight:700;cursor:pointer;">{{ p.label }}</button>
            </sc-for>
          </div>
          <div style="font-size:11px;line-height:1.5;color:var(--color-fg-subtle,#666);margin-top:8px;text-wrap:pretty;">{{ profileNote }}</div>
        </div>

        <div style="padding:10px 20px 6px;border-top:2px solid #eee;">
          <span style="font-size:12px;font-weight:700;line-height:1.2;color:var(--color-fg-subtle,#666);">Signale · von Hand</span>
        </div>
        <sc-for list="{{ sigRows }}" as="s" hint-placeholder-count="5">
          <div style="padding:4px 20px 8px;">
            <div style="display:flex;align-items:baseline;gap:8px;">
              <span style="font-size:12px;line-height:1.3;color:#000;flex:1 1 auto;">{{ s.label }}</span>
              <span style="font-family:var(--font-mono,monospace);font-size:11px;color:var(--color-fg-subtle,#666);">{{ s.txt }}</span>
            </div>
            <input type="range" min="{{ s.min }}" max="{{ s.max }}" step="0.01" value="{{ s.val }}" onInput="{{ s.on }}" title="{{ s.hint }}" style="width:100%;height:18px;margin:4px 0 0;display:block;cursor:pointer;">
          </div>
        </sc-for>

        <div style="padding:10px 20px 6px;border-top:2px solid #eee;">
          <span style="font-size:12px;font-weight:700;line-height:1.2;color:var(--color-fg-subtle,#666);">Fixtures</span>
        </div>
        <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
          <div style="padding:8px 20px 4px;">
            <div style="font-size:12px;font-weight:700;line-height:1.2;color:#000;">{{ g.label }}</div>
            <div style="font-size:11px;line-height:1.4;color:var(--color-fg-subtle,#666);margin-top:2px;">{{ g.note }}</div>
          </div>
          <sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="5">
            <div style="display:flex;align-items:stretch;border-top:1px solid #eee;min-width:0;">
              <sc-if value="{{ r.sel }}" hint-placeholder-val="{{ false }}">
                <div style="width:3px;background:var(--dc-red,#c03);flex:0 0 auto;"></div>
              </sc-if>
              <button onClick="{{ r.on }}" title="{{ r.title }}" style="flex:1 1 auto;min-width:0;display:flex;align-items:baseline;gap:8px;padding:7px 20px 7px 10px;border:0;background:transparent;text-align:left;cursor:pointer;font-family:inherit;" style-hover="background:#f6f6f6;">
                <span style="font-size:13px;line-height:1.3;color:#000;flex:1 1 auto;min-width:0;">{{ r.label }}</span>
                <span style="font-family:var(--font-mono,monospace);font-size:10px;color:var(--color-fg-subtle,#666);flex:0 0 auto;">{{ r.tag }}</span>
              </button>
            </div>
          </sc-for>
        </sc-for>

        <div style="padding:14px 20px 20px;border-top:2px solid #eee;">
          <div style="font-size:12px;font-weight:700;line-height:1.2;color:var(--color-fg-subtle,#666);">Offene AssetRefs</div>
          <sc-for list="{{ openRows }}" as="o" hint-placeholder-count="2">
            <div style="margin-top:8px;">
              <div style="font-size:12px;font-weight:700;line-height:1.3;color:#000;">{{ o.need }}</div>
              <div style="font-size:11px;line-height:1.5;color:var(--color-fg-subtle,#666);margin-top:2px;text-wrap:pretty;">{{ o.body }}</div>
            </div>
          </sc-for>
        </div>

      </div>
    </sc-if>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1320,&quot;height&quot;:800},&quot;startFixture&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;car_hatchback&quot;,&quot;car_sedan&quot;,&quot;car_stationwagon&quot;,&quot;car_taxi&quot;,&quot;car_police&quot;,&quot;go-kart-by-poly-by-google-3hkutvs0aav&quot;,&quot;skateboard-by-poly-by-google-7dfn4vttcwy&quot;,&quot;vehicle-monster-truck&quot;],&quot;default&quot;:&quot;car_hatchback&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Start&quot;},&quot;stageBg&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[&quot;#eeeeee&quot;,&quot;#f6f6f6&quot;,&quot;#dddddd&quot;],&quot;default&quot;:&quot;#eeeeee&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Bühne&quot;}}">
class Component extends DCLogic {
  state = {
    ready: false, err: null, loading: null, id: null, facing: 1, panel: true,
    profileId: 'CAR_CHILL_LIGHT', running: null, read: null, report: null, orientX: 0,
    sig: { speed: 0, longAccel: 0, lateral: 0, bank: 0, drift: 0 },
    live: null,
  };

  componentDidMount() {
    const go = () => this.boot();
    if (window.__KFB3D) go();
    else { this._r = go; window.addEventListener('kfb3dready', go, { once: true }); }
  }
  componentWillUnmount() {
    cancelAnimationFrame(this._raf);
    if (this._ro) this._ro.disconnect();
    if (this._r) window.removeEventListener('kfb3dready', this._r);
    if (this.renderer) this.renderer.dispose();
  }

  async boot() {
    const K = window.__KFB3D, THREE = this.THREE = K.THREE;
    const host = this.stageEl; if (!host) return;
    const [AD, CR, VD, PR, TS] = await Promise.all([
      import('./lab-v7/fixture-adapters.v2.js'),
      import('./lab-v7/carrig.v1.js'),
      import('./lab-v7/vehicle-cartoon-deformer.v2.js'),
      fetch('./lab-v7/deformer-profiles.json').then((r) => r.json()),
      fetch('./lab-v7/TEST_SEQUENCES.json').then((r) => r.json()),
    ]);
    this.AD = AD; this.CR = CR; this.VD = VD; this.PROF = PR.profiles; this.SEQ = TS.sequences;

    const renderer = this.renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    host.appendChild(renderer.domElement);
    Object.assign(renderer.domElement.style, { display: 'block', width: '100%', height: '100%' });

    const scene = this.scene = new THREE.Scene();
    scene.background = new THREE.Color(this.props.stageBg || '#eeeeee');
    const camera = this.camera = new THREE.PerspectiveCamera(30, 1, 0.01, 200);
    const controls = this.controls = new K.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x8d8a84, 0.95));
    const key = new THREE.DirectionalLight(0xffffff, 1.5);
    key.position.set(3, 5, 4); key.castShadow = true; key.shadow.mapSize.set(1024, 1024);
    Object.assign(key.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 0.1, far: 30 });
    scene.add(key);
    const rim = new THREE.DirectionalLight(0xffffff, 0.45); rim.position.set(-3, 2, -3); scene.add(rim);

    /* Schattenfänger statt eingefärbter Fläche: die Bühne bleibt neutral, damit die Karosserie
       gegen sie beurteilbar ist. */
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShadowMaterial({ opacity: 0.22 }));
    ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
    this.grid = new THREE.GridHelper(20, 20, 0xc9c9c9, 0xdedede);
    this.grid.material.transparent = true; scene.add(this.grid);
    this.arrow = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.2, 14), new THREE.MeshStandardMaterial({ color: 0xcc0033, roughness: 0.5 }));
    this.arrow.rotation.x = Math.PI / 2; scene.add(this.arrow);

    const fit = () => {
      const w = host.clientWidth, h = host.clientHeight; if (!w || !h) return;
      renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
    };
    this._ro = new ResizeObserver(fit); this._ro.observe(host); fit();

    const clock = new THREE.Clock();
    const loop = () => { this._raf = requestAnimationFrame(loop); this.tick(Math.min(0.05, clock.getDelta())); controls.update(); renderer.render(scene, camera); };
    loop();

    /* Die Naht zum Race-Runtime. Genau diese Namen stehen im Signal-Entwurf. */
    window.__cvd = {
      setSignals: (s) => { this._manual = null; if (this.deformer) this.deformer.setSignals(s); },
      railImpact: (o) => this.deformer && this.deformer.railImpact(o),
      railRelease: () => this.deformer && this.deformer.railRelease(),
      landing: (o) => this.deformer && this.deformer.landing(o),
      run: (id) => this.run(id),
      load: (id) => this.load(id),
      reset: () => this.reset(),
      profile: (id) => this.setProfile(id),
      readout: () => (this.deformer ? this.deformer.readout : null),
      nodes: () => (this.deformer ? this.deformer.nodes : null),
      fixtures: AD.ALL, open: AD.OPEN_ASSETREFS, sequences: Object.keys(TS.sequences),
    };

    await this.load(this.props.startFixture || 'car_hatchback');
  }

  async load(id) {
    const AD = this.AD, row = AD.byId(id) || AD.ALL.find((r) => r.name === id); if (!row) return;
    const THREE = this.THREE, K = window.__KFB3D;
    this.setState({ loading: row.label, err: null, read: null, running: null });
    this._seq = null;
    if (this.deformer) { this.deformer.reset(); this.deformer.dispose(); this.deformer = null; }
    if (this.rig) { this.scene.remove(this.rig.group); this.rig = null; }
    let gltf;
    try { gltf = await new K.GLTFLoader().loadAsync(row.url); }
    catch (e) {
      try { gltf = await new K.GLTFLoader().loadAsync(row.urlLatest); }
      catch (e2) { this.setState({ err: (e2.message || String(e2)).slice(0, 140), loading: null }); return; }
    }
    const orientX = AD.orientOf(row.id);
    const rig = this.rig = this.CR.analyse({ THREE, root: gltf.scene, label: row.id, upFix: !!row.upFix, orientX });
    rig.group.traverse((n) => { if (n.isMesh) { n.castShadow = true; n.frustumCulled = false; } });
    this.scene.add(rig.group);

    const profileId = row.profile && this.PROF[row.profile] ? row.profile : this.state.profileId;
    this.deformer = this.VD.createDeformer(THREE, rig, { profile: this.PROF[profileId] });
    this.wheels = new this.CR.WheelRig({ THREE, rig, facing: AD.facingOf(row.id) });

    const f = rig.frame, L = Math.max(f.length, f.width);
    this.arrow.scale.setScalar(Math.max(0.2, L * 0.3));
    this.grid.scale.setScalar(Math.max(0.12, L / 2));
    const facing = AD.facingOf(row.id);
    this.placeArrow(facing);
    const d = L * 2.3;
    /* Die Kamera steht IMMER auf derselben Seite. Vorher war ihre z-Lage mit `facing`
       multipliziert — dadurch sprang die Bühne mit, und die toy-cars (facing −z) wurden nach
       rechts gezeigt, während alle anderen nach links zeigten. Die Blickrichtung ist eine
       Eigenschaft des Modells, kein Grund, den Betrachter umzusetzen. */
    this.camera.position.set(d * 0.85, f.height * 1.3, d * 0.85);
    /* Near und Far aus der Modellgröße. Feste 0,01/200 schnitten den Poly-Go-Kart beim
       Herauszoomen ab — er ist 43 Einheiten groß, ein car_hatchback 0,5. */
    this.camera.near = Math.max(0.001, L * 0.01);
    this.camera.far = Math.max(50, L * 200);
    this.camera.updateProjectionMatrix();
    this.controls.target.set(0, f.height * 0.45, 0);

    this.setState({ ready: true, loading: null, id: row.id, facing, profileId, orientX,
      report: Object.assign({ via: row.via, pin: row.pin, dep: row.dep, format: row.format }, rig.report, { id: row.id }) });
  }

  placeArrow(facing) {
    if (!this.rig) return;
    const f = this.rig.frame;
    this.arrow.position.set(0, f.height * 0.12, (f.length / 2 + f.length * 0.22) * facing);
    this.arrow.rotation.x = facing >= 0 ? Math.PI / 2 : -Math.PI / 2;
  }

  setProfile(id) {
    if (!this.PROF[id]) return;
    this.setState({ profileId: id });
    if (this.deformer) this.deformer.setProfile(this.PROF[id]);
  }

  /** Testsequenz starten. Deterministisch: dieselbe Folge liefert dasselbe Bild. */
  run(id) {
    const s = this.SEQ[id]; if (!s || !this.deformer) return;
    this.deformer.reset();
    this._manual = null;
    this._seq = { id, steps: s.steps, t: 0, fired: new Set(), holds: [], end: s.steps[s.steps.length - 1][0] };
    this.setState({ running: id, read: s.read, sig: { speed: 0, longAccel: 0, lateral: 0, bank: 0, drift: 0 } });
  }

  reset() {
    this._seq = null; this._manual = null;
    if (this.deformer) this.deformer.reset();
    if (this.wheels) this.wheels.reset();
    this.setState({ running: null, read: null, sig: { speed: 0, longAccel: 0, lateral: 0, bank: 0, drift: 0 } });
  }

  /** Lineare Interpolation zwischen den Stützwerten der Sequenz. */
  sampleSeq(q, t) {
    const keys = ['speed', 'longAccel', 'lateral', 'bank', 'drift'];
    const out = { speed: 0, longAccel: 0, lateral: 0, bank: 0, drift: 0 };
    const pts = q.steps.filter((p) => !p[1].event);
    if (!pts.length) return out;
    let a = pts[0], b = pts[pts.length - 1];
    for (let i = 1; i < pts.length; i++) { if (t <= pts[i][0]) { a = pts[i - 1]; b = pts[i]; break; } }
    const span = b[0] - a[0], u = span > 0 ? Math.max(0, Math.min(1, (t - a[0]) / span)) : 1;
    keys.forEach((k) => {
      const va = a[1][k] != null ? a[1][k] : 0, vb = b[1][k] != null ? b[1][k] : 0;
      out[k] = va + (vb - va) * u;
    });
    return out;
  }

  tick(dt) {
    if (!this.deformer || !this.rig) return;
    const q = this._seq;
    if (q) {
      q.t += dt * 1000;
      this.deformer.setSignals(this.sampleSeq(q, q.t));
      q.steps.forEach((p, i) => {
        if (!p[1].event || q.fired.has(i) || q.t < p[0]) return;
        q.fired.add(i);
        const ev = p[1];
        if (ev.event === 'railImpact') this.deformer.railImpact({ side: ev.side, strength: ev.strength });
        if (ev.event === 'landing') this.deformer.landing({ strength: ev.strength });
        /* `hold` meldet die Wand weiter jeden Frame — der Retrigger-Test. */
        if (ev.hold) q.holds.push({ until: q.t + ev.hold, ev });
      });
      q.holds = q.holds.filter((h) => {
        if (q.t > h.until) { if (h.ev.event === 'railImpact') this.deformer.railRelease(); return false; }
        /* `contact: true` — derselbe Kontakt, nicht ein neuer Schlag. Ohne das Flag zählte der
           Deformer jede Frame-Meldung als eigenes Ereignis: 600 ms Wandkontakt ergaben gemessene
           fünf Einschläge. */
        if (h.ev.event === 'railImpact') this.deformer.railImpact({ side: h.ev.side, strength: h.ev.strength, contact: true });
        return true;
      });
      if (q.t > q.end + 400) { this._seq = null; this.setState({ running: null }); }
    } else if (this._manual) {
      this.deformer.setSignals(this._manual);
    }

    const out = this.deformer.update(dt);
    const sg = this.deformer.signals;
    if (this.wheels) {
      const f = this.rig.frame;
      /* Radlauf folgt dem Tempo-Signal. Der Faktor 4 ist die Übersetzung von normiertem Signal auf
         Fahrzeuglängen je Sekunde und rein optisch — Race besitzt das echte Tempo. */
      this.wheels.spin(dt, sg.speed * 4 * f.length);
      this.wheels.setSteer((sg.lateral * 18 + sg.drift * -10));
    }
    const step = Math.round(performance.now() / 90);
    if (step !== this._ls) {
      this._ls = step;
      this.setState({ live: { d: out.dominant, w: out.impactWeight, p: out.pose }, sig: sg });
    }
  }

  renderVals() {
    const s = this.state, AD = this.AD, r = s.report || {};
    /* `+ 0` macht aus -0 eine 0 — ohne das stand im Ruhezustand »squash -0.0 %«. */
    const n = (v, d = 2) => (v == null ? '—' : (+v + 0).toFixed(d));

    const groups = (AD ? AD.GROUPS : []).map((g) => ({
      label: g.label, note: g.note,
      rows: g.rows.map((row) => ({
        label: row.label, sel: row.id === s.id, tag: row.via === 'handoff' ? 'handoff' : 'registry',
        title: row.path + ' · ' + row.dep + ' · Profil ' + row.profile + ' · Blickrichtung ' + (row.facing > 0 ? '+z' : '−z') + ' (Annahme)',
        on: () => this.load(row.id),
      })),
    }));

    const testRows = Object.keys(this.SEQ || {}).map((k) => ({
      label: k, title: (this.SEQ[k].read || ''),
      bg: s.running === k ? 'var(--dc-red,#c03)' : '#fff',
      fg: s.running === k ? '#fff' : '#000',
      on: () => this.run(k),
    }));

    const profileRows = Object.keys(this.PROF || {}).map((k) => ({
      label: k, title: this.PROF[k].use + ' · ' + this.PROF[k].tested,
      bg: s.profileId === k ? 'var(--dc-red,#c03)' : '#fff',
      fg: s.profileId === k ? '#fff' : '#000',
      border: s.profileId === k ? 'var(--dc-red,#c03)' : '#ccc',
      on: () => this.setProfile(k),
    }));

    const sigRows = (this.VD ? this.VD.SIGNALS : []).map(([k, label, lo, hi, hint]) => ({
      label, min: lo, max: hi, hint, val: s.sig[k], txt: n(s.sig[k]),
      on: (e) => {
        const next = Object.assign({}, this.state.sig, { [k]: +e.target.value });
        this._seq = null; this._manual = next;
        this.setState({ sig: next, running: null, read: null });
      },
    }));

    const p = this.PROF ? this.PROF[s.profileId] : null;
    const live = s.live;
    return {
      stageRef: (el) => { this.stageEl = el; },
      groups, testRows, profileRows, sigRows,
      panel: s.panel, panelTxt: s.panel ? 'Hide UI' : 'Show UI',
      facingTxt: s.facing >= 0 ? '+z' : '−z',
      profileNote: p ? p.use + ' · ' + p.tested : '…',
      openRows: (AD ? AD.OPEN_ASSETREFS : []).map((o) => ({ need: o.need, body: o.why + ' — ' + o.found + ' ' + o.consequence })),
      readTxt: s.read,
      stampTxt: s.err ? 'FEHLER · ' + s.err
        : s.loading ? 'lädt ' + s.loading + ' …'
        : r.id ? r.id + ' · ' + r.wheels + ' Räder (' + r.wheelSource + ') · r ' + n(r.wheelRadius, 3) + ' · Spur ' + n(r.track, 2) + ' · Radstand ' + n(r.wheelbase, 2) + ' · ' + r.via + ' @ ' + String(r.pin).slice(0, 10)
        : 'startet …',
      liveTxt: live ? [
        'dominant   ' + live.d,
        'impact     ' + n(live.w, 2),
        'pitch      ' + n(live.p.pitch, 2) + '°',
        'roll       ' + n(live.p.roll, 2) + '°',
        'yaw        ' + n(live.p.yaw, 2) + '°',
        'squash     ' + n(live.p.squash * 100, 1) + ' %',
        'stretch    ' + n(live.p.stretch * 100, 1) + ' %',
      ].join('\n') : 'wartet',
      orientTxt: 'Orient ' + ((this.CR && this.CR.ORIENTS[s.orientX]) ? this.CR.ORIENTS[s.orientX][0] : '0°'),
      onOrient: () => { const nx = (s.orientX + 1) % 6; this.AD.rememberOrient(s.id, nx); this.load(s.id); },
      onPanel: () => this.setState({ panel: !s.panel }),
      onReset: () => this.reset(),
      onFlip: () => {
        const nx = -s.facing;
        this.AD.rememberFacing(s.id, nx);
        if (this.wheels) this.wheels.facing = nx;
        this.placeArrow(nx);
        this.setState({ facing: nx });
      },
    };
  }
}

</script>
