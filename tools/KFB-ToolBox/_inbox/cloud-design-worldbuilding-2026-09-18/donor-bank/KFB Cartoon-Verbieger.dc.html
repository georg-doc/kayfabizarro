<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#14120f;overflow:hidden;}
  a{color:#d8a24a;} a:hover{color:#f0c274;}
  input[type=range]{accent-color:#d8a24a;width:100%;}
  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:#4a4038;border-radius:5px;}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  window.__CV = { THREE, OrbitControls, RoomEnvironment, GLTFLoader };
  window.dispatchEvent(new Event('cvready'));
</script>
</helmet>
<div style="position:fixed;inset:0;background:#14120f;color:#e8e0d4;font-family:'Barlow Condensed',system-ui,sans-serif">
  <canvas ref="{{ canvasRef }}" style="position:absolute;inset:0;width:100%;height:100%;display:block"></canvas>

  <div style="position:absolute;left:16px;top:14px;max-width:calc(100% - 300px)">
    <div style="font-size:20px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase">Cartoon-Verbieger</div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8d8377;margin-top:3px;line-height:1.5">{{ status }}</div>
  </div>

  <div style="position:absolute;right:12px;top:12px;bottom:12px;width:244px;box-sizing:border-box;overflow-y:auto;display:flex;flex-direction:column;gap:13px;background:#1a1713e6;border:1px solid #2e2822;border-radius:6px;padding:12px;backdrop-filter:blur(6px)">

    <div style="display:flex;flex-direction:column;gap:5px">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;color:#9b9084">PROP-SET</span>
      <div style="display:flex;gap:4px;flex-wrap:wrap">
        <sc-for list="{{ setChips }}" as="c" hint-placeholder-count="4">
          <button onClick="{{ c.onClick }}" style="{{ c.style }}">{{ c.label }}</button>
        </sc-for>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:4px">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;color:#9b9084">PROPS — KLICK = SEED-REIHE</span>
      <sc-for list="{{ propInfo }}" as="p" hint-placeholder-count="4">
        <button onClick="{{ p.onClick }}" style="{{ p.row }}">
          <span style="font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ p.name }}</span>
          <span style="{{ p.badge }}">{{ p.tag }}</span>
        </button>
      </sc-for>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;line-height:1.5;color:#6f665c">Unter vier Höhen-Ringen schert ein Netz statt zu biegen — solche Props laufen automatisch auf Neigen + Verjüngen.</div>
      <sc-if value="{{ hasMore }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:4px;margin-top:4px">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;color:#9b9084">WEITERE IM PACK</span>
          <div style="display:flex;gap:3px;flex-wrap:wrap">
            <sc-for list="{{ moreProps }}" as="m" hint-placeholder-count="8">
              <button onClick="{{ m.onClick }}" style="{{ m.style }}">{{ m.label }}</button>
            </sc-for>
          </div>
        </div>
      </sc-if>
    </div>

    <div style="height:1px;background:#2e2822"></div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;color:#9b9084">GRENZEN FÜRS SET</span>
      <label style="display:flex;flex-direction:column;gap:2px">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#9b9084;display:flex;justify-content:space-between;gap:8px">BIEGEN<span style="color:#d8a24a">{{ vBend }}</span></span>
        <input type="range" min="0" max="0.3" step="0.005" value="{{ pBend }}" onChange="{{ setBend }}">
      </label>
      <label style="display:flex;flex-direction:column;gap:2px">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#9b9084;display:flex;justify-content:space-between;gap:8px">NEIGEN<span style="color:#d8a24a">{{ vLean }}</span></span>
        <input type="range" min="0" max="0.25" step="0.005" value="{{ pLean }}" onChange="{{ setLean }}">
      </label>
      <label style="display:flex;flex-direction:column;gap:2px">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#9b9084;display:flex;justify-content:space-between;gap:8px">VERJÜNGEN<span style="color:#d8a24a">{{ vTaper }}</span></span>
        <input type="range" min="0" max="0.5" step="0.01" value="{{ pTaper }}" onChange="{{ setTaper }}">
      </label>
      <label style="display:flex;flex-direction:column;gap:2px">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#9b9084;display:flex;justify-content:space-between;gap:8px">VERDREHEN °<span style="color:#d8a24a">{{ vTwist }}</span></span>
        <input type="range" min="0" max="30" step="0.5" value="{{ pTwist }}" onChange="{{ setTwist }}">
      </label>
      <label style="display:flex;flex-direction:column;gap:2px">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#9b9084;display:flex;justify-content:space-between;gap:8px">SQUASH<span style="color:#d8a24a">{{ vSquash }}</span></span>
        <input type="range" min="0" max="0.2" step="0.005" value="{{ pSquash }}" onChange="{{ setSquash }}">
      </label>
      <button onClick="{{ reset }}" style="{{ plainBtn }}">STARTWERTE (§7)</button>
    </div>

    <div style="height:1px;background:#2e2822"></div>

    <div style="display:flex;flex-direction:column;gap:6px">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.12em;color:#9b9084">SEED</span>
      <div style="display:flex;gap:5px;align-items:center">
        <input type="range" min="1" max="999" step="1" value="{{ pSeed }}" onChange="{{ setSeed }}">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#d8a24a;min-width:30px;text-align:right">{{ vSeed }}</span>
      </div>
      <button onClick="{{ toggleInst }}" style="{{ instStyle }}">{{ instLabel }}</button>
      <div style="display:flex;gap:4px;flex-wrap:wrap">
        <sc-for list="{{ modeChips }}" as="m" hint-placeholder-count="3">
          <button onClick="{{ m.onClick }}" style="{{ m.style }}">{{ m.label }}</button>
        </sc-for>
      </div>
      <label style="display:flex;flex-direction:column;gap:2px;margin-top:3px">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#9b9084;display:flex;justify-content:space-between;gap:8px">A / B<span style="color:#d8a24a">{{ vMix }}</span></span>
        <input type="range" min="0" max="1" step="0.02" value="{{ pMix }}" onChange="{{ setMix }}">
      </label>
    </div>

    <div style="display:flex;gap:5px;flex-wrap:wrap">
      <button onClick="{{ toggleSpin }}" style="{{ spinStyle }}">DREHEN</button>
      <button onClick="{{ doExport }}" style="{{ goldBtn }}">EXPORT</button>
    </div>
  </div>

  <sc-if value="{{ exportOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;background:#0c0a08e8;display:flex;align-items:center;justify-content:center;padding:34px">
      <div style="background:#1a1713;border:1px solid #3a332b;border-radius:7px;padding:15px;width:100%;max-width:640px;display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
          <div style="font-size:17px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase">Parametersatz</div>
          <button onClick="{{ closeExport }}" style="{{ plainBtn }}">SCHLIESSEN</button>
        </div>
        <textarea readonly style="width:100%;height:230px;background:#0f0d0b;border:1px solid #2e2822;border-radius:5px;color:#b9ae9f;font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.55;padding:10px;resize:none;box-sizing:border-box">{{ exportText }}</textarea>
        <div style="display:flex;gap:8px;align-items:center">
          <button onClick="{{ copyExport }}" style="{{ goldBtn }}">{{ copyLabel }}</button>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#8d8377">Geht so an den Scatter — ein Satz pro Prop-Set.</span>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
// Kandidaten-Sets aus dem Asset-Repo. Absichtlich gemischt: hohe schlanke Props (Türme,
// Grabsteine) zeigen den Bogen, kompakte (Fässer, Kisten) zeigen den Scher-Haken aus §5.
const SETS = [
  { id: 'graveyard', label: 'Graveyard', pack: 'GLB_graveyard', want: ['gravestone-cross-large', 'gravestone-bevel', 'gravestone-broken', 'pillar-obelisk', 'lightpost-single', 'altar-stone'] },
  { id: 'pirate', label: 'Pirate', pack: 'GLB_pirate', want: ['tower', 'palm-long', 'barrel', 'crate', 'flag', 'ship-mast'] },
  { id: 'nature', label: 'Nature', pack: 'kenney_nature-kit', want: ['statue_obelisk', 'tree_pineTallA', 'tree_default', 'rock_tallA', 'mushroom_redTall', 'stump_old'] },
  { id: 'towers', label: 'Türme', pack: 'GLB_hexagon_kit', want: ['building-tower', 'building-wizard-tower', 'building-castle', 'building-windmill', 'building-house', 'building-mill'] },
];
const ROW = 7;   // dasselbe Prop, sieben Seeds — Set-Konsistenz auf einen Blick

class Component extends DCLogic {
  state = {
    status: 'lädt three und Asset-Index …', set: 'graveyard',
    bend: 0.06, lean: 0.05, taper: 0.12, twist: 6, squash: 0.03,
    seed: 42, perInstance: true, mode: 'auto', mix: 1, lead: null,
    spin: true, propInfo: [], exportOpen: false, copied: false,
  };

  componentWillUnmount() {
    this.stop = true;
    if (this.r) this.r.dispose();
    window.removeEventListener('resize', this.onResize);
  }

  async boot() {
    if (!this.canvas || this.booted) return;
    if (!window.__CV) { window.addEventListener('cvready', () => this.boot(), { once: true }); return; }
    this.booted = true;
    window.__CVB = this;
    const { THREE, OrbitControls, RoomEnvironment, GLTFLoader } = window.__CV;
    const T = this.T = THREE;
    this.CD = await import('./kfb-cartoon-deform.js');
    this.loader = new GLTFLoader();

    const r = this.r = new T.WebGLRenderer({ canvas: this.canvas, antialias: true, preserveDrawingBuffer: true });
    r.setPixelRatio(Math.min(devicePixelRatio, 2));
    r.outputColorSpace = T.SRGBColorSpace;
    r.toneMapping = T.ACESFilmicToneMapping;
    r.toneMappingExposure = 0.95;
    r.shadowMap.enabled = true; r.shadowMap.type = T.PCFSoftShadowMap;

    const scene = this.scene = new T.Scene();
    scene.background = new T.Color(0x1b1815);
    const cam = this.cam = new T.PerspectiveCamera(38, 1, 0.1, 400);
    cam.position.set(0, 7, 26);
    const ctr = this.ctr = new OrbitControls(cam, r.domElement);
    ctr.target.set(0, 3, 0);
    ctr.enableDamping = true; ctr.dampingFactor = 0.08;
    ctr.maxPolarAngle = Math.PI * 0.495; ctr.minDistance = 5; ctr.maxDistance = 90;
    ctr.autoRotate = this.state.spin; ctr.autoRotateSpeed = 0.4;

    const pm = new T.PMREMGenerator(r);
    scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.add(new T.HemisphereLight(0xffe9cc, 0x2a2520, 0.42));
    const sun = new T.DirectionalLight(0xfff3e0, 2);
    sun.position.set(9, 16, 7); sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.normalBias = 0.03;
    const c = sun.shadow.camera; c.left = -22; c.right = 22; c.top = 22; c.bottom = -22; c.near = 1; c.far = 60;
    c.updateProjectionMatrix();
    scene.add(sun);

    const g = new T.Mesh(new T.PlaneGeometry(120, 120), new T.MeshStandardMaterial({ color: 0x2b251f, roughness: 1 }));
    g.rotation.x = -Math.PI / 2; g.receiveShadow = true; scene.add(g);
    this.rig = new T.Group(); scene.add(this.rig);

    this.repo = await (await fetch('./asset-repo.json')).json();
    await this.loadSet();

    this.onResize = () => {
      const w = this.canvas.clientWidth || 1, h = this.canvas.clientHeight || 1;
      r.setSize(w, h, false);
      const full = w + 256;
      cam.aspect = full / h;
      cam.setViewOffset(full, h, 256, 0, w, h);
      cam.updateProjectionMatrix();
      this.fitCamera();
    };
    window.addEventListener('resize', this.onResize); this.onResize();

    let last = performance.now();
    const loop = () => {
      if (this.stop || !this.canvas || !this.canvas.isConnected) return;
      requestAnimationFrame(loop);
      const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (this.canvas.clientWidth !== this._w) { this._w = this.canvas.clientWidth; this.onResize(); }
      this.t = (this.t || 0) + dt;
      (this.handles || []).forEach((h) => h.update(this.t));
      this.ctr.update();
      r.render(scene, cam);
    };
    loop();
  }

  url(name) {
    const a = (this.repo.assets || []).find((x) => x.name === name);
    return a ? (a.ghUrl || (this.repo.rawBase + a.pack + '/' + a.name + '.glb')) : null;
  }

  /**
   * `want` ist eine WUNSCHLISTE, keine Wahrheit: die Namen im Repo aendern sich, und geratene
   * Namen fielen still durch (Pirate lud nur drei Props, ohne ein einziges hohes — genau das, woran
   * man den Bogen beurteilt). Aufgefuellt wird deshalb aus dem echten Pack-Inhalt, und mindestens
   * ein hohes, schlankes Prop wird erzwungen.
   */
  resolveSet(set) {
    const all = (this.repo.assets || []).filter((a) => a.pack === set.pack).map((a) => a.name);
    const TALL = /tower|mast|obelisk|pillar|palm|tree|statue|lightpost|lamp|chimney|cross|windmill|watermill|mill|flag/i;
    const out = set.want.filter((n) => all.includes(n));
    // Vom Nutzer gewaehltes Leitprop hat Vorrang vor der Wunschliste.
    if (this.state.lead && all.includes(this.state.lead) && !out.includes(this.state.lead)) out.unshift(this.state.lead);
    if (!out.some((n) => TALL.test(n))) {
      const tall = all.find((n) => TALL.test(n) && !out.includes(n));
      if (tall) out.unshift(tall);
    }
    for (const n of all) {
      if (out.length >= 6) break;
      if (!out.includes(n)) out.push(n);
    }
    // Das erste Prop tragt die Seed-Reihe — dafuer ist ein hohes, schlankes das beste Anschauungs-
    // objekt: an einer Kiste sieht man den Bogen nicht. Der Nutzer kann es im Dock umstellen.
    const pick = this.state.lead && out.includes(this.state.lead) ? this.state.lead : out.find((n) => TALL.test(n));
    const i = out.indexOf(pick);
    if (i > 0) out.unshift(out.splice(i, 1)[0]);
    this.packNames = all;
    return out.slice(0, 6);
  }

  async load(url) {
    return new Promise((res) => this.loader.load(url, (gl) => res(gl.scene), undefined, () => res(null)));
  }

  /**
   * Der Aufbau IST der Test (§6): oben eine Reihe desselben Props mit verschiedenen Seeds — da
   * sieht man Set-Konsistenz (alle gleiche Sprache, keiner gleich) —, unten je ein Exemplar der
   * anderen Props des Sets mit demselben Grenzsatz. Was schert statt zu biegen, fällt sofort auf.
   */
  async loadSet() {
    const T = this.T, s = this.state;
    (this.handles || []).forEach((h) => h.dispose());
    this.handles = [];
    while (this.rig.children.length) this.rig.remove(this.rig.children[0]);
    const set = SETS.find((x) => x.id === s.set) || SETS[0];
    const names = this.resolveSet(set);
    if (!names.length) { this.setState({ status: 'Set »' + set.label + '« nicht im Asset-Index gefunden' }); return; }
    this.setState({ status: 'lädt ' + names.length + ' Props aus ' + set.pack + ' …' });

    const objs = {};
    for (const n of names) {
      const o = await this.load(this.url(n));
      if (o) objs[n] = o;
    }
    const keys = Object.keys(objs);
    if (!keys.length) { this.setState({ status: 'GLBs nicht erreichbar' }); return; }

    const info = [];
    const place = (src, x, z, seed, tag) => {
      const o = src.clone(true);
      // NORMIERT WIRD DIE GROESSTE DIMENSION, nicht die Höhe. Auf gleiche Höhe skaliert wird eine
      // flache Platte absurd breit — die untere Reihe verschmolz dadurch zu einem Klotz, in dem
      // man gerade nicht mehr sah, welches Prop biegt und welches schert.
      const box = new T.Box3().setFromObject(o), size = new T.Vector3(); box.getSize(size);
      const k = 5.2 / Math.max(0.001, Math.max(size.x, size.y, size.z));
      o.scale.setScalar(k);
      o.position.set(x, -box.min.y * k, z);
      o.userData.halfW = Math.max(size.x, size.z) * k * 0.5;
      o.traverse((m) => { if (m.isMesh) m.castShadow = m.receiveShadow = true; });
      this.rig.add(o);
      const h = this.CD.applyCartoonDeform(T, o, {
        limits: this.limits(), mode: s.mode,
        seed: s.perInstance ? seed : s.seed,
      });
      h.setMix(s.mix);
      this.handles.push(h);
      if (tag) info.push({ name: tag, segs: Math.max(...h.info.map((i) => i.segmentsY)), bendable: h.info.some((i) => i.bendable) });
      return o;
    };

    // REIHEN AUS DEN GEMESSENEN BREITEN, nicht aus festen Abstaenden: erst alles auf x = 0 setzen,
    // dann mit der eigenen Halbbreite plus Luft aufreihen und die Reihe zentrieren. Feste 4.6 bzw.
    // 5.4 Einheiten liessen breite Props ineinanderlaufen.
    const row = (list, z, seedAt, tagAt) => {
      const objs2 = list.map((it, i) => place(it, 0, z, seedAt(i), tagAt(i)));
      const GAP = 1.1;
      let cur = 0;
      const xs = objs2.map((o) => { const x = cur + o.userData.halfW; cur = x + o.userData.halfW + GAP; return x; });
      const shift = cur > 0 ? (cur - GAP) / 2 : 0;
      objs2.forEach((o, i) => { o.position.x = xs[i] - shift; });
      return cur - GAP;
    };

    const first = objs[keys[0]];
    const wTop = row(Array.from({ length: ROW }, () => first), 0,
      (i) => (s.seed + i * 977) >>> 0, (i) => (i === 0 ? keys[0] : null));
    const rest = keys.slice(1).map((n) => objs[n]);
    const wBot = rest.length ? row(rest, -9, (i) => (s.seed + (i + 31) * 613) >>> 0, (i) => keys[i + 1]) : 0;
    this.spanX = Math.max(wTop, wBot);
    this.fitCamera();

    this.setState({
      propInfo: info,
      status: set.label + ' · ' + keys.length + ' Props · obere Reihe: ' + keys[0] + ' × ' + ROW + ' Seeds',
    });
  }

  /**
   * Kamera aus der ECHTEN Spanne rechnen, nicht cam.z hart setzen. Und gegen die FREIE Breite,
   * nicht gegen die Canvas-Breite: das Dock deckt rechts 256 px ab, und `setViewOffset` schiebt
   * den Inhalt genau darum nach links — eine Instanz stand sonst ausserhalb des Bildes.
   */
  fitCamera() {
    if (!this.cam || !this.canvas) return;
    const w = this.canvas.clientWidth || 1, h = this.canvas.clientHeight || 1;
    const free = Math.max(120, w - 256);
    const tan = Math.tan((this.cam.fov * Math.PI / 180) / 2);
    // RESERVE FUER DIE VERFORMUNG: Box3 kennt den Vertex-Shader nicht. Bogen und Neigung schieben
    // bis (bend + lean) × Prop-Hoehe nach aussen — bei Reglermaximum sind das fast drei Einheiten
    // je Seite. Ohne diese Reserve schneidet das Fenster an, sobald man aufdreht.
    const L = this.limits();
    const halfW = (this.spanX || 24) / 2 + (L.bend + L.lean) * 5.2 + 0.4;
    // AZIMUT-FEST einpassen: beim Drehen wird die Tiefe zur Breite. Der wirksame Radius ist die
    // Diagonale aus Halbbreite und Halbtiefe, nicht die Halbbreite — sonst passt es nur frontal.
    const halfD = 4.5 + 2.6;                             // Reihenabstand/2 + halbe Prop-Tiefe
    const R = Math.sqrt(halfW * halfW + halfD * halfD);
    // Und gerechnet gegen die NAECHSTE Ebene, nicht gegen das Orbit-Zentrum: dort ist das Fenster
    // schmaler. Deshalb steckt halfD als Zuschlag in der Distanz.
    const dH = (R * 1.06) * h / (tan * free) + halfD;
    const dV = (15 * 0.62) / tan + halfD;
    const d = Math.max(dH, dV, 12);
    // MINDEST-ELEVATION, statt den Winkel aus der Startposition zu erben: die beiden Reihen sind
    // nur in z getrennt, bei 9° Blickwinkel ergeben 9 Einheiten Tiefe kaum 1.4 Einheiten Versatz im
    // Bild — die hintere Reihe lag zu drei Vierteln hinter der vorderen. Azimut bleibt (der Nutzer
    // darf drehen), die Hoehe wird erzwungen.
    const raw = this.cam.position.clone().sub(this.ctr.target).normalize();
    const az = Math.atan2(raw.x, raw.z);
    const el = Math.max(Math.asin(Math.max(-1, Math.min(1, raw.y))), 27 * Math.PI / 180);
    const dir = new this.T.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
    // ORBIT-ZENTRUM IST DER SCHWERPUNKT DES INHALTS (Mitte zwischen den Reihen), nicht die vordere
    // Reihenebene. Kreist die Kamera um z = 0, schwingt die hintere Reihe auf 4.5 Einheiten Radius
    // seitlich aus dem Bild — die Autorotation warf sie nach wenigen Sekunden hinaus.
    this.ctr.target.set(0, 2.6, -4.5);
    this.cam.position.copy(this.ctr.target).add(dir.multiplyScalar(d));
    this.ctr.minDistance = Math.min(6, d * 0.4);
    this.ctr.maxDistance = d * 3.2;
    this.ctr.update();
  }

  limits() {
    const s = this.state;
    return { bend: s.bend, lean: s.lean, taper: s.taper, twist: s.twist, squash: s.squash };
  }

  live(patch) {
    this.setState(patch, () => {
      const s = this.state;
      if (patch.set || patch.lead) { this.loadSet(); return; }
      if (patch.perInstance != null) { this.loadSet(); return; }
      (this.handles || []).forEach((h, i) => {
        h.setLimits(this.limits());
        if (patch.mode) h.setMode(s.mode);
        if (patch.seed != null) h.setSeed(s.perInstance ? (s.seed + i * 977) >>> 0 : s.seed);
        if (patch.mix != null) h.setMix(s.mix);
      });
      // Biegen und Neigen aendern die Aussenkante, also muss die Kamera mitgehen.
      if (patch.bend != null || patch.lean != null) this.fitCamera();
      if (patch.spin != null && this.ctr) this.ctr.autoRotate = s.spin;
    });
  }

  chip(active, extra) {
    return 'border:1px solid ' + (active ? '#d8a24a' : '#3a332b') + ';background:' + (active ? '#2a2013' : '#1c1915')
      + ';color:' + (active ? '#f0c274' : '#9b9084') + ";font-family:'Barlow Condensed',sans-serif;font-size:11.5px;"
      + 'font-weight:600;letter-spacing:0.05em;padding:3px 9px;border-radius:3px;cursor:pointer;text-transform:uppercase;' + (extra || '');
  }

  renderVals() {
    const s = this.state, num = (v, d) => Number(v).toFixed(d);
    this._cref = this._cref || ((el) => { if (el && el !== this.canvas) { this.canvas = el; this.boot(); } });
    return {
      canvasRef: this._cref, status: s.status,
      plainBtn: this.chip(false, 'align-self:flex-start;padding:4px 10px'),
      goldBtn: "border:1px solid #d8a24a;background:#2a2013;color:#f0c274;font-family:'Barlow Condensed',sans-serif;font-size:11.5px;font-weight:600;letter-spacing:0.08em;padding:4px 11px;border-radius:3px;cursor:pointer",
      setChips: SETS.map((x) => ({ label: x.label, style: this.chip(s.set === x.id), onClick: () => this.live({ set: x.id }) })),
      pBend: s.bend, vBend: num(s.bend, 3), setBend: (e) => this.live({ bend: +e.target.value }),
      pLean: s.lean, vLean: num(s.lean, 3), setLean: (e) => this.live({ lean: +e.target.value }),
      pTaper: s.taper, vTaper: num(s.taper, 2), setTaper: (e) => this.live({ taper: +e.target.value }),
      pTwist: s.twist, vTwist: num(s.twist, 1), setTwist: (e) => this.live({ twist: +e.target.value }),
      pSquash: s.squash, vSquash: num(s.squash, 3), setSquash: (e) => this.live({ squash: +e.target.value }),
      reset: () => this.live({ bend: 0.06, lean: 0.05, taper: 0.12, twist: 6, squash: 0.03 }),
      pSeed: s.seed, vSeed: String(s.seed), setSeed: (e) => this.live({ seed: +e.target.value }),
      instStyle: this.chip(s.perInstance, 'width:100%'),
      instLabel: s.perInstance ? 'Per-Instanz-Seed an' : 'alle gleich (Seed fix)',
      toggleInst: () => this.live({ perInstance: !s.perInstance }),
      modeChips: [['auto', 'Auto'], ['full', 'Biegen'], ['tilt', 'nur Neigen']].map(([v, l]) => ({
        label: l, style: this.chip(s.mode === v), onClick: () => this.live({ mode: v }),
      })),
      pMix: s.mix, vMix: num(s.mix, 2), setMix: (e) => this.live({ mix: +e.target.value }),
      // Die Prop-Liste ist BEDIENBAR, nicht nur Anzeige: Klick macht ein Prop zum Leitprop der
      // Seed-Reihe. Vorher stand die Auswahl nur im Code (`SETS.want`) und war von hier nicht
      // einzusehen, geschweige denn zu aendern.
      propInfo: s.propInfo.map((p, i) => ({
        name: (i === 0 ? '▸ ' : '') + p.name,
        tag: p.bendable ? p.segs + ' Ringe' : 'schert (' + p.segs + ')',
        onClick: () => this.live({ lead: p.name }),
        row: 'display:flex;justify-content:space-between;gap:8px;align-items:baseline;width:100%;cursor:pointer;'
          + 'border:1px solid ' + (i === 0 ? '#d8a24a' : '#00000000') + ';background:' + (i === 0 ? '#2a2013' : '#00000000')
          + ";border-radius:3px;padding:2px 5px;color:#e8e0d4;font-family:'Barlow Condensed',sans-serif;text-align:left",
        badge: 'font-family:\'IBM Plex Mono\',monospace;font-size:9.5px;padding:1px 6px;border-radius:2px;white-space:nowrap;'
          + (p.bendable ? 'background:#1d2b1b;color:#a8d49b;border:1px solid #4d7a45' : 'background:#2b2618;color:#ddc27a;border:1px solid #7d6a35'),
      })),
      moreProps: (this.packNames || []).filter((n) => !s.propInfo.some((p) => p.name === n)).slice(0, 14).map((n) => ({
        label: n, style: this.chip(false, 'font-size:10.5px;padding:2px 6px;text-transform:none'),
        onClick: () => this.live({ lead: n }),
      })),
      hasMore: (this.packNames || []).length > s.propInfo.length,
      spinStyle: this.chip(s.spin), toggleSpin: () => this.live({ spin: !s.spin }),
      exportOpen: s.exportOpen,
      doExport: () => this.setState({ exportOpen: true, copied: false }),
      closeExport: () => this.setState({ exportOpen: false }),
      copyLabel: s.copied ? 'KOPIERT' : 'IN ZWISCHENABLAGE',
      exportText: JSON.stringify({
        $schema: 'kfb.cartoon-deform/0.1',
        propSet: s.set,
        limits: this.limits(),
        mode: s.mode,
        perInstanceSeed: s.perInstance,
        note: 'Grenzen gelten fuer das ganze Set. Jede Instanz zieht ihre Werte daraus per mulberry32(instanzSeed ^ zonenSeed) — gleicher Seed, gleiche Form.',
        bendable: s.propInfo.map((p) => ({ prop: p.name, segmentsY: p.segs, bendable: p.bendable })),
      }, null, 2),
      copyExport: (e) => {
        const ta = e.target.parentElement.parentElement.querySelector('textarea');
        navigator.clipboard.writeText(ta.value).then(() => this.setState({ copied: true }));
      },
    };
  }
}
</script>
</body>
</html>
