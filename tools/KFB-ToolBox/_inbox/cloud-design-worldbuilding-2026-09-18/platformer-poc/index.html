<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KFB Free Roam · Platformer Hub POC v0</title>
<style>
  :root{
    --ink:#22201c; --ink-soft:#5d574d; --paper:#f7f3ea; --paper-2:#fffdf8;
    --line:#ddd4c2; --accent:#c2761f; --accent-soft:#f0d9b4; --ok:#5b7a4a;
    --sans: ui-sans-serif, "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#9ec7d8;overflow:hidden;font-family:var(--sans);color:var(--ink)}
  #view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #hud{position:fixed;inset:0;pointer-events:none;font-size:13px}
  #hud button,#hud select,#hud input,#hud a{pointer-events:auto;font-family:inherit}

  .bar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;
       padding:10px 14px;background:linear-gradient(#f7f3eaf2,#f7f3eac2);border-bottom:1px solid var(--line)}
  .brand{font-size:13px;letter-spacing:.02em;color:var(--ink-soft)}
  .brand b{color:var(--ink);font-weight:650}
  .tag{font-family:var(--mono);font-size:10px;padding:2px 6px;border:1px solid var(--line);border-radius:999px;color:var(--ink-soft)}
  .seg{display:flex;gap:0;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper-2);padding:0;cursor:pointer}
  .seg span{padding:6px 14px;font-size:12px;color:var(--ink-soft);display:block}
  .seg span.on{background:var(--accent);color:#fff}
  .score{font-family:var(--mono);font-size:11px;color:var(--ink-soft);line-height:1.35;max-width:300px}
  .score b{color:var(--ink)}
  .right{margin-left:auto;display:flex;gap:8px}
  .btn{background:var(--paper-2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--ink);cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn.ghost{background:transparent}

  .panel{position:absolute;top:52px;background:var(--paper);border:1px solid var(--line);border-radius:12px;
         box-shadow:0 12px 30px #2a231a26;pointer-events:auto;max-height:calc(100% - 90px);overflow:auto}
  .panel.hidden{display:none}
  .panel h3{margin:0;padding:12px 14px 8px;font-size:12px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft)}
  .panel h3 em{display:block;text-transform:none;letter-spacing:0;font-style:normal;font-size:11px;color:#8a8275;margin-top:3px}
  .actors{right:14px;width:250px}
  .lab{right:14px;width:320px}
  .actors .group{padding:10px 14px 4px;font-family:var(--mono);font-size:10px;color:#8a8275;text-transform:uppercase;letter-spacing:.08em}
  .actors .actor{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;
        border-top:1px solid #0000;padding:7px 14px;font-size:13px;color:var(--ink);cursor:pointer}
  .actors .actor:hover{background:var(--accent-soft)}
  .actors .actor.on{background:var(--accent);color:#fff}
  .actors .actor i{font-style:normal;font-family:var(--mono);font-size:9px;opacity:.7;border:1px solid currentColor;border-radius:999px;padding:1px 5px}
  .labbody{padding:2px 14px 8px;font-size:12px}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px dotted #e3dbca}
  .kv span{color:var(--ink-soft)}
  .kv b{font-family:var(--mono);font-size:11px;font-weight:500;text-align:right;max-width:190px;word-break:break-word}
  .row{display:flex;align-items:center;gap:10px;padding:7px 14px;border-top:1px solid var(--line)}
  .row label{font-size:11px;color:var(--ink-soft);min-width:84px}
  .row select,.row input{flex:1;min-width:0;background:var(--paper-2);border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-size:12px;color:var(--ink)}

  .overlay{position:absolute;inset:0;display:grid;place-items:center;background:#1c18124d;pointer-events:auto}
  .overlay.hidden{display:none}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 24px;max-width:460px;box-shadow:0 20px 50px #2a231a3a}
  .card h3{margin:0 0 12px;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft)}
  .card table{width:100%;border-collapse:collapse;font-size:13px}
  .card td{padding:4px 0;vertical-align:top}
  .card td:first-child{font-family:var(--mono);font-size:11px;color:var(--accent);width:92px;white-space:nowrap}
  .card .fine{font-size:12px;color:var(--ink-soft);line-height:1.5;margin:14px 0 16px}

  .labels{position:absolute;inset:0}
  .label{position:absolute;transform:translate(-50%,-100%);text-align:center;white-space:nowrap;
         font-size:12px;color:#2b2519;text-shadow:0 1px 0 #ffffffb0}
  .label b{display:block;font-weight:650}
  .label span{display:block;font-size:10px;font-family:var(--mono);color:#5d574d}

  .prompt{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;
          background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:8px 14px;box-shadow:0 8px 22px #2a231a2e;pointer-events:auto}
  .prompt.hidden{display:none}
  .prompt b{font-size:13px}
  .prompt span{font-size:11px;color:var(--ink-soft)}
  .prompt a{font-size:12px;color:var(--accent);text-decoration:none;border-bottom:1px solid #c2761f55}
  .prompt a:hover{color:#8f560f;border-bottom-color:#8f560f}
  .prompt em{font-style:normal;font-family:var(--mono);font-size:10px;color:#8a8275}
  .prompt kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--ink-soft)}

  .loading{position:absolute;inset:0;display:grid;place-items:center;background:#f7f3eaef;transition:opacity .5s;pointer-events:auto}
  .loading.gone{opacity:0;pointer-events:none}
  .loading b{display:block;font-size:15px;margin-bottom:6px}
  .loading span{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
  .loading div{text-align:center}

  .fatal{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;background:var(--paper);padding:30px;text-align:center}
  .fatal span{font-family:var(--mono);font-size:12px;color:#9a3b1f}

  @media (max-width:760px){
    .bar{flex-wrap:wrap;gap:8px;padding:8px 10px}
    .score{order:5;width:100%}
    .actors,.lab{right:8px;left:8px;width:auto}
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
