<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Platformer Kit Atlas S0 · KFB</title>
<style>
  :root{
    --ink:#22201c; --ink-soft:#5d574d; --paper:#f7f3ea; --paper-2:#fffdf8;
    --line:#ddd4c2; --accent:#c2761f; --accent-soft:#f0d9b4; --ok:#3f7d3a; --bad:#a83a1f; --blue:#2f6ea8;
    --sans: ui-sans-serif, "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:13px}
  a{color:var(--accent);text-decoration:none;border-bottom:1px solid #c2761f55}
  a:hover{color:#8f560f;border-bottom-color:#8f560f}

  header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;
         padding:9px 14px;background:linear-gradient(#f7f3eafa,#f7f3eae8);border-bottom:1px solid var(--line);
         backdrop-filter:blur(6px)}
  .brand{font-size:13px;color:var(--ink-soft)}
  .brand b{color:var(--ink);font-weight:650}
  .tag{font-family:var(--mono);font-size:10px;padding:2px 6px;border:1px solid var(--line);border-radius:999px;color:var(--ink-soft)}
  .meta{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);line-height:1.5}
  .meta b{color:var(--ink);font-weight:600}
  .meta em{font-style:normal}
  .bad{color:var(--bad)}
  .spacer{margin-left:auto}
  #tabs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper-2)}
  #tabs button{border:0;background:none;padding:6px 13px;font:inherit;font-size:12px;color:var(--ink-soft);cursor:pointer}
  #tabs button.on{background:var(--accent);color:#fff}
  select,input[type=checkbox]{font:inherit}
  select{background:var(--paper-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;color:var(--ink);max-width:190px}
  .chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft)}
  .btn{background:var(--paper-2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;font-size:12px;color:var(--ink);cursor:pointer}
  .btn:hover{border-color:var(--accent)}

  main{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:0;align-items:start}
  .content{padding:14px 14px 60px;min-width:0}
  #table,#facts{padding:0 0 40px}

  .fam h2{display:flex;align-items:baseline;gap:10px;margin:18px 0 8px;font-size:12px;font-weight:650;
          letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
  .fam h2 em{font-style:normal;font-family:var(--mono);font-size:10px;color:#8a8275;letter-spacing:0;text-transform:none}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
  .card{background:var(--paper-2);border:1px solid var(--line);border-radius:11px;padding:8px;cursor:pointer;
        display:flex;flex-direction:column;gap:4px}
  .card:hover{border-color:var(--accent)}
  .card.on{border-color:var(--accent);box-shadow:0 0 0 2px #c2761f33}
  .card.busy{opacity:.65}
  .card.failed{border-color:#a83a1f66;background:#fdf1ec}
  .card canvas{width:100%;aspect-ratio:1;border-radius:7px;background:#f2ece0;display:block}
  .card h3{margin:2px 0 0;font-size:11.5px;font-weight:600;line-height:1.25;word-break:break-word}
  .card .st{margin:0;font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;color:#8a8275}
  .card .st.role{color:var(--ok)}
  .card .st.r-PROP{color:var(--ink-soft)}
  .card .st.r-CENTER{color:var(--bad)}
  .card .st.r-PANEL_WALL,.card .st.r-PANEL_LID_TOP,.card .st.r-PANEL_LID_BOTTOM,.card .st.r-BOTTOM{color:var(--accent)}
  .card .st.r-SIDE,.card .st.r-CORNER,.card .st.r-END,.card .st.r-SPAN{color:var(--blue)}
  .card .st.warn{color:var(--accent)}
  .card .st.bad{color:var(--bad)}
  .card .dim{margin:0;font-family:var(--mono);font-size:9.5px;color:var(--ink-soft)}

  #detail{position:sticky;top:48px;height:calc(100vh - 48px);overflow:auto;border-left:1px solid var(--line);
          background:var(--paper-2);padding:0 0 40px}
  #detail.wide{opacity:1}
  #viewer{height:300px;background:#eee7d9;border-bottom:1px solid var(--line);position:relative}
  .dhead{padding:10px 13px 6px}
  .dhead h3{margin:0;font-size:14px;font-weight:650}
  .dhead p{margin:3px 0 0;font-family:var(--mono);font-size:10px;color:var(--ink-soft);word-break:break-all}
  .toggles{display:flex;flex-wrap:wrap;gap:8px 12px;padding:8px 13px;border-bottom:1px solid var(--line);
           border-top:1px solid var(--line);background:var(--paper)}
  .toggles label{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-soft)}
  .block,.fblock{padding:10px 13px 12px;border-bottom:1px solid var(--line)}
  .block h4,.fblock h4{margin:0 0 6px;font-size:10.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dotted #e6dfce}
  .kv span{color:var(--ink-soft);font-size:11.5px;flex:0 0 auto;max-width:46%}
  .kv b{font-family:var(--mono);font-size:10.5px;font-weight:500;text-align:right;word-break:break-word}
  .kv.warn b{color:var(--accent)}
  .kv.join b{color:var(--bad)}
  .kv.wall b{color:var(--ok)}
  .kv.edge b{color:var(--blue)}
  .note{margin:7px 0 0;font-size:11px;line-height:1.5;color:var(--ink-soft);text-wrap:pretty}

  table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:10.5px}
  th,td{text-align:right;padding:4px 7px;border-bottom:1px solid #e6dfce;white-space:nowrap}
  th{position:sticky;top:48px;background:var(--paper);text-align:right;font-size:9.5px;letter-spacing:.04em;
     text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid var(--line);z-index:2}
  th:first-child,td:first-child,th:nth-child(2),td:nth-child(2),th:nth-child(3),td:nth-child(3),th:nth-child(4),td:nth-child(4){text-align:left}
  tbody tr:hover{background:var(--accent-soft);cursor:pointer}
  td.strong{font-weight:600;font-family:var(--sans);font-size:11.5px}
  td.tag-JOIN{color:var(--bad)} td.tag-EDGE{color:var(--blue)} td.tag-OPEN{color:var(--bad)}
  td.tag-WALL{color:var(--ok)}
  td.tag-CLOSED{color:var(--ok)} td.tag-PARTIAL{color:var(--ink-soft)}

  #facts{padding:6px 0 40px;max-width:860px}
  .fatal{padding:20px;font-family:var(--mono);color:var(--bad)}

  @media (max-width:980px){
    main{grid-template-columns:minmax(0,1fr)}
    #detail{position:static;height:auto;border-left:0;border-top:1px solid var(--line)}
    #viewer{height:260px}
    th{position:static}
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<header>
  <span class="brand">Platformer Kit <b>Asset Atlas</b></span>
  <span class="tag">GATE A · S0</span>
  <span class="meta"><b id="packname">…</b><br><em id="packmeta">lade Pack-Index …</em></span>
  <span class="meta" id="prog">—</span>
  <span class="spacer"></span>
  <span class="meta">Referenz <a id="prevlink1" target="_blank" rel="noopener">Preview.jpg</a> · <a id="prevlink2" target="_blank" rel="noopener">Preview2.jpg</a></span>
  <select id="famsel" title="Familie"><option value="all">alle Familien</option></select>
  <label class="chk"><input type="checkbox" id="onlyplat"> nur Plattformteile</label>
  <div id="tabs">
    <button data-tab="grid" class="on">Kacheln</button>
    <button data-tab="table">Messtabelle</button>
    <button data-tab="facts">Kit-Fakten</button>
  </div>
  <button class="btn" id="export">JSON exportieren</button>
</header>

<main>
  <div class="content">
    <div id="grid"></div>
    <div id="table" hidden></div>
    <div id="facts" hidden><p class="note" style="padding:14px 13px">Die Kit-Fakten erscheinen, sobald alle Teile vermessen sind.</p></div>
  </div>

  <aside id="detail">
    <div id="viewer"></div>
    <div class="dhead">
      <h3 id="dname">kein Teil gewählt</h3>
      <p id="dpath">—</p>
      <p><a id="dlink" target="_blank" rel="noopener">Quelldatei auf GitHub (raw, mit Pin)</a></p>
    </div>
    <div class="toggles">
      <label><input type="checkbox" data-overlay="axes" checked> Achsen</label>
      <label><input type="checkbox" data-overlay="box" checked> Bounding Box</label>
      <label><input type="checkbox" data-overlay="walk" checked> Lauffläche</label>
      <label><input type="checkbox" data-overlay="joins" checked> Fugen / Kanten</label>
      <label><input type="checkbox" data-overlay="grid" checked> Raster</label>
    </div>
    <div id="dbody"><p class="note" style="padding:10px 13px">Ein Teil in den Kacheln oder der Tabelle wählen.</p></div>
  </aside>
</main>

<script type="module" src="src/atlas/atlas-app.js"></script>
</body>
</html>
