<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const L = new GLTFLoader(), out = {};
const r3 = (v) => v.toArray().map((x) => +x.toFixed(4));
const raw = (c, p) => `https://raw.githubusercontent.com/georg-doc/kayfabizarro/${c}/${p.split('/').map(encodeURIComponent).join('/')}`;
const E = 'e0037d79af9f0546c73cee02e361f78f7d662df2';
try {
  const ml = await L.loadAsync('../media/motion-lib/KFB_Motion_Library_Rig_Medium.glb');
  let meshes = 0, bones = []; ml.scene.traverse((o) => { if (o.isMesh) meshes++; if (o.isBone) bones.push(o.name); });
  out.ml = { meshes, bones: bones.join(','), clips: ml.animations.map((a) => `${a.name}|${a.duration.toFixed(3)}|${a.tracks.length}`),
    guitarA: (ml.animations.find((a) => /guitar_a/i.test(a.name)) || { tracks: [] }).tracks.slice(0, 8).map((t) => t.name) };
} catch (e) { out.ml = String(e); }
for (const [k, c, p] of [['trumpet', E, 'media/3D_Assets/KayKit_Mystery_Series6/6 - December 2025 - Toy Soldier/gltf/ToySoldier_Trumpet.gltf'],
                         ['orcA', E, 'media/3D_Assets/KayKit Legacy/Orc Warband - legacy/characters/gltf/character_orcA.gltf']]) {
  try {
    const g = await L.loadAsync(raw(c, p));
    g.scene.updateMatrixWorld(true);
    const b = new THREE.Box3().setFromObject(g.scene);
    const parts = [];
    g.scene.traverse((o) => { if (o.children.length && o !== g.scene && !o.isMesh) { const bb = new THREE.Box3().setFromObject(o); parts.push({ n: o.name, p: r3(o.position), min: r3(bb.min), max: r3(bb.max) }); } });
    const meshes = []; g.scene.traverse((o) => { if (o.isMesh) meshes.push(o.name + ':' + o.geometry.attributes.position.count); });
    out[k] = { box: [r3(b.min), r3(b.max)], parts, meshes };
  } catch (e) { out[k] = String(e); }
}
const s = JSON.stringify(out); for (let i = 0; i < s.length; i += 470) console.log('Q' + (i / 470), s.slice(i, i + 470));
document.getElementById('o').textContent = JSON.stringify(out, null, 1);
</script></body></html>
