<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="{{ wrapStyle }}">
  <div style="{{ hexAreaStyle }}">
    <div style="{{ shadowStyle }}"></div>
    <div style="{{ slabStyle }}"></div>
    <div style="{{ faceStyle }}"></div>
    <div style="{{ sheenStyle }}"></div>
    <sc-if value="{{ showTint }}" hint-placeholder-val="{{ false }}"><div style="{{ tintStyle }}"></div></sc-if>
    <sc-if value="{{ showLevel }}" hint-placeholder-val="{{ false }}"><div style="{{ badgeStyle }}">{{ levelText }}</div></sc-if>
  </div>
  <div style="{{ capStyle }}">
    <div style="{{ labelStyle }}">{{ label }}</div>
    <div style="{{ subStyle }}">{{ sub }}</div>
    <sc-if value="{{ showMood }}" hint-placeholder-val="{{ false }}"><div style="{{ moodStyle }}">{{ mood }}</div></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:190,&quot;height&quot;:230},&quot;tex&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://raw.githubusercontent.com/georg-doc/kayfabizarro/main/media/3D_Assets/Textures/CardboardSet001/CardboardSet001_diffuse.jpg&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;base&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#b5895a&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;slab&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#7d5a34&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tint&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#b5895a&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Wellpappe-Wildnis&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Wellpappe \u00b7 korrugiert&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mood&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;neugierig&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;level&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;up&quot;,&quot;mid&quot;,&quot;down&quot;,&quot;none&quot;],&quot;default&quot;:&quot;mid&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const clip = 'polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%)';
    const w = p.w ?? 156;
    const h = p.h ?? 138;
    const base = p.base ?? '#8a7a5c';
    const slab = p.slab ?? '#4c4130';
    const tex = p.tex ?? '';
    const level = (p.level ?? 'none').toLowerCase();
    const levelMap = { up: 'UP \u2191', mid: 'MID', down: 'DOWN \u2193' };
    const showLevel = !!levelMap[level];
    const hx = ((p.tint || base) + '').replace('#', '');
    const cr = parseInt(hx.substr(0,2),16) || 120, cg = parseInt(hx.substr(2,2),16) || 100, cb = parseInt(hx.substr(4,2),16) || 70;
    const aoCol = 'rgba(' + Math.round(cr*0.30) + ',' + Math.round(cg*0.30) + ',' + Math.round(cb*0.36) + ',0.6)';

    return {
      label: p.label ?? '',
      sub: p.sub ?? '',
      mood: p.mood ?? '',
      showMood: !!(p.mood && p.mood.length),
      showLevel,
      levelText: levelMap[level] || '',
      showTint: !!(p.tint && p.tint.length),

      wrapStyle: { display: 'flex', flexDirection: 'column', alignItems: 'center' },
      hexAreaStyle: { position: 'relative', width: w + 'px', height: h + 'px' },

      shadowStyle: {
        position: 'absolute', left: '14px', right: '14px', bottom: '-6px', height: '24px',
        background: 'radial-gradient(ellipse at center, rgba(0,0,0,0.55), rgba(0,0,0,0) 72%)',
        filter: 'blur(5px)', pointerEvents: 'none'
      },
      slabStyle: {
        position: 'absolute', inset: '0', transform: 'translateY(16px)',
        clipPath: clip, background: slab
      },
      faceStyle: {
        position: 'absolute', inset: '0', clipPath: clip,
        backgroundColor: base,
        backgroundImage: tex ? 'url("' + tex + '")' : 'none',
        backgroundSize: 'cover', backgroundPosition: 'center'
      },
      sheenStyle: {
        position: 'absolute', inset: '0', clipPath: clip, pointerEvents: 'none',
        boxShadow: 'inset 0 2px 0 rgba(255,255,255,0.6), inset 0 -20px 30px ' + aoCol + ', inset 0 13px 22px rgba(255,255,255,0.16)'
      },
      tintStyle: {
        position: 'absolute', inset: '0', clipPath: clip, pointerEvents: 'none',
        background: p.tint, mixBlendMode: 'soft-light', opacity: 0.55
      },
      badgeStyle: {
        position: 'absolute', top: '-8px', right: '6px', zIndex: 3,
        font: "700 11px 'Space Mono', monospace", letterSpacing: '0.06em',
        background: '#ecdfc2', color: '#332a1f', padding: '2px 8px',
        border: '1.6px solid #241c14', borderRadius: '2px',
        transform: 'rotate(3deg)', boxShadow: '1.5px 1.5px 0 #241c14'
      },
      capStyle: { textAlign: 'center', marginTop: '13px', width: w + 'px' },
      labelStyle: { font: "600 15px 'Shantell Sans', cursive", color: '#f3ead8', lineHeight: 1.15 },
      subStyle: { font: "400 10.5px 'Space Mono', monospace", color: '#b3a488', marginTop: '3px', letterSpacing: '0.01em' },
      moodStyle: {
        display: 'inline-block', marginTop: '7px',
        font: "600 11px 'Nunito Sans', sans-serif", color: '#241c14',
        background: '#d8c398', padding: '2px 10px', borderRadius: '11px',
        border: '1.4px solid #241c14'
      }
    };
  }
}
</script>
</body>
</html>
