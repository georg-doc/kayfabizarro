<!DOCTYPE html>
<!-- Spiegel auf Projektebene. Die Hülle ist absichtlich LEER: Kopf und Tab-Leiste baut
     src/app.js, damit dieser Spiegel nicht hinter der Quelle zurückbleiben kann. -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KFB · Hex-Kanten-Atlas S1 (BT1)</title>
<style>
  :root{
    --ink:#f2efe6; --dim:#9aa0a6; --line:#2b2f36; --bg:#14171c; --panel:#1b1f26;
    --hot:#ffc857; --ok:#7bd88f; --bad:#ff6b6b; --warn:#f0a500;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  a{color:var(--hot)} a:hover{color:#ffe0a0}
  #shell{display:flex;flex-direction:column;height:100%}
  #head{padding:12px 16px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
  #head h1{margin:0;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
  #head p{margin:4px 0 0;color:var(--dim);font-size:12px;max-width:80ch}
  #tabs{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
  #tabs button{background:#20252d;border:1px solid var(--line);color:var(--dim);
    padding:7px 14px;border-radius:6px;cursor:pointer;font-size:12px}
  #tabs button.on{background:var(--hot);border-color:var(--hot);color:#191919;font-weight:600}
  #pane{flex:1;overflow:auto;padding:16px 18px 60px;min-height:0;max-width:1400px;width:100%}
  h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:22px 0 8px}
  h2:first-child{margin-top:0}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid #22262d;font-size:12.5px;max-width:720px}
  .kv span{color:var(--dim)} .kv b{font-weight:600;font-family:var(--mono);text-align:right}
  .kv b.ok{color:var(--ok)} .kv b.bad{color:var(--bad)} .kv b.warn{color:var(--warn)}
  .note{color:var(--dim);font-size:12.5px;margin:10px 0 0;max-width:80ch}
  .note.ok{color:var(--ok)} .note.bad{color:var(--bad)}
  .sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:5px;border:1px solid #0006}
  .cmp{display:flex;gap:16px;font-family:var(--mono);font-size:12px;padding:3px 0;border-bottom:1px solid #22262d;max-width:720px}
  .cmp i{font-style:normal;color:var(--ink);flex:1}
  .cmp span{color:var(--dim)} .cmp u{color:var(--bad);text-decoration:none}
  .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .bar input[type=text]{background:#20252d;border:1px solid var(--line);color:var(--ink);
    border-radius:6px;padding:6px 10px;font-family:var(--mono);font-size:12px}
  .bar label{color:var(--dim);font-size:12px;display:flex;align-items:center;gap:6px}
  .bar input[type=checkbox]{width:16px;height:16px;accent-color:var(--hot)}
  .legend{font-family:var(--mono);font-size:12px;color:var(--dim);display:flex;gap:10px;align-items:center}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
  .cardi{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .cardi canvas{display:block;width:100%;aspect-ratio:1;background:#0f1216}
  .cardi .cap{padding:6px 7px;font-family:var(--mono);font-size:10px;line-height:1.4;color:var(--hot);word-break:break-all}
  .cardi .cap b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}
  .cardi .cap em.pk{display:block;font-style:normal;color:var(--dim);font-size:9.5px;
    letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
  .cardi .cap s{color:var(--bad)}
  .go{background:var(--hot);border:0;color:#191919;font-weight:700;padding:9px 16px;
    border-radius:8px;cursor:pointer;margin:6px 0 12px;letter-spacing:.04em}
  .go.sec{background:#20252d;color:var(--ink);border:1px solid var(--line);font-weight:500}
  pre.json{background:#10131a;border:1px solid var(--line);border-radius:8px;padding:12px;
    font-family:var(--mono);font-size:11px;line-height:1.45;color:var(--dim);overflow:auto;max-height:60vh}
  .fams{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 14px}
  .famb{background:#20252d;border:1px solid var(--line);color:var(--dim);padding:4px 9px;
    border-radius:5px;cursor:pointer;font-family:var(--mono);font-size:11px}
  .famb:hover{color:var(--ink);border-color:var(--hot)}
  #boot{position:fixed;inset:0;display:grid;place-content:center;gap:8px;text-align:center;
    background:var(--bg);z-index:5}
  .case{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:0 0 16px;overflow:hidden}
  .case-h{display:flex;align-items:baseline;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .case-h b{font-size:13px;letter-spacing:.06em;text-transform:uppercase}
  .case-h span{color:var(--dim);font-size:11.5px;font-family:var(--mono)}
  .case .rule{margin:0;padding:10px 14px;color:var(--dim);font-size:12.5px;border-bottom:1px solid #22262d;max-width:none}
  .case-b{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
  .case-b>*{position:relative;background:#0f1216;min-height:300px}
  .case-b .ref{background-repeat:no-repeat}
  .case-b .view canvas{display:block;width:100%;height:100%;min-height:300px}
  .case-b i{position:absolute;left:8px;bottom:7px;font-style:normal;font-size:10.5px;
    letter-spacing:.1em;text-transform:uppercase;color:#dfe3e8;background:#0009;padding:2px 7px;border-radius:4px}
  .views{position:absolute;right:8px;top:8px;display:flex;gap:3px;z-index:2}
  .views button{background:#0e1116cc;border:1px solid #ffffff22;color:#c8ccd2;font-size:10.5px;
    padding:3px 8px;border-radius:5px;cursor:pointer;letter-spacing:.04em}
  .views button.on{background:var(--hot);border-color:var(--hot);color:#191919;font-weight:600}
  .findings{padding:10px 14px;display:flex;flex-direction:column;gap:5px}
  .findings .f{font-size:12.5px;line-height:1.5}
  .findings .f.ok{color:var(--ok)} .findings .f.bad{color:var(--bad)} .findings .f.dim{color:var(--dim);font-family:var(--mono);font-size:11.5px}
  .findings .wait{color:var(--dim);font-size:12px}
  .lesson{border-left:2px solid var(--line);padding:0 0 0 16px;margin:0 0 22px;max-width:82ch}
  .lesson .lh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .lesson .lh b{font-size:13px}
  .lesson .lh span{color:var(--dim);font-size:11.5px;font-family:var(--mono)}
  .lesson p{margin:0 0 7px;color:#c8ccd2;font-size:13px;line-height:1.62;text-wrap:pretty}
  @media (max-width:900px){ .case-b{grid-template-columns:1fr} }
  #boot b{font-size:14px;letter-spacing:.14em;text-transform:uppercase}
  #boot span{color:var(--dim);font-size:12px;font-family:var(--mono)}
  #boot.gone{display:none}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="shell">
  <div id="head"></div>
  <div id="tabs"></div>
  <div id="pane"></div>
</div>
<div id="boot"><b>Start</b><span>…</span></div>
<script type="module" src="./KFB_Hex_Edge_Atlas_S1/src/app.js"></script>
</body>
</html>
