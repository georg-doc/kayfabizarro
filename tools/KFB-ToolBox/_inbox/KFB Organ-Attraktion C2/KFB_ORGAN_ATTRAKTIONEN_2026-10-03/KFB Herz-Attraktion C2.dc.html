<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#cfccc4;color:#1f2022;font:13px/1.45 'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#7a4d0d}a:hover{color:#b8781c}
canvas{display:block}
button{font:inherit}
.kfb-scroll{scrollbar-width:none}.kfb-scroll::-webkit-scrollbar{display:none}
details>summary{list-style:none}details>summary::-webkit-details-marker{display:none}
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.184.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.184.0/examples/jsm/"}}
</script>
<script type="module">
import { boot } from './lab-organ/organ-islands.v7.js?r=62';
window.__KFB_O1 = { boot };
window.dispatchEvent(new Event('kfbO1Ready'));
</script>
</helmet>

<div style="position:relative;display:flex;flex-direction:column;height:100vh;min-width:0">
  <header style="flex:none;height:44px;display:flex;align-items:center;gap:6px;padding:0 6px 0 0;background:#efece6;border-bottom:1px solid #c9c5bc;min-width:0">
    <div style="flex:none;font:600 12px/1 'IBM Plex Mono',monospace;margin:0 2px 0 10px;color:#5c6065;letter-spacing:.04em">C2</div>
    <div class="kfb-scroll" style="flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:6px;overflow-x:auto;overflow-y:hidden">
      <div title="Insel" style="display:flex;gap:2px;padding:2px;background:#e3e0d9;border-radius:8px;flex:none">
        <sc-for list="{{ isleBtns }}" as="b" hint-placeholder-count="5">
          <button onClick="{{ b.pick }}" title="{{ b.title }}" style="height:26px;border:0;border-radius:6px;padding:0 8px;cursor:pointer;font:500 12px/1 'Space Grotesk',sans-serif;white-space:nowrap;background:{{ b.bg }};color:{{ b.fg }};box-shadow:{{ b.sh }}">{{ b.label }}</button>
        </sc-for>
      </div>
      <div title="Fassung" style="display:flex;gap:2px;padding:2px;background:#e3e0d9;border-radius:8px;flex:none">
        <sc-for list="{{ tierBtns }}" as="b" hint-placeholder-count="2">
          <button onClick="{{ b.pick }}" title="{{ b.title }}" style="height:26px;border:0;border-radius:6px;padding:0 8px;cursor:pointer;font:500 12px/1 'Space Grotesk',sans-serif;white-space:nowrap;background:{{ b.bg }};color:{{ b.fg }};box-shadow:{{ b.sh }}">{{ b.label }}</button>
        </sc-for>
      </div>
      <div title="Kamera" style="display:flex;gap:2px;padding:2px;background:#e3e0d9;border-radius:8px;flex:none">
        <sc-for list="{{ camBtns }}" as="b" hint-placeholder-count="5">
          <button onClick="{{ b.pick }}" title="{{ b.title }}" style="height:26px;border:0;border-radius:6px;padding:0 8px;cursor:pointer;font:500 12px/1 'Space Grotesk',sans-serif;white-space:nowrap;background:{{ b.bg }};color:{{ b.fg }};box-shadow:{{ b.sh }}">{{ b.label }}</button>
        </sc-for>
      </div>
    </div>
    <div style="flex:none;display:flex;align-items:center;gap:4px;padding-left:6px;border-left:1px solid #c9c5bc">
      <button onClick="{{ tgHud }}" title="Messwerte einblenden" style="width:28px;height:28px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;border:1px solid {{ hudLine }};background:{{ hudBg }};color:{{ hudFg }}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"></path></svg>
      </button>
      <button onClick="{{ tgPanel }}" title="Details · Insel, Strecke, Ansicht, Messung" style="width:28px;height:28px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;border:1px solid {{ panelLine }};background:{{ panelBg }};color:{{ panelFg }}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M15 4v16"></path></svg>
      </button>
    </div>
  </header>

  <div style="position:relative;flex:1 1 auto;min-height:0;min-width:0;background:#dedbd4">
    <canvas ref="{{ canvasRef }}" style="position:absolute;inset:0;width:100%;height:100%"></canvas>

    <sc-if value="{{ hudOn }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:8px;top:8px;z-index:6;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 16px);pointer-events:none">
        <sc-for list="{{ chips }}" as="c" hint-placeholder-count="3">
          <div title="{{ c.title }}" style="pointer-events:auto;display:flex;align-items:center;gap:5px;height:22px;padding:0 7px;font:11px/1 'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;border-radius:6px;white-space:nowrap;background:{{ c.bg }};border:1px solid {{ c.line }};color:{{ c.fg }}">
            <span style="opacity:.75">{{ c.k }}</span><span>{{ c.v }}</span>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{ panelOn }}" hint-placeholder-val="{{ false }}">
      <aside style="position:absolute;right:6px;top:6px;bottom:6px;width:min(360px,calc(100% - 12px));z-index:20;display:flex;flex-direction:column;background:#efece6;border:1px solid #c9c5bc;border-radius:10px;box-shadow:0 8px 28px rgba(31,32,34,.16);overflow:hidden">
        <div style="flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #c9c5bc">
          <b style="font-weight:600;font-size:13px;margin-right:auto">{{ panelTitle }}</b>
          <button onClick="{{ tgPanel }}" title="Details schließen" style="width:24px;height:24px;padding:0;display:flex;align-items:center;justify-content:center;border:1px solid #c9c5bc;border-radius:6px;background:#f6f4ef;color:#1f2022;cursor:pointer">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6 6 18"></path></svg>
          </button>
        </div>
        <div style="flex:1 1 auto;overflow:auto;padding:0 0 16px">
          <sc-for list="{{ sections }}" as="s" hint-placeholder-count="5">
            <details open="{{ s.open }}" style="border-bottom:1px solid #dedbd4">
              <summary style="font:600 11px/1 'Space Grotesk',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#5c6065;padding:11px 12px;cursor:pointer">{{ s.title }}</summary>
              <div style="padding:0 12px 12px;display:flex;flex-direction:column;gap:6px">
                <sc-if value="{{ s.lead }}" hint-placeholder-val="{{ false }}"><div style="font-size:12px;line-height:1.45;text-wrap:pretty">{{ s.lead }}</div></sc-if>
                <sc-if value="{{ s.hasSeg }}" hint-placeholder-val="{{ false }}">
                  <div style="display:flex;flex-direction:column;gap:6px">
                    <sc-for list="{{ s.segs }}" as="g" hint-placeholder-count="2">
                      <div style="display:flex;align-items:center;gap:8px">
                        <span style="font:11px/1 'IBM Plex Mono',monospace;color:#5c6065;width:64px;flex:none">{{ g.label }}</span>
                        <div style="display:flex;gap:2px;padding:2px;background:#e3e0d9;border-radius:8px;flex-wrap:wrap">
                          <sc-for list="{{ g.items }}" as="b" hint-placeholder-count="3">
                            <button onClick="{{ b.pick }}" title="{{ b.title }}" style="height:24px;border:0;border-radius:6px;padding:0 8px;cursor:pointer;font:500 12px/1 'Space Grotesk',sans-serif;white-space:nowrap;background:{{ b.bg }};color:{{ b.fg }};box-shadow:{{ b.sh }}">{{ b.label }}</button>
                          </sc-for>
                        </div>
                      </div>
                    </sc-for>
                  </div>
                </sc-if>
                <div>
                  <sc-for list="{{ s.rows }}" as="kv" hint-placeholder-count="3">
                    <div style="display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid #dedbd4;font:11px/1.45 'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums">
                      <span style="color:#5c6065;flex:none;max-width:50%">{{ kv.k }}</span><span style="text-align:right;word-break:break-word;color:{{ kv.c }}">{{ kv.v }}</span>
                    </div>
                  </sc-for>
                </div>
                <sc-if value="{{ s.hasBtn }}" hint-placeholder-val="{{ false }}">
                  <div style="display:flex;gap:6px;flex-wrap:wrap">
                    <sc-for list="{{ s.btns }}" as="b" hint-placeholder-count="1">
                      <button onClick="{{ b.pick }}" title="{{ b.title }}" style="height:26px;padding:0 10px;border-radius:6px;cursor:pointer;font:500 12px/1 'Space Grotesk',sans-serif;background:#1f2022;color:#f6f4ef;border:1px solid #1f2022">{{ b.label }}</button>
                    </sc-for>
                  </div>
                </sc-if>
                <sc-if value="{{ s.text }}" hint-placeholder-val="{{ false }}"><div style="font:11px/1.5 'IBM Plex Mono',monospace;color:#1f2022;background:#f6f4ef;border:1px solid #c9c5bc;border-radius:6px;padding:7px 9px;white-space:pre-wrap;word-break:break-word">{{ s.text }}</div></sc-if>
              </div>
            </details>
          </sc-for>
        </div>
      </aside>
    </sc-if>

    <sc-if value="{{ busy }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#dedbd4e6;pointer-events:none;padding:20px;text-align:center">
        <div style="font:600 12px/1 'IBM Plex Mono',monospace;color:#5c6065;letter-spacing:.04em">C2</div>
        <div style="font-weight:600;font-size:20px">Herz-Attraktion</div>
        <div style="font:12px/1.4 'IBM Plex Mono',monospace;color:#1f2022">{{ busyText }}</div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  canvasRef = React.createRef();
  state = { st: null, note: 'Lädt …', booting: true, ui: (() => { try { return Object.assign({ hud: false, panel: false }, JSON.parse(localStorage.getItem('kfb.c2.ui') || '{}')); } catch (e) { return { hud: false, panel: false }; } })() };
  componentDidMount() {
    const go = async () => {
      if (this.api || !this.canvasRef.current) return;
      try {
        let last = 0;
        this.api = await window.__KFB_O1.boot(this.canvasRef.current, { only: 'herz', onNote: n => this.setState({ note: n }), onState: st => { const t = performance.now(); if (t - last > 600 || st.measuring !== (this.state.st && this.state.st.measuring)) { last = t; this.setState({ st }); } } });
        window.__o1 = this.api; this.setState({ booting: false, note: '' });
      } catch (e) { console.error(e); this.setState({ note: 'Fehler: ' + e.message }); }
    };
    if (window.__KFB_O1) go(); else window.addEventListener('kfbO1Ready', go, { once: true });
  }
  componentWillUnmount() { this.api && this.api.dispose(); }
  setUi(p) { const ui = { ...this.state.ui, ...p }; this.setState({ ui }); try { localStorage.setItem('kfb.c2.ui', JSON.stringify(ui)); } catch (e) {} }
  renderVals() {
    const S = this.state, st = S.st, api = this.api, ui = S.ui;
    const seg = (on, label, pick, title = '') => ({ label, title, pick, bg: on ? '#fffdf8' : 'transparent', fg: on ? '#1f2022' : '#5c6065', sh: on ? '0 1px 2px rgba(31,32,34,.14)' : 'none' });
    const ico = on => ({ bg: on ? '#1f2022' : '#f6f4ef', fg: on ? '#f6f4ef' : '#1f2022', line: on ? '#1f2022' : '#c9c5bc' });
    const sel = st ? st.sel : 'kosmos', cam = st ? st.cam : 'tq', tier = st ? st.tier : 'hero', isl = st ? st.islands : [];
    const isleBtns = [seg(sel === 'kosmos', 'Kosmos', () => api && api.setIsland('kosmos'), 'alle Inseln und die Runde')].concat((isl.length ? isl : [{ id: 'hirn', short: 'Hirn' }, { id: 'herz', short: 'Herz' }, { id: 'darm', short: 'Darm' }, { id: 'niere', short: 'Niere' }]).map(i => seg(sel === i.id, i.short, () => api && api.setIsland(i.id), i.loci || '')));
    const tierBtns = [['hero', 'Hero', 'Bake-Raster'], ['light', 'Light', 'halbes Raster']].map(([id, l, t]) => seg(tier === id, l, () => api && api.setTier(id), t));
    const camBtns = [['tq', '3/4', 'Schrägansicht'], ['spin', 'Drehen', 'Drehteller'], ['dock', 'Portal', 'Tunnelportal mit Strecke'], ['top', 'Oben', 'Draufsicht'], ['ride', 'Fahrt', 'Mitfahren auf der Track-Core-Runde']].map(([id, l, t]) => seg(cam === id, l, () => api && api.setCam(id), t));
    const tm = st && st.probe ? st.probe.time : 'day';
    const kv = (k, v, c = '#1f2022') => ({ k, v: v == null || v === '' ? '–' : String(v), c });
    const OK = '#4d6b55', BAD = '#a33d3d', nf = n => n == null ? '–' : Math.round(n).toLocaleString('de-DE');
    const I = isl.find(i => i.id === sel), T = I && I.tiers[tier], tr = st && st.track;
    const tone = ok => ok == null ? { bg: '#efece6e8', line: '#c9c5bc', fg: '#1f2022' } : ok ? { bg: '#4d6b55', line: '#4d6b55', fg: '#f6f4ef' } : { bg: '#a33d3d', line: '#a33d3d', fg: '#fbf5f0' };
    const hits = isl.length ? isl.reduce((a, i) => a + (i.hits ? i.hits.n : 0), 0) : null;
    const chips = st ? [
      { k: '', v: st.perf.fps + ' fps · ' + Math.round(st.perf.tris / 1000) + 'k △', title: 'ganze Szene inkl. Schatten · Vorschau, nicht Georgs Gerät', ...tone(null) },
      { k: 'Strecke', v: tr ? (tr.error ? 'Fehler' : (tr.length / 1000).toFixed(2).replace('.', ',') + ' km · ' + (tr.pass ? 'grün' : tr.errors.length + ' Fehler')) : '–', title: 'Track Core v0.12 compileRecipe + runChecks', ...tone(tr ? (!tr.error && tr.pass) : null) },
      { k: 'Durchdringung', v: hits == null ? '–' : String(hits), title: 'Stützstellen, deren Querschnitt (Fahrbahn + Bande, 5 × 2 Punkte) näher als 1 m an Organ oder Harnleiter liegt (Hirn 3 m, Feld radial); Tunnel und Schlucht ausgenommen', ...tone(hits == null ? null : hits === 0) }
    ] : [];
    const sections = [];
    if (I) sections.push({ title: I.name + ' · ' + (tier === 'hero' ? 'Hero' : 'Light'), open: true, lead: I.loci + '. ' + I.note, hasSeg: false, segs: [], hasBtn: false, btns: [],
      rows: [kv('Dreiecke', nf(T && T.tris) + ' △'), kv('Organ / Wasser', T ? nf(T.terrain) + ' / ' + nf(T.water) : '–'), kv('Raster', T ? T.cell + ' mm · ' + I.mm + ' m/mm' : '–'), kv('Tunnel', I.tunnel.len + ' m · ' + I.tunnel.segs.length + ' Abschnitt(e) · y ' + I.tunnel.y + ' m'), kv('Durchdringung', I.hits ? (I.hits.n ? I.hits.n + ' Stützstellen' : 'keine') : '–', I.hits ? (I.hits.n ? BAD : OK) : '#1f2022'), kv('Bewohner', I.figs + ' / ' + I.cast.length + ' · ' + I.cast.join(', ')), kv('Quelle', I.src), kv('Aufbau', I.ms + ' ms')] });
    sections.push({ title: 'Ansicht', open: !I, lead: '', hasSeg: true, hasBtn: false, btns: [], rows: [],
      segs: [{ label: 'Zeit', items: [['day', 'Day'], ['evening', 'Evening'], ['night', 'Night'], ['auto', 'Auto']].map(([id, l]) => seg(tm === id, l, () => api && api.setTime(id))) },
        { label: 'Namen', items: [[false, 'aus'], [true, 'an']].map(([v, l]) => seg(!!(st && st.labels) === v, l, () => api && api.setLabels(v))) },
        { label: 'AO', items: [[false, 'aus'], [true, 'an']].map(([v, l]) => seg(!!(st && st.ao) === v, l, () => api && api.setAO(v), 'GTAO · verdoppelt die Szene')) }] });
    if (tr) sections.push({ title: 'Strecke · Track Core', open: false, hasSeg: false, segs: [], hasBtn: false, btns: [],
      lead: 'Fahrt durch die Herzkammern auf dem Weg des Blutes, nur Track-Core-Stücke: obere Hohlvene → rechter Vorhof → rechte Kammer → Ausflusstrakt Richtung Truncus pulmonalis, Ausfahrt vor dem Aortenbogen → außen herum (Lungenkreislauf) → Lungenvenen → linker Vorhof → linke Kammer → Aorta ascendens → Aortenbogen → außen zurück (Körperkreislauf). Kammerpunkte aus den gemessenen Gefäßansätzen. Booster und Fahrhilfen kommen später, falls die Physik nicht passt.',
      rows: tr.error ? [kv('Fehler', tr.error, BAD)] : [kv('Core', tr.core), kv('Rezept', tr.recipe + ' · ' + tr.pieces + ' Stücke'), kv('Länge', nf(tr.length) + ' m'), kv('davon in Organen', nf(tr.tunnelM) + ' m'), kv('Checks', tr.pass ? 'alle error-Checks grün' : tr.errors.join(' · '), tr.pass ? OK : BAD), kv('Warnungen', tr.warnings.length ? tr.warnings.join(', ') : 'keine'), kv('Dreiecke', nf(tr.tris)), kv('Kompiliert', tr.ms + ' ms')] });
    if (isl.length) sections.push({ title: 'Fassungen · Hero / Light', open: false, lead: '', hasSeg: false, segs: [], hasBtn: false, btns: [],
      rows: isl.flatMap(i => [kv(i.short + ' Hero', nf(i.tiers.hero.tris) + ' △ · ' + i.tiers.hero.cell + ' mm'), kv(i.short + ' Light', nf(i.tiers.light.tris) + ' △ · ' + i.tiers.light.cell + ' mm · ' + Math.round(100 * i.tiers.light.tris / i.tiers.hero.tris) + ' %')]),
      text: 'Organ + Wasser, aus der Geometrie gezählt. Strecke, Bewohner und Himmel sind in beiden Fassungen gleich.' });
    const M = st && st.measure;
    sections.push({ title: 'Messung · Vorschau', open: !!M, lead: '', hasSeg: false, segs: [], hasBtn: true, btns: [{ label: st && st.measuring ? 'misst …' : 'Messen', title: 'je Insel × Fassung, gleiche 3/4-Kamera', pick: () => api && api.measure() }],
      rows: M ? M.map(r => kv((r.id === 'kosmos' ? 'Kosmos' : (isl.find(i => i.id === r.id) || {}).short) + ' ' + (r.tier === 'hero' ? 'Hero' : 'Light'), r.ms.toFixed(2).replace('.', ',') + ' ms · ' + nf(r.tris) + ' △')) : [],
      text: 'Bildzeit je Bild mit gl.finish, ganze Szene. Gemessen in dieser Vorschau, nicht auf Georgs Gerät.' });
    sections.push({ title: 'Quellen', open: false, lead: '', hasSeg: false, segs: [], hasBtn: false, btns: [], rows: [], text: 'Organe: BodyParts3D 3.0 © DBCLS, CC BY-SA 2.1 JP. Hirn: H0-Bake unverändert.\nStrecke: Track Core v0.12 (vendor-j15), Stücke wie cosmos-route.v1.\nHex-Insel: KayKit Hexagon @378b2093, Unterbau hex-island.v5.\nFiguren: KayKit Mystery Series @2ff8b350. Knete K2 · Himmel SKY3.' });
    if (st && st.errors && st.errors.length) sections.push({ title: 'Meldungen', open: true, lead: '', hasSeg: false, segs: [], hasBtn: false, btns: [], rows: [], text: st.errors.join('\n') });
    const ih = ico(ui.hud), ip = ico(ui.panel);
    return { canvasRef: this.canvasRef, isleBtns, tierBtns, camBtns, chips, sections, panelTitle: I ? I.short : 'Kosmos',
      hudOn: !!ui.hud, panelOn: !!ui.panel, hudBg: ih.bg, hudFg: ih.fg, hudLine: ih.line, panelBg: ip.bg, panelFg: ip.fg, panelLine: ip.line,
      tgHud: () => this.setUi({ hud: !ui.hud }), tgPanel: () => this.setUi({ panel: !ui.panel }),
      busy: !!(S.note || S.booting || (st && st.measuring)), busyText: (st && st.measuring) ? 'Messung läuft …' : (S.note || 'Lädt …') };
  }
}
</script>
</body>
</html>
