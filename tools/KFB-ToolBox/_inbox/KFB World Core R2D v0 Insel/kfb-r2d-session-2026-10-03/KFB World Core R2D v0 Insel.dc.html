<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>KFB · World Core R2D v0 · eine Insel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#17191c;color:#e6e3dc;font-family:"IBM Plex Sans",system-ui,sans-serif}
a{color:#f2c879}a:hover{color:#ffe0a3}
*{box-sizing:border-box}
canvas{display:block}
</style>
</helmet>
<div data-screen-label="R2D v0 Insel" style="position:relative;width:100%;height:100vh;overflow:hidden">
  <canvas ref="{{ canvasRef }}" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none"></canvas>

  <div style="position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;background:rgba(23,25,28,.88);border-bottom:1px solid #33383f">
    <div style="display:flex;flex-direction:column;gap:1px;min-width:0;margin-right:6px">
      <div style="font-weight:600;font-size:14px">KFB · R2D v0 · eine Insel</div>
      <div style="font:400 11px/1.3 'IBM Plex Mono',monospace;color:#9aa1a9">{{ note }}</div>
    </div>
    <div style="display:flex;gap:4px;flex-wrap:wrap">
      <sc-for list="{{ views }}" as="b" hint-placeholder-count="7">
        <button onClick="{{ b.go }}" style="font:500 12px/1 'IBM Plex Sans',sans-serif;padding:8px 10px;border-radius:4px;border:1px solid #3a4048;cursor:pointer;background:{{ b.bg }};color:{{ b.fg }}">{{ b.label }}</button>
      </sc-for>
    </div>
    <div style="flex:1"></div>
    <button onClick="{{ togglePanel }}" style="font:500 12px/1 'IBM Plex Sans',sans-serif;padding:8px 10px;border-radius:4px;border:1px solid #4a515a;background:#24282d;color:#e6e3dc;cursor:pointer">{{ panelLabel }}</button>
  </div>

  <sc-if value="{{ panelOpen }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;top:62px;left:12px;bottom:12px;width:300px;max-width:calc(100% - 24px);overflow:auto;background:rgba(27,30,33,.94);border:1px solid #33383f;border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="font:500 11px/1 'IBM Plex Mono',monospace;color:#9aa1a9;letter-spacing:.06em">UMRISS</div>
        <div style="display:flex;gap:4px;flex-wrap:wrap"><sc-for list="{{ shapes }}" as="b" hint-placeholder-count="2"><button onClick="{{ b.go }}" style="font:500 12px/1 'IBM Plex Sans',sans-serif;padding:7px 10px;border-radius:3px;border:1px solid #3a4048;cursor:pointer;background:{{ b.bg }};color:{{ b.fg }}">{{ b.label }}</button></sc-for></div>
        <div style="font:500 11px/1 'IBM Plex Mono',monospace;color:#9aa1a9;letter-spacing:.06em;margin-top:6px">INSEL (SEED)</div>
        <div style="display:flex;gap:4px;flex-wrap:wrap"><sc-for list="{{ seeds }}" as="b" hint-placeholder-count="4"><button onClick="{{ b.go }}" style="font:500 12px/1 'IBM Plex Mono',monospace;padding:7px 10px;border-radius:3px;border:1px solid #3a4048;cursor:pointer;background:{{ b.bg }};color:{{ b.fg }}">{{ b.label }}</button></sc-for></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="font:500 11px/1 'IBM Plex Mono',monospace;color:#9aa1a9;letter-spacing:.06em">BIOM (R2C-PALETTE)</div>
        <div style="display:flex;gap:4px;flex-wrap:wrap"><sc-for list="{{ biomes }}" as="b" hint-placeholder-count="4"><button onClick="{{ b.go }}" style="font:500 12px/1 'IBM Plex Sans',sans-serif;padding:7px 10px;border-radius:3px;border:1px solid #3a4048;cursor:pointer;background:{{ b.bg }};color:{{ b.fg }}">{{ b.label }}</button></sc-for></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="font:500 11px/1 'IBM Plex Mono',monospace;color:#9aa1a9;letter-spacing:.06em">SCHICHT</div>
        <div style="display:flex;gap:4px;flex-wrap:wrap"><sc-for list="{{ layers }}" as="b" hint-placeholder-count="4"><button onClick="{{ b.go }}" style="font:500 12px/1 'IBM Plex Sans',sans-serif;padding:7px 10px;border-radius:3px;border:1px solid #3a4048;cursor:pointer;background:{{ b.bg }};color:{{ b.fg }}">{{ b.label }}</button></sc-for></div>
      </div>
      <sc-if value="{{ isMask }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:4px">
          <sc-for list="{{ legend }}" as="l" hint-placeholder-count="7">
            <div style="display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px">
              <div style="width:14px;height:14px;border-radius:3px;background:{{ l.c }}"></div><div>{{ l.n }}</div><div style="font:400 11px/1 'IBM Plex Mono',monospace;color:#9aa1a9">{{ l.v }}</div>
            </div>
          </sc-for>
        </div>
      </sc-if>
      <div style="display:flex;flex-direction:column;gap:3px;font:400 11px/1.5 'IBM Plex Mono',monospace;color:#c9c5bd;background:#22262a;border-radius:4px;padding:9px 10px;white-space:pre-line">{{ stats }}</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="font:500 11px/1 'IBM Plex Mono',monospace;color:#9aa1a9;letter-spacing:.06em">STAND</div>
        <sc-for list="{{ status }}" as="s" hint-placeholder-count="6">
          <div style="display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px;font-size:12px;line-height:1.4">
            <div style="font:500 11px/1.4 'IBM Plex Mono',monospace;color:{{ s.c }}">{{ s.k }}</div><div style="color:#d8d4cc;text-wrap:pretty">{{ s.v }}</div>
          </div>
        </sc-for>
      </div>
      <button onClick="{{ exportRecipe }}" style="font:500 12px/1 'IBM Plex Sans',sans-serif;padding:9px 10px;border-radius:4px;border:1px solid #4a515a;background:#24282d;color:#e6e3dc;cursor:pointer">Inselrezept JSON</button>
    </div>
  </sc-if>

  <sc-if value="{{ loading }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#17191c;z-index:5">
      <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
        <div style="font-weight:600;font-size:22px">R2D v0 · eine Insel</div>
        <div style="font:400 12px/1.4 'IBM Plex Mono',monospace;color:#9aa1a9">{{ note }}</div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  canvasRef = React.createRef();
  state = { loading: true, note: 'Lädt …', shape: 'frei', seed: 3, biome: 'burg', layer: 'welt', view: 'mittel', panelOpen: localStorage.getItem('r2d-v0-panel') !== '0', info: null, stats: '' };
  async componentDidMount() {
    try { const M = await import('./KFB_R2D_v0/island.js'); this.M = M;
      this.api = await M.boot(this.canvasRef.current, note => this.setState({ note }));
      window.__r2d = this.api; this.setState({ loading: false, info: { ...this.api.info } });
      this.timer = setInterval(() => this.tick(), 1000);
    } catch (e) { console.error(e); this.setState({ note: 'Fehler: ' + e.message }); }
  }
  componentWillUnmount() { clearInterval(this.timer); this.api && this.api.dispose(); }
  tick() { const s = this.api.stat, i = this.api.info, f = n => Math.round(n).toLocaleString('de-DE');
    const t = `${s.fps} fps · ${s.ms} ms Render (CPU)\n${f(s.tris)} △ · ${s.calls} Calls · ${s.geoms} Geo · ${s.tex} Tex\nGelände ${f(i.terrTris)} △ (1 Mesh) · Straße ${f(i.roadTris)} △\nNatur ${i.trees} Bäume · ${i.bushes} Büsche · ${i.rocks} Felsen · ${i.grass} Gras · ${i.stones} Trittsteine\nTeich ${i.pond ? 'ja · ' + i.drops + ' Knet-Tröpfchen' : 'kein Platz'} · Bach ${i.creek ? 'ja' : 'nein'}${i.canyon ? ' · Schlucht unter der Straße, ' + i.piers + ' Stützen' : ''}${i.waterfall ? ' · Wasserfall ' + i.fallDrops + ' Tropfen' : ''}\nInsel ${i.span ? i.span.join(' × ') : ''} m · Unterseite ${i.depth} m tief\nTrack Core ${i.core} · ${i.samples} Punkte · ${i.checks} Prüfungen ${i.checkFails && i.checkFails.length ? 'FAIL ' + i.checkFails.join(',') : 'bestanden'}\nAufbau ${i.buildMs} ms · Vorschau-Messung, kein GPU-Benchmark`;
    if (t !== this.state.stats) this.setState({ stats: t, info: { ...i } }); }
  async rebuild(patch) { this.setState({ ...patch }); const s = { ...this.state, ...patch }; await this.api.build(s.seed, s.biome, s.shape); this.api.setLayer(s.layer === 'masken' ? 'masken' : 'welt'); this.api.setHex(s.layer === 'raster'); this.setState({ info: { ...this.api.info } }); }
  renderVals() {
    const S = this.state, btn = (on, label, go) => ({ label, go, bg: on ? '#f2c879' : '#24282d', fg: on ? '#17191c' : '#e6e3dc' });
    const views = [['top', 'Draufsicht'], ['mittel', 'Mittel'], ['fern', 'Fern'], ['unten', 'Unterseite'], ['fahr', 'Fahrhöhe'], ['lauf', 'Laufhöhe'], ['bach', 'Bach/Brücke'], ['fall', 'Wasserfall'], ['fahrt', '▶ Fahrt']].map(([k, l]) => btn(S.view === k, l, () => { this.setState({ view: k }); if (!this.api) return; if (k === 'fahrt') this.api.startDrive(); else this.api.setView(k);
      if ((k === 'bach' || k === 'fall') && !(this.api.info.waterfall)) this.setState({ note: 'Diese Insel hat keinen Bach. Insel #3 oder #6 wählen.' }); }));
    const seeds = [[1, '#1'], [2, '#2 Teich'], [3, '#3 Wasserfall'], [6, '#6 Wasserfall']].map(([n, l]) => btn(S.seed === n, l, () => this.api && this.rebuild({ seed: n })));
    const biomes = [['burg', 'Burg'], ['utopia', 'Utopia'], ['dystopia', 'Dystopia'], ['protopia', 'Protopia']].map(([k, l]) => btn(S.biome === k, l, () => this.api && this.rebuild({ biome: k })));
    const layers = [['welt', 'Welt'], ['masken', 'Masken'], ['raster', 'Hexraster'], ['ohneAO', 'ohne AO']].map(([k, l]) => btn(S.layer === k, l, () => { this.setState({ layer: k }); if (!this.api) return; this.api.setLayer(k === 'masken' ? 'masken' : 'welt'); this.api.setHex(k === 'raster'); this.api.setAO(k !== 'ohneAO'); }));
    const M = this.M ? this.M.MASK : {}, cnt = S.info && S.info.masks || {};
    const legend = Object.entries(M).map(([k, v]) => ({ n: v[0], c: v[1], v: cnt[k] != null ? cnt[k].toLocaleString('de-DE') + ' m²' : '' }));
    const shapes = [['frei', 'frei'], ['hex', 'Hex-Plan']].map(([k, l]) => btn(S.shape === k, l, () => this.api && this.rebuild({ shape: k })));
    const status = [
      ['PASS', '#8fd18a', 'Keine Kacheln, keine Säulen: Oberseite, Rand und Unterseite sind ein Körper. Umriss frei (Standard) oder aus dem alten Hex-Plan.'],
      ['PASS', '#8fd18a', 'Häuser ohne Bodenplatte: die Platte von building_A ist entfernt, das Haus steht direkt im Gelände.'],
      ['PASS', '#8fd18a', 'Straße aus dem Track Core, unverändert. Gelände hat Straßenbett, Damm oder Einschnitt; Enden sind Brückenköpfe zur Nachbarinsel.'],
      ['TUNE', '#f2c879', 'Übergänge Gras/Sand/Pflaster/Fels als Joyride-Punktmuster, Teich mit Knet-Tröpfchen, Natur aus einer Familie (KayKit Forest + Quaternius). Form und Dichte am Bild entscheiden.'],
      ['OPEN', '#ffb38a', 'Straßen-Look: noch Track-Core-Vorschau. Der Joyride-Look (runder Knetstrang) steckt in track-look.v5.js als ganze Bühne, nicht als Baustein.'],
      ['TUNE', '#f2c879', 'Haus = KayKit building_A im Golden-Weg (v8), auf 9 m skaliert. Anschluss an den B2-Fassaden-Owner fehlt noch.'],
      ['OPEN', '#ffb38a', 'Figuren fehlen absichtlich: Plätze sind geplant (gelb), Figuren kommen aus dem Register (eigenes To-do).'],
      ['TUNE', '#f2c879', 'Bach mit Schlucht unter der Straße, Wasserfall über die Kante. Stützen nach J14-Rezept sind Platzhalter bis zum Joyride-Baustein.'],
      ['OPEN', '#ffb38a', 'Kreuzung, Kreisverkehr, Tunnel, Dreiergruppe und R2C-Vergleich mit gleicher Kamera folgen als nächster Schritt.']
    ].map(([k, c, v]) => ({ k, c, v }));
    return { canvasRef: this.canvasRef, loading: S.loading, note: S.note, views, seeds, biomes, layers, shapes, legend, isMask: S.layer === 'masken', stats: S.stats, status,
      panelOpen: S.panelOpen, panelLabel: S.panelOpen ? 'Leiste aus' : 'Leiste an', togglePanel: () => { const v = !this.state.panelOpen; localStorage.setItem('r2d-v0-panel', v ? '1' : '0'); this.setState({ panelOpen: v }); },
      exportRecipe: () => { if (!this.api) return; const b = new Blob([JSON.stringify(this.api.recipe(), null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'r2d-v0-insel-' + S.seed + '-' + S.biome + '.json'; a.click(); } };
  }
}
</script>
</body>
</html>
