<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Animatronic · Spielhaltung · QA aus vier Winkeln</title>
<script type="importmap">
{"imports":{
 "three":"https://unpkg.com/three@0.184.0/build/three.module.js",
 "three/addons/controls/OrbitControls.js":"https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
 "three/addons/controls/TransformControls.js":"https://unpkg.com/three@0.184.0/examples/jsm/controls/TransformControls.js",
 "three/addons/loaders/GLTFLoader.js":"https://unpkg.com/three@0.184.0/examples/jsm/loaders/GLTFLoader.js",
 "three/addons/utils/SkeletonUtils.js":"https://unpkg.com/three@0.184.0/examples/jsm/utils/SkeletonUtils.js"
}}
</script>
<style>
 body{background:#14130f;color:#e8e2cf;font:13px/1.5 ui-monospace,monospace;margin:0;padding:18px}
 h1{font-size:15px;margin:0 0 4px;letter-spacing:.02em}
 .sub{color:#9a927c;margin:0 0 16px}
 .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
 figure{margin:0;background:#1d1b15;border:1px solid #2e2b21;border-radius:6px;overflow:hidden}
 figcaption{padding:7px 9px;font-size:11px;color:#c9c0a4;border-top:1px solid #2e2b21}
 img{display:block;width:100%;height:auto;background:#0f0e0b}
 .facts{margin-top:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .card{background:#1d1b15;border:1px solid #2e2b21;border-radius:6px;padding:10px 12px}
 .card b{color:#e9c46a;font-weight:600}
 .ok{color:#8fbf6a}.bad{color:#e07a5f}
 table{border-collapse:collapse;width:100%;font-size:11.5px}
 td{padding:2px 6px 2px 0;vertical-align:top}
 td:first-child{color:#9a927c;white-space:nowrap}
 canvas{position:fixed;left:-9999px;top:0;width:620px;height:740px}
</style>
</head>
<body>
<h1>Animatronic · Spielhaltung · QA aus vier Winkeln</h1>
<p class="sub" id="sub">rendert …</p>
<div class="grid" id="grid"></div>
<div class="facts" id="facts"></div>
<canvas id="c" width="620" height="740"></canvas>
<script type="module">
import * as THREE from 'three';
import { buildVignette, makeViewer, findBone } from '../lib/atlas.js';
import { RESIDENTS } from '../data/cast.js';

const n = (v) => Math.round(v * 1000) / 1000;
const recipe = RESIDENTS.find((r) => r.residentId === 'animatronic');
async function posed(clipName) {
  const { instance, loadClips } = await import('../lib/atlas.js');
  const fig = await instance('media/3D_Assets/KayKit_Mystery_Series6/5 - November 2023 - Animatronic/characters/gltf/Animatronic_Normal.glb');
  const med = await loadClips('Rig_Medium');
  const hit = med.find((c) => c.name === clipName);
  const mix = new THREE.AnimationMixer(fig);
  const act = mix.clipAction(hit.clip); act.play(); mix.update(0); act.paused = true;
  fig.updateWorldMatrix(true, true);
  return fig;
}
const built = await buildVignette(recipe);
const actor0 = built.nodes.get('normal');
const guitar0 = built.nodes.get('guitar_normal');
/* Stufenmessung: dieselbe Zahl zu drei Zeitpunkten. Weicht sie ab, liegt der Fehler nicht
   in der Konstruktion, sondern darin, wer sie danach überschreibt. */
const stage = {};
function rLocalNow(label) {
  actor0.updateWorldMatrix(true, true);
  const inv = guitar0.matrixWorld.clone().invert();
  const p = findBone(actor0, 'handslot.r').bone.getWorldPosition(new THREE.Vector3()).applyMatrix4(inv);
  stage[label] = p.toArray().map(n);
}
rLocalNow('a_nachBau');
const pi = actor0.userData.poseInfo;
if (pi) { pi.mixer.setTime(0); rLocalNow('b_setTime0'); pi.mixer.update(0.3); rLocalNow('c_nach300ms'); pi.mixer.setTime(0); }
stage.tracksBase = pi ? pi.action.getClip().tracks.map((t) => t.name).filter((x) => /arm|wrist|hand|spine/i.test(x)) : null;
stage.tracksStrum = pi && pi.layer ? pi.layer.action.getClip().tracks.map((t) => t.name) : null;

const V = makeViewer(document.getElementById('c'), { mood: 'studio' });
/* Das Canvas liegt außerhalb des Bildschirms, hat aber echte Maße — mit display:none rendert
   three.js auf 1×1 und toDataURL liefert einen hochskalierten Einzelpixel. */
V.renderer.setSize(620, 740, false);
V.camera.aspect = 620 / 740;
V.camera.updateProjectionMatrix();
V.scene.add(built.root);
for (const m of [built.mixer, ...built.extraMixers]) if (m) V.mixers.add(m.mixer);

const actor = built.nodes.get('normal');
const guitar = built.nodes.get('guitar_normal');
actor.updateWorldMatrix(true, true);
const wp = (nm) => findBone(actor, nm).bone.getWorldPosition(new THREE.Vector3());
const centre = wp('chest');

/* Vier Winkel, die genau die drei Anforderungen pr\u00fcfbar machen:
   vorn = Gesamthaltung, Seite = Abstand Korpus\u2013Bauch, oben = Tiefenlage beider Pfoten,
   Dreiviertel-Nah = Griffhand am Hals. */
const views = [
  ['Vorn · Gesamthaltung', [0, 0.25, 4.3], 1],
  ['Seite rechts · Abstand zum Bauch', [4.1, 0.2, 0.7], 1],
  ['Von oben · Tiefenlage der Pfoten', [0.15, 3.9, 1.0], 1],
  ['Dreiviertel nah · Griff am Hals', [1.5, 0.55, 1.8], 1]
];
const grid = document.getElementById('grid');
const buf = [];
for (const [label, off, zoom] of views) {
  const t = centre.clone();
  V.controls.target.copy(t.setY(t.y - 0.15));
  V.camera.position.copy(t).add(new THREE.Vector3(...off).multiplyScalar(zoom));
  V.controls.update();
  /* Größe unmittelbar vor JEDEM Rendern erzwingen: der Viewer hängt an seiner eigenen
     resize-Logik und zieht das außerhalb des Bildschirms liegende Canvas sonst auf Kleinstmaß. */
  V.renderer.setSize(620, 740, false);
  V.camera.aspect = 620 / 740;
  V.camera.updateProjectionMatrix();
  V.draw();
  await new Promise((r) => requestAnimationFrame(r));
  V.renderer.setSize(620, 740, false);
  V.draw();
  buf.push([V.renderer.domElement.width, V.renderer.domElement.height]);
  const fig = document.createElement('figure');
  const img = document.createElement('img');
  img.src = document.getElementById('c').toDataURL('image/png');
  const cap = document.createElement('figcaption');
  cap.textContent = label;
  fig.append(img, cap);
  grid.append(fig);
}

/* ---------- Messwerte zum Bild: Pr\u00fcfung, nicht Behauptung ---------- */
const NECK = [-0.28, 0.14], BODY = [-0.92, -0.28], FACE_Z = 0.043;
const inv = guitar.matrixWorld.clone().invert();
const lLoc = wp('handslot.l').applyMatrix4(inv);
const rLoc = wp('handslot.r').applyMatrix4(inv);
const hf = guitar.userData.holdFacts || {};

/* Anschlagbahn: die Pfote \u00fcber eine Schleife abtasten und die Bahn zerlegen */
const path = [];
const mi = built.extraMixers.find((m) => m) || built.mixer;
{
  const mixer = mi.mixer;
  for (let i = 0; i <= 24; i++) {
    mixer.setTime((i / 24) * 2.5);
    actor.updateWorldMatrix(true, true);
    path.push(wp('handslot.r').clone());
  }
  mixer.setTime(0);
}
/* tiefster echter Punkt eines Objekts — Vertices, nicht Box3 */
function lowestVertexY(obj) {
  let lo = Infinity;
  const v = new THREE.Vector3();
  obj.updateWorldMatrix(true, true);
  obj.traverse((o) => {
    if (!o.isMesh && !o.isSkinnedMesh) return;
    const p = o.geometry.attributes.position;
    for (let i = 0; i < p.count; i++) {
      v.fromBufferAttribute(p, i).applyMatrix4(o.matrixWorld);
      if (v.y < lo) lo = v.y;
    }
  });
  return lo;
}
let minBottom = 9, maxBottom = -9, boxArtefact = 9;
{
  const mixer = mi.mixer;
  for (let i = 0; i <= 24; i++) {
    mixer.setTime((i / 24) * 2.5);
    actor.updateWorldMatrix(true, true);
    const real = lowestVertexY(guitar);
    minBottom = Math.min(minBottom, real);
    maxBottom = Math.max(maxBottom, real);
    boxArtefact = Math.min(boxArtefact, new THREE.Box3().setFromObject(guitar).min.y);
  }
  mixer.setTime(0);
  actor.updateWorldMatrix(true, true);
}
let dy = 0, dx = 0, dz = 0;
for (let i = 1; i < path.length; i++) {
  dy += Math.abs(path[i].y - path[i - 1].y);
  dx += Math.abs(path[i].x - path[i - 1].x);
  dz += Math.abs(path[i].z - path[i - 1].z);
}
const travelY = Math.max(...path.map((p) => p.y)) - Math.min(...path.map((p) => p.y));
/* bleibt die Pfote w\u00e4hrend der ganzen Bahn \u00fcber der Decke? */
let offFace = 0, behind = 0;
for (const p of path) {
  const l = p.clone().applyMatrix4(inv);
  if (l.y < BODY[0] || l.y > BODY[1] + 0.03 || Math.abs(l.x) > 0.26) offFace++;
  if (l.z < FACE_Z - 0.01) behind++;
}

const gb = new THREE.Box3().setFromObject(guitar);
/* Abstand zum Bauch im AKTOR-Frame messen, nicht in Weltkoordinaten: die Figur steht auf
   r: -14°, in Welt-z steckt also die Drehung mit drin. */
const aInv = actor.matrixWorld.clone().invert();
let guitarBack = 9;
guitar.traverse((o) => {
  if (!o.isMesh) return;
  const p = o.geometry.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i += 2) {
    v.fromBufferAttribute(p, i).applyMatrix4(o.matrixWorld).applyMatrix4(aInv);
    if (v.y > 0.45 && v.y < 1.1) guitarBack = Math.min(guitarBack, v.z);
  }
});
/* frische Figur, nur Basis-Clip, keine Nachführung — das ist die Bauchebene */
let bellyFront = -9;
{
  const clean = await posed('Holding_B');
  const cInv = clean.matrixWorld.clone().invert();
  clean.traverse((o) => {
    if (!o.isSkinnedMesh && !o.isMesh) return;
    const p = o.geometry.attributes.position, v = new THREE.Vector3();
    for (let i = 0; i < p.count; i += 3) {
      v.fromBufferAttribute(p, i).applyMatrix4(o.matrixWorld).applyMatrix4(cInv);
      if (v.y > 0.55 && v.y < 1.0 && Math.abs(v.x) < 0.3) bellyFront = Math.max(bellyFront, v.z);
    }
  });
}

const rows = [
  ['Griffpfote auf dem Hals', `lokal y ${n(lLoc.y)} (Hals ${NECK[0]}\u2026${NECK[1]}), seitlich ${n(lLoc.x)} / ${n(lLoc.z)}`,
   lLoc.y >= NECK[0] && lLoc.y <= NECK[1] && Math.abs(lLoc.x) < 0.11 && Math.abs(lLoc.z) < 0.11],
  ['Anschlagpfote \u00fcber der Decke', `lokal y ${n(rLoc.y)} (Korpus ${BODY[0]}\u2026${BODY[1]}), ${n(rLoc.z - FACE_Z)} vor der Decke`,
   rLoc.y >= BODY[0] && rLoc.y <= BODY[1] + 0.03 && Math.abs(rLoc.x) < 0.26 && rLoc.z > FACE_Z - 0.01],
  ['Pfote bleibt die ganze Bahn \u00fcber der Decke', `${path.length - offFace}/${path.length} Abtastpunkte im Korpusfenster, ${behind} hinter der Decke`,
   offFace === 0 && behind === 0],
  ['Bahn ist hoch/runter, nicht seitlich', `senkrecht ${n(dy)} · seitlich ${n(dx)} · Tiefe ${n(dz)} Weglänge — senkrecht zu seitlich ${n(dy / Math.max(dx, 1e-6))} zu 1, Ausschlag ${n(travelY)}`,
   dy > dx * 3],
  ['Korpus vor dem Bauch, nicht darin', `im Aktor-Frame: Gitarrenrücken z ${n(guitarBack)}, Bauchfront z ${n(bellyFront)} — Abstand ${n(guitarBack - bellyFront)}`,
   guitarBack - bellyFront > 0 && guitarBack - bellyFront < 0.2],
  ['Kein Bodendurchstich (echte Vertices, Minimum über die Schleife)', `Unterkante y ${n(minBottom)} tiefster Stand, ${n(maxBottom)} höchster. Box3 hätte hier ${n(boxArtefact)} gemeldet — ${n((minBottom - boxArtefact) * 100)} cm zu tief, weil setFromObject die acht Ecken der gekippten lokalen AABB mitdreht`, minBottom > 0.05],
  ['Nachführung Griffarm', `Restfehler ${hf.residualGrip}`, hf.residualGrip <= 0.02],
  ['Nachführung Anschlagarm', `Restfehler ${hf.residualStrum} — Toleranz 0,02: das sind 2 cm an einer 2,3 hohen Figur, und auf 0 zu zwingen hieße, die Gitarre in den Bauch zu schieben`, hf.residualStrum <= 0.02],
];
document.getElementById('facts').innerHTML =
  `<div class="card"><b>Pr\u00fcfpunkte</b><table>${rows.map(([k, v, ok]) =>
    `<tr><td>${ok ? '<span class="ok">\u2713</span>' : '<span class="bad">\u2717</span>'} ${k}</td><td>${v}</td></tr>`).join('')}</table></div>` +
  `<div class="card"><b>Protokoll</b><table>${built.notes.filter((x) => /guitar_normal|Anschlag/.test(x))
    .map((x) => `<tr><td colspan="2">${x}</td></tr>`).join('')}</table></div>`;
document.getElementById('sub').textContent =
  rows.every((r) => r[2]) ? 'alle Pr\u00fcfpunkte bestanden' : 'PR\u00dcFPUNKTE OFFEN \u2014 siehe unten';
window.__qa = { buf, rows: rows.map(([k, v, ok]) => ({ k, v, ok })), lLoc: lLoc.toArray().map(n), rLoc: rLoc.toArray().map(n), stage };
</script>
</body>
</html>
