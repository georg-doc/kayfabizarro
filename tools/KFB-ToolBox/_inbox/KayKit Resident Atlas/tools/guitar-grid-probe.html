<html lang="de">
<head><meta charset="utf-8"><title>Spielhaltung · Rasterlauf mit Anatomie-Kriterien</title>
<script type="importmap">
{"imports":{
 "three":"https://unpkg.com/three@0.184.0/build/three.module.js",
 "three/addons/controls/OrbitControls.js":"https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
 "three/addons/controls/TransformControls.js":"https://unpkg.com/three@0.184.0/examples/jsm/controls/TransformControls.js",
 "three/addons/loaders/GLTFLoader.js":"https://unpkg.com/three@0.184.0/examples/jsm/loaders/GLTFLoader.js",
 "three/addons/utils/SkeletonUtils.js":"https://unpkg.com/three@0.184.0/examples/jsm/utils/SkeletonUtils.js"

</script>
<style>body{background:#12110d;color:#e8e2cf;font:12px/1.5 ui-monospace,monospace;padding:16px}pre{white-space:pre-wrap}</style>
</head>
<body><pre id="out">rechne …</pre>
<script type="module">
import * as THREE from 'three';
import { instance, loadClips, findBone } from '../lib/atlas.js';

const AN = 'media/3D_Assets/KayKit_Mystery_Series6/5 - November 2023 - Animatronic/';
const n = (v) => Math.round(v * 1000) / 1000;
const D = THREE.MathUtils.degToRad;
const out = { anatomy: {}, torso: {}, slots: {}, top: [], count: 0 };

/* ---------- gemessene Anatomie der Gitarre (Querschnittsprofil, S28) ----------
   Hals   lokal y -0,28 \u2026 +0,14  (Breite 0,09\u20130,12)
   Kopfplatte    y +0,14 \u2026 +0,36  (Breite 0,247)
   Korpus        y -0,92 \u2026 -0,28  (Breite 0,26 \u2026 0,50)
   Decke liegt bei lokal z \u2248 +0,043, R\u00fcckseite bei -0,10.                      */
const NECK = [-0.28, 0.14], BODY = [-0.92, -0.28], FACE_Z = 0.043;
out.anatomy = { neck: NECK, body: BODY, faceZ: FACE_Z };

const med = await loadClips('Rig_Medium');
const fig = await instance(AN + 'characters/gltf/Animatronic_Normal.glb');
const hit = med.find((c) => c.name === 'Holding_B');
const mix = new THREE.AnimationMixer(fig);
const act = mix.clipAction(hit.clip); act.play(); mix.update(0); act.paused = true;
fig.updateWorldMatrix(true, true);

const bone = (nm) => findBone(fig, nm).bone;
const L = bone('handslot.l').getWorldPosition(new THREE.Vector3());
const R = bone('handslot.r').getWorldPosition(new THREE.Vector3());
const HEAD = bone('head').getWorldPosition(new THREE.Vector3());
out.slots = { L: L.toArray().map(n), R: R.toArray().map(n), HEAD: HEAD.toArray().map(n),
              LtoR: n(L.distanceTo(R)) };

/* Bauchfront der posierten Figur: bis wohin darf der Korpus nach hinten, ohne zu stecken?
   Aus den posierten Mesh-Vertices gemessen, nicht aus der Rest-Box \u2014 Skinning z\u00e4hlt hier. */
{
  let front = -9, back = 9, xw = 0;
  fig.traverse((o) => {
    if (!o.isSkinnedMesh && !o.isMesh) return;
    const p = o.geometry.attributes.position;
    const v = new THREE.Vector3();
    for (let i = 0; i < p.count; i++) {
      v.fromBufferAttribute(p, i).applyMatrix4(o.matrixWorld);
      if (v.y < 0.5 || v.y > 1.05 || Math.abs(v.x) > 0.34) continue;
      front = Math.max(front, v.z); back = Math.min(back, v.z); xw = Math.max(xw, Math.abs(v.x));
    }
  });
  out.torso = { bellyFrontZ: n(front), bellyBackZ: n(back), halfWidth: n(xw),
                note: 'Rumpf-Vertices in y 0,50\u20131,05 und |x| \u2264 0,34 der POSIERTEN Figur' };
}
const BELLY = out.torso.bellyFrontZ;

/* Gitarren-Vertices einmal in lokalen Koordinaten einsammeln */
const guitar = await instance(AN + 'assets/gltf/Guitar.gltf');
guitar.updateWorldMatrix(true, true);
const localVerts = [];
guitar.traverse((o) => {
  if (!o.isMesh) return;
  const p = o.geometry.attributes.position;
  for (let i = 0; i < p.count; i++) localVerts.push(new THREE.Vector3().fromBufferAttribute(p, i).applyMatrix4(o.matrix));
});
const bodyVerts = localVerts.filter((v) => v.y <= BODY[1]);

const holder = bone('handslot.l');
const bq = holder.getWorldQuaternion(new THREE.Quaternion());
const AXIS = new THREE.Vector3(0, 1, 0);

function evaluate(aim, grip, roll) {
  const want = new THREE.Vector3(...aim).normalize();
  const wantLocal = want.clone().applyQuaternion(bq.clone().invert());
  const q = new THREE.Quaternion().setFromUnitVectors(AXIS, wantLocal);
  if (roll) q.multiply(new THREE.Quaternion().setFromAxisAngle(AXIS, D(roll)));
  const worldQ = bq.clone().multiply(q);
  const pos = L.clone().add(AXIS.clone().applyQuaternion(worldQ).multiplyScalar(grip));
  const m = new THREE.Matrix4().compose(pos, worldQ, new THREE.Vector3(1, 1, 1));
  const inv = m.clone().invert();

  const lLocal = L.clone().applyMatrix4(inv);
  const rLocal = R.clone().applyMatrix4(inv);
  const normal = new THREE.Vector3(0, 0, 1).applyQuaternion(worldQ);
  const long = AXIS.clone().applyQuaternion(worldQ);
  const neckTip = pos.clone().add(long.clone().multiplyScalar(0.356));

  /* Bodenabstand und Rumpfdurchdringung aus echten Vertices */
  let minY = 9, deepest = 9, inTorso = 0;
  const v = new THREE.Vector3();
  for (const lv of localVerts) { v.copy(lv).applyMatrix4(m); if (v.y < minY) minY = v.y; }
  for (const lv of bodyVerts) {
    v.copy(lv).applyMatrix4(m);
    if (v.z < deepest) deepest = v.z;
    if (v.z < BELLY - 0.01 && v.y > 0.5 && v.y < 1.05 && Math.abs(v.x) < 0.34) inTorso++;
  }

  /* Kriterien \u2014 jede Zahl gegen die gemessene Anatomie, nicht gegen ein Gef\u00fchl */
  const gripOnNeck = lLocal.y >= NECK[0] && lLocal.y <= NECK[1] && Math.abs(lLocal.x) < 0.1 && Math.abs(lLocal.z) < 0.1;
  const strumOverFace = rLocal.y >= BODY[0] + 0.05 && rLocal.y <= BODY[1] + 0.02 &&
                        Math.abs(rLocal.x) < 0.24 && rLocal.z > FACE_Z - 0.02 && rLocal.z < FACE_Z + 0.16;
  const faceFwd = normal.z;
  const skew = Math.abs(normal.x);
  const headClear = neckTip.distanceTo(HEAD);
  const bellyGap = deepest - BELLY;     // >0 = vor dem Bauch, <0 = drin

  let score = 0;
  if (gripOnNeck) score += 40; else score -= Math.abs(lLocal.y - (-0.07)) * 60;
  if (strumOverFace) score += 40; else {
    score -= Math.abs(rLocal.y - (-0.58)) * 30;
    score -= Math.abs(rLocal.z - (FACE_Z + 0.06)) * 40;
    score -= Math.max(0, Math.abs(rLocal.x) - 0.24) * 40;
  }
  score += faceFwd * 14 - skew * 10;
  if (inTorso > 0) score -= 30 + inTorso * 0.2;
  if (bellyGap > 0.02 && bellyGap < 0.16) score += 8; else score -= Math.abs(bellyGap - 0.08) * 20;
  if (minY < 0.05) score -= 25;
  if (headClear < 0.45) score -= 20;

  return { score: n(score), gripOnNeck, strumOverFace,
    lLocal: lLocal.toArray().map(n), rLocal: rLocal.toArray().map(n),
    faceNormal: normal.toArray().map(n), elevation: n(THREE.MathUtils.radToDeg(Math.asin(long.y))),
    neckTip: neckTip.toArray().map(n), headClear: n(headClear),
    minY: n(minY), bellyGap: n(bellyGap), inTorso,
    aim: aim.map(n), grip, roll };
}

/* Rasterlauf. Azimut 0\u00b0 = +x (nach au\u00dfen), dreht in Richtung +z (nach vorn). */
const results = [];
for (const el of [10, 16, 22, 28, 34]) {
  for (const az of [0, 10, 20, 30, 40]) {
    const aim = [Math.cos(D(el)) * Math.cos(D(az)), Math.sin(D(el)), Math.cos(D(el)) * Math.sin(D(az))];
    for (const grip of [0.04, 0.08, 0.12, 0.16, 0.2]) {
      for (let roll = 0; roll < 360; roll += 15) results.push(evaluate(aim, grip, roll));
    }
  }
}
out.count = results.length;
results.sort((a, b) => b.score - a.score);
out.top = results.slice(0, 10);
out.bothOk = results.filter((r) => r.gripOnNeck && r.strumOverFace && r.inTorso === 0).length;

document.getElementById('out').textContent = JSON.stringify(out, null, 1);
window.__r = out;
</script>
</body>
</html>
