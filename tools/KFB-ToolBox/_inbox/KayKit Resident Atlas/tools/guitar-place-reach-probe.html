<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Spielhaltung · Platzierung + Arm-Nachführung</title>
<script type="importmap">
{"imports":{
 "three":"https://unpkg.com/three@0.184.0/build/three.module.js",
 "three/addons/controls/OrbitControls.js":"https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
 "three/addons/controls/TransformControls.js":"https://unpkg.com/three@0.184.0/examples/jsm/controls/TransformControls.js",
 "three/addons/loaders/GLTFLoader.js":"https://unpkg.com/three@0.184.0/examples/jsm/loaders/GLTFLoader.js",
 "three/addons/utils/SkeletonUtils.js":"https://unpkg.com/three@0.184.0/examples/jsm/utils/SkeletonUtils.js"
}}
</script>
<style>body{background:#12110d;color:#e8e2cf;font:12px/1.5 ui-monospace,monospace;padding:16px}pre{white-space:pre-wrap}</style>
</head>
<body><pre id="out">rechne …</pre>
<script type="module">
import * as THREE from 'three';
import { instance, loadClips, findBone } from '../lib/atlas.js';

const AN = 'media/3D_Assets/KayKit_Mystery_Series6/5 - November 2023 - Animatronic/';
const n = (v) => Math.round(v * 1000) / 1000;
const D = THREE.MathUtils.degToRad;
const NECK = [-0.28, 0.14], BODY = [-0.92, -0.28], FACE_Z = 0.043;
const out = { place: [], reach: {}, strumPath: {} };

const med = await loadClips('Rig_Medium');
async function posedFigure() {
  const fig = await instance(AN + 'characters/gltf/Animatronic_Normal.glb');
  const hit = med.find((c) => c.name === 'Holding_B');
  const mix = new THREE.AnimationMixer(fig);
  const act = mix.clipAction(hit.clip); act.play(); mix.update(0); act.paused = true;
  fig.updateWorldMatrix(true, true);
  return fig;
}
const fig = await posedFigure();
const B = (nm) => findBone(fig, nm).bone;
const L = B('handslot.l').getWorldPosition(new THREE.Vector3());
const HEAD = B('head').getWorldPosition(new THREE.Vector3());
const BELLY = 0.333; // gemessen in S28 an der posierten Figur

const guitar = await instance(AN + 'assets/gltf/Guitar.gltf');
guitar.updateWorldMatrix(true, true);
const localVerts = [];
guitar.traverse((o) => {
  if (!o.isMesh) return;
  const p = o.geometry.attributes.position;
  for (let i = 0; i < p.count; i++) localVerts.push(new THREE.Vector3().fromBufferAttribute(p, i).applyMatrix4(o.matrix));
});
const bodyVerts = localVerts.filter((v) => v.y <= BODY[1]);

const bq = B('handslot.l').getWorldQuaternion(new THREE.Quaternion());
const AXIS = new THREE.Vector3(0, 1, 0);

/* Roll wird nicht mehr gesweept, sondern GEL\u00d6ST: gesucht ist der Roll, bei dem die Decke
   am weitesten nach vorn zeigt. Die Ebene senkrecht zur L\u00e4ngsachse enth\u00e4lt immer genau eine
   solche Richtung \u2014 also 1\u00b0-Suche statt Rasterraten. */
function place(aim, grip, rollDeg) {
  const want = new THREE.Vector3(...aim).normalize();
  const wantLocal = want.clone().applyQuaternion(bq.clone().invert());
  const q = new THREE.Quaternion().setFromUnitVectors(AXIS, wantLocal);
  if (rollDeg) q.multiply(new THREE.Quaternion().setFromAxisAngle(AXIS, D(rollDeg)));
  const worldQ = bq.clone().multiply(q);
  const pos = L.clone().add(AXIS.clone().applyQuaternion(worldQ).multiplyScalar(grip));
  return { worldQ, pos, m: new THREE.Matrix4().compose(pos, worldQ, new THREE.Vector3(1, 1, 1)) };
}
function solveRoll(aim, grip) {
  let best = null;
  for (let r = 0; r < 360; r += 1) {
    const p = place(aim, grip, r);
    const z = new THREE.Vector3(0, 0, 1).applyQuaternion(p.worldQ).z;
    if (!best || z > best.z) best = { roll: r, z };
  }
  return best;
}
function metrics(aim, grip, roll) {
  const p = place(aim, grip, roll);
  const inv = p.m.clone().invert();
  const lLocal = L.clone().applyMatrix4(inv);
  const normal = new THREE.Vector3(0, 0, 1).applyQuaternion(p.worldQ);
  const long = AXIS.clone().applyQuaternion(p.worldQ);
  const neckTip = p.pos.clone().add(long.clone().multiplyScalar(0.356));
  let minY = 9, deepest = 9, inTorso = 0;
  const v = new THREE.Vector3();
  for (const lv of localVerts) { v.copy(lv).applyMatrix4(p.m); if (v.y < minY) minY = v.y; }
  for (const lv of bodyVerts) {
    v.copy(lv).applyMatrix4(p.m);
    if (v.z < deepest) deepest = v.z;
    if (v.z < BELLY - 0.01 && v.y > 0.45 && v.y < 1.1 && Math.abs(v.x) < 0.34) inTorso++;
  }
  /* Anschlagziel: Mitte der Decke, 6 cm davor \u2014 dorthin wird der rechte Arm nachgef\u00fchrt */
  const target = new THREE.Vector3(0, -0.56, FACE_Z + 0.06).applyMatrix4(p.m);
  return { aim: aim.map(n), grip, roll,
    lLocalY: n(lLocal.y), lLocalXZ: [n(lLocal.x), n(lLocal.z)],
    gripOnNeck: lLocal.y >= NECK[0] && lLocal.y <= NECK[1] && Math.abs(lLocal.x) < 0.1 && Math.abs(lLocal.z) < 0.1,
    faceNormal: normal.toArray().map(n), elevation: n(THREE.MathUtils.radToDeg(Math.asin(long.y))),
    headClear: n(neckTip.distanceTo(HEAD)), minY: n(minY), bellyGap: n(deepest - BELLY), inTorso,
    target: target.toArray().map(n), m: p.m };
}

/* ---------- 1 \u00b7 Platzierung: harte Tore statt Punkteabzug ---------- */
const cand = [];
for (const el of [18, 24, 30, 36]) {
  for (const az of [8, 16, 24, 32, 40]) {
    const aim = [Math.cos(D(el)) * Math.cos(D(az)), Math.sin(D(el)), Math.cos(D(el)) * Math.sin(D(az))];
    for (const grip of [0.02, 0.06, 0.1, 0.14]) {
      const roll = solveRoll(aim, grip).roll;
      const mm = metrics(aim, grip, roll);
      if (!mm.gripOnNeck) continue;
      if (mm.faceNormal[2] < 0.8) continue;
      if (mm.inTorso > 0) continue;
      if (mm.minY < 0.1) continue;
      if (mm.headClear < 0.5) continue;
      if (mm.bellyGap < 0.015 || mm.bellyGap > 0.14) continue;
      cand.push(mm);
    }
  }
}
/* Rangfolge: Decke m\u00f6glichst frontal, Korpus m\u00f6glichst nah am Bauch */
cand.sort((a, b) => (b.faceNormal[2] - a.faceNormal[2]) * 2 + (a.bellyGap - b.bellyGap));
out.place = cand.slice(0, 8).map(({ m, ...rest }) => rest);
out.placeCount = cand.length;
if (!cand.length) { document.getElementById('out').textContent = 'kein Kandidat passiert die Tore'; throw new Error('leer'); }
const pick = cand[0];

/* ---------- 2 \u00b7 Arm-Nachf\u00fchrung (CCD) ---------- */
/* Zwei Pfoten an einem Instrument gehen mit Holding_B nicht von allein: der Clip stellt die
   rechte Pfote 0,15 tiefer in z als die linke. Statt die Gitarre zu verbiegen, wird der ARM
   nachgef\u00fchrt \u2014 drei Bones, iterativ, gegen ein gemessenes Ziel auf der Decke. */
function reachTo(figure, chain, tipName, targetArr, iters = 24) {
  const target = new THREE.Vector3(...targetArr);
  const tip = findBone(figure, tipName).bone;
  const bones = chain.map((c) => findBone(figure, c).bone);
  const before = tip.getWorldPosition(new THREE.Vector3()).distanceTo(target);
  const q = new THREE.Quaternion(), a = new THREE.Vector3(), b = new THREE.Vector3();
  for (let it = 0; it < iters; it++) {
    for (const bone of bones) {
      figure.updateWorldMatrix(true, true);
      const bp = bone.getWorldPosition(new THREE.Vector3());
      a.copy(tip.getWorldPosition(new THREE.Vector3())).sub(bp).normalize();
      b.copy(target).sub(bp).normalize();
      q.setFromUnitVectors(a, b);
      const parentQ = bone.parent.getWorldQuaternion(new THREE.Quaternion());
      const localDelta = parentQ.clone().invert().multiply(q).multiply(parentQ);
      bone.quaternion.premultiply(localDelta);
    }
  }
  figure.updateWorldMatrix(true, true);
  const after = tip.getWorldPosition(new THREE.Vector3()).distanceTo(target);
  return { before: n(before), after: n(after),
    rot: bones.map((bo, i) => chain[i] + ' ' + new THREE.Euler().setFromQuaternion(bo.quaternion).toArray().slice(0, 3).map((r) => n(THREE.MathUtils.radToDeg(r))).join('/')) };
}
const fig2 = await posedFigure();
out.reach = reachTo(fig2, ['upperarm.r', 'lowerarm.r', 'wrist.r'], 'handslot.r', pick.target);
{
  const inv = pick.m.clone().invert();
  const rl = findBone(fig2, 'handslot.r').bone.getWorldPosition(new THREE.Vector3()).applyMatrix4(inv);
  out.reach.rLocalAfter = rl.toArray().map(n);
  out.reach.overFace = rl.y >= BODY[0] && rl.y <= BODY[1] && Math.abs(rl.x) < 0.24 && rl.z > FACE_Z - 0.01;
}

/* ---------- 3 \u00b7 Anschlagrichtung: Senkrechte in die Deckenebene projiziert ---------- */
/* \u201eHoch/runter, nicht seitlich\u201c ist damit keine Setzung, sondern eine Rechnung: von der
   Weltsenkrechten bleibt genau der Anteil, der in der Deckenebene liegt. */
{
  const nrm = new THREE.Vector3(...pick.faceNormal).normalize();
  const dir = new THREE.Vector3(0, -1, 0).sub(nrm.clone().multiplyScalar(new THREE.Vector3(0, -1, 0).dot(nrm))).normalize();
  out.strumPath.dir = dir.toArray().map(n);
  out.strumPath.verticalShare = n(Math.abs(dir.y));
  out.strumPath.lateralShare = n(Math.hypot(dir.x, dir.z));
}
document.getElementById('out').textContent = JSON.stringify(out, null, 1);
window.__p = out;
</script>
</body>
</html>
