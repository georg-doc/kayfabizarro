<body><pre id="out">messe …</pre>
<script type="module">
import * as THREE from 'three';
import { measure, loadAsset, instance } from '../lib/atlas.js';

const LEGACY_PIN = '10a7fdce6b3a1ae22504ade71b7dbec5f25e0ff0';
const L = 'media/3D_Assets/KayKit Legacy/';
const W = L + 'Orc Warband - legacy/';
const A = L + 'KayKit Character Animations 1.2 - legacy/';

const assets = [
  W + 'characters/gltf/character_orcA.gltf',
  W + 'characters/gltf/character_orcB.gltf',
  W + 'props/gltf/orc_sword.gltf.glb',
  W + 'props/gltf/orc_shield.gltf.glb',
  W + 'props/gltf/orc_hammerAxe.gltf.glb',
  W + 'props/gltf/orc_banner.gltf.glb',
  A + 'Animations/gltf/KayKit_AnimatedCharacter_v1.2.glb',
  A + 'Models/gltf/PrototypePete.gltf'
];

const n = (v) => Math.round(v * 1000) / 1000;
const out = { pin: LEGACY_PIN, assets: {}, clips: null, textures: {} };

for (const p of assets) {
  try {
    const f = await measure(p, LEGACY_PIN);
    const g = await loadAsset(p, LEGACY_PIN);
    const mats = new Set(), maps = new Set();
    g.scene.traverse((o) => {
      if (!o.material) return;
      for (const m of [].concat(o.material)) {
        mats.add(m.name || m.type);
        if (m.map) maps.add(m.map.name || (m.map.image && (m.map.image.src || '').slice(-40)) || 'map');
      }
    });
    out.assets[f.name] = { size: f.size.map(n), min: f.min.map(n), max: f.max.map(n),
                           skin: f.skin, joints: f.joints, clips: f.clips,
                           materials: [...mats], maps: [...maps] };
  } catch (e) { out.assets[p.split('/').pop()] = 'ERR ' + e.message; }
}

/* does the legacy animated character carry the whole clip set in one file? */
try {
  const g = await loadAsset(A + 'Animations/gltf/KayKit_AnimatedCharacter_v1.2.glb', LEGACY_PIN);
  out.clips = g.animations.map((c) => ({ name: c.name, dur: n(c.duration), tracks: c.tracks.length }));
  /* bind the first clip against orcA and count resolving tracks */
  const host = await instance(W + 'characters/gltf/character_orcA.gltf', LEGACY_PIN);
  const rep = {};
  for (const c of g.animations) {
    let bound = 0;
    for (const t of c.tracks) if (host.getObjectByName(t.name.split('.')[0])) bound++;
    rep[c.name] = bound + '/' + c.tracks.length;
  }
  out.bindOrcA = rep;
  const hostJoints = [];
  host.traverse((o) => { if (o.isBone) hostJoints.push(o.name); });
  out.orcABones = hostJoints;
  const clipNodes = new Set();
  for (const c of g.animations) for (const t of c.tracks) clipNodes.add(t.name.split('.')[0]);
  out.clipTrackNodes = [...clipNodes].sort();
} catch (e) { out.clips = 'ERR ' + e.message; }

document.getElementById('out').textContent = JSON.stringify(out, null, 1);
window.__legacy = out;
</script>
