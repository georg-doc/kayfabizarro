<html lang="de">
<head><meta charset="utf-8"><title>Animatronic + Large-Rig-Maßstab · Messsonde</title>
<script type="importmap">
{"imports":{
 "three":"https://unpkg.com/three@0.184.0/build/three.module.js",
 "three/addons/controls/OrbitControls.js":"https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
 "three/addons/controls/TransformControls.js":"https://unpkg.com/three@0.184.0/examples/jsm/controls/TransformControls.js",
 "three/addons/loaders/GLTFLoader.js":"https://unpkg.com/three@0.184.0/examples/jsm/loaders/GLTFLoader.js",
 "three/addons/utils/SkeletonUtils.js":"https://unpkg.com/three@0.184.0/examples/jsm/utils/SkeletonUtils.js"

<style>body{background:#12110d;color:#e8e2cf;font:12px/1.5 ui-monospace,monospace;padding:16px}pre{white-space:pre-wrap}</style>
</head>
<body><pre id="out">messe …</pre>
<script type="module">
import * as THREE from 'three';
import { measure, instance, loadClips, findBone } from '../lib/atlas.js';

const P = 'media/3D_Assets/KayKit_Mystery_Series6/';
const AN = P + '5 - November 2023 - Animatronic/';
const OB = P + '2 - August 2025 - Orc Brute/';
const OR = P + '1 - July 2023 - Orc Raider/assets/gltf/';
const BK = P + '3 - September 2024 - Black Knight/';
const MO = P + '4 - October 2025 - Monstrosity/';

const paths = [
  AN + 'characters/gltf/Animatronic_Creepy.glb',
  AN + 'characters/gltf/Animatronic_Normal.glb',
  AN + 'assets/gltf/Guitar.gltf',
  /* Maßstabsvergleich klein vs. Large-Variante */
  BK + 'assets/gltf/BlackKnight_Sword.gltf', BK + 'assets/gltf/BlackKnight_Sword_Large.gltf',
  BK + 'assets/gltf/BlackKnight_Shield.gltf', BK + 'assets/gltf/BlackKnight_Shield_Large.gltf',
  MO + 'gltf/Monstrosity_BarndoorShield.gltf', MO + 'gltf/Monstrosity_BarndoorShield_Large.gltf',
  MO + 'gltf/Monstrosity_Pitchfork.gltf', MO + 'gltf/Monstrosity_Pitchfork_Large.gltf',
  OB + 'gltf/Orc_Axe.gltf', OB + 'gltf/Orc_Axe_Large.gltf',
  OB + 'gltf/Orc_Banner.gltf', OB + 'gltf/Orc_Banner_Large.gltf',
  OR + 'Orc_Club.gltf.glb', OR + 'Orc_Wardrum.gltf.glb', OR + 'Orc_WardrumStick.gltf.glb'
];

const n = (v) => Math.round(v * 1000) / 1000;
const out = { sizes: {}, clipsMedium: [], guitarCandidates: [], anim: {}, handSpan: {} };

for (const p of paths) {
  try {
    const f = await measure(p);
    out.sizes[f.name] = { size: f.size.map(n), min: f.min.map(n), max: f.max.map(n), skin: f.skin };
  } catch (e) { out.sizes[p] = 'ERR ' + e.message; }
}

const med = await loadClips('Rig_Medium');
out.clipsMedium = med.map((c) => c.set + '/' + c.name);
out.guitarCandidates = out.clipsMedium.filter((s) => /guit|play|strum|music|instr|hold|cheer|taunt|danc|sing|clap/i.test(s));

async function probe(path, rig, poses) {
  const clips = rig === 'Rig_Medium' ? med : await loadClips(rig);
  const res = {};
  for (const pn of poses) {
    const hit = clips.find((c) => c.name === pn);
    if (!hit) { res[pn] = 'kein Clip'; continue; }
    const node = await instance(path);
    const m = new THREE.AnimationMixer(node);
    const a = m.clipAction(hit.clip); a.play(); m.update(0); a.paused = true;
    node.updateWorldMatrix(true, true);
    const g = (bn) => {
      const f = findBone(node, bn);
      if (!f) return null;
      return f.bone.getWorldPosition(new THREE.Vector3()).toArray().map(n);
    };
    const b = new THREE.Box3().setFromObject(node);
    res[pn] = { 'handslot.r': g('handslot.r'), 'handslot.l': g('handslot.l'),
                head: g('head'), chest: g('chest'),
                box3: { min: b.min.toArray().map(n), max: b.max.toArray().map(n) } };
  }
  return res;
}

out.anim.Creepy = await probe(AN + 'characters/gltf/Animatronic_Creepy.glb', 'Rig_Medium',
  ['Idle_A', 'Idle_B', 'Holding_A', 'Holding_B', 'Holding_C', 'Cheering', 'Waving', 'Melee_2H_Idle']
    .filter((x) => med.some((c) => c.name === x)));

/* Handabstand als Maß für die Faustgröße: Large-Rig gegen Medium-Rig */
for (const [k, path, rig, pose] of [
  ['Animatronic_Creepy', AN + 'characters/gltf/Animatronic_Creepy.glb', 'Rig_Medium', 'Idle_A'],
  ['Monstrosity', MO + 'Monstrosity.glb', 'Rig_Large', 'Idle_A'],
  ['OrcBrute', OB + 'OrcBrute.glb', 'Rig_Large', 'Idle_A'],
  ['BlackKnight', BK + 'characters/BlackKnight.glb', 'Rig_Large', 'Idle_A']
]) {
  const r = await probe(path, rig, [pose]);
  const v = r[pose];
  if (v && v['handslot.r'] && v['handslot.l']) {
    const d = Math.hypot(v['handslot.r'][0] - v['handslot.l'][0], v['handslot.r'][1] - v['handslot.l'][1], v['handslot.r'][2] - v['handslot.l'][2]);
    out.handSpan[k] = { span: n(d), head: v.head, box3: v.box3 };
  } else out.handSpan[k] = v;
}

document.getElementById('out').textContent = JSON.stringify(out, null, 1);
window.__probe = out;
</script>
</body>
</html>
