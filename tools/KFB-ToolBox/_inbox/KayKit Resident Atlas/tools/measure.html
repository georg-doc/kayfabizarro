<!doctype html>
<html><head><meta charset="utf-8"><title>kit measure</title>
<script type="importmap">
{"imports":{
 "three":"https://unpkg.com/three@0.184.0/build/three.module.js",
 "three/addons/loaders/GLTFLoader.js":"https://unpkg.com/three@0.184.0/examples/jsm/loaders/GLTFLoader.js"
}}
</script>
</head>
<body style="font:12px ui-monospace,monospace;padding:12px;white-space:pre-wrap">
<div id="out">measuring…</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const RAW='https://raw.githubusercontent.com/georg-doc/kayfabizarro/main/media/3D_Assets/';
const DUN=RAW+'KayKit_Dungeon_Pack_1.1_FREE 2/Assets/gltf/';
const BG=RAW+'KayKit_BoardGameBits_1.0_FREE/Assets/gltf/';
const list=[
 [DUN,'floor_tile_large'],[DUN,'floor_tile_small'],[DUN,'wall'],[DUN,'wall_corner'],
 [DUN,'wall_doorway'],[DUN,'column'],[DUN,'table_medium'],[DUN,'chair'],[DUN,'barrel_large'],
 [BG,'D20_red'],[BG,'coin_gold'],[BG,'domino_tile_3-4']
];
const loader=new GLTFLoader(); const rows=[];
for(const [base,name] of list){
  try{
    const g=await loader.loadAsync(base+encodeURIComponent(name)+'.gltf');
    const box=new THREE.Box3().setFromObject(g.scene); const s=box.getSize(new THREE.Vector3()); const c=box.getCenter(new THREE.Vector3());
    let meshes=0,mats=new Set(); g.scene.traverse(o=>{if(o.isMesh){meshes++;(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m&&mats.add(m.name||'?'));}});
    rows.push({name,ok:true,size:[+s.x.toFixed(4),+s.y.toFixed(4),+s.z.toFixed(4)],min:[+box.min.x.toFixed(4),+box.min.y.toFixed(4),+box.min.z.toFixed(4)],center:[+c.x.toFixed(4),+c.y.toFixed(4),+c.z.toFixed(4)],meshes,mats:[...mats]});
  }catch(e){rows.push({name,ok:false,err:String(e.message||e).slice(0,120)});}
}
window.RESULT=rows;
document.getElementById('out').textContent=rows.map(r=>r.ok?`${r.name.padEnd(22)} size ${r.size.join(' × ')}  minY ${r.min[1]}  cx ${r.center[0]} cz ${r.center[2]}  meshes ${r.meshes}  mats ${r.mats.join(',')}`:`${r.name.padEnd(22)} FAIL ${r.err}`).join('\n');
</script>
</body></html>
