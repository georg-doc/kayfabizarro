    r.onload = () => { this._applyCfg(String(r.result || ''), f.name); if (this._fileEl) this._fileEl.value = ''; };
    r.readAsText(f);
  }

  renderVals() {
    const s = this.state;
    const btn = (on) => 'font:500 11.5px "IBM Plex Sans",sans-serif;padding:7px 11px;border:1px solid '
      + (on ? '#e6a13c' : '#2a2d30') + ';background:' + (on ? '#e6a13c' : 'transparent')
      + ';color:' + (on ? '#17181a' : '#c9c9c5') + ';cursor:pointer;border-radius:2px;';
    const seg = (on) => 'font:500 11.5px "IBM Plex Sans",sans-serif;padding:7px 4px;border:1px solid '
      + (on ? '#e6a13c' : '#2a2d30') + ';background:' + (on ? '#e6a13c' : 'transparent')
      + ';color:' + (on ? '#17181a' : '#c9c9c5') + ';cursor:pointer;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;';
    const head = (open) => 'width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;'
      + 'font:600 11px "IBM Plex Sans",sans-serif;letter-spacing:.7px;text-transform:uppercase;'
      + 'padding:11px 14px;border:none;background:' + (open ? '#1d1f21' : 'transparent') + ';color:#c9c9c5;cursor:pointer;text-align:left;';
    const sl = (label, value, min, max, step, on, fmt) => ({ isSlider: true, label, value, min, max, step,
      val: fmt ? fmt(value) : value.toFixed(2), on });
    const grid = (n) => 'display:grid;grid-template-columns:repeat(' + n + ',1fr);gap:5px;';
    const swStyle = (hex, on) => 'flex:1;height:26px;min-width:0;padding:0;border:1px solid ' + (on ? '#e6a13c' : '#2a2d30')
      + ';background:' + hex + ';cursor:pointer;border-radius:2px;font-size:0;';
    const cl = (label, zone) => ({ isColor: true, label, value: s.style.col[zone], val: s.style.col[zone],
      on: (e) => this._setCol(zone, e.target.value),
      swatches: PALETTE.map((hex) => ({ hex, style: swStyle(hex, s.style.col[zone].toLowerCase() === hex), on: () => this._setCol(zone, hex) })) });

    const partRows = (key, label) => {
      const p = s.parts[key];
      return [
        { isButtons: true, grid: grid(2), items: [
          { label: label + (p.on ? ' · an' : ' · aus'), style: seg(p.on), on: () => this._setPart(key, 'on', !p.on) },
          { label: 'mittig', style: seg(false), on: () => { this._setPart(key, 'x', 0); } },
        ] },
        sl(label + ' · X seitlich', p.x, -1.1, 1.1, 0.01, (e) => this._setPart(key, 'x', parseFloat(e.target.value))),
        sl(label + ' · Z vor/zurück', p.z, -1.1, 1.1, 0.01, (e) => this._setPart(key, 'z', parseFloat(e.target.value))),
        sl(label + ' · Höhe', p.y, -1.2, 1.5, 0.01, (e) => this._setPart(key, 'y', parseFloat(e.target.value))),
        sl(label + ' · Größe', p.s, 0.1, 2.5, 0.01, (e) => this._setPart(key, 's', parseFloat(e.target.value))),
      ];
    };
    const armRows = (side, label) => {
      const a = s.arms[side];
      return [
        sl(label + ' · Schulter heben', a.lift, -90, 90, 1, (e) => this._setArm(side, 'lift', parseFloat(e.target.value)), (v) => v.toFixed(0) + '°'),
        sl(label + ' · Schulter vor', a.fwd, -90, 90, 1, (e) => this._setArm(side, 'fwd', parseFloat(e.target.value)), (v) => v.toFixed(0) + '°'),
        sl(label + ' · Ellbogen', a.elbow, -120, 120, 1, (e) => this._setArm(side, 'elbow', parseFloat(e.target.value)), (v) => v.toFixed(0) + '°'),
      ];
    };

    const sections = [
      { key: 'fahrzeug', ord: 20, tab: 'veh', title: 'Fahrzeug · Rover', badge: s.veh.on ? '×' + s.veh.s.toFixed(2) : 'aus',
        rows: [
          { isButtons: true, grid: grid(2), items: [
            { label: s.veh.on ? 'Rover · an' : 'Rover · aus', style: seg(s.veh.on), on: () => this._setVeh('on', !s.veh.on) },
            { label: s.veh.ant ? 'Antenne · dran' : 'Antenne · weg', style: seg(s.veh.ant), on: () => this._setVeh('ant', !s.veh.ant) },
          ] },
          { isButtons: true, grid: grid(1), items: [
            { label: 'Bild auf den Rover', style: seg(false), on: () => this._frame(this._veh || this._rig) },
          ] },
          sl('Rover · Größe', s.veh.s, 0.2, 4, 0.02, (e) => this._setVeh('s', parseFloat(e.target.value)), (v) => '×' + v.toFixed(2)),
          { isNote: true, text: 'Rover_Round.gltf · Quaternius Space Kit · steht auf dem Boden (Unterkante 0)' },
        ] },
      { key: 'wanne', ord: 20, tab: 'tub', title: 'Wannen-Rig · Räder & Düse', badge: s.tub.wOn ? '4 Räder' : 'ohne',
        rows: [
          { isButtons: true, grid: grid(3), items: WHEELS.map(([k, f]) => ({ label: k, style: seg(s.tub.wheel === k), on: () => this._setTub('wheel', k) })) },
          { isButtons: true, grid: grid(2), items: [
            { label: s.tub.wOn ? 'Räder · an' : 'Räder · aus', style: seg(s.tub.wOn), on: () => this._setTub('wOn', !s.tub.wOn) },
            { label: s.tub.jOn ? 'Düse · an' : 'Düse · aus', style: seg(s.tub.jOn), on: () => this._setTub('jOn', !s.tub.jOn) },
          ] },
          sl('Rad · Durchmesser', s.tub.wSize, 0.1, 1.2, 0.01, (e) => this._setTub('wSize', parseFloat(e.target.value))),
          sl('Spurweite', s.tub.wTrack, 0.4, 1.8, 0.01, (e) => this._setTub('wTrack', parseFloat(e.target.value))),
          sl('Radstand', s.tub.wBase, 0.2, 1.4, 0.01, (e) => this._setTub('wBase', parseFloat(e.target.value))),
          sl('Wanne · höher legen', s.tub.wY, -0.3, 0.6, 0.01, (e) => this._setTub('wY', parseFloat(e.target.value))),
          sl('Düse · Größe', s.tub.jSize, 0.1, 1.6, 0.01, (e) => this._setTub('jSize', parseFloat(e.target.value))),
          sl('Düse · X seitlich', s.tub.jX, -1.2, 1.2, 0.01, (e) => this._setTub('jX', parseFloat(e.target.value))),
          sl('Düse · Höhe', s.tub.jY, -0.4, 1.4, 0.01, (e) => this._setTub('jY', parseFloat(e.target.value))),
          sl('Düse · Z vor/zurück', s.tub.jZ, -1.8, 1.8, 0.01, (e) => this._setTub('jZ', parseFloat(e.target.value))),
          { isNote: true, text: 'Rad in Wannenhöhen · Spur/Radstand in halben Wannenmaßen · Düse wie das Cockpit in Anteilen. Die Wanne steht auf den Rädern, nicht auf dem Boden.' },
          { isNote: true, text: 'Spender: bath.gltf · kenney_car-kit wheels · »Space engine« (Poly by Google) — dieselben Teile wie im Rennen.' },
        ] },
      { key: 'aufsetzen', ord: 40, tab: ['veh', 'tub'], title: 'Rig aufsetzen', badge: '×' + s.rig.s.toFixed(2),
        rows: [
          sl('Rig · Größe', s.rig.s, 0.05, 4, 0.01, (e) => this._setRig('s', parseFloat(e.target.value)), (v) => '×' + v.toFixed(2)),
          sl('X · seitlich', s.rig.x, -1.2, 1.2, 0.01, (e) => this._setRig('x', parseFloat(e.target.value))),
          sl('Y · tiefer / höher', s.rig.y, -0.8, 1.2, 0.01, (e) => this._setRig('y', parseFloat(e.target.value))),
          sl('Z · vor / zurück', s.rig.z, -1.2, 1.2, 0.01, (e) => this._setRig('z', parseFloat(e.target.value))),
          sl('Drehung', s.rig.rot, -180, 180, 1, (e) => this._setRig('rot', parseFloat(e.target.value)), (v) => v.toFixed(0) + '°'),
          { isButtons: true, grid: grid(3), items: [
            { label: s.tab === 'tub' ? 'Maßstab nach Rennen' : 'Platte 30 %', style: seg(false), on: () => (s.tab === 'tub' ? this._proposeTub() : this._propose(0.3)) },
            { label: s.tab === 'tub' ? 'eine Nummer kleiner' : '50 %', style: seg(false), on: () => (s.tab === 'tub' ? this._proposeTub(0.9) : this._propose(0.5)) },
            { label: '×1 · Versatz null', style: seg(false), on: () => { this.setState({ rig: { s: 1, x: 0, y: 0, z: 0, rot: 0 } }, () => { this._placeRig(); this._draw(); this._refitRows(); }); } },
          ] },
          { isNote: true, text: s.tab === 'tub'
            ? 'Null bedeutet in der Wanne: Hüftlinie 0,181 der Figurenhöhe UNTER der gemessenen Wasserlinie, Mitte über Mitte — das Verhältnis aus dem Rennen (1,55 : 2,1 : −0,28), kein Beinlöser.'
            : 'Null bedeutet: Rig-Unterkante auf der gemessenen Dachfläche (3,563 — nicht die Antennenspitze 5,168), Mitte über Mitte. X/Z in halben Roverbreiten · Y in Roverhöhen.' },
          { isNote: true, text: 'Gemessen: Rover-Wanne 3,95 × 3,46 (y 0,28–5,17) · Räder 1,35 hoch. Rig bei ×1: 2,42 hoch, Platte 1,36 breit = 34 % der Wanne.' },
          { isNote: true, text: 'Das Rig selbst wird in Reiter »Sockel« gebaut — hier wandert es nur als ein Stück. Cockpit und Armwinkel bleiben unangetastet.' },
        ] },
      { key: 'material', ord: 90, title: 'Material · Farbzonen & Textur', badge: s.style.tex === 'aus' ? 'Farbe' : s.style.tex.slice(0, 12),
        rows: [
          cl('Rover', 'rover'),
          cl('Platte', 'platte'),
          cl('Knöpfe & Panel', 'hardware'),
          cl('Knüppel · Schaft', 'stiel'),
          cl('Knüppel · Kugel', 'kugel'),
          cl('Wanne', 'wanne'),
          cl('Reifen', 'reifen'),
          cl('Düse', 'duese'),
          { isButtons: true, grid: grid(2), items: [
            { label: 'Rover + Platte + Knöpfe gleich', style: seg(false), on: () => this._setStyle({ col: Object.assign({}, s.style.col, { platte: s.style.col.rover, hardware: s.style.col.rover }) }) },
            { label: 'Farben zurücksetzen', style: seg(false), on: () => this._setStyle({ col: JSON.parse(JSON.stringify(STYLE0.col)) }) },
          ] },
          { isNote: true, text: 'Die Farbe wird mit der Modelltextur MULTIPLIZIERT — Weiß ändert nichts. Die Figur bleibt ausgespart, ihre Farben gehören dem Look.' },
          { isButtons: true, grid: grid(3), items: [
            { label: 'Textur aus', style: seg(s.style.tex === 'aus'), on: () => this._setStyle({ tex: 'aus' }) },
            ...TEX_SETS.slice(0, 2).map((t) => ({ label: t.replace('rusty_metal_04', 'rusty metal'), style: seg(s.style.tex === t), on: () => this._setStyle({ tex: t }) })),
          ] },
          { isButtons: true, grid: grid(3), items: [
            ...TEX_SETS.slice(2).map((t) => ({ label: t, style: seg(s.style.tex === t), on: () => this._setStyle({ tex: t }) })),
            { label: 'eigener Satz', style: seg(s.style.tex === 'eigen'), on: () => { const el = this._texEl; this._setStyle({ tex: 'eigen', eigen: el && el.value.trim() ? el.value.trim() : s.style.eigen }); } },
          ] },
          { isPaste: true, ref: (el) => { if (el) this._texEl = el; }, placeholder: 'Ordnername aus Textures/ … z. B. PaintedWood005' },
          { isButtons: true, grid: grid(3), items: [
            ...['rover', 'platte', 'hardware'].map((z) => ({ label: (z === 'hardware' ? 'Knöpfe' : z === 'platte' ? 'Platte' : 'Rover') + (s.style.texOn[z] ? ' · an' : ''), style: seg(s.style.texOn[z]), on: () => this._setTexOn(z, !s.style.texOn[z]) })),
          ] },
          { isButtons: true, grid: grid(3), items: [
            ...['wanne', 'duese'].map((z) => ({ label: (z === 'wanne' ? 'Wanne' : 'Düse') + (s.style.texOn[z] ? ' · an' : ''), style: seg(s.style.texOn[z]), on: () => this._setTexOn(z, !s.style.texOn[z]) })),
            { label: 'Reifen bleiben frei', style: seg(false), on: () => this._flash('Reifen sind eine eigene Zone — keine Textur, kein Sammelton') },
          ] },
          sl('Textur · Wiederholung', s.style.rep, 0.25, 12, 0.25, (e) => this._setStyle({ rep: parseFloat(e.target.value) }), (v) => '×' + v.toFixed(2)),
          { isButtons: true, grid: grid(2), items: [
            { label: s.style.boxuv ? 'Box-Projektion' : 'Original-UV', style: seg(s.style.boxuv), on: () => this._setStyle({ boxuv: !s.style.boxuv }) },
            { label: 'Textur neu laden', style: seg(false), on: () => { this._texCache = {}; this._setStyle({}); } },
          ] },
          { isNote: true, text: 'Kenney- und Quaternius-Netze haben ATLAS-UV: eine Kacheltextur darauf gibt pro Fläche nur einen Farbwert. Die Box-Projektion nimmt dafür die Lage im Raum — deshalb ist sie die Vorgabe.' },
          ...(s.styleRows || []).map((t) => ({ isNote: true, text: t })),
        ] },
      { key: 'messenv', ord: 45, tab: ['veh', 'tub'], title: 'Messen · aufgesetzt', badge: (s.vehRows || []).some((t) => /⚠/.test(t)) ? '⚠' : 'ok',
        rows: (s.vehRows || []).map((t) => ({ isNote: true, text: t })) },
      { key: 'figur', title: 'Figur', badge: (this._hosts().find(([k]) => k === s.fig) || [null, s.fig])[1],
        rows: [{ isButtons: true, grid: grid(2), items: this._hosts().map(([k, l]) => ({ label: l, style: seg(s.fig === k), on: () => this._load(k) })) }] },
      { key: 'schnitt', tab: 'sockel', title: 'Schnitt', badge: this._cutRes ? this._cutRes.hiddenTris + ' weg' : '—',
        rows: [
          sl('Schnitthöhe ab Beinansatz', s.dy, -0.1, 0.35, 0.005, (e) => this._set({ dy: parseFloat(e.target.value) }), (v) => (v >= 0 ? '+' : '') + Math.round(v * 100) + ' %'),
          sl('Kante vergraben (Zacken)', s.bury, 0, 2.5, 0.05, (e) => this._set({ bury: parseFloat(e.target.value) }), (v) => '×' + v.toFixed(2)),
          { isNote: true, text: this._cutRes ? (this._cutRes.hiddenTris + ' Dreiecke unsichtbar · nichts gelöscht') : 'Schnitt aus' },
        ] },
      { key: 'basis', tab: 'sockel', title: 'Basis', badge: this._baseRes ? this._baseRes.report.baseSize[0].toFixed(2) : '—',
        rows: [
          sl('Sitz × Querschnitt', s.bw, 0.6, 4, 0.05, (e) => this._set({ bw: parseFloat(e.target.value) })),
          sl('Breite ×', s.kx, 0.3, 3, 0.05, (e) => this._set({ kx: parseFloat(e.target.value) })),
          sl('Höhe ×', s.ky, 0.3, 4, 0.05, (e) => this._set({ ky: parseFloat(e.target.value) })),
          sl('Länge ×', s.kz, 0.3, 3, 0.05, (e) => this._set({ kz: parseFloat(e.target.value) })),
          sl('Versenkung', s.sink, -0.5, 1, 0.02, (e) => this._set({ sink: parseFloat(e.target.value) })),
        ] },
      { key: 'einpassen', tab: 'sockel', title: 'Oberkörper einpassen', badge: s.oy.toFixed(2),
        rows: [
          sl('X · seitlich', s.ox, -1, 1, 0.01, (e) => this._set({ ox: parseFloat(e.target.value) })),
          sl('Y · tiefer / höher', s.oy, -1, 1, 0.01, (e) => this._set({ oy: parseFloat(e.target.value) })),
          sl('Z · vor / zurück', s.oz, -1, 1, 0.01, (e) => this._set({ oz: parseFloat(e.target.value) })),
          { isNote: true, text: 'Sockel steht, Figur wandert — der Saum steckt im Sockel.' },
        ] },
      { key: 'cockpit', title: 'Cockpit · von Hand', badge: s.cock ? 'an' : 'aus',
        rows: [
          { isButtons: true, grid: grid(3), items: [
            { label: 'Panel flat', style: seg(s.panel === 'flat'), on: () => this._set({ panel: 'flat' }) },
            { label: 'wide', style: seg(s.panel === 'wide'), on: () => this._set({ panel: 'wide' }) },
            { label: 'aus', style: seg(s.panel === 'off'), on: () => this._set({ panel: 'off' }) },
          ] },
          ...partRows('stick', 'Knüppel'),
          ...partRows('round', 'Knopf rund'),
          ...partRows('square', 'Knopf eckig'),
          ...partRows('panel', 'Panel'),
          { isNote: true, text: 'X/Z in Anteilen der Plattenhalbbreite · Höhe in Plattendicken · Größe in Halbbreiten' },
        ] },
      { key: 'arme', title: 'Arme · Hände an die Controls', badge: s.arms.r.lift.toFixed(0) + '° / ' + s.arms.l.lift.toFixed(0) + '°',
        rows: [
          ...armRows('r', 'Rechts'),
          ...armRows('l', 'Links'),
          { isButtons: true, grid: grid(2), items: [
            { label: 'Arme zurücksetzen', style: seg(false), on: () => { this.setState({ arms: { l: { lift: 0, fwd: 0, elbow: 0 }, r: { lift: 0, fwd: 0, elbow: 0 } } }); this._apply(); } },
            { label: 'Hand an den Knüppel', style: seg(false), on: () => this._gripStick() },
          ] },
          { isNote: true, text: 'Gedreht wird ab der Ruhelage AUS DEM SKELETT (nicht aus dem laufenden Clip) — dieselbe Konfiguration ergibt jedes Mal dieselbe Haltung.' },
          { isNote: true, text: '»Hand an den Knüppel« sucht die Winkel, statt sie zu raten: die Meldung nennt den erreichten Abstand gegen den Kugelradius.' },
        ] },
      { key: 'config', ord: 92, title: 'Konfiguration', badge: s.fig,
        rows: [
          { isButtons: true, grid: grid(2), items: [
            { label: 'Copy config', style: seg(false), on: () => this._copyCfg() },
            { label: 'Datei ↓', style: seg(false), on: () => { this._file(JSON.stringify(this._cfg(), null, 2), 'kfb-rig-' + s.fig + '.json'); this._flash('✓ kfb-rig-' + s.fig + '.json geladen'); } },
          ] },
          { isButtons: true, grid: grid(2), items: [
            { label: 'Datei ↑ laden', style: seg(false), on: () => this._fileEl && this._fileEl.click() },
            { label: 'Text übernehmen', style: seg(false), on: () => { const el = this._pasteEl; if (!el || !el.value.trim()) { this._flash('✗ Feld ist leer'); return; } this._applyCfg(el.value, 'eingefügtem Text'); } },
          ] },
          { isPaste: true, ref: (el) => { if (el) this._pasteEl = el; }, placeholder: 'JSON hier einfügen …' },
          { isNote: true, text: 'Ablage gesperrt? Dann fällt eine Datei heraus — die Meldung oben sagt, was passiert ist. Die Messung fährt im JSON mit.' },
        ] },
      { key: 'messen', tab: 'sockel', title: 'Messen', badge: (s.cockRows || []).some((t) => /⚠/.test(t)) ? '⚠' : 'ok',
        rows: [
          ...(s.cockRows || []).map((t) => ({ isNote: true, text: t })),
          ...(s.rows || []).map((t) => ({ isNote: true, text: t })),
        ] },
    ].filter((sec) => !sec.tab || sec.tab === s.tab || (Array.isArray(sec.tab) && sec.tab.indexOf(s.tab) >= 0))
      /* Reihenfolge: erst der TRÄGER (ord 20), dann das Aufsetzen (40) und die Abnahme (45), zuletzt
         Material und Konfiguration (90/92). Stabile Sortierung — alles ohne `ord` behält seine
         Stelle. ⚠ Prüferbefund: vorher stand »Rig aufsetzen« ÜBER dem Träger, obwohl der Träger
         zuerst gebaut und dann bestückt wird. */
      .sort((a, b) => (a.ord || 50) - (b.ord || 50))
      .map((sec) => ({ ...sec, open: !!s.open[sec.key], toggle: () => this._toggle(sec.key), headStyle: head(!!s.open[sec.key]) }));

    return {
      hostRef: (el) => { if (el) this._host = el; },
      tabs: [['sockel', 'Sockel'], ['veh', 'Rover'], ['tub', 'Wanne']].map(([k, l]) => ({ label: l, style: seg(s.tab === k), on: () => this._tab(k) })),
      fileRef: (el) => { if (el) this._fileEl = el; },
      onFile: (ev) => this._onFile(ev),
      flash: s.flash || '',
      status: s.status, sections,
      cutLabel: s.cut ? 'Schnitt an' : 'Schnitt aus', cutStyle: btn(s.cut), onCut: () => this._set({ cut: !s.cut }),
      baseLabel: s.base ? 'Basis an' : 'Basis aus', baseStyle: btn(s.base), onBase: () => this._set({ base: !s.base }),
      cockLabel: s.cock ? 'Cockpit an' : 'Cockpit aus', cockStyle: btn(s.cock), onCock: () => this._set({ cock: !s.cock }),
    };
  }
}
</script>
