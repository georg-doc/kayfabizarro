document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"f881acb6-94bf-4e01-b5d9-b5d8f524f9d6\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* ==========================================================================\n   DocCheck Design System — Colors & Type\n   Reconstructed from the DocCheck Digital Design System Figma file.\n   Primary brand: DocCheck (doccheck.com) — German medical/community platform.\n   ========================================================================== */\n\n/* --- Fonts ---\n   PROJEKT-KOPIE, 13.09.2026: die 13 @font-face-Regeln der Originaldatei zeigten auf lokale\n   fonts/*.ttf. In diesem Projekt gilt »keine Binärdateien«, die Dateien sind darum nicht\n   mitgekommen — gemessen waren es 26 fehlgeschlagene Ladungen (404) je Seitenaufruf, die beim\n   Standalone-Export als tote Verweise mitgewandert wären. Roboto und Roboto Slab kommen jetzt\n   über einen <link> im Helmet des Blattes; --font-sans / --font-slab unten sind unverändert. */\n\n:root {\n  /* ---------- Primary brand colors ---------- */\n  --dc-red:            #c03;  /* headlines, text links, active state, header */\n  --dc-dark-red:       #902;  /* hover / pressed red */\n  --dc-red-15:         #f7d9e1;  /* dc 15% red — soft red bg */\n  --dc-green:          #9c3;  /* primary buttons, form success */\n  --dc-dark-green:     #690;  /* green hover */\n  --dc-green-20:       #ebf5d6;  /* dc 20% green — soft green bg */\n  --dc-black:          #000;\n  --dc-white:          #fff;\n\n  /* ---------- Greyscale (used heavily) ---------- */\n  --dc-table-grey:     #f6f6f6;\n  --dc-bg-grey:        #eee;  /* background grey */\n  --dc-grey:           #ddd;  /* light grey */\n  --dc-medium-grey:    #ccc;\n  --dc-neutral-grey:   #aaa;  /* button-light, disabled */\n  --dc-icon-grey:      #888;  /* icons, menu text */\n  --dc-dark-grey:      #666;\n  --dc-light-black:    #222;\n\n  /* ---------- Shades — DC Red family ---------- */\n  --dc-pink:           #fbc;\n  --dc-dark-pink:      #e79;\n  --dc-light-red:      #d36;\n  --dc-maroon:         #601;\n  --dc-dark-maroon:    #300;\n\n  /* ---------- Highlight ---------- */\n  --dc-highlight-yellow: #ff0;\n\n  /* ---------- Secondary palette (accent / tagging) ---------- */\n  --dc-leaf-green:     #3b3;\n  --dc-dark-leaf:      #080;\n  --dc-sea-green:      #3c9;\n  --dc-dark-sea:       #096;\n  --dc-turquoise:      #6dd;\n  --dc-dark-turquoise: #0cc;\n  --dc-teal:           #8cd;\n  --dc-dark-teal:      #59b;\n  --dc-sky-blue:       #adf;\n  --dc-dark-sky-blue:  #8cf;\n  --dc-ocean-blue:     #3ae;\n  --dc-dark-ocean:     #08c;\n  --dc-violet:         #b3d;\n  --dc-dark-violet:    #83c;\n  --dc-fuchsia:        #d6a;\n  --dc-dark-fuchsia:   #c09;\n  --dc-orange:         #f80;\n  --dc-dark-orange:    #e70;\n  --dc-yellow:         #fd0;\n  --dc-dark-yellow:    #fc0;\n  --dc-tan:            #eca;\n  --dc-dark-tan:       #db9;\n\n  /* ---------- Semantic / functional ---------- */\n  --color-bg:          var(--dc-white);\n  --color-bg-subtle:   var(--dc-bg-grey);\n  --color-bg-table:    var(--dc-table-grey);\n  --color-surface:     var(--dc-white);\n  --color-border:      var(--dc-bg-grey);       /* #eee — the ubiquitous hairline */\n  --color-divider:     #d9d9d9;                 /* wide section dividers */\n  --color-fg:          var(--dc-black);\n  --color-fg-muted:    var(--dc-icon-grey);     /* #888 — menu/meta text */\n  --color-fg-subtle:   var(--dc-dark-grey);     /* #666 */\n  --color-link:        var(--dc-red);\n  --color-link-hover:  var(--dc-dark-red);\n  --color-accent:      var(--dc-red);\n  --color-primary:     var(--dc-green);         /* Primary button = green */\n  --color-primary-hover: var(--dc-dark-green);\n  --color-disabled:    var(--dc-neutral-grey);\n  --color-success:     var(--dc-green);\n  --color-error:       var(--dc-red);\n  --color-error-bg:    var(--dc-red-15);\n  --color-success-bg:  var(--dc-green-20);\n\n  /* ---------- Font stacks ---------- */\n  --font-slab:  \"Roboto Slab\", Georgia, serif;         /* Display / H1 */\n  --font-sans:  \"Roboto\", -apple-system, Segoe UI, Helvetica, Arial, sans-serif;\n  --font-mono:  ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n\n  /* ---------- Base font size scales (MAX / BASIS / MIN) ----------\n     The design system publishes three sizing scales depending on viewport:\n       MAX    = ≥ 20px base   — large screens / print / hero areas\n       BASIS  = 16px base     — default desktop / tablet\n       MIN    = 14px base     — dense surfaces / secondary contexts\n     Use --fs-* tokens; they resolve from --fs-base. Override --fs-base on\n     a section to switch scale. */\n  --fs-base: 16px;              /* BASIS default */\n  --fs-display: 48px;\n  --fs-h1: 28px;\n  --fs-h2: 20px;\n  --fs-h3: 16px;\n  --fs-h4: 16px;\n  --fs-h5: 16px;\n  --fs-h6: 16px;\n  --fs-copy: 16px;\n  --fs-quote: 16px;\n  --fs-label: 12px;\n  --fs-button: 16px;\n\n  /* ---------- Spacing & layout ----------\n     From frame analysis: core rhythm is 10/20/40/80/100 px. */\n  --space-1: 5px;\n  --space-2: 10px;\n  --space-3: 20px;\n  --space-4: 40px;\n  --space-5: 80px;\n  --space-6: 100px;\n\n  /* ---------- Radii ----------\n     Buttons use 5px; circles for color swatches and avatars. No large\n     rounding anywhere in the system. */\n  --radius-sm: 3px;\n  --radius:    5px;\n  --radius-pill: 999px;\n  --radius-circle: 50%;\n\n  /* ---------- Borders ----------\n     1px on inputs, 2px hairline dividers (#eee), 20px thick full-bleed\n     section dividers (#d9d9d9). */\n  --border-hairline: 1px solid var(--color-border);\n  --border-divider:  2px solid var(--color-border);\n\n  /* ---------- Elevation (very restrained — system is flat) ---------- */\n  --shadow-0: none;\n  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.06);\n  --shadow-2: 0 2px 8px rgba(0, 0, 0, 0.08);\n  --shadow-menu: 0 4px 16px rgba(0, 0, 0, 0.10);\n\n  /* ---------- Motion ---------- */\n  --ease: cubic-bezier(.2, .7, .3, 1); /* @kind other */\n  --dur-fast: 120ms; /* @kind other */\n  --dur: 180ms; /* @kind other */\n  --dur-slow: 280ms; /* @kind other */\n}\n\n/* MAX scale (large / print) */\n.fs-max {\n  --fs-base: 20px;\n  --fs-display: 64px;\n  --fs-h1: 32px; --fs-h2: 24px; --fs-h3: 20px; --fs-h4: 20px; --fs-h5: 20px; --fs-h6: 20px;\n  --fs-copy: 20px; --fs-quote: 20px; --fs-label: 14px; --fs-button: 20px;\n}\n\n/* MIN scale (dense) */\n.fs-min {\n  --fs-base: 14px;\n  --fs-display: 40px;\n  --fs-h1: 24px; --fs-h2: 16px; --fs-h3: 14px; --fs-h4: 14px; --fs-h5: 14px; --fs-h6: 14px;\n  --fs-copy: 14px; --fs-quote: 14px; --fs-label: 10px; --fs-button: 14px;\n}\n\n/* Dark mode swaps — from the \"Farbwechsel Light/Dark\" Flexikon App spec.\n   Red and green stay identical; greys invert. */\n.dc-dark, [data-theme=\"dark\"] {\n  --color-bg:          #000;\n  --color-bg-subtle:   #222;\n  --color-bg-table:    #191919;\n  --color-surface:     #222;\n  --color-border:      #333;\n  --color-divider:     #333;\n  --color-fg:          #fff;\n  --color-fg-muted:    #aaa;\n  --color-fg-subtle:   #ddd;\n  --color-error-bg:    #301;\n  --color-success-bg:  #120;\n  --dc-highlight-yellow: #550;\n}\n\n/* ==========================================================================\n   Semantic typography — as specified in Figma (three scales).\n   Use these on real elements; do not override weights/sizes ad hoc.\n   ========================================================================== */\nhtml { font-size: var(--fs-base); }\nbody {\n  font-family: var(--font-sans);\n  font-size: var(--fs-copy);\n  line-height: 1.5;\n  color: var(--color-fg);\n  background: var(--color-bg);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n.dc-display {\n  font-family: var(--font-slab); font-weight: 700;\n  font-size: var(--fs-display); line-height: 1.2; margin: 0 0 .5em;\n}\nh1, .dc-h1 {\n  font-family: var(--font-slab); font-weight: 700;\n  font-size: var(--fs-h1); line-height: 1.2; margin: 0 0 .5em;\n  color: var(--color-fg);\n}\nh2, .dc-h2 {\n  font-family: var(--font-sans); font-weight: 700;\n  font-size: var(--fs-h2); line-height: 1.2;\n  margin: 1em 0 .5em;\n}\nh3, .dc-h3 {\n  font-family: var(--font-sans); font-weight: 700;\n  font-size: var(--fs-h3); line-height: 1.2; margin: 1em 0 .5em;\n}\nh4, .dc-h4 {\n  font-family: var(--font-sans); font-weight: 700;\n  font-size: var(--fs-h4); line-height: 1.2; margin: .5em 0;\n}\nh5, .dc-h5 {\n  font-family: var(--font-sans); font-weight: 400;\n  font-size: var(--fs-h5); line-height: 1.2; margin: .5em 0;\n}\nh6, .dc-h6 {\n  font-family: var(--font-sans); font-weight: 400;\n  font-size: var(--fs-h6); line-height: 1.2; margin: .5em 0 .2em;\n}\np, .dc-copy {\n  font-family: var(--font-sans); font-weight: 400;\n  font-size: var(--fs-copy); line-height: 1.5; margin: 0 0 .5em;\n}\n.dc-copy-bold, strong { font-weight: 700; }\n.dc-quote, blockquote {\n  font-family: var(--font-sans); font-weight: 400; font-style: italic;\n  font-size: var(--fs-quote); line-height: 1.5; margin: 0 0 .5em;\n}\n.dc-label, label, small {\n  font-family: var(--font-sans); font-weight: 400;\n  font-size: var(--fs-label); line-height: 1.2;\n}\n.dc-label-bold { font-weight: 700; }\n.dc-menu {\n  font-family: var(--font-sans); font-weight: 700;\n  font-size: var(--fs-copy); line-height: 1; color: var(--color-fg-muted);\n  text-transform: none;\n}\n\na, .dc-link {\n  color: var(--color-link); text-decoration: none;\n  transition: color var(--dur-fast) var(--ease);\n}\na:hover, .dc-link:hover { color: var(--color-link-hover); text-decoration: underline; }\n\nhr { border: 0; border-top: var(--border-divider); margin: var(--space-3) 0; }\n\n/* ==========================================================================\n   Core components — shared across UI kits.\n   ========================================================================== */\n\n/* Buttons */\n.dc-btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 8px;\n  font-family: var(--font-sans); font-weight: 700;\n  font-size: var(--fs-button); line-height: 1;\n  padding: .5em 1em; border: 0; border-radius: var(--radius);\n  background: var(--color-primary); color: #fff;\n  cursor: pointer; transition: background var(--dur-fast) var(--ease);\n}\n.dc-btn:hover  { background: var(--color-primary-hover); }\n.dc-btn:active { transform: translateY(1px); }\n.dc-btn:disabled, .dc-btn[aria-disabled=\"true\"] { background: var(--color-disabled); cursor: not-allowed; }\n.dc-btn--light    { background: var(--dc-neutral-grey); border-radius: 0; font-weight: 400; }\n.dc-btn--light:hover { background: var(--dc-icon-grey); }\n.dc-btn--red      { background: var(--dc-red); }\n.dc-btn--red:hover{ background: var(--dc-dark-red); }\n.dc-btn--ghost    { background: transparent; color: var(--color-fg); }\n.dc-btn--ghost:hover { background: var(--dc-bg-grey); }\n\n/* Form fields — 1px border, red on error, green on success, no rounding */\n.dc-input {\n  font-family: var(--font-sans); font-size: var(--fs-copy); color: var(--color-fg);\n  background: #fff; border: 0; border-bottom: 1px solid var(--color-fg-muted);\n  padding: 8px 2px; outline: none; width: 100%;\n  transition: border-color var(--dur-fast) var(--ease);\n}\n.dc-input:focus   { border-bottom-color: var(--dc-red); }\n.dc-input.is-error   { border-bottom-color: var(--dc-red); }\n.dc-input.is-success { border-bottom-color: var(--dc-green); }\n.dc-input::placeholder { color: var(--color-fg-muted); }\n\n/* Cards — minimal, hairline border, no shadow by default */\n.dc-card {\n  background: var(--color-surface);\n  border: var(--border-hairline);\n  border-radius: var(--radius);\n  padding: var(--space-3);\n}\n\n/* Tag / chip */\n.dc-tag {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 2px 8px; background: var(--dc-bg-grey); color: var(--color-fg);\n  font-size: var(--fs-label); font-weight: 700; line-height: 1.2;\n  border-radius: var(--radius-pill);\n}\n\n/* Brand header — the signature red bar from every DC surface */\n.dc-header {\n  height: 100px; background: var(--dc-red); color: #fff;\n  display: flex; align-items: center; gap: 40px; padding: 0 var(--space-6);\n}\n.dc-header__title {\n  font-family: var(--font-slab); font-weight: 700;\n  font-size: 40px; line-height: 1; color: #fff;\n}\n\n/* Minimal focus ring — brand red */\n:where(a, button, input, textarea, select, [tabindex]):focus-visible {\n  outline: 2px solid var(--dc-red); outline-offset: 2px;\n}\n<\u002Fstyle>\n<!-- Die Schriftdateien des Systems liegen als .ttf im Quellordner. In diesem Projekt gilt »keine\n     Binärdateien«, darum kommen Roboto und Roboto Slab vom Schriftdienst — gleiche Familien,\n     gleiche Schnitte, und die @font-face-Zeilen der Token-Datei laufen ins Leere, ohne zu schaden. -->\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* cyrillic-ext */\n@font-face {\n  font-family: 'Roboto';\n  font-style: italic;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"d7622bc3-7775-412a-835d-e4bcf8fcc3e5\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Roboto';\n  font-style: italic;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"1ef0a9db-3891-4475-934a-602744136b8f\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek-ext */\n@font-face {\n  font-family: 'Roboto';\n  font-style: italic;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"859e437d-8735-45b1-bb65-254cdd037ba6\") format('woff2');\n  unicode-range: U+1F00-1FFF;\n}\n/* greek */\n@font-face {\n  font-family: 'Roboto';\n  font-style: italic;\n  font-weight: 400;\n  font-stretch: 100%;\n :0;cursor:pointer;display:block;accent-color:var(--dc-red);}\n<\u002Fstyle>\n<script type=\"importmap\">\n{\n  \"imports\": {\n    \"three\": \"https://unpkg.com/three@0.160.0/build/three.module.js\",\n    \"three/addons/\": \"https://unpkg.com/three@0.160.0/examples/jsm/\"\n  }\n}\n<\u002Fscript>\n<script type=\"module\">\n  import * as THREE from 'three';\n  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';\n  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';\n  window.__KFB3D = window.__KFB3D || { THREE, OrbitControls, GLTFLoader, version: THREE.REVISION };\n  window.dispatchEvent(new Event('kfb3dready'));\n<\u002Fscript>\n<\u002Fhelmet>\n\n\n<div data-screen-label=\"Rig Bench\" style=\"position:absolute;inset:0;display:flex;flex-direction:column;background:var(--color-bg);min-width:0;min-height:0;\">\n\n  <div style=\"flex:0 0 52px;display:flex;align-items:center;gap:20px;padding:0 20px;background:var(--dc-red);min-width:0;\">\n    <div style=\"display:flex;align-items:baseline;gap:10px;flex:0 0 auto;\">\n      <span style=\"font-family:var(--font-slab);font-weight:700;font-size:20px;line-height:1;color:#fff;\">Rigging Lab<\u002Fspan>\n      <span style=\"font-size:13px;line-height:1;font-weight:700;color:#fff;\">CapsuleCarl<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:5px;flex:0 0 auto;\">\n      <sc-for list=\"{{ toolButtons }}\" as=\"t\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ t.on }}\" title=\"{{ t.title }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"font-size:12px;line-height:1.2;color:var(--dc-red-15);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;\">{{ status }}<\u002Fdiv>\n    <div style=\"margin-left:auto;display:flex;align-items:center;gap:5px;flex:0 0 auto;\">\n      <button sc-camel-on-click=\"{{ onInfo }}\" title=\"Show the measurement stamp: recess depth, residual, repainted an style=\"margin-left:auto;font-family:var(--font-mono);font-size:12px;line-height:1.2;color:var(--color-fg-subtle);\">{{ zoneCount }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;\">\n        <sc-for list=\"{{ zoneRows }}\" as=\"z\" hint-placeholder-count=\"21\">\n          <div sc-camel-on-click=\"{{ z.on }}\" sc-camel-on-mouse-enter=\"{{ z.enter }}\" sc-camel-on-mouse-leave=\"{{ z.leave }}\" title=\"{{ z.title }}\" style=\"{{ z.style }}\">\n            <span style=\"font-family:var(--font-mono);font-size:12px;color:var(--color-fg-subtle);flex:0 0 20px;\">{{ z.num }}<\u002Fspan>\n            <span style=\"width:10px;height:10px;border-radius:50%;background:{{ z.swatch }};border:1px solid var(--dc-medium-grey);flex:0 0 auto;\"><\u002Fspan>\n            <span style=\"flex:1 1 auto;min-width:0;font-size:13px;line-height:1.3;color:{{ z.ink }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ z.label }}<\u002Fspan>\n            <button sc-camel-on-click=\"{{ z.toggle }}\" title=\"Show or hide this zone\" style=\"{{ z.eyeStyle }}\">{{ z.eyeLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;padding:14px 20px 20px;border-top:2px solid var(--color-border);\">\n        <span style=\"font-size:12px;line-height:1.3;color:var(--color-fg-subtle);\">{{ selLabel }}<\u002Fspan>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;\">\n          <sc-for list=\"{{ palette }}\" as=\"p\" hint-placeholder-count=\"7\">\n            <button sc-camel-on-click=\"{{ p.on }}\" title=\"{{ p.title }}\" style=\"{{ p.style }}\">{{ p.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-for list=\"{{ zoneColorRows }}\" as=\"c\" hint-placeholder-count=\"1\">\n          <div title=\"{{ c.title }}\" style=\"{{ c.style }}\">\n            <span style=\"flex:1 1 auto;min-width:0;font-size:12px;line-height:1.2;color:var(--color-fg-subtle);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ c.label }}<\u002Fspan>\n            <span style=\"width:18px;height:18px;border-radius:50%;background:{{ c.swatch }};border:1px solid var(--dc-medium-grey);flex:0 0 auto;\"><\u002Fspan>\n            <input value=\"{{ c.hex }}\" sc-camel-on-change=\"{{ c.onHex }}\" placeholder=\"#rrggbb\" spellcheck=\"false\" style=\"{{ c.inputStyle }}\">\n            <button sc-camel-on-click=\"{{ c.onCopy }}\" title=\"{{ c.copyTitle }}\" style=\"{{ c.copyStyle }}\">{{ c.copyLabel }}<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ c.onOrig }}\" title=\"{{ c.origTitle }}\" style=\"{{ c.origStyle }}\">{{ c.origLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#c03&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#c03&quot;,&quot;#9c3&quot;,&quot;#3ae&quot;,&quot;#b3d&quot;],&quot;section&quot;:&quot;Look&quot;},&quot;stageBg&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#eeeeee&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#eeeeee&quot;,&quot;#ffffff&quot;,&quot;#f6f6f6&quot;,&quot;#222222&quot;],&quot;section&quot;:&quot;Look&quot;},&quot;startView&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;front&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;front&quot;,&quot;q34&quot;,&quot;side&quot;,&quot;eyes&quot;,&quot;mouth&quot;,&quot;mouthlow&quot;],&quot;section&quot;:&quot;Look&quot;}}\">\n/* KFB Animation Lab v6 · Rig-Werkbank für EINE Figur.\n   Auftrag B, Fassung A (Georg, 13.09.): Carl fertig machen — Regler für Augen, Mund und Zonen,\n   Zurücksetzen, gespeicherte Einstellung. Kein Katalog, keine Clips, keine Messblätter: die\n   Trennung von Messwerkzeug und Rigging-Werkzeug ist die Lehre aus v4 und 16B.\n\n   Hier wird NICHTS gerechnet, was schon gemessen ist. Angeschlossen werden:\n     lab-v2/sources.js · lab-v2/audit.js · lab-v4/carlrig.js\n     petstudio-v9/studio-v12/{pet-eye-rig.v6,brow-rig.v2,pet-nose.v2,pet-moustache.v1}\n     petstudio-v9/studio-v3/pet-mouth.v1\n   Der Ladeweg, die Heil-Zahlen und die Kamera-Vorgaben sind 1:1 aus `carl-proof.html`\n   übernommen (dort belegt: tiefste Einsenkung 0,1865 u → Restabweichung 0 u). */\n\n/* Hochgestuft, weil der gemessene Mund-Ansatz sich geändert hat: eine gespeicherte Einstellung aus\n   der Zeit der flachen Delle (size 0,534 · dy 0) würde den Fix stumm überschreiben. Der alte\n   Schlüssel bleibt liegen, er wird nur nicht mehr gelesen. */\nconst KEY = 'kfb.carl.rig.v6.3';\n\n/* Gemessen, nicht geerbt: abgelesen an Carls eigener Pupillen-Insel (#14/#15) im C0-Katalog.\n   EyeRigs eigene Vorgaben sind auf FrizzleBobs Kopf geeicht und machen hier Kugelaugen. */\nconst EYE_DEF = { dx: 0.164, dy: 0.317, ring: 0.13, track: 0.04, pupilSize: 0.40, lidFit: 0.92, gloss: 0.90, lashLength: 0.45, lashDensity: 7, lashWidth: 1 };\nconst EYE_META = [\n  ['dx', 'Spacing', 0, 0.45, 0.002], ['dy', 'Height', 0, 0.6, 0.002],\n  ['ring', 'Eye size', 0.04, 0.34, 0.005], ['track', 'Tracking', 0, 0.2, 0.005],\n  ['pupilSize', 'Pupil', 0.1, 0.9, 0.01], ['lidFit', 'Lid fit', 0.5, 1.2, 0.01],\n  ['gloss', 'Gloss', 0, 1, 0.02], ['lashLength', 'Lash length', 0, 1, 0.02],\n  ['lashDensity', 'Lash count', 0, 14, 1], ['lashWidth', 'Lash width', 0.5, 2, 0.1],\n];\nconst ANCHOR_KEYS = ['dx', 'dy', 'ring', 'track'];\nconst LASH_KEYS = { lashLength: 'length', lashDensity: 'density', lashWidth: 'width' };\n\n/* Startzustand der Zonen, 1:1 aus dem Beweis-Blatt: die Teile IN der alten Mundhöhle werden\n   gemessen (partsInsideBoxes), 6/7/8 und Carls eigene Pupillen 15/16 sind gesetzt — sie liegen\n   unter dem montierten Gesicht. Alle bleiben einschaltbar. */\nconst HIDE_START = [5, 6, 7, 13, 14];\n/* Farben aus dem DocCheck-System (R12): Rot und Grün als Marken-Paar, dazu die Graustufen-Leiter\n   und zwei Töne der Zweitpalette, die auf Carls Orange überhaupt unterscheidbar sind. */\nconst PALETTE = [\n  [null, 'Tex', 'The zone gets its original image back'],\n  ['#c03', '', 'DC red'], ['#9c3', '', 'DC green'], ['#f80', '', 'Orange'],\n  ['#3ae', '', 'Ocean blue'], ['#888', '', 'Icon grey'], ['#222', '', 'Light black'],\n];\n\nclass Component extends DCLogic {\n  state = {\n    ready: false, err: '', view: 'front', face: true, stache: true, wire: false,\n    eye: Object.assign({}, EYE_DEF), mouth: {}, mouthSet: 'male', viseme: '',\n    zones: [], sel: -1, zoneCount: '', paint: true, stamp: false,\n    browMod: 'block', stacheForm: 'tube', noseMod: 'ours', brow: {}, nose: {},\n    /* Farbwahl (Georgs Bestellung, 13.09. spät): vier Ziele am Augen-Rig, eines am Bart, eines je\n       Zone. `hexDraft` hält den GETIPPTEN Text — »#c0« ist kein Farbwert und darf das Modell nicht\n       färben; erst ein vollständiges #rrggbb wird angewandt. */\n    eyeCol: { ball: null, lid: null, lash: null, pupil: null }, eyeSel: '', stacheCol: null,\n    hexDraft: {}, copied: '',\n    /* Vierter Brauen-Stand und dritter Nasen-Stand: derselbe Graft-Weg, den das Studio benutzt,\n       hier am Spender selbst als Kontrollprobe (siehe `mountFaceGraft`). `wobble` ist »jedes Rig\n       ist ein Schauspieler« (Georg, 13.09. spät) — ein Nachlauf-Ausschlag, der bei 0 exakt starr\n       ist (Prime Directive: Kopf still = Teil still). */\n    graft: {}, noseGraft: {}, graftNote: '',\n  };\n\n  /* Georgs Regel (13.09. spät): Lid-Vorgabe ist -1 dunklere, Wimper-Vorgabe -2 dunklere Stufe der\n     Körperfarbe, in OKLCH (perzeptuell gleichmäßig) — nicht `multiplyScalar` auf sRGB. Carl hat\n     keine einzelne »Körperfarbe« wie ein Pet-Eintrag; die gewählte Zonenfarbe der Körperzone\n     (Zone 1) ist der nächste Ersatz, sonst der gemessene Grundton. Beide Ziele bleiben\n     überschreibbar — das ist die VORGABE, kein Zwang. */\n  baseSkinColour() { const z0 = (this.state.zones || [])[0]; return (z0 && z0.color) || '#d99a4e'; }\n\n  /* Die vier Farbziele des Augen-Rigs, GEMESSEN am Modul statt geraten: `pet-eye-rig.v6.js` baut je\n     Auge eine Gruppe [Augapfel, Pupillen-Pivot, Lider]. Augapfel (`matW`) und Pupille (`matP`)\n     teilen je EIN Material über beide Augen; das Lid bekommt eins je Auge, weil seine Farbe aus der\n     Haut abgetastet wird; die Wimpern hängen als Gruppe unter dem OBERLID und haben ein eigenes\n     Material (Basisfarbe × 0,5). `setLashes` kennt keine Farbe — darum wird hier das Material\n     gefärbt und die Vendor-Datei nicht angefasst. */\n  eyeMats() {\n    const r = this.face && this.face.eyeRig;\n    if (!r || !r.eyes || !r.eyes.length) return null;\n    const out = { ball: [], pupil: [], lid: [], lash: [] };\n    for (const e of r.eyes) {\n      const sc = e.children && e.children[0];\n      if (sc && sc.isMesh && sc.material) out.ball.push(sc.material);\n      if (e._puMesh && e._puMesh.material) out.pupil.push(e._puMesh.material);\n      if (e._up && e._up.material) out.lid.push(e._up.material);\n      if (e._lo && e._lo.material) out.lid.push(e._lo.material);\n      if (e._up) e._up.traverse((m) => { if (m.isMesh && m !== e._up && m.material) out.lash.push(m.material); });\n    }\n    return out;\n  }\n  /* ⚠ Jeder Regler-Zug am Auge ruft `build()` und baut FRISCHE Materialien — eine einmal gesetzte\n     Farbe wäre danach still weg. Das Modul zählt seine Bauten in `gen`; die Bildschleife vergleicht\n     und legt die Farben nach jedem Neubau wieder auf. */\n  applyEyeColors() {\n    const r = this.face && this.face.eyeRig; if (!r) return;\n    const mats = this.eyeMats(); if (!mats) return;\n    const c = this.state.eyeCol || {};\n    ['ball', 'pupil'].forEach((k) => {\n      if (!c[k]) return;\n      mats[k].forEach((m) => { if (m && m.color) { m.color.set(c[k]); m.needsUpdate = true; } });\n    });\n    /* Lid/Wimper sind KEINE »leer = Modul entscheidet«-Felder mehr: ohne Überschreibung gilt die\n       Formel -1/-2 (siehe `baseSkinColour`), nicht mehr der abgetastete Hautton bzw. autoColor×0,5\n       des Moduls. */\n    if (this.SHADE) {\n      const base = this.baseSkinColour();\n      const lid = c.lid || this.SHADE(base, -1), lash = c.lash || this.SHADE(base, -2);\n      mats.lid.forEach((m) => { if (m && m.color) { m.color.set(lid); m.needsUpdate = true; } });\n      mats.lash.forEach((m) => { if (m && m.color) { m.color.set(lash); m.needsUpdate = true; } });\n    }\n    this._eyeGen = r.gen;\n  }\n  setEyeColor(k, hex) {\n    const eyeCol = { ...(this.state.eyeCol || {}), [k]: hex || null };\n    this.setState({ eyeCol }, () => { this.applyEyeColors(); this.persist(); });\n  }\n  setStacheColor(hex) {\n    if (this.face && this.face.moustache) this.face.moustache.set({ color: hex || null });\n    this.setState({ stacheCol: hex || null }, () => this.persist());\n  }\n\n  /* Eine Farbwahl, drei Griffe, an jeder Stelle dieselbe Zeile: Feld liest und nimmt `#rrggbb`,\n     `Copy` legt den Wert in die Ablage, `Orig` gibt die Modul- bzw. Bildtafel-Farbe zurück. */\n  hexRow({ id, label, cur, title, apply, origLabel, origTitle, selected, onSelect }) {\n    const draft = this.state.hexDraft || {};\n    const shown = draft[id] != null ? draft[id] : (cur || '');\n    const copied = this.state.copied === id;\n    const accent = this.props.accent || '#c03';\n    return {\n      label, title: title || '', hex: shown,\n      swatch: cur || 'var(--dc-bg-grey)',\n      style: 'display:flex;align-items:center;gap:8px;min-width:0;box-sizing:border-box;padding:2px 0 2px 6px;border-left:2px solid ' + (selected ? accent : 'transparent') + ';' + (onSelect ? 'cursor:pointer;' : ''),\n      inputStyle: 'width:84px;flex:0 0 auto;box-sizing:border-box;padding:3px 5px;background:var(--dc-white);border:1px solid var(--dc-grey);border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:12px;line-height:1.2;color:var(--color-fg);',\n      copyLabel: copied ? 'Copied' : 'Copy',\n      copyTitle: cur ? 'Puts ' + cur + ' on the clipboard' : 'Nothing to copy — no colour set',\n      copyStyle: 'height:22px;padding:0 8px;background:' + (copied ? 'var(--dc-green)' : 'var(--dc-white)') + ';border:1px solid ' + (copied ? 'var(--dc-green)' : 'var(--dc-grey)') + ';border-radius:var(--radius-sm);color:#000;font-size:11px;font-weight:700;line-height:1;cursor:pointer;flex:0 0 auto;',\n      origLabel: origLabel || 'Orig', origTitle: origTitle || '',\n      origStyle: 'height:22px;padding:0 8px;background:' + (cur ? 'var(--dc-white)' : 'var(--dc-bg-grey)') + ';border:1px solid ' + (cur ? 'var(--dc-grey)' : 'var(--dc-bg-grey)') + ';border-radius:var(--radius-sm);color:var(--color-fg-subtle);font-size:11px;font-weight:700;line-height:1;cursor:pointer;flex:0 0 auto;',\n      on: onSelect || (() => {}),\n      onHex: (e) => {\n        let v = String(e.target.value || '').trim().toLowerCase();\n        if (v && v[0] !== '#') v = '#' + v;\n        this.setState({ hexDraft: { ...draft, [id]: v } });\n        if (/^#[0-9a-f]{6}$/.test(v)) apply(v);\n      },\n      onCopy: () => {\n        if (!cur) return;\n        const done = () => {\n          if (!this._mounted) return;\n          this.setState({ copied: id });\n          setTimeout(() => { if (this._mounted) this.setState({ copied: '' }); }, 1200);\n        };\n        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(cur).then(done, done);\n        else done();\n      },\n      onOrig: () => { this.setState({ hexDraft: { ...draft, [id]: '' } }); apply(null); },\n    };\n  }\n\n  /* Drei Brauen-Stände. `line` und `tube` sind die zwei Stände, die `brow-rig.v2.js` selbst kennt\n     (Bändchen gegen gedeckelten Schlauch). `block` ist KEIN dritter Zeichenstand — es ist Carls\n     EIGENE Brauen-Insel, sichtbar geschaltet und über `PartRig` bewegbar (R18). */\n  browParams(mod) {\n    const B = this.BROW; if (!B || mod === 'block') return null;\n    const base = { enabled: true, points: B.pointsFor('neutral'), thickness: 1, length: 0.6,\n      taper: 0.85, height: 0.3, mask: 0.35, round: 1, cap: 0.8, color: null,\n      tiltLeft: 0, tiltRight: 0, bendLeft: 0, bendRight: 0 };\n    return mod === 'line' ? { ...base, solid: false, even: false } : { ...base, solid: true, even: false };\n  }\n  applyBrow(mod) {\n    if (mod === 'block' && !this.origBrow) return false;\n    const p = this.browParams(mod);\n    if (this.face && this.face.browRig) this.face.browRig.set(p ? p : { enabled: false });\n    if (this.origBrow) this.origBrow.set({ enabled: mod === 'block' });\n    if (this.browGraft) this.browGraft.set({ enabled: mod === 'graft' });\n    if (mod === 'graft') this.mountFaceGraft('brow');\n    return true;\n  }\n  applyNose(mod) {\n    if (mod === 'original' && !this.origNose) return false;\n    if (this.face.noseRig) this.face.noseRig.set({ enabled: mod === 'ours' });\n    if (this.origNose) this.origNose.set({ enabled: mod === 'original' });\n    if (this.noseGraft) this.noseGraft.set({ enabled: mod === 'graft' });\n    if (mod === 'graft') this.mountFaceGraft('nose');\n    return true;\n  }\n\n  /* KONTROLLPROBE für den Graft-Weg, hier am Spender selbst (Georg wollte die Option in beiden\n     Häusern, für Braue UND Nase). Ein Spender-Fetch trägt beide Teile — `loadDonorFace` lädt\n     einmal, egal welches Teil zuerst gewählt wird. */\n  async mountFaceGraft(which) {\n    if (this._graftBusy || !this.BG || !this.face || !this.face.eyeRig) return;\n    if ((which === 'brow' && this.browGraft) || (which === 'nose' && this.noseGraft)) return;\n    this._graftBusy = true;\n    try {\n      const K = window.__KFB3D;\n      const donor = this._donor || (this._donor = await this.BG.loadDonorFace({\n        THREE: this.THREE, loader: new K.GLTFLoader(), url: this._donorUrl }));\n      if (!donor.ok) { this.setState({ graftNote: 'donor: ' + donor.report.status }); return; }\n      const getEyeFrame = () => this.face && this.face.eyeRig && this.face.eyeRig.eyeFrame();\n      if (which === 'brow' && donor.brow && !this.browGraft) {\n        this.browGraft = new this.BG.BrowGraft({ THREE: this.THREE, donor: donor.brow, getEyeFrame,\n          params: { ...this.BG.BROW_DEFAULTS, ...(this.state.graft || {}), enabled: true } });\n      }\n      if (which === 'nose' && donor.nose && !this.noseGraft) {\n        this.noseGraft = new this.BG.NoseGraft({ THREE: this.THREE, donor: donor.nose, getEyeFrame,\n          params: { ...this.BG.NOSE_DEFAULTS, ...(this.state.noseGraft || {}), enabled: true } });\n      }\n      this.setState({ graftNote: '' });\n    } catch (e) {\n      this.setState({ graftNote: String((e && e.message) || e) });\n    } finally { this._graftBusy = false; }\n  }\n  setGraft(k, v) {\n    const graft = { ...(this.state.graft || {}), [k]: v };\n    if (this.browGraft) this.browGraft.set({ [k]: v });\n    this.setState({ graft }, () => this.persist());\n  }\n  setNoseGraft(k, v) {\n    const noseGraft = { ...(this.state.noseGraft || {}), [k]: v };\n    if (this.noseGraft) this.noseGraft.set({ [k]: v });\n    this.setState({ noseGraft }, () => this.persist());\n  }\n  /* Original-Teil an oder aus heißt: Zone sichtbar oder nicht. Die Liste bleibt die Wahrheit. */\n  showIslands(islands, show) {\n    if (!islands || !islands.length || !this.state.zones.length) return;\n    const zones = this.state.zones.map((z, i) => (islands.indexOf(i) >= 0 ? { ...z, hidden: !show } : z));\n    islands.forEach((i) => this.CR.setZoneStyle(this.parts[i], { hidden: !show, color: zones[i].color }));\n    this.setState({ zones }, () => this.persist());\n  }\n  setPart(which, k, v) {\n    const rig = which === 'brow' ? this.origBrow : this.origNose;\n    const cur = { ...(this.state[which] || {}), [k]: v };\n    if (rig) rig.set({ [k]: v });\n    this.setState({ [which]: cur }, () => this.persist());\n  }\n\n  /* Übermalte Bildtafel an oder aus. Sie hängt an der Körperzone, und `setZoneStyle` gibt bei\n     `color: null` die ORIGINAL-Tafel zurück — deshalb wird sie nach jedem Zonen-Griff neu gesetzt. */\n  applyPaint(on) {\n    const p = this.parts && this.parts[0], map = this.clean && this.clean.map;\n    if (!p || !map) return;\n    const z = this.state.zones[0];\n    if (z && z.color) return;                       // Fläche statt Tafel: nichts zu übermalen\n    p.mesh.material.map = on ? map : (p.mesh.userData.origMap || null);\n    p.mesh.material.needsUpdate = true;\n  }\n\n  /* Die angeklickte Zone wird mit einer KONTUR markiert, nicht mit Farbe (Georg, 13.09.).\n     Eigenleuchten war der zweite Fehlversuch: es färbt das ganze Teil um und verfälscht damit\n     genau die Farbe, die man gerade beurteilt — an Carls Orange wurde ein blauer Pfeil violett.\n     Die Kontur ist `EdgesGeometry` als Kind des Netzes: sie folgt jeder Verschiebung des Rigs,\n     verdeckt nichts, und `depthTest:false` macht sie auch hinter dem Körper sichtbar. */\n  mark(i, level) {\n    const p = this.parts && this.parts[i]; if (!p) return;\n    const T = this.THREE, accent = this.props.accent || '#c03';\n    if (level > 0 && !p._outline) {\n      const ls = new T.LineSegments(\n        new T.EdgesGeometry(p.mesh.geometry, 20),\n        new T.LineBasicMaterial({ color: accent, transparent: true, depthTest: false, depthWrite: false }));\n      ls.renderOrder = 99; ls.raycast = () => {}; ls.frustumCulled = false;\n      p.mesh.add(ls); p._outline = ls;\n    }\n    if (!p._outline) return;\n    p._outline.visible = level > 0;\n    p._outline.material.color.set(accent);\n    p._outline.material.opacity = level >= 1 ? 1 : 0.5;\n  }\n  select(i) {\n    const prev = this.state.sel;\n    if (prev >= 0 && prev !== i) this.mark(prev, 0);\n    const nx = prev === i ? -1 : i;\n    this.mark(i, nx === i ? 1 : 0);\n    this.setState({ sel: nx });\n  }\n\n  componentDidMount() {\n    this._mounted = true;\n    const go = () => this.boot().catch((e) => this.setState({ err: String(e && e.message || e) }));\n    if (window.__KFB3D) go(); else window.addEventListener('kfb3dready', go, { once: true });\n  }\n\n  componentWillUnmount() {\n    this._mounted = false;\n    if (this._raf) cancelAnimationFrame(this._raf);\n    if (this._ro) this._ro.disconnect();\n    if (this.renderer) { this.renderer.dispose(); const c = this.renderer.domElement; if (c && c.parentNode) c.parentNode.removeChild(c); }\n  }\n\n  saved() { try { return JSON.parse(localStorage.getItem(KEY) || 'null') || null; } catch (e) { return null; } }\n  /* Bidirektionale Kompatibilität (Georg 13.09. spät): ein `kfb.pets/1`-Export aus dem Studio\n     lädt hier wieder ein, über `fromPets1` — dieselbe Übersetzung rückwärts. Ein Pet, das nicht\n     `capsule-carl` ist, wird ABGEWIESEN, nicht geraten: die Übersetzung kennt nur diese eine\n     Figur, und ein anderes Pet in dieser Form zu erzwingen wäre Erfindung, keine Übersetzung.\n     Angewandt wird über einen Neustart der Seite — derselbe Weg, den `boot()` für die gespeicherte\n     Einstellung ohnehin geht, kein zweiter Anwende-Pfad, der getrennt geprüft werden müsste. */\n  importFile(file) {\n    const rd = new FileReader();\n    rd.onload = () => {\n      let doc; try { doc = JSON.parse(rd.result); } catch (e) { this.setState({ err: 'Not valid JSON: ' + e.message }); return; }\n      if (doc.$schema !== 'kfb.pets/1') { this.setState({ err: 'Not a kfb.pets/1 file ($schema missing or different)' }); return; }\n      const pet = (doc.pets || [])[0];\n      if (!pet || pet.id !== 'capsule-carl') { this.setState({ err: 'kfb.pets/1 file has no capsule-carl entry — refused, not guessed' }); return; }\n      if (!this.CC) { this.setState({ err: 'carl-contract.v1.js not loaded — cannot translate back' }); return; }\n      const rich = this.CC.fromPets1(doc);\n      /* ⚠ `fromPets1` gibt die REICHE Form zurück (wie der Export-Bel , ' + this.clean.report.triangles + ' tris in ' + this.clean.report.colour : '')\n        + ' · file untouched' : '',\n      toolButtons, views, eyeRows, mouthRows, mouthSets, visemes: vis, zoneRows, palette,\n      eyeColorRows, eyePalette, eyeSel: !!s.eyeSel, zoneColorRows, stacheColorRows, stachePalette, stacheToggle,\n      eyeShadeNote: this.SHADE ? ('Lid/lash default: -1/-2 shade of ' + this.baseSkinColour() + ' — override with the fields above') : '',\n      paintLabel: s.paint ? 'Paint on' : 'Paint off',\n      paintStyle: 'height:22px;padding:0 10px;background:' + (s.paint ? 'var(--dc-red)' : 'var(--dc-bg-grey)') + ';border:0;border-radius:var(--radius-pill);color:' + (s.paint ? '#fff' : 'var(--color-fg)') + ';font-size:11px;font-weight:700;line-height:1;cursor:pointer;flex:0 0 auto;',\n      onPaint: () => { const nx = !s.paint; this.setState({ paint: nx }, () => this.applyPaint(nx)); },\n      browMods, stacheForms, noseMods, browPartRows, nosePartRows, showStamp: s.stamp,\n      hasBrowRig: !!ob, hasNoseRig: !!on_,\n      infoStyle: 'width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:'\n        + (s.stamp ? 'var(--dc-white)' : 'transparent') + ';border:1px solid ' + (s.stamp ? 'var(--dc-white)' : 'rgba(255,255,255,.55)')\n        + ';border-radius:var(--radius);color:' + (s.stamp ? 'var(--dc-red)' : '#fff') + ';font-family:var(--font-slab);font-size:15px;font-weight:700;line-height:1;cursor:pointer;',\n      onInfo: () => this.setState({ stamp: !s.stamp }),\n      onResetBrow: () => {\n        if (ob) ob.reset();\n        if (this.browGraft) this.browGraft.reset();\n        this.applyBrow('block'); this.showIslands(fp.brows, true);\n        this.setState({ browMod: 'block', brow: {}, graft: {} }, () => this.persist());\n      },\n      onResetNose: () => {\n        if (on_) on_.reset();\n        if (this.noseGraft) this.noseGraft.reset();\n        if (this.face.noseRig) this.face.noseRig.set({ enabled: true });\n        if (fp.nose != null) this.showIslands([fp.nose], false);\n        this.setState({ noseMod: 'ours', nose: {}, noseGraft: {} }, () => this.persist());\n      },\n      zoneCount: s.zoneCount,\n      selLabel: s.sel < 0 ? 'Pick a zone in the list — it lights up on the model' : 'Colour of ' + ((names[s.sel] && names[s.sel].label) || ('zone ' + (s.sel + 1))),\n      resetStyle: tool(false),\n      /* Primärknopf ist im System grün. Die Schrift darauf ist hier SCHWARZ, nicht das weiße\n         `.dc-btn` — weiß auf #9c3 sind 1,9:1 und auf einem Werkzeugknopf nicht lesbar. Schwarz auf\n         #9c3 sind 10,5:1, und #000 ist ohnehin die Textfarbe des Systems (R12). */\n      saveStyle: 'height:30px;padding:0 12px;display:flex;align-items:center;background:var(--dc-green);border:0;border-radius:var(--radius);color:#000;font-size:13px;font-weight:700;line-height:1;cursor:pointer;white-space:nowrap;text-decoration:none;',\n      sectionResetStyle: 'height:18px;padding:0;background:transparent;border:0;color:var(--color-link);font-size:12px;font-weight:400;line-height:1;cursor:pointer;',\n      saveHref: 'data:application/json;charset=utf-8,' + encodeURIComponent(payload),\n      saveName: 'kfb-pet-capsule-carl.json',\n      fileRef: (el) => { this.fileEl = el; },\n      onImportClick: () => { if (this.fileEl) this.fileEl.click(); },\n      onImportFile: (e) => { const f = e.target.files && e.target.files[0]; if (f) this.importFile(f); e.target.value = ''; },\n      importStyle: 'height:30px;padding:0 12px;display:flex;align-items:center;background:transparent;border:1px solid var(--dc-white);border-radius:var(--radius);color:#fff;font-size:13px;font-weight:700;line-height:1;cursor:pointer;white-space:nowrap;',\n      onResetAll: () => { this.resetEyes(); this.resetMouth(); this.resetZones(); },\n      onResetEyes: () => this.resetEyes(),\n      onResetMouth: () => this.resetMouth(),\n      onResetZones: () => this.resetZones(),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002F
