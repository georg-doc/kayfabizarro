<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Travel Globe · Browserdiagnose</title>
<style>body{margin:0;background:#101b24;color:#f6efdb;font:15px system-ui}header{padding:14px;display:flex;gap:18px;align-items:center}a{color:#ffcf57}iframe{width:100%;height:72vh;border:0}pre{padding:14px;white-space:pre-wrap}button{padding:8px}</style>
<header><strong>Travel Globe · technische Browserdiagnose</strong><a href="../" target="_blank">Normalen Spielstart öffnen</a><button id="capture">Messwerte aktualisieren</button><button id="save">Messwerte speichern</button></header>
<iframe id="game" src="../" title="Unveränderte Travel-Laufzeit"></iframe><pre id="result">Warte auf den Kaltstart …</pre>
<script type="module">
let latest;
function capture(){
 const w=document.querySelector('#game').contentWindow,g=w.__globe;
 latest={at:new Date().toISOString(),context:'B0 same-origin iframe diagnostic; not a normal-browser gameplay PASS',bootErrors:w.__bootErrors||[],ready:!!g};
 if(g)Object.assign(latest,{petLoaded:g.petGeladen,startCount:g.startZaehler,frameErrors:g.frameFehlerZahl,frames:g.probe(),collected:g.gesammelt,carpet:g.carpet.report?.(),portal:g.portale.report?.(),coldStartResources:w.performance.getEntriesByType('resource').map(r=>({url:r.name,status:r.responseStatus||null})),webgl:g.renderer.getContext().getParameter(g.renderer.getContext().VERSION)});
 document.querySelector('#result').textContent=JSON.stringify(latest,null,2);
}
document.querySelector('#capture').onclick=capture;
document.querySelector('#save').onclick=()=>{capture();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(latest,null,2)],{type:'application/json'}));a.download='travel-browser-observation.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
setInterval(capture,10000);
</script></html>
