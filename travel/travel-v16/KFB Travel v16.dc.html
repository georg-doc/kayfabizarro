<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script>
// Fehler-Horcher, BEVOR das Modul startet (aus v12 übernommen). Grund: ein `SCRIPT failed to load:`
// ohne Namen verschluckt jeden künftigen echten Ladefehler — hier wird der Verursacher eingesammelt.
window.__bootErrors = [];
window.addEventListener('error', function (e) {
  var t = e && e.target;
  if (!t || t === window) return;   // JS-Ausnahmen laufen woanders, hier geht es um Ressourcen
  var rec = {
    tag: t.tagName || String(t),
    src: t.src || t.href || '(leer)',
    currentSrc: t.currentSrc || '',
    type: t.type || '',
    inHead: !!(t.parentNode && t.parentNode.nodeName === 'HEAD'),
    when: Math.round(performance.now()) + ' ms',
  };
  window.__bootErrors.push(rec);
  console.info('[boot-error]', rec.tag, rec.src, rec);
}, true);
</script>
<script type="module" src="./terrain-v16/travel-poc.js"></script>
</helmet>
