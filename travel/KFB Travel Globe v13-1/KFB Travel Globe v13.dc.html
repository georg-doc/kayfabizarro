<script>
window.__bootErrors = [];
window.addEventListener('error', function (e) {
  var t = e && e.target;
  if (!t || t === window) return;
  var rec = { tag: t.tagName || String(t), src: t.src || t.href || '(leer)',
              msg: (e && e.message) || '(Ladefehler ohne Message)' };
  window.__bootErrors.push(rec);
  console.error('[boot-error]', rec.tag, rec.src, rec.msg);
}, true);
window.addEventListener('error', function (e) {
  if (!e || e.target !== window) return;
  var rec = { tag: 'JS', src: (e.filename || '?') + ':' + (e.lineno || 0), msg: e.message,
              stack: (e.error && e.error.stack || '').split('\n').slice(0, 4).join(' | ') };
  window.__bootErrors.push(rec);
  console.error('[js-error]', rec.msg, rec.src, rec.stack);
});
window.addEventListener('unhandledrejection', function (e) {
  var r = e && e.reason, msg = (r && (r.message || String(r))) || String(r);
  window.__bootErrors.push({ tag: 'PROMISE', msg: msg });
  console.error('[boot-error] unhandled rejection:', msg);
});
</script>
