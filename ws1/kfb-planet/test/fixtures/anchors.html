<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Scheinwerfer-Anker Prüfseite</title>
<style>html,body{margin:0;background:#2a2a30}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }</script>
</head><body>
<script type="module">
// V-631 Abnahme der Scheinwerfer-Anker (Georg im Rig-Studio, WS0 J-6): Racer im Modellraum (+Z vorn, Rig-Einheiten), neutrales Studiolicht,
// Ansicht front (orthografisch, gerade von vorn) oder quarter (schräg von vorn links oben). test/anchors-sheet.mjs zeichnet die Marken darüber.
import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'
const q = new URLSearchParams(location.search), W = innerWidth, H = innerHeight
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); renderer.setSize(W, H); renderer.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(renderer.domElement)
const scene = new THREE.Scene(); scene.background = new THREE.Color('#2a2a30'); scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture
const g = await new GLTFLoader().loadAsync(q.get('url')); scene.add(g.scene)
const box = new THREE.Box3().setFromObject(g.scene), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3())
let camera
if (q.get('view') === 'quarter') { camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 200); const d = Math.max(size.x, size.y) * 2.4; camera.position.set(c.x + d * 0.55, c.y + d * 0.35, box.max.z + d * 0.75); camera.lookAt(c.x, c.y * 0.9, box.max.z - size.z * 0.15) }
else { const h = Math.max(size.y * 1.12, size.x * 1.12 * H / W); camera = new THREE.OrthographicCamera(-h * W / H / 2, h * W / H / 2, h / 2, -h / 2, 0.1, 200); camera.position.set(c.x, c.y, box.max.z + 20); camera.lookAt(c.x, c.y, 0) }
camera.updateMatrixWorld(); renderer.render(scene, camera)
const v = new THREE.Vector3()
window.__anc = { ready: true, project: (pts) => pts.map((p) => { v.set(p[0], p[1], p[2]).project(camera); return [(v.x * 0.5 + 0.5) * W, (1 - (v.y * 0.5 + 0.5)) * H] }),
  scale: (p, r) => { const a = window.__anc.project([p, [p[0] + r, p[1], p[2]]]); return Math.hypot(a[1][0] - a[0][0], a[1][1] - a[0][1]) } }
</script>
</body></html>
