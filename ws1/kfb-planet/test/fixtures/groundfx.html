<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>kfb-groundfx Prüfseite</title>
<style>html,body{margin:0;background:#111}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
</head><body>
<script type="module">
// Prüfseite V-632: welliges Gelände mit Hang (links), Mulde (Mitte) und Kante (rechts), je Form drei Effekte darauf. Gesteuert von test/groundfx.mjs über window.__gfx.
import * as THREE from 'three'
import { createGroundFx, createRingEmitter } from '/src/look/kfb-groundfx.v1.js'
const W = innerWidth, H = innerHeight
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); renderer.setSize(W, H); renderer.setPixelRatio(devicePixelRatio)
renderer.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(renderer.domElement)
const scene = new THREE.Scene(); scene.background = new THREE.Color('#1b2033')
const camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 400); camera.position.set(0, 19, 26); camera.lookAt(0, 0, -1)
const hemi = new THREE.HemisphereLight('#6f82b8', '#2c2a36', 0.42), sun = new THREE.DirectionalLight('#9fb4ff', 0.18); sun.position.set(-10, 20, 8); scene.add(hemi, sun)
// Höhe: Hang x < −8 steigt nach links an, Mulde um (0, 0), Kante bei x = 9 (1,6 m Stufe auf 0,25 m), dazu leichte Wellen
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t) }
const height = (x, z) => Math.max(0, -8 - x) * 0.45 - 2.2 * Math.exp(-(x * x + z * z) / 14) + 1.6 * smooth(8.9, 9.15, x) + 0.25 * Math.sin(x * 0.7) * Math.sin(z * 0.6)
const geo = new THREE.PlaneGeometry(60, 40, 300, 200).rotateX(-Math.PI / 2), pa = geo.attributes.position
for (let i = 0; i < pa.count; i++) pa.setY(i, height(pa.getX(i), pa.getZ(i)))
geo.computeVertexNormals()
const mat = new THREE.MeshStandardMaterial({ color: '#c9b48a', roughness: 0.95 }), ground = new THREE.Mesh(geo, mat); scene.add(ground)
const fx = createGroundFx(THREE, { max: 16 }); fx.attach(ground)
const SPOTS = [[-14, 2], [0, 0], [9, 1]]   // Hang, Mulde, Kante
const bodies = new THREE.Group(); scene.add(bodies)
const ch = { cone: fx.channel('headlights', { priority: 2 }), pool: fx.channel('lanterns', { priority: 1 }), ring: fx.channel('boombox', { priority: 0 }), fill: fx.channel('disco') }
const rings = createRingEmitter(ch.ring, { color: '#ffd23a', r0: 0.5, r1: 4.5, life: 1.2, maxRings: 3, pool: false })
function show(form) {
  bodies.clear(); for (const c of Object.values(ch)) c.clear(); rings.rings.length = 0
  if (form === 'cone') ch.cone.set(SPOTS.map(([x, z], i) => { const o = new THREE.Vector3(x - 3, height(x - 3, z) + 1.1, z), t = new THREE.Vector3(x + 2, height(x + 2, z), z), d = t.clone().sub(o).normalize()
    const b = fx.makeBeam({ color: '#ffe9a8', opacity: 0.35, angle: 0.3 }); fx.aimBeam(b, o, d, o.distanceTo(t) * 1.2); const g = fx.makeGlow({ color: '#fff6dc', size: 0.7 }); g.position.copy(o); bodies.add(b, g)
    return { form: 'cone', origin: o, dir: d, angle: 0.38, soft: 0.6, color: ['#ffe9a8', '#a8e1ff', '#ffb0a8'][i], intensity: 1.6, range: 14 } }))
  if (form === 'pool') ch.pool.set(SPOTS.map(([x, z], i) => { const o = new THREE.Vector3(x, height(x, z) + 2.2, z), g = fx.makeGlow({ color: '#ffd9a0', size: 0.9 }); g.position.copy(o); bodies.add(g)
    return { form: 'pool', origin: o, radius: 2.6, soft: 0.5, color: ['#ffc070', '#7fe0ff', '#ff7fd0'][i], intensity: 1.4, range: 6 } }))
  if (form === 'ring') { for (const [x, z] of SPOTS) { const g = fx.makeGlow({ color: '#ffe27a', size: 0.8 }); g.position.set(x, height(x, z) + 1.2, z); bodies.add(g) }
    const lists = SPOTS.map(([x, z], i) => { const e = createRingEmitter({ set() {} }, { color: ['#ffd23a', '#3affd2', '#ff3ad2'][i], r0: 0.5, r1: 4.5, width: 0.4, life: 1.2, pool: true, poolRadius: 1.6, poolIntensity: 0.5 })
      e.kick(1); e.update(0.35); e.kick(0.8); e.update(0.35); return e.update(0.01, { center: { x, y: height(x, z), z }, pulse: { audible01: 1, bass: 0.6 } }).slice() })
    ch.ring.set(lists.flat()) }
  if (form === 'full') ch.fill.set(Array.from({ length: 16 }, (_, i) => ({ form: ['cone', 'pool', 'ring'][i % 3], origin: { x: -24 + i * 3, y: 3, z: -6 + (i % 4) * 4 }, dir: [0.2, -1, 0.1], angle: 0.5, radius: 2.5, width: 0.5, color: '#ffffff', intensity: 0.4, range: 8 })))
  renderer.render(scene, camera)
}
// GPU-Zeit: n Bilder am Stück zeichnen, dann ein Pixel lesen (wartet auf die GPU)
const px = new Uint8Array(4)
function timeDraws(n = 40) { const gl = renderer.getContext(); const t0 = performance.now(); for (let i = 0; i < n; i++) renderer.render(scene, camera); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); return (performance.now() - t0) / n }
function sample(x, z) { const v = new THREE.Vector3(x, height(x, z), z).project(camera), gl = renderer.getContext(), d = renderer.getPixelRatio()
  const X = Math.round((v.x * 0.5 + 0.5) * W * d), Y = Math.round((v.y * 0.5 + 0.5) * H * d); renderer.render(scene, camera); gl.readPixels(X, Y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); return (px[0] + px[1] + px[2]) / 3 }
const AT = { cone: (x, z) => [x + 0.5, z], pool: (x, z) => [x, z], ring: (x, z) => [x + 4.22, z] }   // Ring: äußerer Ring nach 0,71 s (r = 0,5 + 4 · easeOut(0,59) = 4,22 m)
const samples = (form) => SPOTS.map(([x, z]) => sample(...AT[form](x, z)))
window.__gfx = { fx, ch, show, samples, timeDraws, sample, stats: () => fx.stats(), SPOTS, height, three: THREE.REVISION, ready: true, errors: [] }
show('none')
</script>
</body></html>
