<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KFB · Spiel-Vorschau</title>
    <!-- Vorschau-Start (WS1b §96): nackte Adresse → Spiel (#m1,harvest), der alte Spike nur noch über #spike. Ladeanzeige bis die Szene steht
         (Laufwelt meldet „kfb-ready“, andere Ansichten: erstes Canvas). Steht vor dem großen Modul-Skript, damit sie sofort sichtbar ist. -->
    <style>
      #kfb-boot{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#1b1633;color:#f3e9da;font:600 18px/1.3 system-ui,-apple-system,sans-serif;pointer-events:none}
      #kfb-boot .dots{display:flex;gap:10px}
      #kfb-boot .dots i{width:14px;height:14px;border-radius:50%;background:#ef5a22;animation:kfb-hop 1s ease-in-out infinite}
      #kfb-boot .dots i:nth-child(2){animation-delay:.15s;background:#f2b233}
      #kfb-boot .dots i:nth-child(3){animation-delay:.3s;background:#5fb3a8}
      #kfb-boot small{font-weight:400;font-size:13px;opacity:.7}
      @keyframes kfb-hop{0%,100%{transform:translateY(0) scale(1,1)}40%{transform:translateY(-14px) scale(.9,1.1)}60%{transform:translateY(0) scale(1.15,.85)}}
    </style>
    <script>
      (function () {
        if (!location.hash || location.hash === '#') history.replaceState(null, '', location.pathname + location.search + '#m1,harvest')
        var m1 = /#m1(,|$)/.test(location.hash)
        var el = document.createElement('div'); el.id = 'kfb-boot'
        el.innerHTML = '<div class="dots"><i></i><i></i><i></i></div><div>KFB · Spiel lädt …</div><small>Figuren, Gelände und Bühne kommen gleich</small>'
        document.documentElement.appendChild(el)
        var done = function () { if (el.parentNode) el.parentNode.removeChild(el) }
        if (m1) addEventListener('kfb-ready', done, { once: true })
        else { var t = setInterval(function () { if (document.querySelector('canvas')) { clearInterval(t); setTimeout(done, 300) } }, 100) }
        setTimeout(function () { var s = el.querySelector('small'); if (s) s.textContent = 'Dauert länger als sonst – die Seite lädt weiter' }, 45000)
        setTimeout(done, 120000)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Host-Vertrag R1.2 §4: feste Host-Slots für DOM-UI über der 3D-Szene -->
    <div id="ui-bubbles"></div>
    <div id="ui-choice"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
