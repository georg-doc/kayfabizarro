<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Tod Blödsinn Demo</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>:root{--bg:#e9dcc0;--ink:#1f1a14}@media (prefers-color-scheme:dark){:root{--bg:#2a241d;--ink:#f1e8dc}}
body{margin:0;height:100vh;background:var(--bg) repeating-linear-gradient(45deg,transparent 0 22px,rgba(0,0,0,.04) 22px 44px);color:var(--ink);font:15px/1.4 system-ui,sans-serif;display:grid;place-items:center}
.figur{width:120px;height:160px;border-radius:50% 50% 40% 40%;background:#4f86c6;border:4px solid #24384f;transition:transform 1.2s cubic-bezier(.3,.7,.3,1)}
.ui{position:fixed;left:16px;bottom:16px;display:flex;gap:8px;z-index:10000}button{font:700 14px system-ui;padding:8px 14px;border-radius:8px;border:0;background:#b8361f;color:#f6efd9;cursor:pointer}
#menu{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:#1f1a14;color:#f3ead3;padding:14px 22px;border-radius:12px;display:none;z-index:10000}
#log{position:fixed;right:16px;bottom:16px;font:12px ui-monospace,monospace;background:rgba(0,0,0,.6);color:#fff;padding:8px;border-radius:8px;z-index:10000}</style></head>
<body><div class="figur" id="fig"></div><div id="menu">FrizzleBob is down · <b>Nochmal</b></div>
<div class="ui"><button id="play">Tod abspielen</button><button id="stop">Aufstehen</button></div><pre id="log"></pre>
<script type="module">
import { createTodScreen } from './kfb-tod-bloedsinn.v1.mjs'
const log = (s) => { const l = document.getElementById('log'); l.textContent = (s + '\n' + l.textContent).slice(0, 400) }, fig = document.getElementById('fig'), menu = document.getElementById('menu')
const tod = createTodScreen({
  onCue: (n, t) => log(`Ton: ${n} @ ${t.toFixed(2)} s`),
  onEyes: (s) => log(`Augen: ${s}`),
  onZoom: (e) => { fig.style.transform = `scale(${1 + e * 0.9}) rotate(${e * 80}deg)` },
  onWordSettled: () => { menu.style.display = 'block'; log('Wort steht → Menü') } })
document.getElementById('play').onclick = () => { menu.style.display = 'none'; tod.play() }
document.getElementById('stop').onclick = () => { menu.style.display = 'none'; tod.stop() }
</script></body></html>
