<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>kfb-edge Parität</title>
<script src="kfb-edge.v1.js"></script></head>
<body style="font:13px system-ui;margin:12px"><pre id="out">läuft …</pre>
<script>
/* Parität kfbEdgeD (GPU, WebGL2, Float-Ziel) gegen KFB_EDGE.D (JS) auf 4096 Punkten. Roh-WebGL2, kein three nötig. */
(function () {
  const E = window.KFB_EDGE, N = 64, out = document.getElementById('out');
  const fail = (m) => { window.__parity = { ok: false, error: m }; out.textContent = 'FEHLER ' + m };
  /* Anker weit weg vom Ursprung (wie in der Welt der Probe), Box gedreht; Stärke je Anker für die 4-Argument-Variante */
  const ANCH = [
    { x: 137.37, z: -58.21, R: 9.5, y: 3.1, hx: 0, hz: 0, rot: 0, blend: 10, strength: 1 },
    { x: 152.61, z: -44.93, R: 0.6, y: 3.4, hx: 3.3, hz: 3.65, rot: 0.73, blend: 6, strength: 1 },
    { x: -211.4, z: 96.8, R: 9.5, y: 0, hx: 0, hz: 0, rot: 0, blend: 10, strength: 3.5 },
    { x: -190.2, z: 120.5, R: 0.6, y: 0, hx: 3.3, hz: 3.65, rot: -1.1, blend: 6, strength: 2.5 },
  ];
  /* Punkte: gleichmäßig über die Anker, sdf ∈ [−4, 2.5] (dichtes Übergangsband) */
  const rnd = E._.mulberry32(20261021), pts = new Float32Array(N * N * 4);
  for (let i = 0; i < N * N; i++) {
    const k = i % ANCH.length, a = ANCH[k]; let x, z, s;
    do { const ext = Math.max(a.hx, a.hz) + a.R + 3; x = a.x + (rnd() * 2 - 1) * ext; z = a.z + (rnd() * 2 - 1) * ext; s = E._.sdfXZ(x, z, E._.anc(a)) } while (s < -4 || s > 2.5);
    pts.set([Math.fround(x), Math.fround(z), k, 0], i * 4);
  }
  const cv = document.createElement('canvas'); cv.width = cv.height = N; const gl = cv.getContext('webgl2');
  if (!gl) return fail('kein WebGL2'); if (!gl.getExtension('EXT_color_buffer_float')) return fail('EXT_color_buffer_float fehlt');
  const vs = '#version 300 es\nin vec2 aP; void main(){ gl_Position = vec4(aP, 0.0, 1.0); }';
  const fs = '#version 300 es\nprecision highp float; precision highp int; uniform highp sampler2D uPts; uniform vec4 uA[4]; uniform vec4 uC[4]; uniform float uS[4]; out vec4 o;\n' + E.glsl +
    '\nvoid main(){ vec4 t = texelFetch(uPts, ivec2(gl_FragCoord.xy), 0); int k = int(t.z + 0.5); vec4 A = uA[0], C = uC[0]; float st = uS[0];\n' +
    ' if (k == 1) { A = uA[1]; C = uC[1]; st = uS[1]; } else if (k == 2) { A = uA[2]; C = uC[2]; st = uS[2]; } else if (k == 3) { A = uA[3]; C = uC[3]; st = uS[3]; }\n' +
    ' o = vec4(kfbEdgeD(t.xy, A, C, st), kfbEdgeD(t.xy, A, C), kfbEdgeEarth(t.xy, A, C), kfbEdgeS(t.xy, A, C)); }';
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s };
  let prog; try { prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(prog); if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog)) } catch (e) { return fail('Shader: ' + e.message) }
  gl.useProgram(prog);
  const tex = (data) => { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, N, N, 0, gl.RGBA, gl.FLOAT, data); for (const p of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER]) gl.texParameteri(gl.TEXTURE_2D, p, gl.NEAREST); return t };
  const tIn = tex(pts), tOut = tex(null), fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tOut, 0);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) return fail('Float-Ziel unvollständig');
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tIn); gl.uniform1i(gl.getUniformLocation(prog, 'uPts'), 0);
  gl.uniform4fv(gl.getUniformLocation(prog, 'uA'), ANCH.flatMap((a) => [a.x, a.z, a.R, a.y])); gl.uniform4fv(gl.getUniformLocation(prog, 'uC'), ANCH.flatMap((a) => [a.hx, a.hz, a.rot, a.blend])); gl.uniform1fv(gl.getUniformLocation(prog, 'uS'), ANCH.map((a) => a.strength));
  const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW); const loc = gl.getAttribLocation(prog, 'aP'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.viewport(0, 0, N, N); gl.drawArrays(gl.TRIANGLES, 0, 3);
  const px = new Float32Array(N * N * 4); gl.readPixels(0, 0, N, N, gl.RGBA, gl.FLOAT, px);
  /* Vergleich: JS rechnet mit denselben float32-Eingaben (Punkt, Anker) in double */
  const f32 = Math.fround, A32 = ANCH.map((a) => ({ ...a, x: f32(a.x), z: f32(a.z), R: f32(a.R), y: f32(a.y), hx: f32(a.hx), hz: f32(a.hz), rot: f32(a.rot), strength: f32(a.strength) }));
  let maxD = 0, maxD1 = 0, sumD = 0, maxE = 0, maxS = 0, band = 0, worst = null;
  for (let i = 0; i < N * N; i++) {
    const x = pts[i * 4], z = pts[i * 4 + 1], a = A32[pts[i * 4 + 2]];
    const dS = E.D([x, z], a, a.strength), d1 = E.D([x, z], a), e = E.earth([x, z], a), s = E.S([x, z], a);
    const dd = Math.abs(px[i * 4] - dS), d1d = Math.abs(px[i * 4 + 1] - d1); sumD += dd; if (dd > maxD) { maxD = dd; worst = { i, x, z, gpu: px[i * 4], js: dS } }
    maxD1 = Math.max(maxD1, d1d); maxE = Math.max(maxE, Math.abs(px[i * 4 + 2] - e)); maxS = Math.max(maxS, Math.abs(px[i * 4 + 3] - s)); if (dS > 0 && dS < 1) band++;
  }
  const dbg = gl.getExtension('WEBGL_debug_renderer_info'), gpu = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
  const ok = maxD <= 1e-3 && maxD1 <= 1e-3;
  window.__parity = { ok, n: N * N, inBand: band, maxAbsD: maxD, maxAbsD_strength1: maxD1, meanAbsD: sumD / (N * N), maxAbsEarth: maxE, maxAbsS: maxS, worst, gpu, paramsSha: E.paramsSha };
  out.textContent = JSON.stringify(window.__parity, null, 2);
})();
</script></body></html>
