<script>
(function(){

1:{title:'THE LEAK',claim:'The public deserves to know.',incentive:'The release schedule is an asset.',faction:'Illuminati',owner:'npc'},
2:{title:'THE BELL',claim:'We must sound the alarm.',incentive:'Every alarm extends the contract.',faction:'Round Table',owner:'a'},
3:{title:'THE OFFICIAL DENIAL',claim:'There is nothing to conceal.',incentive:'The denial is the only authorized record.',faction:'Fourth Reich',owner:'npc'},
4:{title:'THE NATIONAL EMERGENCY',claim:'Exceptional measures are temporary.',incentive:'The renewal form has no final date.',faction:'Shared Focus',owner:'focus'},
5:{title:'THE ELIGIBILITY DESK',claim:'Everyone is entitled to apply.',incentive:'The deadline precedes the announcement.',faction:'Holy Empire',owner:'npc'},
6:{title:'THE SAFETY ADVISORY',claim:'Protection comes first.',incentive:'Protection is billed by the remaining threat level.',faction:'Technocracy',owner:'b'},
7:{title:'THE AFTERCARE DIVIDEND',claim:'No one will be left behind.',incentive:'Dividends settle before compensation.',faction:'Alien Management',owner:'npc'}};
var stockCards=[
['THE CONTROLLED DISCLOSURE','The archive is now open.','Access requires an annual fee.'],
['THE COMPLIANCE ORACLE','Every citizen may ask.','The questions are sold to bidders.'],
['THE VIRTUAL SIREN','Alerts keep everyone safe.','An unexpired alert supports the budget.'],
['THE EMERGENCY MEMBERSHIP','Everyone can join the rescue.','Membership fees are nonrefundable.'],
['THE SEALED AMENDMENT','The decision is transparent.','Only its consequences are public.'],

var npcOrder=[1,3,7,5];
var s;
function clone(x){return JSON.parse(JSON.stringify(x));}
function makeCard(row){return {title:row[0],claim:row[1],incentive:row[2]};}
function initial(){
 var v={cards:clone(originals),dice:{hate:{slot:1,value:3},fear:{slot:2,value:3},hope:{slot:6,value:3}},phase:'setup',scenario:'normal',variant:'A',lens:'claim',selected:4,round:1,starting:0,turn:0,stock:37,stockIndex:0,hands:{a:[{title:'THE SEALED VOTE',claim:'Every vote counts.',incentive:'The result is notarized in advance.'},{title:'THE QUIET CONSENSUS',claim:'Everybody agrees.',incentive:'Opposition is omitted from the minutes.'},{title:'THE ROYAL DISCLAIMER',claim:'We clarify our responsibility.',incentive:'Responsibility ends at the signature.'}],b:[{title:'THE PREDICTION ENGINE',claim:'The future is measurable.',incentive:'Only customers may see the forecast.'},{title:'THE SERVICE TIER',claim:'Safety is available to everyone.',incentive:'The basic tier excludes emergencies.'},{title:'THE AUTOMATED APOLOGY',claim:'We are listening.',incentive:'The apology restarts the billing cycle.'}]},trophies:{a:[],b:[]},discard:[],log:[{label:'SETUP',text:'6 Fraktionskarten + 50 Narrativkarten: 6 außen, 1 Focus, je 3 Handkarten, 37 im verdeckten Vorrat. 3 Würfel auf 3.'}],npcCursor:0,lastResult:'',storyMode:'full'};return v;
}
s=initial();
function esc(t){return String(t===undefined?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function human(){return (s.turn+s.starting)%2===0?'a':'b';}
function holder(slot){var c=s.cards[slot];return c?c.owner:null;}
function diceOn(slot){return Object.keys(s.dice).filter(function(k){return s.dice[k].slot===slot;});}
function countOuter(){return [1,2,3,5,6,7].filter(function(i){return !!s.cards[i];}).length;}
function ledger(){return countOuter()+(s.cards[4]?1:0)+s.hands.a.length+s.hands.b.length+s.stock+s.trophies.a.length+s.trophies.b.length+s.discard.length;}
function append(label,text){s.log.push({label:label,text:text});}
function drawCard(){if(s.stock<=0)return null;var row=stockCards[s.stockIndex%stockCards.length];s.stockIndex++;s.stock--;return makeCard(row);}
function scenario(kind){s=initial();s.scenario=kind;if(kind==='climax'){s.dice.hate.value=6;s.dice.fear.value=4;append('VORBEREITET','Midgame-Testzustand: HATE 6 / FEAR 4 / HOPE 3; die früheren legalen ADJUST-Schritte werden nicht als aktueller Zug gezählt.');}if(kind==='burn'){s.dice.fear.value=1;append('VORBEREITET','Midgame-Testzustand: FEAR 1 / HATE 3 / HOPE 3; Test der 1→0-Entfernung.');}}
function storyLine(){var h=s.cards[s.dice.hate.slot],f=s.cards[s.dice.fear.slot],p=s.cards[s.dice.hope.slot],c=s.cards[4];var hn=h?h.title:'(off-board)',fn=f?f.title:'(off-board)',pn=p?p.title:'(off-board)',cn=c?c.title:'(kein Focus)';return hn+' is blamed; therefore '+fn+' demands a response; but '+pn+' sells the solution to '+cn+'.';}
function plainLine(){return ['hate','fear','hope'].map(function(k){var d=s.dice[k];return k.toUpperCase()+': '+(s.cards[d.slot]?s.cards[d.slot].title:'—');}).join('  →  ');}
function cardView(i){var c=s.cards[i];var focus=i===4;var d=diceOn(i);var owner=c?c.owner:'npc';var mark=focus?'focus':owner==='a'?'owner-a':owner==='b'?'owner-b':'';var data='data-slot="'+i+'"';var label=c?c.title:'EMPTY · NO NARRATIVE';var faction=c?c.faction:originals[i].faction;return '<button type="button" class="c p'+i+' '+mark+(c?'':' vacant')+(s.selected===i?' active':'')+'" '+data+' aria-label="Position '+i+': '+esc(label)+'"><div class="number">'+i+(focus?' · SHARED FOCUS':' · '+(owner==='npc'?'NPC':owner==='a'?'PLAYER A':'PLAYER B'))+'</div><div class="faction">'+esc(faction)+'</div><div class="ctitle">'+esc(label)+'</div><div>'+(d.map(function(k){return '<span class="die '+k+'">'+k.toUpperCase()+' <span class="circ">'+s.dice[k].value+'</span></span>';}).join(' '))+'</div></button>';}
function turnName(){return humanNames[human()];}
function actions(){var h=human(),free7=!!s.cards[7]&&!diceOn(7).length;return [
 {id:'up',title:'ADJUST HATE +1',hint:'Bei 6→7 Karte gewinnen',ok:s.dice.hate.slot!==null},
 {id:'down',title:'ADJUST FEAR −1',hint:'Bei 1→0 Karte verbrennen',ok:s.dice.fear.slot!==null},
 {id:'move',title:'MOVE HOPE → 7',hint:'Selbe Würfelseite, neue Lösung',ok:s.dice.hope.slot!==null&&s.dice.hope.slot!==7&&free7},
 {id:'swap',title:'SWAP FEAR / HOPE',hint:'Orte tauschen, Werte bleiben',ok:s.dice.fear.slot!==null&&s.dice.hope.slot!==null},
 {id:'reroll',title:'REROLL FEAR',hint:'Neuer Zufallswert 1–6, kein Collapse',ok:s.dice.fear.slot!==null},
 {id:'draw',title:'DRAW 1',hint:'Hand +1, Vorrat −1; maximal 6',ok:s.hands[h].length<6&&s.stock>0}];}
function relocate(key){var free=[1,2,3,5,6,7].find(function(i){return !!s.cards[i]&&!diceOn(i).length;});s.dice[key].slot=free===undefined?null:free;return free;}
function collapse(key,isHigh,actor){var d=s.dice[key];var slot=d.slot;var old=s.cards[slot];var hopeBefore=s.dice.hope.slot;var hopeOwnerBefore=holder(hopeBefore);var focusMessage='FOCUS bleibt als gemeinsamer Kontext liegen (R17 A).';s.cards[slot]=null;d.slot=null;d.value=3;
 if(isHigh){s.trophies[actor].push(old);append('6→7 · TROPHY',humanNames[actor]+' erhält '+old.title+' von Position '+slot+'.');}else{s.discard.push(old);append('1→0 · BURN',old.title+' geht auf den Ablagestapel. Kein Trophy.');}
 if(s.variant==='B' && s.cards[4]){if(!isHigh){s.discard.push(s.cards[4]);s.cards[4]=null;focusMessage='R17 B: negativer Collapse verwirft FOCUS.';}else{var hopeOwner=hopeOwnerBefore;if(hopeOwner==='npc'){s.discard.push(s.cards[4]);s.cards[4]=null;focusMessage='R17 B: HOPE auf NPC → FOCUS wird verworfen.';}else if(hopeOwner&&hopeOwner!==actor){var focus=s.cards[4];s.cards[4]=null;s.trophies[hopeOwner].push(focus);focusMessage='R17 B: '+humanNames[hopeOwner]+' gewinnt FOCUS, weil HOPE auf der anderen menschlichen Position lag.';}else{focusMessage='R17 B: kein doppelter FOCUS-Gewinn für den handelnden HOPE-Halter.';}}}
 var newSlot=relocate(key);var msg=(isHigh?'Hohes':'Niedriges')+' Ereignis: '+old.title+' entfernt; '+key.toUpperCase()+' auf 3'+(newSlot===null?', in Reserve':' und legal nach Position '+newSlot+' verlegt')+'. '+focusMessage;append('RESOLVE',msg);s.lastResult=msg;}
function perform(id){if(s.phase!=='action')return;var allowed=actions().find(function(a){return a.id===id&&a.ok;});if(!allowed)return;var actor=human(),result='';if(id==='up'||id==='down'){var key=id==='up'?'hate':'fear',die=s.dice[key],oldVal=die.value;die.value+=id==='up'?1:-1;result=key.toUpperCase()+' '+oldVal+' → '+die.value+'.';if(die.value===7||die.value===0){collapse(key,die.value===7,actor);result+=' '+s.lastResult;}}
 if(id==='move'){var from=s.dice.hope.slot;s.dice.hope.slot=7;result='HOPE wechselt von Position '+from+' auf 7, Wert bleibt '+s.dice.hope.value+'. Die vermeintliche Lösung lautet jetzt '+s.cards[7].title+'.';}
 if(id==='swap'){var z=s.dice.fear.slot;s.dice.fear.slot=s.dice.hope.slot;s.dice.hope.slot=z;result='FEAR und HOPE tauschen ihre Positionen. Beide Werte bleiben erhalten.';}
 if(id==='reroll'){var old=s.dice.fear.value;s.dice.fear.value=Math.floor(Math.random()*6)+1;result='FEAR wurde von '+old+' auf '+s.dice.fear.value+' gewürfelt. Kein automatischer Collapse.';}

 if(id!=='up'&&id!=='down')append('AKTION',result);else append('AKTION',humanNames[actor]+': '+result);
 s.lastResult=result;s.phase='resolved';assertLedger();render();}
function assertLedger(){if(ledger()!==50){console.error('DECK CONSERVATION ERROR',ledger(),s);}}
function npcPulse(){if(s.phase!=='npc')return;var vacant=npcOrder.filter(function(i){return !s.cards[i];});var selected;if(vacant.length){for(var j=0;j<npcOrder.length;j++){var idx=(s.npcCursor+j)%npcOrder.length;if(vacant.indexOf(npcOrder[idx])!==-1){selected=npcOrder[idx];s.npcCursor=(idx+1)%npcOrder.length;break;}}}else{selected=npcOrder[s.npcCursor];s.npcCursor=(s.npcCursor+1)%npcOrder.length;}
 var next=drawCard();if(!next){append('NPC A','Vorrat ist leer; Redaktionsschritt ohne neue Karte.');s.lastResult='Kein Vorrat für NPC.';}else{if(s.cards[selected]){s.discard.push(s.cards[selected]);}next.owner='npc';next.faction=originals[selected].faction;s.cards[selected]=next;var msg='Ein gemeinsamer NPC-Redaktionsschritt: Position '+selected+' zeigt nun '+next.title+'. Vorrat −1. Würfel am Ort bleiben unverändert.';append('NPC A',msg);s.lastResult=msg;}s.phase='done';assertLedger();render();}
function newRound(){if(s.phase!=='done')return;s.round++;s.starting=1-s.starting;s.turn=0;if(!s.cards[4]&&s.stock>0&&s.variant==='B'){var focus=drawCard();focus.owner='focus';focus.faction='Shared Focus';s.cards[4]=focus;append('NEXT FOCUS','Zu Beginn der nächsten Menschenrunde wird ein neuer Focus aus dem Vorrat aufgedeckt: '+focus.title+'.');}append('NEXT ROUND','Startspieler wechselt zu '+humanNames[human()]+'.');s.phase='story';assertLedger();render();}
function advance(){if(s.phase==='setup'){s.phase='story';append('START','Menschliche Runde '+s.round+' beginnt mit '+turnName()+'.');}else if(s.phase==='story'){append('NARRATION',turnName()+': '+(s.storyMode==='titles'?plainLine():storyLine()));s.phase=s.cards[human()==='a'?2:6]?'action':'reentry';}else if(s.phase==='resolved'){s.turn++;if(s.turn===2){s.phase='npc';}else{s.phase='story';}}else if(s.phase==='reentry'){var who=human();var slot=who==='a'?2:6;if(s.hands[who].length){var card=s.hands[who].shift();card.faction=originals[slot].faction;card.owner=who;s.cards[slot]=card;s.lastResult='PLAY: '+card.title+' wird in die eigene vakante Position '+slot+' veröffentlicht. Das kostet den ganzen Zug.';}else if(s.stock>0){s.hands[who].push(drawCard());s.lastResult='Hand leer: DRAW statt PLAY. Re-entry erst in einem späteren Zug.';}else{s.lastResult='Kein Hand-/Vorratsbestand: Wieder-Einstieg derzeit nicht möglich.';}append('RE-ENTRY',s.lastResult);s.phase='resolved';}assertLedger();render();}
function phaseInfo(){var who=turnName();if(s.phase==='setup')return {head:'1 / Setup — 56 Karten, 7 offene Positionen',desc:'Wähle Normalstart oder vorbereitete Testlage und starte den Umlauf. In der echten 50er Narrativ-Auslage erhalten beide Menschen jeweils 4 Karten, veröffentlichen eine und behalten 3.'};if(s.phase==='story')return {head:'SHOW / SPIN / SELL · '+who,desc:'Zeige die drei Karten unter HATE, FEAR und HOPE in dieser Reihenfolge. Die Titelkette genügt; die längere satirische Formulierung ist nicht wertungsrelevant.'};if(s.phase==='action')return {head:'Eine Aktion · '+who,desc:'Wähle genau eine zulässige Aktion. MOVE verändert nur die öffentliche Lesart; ADJUST auf 7 oder 0 entfernt eine Außenkarte.'};if(s.phase==='reentry')return {head:'Rückkehr auf die Bühne · '+who,desc:'Die eigene Karte wurde entfernt. Gemäß R16-Annahme: erst eine Handkarte als ganze Aktion veröffentlichen, statt den Würfel zu verändern.'};if(s.phase==='resolved')return {head:'Resolve · Zug '+(s.turn+1)+' / 2',desc:'Die Aktion ist bezahlt und alle sofortigen Folgen sind angewendet. Ein weiterer Klick reicht den Zug weiter.'};if(s.phase==='npc')return {head:'NPC A · Ein Redaktionsschritt',desc:'Nach den zwei menschlichen Zügen gibt es genau einen kollektiven NPC-Eingriff, nicht vier einzelne NPC-Spielzüge. Leere NPC-Positionen haben Priorität.'};return {head:'Runde '+s.round+' abgeschlossen',desc:'Zwei menschliche Aktionen und ein NPC-Pulse sind vorbei. Trophy-Bestand, Auflage und Vorrat bleiben erhalten; nächste Runde wechselt die Startperson.'};}
function selectPublication(who,index){if(s.phase!=='setup')return;var slot=who==='a'?2:6;var from=s.hands[who][index];if(!from)return;var old=s.cards[slot];s.hands[who][index]=old;from.faction=originals[slot].faction;from.owner=who;s.cards[slot]=from;append('SETUP CHOICE',humanNames[who]+' veröffentlicht '+from.title+' statt '+old.title+'. Drei Handkarten bleiben erhalten.');s.selected=slot;assertLedger();render();}
function render(){var info=phaseInfo();var active=human(),total=ledger(),selected=s.cards[s.selected],sidelabel=selected?selected.title:'EMPTY POSITION';var prompt=captions[s.selected];var showStory=s.phase==='story'||s.phase==='action'||s.phase==='resolved';
var phaseIndex={setup:0,story:1,action:2,reentry:2,resolved:3,npc:4,done:5}[s.phase];
var phases=['SETUP','ERZÄHLEN','AKTION','RESOLVE','NPC','RUNDE'];
var top='<header class="top"><div><div class="eyebrow">The Invisible Handshake · R19 Table Lab</div><h1>Seven-card Tarot Hex · Turn Simulator</h1><small>2 Menschen · 4 NPCs · 6 Fraktionen · 3 Würfel · 1 FOCUS · 1 menschliche Aktion pro Zug</small></div><span class="tag">PAPIER-POC / KEIN LIVE-GAME</span></header>';
var bar='<div class="toolbar"><label>Szenario <select data-setting="scenario"><option value="normal"'+(s.scenario==='normal'?' selected':'')+'>Regel-Setup · 3/3/3</option><option value="climax"'+(s.scenario==='climax'?' selected':'')+'>Vorbereiteter Collapse · 6/4/3</option><option value="burn"'+(s.scenario==='burn'?' selected':'')+'>Vorbereiteter Burn · 3/1/3</option></select></label><label>Focus-Regel <select data-setting="variant"><option value="A"'+(s.variant==='A'?' selected':'')+'>R17 A · nur Kontext</option><option value="B"'+(s.variant==='B'?' selected':'')+'>R17 B · EXPERIMENT</option></select></label><button class="ghost" data-do="reset">Alles zurücksetzen</button><span class="pill">Runde '+s.round+' · '+(s.phase==='setup'?'Aufbau':s.phase==='npc'?'NPC':s.phase==='done'?'abgeschlossen':turnName())+'</span></div>';
var metric='<div class="metrics"><div class="metric"><b>'+s.stock+'</b><span>Vorrat / 50</span></div><div class="metric"><b>'+countOuter()+'/6</b><span>Außenkarten</span></div><div class="metric"><b>'+(s.cards[4]?'1':'0')+'</b><span>FOCUS</span></div><div class="metric"><b>'+s.trophies.a.length+' · '+s.trophies.b.length+'</b><span>Trophäen A / B</span></div><div class="metric"><b>'+total+'/50</b><span>Bilanz '+(total===50?'OK':'FEHLER')+'</span></div></div>';
var cards='<div class="surface"><div class="surfacehead"><h2>Öffentliche Auslage</h2><span class="tag">6 außen + 1 Mitte</span></div><div class="board">'+[1,2,3,4,5,6,7].map(cardView).join('')+'</div><div class="legend"><span><b style="background:var(--a)"></b> Round Table</span><span><b style="background:var(--b)"></b> Technocracy</span><span><b style="background:var(--npc)"></b> NPC</span><span><b style="background:var(--focus)"></b> Focus</span></div><div class="ledger">Kartenerhaltung: außen '+countOuter()+' + Focus '+(s.cards[4]?1:0)+' + Hände '+(s.hands.a.length+s.hands.b.length)+' + Vorrat '+s.stock+' + Trophäen '+(s.trophies.a.length+s.trophies.b.length)+' + Ablage '+s.discard.length+' = <b>'+total+'</b> von 50.</div></div>';
var steps='<div class="steps">'+phases.map(function(x,i){return '<span class="step'+(i===phaseIndex?' current':'')+'">'+(i+1)+' · '+x+'</span>';}).join('')+'</div>';
var content=steps+'<h2>'+info.head+'</h2><p class="muted">'+info.desc+'</p>';
if(showStory)content+='<div class="story"><h3>3 Karten als kausale Behauptung</h3>'+esc(storyLine())+'<p class="muted" style="margin-bottom:0">'+esc(plainLine())+'</p></div>';
if(s.phase==='setup'){content+='<div class="details"><h3>Wähle 1 von 4 erhaltenen Karten pro Mensch</h3><div>Round Table <select data-setting="publishA"><option value="-1">'+esc(s.cards[2].title)+' (liegt aus)</option>'+s.hands.a.map(function(c,i){return '<option value="'+i+'">'+esc(c.title)+'</option>';}).join('')+'</select></div><div style="margin-top:7px">Technocracy <select data-setting="publishB"><option value="-1">'+esc(s.cards[6].title)+' (liegt aus)</option>'+s.hands.b.map(function(c,i){return '<option value="'+i+'">'+esc(c.title)+'</option>';}).join('')+'</select></div><p>Beide behalten je 3 Handkarten; Anzahl und Würfelzustand ändern sich nicht.</p></div><div class="actionnote">Setup: A und B bekamen je 4 Karten, publizierten je 1, behalten je 3. Vier NPC-Karten und ein FOCUS sind offen. Die sechs Fraktionsidentitäten liegen separat. Die gewählten sieben Motive sind textuelle PROXYS, keine finalen Artwork-Karten.</div><div class="stepbuttons"><button class="primary" data-do="advance">Rundenumlauf starten</button></div>';}
if(s.phase==='story'){content+='<div class="stepbuttons"><button class="primary" data-do="narrate">Titelkette → Aktion</button><button data-do="short">Nur Titel nennen</button></div>';}
if(s.phase==='action'){content+='<h3>Genau eine Aktion ausführen</h3><div class="actions">'+actions().map(function(a){return '<button data-action="'+a.id+'"'+(a.ok?'':' disabled')+'>'+a.title+'<small>'+a.hint+'</small></button>';}).join('')+'</div>';}
if(s.phase==='reentry'){content+='<p class="actionnote">'+s.hands[active].length+' Handkarten · dies ist eine eigenständige R16-Kandidatenregel.</p><div class="stepbuttons"><button class="primary" data-do="advance">'+(s.hands[active].length?'PLAY aus der Hand':'DRAW mangels Hand')+'</button></div>';}
if(s.phase==='resolved'){content+='<div class="actionnote">'+esc(s.lastResult)+'</div><div class="stepbuttons"><button class="primary" data-do="advance">'+(s.turn===0?'Nächste Person →':'NPC-Phase →')+'</button></div>';}
if(s.phase==='npc'){content+='<div class="actionnote">Regelvariante NPC A: genau ein ausgewählter NPC-Sitz erhält eine neue Karte. Leere NPC-Sitze werden zuerst aufgefüllt. Würfel bleiben beim bestehenden Sitz.</div><div class="stepbuttons"><button class="primary" data-do="pulse">NPC-Redaktion ausführen</button></div>';}
if(s.phase==='done'){content+='<div class="score"><span>Round Table '+s.trophies.a.length+' Trophy</span><span>Technocracy '+s.trophies.b.length+' Trophy</span><span>NPC keine Trophäen</span></div><div class="actionnote">Kein reguläres Spielende oder Endscoring: R17/R18 haben dafür noch keine akzeptierte Regel. Hier endet nur ein Rundenumlauf.</div><div class="stepbuttons"><button class="primary" data-do="newRound">Nächsten Umlauf spielen →</button></div>';}
var selHtml='<div class="details"><h3>Karte anklicken · '+s.selected+' / '+esc(prompt)+'</h3><strong>'+esc(sidelabel)+'</strong>'+(selected?'<p>Öffentliche Rolle: '+esc(selected.faction)+'</p><div class="lenses"><button data-lens="claim" class="'+(s.lens==='claim'?'selected':'')+'">Upright · KAYFABE</button><button data-lens="incentive" class="'+(s.lens==='incentive'?'selected':'')+'">Reversed · BIZARRO</button></div><p class="read">'+esc(s.lens==='claim'?selected.claim:selected.incentive)+'</p>':'<p>Außenkarte entfernt. Sie kann durch einen legalen PLAY- oder NPC-Schritt neu besetzt werden.</p>')+'</div>';
var handHtml='<div class="scriptlog"><h3>Hände / Trophäen</h3><div>Round Table · Hand '+s.hands.a.length+' · Trophy: '+esc(s.trophies.a.map(function(c){return c.title;}).join(', ')||'—')+'</div><div>Technocracy · Hand '+s.hands.b.length+' · Trophy: '+esc(s.trophies.b.map(function(c){return c.title;}).join(', ')||'—')+'</div></div>';
var sidebar='<section class="side">'+content+selHtml+handHtml+'<div class="warn">R18-Kartenpositionen = Leseschablone. Nicht implementiert: akzeptiertes Endspiel, ausbalancierte FOCUS-Belohnung, echte 50 finale Kartentexte oder Solo. Änderungen an dieser Demo sind keine KFB-Regelabnahme.</div></section>';
var events='<section class="logbox"><h2>Regelfolge / Ereignisprotokoll</h2><div class="logs">'+s.log.slice().reverse().map(function(e){return '<div class="event"><b>'+esc(e.label)+'</b> · '+esc(e.text)+'</div>';}).join('')+'</div></section>';
document.getElementById('root').innerHTML=top+bar+metric+'<div class="layout">'+cards+sidebar+'</div>'+events;
}
document.getElementById('root').addEventListener('click',function(e){var el=e.target.closest('button');if(!el)return;var sl=el.getAttribute('data-slot'),act=el.getAttribute('data-action'),lens=el.getAttribute('data-lens'),todo=el.getAttribute('data-do');if(sl){s.selected=Number(sl);render();return;}if(lens){s.lens=lens;render();return;}if(act){perform(act);return;}if(todo==='reset'){var sc=s.scenario,va=s.variant;scenario(sc);s.variant=va;render();return;}if(todo==='narrate'){s.storyMode='full';advance();return;}if(todo==='short'){s.storyMode='titles';advance();return;}if(todo==='advance'){advance();return;}if(todo==='pulse'){npcPulse();return;}if(todo==='newRound'){newRound();return;}});
document.getElementById('root').addEventListener('change',function(e){var key=e.target.getAttribute('data-setting');if(key==='scenario'){var prev=s.variant;scenario(e.target.value);s.variant=prev;render();}if(key==='variant'){var sc=s.scenario;scenario(sc);s.variant=e.target.value;render();}if(key==='publishA'||key==='publishB'){var index=Number(e.target.value);if(index>=0)selectPublication(key==='publishA'?'a':'b',index);}});
render();
})();
</script></body></html>
